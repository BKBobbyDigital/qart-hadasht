summary: >
  The decisive engagement of the Second Punic War. After Scipio's invasion of
  Africa forced Hannibal's recall from Italy, the two commanders met in open
  battle in Numidia in autumn 202 BCE. Scipio's reformed maniples opened lanes
  for Hannibal's elephants to pass through harmlessly; the Roman and Numidian
  cavalry under Masinissa drove off the Carthaginian horse and returned to
  strike Hannibal's veteran third line in the rear. Carthage sued for peace on
  Roman terms within months. The battle ended Carthage as a great Mediterranean
  military power, though not — as is often claimed — the city itself, which
  endured for another 56 years until the Third Punic War.
