summary: >
  Hannibal's election to the Carthaginian suffeteship in 196
  BCE, his subsequent program of financial and constitutional
  reform, and the senatorial reaction that produced his flight
  into exile in late 195 BCE. The episode is one of the few
  well-attested moments of post-Zama Carthaginian internal
  politics and reveals a Hannibal who, after Zama, turned his
  political and administrative talents to the reform of his
  own state rather than to military projects against Rome.

  The reforms had two principal components. **Financial reform**:
  Hannibal investigated the Carthaginian state finances and
  found that, properly collected, revenues were sufficient to
  meet the annual installments to Rome without a special tax on
  citizens, the shortfall being explained by waste and
  embezzlement by leading men (Livy 33.46–47). **Constitutional
  reform**: Hannibal moved against the Council of 104, the
  judicial body whose life-tenure had given the senatorial
  aristocracy its principal mechanism for controlling
  successful generals. The council was reformed to be elected
  annually rather than for life, substantially reducing the
  senatorial faction's institutional power.

  The political reaction was severe. Hannibal's aristocratic
  opponents wrote to their friends at Rome that he was
  exchanging messengers and letters with Antiochus III of the
  Seleucid kingdom (Livy 33.45). A Roman embassy arrived at
  Carthage in 195 BCE, ostensibly to settle a dispute with
  Masinissa; Hannibal, judging that he was its real target,
  fled the city at nightfall. Whether the charge was true is
  weighed in the
  [editorial take on the denunciation](/editorialTakes/hannibal-195-denunciation-as-fabrication). His subsequent exile
  and death are treated as a separate event on this site.

  The episode illustrates several features of Carthaginian
  politics that would otherwise be invisible. The
  senatorial-aristocratic resistance to financial accountability;
  the institutional mechanisms through which the senate
  controlled successful military commanders; the willingness of
  Carthaginian senatorial factions to use Roman pressure
  against domestic rivals; the limited room for genuine
  reform in a state operating under the Treaty of 201's
  external constraints.
