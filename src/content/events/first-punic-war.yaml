related_events:
  - event: first-punic-war-outbreak
    relation: opening political crisis (264 BCE)
    notes: >
      The Mamertine appeal and the Roman crossing of the Strait
      of Messina that began the war.
  - event: siege-of-agrigentum
    relation: first major land campaign (262-261 BCE)
    notes: >
      The Roman capture of Carthage's main base on the south coast,
      after which Polybius has Rome resolve to expel Carthage from
      Sicily and build a fleet.
  - event: battle-of-mylae
    relation: first major Roman naval victory (260 BCE)
    notes: >
      The corvus debut; the engagement that established Roman
      naval capability could match Carthage's at fleet scale.
  - event: battle-of-cape-ecnomus
    relation: principal naval engagement (256 BCE)
    notes: >
      The largest naval battle of antiquity, the Roman victory
      that opened the path to the African expedition.
  - event: regulus-african-expedition
    relation: African campaign (256-255 BCE)
    notes: >
      The Roman invasion of North Africa that the Cape Ecnomus
      victory had been designed to enable. Catastrophic
      collapse at the Bagradas River produced by Xanthippus's
      reorganization of the Carthaginian army.
  - event: battle-of-drepana
    relation: major Carthaginian naval victory (249 BCE)
    notes: >
      The Carthaginian victory under Adherbal that effectively
      eliminated Roman naval operations in Sicilian waters for
      the next eight years and produced the conditions for the
      241 BCE private-subscription fleet.
  - event: battle-of-aegates-islands
    relation: war-ending naval engagement (10 March 241 BCE)
    notes: >
      The morning engagement that broke Carthaginian capacity to
      continue the war.
  - event: treaty-of-lutatius
    relation: peace settlement (241 BCE)
    notes: >
      The treaty that ended the war and set the conditions for
      the Mercenary War and the Roman seizure of Sardinia.
summary: >
  The first of the three Punic Wars, fought between Rome and
  Carthage from 264 to 241 BCE, principally over Sicily. The
  longest single conflict either state had yet undertaken: 23
  years of intermittent warfare on land, at sea, and across the
  central Mediterranean, ending in Roman victory and a settlement
  that transferred Sicily and (within three years) Sardinia to
  Roman control.

  It is usually described as a contest between the two great powers
  of the western Mediterranean, and by its end it was one. It did not
  begin that way. For its first year the war had three sides, with
  Hiero II of Syracuse fighting alongside Carthage until he went over
  to Rome in 263, and the Carthage that entered it was a rich naval
  power with a modest land army in Sicily, used to managing the island
  through allies and garrisons rather than defeating a field army of
  Roman size. The war made Carthage Rome's match as much as it revealed
  it.

  The war's principal phases (the opening crisis at
  Messana in 264 BCE, the Roman naval revolution of the 260s and
  250s BCE culminating in the victory at Cape Ecnomus, Regulus's
  African expedition and its catastrophic 255 BCE collapse, the
  long Carthaginian-Roman attritional warfare in western Sicily
  through the 240s, and the closing engagement at the Aegates
  Islands in 241) are treated in their own dedicated event
  entries linked from this parent. The war is the structural
  origin of all subsequent Roman-Carthaginian conflict: the
  conditions it created (the Lutatius treaty and the 238 BCE
  Sardinian seizure) produced the Barcid response that became
  the Second Punic War a generation later.

