summary: >
  The first of the three Punic Wars, fought between Rome and
  Carthage from 264 to 241 BCE, principally over Sicily. The
  longest single conflict either state had yet undertaken: 23
  years of intermittent warfare on land, at sea, and across the
  central Mediterranean, ending in Roman victory and a settlement
  that transferred Sicily and (within three years) Sardinia to
  Roman control. The war's principal phases (the opening crisis at
  Messana in 264 BCE, the Roman naval revolution of the 260s and
  250s BCE culminating in the victory at Cape Ecnomus, Regulus's
  African expedition and its catastrophic 255 BCE collapse, the
  long Carthaginian-Roman attritional warfare in western Sicily
  through the 240s, and the closing engagement at the Aegates
  Islands in 241) are treated in their own dedicated event
  entries linked from this parent. The war is the structural
  origin of all subsequent Roman-Carthaginian conflict: the
  conditions it created (the Lutatius treaty and the 238 BCE
  Sardinian seizure) produced the Barcid response that became
  the Second Punic War a generation later.
