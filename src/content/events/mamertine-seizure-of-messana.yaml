summary: >
  The act that planted the Mamertines as a polity in their
  own right and set the conditions for the political crisis
  twenty-five years later. The Mamertines — a band of
  Campanian mercenaries whose name derives from Mamers, the
  Oscan name for Mars — had been recruited into Agathocles's
  Syracusan army in the late 4th century. On Agathocles's
  death in 289 BCE the band, dismissed from Syracusan
  service, made its way north along the Sicilian coast and
  was admitted to the Greek city of Messana on the Strait
  as guests or temporary garrison.

  The "seizure" itself was murderous: the Mamertines killed
  the adult male population of their host city, took the
  women and remaining children as their own, and reorganized
  the polity under their command. The pattern — a foreign
  mercenary band converting from guest to occupier through a
  single act of organized violence — would have been
  recognizable to Greek audiences from earlier instances
  (most notoriously the Phocian seizure of Delphi); the
  Mamertine version was distinctive in producing a stable
  polity that lasted for the next twenty-five years.

  The seized city was used as a base for Mamertine raiding
  across northeastern Sicily, with substantial economic
  damage to neighboring Greek and Sicel communities. The
  raiding reputation, and the structural threat the
  Mamertine state posed to organized Sicilian polities,
  produced the diplomatic and military hostility — first
  from Hiero of Syracuse, then from a wider coalition —
  that culminated in the 265 crisis.
