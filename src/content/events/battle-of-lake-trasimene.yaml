summary: >
  A Roman consular army destroyed on the march, before it could
  form a line of battle.

  ## The approach

  Hannibal left winter quarters once the passes cleared and
  crossed the Apennines by the route least expected, then took
  his army through flooded marsh country, four days and three
  nights on sodden ground. Polybius gives the order of march
  and the reason for it: Africans, Iberians and the best of the
  troops in front with the baggage among them, the Celts behind
  them, and the cavalry in the rear under Mago, so that the
  Celts should not turn back (3.79.1-4). He came out near
  Faesulae with the country between him and Flaminius at
  Arretium, and burned it as he passed, with the object of
  drawing the consul after him (3.82).

  ## The ambush

  Moving by night, Hannibal set his Spanish and African troops
  on the hill facing the entrance of the defile, brought the
  Balearic slingers and pikemen round by a detour into an
  extended line under the hills on one side, and laid the
  cavalry and Celts in a continuous line under the hills on the
  other (3.83.1-4). Flaminius sent no scouts ahead (Livy
  22.4.4). The attack came out of mist so dense, Livy says,
  that ears were more use than eyes, and the Romans felt
  themselves surrounded before they could see that they were;
  the fighting broke out at the front and on the flanks before
  a line could be drawn up, and lasted about three hours.
  Hannibal's strength that day is not recorded.

  Fifteen thousand Romans were killed, Flaminius among them.
  About six thousand of the vanguard cut their way out through
  the enemy in front and escaped the pass; the next day they
  surrendered to Maharbal on his pledge that they should go
  free with one garment each, and Hannibal put them all in
  chains. Livy's comment on that is the phrase the treachery
  tradition is built from, that the faith was kept with Punic
  scruple (22.6). Carthaginian losses were fifteen hundred in
  Polybius and two and a half thousand in Livy, falling chiefly
  on the Celts.

  ## After

  Hannibal released the Italian allies among the prisoners
  without ransom, as he had after the Trebia, repeating that he
  had come to fight the Romans and not the Italians; the Roman
  captives were so many that he distributed them among his
  troops to be guarded. He buried his own dead with honors to
  the highest ranking, and searched for Flaminius's body
  without finding it. The battlefield supplied something more
  lasting: Polybius says he re-armed his Africans in the Roman
  fashion from the captured equipment (3.87), and at Cannae the
  next year Livy says you would have taken them for a Roman
  battle line, armed with weapons taken at the Trebia and, for
  the greater part, here (22.46.4).

  Days later Maharbal destroyed the four thousand cavalry that
  the other consul, Servilius, had sent ahead under Gaius
  Centenius, killing about half in the first attack and taking
  the rest the following day; Livy puts it in Umbria. Hannibal
  then gave up the idea of approaching Rome for the present,
  crossed to the Adriatic through Picenum, and on reaching the
  coast sent messengers to Carthage, the first time he had been
  in touch with the sea since the invasion began. Polybius says
  the news was received with great rejoicing and that Carthage
  moved to support the war in both Italy and Iberia (3.87).

  At Rome the senate appointed Quintus Fabius Maximus dictator,
  and the strategy of refusing battle that carries his name was
  the answer Trasimene forced.
