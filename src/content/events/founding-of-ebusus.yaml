summary: >
  The Carthaginian colonial foundation on the western
  Balearic island of Ebusus (modern Ibiza), conventionally
  dated to 654/3 BCE on Diodorus's chronology — making it the
  earliest securely attested Carthaginian colonial foundation
  in the western Mediterranean and the city's first major
  foothold beyond the immediate African zone. The site
  combined an excellent natural harbor, defensible coastal
  position, and substantial salt-flat resources; the
  strategic logic was control of the western Mediterranean
  shipping lanes between Africa, Iberia, and Gaul.

  Ebusus is also significant for what its archaeological
  record preserves of Carthaginian material culture more
  broadly. The Punic necropolis at Puig des Molins has
  yielded thousands of burials, terracotta figurines, and
  inscribed amulets; surviving Punic-language inscriptions
  from the island are among the most substantial corpora of
  Carthaginian-language material outside Carthage itself.
  For a civilization most of whose record was destroyed in
  146 BCE, Ebusus is one of the principal sites where
  Carthaginian artifacts survive in coherent assemblages.

  The foundation is also chronologically significant: at
  654 BCE, Carthage was still a relatively young city
  (founded conventionally 814 BCE), and the establishment of
  a major overseas colony at this date is the earliest
  surviving evidence of Carthaginian capacity for organized
  long-distance colonization. The Ebusus foundation prefigures
  the broader 6th-century western Mediterranean expansion
  that would culminate in the Battle of Alalia (~535 BCE)
  and the first treaty with Rome (509 BCE).
