summary: >
  Hasdrubal the Fair's foundation of a new Carthaginian
  capital on the southeastern Iberian coast at modern
  Cartagena, c. 228–227 BCE. The site combined three
  strategic advantages that no existing Carthaginian Iberian
  base offered: an excellent natural harbor (a near-circular
  protected bay with a defensible peninsular approach); a
  fortified high acropolis usable as both palace and citadel;
  and immediate proximity to the southeastern silver mines
  whose revenue would fund the Barcid project for the next
  two decades. The new city's name — *Qart-Hadasht*, the same
  Punic phrase as the metropolitan Carthage — explicitly
  reframed the Iberian project as the establishment of a
  second Carthage in the western Mediterranean. The Roman
  reading "Carthago Nova" (New Carthage) is the version
  preserved in Polybius and Livy. The city served as the
  principal Carthaginian Iberian capital and naval base
  until its capture by Scipio Africanus in 209 BCE.
