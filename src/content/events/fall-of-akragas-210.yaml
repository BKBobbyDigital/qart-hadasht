summary: >
  The end of the Carthaginian war in Sicily, lost not to a siege but
  to a quarrel inside the Carthaginian command.

  After Syracuse fell, Agrigentum was what remained, held by a strong
  garrison and serving as the base from which the war was carried
  across the island. Livy says the Carthaginians there had a commander
  in Hanno but had placed all their hope in
  [Muttines](/people/mottones) and the Numidians, who ranged over the
  whole island taking plunder from Rome's allies and could neither be
  shut out of Agrigentum nor prevented from breaking out of it
  wherever they liked. His reputation had begun to stand in the way of
  the commander's own, until it turned to open resentment and Hanno
  took no pleasure even in successes because of who had won them
  (26.40).

  Hanno's answer was to transfer the command to his own son, expecting
  that taking the office would take Muttines's authority among the
  Numidians with it. It did the reverse. Muttines sent secretly to the
  consul Marcus Valerius Laevinus, terms were agreed, and the
  Numidians took the gate toward the sea and let the Romans in. Hanno
  heard the uproar in the forum and took it for another Numidian riot,
  which had happened before; he came out to quell it, saw a crowd too
  large for Numidians and heard a Roman shout he knew, and fled before
  he was within range. He escaped by a rear gate with Epicydes, found
  a small boat, and crossed to Africa, leaving Sicily to the enemy
  after so many years of fighting over it.

  Laevinus had the leading men of Agrigentum flogged and beheaded,
  sold the rest of the population and the plunder, and sent the money
  to Rome. Livy says the news ran across the island and everything
  went over at once: twenty towns betrayed, six taken by force, about
  forty surrendering of their own accord. He then set the Sicilians to
  farming again, so that the island would feed its own people and
  relieve the grain supply of Rome and Italy, and reported to the
  senate that there was no Carthaginian left in Sicily and no Sicilian
  who was not (27.5).

  ## How to read it

  The site's older account of this page made Muttines a Numidian and
  the episode an early instance of the Numidian drift toward Rome that
  ends with Masinissa. He was a Libyphoenician of Hippo whom Hannibal
  had sent to Sicily, and the Numidians were the troops he had been
  given. What the episode actually shows is something harder for
  Carthage: the officer who was holding the island together was broken
  by his own commander for doing it too well, in language that called
  him a degenerate African, and he took the island with him when he
  went. It belongs with the side-switching material not as another
  case of tribal realignment but as a case of a command structure
  failing from the inside, which is also how
  [Muttines's own page](/people/mottones) treats it.
