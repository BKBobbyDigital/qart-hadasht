summary: >
  The legendary boundary-settlement episode that defined
  the eastern frontier of Carthaginian Africa with Greek
  Cyrenaica — and one of the most-cited surviving
  Carthaginian foundation-and-frontier legends. The
  episode is preserved at length in Sallust (*Bellum
  Iugurthinum* 79) and is one of the few surviving
  narratives from the Carthaginian self-tradition that
  reaches the surviving Latin record.

  The story: Carthage and Cyrene, in long-running dispute
  over the boundary of their respective African
  territories, agreed to settle the matter by competitive
  walking. From each city, on the same day, two runners
  were to set out toward the disputed zone; wherever they
  met, the boundary would be set. The Carthaginian
  Philaeni brothers, two unnamed siblings whose family
  name became the legend's identifier, covered far more
  ground than the Cyrenaican runners and met them well
  inside what would otherwise have been Cyrenaican
  territory. The Cyrenaicans, suspecting the Philaeni had
  set out early, refused the arrangement unless the
  brothers accepted an alternative: be buried alive at
  the meeting point as the cost of the boundary they had
  established. The Philaeni accepted; the Cyrenaicans
  buried them; the boundary was set at the burial site.

  The site of the burial, the "Altars of the Philaeni"
  (*Arae Philaenorum*), became the formally recognized
  Carthaginian-Cyrenaican boundary and was marked by
  altars or stelae visible into the Roman period. Sallust
  treats the location as distinguishing Africa Vetus
  (the Roman province carved from Carthaginian Africa)
  from the broader Cyrenaican zone.

  The historicity of the precise legend is contested.
  Three readings:

  1. A real boundary settlement preserved in
     legendary form. The boundary itself is firmly
     attested, the Roman provincial administration
     used the location, and some real diplomatic
     resolution must underlie the legend. The Philaeni
     family episode is the legendary form in which the
     Carthaginian tradition preserved the underlying
     diplomatic act.
  2. Pure foundation legend. The episode is
     entirely literary, drawing on standard ancient
     Mediterranean foundation-and-boundary topoi
     (compare the Spartan-Messenian boundary
     tradition). The boundary itself is real; the
     Philaeni narrative is later mythologization.
  3. Sallustian elaboration. The legend reached
     Sallust through the Carthaginian self-tradition
     but was substantially elaborated in his hands;
     the detail and dramatic structure reflect his
     historiographical method as much as preserved
     Carthaginian narrative.

  Whatever the layered historicity, the Philaeni episode
  is one of the very few surviving Carthaginian
  legendary narratives, alongside the Dido foundation
  story, that preserves anything of the Carthaginian
  self-conception of civic virtue: the willingness of
  individual Carthaginians to die for the city's
  territorial integrity, framed as the constitutive
  political-religious commitment.
