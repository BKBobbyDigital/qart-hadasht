summary: >
  The engagement that ended the first phase of the Barcid Iberian
  project and passed the command to Hasdrubal the Fair. Four ancient
  accounts survive and they agree on almost nothing beyond the fact
  that Hamilcar was killed campaigning in Iberia in the ninth year of
  his command. Pages elsewhere, including this one until October 2026,
  tend to fuse them into a single scene; they are better kept apart.

  ## What each source says

  [Polybius](/sources/polybius-histories) gives the bare fact. Hamilcar
  spent about nine years in Iberia, brought many peoples under Carthage
  by force or by diplomacy, and died bravely in battle against one of
  the most warlike and powerful tribes, having exposed himself to danger
  (2.1.7–2.1.8). He names no place, no people and no stratagem.

  [Diodorus](/sources/diodorus-library) alone sets it at Helike and
  alone has the drowning, and in his account Hamilcar is the besieger,
  not a relieving force. Hamilcar was encamped before Helike and had it
  under siege, having sent most of the army and the elephants into winter
  quarters at Akra Leuke. The king of the Orissi came to the city's
  relief and, by a feigned offer of friendship and alliance, routed him.
  Hamilcar saved his sons and friends by taking a different road and
  drawing the pursuit onto himself; overtaken, he plunged on horseback
  into a large river and perished in the flood under his horse, while
  Hannibal and Hasdrubal got away to Akra Leuke (25.10.3–25.10.4).

  [Nepos](/sources/nepos-hamilcar) says only that he was killed fighting
  in battle against the **Vettones** in the ninth year after coming into
  Spain (*Hamilcar* 4.2). He is the one source for that people, and the
  Vettones of the upper Tagus are a long way from where Helike is usually
  placed.

  [Appian](/sources/appian-iberica) and Cassius Dio carry the stratagem
  the modern retellings like best, and neither attaches it to Helike or
  to a drowning. Spanish kings and chieftains combined against Hamilcar
  and drove wagons loaded with wood and pitch ahead of their line, yoked
  to oxen; the Carthaginians laughed at the approach until the wagons
  were fired and the burning teams were driven into them, and in the
  disorder Hamilcar was killed along with many of his men
  (*Iberica* 5; Dio's surviving fragments give the same episode).

  ## What the site holds

  One of the four is at least internally consistent. Diodorus follows
  the Orissi through: having named their king as the man who routed
  Hamilcar, he has Hasdrubal march out with over a hundred elephants,
  attack that king first, kill those responsible for the rout, and take
  the Orissi's twelve cities (25.12). A source that tracks the same
  people across two fragments and makes the successor's first campaign
  a reprisal against them is doing more than repeating a name. That
  does not make Diodorus right and Nepos wrong, but it does mean the
  Vettones have one sentence behind them and the Orissi have a
  sequence.

  That Hamilcar died on campaign in 229/228 and that the command passed
  to his son-in-law is firmly attested. The siege of Helike, the river
  and the self-sacrifice for his sons are Diodorus and nobody else; the
  burning wagons are Appian and Dio and nobody else; the Vettones are
  Nepos and nobody else. Whether any two of these describe the same
  action cannot be recovered, and the drowning and the fire-wagons are
  not obviously compatible. The site reports them as separate traditions
  and does not reconcile them, which is
  [charter principle 8](/charter). Hannibal was about nineteen; his
  presence rests on Diodorus's account alone.
