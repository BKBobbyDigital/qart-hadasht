summary: >
  The engagement that ended the first phase of the Barcid
  Iberian project and triggered the command succession to
  Hasdrubal the Fair. Hamilcar Barca, conducting a winter
  relief operation against the Vettonian or Oretanian siege of
  the Iberian town of Helike, walked into a stratagem
  Polybius and the later tradition both describe as
  characteristically Iberian: cattle-driven fire-carts, oxen yoked to flaming wagons, driven into the Carthaginian
  formation to break order, followed by Vettonian assault.
  Hamilcar's withdrawal across an unnamed river ended in his
  drowning, possibly while drawing pursuit away from his sons
  Hannibal (then 19) and Hasdrubal (younger). Polybius
  treats the death as the definitive close of Hamilcar's
  Iberian command. Command in Iberia passed to Hasdrubal the
  Fair (Hamilcar's son-in-law and senior lieutenant);
  Hannibal would not assume command until Hasdrubal's
  assassination seven years later. The exact location of
  Helike is contested in modern scholarship.
