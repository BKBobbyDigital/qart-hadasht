related_events:
  - event: siege-of-saguntum
    relation: casus belli (219 BCE)
    notes: >
      Hannibal's siege and capture of the Roman-allied Iberian city
      that produced the Roman declaration of war.
  - event: roman-embassy-to-hannibal-219
    relation: diplomatic prelude to (the failed first Roman embassy)
  - event: roman-declaration-of-war-218
    relation: opening event of (the formal declaration in spring 218 BCE)
  - event: crossing-of-the-alps
    relation: opening strategic move (218 BCE)
    notes: >
      Hannibal's march from Iberia to northern Italy across the
      Alps, the operation that opened the Italian campaign.
  - event: battle-of-ticinus
    relation: first Italian engagement (November 218 BCE)
    notes: >
      Cavalry skirmish on the Ticino river days after Hannibal's
      descent from the Alps. The elder Scipio wounded; future
      Africanus saved his father in tradition.
  - event: battle-of-trebia
    relation: first major Italian victory (218 BCE)
    notes: >
      Hannibal's first major engagement of a Roman consular army,
      establishing the operational pattern of his Italian campaigns.
  - event: battle-of-lake-trasimene
    relation: second major Italian victory (217 BCE)
    notes: >
      The largest ambush in the history of warfare; Flaminius killed,
      Roman political response was the Fabian dictatorship.
  - event: battle-of-cannae
    relation: principal Italian engagement (216 BCE)
    notes: >
      Hannibal's tactical masterpiece in Italy and the moment Rome's
      structural resilience was demonstrated. The battle that should
      have ended the war on Carthaginian terms; the Roman refusal
      to negotiate that followed it set the war's strategic limit.
  - event: capua-defection
    relation: principal Italian-allied defection (216 BCE)
    notes: >
      The second-largest city of Italy joined Hannibal after
      Cannae; most of the Italian south followed within months.
  - event: treaty-with-philip-v
    relation: external alliance (215 BCE)
    notes: >
      The treaty that opened the First Macedonian War as a
      second front against Roman power.
  - event: siege-of-syracuse-marcellus
    relation: Sicilian theater (213-211 BCE)
    notes: >
      The Roman siege and conquest of Syracuse that ended
      Carthaginian-Sicilian alliance. Death of Archimedes.
  - event: battle-of-ilipa
    relation: Iberian decision (206 BCE)
    notes: >
      Scipio's victory in southern Iberia that ended
      Carthaginian power in the peninsula and produced the
      strategic conditions for the African crossing.
  - event: battle-of-metaurus
    relation: strategic decision (207 BCE)
    notes: >
      Hasdrubal Barca's relief expedition destroyed in Umbria
      before reaching Hannibal in southern Italy. Modern scholarship
      generally treats this as the war's structural turning point.
  - event: battle-of-great-plains
    relation: African campaign decision (203 BCE)
    notes: >
      Scipio's African victory and capture of Syphax, forcing the
      Carthaginian recall of Hannibal from Italy and producing
      the strategic conditions for Zama.
  - event: battle-of-zama
    relation: war-ending engagement (202 BCE)
    notes: >
      Scipio's victory in Africa that produced the Carthaginian
      capitulation. The closing act of a war that had been
      strategically decided several years earlier.
  - event: treaty-of-201-bce
    relation: peace settlement (201 BCE)
    notes: >
      The treaty terms that ended the war and (through their
      allied-protection clause and Masinissa's enabled
      encroachments) set the structural conditions for the
      Third Punic War half a century later.
summary: >
  The second of the three Punic Wars, fought from 218 to 201 BCE
  and the longest sustained Carthaginian-Roman conflict by any
  measure of intensity. The war opened with Hannibal Barca's
  crossing of the Alps and his subsequent campaigns in Italy
  (Trebia 218, Trasimene 217, Cannae 216), continued through the
  long strategic strangulation of Hannibal's army in southern
  Italy after Rome's refusal to negotiate following Cannae, the
  Roman recovery and conquest of Iberia under Scipio Africanus
  (210-206), and the Roman invasion of Africa that culminated at
  Zama in 202 BCE. The war's principal phases (the crossing and
  the early Italian victories, the Cannae-and-defections crisis,
  the long Italian stalemate, the Iberian campaigns, the African
  invasion, Zama, and the peace) are treated through the focal
  events linked from this parent.

  The war was the most consequential single conflict of the
  pre-imperial Roman era and the war that reshaped the
  Mediterranean's political geography. Roman strategic culture,
  military institutions, and political imagination were
  permanently altered by the experience of absorbing Cannae and
  recovering from it; Carthaginian military and territorial power
  was reduced to a regional African role from which it would not
  recover; the post-war Treaty of 201 set the structural conditions
  for the destruction of Carthage in 146 BCE. The Polybian
  framework for understanding Rome's rise to Mediterranean
  dominance is largely a framework for understanding this war.
