summary: >
  The twelve-year exile and death of Hannibal Barca, from his flight
  from Carthage in the summer of 195 BCE to his suicide at Libyssa in
  Bithynia in the early 180s. The narrative rests on Livy, Cornelius
  Nepos, Plutarch and Justin, who agree on the outline and differ on
  many details. The full account, with the sources set side by side,
  is in the narrative
  [Hannibal after Zama](/narratives/hannibal-after-zama).

  With Antiochus III (195–189 BCE). Hannibal sailed to Tyre and then
  to Antioch, found that the king had left for Asia, and joined him at
  Ephesus (Livy 33.49). He urged a war fought in Italy, with himself
  leading a force to Africa to bring Carthage back in (34.60), and sent
  an agent, Aristo of Tyre, to his supporters at Carthage; the mission
  was exposed and reported to Rome (34.61–62). His one command was a
  fleet brought from Syria, beaten by the Rhodians off Side in
  Pamphylia in 190; Livy has his wing flee, Nepos has it hold its own
  (Livy 37.23–24; Nepos *Hannibal* 8.4). After Antiochus's defeat at
  Magnesia, Rome's terms demanded his surrender before all else (Livy
  37.45).

  Crete and Armenia (189 BCE onward). At Gortyn he deposited jars of
  lead topped with gold and silver in the temple of Diana, keeping his
  real fortune in bronze statues left in the courtyard of his house
  (Nepos *Hannibal* 9; Justin 32.4). Strabo and Plutarch say he laid
  out Artaxata for Artaxias of Armenia (Strabo 11.14.6; Plutarch
  *Lucullus* 31).

  Bithynia. At the court of Prusias I, at war with Eumenes of Pergamum,
  he is said to have had jars of live snakes thrown onto the Pergamene
  ships (Nepos *Hannibal* 10–11; Justin 32.4). When Flamininus came to
  Bithynia and Prusias moved to give him up, he took poison in his
  surrounded house (Livy 39.51; Nepos *Hannibal* 12; Plutarch
  *Flamininus* 20). The closing speech is Livy's composition, which
  Plutarch quotes.

  The death was paired in antiquity with Scipio Africanus's and
  Philopoemen's as falling in the same year, a tradition Livy rejected
  for Scipio (39.52); see the
  [claim on the paired deaths](/claims/hannibal-scipio-same-year-deaths).
