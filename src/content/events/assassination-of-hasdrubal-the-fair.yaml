summary: >
  Hasdrubal the Fair was assassinated in 221 BCE at or near
  Carthago Nova by a Celtiberian (or, in some traditions,
  Iberian) attendant in revenge for an execution Hasdrubal
  had earlier ordered. The attack was personal rather than
  political — there is no surviving evidence of broader
  conspiracy — and the assassin was reportedly killed at the
  scene. The political consequence was the irregular
  succession to Hannibal Barca: command in Iberia passed by
  acclamation of the Iberian field army (rather than by a
  Carthaginian senatorial appointment confirmed in the
  metropolitan capital), with the senate ratifying the army
  decision after the fact. The succession is one of the more
  striking examples in the surviving record of Barcid army
  politics — the Iberian field army treating its
  succession as its own to determine — and a structural
  preview of the autonomy with which Hannibal would conduct
  the Iberian and Italian campaigns over the next two
  decades. Hannibal was 26 at his accession to command.
