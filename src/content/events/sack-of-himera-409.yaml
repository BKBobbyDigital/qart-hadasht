summary: >
  The second Carthaginian sack of 409 BCE, and the one Diodorus presents
  as revenge. Himera was the city where Hannibal son of Gisco's
  grandfather Hamilcar had died in 480 and which had caused his father's
  exile (Diodorus 13.59). Hannibal camped on the hills with 40,000 men,
  invested the city with the rest and 20,000 Sicel and Sican allies, and
  breached the walls by mining. The Himerans, with some 4,000 Syracusans
  and allies under Diocles, sallied out and routed part of the besieging
  army, killing more than 6,000 by Timaeus's count or more than 20,000 by
  Ephorus's, before Hannibal's reserve caught them in the pursuit (13.59–
  60). A rumor that Hannibal meant to sail on Syracuse led Diocles to march his
  troops home, taking many Himerans with him, while triremes carried half
  the population to Messana; the rest held the walls to wait for the ships,
  and the city fell as they came back into sight (13.61–62). Hannibal razed it, gave the
  women and children to his army, and took the 3,000 men captured to the
  spot where Hamilcar had died, where he tortured and killed them (13.62).
  Carthage later founded Therma nearby, in 407, with its own citizens and
  Libyans (13.79).
