summary: >
  The second great Carthaginian sack of 409 BCE and one of
  the most explicitly motivated revenge operations in the
  surviving Greek tradition. Himera, the Greek city on the
  northern Sicilian coast where Carthage had suffered its
  great defeat in 480 BCE under Hannibal son of Gisco's
  grandfather Hamilcar Magonid, was attacked second in
  the 409 campaign, after Selinus.

  A Syracusan relief force under Diocles arrived but
  withdrew without engaging, citing the threat of an
  Athenian return to Sicily (this was the year after the
  Athenian disaster at Syracuse, 413 BCE); the withdrawal
  left Himera defended only by its citizen levy. The city
  fell within days. The post-capture treatment was
  ritualized as revenge: Diodorus reports that 3,000
  Himeran prisoners were executed at the supposed site of
  Hamilcar's 480 BCE death, in a deliberate inversion of
  the earlier engagement. The city itself was systematically
  destroyed (walls demolished, structures burned) to a
  degree that prevented later resettlement. Himera as a
  polity ceased to exist; the surviving population that
  reached neighboring cities was the seed of what would
  become Thermae Himerenses some years later.

  The two 409 sacks together, Selinus and Himera in a
  single campaign season, are the moment when 5th-century
  Greek Sicily learned that Carthaginian power had not
  decayed since 480 BCE; it had been waiting.
