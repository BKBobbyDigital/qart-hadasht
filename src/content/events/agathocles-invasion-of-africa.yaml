summary: >
  The invasion of Carthage's African territory by Agathocles of Syracuse,
  310–307 BCE, the first by a foreign army. Besieged in Syracuse after
  his defeat at the Himeras, Agathocles slipped out with sixty ships and
  about 13,500 men when grain ships drew the blockade away, landed near
  Cape Bon and burned his ships as a vow to Demeter and Kore (Diodorus
  20.5–7). He defeated the first Carthaginian army under Hanno and
  Bomilcar, won over Libyan towns and a Libyan king, absorbed the army of
  Ophellas of Cyrene after killing him, and saw Bomilcar attempt a coup
  in Carthage in 308. In Sicily, Hamilcar son of Gisco, who had not been
  recalled, was captured and killed attacking Syracuse in 309. In 307
  Carthage sent out three armies, Agathocles' Libyan allies deserted,
  and after a defeat and a night of panic he escaped to Sicily; his
  army killed his sons and made terms (Diodorus 20.59–69). The peace of
  306 returned Carthage's Sicilian cities and paid Agathocles to end the
  war (20.79). Livy has Scipio cite the precedent when arguing for his
  own invasion of Africa (28.43). The full account is in
  [Agathocles in Africa](/narratives/agathocles-invasion-of-africa).
