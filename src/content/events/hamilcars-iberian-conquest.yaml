summary: >
  Hamilcar Barca's nine-year campaign of Iberian conquest from
  237 to 228 BCE, the project that transformed the Carthaginian
  position in the western Mediterranean from the post-Punic-War
  contraction of the 230s BCE into the resource base that would
  fund the Second Punic War a generation later. Hamilcar's
  command followed his suppression of the Mercenary War and
  capitalized on the political authority that suppression had
  produced. The senatorial coalition under Hanno the Great
  opposed the project but could not prevent its authorization;
  Hamilcar departed Carthage with his army and his nine-year-old
  son Hannibal in 237 BCE, crossed to Iberia at Gades (modern
  Cádiz), and began the systematic conquest of the southern
  Iberian peninsula.

  The campaign's military phase produced the Carthaginian
  conquest of substantial portions of southern Iberia, with
  particular success against the Iberian tribes of the
  southwestern peninsula and the Tartessian-Phoenician coastal
  zone. The economic phase was at least as significant: the
  Carthaginian-controlled silver mines of southern Iberia (the
  Sierra Morena range and the area around modern Cartagena)
  produced substantial revenue that funded both the continued
  campaign and Carthaginian state finances more broadly. The
  revenue restored the Carthaginian fiscal position after the
  losses of the First Punic War and the seizure of Sardinia,
  and underwrote the army that fought the Second Punic War.

  Hamilcar's death in 228 BCE during a withdrawal from a
  Vettonian ambush ended the campaign's first phase. Command
  passed to his son-in-law Hasdrubal the Fair (who would
  consolidate the conquest, found Carthago Nova as the new
  Carthaginian Iberian capital, and negotiate the Ebro Treaty
  with Rome before his assassination in 221 BCE), and then to
  Hannibal. The ten-year conquest under Hamilcar is the
  structural foundation of everything that followed in the
  Barcid Iberian project, and indirectly the foundation of the
  Second Punic War.
