summary: >
  The foundation of Carthage by Phoenician colonists from Tyre,
  conventionally dated 814 BCE in the surviving literary
  tradition. The conventional ceramic-based archaeology long
  placed the earliest recoverable material culture somewhat
  later, in the late 8th century BCE; radiocarbon dates from the
  earliest levels at Bir Massouda (published 2005) reach the
  second half of the 9th century, bringing the scientific dating
  within range of the literary tradition for the first time. The
  dating question is treated in full as an
  [open question](/openQuestions/founding-when-actually). The foundation is
  associated in the literary tradition with Dido (Elissa), a
  Phoenician princess whose flight from her brother Pygmalion is
  preserved most fully in Justin's epitome of Pompeius Trogus
  (Book 18) and elaborated romantically by Virgil in the Aeneid.
  The tradition includes the famous *byrsa* stratagem in which
  Dido obtained land enough for a citadel by cutting an ox-hide
  into thin strips, an etymology that is itself part of the
  legend (the Greek *byrsa*, "ox-hide," is more likely a folk
  etymology for the Punic *bṣrh*, "fortified place," which gave
  the citadel hill of Carthage its name in Punic).

  The historicity of the foundation tradition is genuinely
  contested at three levels. The chronology (814 BCE vs. the
  late 8th century BCE) is debated between the literary
  tradition, the ceramic-based archaeology, and the more recent
  radiocarbon evidence; Krahmalkov's 1981 reading of the
  Douïmès Pendant inscription has been cited as supporting the
  earlier date but is contested. The figure of Dido is preserved
  exclusively in Greek and Latin authors writing centuries after
  the events; her historicity cannot be established from
  contemporary Phoenician sources. The narrative details (the
  ox-hide stratagem, the romantic episode with Iarbas in Justin
  or Aeneas in Virgil) are unambiguously legendary in form even
  where the underlying foundation event is real. The site treats
  the founding as a *legendary* event in the sense that the
  historical core (Tyrian colonization of the African coast in
  the late 9th or 8th century BCE) is firmly attested but the
  specific narrative framing is irrecoverable.
