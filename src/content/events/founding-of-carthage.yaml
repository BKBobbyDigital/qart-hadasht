  notes: >
    The traditional date 814 BCE comes from Timaeus of Tauromenium
    (early 3rd century BCE), preserved through Justin and
    Velleius Paterculus. The conventional ceramic-based
    archaeology placed the earliest occupation up to a century
    later; radiocarbon dates from Bir Massouda (2005) reach the
    second half of the 9th century, within range of the
    tradition. Treated here as legendary precisely because it is
    the focal date of a tradition rather than an independently
    verified event.
