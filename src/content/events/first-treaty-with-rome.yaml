slug: first-treaty-with-rome
name: First Treaty with Rome
type: treaty
date_start:
  value: -509
  precision: year
  notes: >
    Polybius dates the treaty to "twenty-eight years before Xerxes'
    crossing into Greece" (3.22), placing it at 508/509 BCE in the
    first year of the Roman Republic. The dating depends on
    Polybius's identification of the consuls Brutus and Horatius
    and is the conventional date in modern scholarship. A minority
    position, going back to Mommsen, argues that Polybius's "first"
    treaty is actually a doublet of the 348 BCE treaty.
