summary: >
  The Carthaginian state's adoption of coinage as the
  standard mechanism of payment, particularly for
  mercenary wages, was one of the most consequential
  institutional shifts in the late-5th-century BCE
  Carthaginian record, despite (or because of) its
  unspectacular character relative to the military
  events of the same period. Carthage was a comparatively
  late adopter of coinage among major Mediterranean
  states: Greek polities had been minting coin for nearly
  two centuries, and Phoenician homeland cities (Tyre,
  Sidon) for several decades, before Carthage's first
  emissions. The reason for the late adoption is itself
  historically interesting and contested in modern
  scholarship.

  The earliest Carthaginian coins are silver tetradrachms
  produced in Sicilian mints (probably Motya, possibly
  Lilybaeum) for payment of the mercenary armies operating
  in the second Sicilian war (410-404 BCE) — that is, the
  Hannibalic invasion of Selinus, Himera, Akragas, and
  Gela. The early issues bear Greek-style designs (a horse,
  a palm tree, a Tanit head) with Punic-language legends
  identifying the issuing authority as Carthage rather
  than the Sicilian-Greek city whose minting traditions
  the coins copy stylistically.

  The structural significance of the coinage adoption is
  three-fold:

  1. Payment of mercenary armies. The coinage allowed
     standardized payment of mercenary contingents from
     across the Mediterranean (Iberian, Gallic, Greek,
     Italian, Numidian) on a common monetary basis; the
     barter and accounting-credit systems that had
     preceded coinage were inadequate at the scale of
     Carthaginian military operations from the 4th
     century forward.
  2. Economic-imperial integration. Carthaginian
     coinage circulated widely in the western
     Mediterranean economy (at Sardinia, Sicily,
     Iberia, North Africa) and constituted the
     practical economic instrument of Carthaginian
     commercial dominance in the period before Roman
     coinage standardization.
  3. Political-cultural ambiguity. The early
     Carthaginian coins are stylistically Greek and
     legibly Punic — a hybrid that reflects the broader
     Carthaginian-Greek cultural negotiation of the
     period. The coinage is one of the more visible
     surviving instances of Carthaginian
     accommodation to Mediterranean Greek institutional
     forms while preserving a distinctly Punic political
     identity.

  Carthaginian coinage continued and evolved through the
  Punic period, with shifts in design (the Hannibal-
  period elephant motif, the late-period Tanit-with-
  crescent), in metallurgy (gradual reduction in silver
  content as fiscal pressure increased), and in minting
  location. The corpus is one of the principal surviving
  Carthaginian artifact classes and a major source for
  Punic political-economic history.
