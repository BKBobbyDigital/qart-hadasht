    Conventionally placed in the late 5th century BCE on
    numismatic grounds — the earliest Carthaginian coins
    are dated by stylistic and metallurgical analysis to
    c. 410-400 BCE. Some authorities push the date
    slightly later (c. 400-380); a few earlier (430s).
    The exact decade is contested.
