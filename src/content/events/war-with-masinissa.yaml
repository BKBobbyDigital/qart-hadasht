summary: >
  The war of 150 BCE between Carthage and Masinissa, which destroyed
  Carthage's army and gave Rome its formal reason for the Third Punic
  War. Appian (*Punica* 70–74) is the only full account.

  It began in Carthaginian politics. Appian's popular party, led by
  Hamilcar the Samnite and Carthalo, had been harrying Masinissa's
  subjects on disputed land since around 180 (68). In the 150s the
  people voted, and swore an oath, to exile about forty leaders of the
  party that favored Masinissa, and never to take them back. The exiles
  fled to the king and urged war. He sent his sons Gulussa and Micipsa to
  demand their return; they were refused entry, and Hamilcar the Samnite
  attacked Gulussa on the road home. Masinissa made that his excuse to
  besiege Oroscopa, a town Appian says he wanted "contrary to the treaty"
  (70).

  Carthage sent Hasdrubal, its boetharch, with 25,000 foot and 400
  citizen cavalry, and was reinforced by 6,000 Numidian horse who
  deserted Masinissa's lieutenants. After early success Hasdrubal
  followed a feigned retreat into barren hill country and fought a
  day-long battle, watched from a height by the young Scipio Aemilianus,
  who had come from Spain to fetch elephants; Appian says Masinissa, at
  eighty-eight, commanded on horseback and seemed to have the better of
  it. Aemilianus's attempt to mediate failed when Carthage would give up
  the Emporia territory and 1,000 talents but not the deserters. Roman
  envoys then arrived with instructions to end the war if Masinissa was
  losing and to urge him on if he was winning, and they did (71–72).

  Masinissa walled in the Carthaginian camp. Starving and diseased, the
  army surrendered: the deserters handed over, the exiles restored in
  breach of the people's oath, 5,000 talents to Masinissa over fifty
  years. As the men filed out unarmed, Gulussa's cavalry fell on them.
  Of 58,000 only a few, Hasdrubal among them, got back (73).

  Carthage, much weakened and afraid of both Masinissa and Rome,
  condemned Hasdrubal, Carthalo and the others responsible to death and
  sent envoys to Rome to blame them (74). Rome treated the war as a breach
  of the treaty of 201, which forbade Carthage to make war in Africa
  without Roman consent, and it became the pretext for the Third Punic
  War. How far the war was Masinissa's doing, and how far Rome's, is
  weighed in the
  [take on Masinissa](/editorialTakes/masinissa-strategic-opportunist).
