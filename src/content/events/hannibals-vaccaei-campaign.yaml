summary: >
  Hannibal Barca's second independent Iberian campaign,
  conducted in summer 220 BCE against the Vaccaei — a major
  Iberian tribal confederation occupying the central-northern
  meseta around the upper Duero river (modern Salamanca-Zamora
  region). The campaign produced two principal urban captures:
  Hermandica (modern Salamanca) and Arbocala (modern Toro,
  near Zamora). Both engagements produced substantial plunder
  in silver and grain that funded the army's continued
  operations.

  The strategic significance lay in two areas. First, the
  campaign extended Carthaginian operations far further north
  than any previous Barcid expedition, demonstrating the
  capacity of the Iberian field army to project force across
  several hundred kilometers from its southeastern base.
  Second, the campaign's return route through Carpetani
  territory produced the political consequence that defined
  the year: the Carpetani, Vaccaei survivors, and Olcadian
  refugees who had sheltered with them combined into a
  coalition force that intercepted Hannibal's army at the
  Tagus river crossing. The Tagus engagement that followed
  (one of the two clear pre-Italian demonstrations of
  Hannibal's tactical command) eliminated the principal
  organized Iberian opposition to Carthaginian expansion and
  freed Hannibal to turn to the Saguntum operation the
  following spring.
