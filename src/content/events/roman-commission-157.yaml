summary: >
  The second of the three principal Roman senatorial
  commissions to Carthage in the period preceding the
  Third Punic War. The 157 BCE commission, like its 162
  predecessor and its 153 successor, ruled in
  Masinissa's favor on the immediate border dispute and
  produced no remedy for the broader Carthaginian
  grievance about systematic Numidian encroachment under
  Roman cover.

  The commission is preserved in less detail than either
  Cato's 153 commission (which produced the strategic
  shift) or the 162 commission (which set the pattern).
  What its existence preserves is the consistency of the
  Roman arbitration pattern across the period: every
  five years from 162 through 153, Carthage submitted
  border disputes to Roman arbitration; every commission
  ruled for Masinissa; the territorial encroachment
  continued.

  The 157 commission's significance is therefore
  primarily as evidence of pattern-consistency. By the
  time of Cato's 153 commission, the Carthaginian state
  had been operating within a Roman-arbitration framework
  for nine consecutive years that had produced no
  protection of Carthaginian territorial integrity. The
  cumulative effect was the structural condition Cato's
  commission would observe, a still-prosperous Carthage
  that had nonetheless lost substantial territory to
  Masinissa across the period, and would treat as the
  basis for his subsequent advocacy for the city's
  destruction.
