summary: >
  A Roman senatorial delegation sent to settle a border dispute between
  Masinissa and Carthage. It is known only from a single line in the
  summary of Livy's lost Book 47, which does not say what the delegation
  decided (*Periochae* 47).

  Its importance is as a reminder of how thin the record of Roman
  arbitration is. Older accounts filled the gap with the general
  statements of Polybius (31.21), that Carthage always lost its cases at
  Rome, and of Appian (*Punica* 68), that Roman envoys favored Masinissa
  by delay, and so counted this delegation as another ruling against
  Carthage. No source says so. The embassy that followed, on which Cato
  served, issued no ruling at all, because Carthage refused to reopen
  the treaty (Appian *Punica* 69). How consistently Rome sided with
  Masinissa is set out in the
  [claim on Masinissa's territorial seizures](/claims/masinissa-territorial-seizures-pattern).
