summary: >
  Hannibal's march from Iberia across the Alps to northern Italy
  in autumn 218 BCE, one of the most famous strategic operations
  in ancient warfare. Hannibal left Carthago Nova in the late
  spring of 218 BCE, crossed the Pyrenees with about 50,000
  infantry and 9,000 cavalry (Polybius 3.35), forced the Rhone
  crossing against Gallic opposition with 37 elephants (3.42),
  and entered the Alps in October or early November. The
  crossing itself took about fifteen days, through cold, snow,
  ambushes by mountain peoples, and a descent where a landslide
  had carried away the path and a new one had to be cut along
  the cliff (3.55). Livy's version of that repair, with rock
  split by fire and vinegar (21.37), is not in Polybius and is
  treated in the
  [source comparison](/sourceComparisons/alps-crossing). By the
  time the army descended into the Po Valley Hannibal had about
  20,000 infantry and 6,000 cavalry (3.56); the elephants
  came through, fought at the Trebia, and nearly all died in
  the winter that followed (3.74).

  The specific Alpine pass Hannibal used is contested in modern
  scholarship. Polybius's account suggests one set of geographic
  features (most consistent with the Col du Clapier or the Col
  de la Traversette); Livy's account seems to imply a different
  southerly crossing. At least five candidate passes have been
  proposed. The question of which pass is interesting but not
  central; what matters strategically is that the crossing
  succeeded against expectation, that Hannibal arrived in Italy
  with a smaller but still operational army, and that the Roman
  strategic position had not anticipated this development.
