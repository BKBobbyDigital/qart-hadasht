summary: >
  The most consequential constitutional intervention of
  post-Zama Carthage and the single best-documented piece of
  Carthaginian internal politics in the surviving record.
  Hannibal Barca, elected suffete in 196 BCE, six years after
  the Treaty of 201 had imposed the 50-year indemnity, used
  his year in office to push two structurally significant
  reforms through the popular assembly:

  1. Fiscal-administrative reform. Investigation of
  Carthaginian state finances revealed (per Livy 33.46) that
  the indemnity payments were being met not through any
  genuine fiscal shortfall but through systematic embezzlement
  by aristocratic officials of the Council of 104 and
  associated bodies. Hannibal proposed that the state could
  meet the indemnity entirely from regular revenues (i.e.,
  without the special taxation the post-war oligarchic
  faction had been using to fund its own positions) if the
  embezzlement were halted. The reform produced a substantial
  recovery of state finance and a corresponding political
  attack on the offending officials.

  2. Constitutional reform of the Council of 104. The
  Council had become, by Livy's and Nepos's accounts, a
  self-perpetuating oligarchic body whose members held office
  for life and whose judgments operated essentially without
  external check. Hannibal pushed legislation through the
  popular assembly limiting members' tenure to one year and
  requiring re-election to consecutive terms. The reform
  broke the Council's oligarchic character at a structural
  level: it could no longer function as a permanent
  aristocratic-judicial check on suffete or assembly action.

  The reforms' political consequences were rapid and severe.
  The displaced aristocratic faction sent envoys to Rome
  alleging that Hannibal was negotiating with Antiochus III
  of Syria for a renewed war against Rome — possibly true,
  possibly partial truth, possibly fabrication. Roman
  pressure produced demands for Hannibal's extradition; in
  late 195 BCE, Hannibal fled Carthage for the eastern
  Mediterranean. The exile that followed lasted until his
  suicide at Bithynia in c. 183 BCE.

  The episode is constitutionally significant beyond its
  specific content. It demonstrates that the Carthaginian
  system, for all its claims to mixed-constitution balance,
  could be substantially reformed through a suffete-led
  legislative push backed by the popular assembly. It also
  shows the limits of that mechanism: the reforms succeeded
  legislatively but the reformer was politically destroyed.
  Hannibal's exile is the immediate cost of the
  constitutional intervention.
