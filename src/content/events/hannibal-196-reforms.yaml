summary: >
  The most consequential constitutional intervention of
  post-Zama Carthage and the single best-documented piece of
  Carthaginian internal politics in the surviving record.
  Hannibal Barca, elected suffete in 196 BCE, six years after
  the Treaty of 201 had imposed the 50-year indemnity, used
  his year in office to push two structurally significant
  reforms through the popular assembly:

  1. Fiscal reform. Public revenue, Livy says, was being lost
  to careless management and to theft by some of the leading
  men and magistrates, so that a heavy tax on citizens seemed
  likely in order to meet the annual payment to Rome. Hannibal
  established what had been embezzled and told the assembly
  that if it were recovered the state could pay Rome without
  taxing anyone (Livy 33.46–47). Nepos credits him with new
  revenues that paid Rome and left a surplus (*Hannibal* 7.5).
  The men who had been profiting became his enemies.

  2. Reform of the judges. Livy's "order of judges", usually
  identified with the Council of 104, held office for life and
  with it power over the property, reputation and lives of
  every citizen (Livy 33.46; Nepos does not mention it). The
  quarrel began when a quaestor, expecting promotion to the
  judges, ignored Hannibal's summons. Hannibal pushed legislation through the
  popular assembly limiting members' tenure to one year and
  barring anyone from serving two consecutive years (Livy 33.46.6). The reform
  broke the Council's oligarchic character at a structural
  level: it could no longer function as a permanent
  aristocratic-judicial check on suffete or assembly action.

  The reforms' political consequences were rapid and severe.
  Hannibal's opponents wrote to their friends at Rome that
  he was exchanging messengers with Antiochus III (Livy
  33.45), whether truly or not; Scipio Africanus opposed
  acting on it for a long time (33.47). When a Roman embassy
  arrived in the summer of 195, Hannibal fled Carthage for
  the eastern Mediterranean (33.47–48). The exile that followed lasted until his
  suicide at Bithynia in c. 183 BCE.

  The episode is constitutionally significant beyond its
  specific content. It demonstrates that the Carthaginian
  system, for all its claims to mixed-constitution balance,
  could be substantially reformed through a suffete-led
  legislative push backed by the popular assembly. It also
  shows the limits of that mechanism: the reforms succeeded
  legislatively but the reformer was politically destroyed.
  Hannibal's exile is the immediate cost of the
  constitutional intervention.
