summary: >
  A Roman victory in 250 BCE at [Panormus](/places/panormus) that
  became one of the signature engagements of the First Punic War, and
  the battle that turned the war elephant from a Carthaginian terror
  into a Roman trophy. Two years after Xanthippus and the Carthaginian
  elephants had annihilated Regulus's army in Africa, a large
  Carthaginian force under Hasdrubal, son of Hanno, advanced on
  Panormus to recover the city Rome had taken in 254, its front
  screened by a mass of elephants.

  The proconsul Lucius Caecilius Metellus fought the battle from the
  city's defenses rather than in the open. He posted light troops in a
  ditch dug before the walls and had them pelt the elephants with
  javelins while archers and slingers on the ramparts did the same. The
  maddened animals, wounded and hemmed in, turned on their own side and
  trampled the Carthaginian ranks into confusion; Metellus then sortied
  and completed the rout. The elephants were captured, shipped across to
  Italy, and paraded at Rome, and the Caecilii Metelli took the elephant
  onto their family coinage for generations after.

  What happened to them next is recorded, and the figures differ.
  Livy's summarizer has Metellus celebrate a splendid triumph with
  thirteen enemy commanders and a hundred and twenty elephants led in
  it (*Periochae* 19). Pliny says a hundred and forty-two were taken,
  or a hundred and forty on some accounts, ferried to Italy on rafts
  built across lines of jars, and then destroyed in the Circus: Verrius
  says they were killed with javelins because nobody could think what
  else to do with them, since Rome would neither keep them nor give
  them to the kings, while Piso has them merely driven round the arena
  by men with blunted spears to make them contemptible (*NH* 8.6, in
  the older division; 8.16-17 in the modern one). The parade fixed the
  elephant in the Roman mind as a Carthaginian attribute, which is
  where the standing association of Carthage with elephants partly
  comes from.

  The victory's importance was as much moral as military. It reversed
  the run of defeats that had followed the African expedition, it broke
  the psychological hold the elephant had gained over Roman armies, and
  it cleared the way for the consuls to open the
  [siege of Lilybaeum](/events/siege-of-lilybaeum) and press the war to
  its decision. Polybius (1.40) gives the fullest account; the elephant
  numbers in the sources are inflated in the usual way and the
  reconstruction is secure on the shape of the battle rather than its
  exact figures.
