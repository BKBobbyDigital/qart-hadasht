summary: >
  The third and final war between Rome and Carthage, fought from
  149 to 146 BCE and ending in the destruction of the Carthaginian
  city. The war is distinctive among the Punic Wars for its
  asymmetry between *casus* and *outcome*: a war declared on a
  manufactured legal pretext (the Carthaginian retaliation against
  Masinissa in 150 BCE in violation of the Lutatius treaty's
  allied-protection clause) ended in the systematic obliteration
  of one of the largest cities of the ancient Mediterranean and
  the enslavement of approximately 50,000 of its surviving
  inhabitants. The Roman strategic objective was settled before
  the war began: Cato the Elder had advocated destruction for
  years, and the senate's decision after the surrender of
  Carthaginian weapons in 149 BCE to demand that the population
  abandon the site made destruction the only outcome the Roman
  terms could produce.

  In structural terms the war was substantially a single extended
  siege of Carthage; for that reason this parent event preserves
  the framing and causal-political context, while the focal
  Destruction of Carthage event preserves the siege itself, the
  Polybian eyewitness testimony, and the iconic moments
  (Scipio's tears, Hasdrubal's wife's self-immolation, the burning
  of the city). Both should be read together.

