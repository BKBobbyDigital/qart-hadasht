      legal pretext for the war when Carthage finally fought back
      in 150 BCE.
summary: >
  The third and final war between Rome and Carthage, fought from 149 to
  146 BCE and ending in the destruction of the city. Its occasion was
  Carthage's war with Masinissa in 150, fought without the Roman consent
  the treaty of 201 required; Masinissa's own siege of Oroscopa, which
  began that war, Appian calls contrary to the treaty. Its purpose,
  according to Appian and Diodorus, was settled before it began: the
  consuls sailed with secret orders to raze Carthage, and the senate's
  promises to the surrendering Carthaginians left the city out (Appian
  *Punica* 75; Diodorus 32.6; see the
  [claim on the 149 demands](/claims/149-demands-as-deliberate-trap)).

  The war was chiefly one long siege. The consuls of 149 and Piso in 148
  made little headway against the walls and against Hasdrubal's army in
  the countryside. Scipio Aemilianus, elected consul for 147 below the
  legal age, forced that army into the city, blockaded the isthmus and
  the harbor, destroyed the last field force at Nepheris, and took the
  city in spring 146 after six days of street fighting (Appian 112–130).
  Appian's Scipio thought the city had held out for three years without
  ships, arms or allies (132). The siege itself, Polybius's eyewitness
  testimony, and the scenes of the end are treated under the
  [destruction of Carthage](/events/destruction-of-carthage).
