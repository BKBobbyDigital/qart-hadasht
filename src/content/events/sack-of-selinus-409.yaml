summary: >
  The first blow of the Carthaginian return to Sicily in 409 BCE. Segesta,
  an Elymian city at war with Selinus, appealed to Carthage, and Carthage
  gave the command to Hannibal son of Gisco, grandson of the Hamilcar who
  died at Himera, a man Diodorus calls a hater of Greeks bent on wiping
  out his family's disgrace (13.43). He landed near Lilybaeum with an army
  that Ephorus put at 200,000 foot and 4,000 horse and Timaeus at not many
  more than 100,000 (13.54). Selinus had neglected its walls; the rams and
  siege towers breached them, and the city held out for nine days of
  fighting, with women throwing stones from the rooftops, before the
  Iberians broke in. Diodorus counts 16,000 dead and over 5,000 captives,
  with 2,600 escaping to Acragas (13.55–58). To a Syracusan request to
  ransom the captives and spare the temples Hannibal answered that the
  gods had left Selinus; but he returned his property to Empedion, who
  had argued against the war, and let the survivors return to farm the
  land on payment of tribute (13.59). He then pulled down the walls and
  marched on Himera. Miles notes that our account comes through hostile
  Sicilian Greek historians (*Carthage Must Be Destroyed*, p. 123);
  Diodorus names both Ephorus and Timaeus for this campaign, and Timaeus
  gives the lower figures.
