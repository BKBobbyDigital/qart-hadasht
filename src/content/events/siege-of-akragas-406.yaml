summary: >
  The second great Carthaginian Sicilian campaign of the
  Hannibalic invasion, opened in spring 406 BCE against
  Akragas, by far the wealthiest Greek-Sicilian city of
  the period and the principal target the 410-405 invasion
  had not yet reached. The Carthaginian army Diodorus
  reports at 120,000 (the standard caveat) opened with a
  conventional siege of Akragas's circuit walls.

  The siege's most-discussed episode was Hannibal son of
  Gisco's death in the Carthaginian camp partway through
  the operation, preserved in Diodorus as plague but more
  plausibly disease compounded by the Sicilian summer.
  Command passed to Himilco, Hannibal's cousin, who
  continued the siege through the autumn. A Greek-Sicilian
  relief force under the Syracusan general Daphnaeus was
  defeated near the city; Akragantine confidence collapsed.

  The city's fall came not by storm but by evacuation: the
  surviving Akragantine population, recognizing the
  siege's logic and unable to resupply, marched out of the
  city by night in late 406 / early 405 BCE and withdrew
  to Gela and Syracuse. The Carthaginians entered the
  empty city the following day and conducted what may have
  been the most lucrative single sack of the 5th century:
  Diodorus's account dwells on the bronze and silver
  vessels, the paintings, the monumental sculpture
  cataloged (and removed). Some of the Akragantine plunder
  was visible at Carthage for centuries; Roman accounts of
  the 146 BCE sack of Carthage describe the recovery of
  Sicilian Greek artworks the Romans returned to surviving
  Sicilian cities. The siege's economic consequences for
  Carthaginian capacity were as large as its strategic
  consequences for Greek Sicily.
