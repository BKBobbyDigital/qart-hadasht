summary: >
  Scipio Africanus's victory over the Carthaginian-Masaesylian
  army under Hasdrubal Gisco and Syphax in spring 203 BCE, the
  decisive Roman engagement of the African campaign before Zama.
  Scipio had crossed to Africa in 204 BCE and spent the
  following winter conducting a war of position around Utica;
  the Great Plains was the field engagement that resolved the
  strategic situation. Roman tactical execution combined the
  veterans of the Iberian campaign (under Scipio) with
  Masinissa's Numidian cavalry, defeating the larger
  Carthaginian-Masaesylian force decisively.

  The engagement's principal aftermath was the pursuit of Syphax
  by Masinissa: at Cirta (modern Constantine, Algeria) days
  later, Syphax was captured. Masinissa entered Cirta and
  married Sophonisba, Syphax's wife (and previously Masinissa's
  own betrothed), in a move that secured Masaesylian succession
  but produced Scipio's demand for Sophonisba's surrender as a
  Roman war captive. Sophonisba's poisoning at Masinissa's hand
  followed within days, the central episode in Livy's dramatic
  preservation of the campaign.

  The strategic outcome was decisive. With Syphax captured, his
  kingdom passed to Masinissa under Roman patronage; with the
  Carthaginian field force destroyed, the Carthaginian senate
  recalled Hannibal from Italy for the campaign that culminated
  at Zama in October 202 BCE. The Great Plains is the engagement
  that made Zama strategically necessary; without it, Hannibal
  might have remained in Italy for years longer.
