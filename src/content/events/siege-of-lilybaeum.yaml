summary: >
  The longest siege of the First Punic War, and the clearest
  demonstration that the war could not be won on land. Rome laid
  siege to [Lilybaeum](/places/lilybaeum), the great Carthaginian
  fortress-port of western Sicily, in 250 BCE, and never took it.
  The city, built around 396 after Dionysius I destroyed nearby
  [Motya](/places/motya), was the strongest Carthaginian
  stronghold on the island, walled and moated and open to the sea.
  It held for nine years, until the war itself ended.

  The Roman consuls of 250 opened the siege after the victory at
  Panormus, throwing up siege lines, moles, and rams against the
  landward wall. The garrison answered with countermines, sorties,
  and a night sally that burned the Roman engines; a plot by some
  of the mercenary officers to betray the city was exposed in time
  by the Achaean Alexon. But the decisive factor was the sea. Rome
  could never fully close the harbor, and Carthaginian
  blockade-runners, the fast ship of the captain the sources call
  Hannibal the Rhodian above all, ran in and out almost at will,
  carrying supplies and word until he was finally taken. A fortress
  that could be reached by sea could not be starved.

  The Rhodian repays a second look. Polybius says he was one of
  Carthage's leading citizens, that he volunteered for the run
  himself, offering to go in and bring back a report from his own
  observation, that the authorities took him up eagerly while
  doubting it could be done, and that he fitted out his own ship
  (1.46.4–1.46.6). An aristocrat equipping a warship at his own
  expense for a state purpose is a glimpse of naval effort resourced
  outside the treasury.
  [Eve MacDonald](/sources/macdonald-hannibal-2015) reads it that
  way, suggesting that individual citizens built, equipped and manned
  ships for particular missions and that some culture of reward lay
  behind it (p. 29). She offers that as a possibility rather than a
  finding, and the passage carries one man and one ship, so it will
  not support a general account of privately funded sea power. It
  also does not touch how a battle fleet was raised, which was a
  state undertaking in the state's harbor and was limited after 241
  by trained crews rather than by hulls. What it does show is that
  the sharp end of naval work, the dispatch run through a blockade,
  could be privately fitted out and personally volunteered.

  The siege anchored the whole western-Sicily endgame. Up the
  coast in 249, [Adherbal](/people/adherbal) destroyed the fleet of
  [Publius Claudius Pulcher](/people/claudius-pulcher) at
  [Drepana](/events/battle-of-drepana), the worst Roman naval
  defeat of the war, ending any hope of taking the west by assault.
  From 247 [Hamilcar Barca](/people/hamilcar-barca) operated first
  from Heircte at the Panormus end of the north coast and from 244
  at [Eryx](/places/eryx), harassing the Roman lines and keeping the
  theater alive while Lilybaeum stood. The stalemate broke only
  elsewhere, and at sea: at the
  [Aegates Islands](/events/battle-of-aegates-islands) in 241 a
  rebuilt Roman fleet destroyed the Carthaginian relief squadron,
  and with the sea lost Carthage could no longer hold Sicily. The
  [Treaty of Lutatius](/events/treaty-of-lutatius) required the
  evacuation of the island, and Lilybaeum passed to Rome unbreached,
  by agreement rather than by storm.

  Polybius (1.42–48) makes the siege his set-piece on the limits of
  land power against a first-rate fortress with sea access, and on
  why the First Punic War was ultimately a contest to be decided on
  the water. Diodorus (Book 24) preserves further detail in
  fragments. The reconstruction is secure on the shape and outcome
  of the siege and thinner on its year-by-year particulars.
