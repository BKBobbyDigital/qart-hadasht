summary: >
  The first Roman approach to Hannibal, and the last occasion on which
  the quarrel over Saguntum might have been settled by talking. This
  page said until October 2026 that the envoys were turned away without
  a hearing and told they had no standing to raise the matter. Neither
  of those is in any source.

  ## When and where

  [Polybius](/sources/polybius-histories) has the Romans send envoys to
  Hannibal while he is wintering at New Carthage, before the siege of
  Saguntum opens (3.15). [Livy](/sources/livy-auc) sends P. Valerius
  Flaccus and Q. Baebius Tamphilus "to Hannibal at Saguntum and from
  there to Carthage" with the attack already begun (21.6). The two
  cannot both stand, and Livy knew his own chronology here was in
  trouble: he reports that some writers put the city's fall eight months
  after the siege opened, says that cannot be squared with the consuls
  of the year, and offers a choice between compressing everything or
  assuming Saguntum had already fallen (21.15). Most modern work treats
  the two accounts as one embassy and follows Polybius, and so does this
  page; [Eve MacDonald](/sources/macdonald-hannibal-2015) sets it in
  late 220 (pp. 74–75, with her note 58). The envoys' names come from
  Livy alone.

  ## What was said

  The Romans protested that Hannibal was attacking Saguntum, which they
  said was under their protection, and warned him not to cross the Ebro
  against the earlier agreement. He granted them an audience and
  answered at length, and his answer was an accusation: the Romans had
  unjustly put to death leading men at Saguntum, and Carthage would not
  overlook a breach of good faith (3.15.7). Polybius's verdict on the
  reply is severe, that he did not give his real reasons but took refuge
  in groundless pretexts, which is the historian's judgment and not a
  report of what was said.

  **The detail most worth having is the last one.** Hannibal sent to
  Carthage asking for instructions, saying the Saguntines were relying
  on their alliance with Rome to wrong peoples subject to Carthage
  (3.15.8). The commander whom both ancient traditions present as acting
  on his own referred the question home before the siege, which belongs
  with the
  [source comparison on Barcid autonomy](/sourceComparisons/barcid-autonomy-in-iberia)
  and complicates the picture of a general who simply started a war. It
  does not settle it: asking for instructions is not the same as waiting
  for them, and Polybius does not record an answer.

  ## What followed

  The envoys sailed on to Carthage and got no repudiation of Hannibal
  there. Saguntum was besieged for eight months and fell; the Roman
  declaration came in 218, after a second and much more senior embassy.
  Whether the Carthaginian senate was endorsing the operation or failing
  to restrain a commander whose family dominated the Iberian command is
  contested, and the site does not decide it.
