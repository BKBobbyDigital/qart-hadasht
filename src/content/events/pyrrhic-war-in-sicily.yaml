summary: >
  Pyrrhus of Epirus's Sicilian campaign, fought between his two
  Italian campaigns against Rome. The Greek-Sicilian cities invited
  him in 278 while a Carthaginian army was besieging Syracuse. His
  connection to Syracuse was dynastic as well as military, though
  looser than it is often made: he had married
  [Agathocles](/people/agathocles)'s daughter Lanassa years earlier,
  she had left him for Demetrius Poliorcetes well before 278
  (Plutarch *Pyrrhus* 10.4–5), and what survived the marriage was
  their son Alexander, Agathocles's grandson. Whether that counted
  for anything in the invitation no source says.

  Plutarch gives him thirty thousand foot, twenty-five hundred horse
  and two hundred ships as he advanced against the Carthaginians
  (*Pyrrhus* 22.4). The campaign went well in the field. He stormed
  [Eryx](/places/eryx), the strongest fortress Carthage held on the
  island, and reduced Carthaginian Sicily to
  [Lilybaeum](/places/lilybaeum). That he besieged for about two
  months and then gave up, because a Carthaginian army reached the
  city by sea with grain, engines and missiles, and sea access was
  the thing his siege could not close (Diodorus 22.10.4–7). He turned
  instead to building a fleet to carry the war to Africa, the move
  Agathocles had made a generation before.

  ## What Carthage offered

  Both surviving accounts have Carthage suing for terms, and they
  disagree about who refused. In Plutarch the Carthaginians offer
  money and ships, and Pyrrhus will not treat unless they quit Sicily
  altogether and make the Libyan Sea the boundary between themselves
  and the Greeks (*Pyrrhus* 23.2). In Diodorus the envoys offer a
  truce, peace and a large sum; Pyrrhus refuses the money but is
  talked round to leaving Carthage Lilybaeum, and it is his own
  Friends and the delegates of the Greek cities who tell him not to
  grant them that foothold, so nothing is settled (22.10.5–6). The
  two versions put the refusal in different hands, which changes who
  is held to have prolonged the war. What they agree on is that
  Carthage was willing to pay to end it, which is the same instinct
  the city showed with Agathocles in 306 and would show again in 203.

  ## How it came apart

  Plutarch describes the collapse concretely, and the mechanism was
  the African fleet. Many of Pyrrhus's ships were undermanned, he
  needed rowers, and he turned to compulsion to get them; he had the
  Syracusan leader Thoenon put to death on suspicion of collusion
  with Sosistratus, who had withdrawn from him. The cities turned.
  Some went over to Carthage, others called in the
  [Mamertines](/groups/mamertines), and he faced open secession
  (*Pyrrhus* 23.3–23.5). Sicily, Plutarch says, was like a
  storm-tossed ship, and Pyrrhus wanted to be out of her rather than
  master of her; leaving, he looked back at the island and said what
  a wrestling ground for Carthaginians and Romans they were leaving
  behind (23.6). The Carthaginians fought him in the strait as he
  crossed and took many of his ships, and the Mamertines caught his
  army in rough country on the Italian side (24.1).

  ## What it left

  A restored Carthaginian position in western Sicily through the 270s
  and 260s, and a Mamertine power at Messana that Greek-Sicilian
  cities had themselves invited into the island's politics. Both fed
  the crisis of 265–264 and the Roman intervention that opened the
  [First Punic War](/events/first-punic-war). Pyrrhus is the hinge
  between the long cycle of Greco-Carthaginian wars in Sicily and the
  Roman-Carthaginian one.

  The "Pyrrhic victory" tradition belongs to the Italian campaign and
  not to this one. Diodorus has the king say that one more battle
  against the Romans will leave him not a single soldier of those who
  crossed over with him (22.6.2). Sicily was the other shape of
  failure: won in the field and lost in the cities.
