summary: >
  The Roman judgment in the second dispute over the Emporia, the rich
  coastal district on the Lesser Syrtis. Masinissa had already taken
  the region's open country once, in 193, when a commission including
  Scipio Africanus declined to rule (Livy 34.62). In the early 160s he
  moved again, overran the countryside and pressed for the fortified
  towns he could not take. Both sides went to Rome.

  Polybius, then living in Rome as a hostage, records the outcome
  (31.21). Carthage lost the land and the towns and had to pay five
  hundred talents for the revenue the district had produced since the
  dispute began. He adds his own verdict: the Carthaginians always came
  off worse at Rome, not because they lacked right on their side, but
  because the judges were convinced that ruling against them served
  Rome.

  That remark is the strongest ancient evidence for a policy of Roman
  favoritism toward Masinissa, and it comes from a contemporary with
  access to the senate. It is also a generalization, and how far it
  describes the whole period after Zama is disputed. Hoyos dates Roman
  tolerance of Masinissa's annexations to after 167, which this ruling
  fits, and Bailey argues that Rome mostly upheld the settlement of 201
  and ruled for Carthage on several occasions. The evidence is weighed
  in the
  [claim on Masinissa's territorial seizures](/claims/masinissa-territorial-seizures-pattern).
