summary: >
  The defection of Capua, the second-largest city of Italy
  after Rome, from the Roman alliance to Hannibal's side in
  late 216 BCE. Capua's defection was the largest single
  political defection of Hannibal's Italian campaign and the
  central example of the broader Italian-allied movement away
  from Roman control after Cannae. The Capuan negotiations
  with Hannibal produced a treaty preserved by Livy with
  characteristic political detail: Capua to retain its
  autonomy and political institutions; no Capuan citizen to
  be conscripted into Carthaginian service against his will;
  Capua to be the Italian capital of the new political order
  Hannibal's victory was understood to be producing.

  The defection's strategic consequences were substantial.
  Most of the Italian south followed within months: the
  Bruttii, the Lucanians, much of Apulia, the Greek cities
  of Magna Graecia (especially after Tarentum's defection in
  213/212). The Roman strategic situation became one of
  containing both Hannibal's army and an active Italian
  rebellion against Roman hegemony. Capua's recovery by Rome
  through prolonged siege in 212-211 BCE, and the subsequent
  punishment of the Capuan leadership (~70 senators executed,
  the city's autonomy abolished), was the central Roman
  political-symbolic act of the post-Cannae recovery.

  The Capuan defection illustrates Hannibal's broader Italian
  strategy in operation: the war was not about destroying Rome
  through assault on the city, but about detaching Rome's
  Italian confederation. The strategy was working in 216-212
  BCE; what defeated it was Roman strategic patience and the
  structural manpower depth that allowed Rome to recover Capua
  while continuing to contain Hannibal's army elsewhere.
