summary: >
  The suicide of Hannibal Barca at Libyssa on the Bithynian
  coast (modern Gebze, Turkey, near the eastern shore of
  the Sea of Marmara) in c. 183 BCE — the closing moment
  of the eighteen-year exile that had carried him from
  Carthage through Tyre, Antiochus III's Syrian court, and
  finally to the court of King Prusias I of Bithynia. The
  death was self-inflicted in response to Roman pursuit:
  the senatorial mission under Titus Quinctius Flamininus
  had reached Bithynia with the formal Roman demand for
  Hannibal's surrender, and Prusias — unable or
  unwilling to refuse the Roman demand — had moved to
  comply. Hannibal, recognizing the situation as
  terminal, took poison.

  The episode is preserved with substantial dramatic
  detail across Livy (39.51), Cornelius Nepos (*Hannibal*
  12), and Plutarch (*Flamininus* 20). The sources agree
  on the broad outline — Roman demand, Bithynian
  compliance, suicide by poison Hannibal had reportedly
  carried for years against this eventuality — but
  preserve different specific dramatic details, including
  the variant accounts of his final words. The
  most-cited version is preserved in Livy: Hannibal's
  reported observation that he was "ridding the Roman
  people of their long anxiety, since they thought it
  too long and burdensome to wait for the death of an
  old man."

  The structural significance lies as much in what
  precedes the death as in the death itself. The Roman
  pursuit of Hannibal across the eastern Mediterranean
  for eighteen years — from his 195 BCE flight from
  Carthage through Tyre, Ephesus (under Antiochus III),
  Crete, Armenia (briefly), and finally to Prusias's
  court — testifies to a Roman strategic-political
  commitment that the literary sources frame as
  personal anxiety about Hannibal's continued capacity
  for renewed war. Whether the framing is accurate or
  reflects the surviving literary tradition's
  preference for personal-dramatic causation over
  structural-strategic analysis is contested in modern
  scholarship.

  The death is also the structural close of the Barcid
  generation. Hamilcar Barca had died in 228 BCE at
  Helike; Hasdrubal Barca had been killed at Metaurus
  in 207; Mago Barca had died at sea in 203; Hasdrubal
  the Fair had been assassinated in 221. With
  Hannibal's death in 183, the family that had run
  Carthaginian operations for half a century closed
  out — every senior figure dead, mostly violently,
  most outside Carthage itself. The encyclopedia's
  separate event
  [Hannibal's Exile and Death](/events/hannibal-exile-and-death)
  treats the eighteen-year exile sequence as a whole;
  this focal event preserves the Bithynian closing
  scene specifically.
