summary: >
  The suicide of Hannibal Barca at Libyssa on the Bithynian
  coast (modern Gebze, Turkey, near the eastern shore of
  the Sea of Marmara) in c. 183 BCE — the closing moment
  of the twelve-year exile that had carried him from
  Carthage through Tyre, Antiochus III's court, Crete and
  Armenia, and finally to the court of King Prusias I of Bithynia. The
  death was self-inflicted in response to Roman pursuit:
  Titus Quinctius Flamininus had come to Bithynia and
  pressed Prusias over his guest, and Prusias, unable or
  unwilling to refuse, had moved to give him up. Hannibal, recognizing the situation as
  terminal, took poison.

  The episode is told by Livy (39.51), Cornelius Nepos
  (*Hannibal* 12) and Plutarch (*Flamininus* 20), who agree
  on the outline and differ on the details. In Livy and
  Plutarch the king's soldiers surround the house; in Nepos,
  men with the Roman envoys. Livy and Nepos have him take the
  poison he had long kept ready; Plutarch gives two other
  versions, strangling and bull's blood, before Livy's. The
  last words, that he would relieve the Romans of their long
  anxiety since they found it too long to wait for an old
  man's death, are Livy's composition, and Plutarch quotes
  them from Livy.

  Rome's pursuit was not continuous. The terms after Magnesia
  demanded his surrender (Livy 37.45), and in Bithynia
  Flamininus pressed the matter; but Plutarch says that at
  Rome everyone knew where Hannibal was and ignored him as
  an old man of no account, and that many thought
  Flamininus's act officious and cruel (*Flamininus* 20–21).

  The death is also the structural close of the Barcid
  generation. Hamilcar Barca had died in 228 BCE at
  Helike; Hasdrubal Barca had been killed at Metaurus
  in 207; Mago Barca had died at sea in 203; Hasdrubal
  the Fair had been assassinated in 221. With
  Hannibal's death, the family that had run
  Carthaginian operations for half a century closed
  out — every senior figure dead, mostly violently,
  most outside Carthage itself. The encyclopedia's
  separate event
  [Hannibal's Exile and Death](/events/hannibal-exile-and-death)
  treats the twelve-year exile as a whole;
  this focal event preserves the Bithynian closing
  scene specifically.
