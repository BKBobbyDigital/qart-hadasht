summary: >
  The climactic engagement of the Mercenary War: a strategic
  envelopment in which Hamilcar Barca, exploiting Naravas's
  Numidian cavalry advantage, maneuvered Spendius's principal
  rebel army into a constricted defile in the broken country
  of the Carthaginian hinterland. The terrain, Polybius
  describes it under the name "the Saw" (*prion*) for the
  serrated ridge profile, prevented rebel breakout and
  starved the trapped army for some weeks. The reduction of
  Spendius's force followed a sequence Polybius treats as
  exemplary of the war's character: cannibalism among the
  besieged; Spendius's attempt at parley resulting in his
  seizure and execution; reciprocal atrocity by both sides.
  The destruction of the Saw army eliminated the principal
  rebel field force and reduced the conflict's remainder to
  Mathos's defeated rear-guard operations and the suppression
  of the Libyan-rural-rebellion phase of the war. The
  engagement marks the decisive Carthaginian recovery and the
  prelude to the war's conclusion in 237 BCE.
