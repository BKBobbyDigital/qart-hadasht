summary: >
  The alliance between Hannibal and Philip V, sworn in Hannibal's camp
  in the summer of 215. Its interest for this site is less the
  alliance, which achieved little, than the document, which is the
  most substantial Carthaginian state instrument that survives in
  anything close to its own words. Polybius says he read it and gives
  the text (7.9); Livy supplies the surrounding story and a summary of
  the terms that his own source contradicts.

  ## The mission and the capture

  Philip sent Xenophanes of Athens, son of Cleomachus, to Italy. The
  Macedonian ship avoided the Roman harbors of Brundisium and Tarentum
  and put in near Locri by the temple of Juno Lacinia, the sanctuary
  that also holds the
  [bronze tablet](/sources/lacinian-inscription) on which Hannibal
  later published his own figures. Terms were agreed and sworn, and
  three Carthaginian envoys, Gisgo, Bostar and Mago, went back with
  Xenophanes to take the king's own oath.

  They were sighted at sea by the Roman squadron guarding the Calabrian
  coast under Publius Valerius Flaccus, who sent light craft after
  them. Xenophanes tried the lie that had worked on the outward
  voyage, that Philip had sent him to the Romans. Then, Livy says,
  Punic dress and bearing made Hannibal's envoys suspect, and when
  they were questioned their speech gave them away; their attendants
  were taken aside and frightened, and the letters from Hannibal to
  Philip and the agreed terms were found (23.34.1-9). The envoys were
  sent to Rome in five fast ships, each kept apart from the others.

  So the one Carthaginian diplomatic document to survive does so
  because three Carthaginians at sea could be recognized as
  Carthaginians. That detail is treated under
  [what the word Punic carried at Rome](/themes/punic-identity).

  ## What the text says

  Polybius 7.9 gives the instrument whole, and its shape matters as
  much as its clauses. It opens by naming the parties: Hannibal the
  general, Mago, Myrcan, Barmocar, such other members of the
  Carthaginian senate as were present with him, and all Carthaginians
  serving under him, on the one side, and Xenophanes on behalf of
  Philip, the Macedonians and their allies on the other.

  That clause is evidence on a question the site treats elsewhere. The
  post-war Carthaginian defense that Hannibal had acted on his own
  authority, used over the Ebro agreement and again in 203 and set out
  in the comparison on
  [Barcid autonomy](/sourceComparisons/barcid-autonomy-in-iberia), has
  to be read against a document in which members of the Carthaginian
  senate are standing in his camp in Italy and swearing with him.
  MacDonald, following Bickerman, takes it as confirmation that he
  acted for the state, and the site agrees that this is what the text
  shows. She also notes that Hannibal referred his treaties with
  Tarentum and Syracuse home for ratification, and suggests the
  senators' presence made referral unnecessary here; that last step is
  her inference and is reported as such.

  The terms themselves are mutual protection, a common enmity toward
  anyone at war with either party, Macedonian help in the Roman war,
  and the provision that if the Romans ask for terms the peace will
  include Philip, bar Rome from making war on him, and strip it of
  Corcyra, Apollonia and its other Adriatic holdings (7.9.5-13). The
  peace it imagines is a peace with a Rome that still exists, which is
  why the document is central to the
  [claim on Hannibal's limited war aims](/claims/hannibal-limited-war-aims).
  Livy's summary, which has the two of them intent on destroying Rome
  and dividing the world (23.33), contradicts the text Polybius
  preserves, and the site follows Polybius.

  ## The oath

  Before the terms comes a list of gods, in triads: Zeus, Hera and
  Apollo; the Genius of Carthage, Heracles and Iolaus; Ares, Triton
  and Poseidon; the gods who campaign with us, and Sun, Moon and
  Earth; Rivers, Lakes and Waters; all the gods who hold Macedonia
  and the rest of Greece; all the gods of the army who preside over
  this oath. The site treats this under its own
  [claim](/claims/philip-treaty-oath-punic-form), because the argument
  built on it is the most interesting thing in the chapter that
  produced this page.

  ## What came of it

  Little, and the little was expensive. Livy has Rome see a war of
  great size with Macedon opening while it could barely carry the
  Punic one (23.38.5), and answer by going at Philip at once. Roman
  command of the sea held through the whole war, which is the
  condition that made the alliance unusable: Philip had no fleet worth
  the name, and Carthage could not spare one. MacDonald records that
  when the admiral Bomilcar did take his fleet from Tarentum to Philip
  in 209 or 208, the cost to Carthage was the loss of Tarentum. The
  site has not traced that to a passage and reports it as hers.
