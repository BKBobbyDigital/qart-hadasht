summary: >
  The treaty of joint operations between Hannibal and Philip V
  of Macedon, negotiated in summer 215 BCE through Macedonian
  envoys to Hannibal's Italian camp. The treaty's text is
  preserved in Polybius (7.9) in what is generally treated as a
  faithful Greek translation of the original Punic-Greek
  diplomatic document, making it one of the few near-verbatim
  ancient diplomatic instruments to survive.

  The substantive terms: Carthage and Macedon undertake mutual
  defensive obligations; Philip V will support Carthaginian
  operations against Rome in Italy; Carthage will support
  Macedonian operations against Roman interests in the Adriatic;
  neither side will conclude a separate peace with Rome without
  the other's consent; specific military and territorial
  arrangements concerning Roman holdings in the Adriatic. The
  treaty did not commit either side to specific operational
  contributions; its principal effect was to make the
  Carthaginian-Macedonian alliance a framework Rome had to take
  seriously.

  The treaty's strategic consequences were limited but real. The
  First Macedonian War (215-205 BCE) opened a second Roman front
  that absorbed substantial Roman resources through the Hannibalic
  period and culminated in the Roman peace settlement of 205 BCE.
  Philip V's support of Hannibal was less material than the
  treaty implied, and Roman counter-diplomacy (the Aetolian
  League alliance of 211 BCE) effectively neutralized
  Macedonian operations against Rome's eastern position. The
  treaty's longer-term significance is structural: it
  established Macedon as a state whose interests intersected
  Roman interests in ways that the post-Hannibalic period would
  resolve through the Second Macedonian War (200-197 BCE) and
  the eventual Roman conquest of Macedon at Pydna in 168 BCE.

  The Roman capture of the original treaty document in 215 BCE
  (intercepted with the Macedonian envoys returning from
  Hannibal's camp) gave the Roman senate the formal pretext for
  its declaration of war on Macedon. The First Macedonian War
  was, in this sense, a war declared on the strength of an
  intercepted document that Polybius then preserved in Greek
  translation for later readers.
