    notes: >
      Himera is the first major engagement in the long
      Greco-Carthaginian struggle over Sicily, conventionally
      treated as the opening of a cycle that runs through the
      Sicilian Wars of the 5th-4th centuries and into the
      Agathocles invasion at the cycle's close.
summary: >
  The defeat of the Carthaginian expedition under Hamilcar son of Hanno by
  Gelon of Syracuse and Theron of Acragas in 480 BCE. Carthage had been
  invited in by Terillus, the tyrant Theron had expelled from Himera, with
  the help of Anaxilas of Rhegium (Herodotus 7.165). Hamilcar landed at
  Panormus with an army the sources put at an impossible 300,000 and
  besieged Himera. In Diodorus's account Gelon's cavalry, admitted to the
  naval camp as allies from Selinus, killed Hamilcar at a sacrifice and
  fired the ships, and the army broke (11.20–22); the Carthaginians' own
  account, in Herodotus, was that Hamilcar threw himself into his
  sacrificial fire when he saw the rout, and he was honored afterward
  with sacrifices and monuments across the Punic cities (7.167). Carthage
  paid 2,000 talents and built two temples to house the treaty (Diodorus
  11.26), and stayed out of Greek Sicily until 409. The victors paired the
  battle with Salamis within a decade, in Pindar's ode for Hieron; later
  tradition turned the pairing into a Persian–Carthaginian alliance, which
  Aristotle rejected. See
  [the narrative](/narratives/battle-of-himera) and the
  [editorial take](/editorialTakes/himera-greek-pairing).
