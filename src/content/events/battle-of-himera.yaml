  notes: >
    Herodotus reports, as a Sicilian tale, that Himera was won on the
    day of Salamis (7.166); Diodorus puts it on the day of Thermopylae
    (11.24). The shifting synchronism is part of the tradition; the
    year of Xerxes' invasion is not in doubt.
