  notes: >
    The Greek tradition (Herodotus 7.166, Diodorus 11.24) places
    Himera on the same day as the Battle of Salamis (in Herodotus)
    or Thermopylae (in Diodorus). The pairing is itself part of
    the historiographic tradition; the actual chronological
