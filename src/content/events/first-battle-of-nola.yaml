summary: >
  The engagement outside Nola in the autumn of 216 is the first
  recorded occasion on which a Roman army faced Hannibal and was not
  beaten, and Livy says as much in a sentence worth more than the
  battle: whether the victory was as large as some writers claimed or
  smaller, a great thing was done that day, perhaps the greatest in
  that war, because not to be beaten by Hannibal was harder then than
  it was afterwards to beat him (23.16.15-16).

  Everything here is Livy's, and the surrounding campaign is his too,
  in a continuous stretch at 23.14-23.19. There is no Polybian check on
  any of it.

  ## Nola divided

  Hannibal came into Nolan territory from Capua expecting the city to
  come over on its own and ready to be unpleasant if it did not. Livy
  describes the split plainly: the senate and especially its leading
  men stood by the Roman alliance, while the commons were wholly for
  Hannibal, afraid of having their fields ravaged and of what a siege
  would cost them, and there was no shortage of men urging revolt. The
  senate, judging that open resistance to an excited crowd would fail,
  pretended to agree while saying the terms of a new treaty were not
  yet settled. Having bought time that way they sent to the Roman
  praetor Marcus Claudius Marcellus, who was at Casilinum with an army,
  and told him how close Nola was to being lost. Marcellus praised them
  and told them to keep spinning it out until he arrived, concealing
  that any Roman help was coming, and marched round by Caiatia, across
  the Volturnus and over the mountains above Suessula (23.14.5-13).

  That exchange is the mechanism of the war in Italy in miniature, and
  it is covered by the
  [claim on local politics](/claims/italian-defections-local-politics).
  A city did not change hands; a faction in it won, with outside help.

  ## Nuceria

  Hannibal left Nolan territory when Marcellus arrived and went down
  to the coast near Neapolis, wanting a maritime town so that the
  crossing from Africa would be safe. Finding Neapolis held by a Roman
  prefect whom the Neapolitans had themselves sent for, he gave it up
  as he had given up Nola and turned on Nuceria. He besieged it a
  while, tried force and then solicitation of the commons and the
  leading men in turn, and took it in the end by hunger, on terms that
  the inhabitants should leave unarmed with one garment each. Then,
  Livy says, wishing to appear mild to all Italians except Romans, he
  offered rewards and honors to any who would stay and serve with him.
  Nobody stayed. They scattered through the Campanian cities, mostly
  to Nola and Neapolis, and about thirty of their senators who went to
  Capua were shut out, because Capua had closed its gates to them, and
  went on to Cumae. The plunder of Nuceria was given to the soldiers
  and the city was sacked and burned (23.15.1-6).

  The sequence deserves its own sentence. The offer of service and the
  burning are in consecutive clauses of the same passage, and the
  refusal is total. Whatever the terms Hannibal was prepared to give a
  city that came over, as Capua had, a city taken by siege got
  something else, and the Campanians watching knew which they were
  being offered.

  ## The battle

  Hannibal came back to Nola, and the commons turned again toward
  defection. Marcellus pulled his force inside the walls, Livy says
  not out of fear for his camp but to avoid leaving the city to be
  betrayed while too many people were watching for the chance. The two
  armies stood facing each other for days with small skirmishes
  between the walls and the Carthaginian camp.

  Then the leading Nolans brought Marcellus word of night meetings
  between the commons and the Carthaginians: when the Roman line went
  out of the gates, the plan was to plunder its baggage, shut the
  gates, seize the walls and hand the city over. Marcellus drew up in
  three divisions behind three gates, with the strength of the legions
  and the Roman cavalry at the middle gate and the new soldiers, the
  light-armed and the allied horse at the other two; the Nolans were
  forbidden to go near the walls or the gates; and the baggage was
  given a guard of its own. Hannibal, who had been standing in order
  of battle for much of several days, was puzzled that nobody came out
  and nobody manned the walls, concluded that the plot had been
  betrayed, and sent part of his men back to camp to fetch siege
  equipment. While they were scattered about that work, Marcellus had
  the gate thrown open, the trumpets sounded and the infantry and then
  the cavalry charge out, with the legates Publius Valerius Flaccus and
  Gaius Aurelius bursting from the side gates onto the enemy's wings.
  The camp servants and sutlers made enough noise that an army the
  Carthaginians had been despising for its small numbers suddenly
  looked large (23.16).

  Livy then declines his own figures. He would hardly dare affirm, he
  says, what some authorities state, that two thousand eight hundred
  of the enemy were killed for the loss of not more than five hundred
  Romans. The site reports the numbers as he does, which is to say as
  a tradition he does not vouch for. MacDonald handles this the same
  way, and it is worth noting the agreement, because the surviving
  Roman tradition had an obvious interest in the size of its first
  success.

  ## What Marcellus did next

  Hannibal withdrew to Acerrae. Marcellus then closed the gates of
  Nola, posted guards so that nobody could leave, and held an inquiry
  in the forum into those who had been in secret conference with the
  enemy. He beheaded more than seventy men condemned of treason,
  ordered their property to be public property of the Roman people,
  and handed the government of the city to the senate (23.17.1-2).

  That is the other half of what loyalty meant. Nola stayed Roman
  because the pro-Roman council was put in sole charge of it after the
  leaders of the other side were executed, which is the same kind of
  factional settlement a defection was, imposed by the other party. A
  reader who takes the cities that stayed loyal as simply loyal is
  reading only the Roman half of a two-sided process.

  ## Acerrae and Casilinum

  Hannibal tried to talk Acerrae into surrender, found it obstinate
  and prepared to besiege it; the Acerrans had more spirit than
  strength, slipped out in silence through gaps in the unfinished
  works, and got away to Campanian cities that had not changed sides.
  He plundered and burned the town (23.17.4-7). Two cities burned in
  one autumn, and in both the inhabitants chose to leave rather than
  take his terms.

  He went on to Casilinum, held by five hundred Praenestines with a
  few Romans and Latins and, later, a Perusine cohort of four hundred
  and sixty. Gaetulians under a prefect named Isalca were thrown back
  from the gates, then Maharbal with a stronger force, and Hannibal
  lost men to missiles from the wall and towers. He offered a golden
  mural crown, and Livy has him taunt his own troops by asking the
  captors of Saguntum whether they were content to make such slack
  work of a little fort on level ground, reminding them of the Trebia,
  Trasimene and Cannae. Sheds and mines were brought up and countered.
  In the end, Livy says, shame turned Hannibal from the attempt, and
  he left a moderate garrison and went into winter quarters at Capua
  (23.18.1-9). He took Casilinum the following spring.

  That passage is worth holding against a modern inference. MacDonald
  argues that Hannibal had learned at Saguntum what a long siege costs
  and avoided them in Italy. Livy has him invoking Saguntum to shame
  his men into pressing a siege harder, which is the opposite use of
  the same memory, and gives walls rather than policy as his reason for
  leaving Neapolis alone. The site does not adopt the inference.

  ## Marcellus's year

  The reputation Marcellus took out of this autumn carried him to the
  consulship of 215, and then straight back out of it. Elected in
  place of Lucius Postumius Albinus, who had been killed by the Boii
  in the Po valley before taking up office, Marcellus entered on the
  consulship, it thundered, the augurs declared the election faulty,
  and he abdicated. Livy records what people said the fault really
  was: the senators put it about generally that the gods were
  displeased because two plebeians had been made consuls for the first
  time (23.31.12-14). Quintus Fabius Maximus was elected in his place,
  his third consulship, and Marcellus went back to the army in the
  south as propraetor.
