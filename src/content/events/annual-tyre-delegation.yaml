  notes: >
    The practice is reported as instituted at the founding of Carthage
    and continuing throughout the Punic period. The legendary
    foundation date 814 BCE is the conventional anchor; the practice
    survived in some form until at least Alexander's siege of Tyre in
    332 BCE, after which the metropolitan sanctuary's relationship to
    Carthage was disrupted. Date_end here marks 332 BCE as the
    practical terminus; some sources suggest sporadic continuation
    of contacts even after.
