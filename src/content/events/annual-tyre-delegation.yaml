summary: >
  The recurring annual sacrificial mission Carthage sent to the
  Melqart sanctuary at Tyre throughout the Punic period — one of
  the most explicit and longest-running expressions of the
  metropolis-colony relationship in any Phoenician colonial
  network. The practice is reported by multiple Greek and Roman
  sources and is corroborated by Polybius's discussion of
  Hannibal's diplomatic context: Hannibal vowed his oath against
  Rome at the Tyrian Melqart sanctuary in person before departing
  for Iberia, an act that would have been politically and
  religiously legible only against a long-running tradition of
  Carthaginian engagement with the Tyrian sacred center.

  The delegation took the form of an annual embassy carrying a
  tithe of the Carthaginian state revenue, sacrificial offerings,
  and probably symbolic objects (the surviving descriptions are
  not detailed enough to reconstruct the practice precisely).
  The recipient was the Melqart sanctuary at Tyre — Melqart
  ("king of the city") being the Tyrian patron deity from whom
  Carthage's own civic patronage genealogy descended through
  the foundation tradition. The practice survived the
  political dissolution of the Tyrian state under Persian and
  Macedonian successive overlordship, and continued, in
  attenuated form, until at least Alexander's destruction of
  Tyre in 332 BCE; later contacts are sporadically attested but
  the institutional regularity broke down in the post-332
  period.

  The institutional significance is twofold. First, it is one
  of the principal pieces of evidence that Carthage's
  Phoenician identity remained religiously
  active throughout the Punic period — not merely a
  founding myth but a practiced relationship sustained
  through centuries of independent imperial trajectory.
  Second, the delegation is a useful corrective to readings of
  Carthaginian civilization as having gradually shed its
  Levantine Phoenician roots in favor of a fully Western
  Mediterranean identity: at the level of state religious
  practice, the metropolis-colony tie was a continuous
  reality rather than a historical memory. Quinn's recent
  reframing of "Phoenician" as an external category rather
  than an internal one engages this evidence specifically;
  the annual delegation is one of the data points that the
  reframing has to accommodate.
