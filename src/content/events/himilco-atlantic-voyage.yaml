map_caption: >
  The voyage as the Avienus fragments allow it to be
  reconstructed, drawn onto a modern coastline. The solid
  line is the reasonably argued track from Gades up the
  Atlantic Iberian coast, across the Bay of Biscay, to the
  tin coast of Brittany (the Oestrymnides); the lighter
  dashed lines are the contested far reaches toward the
  Cassiterides and Ierne (Ireland). Whether Himilco reached
  the British Isles at all is unresolved. Positions are
  schematic.
summary: >
  The Carthaginian voyage to Atlantic Europe — the
  northern counterpart to Hanno's better-attested West
  African expedition. Himilco's voyage is preserved only
  in fragmentary form in the late Roman poetic geographer
  Avienus (*Ora Maritima*), who claims to have drawn on a
  now-lost Punic periplus or sailing manual attributed
  to Himilco himself.

  The voyage's reconstructed track is approximately:
  departure from Gades, north along the Atlantic Iberian
  coast, across the Bay of Biscay, and into the waters
  off Brittany and possibly the British Isles. The
  voyage's apparent purpose was commercial-exploratory:
  securing Carthaginian access to the Atlantic tin trade
  that Phoenician-Punic shipping had conducted via Gades
  for centuries, with direct Carthaginian observation
  of the tin-producing regions (probably Brittany;
  possibly the Cassiterides or "tin islands," whose
  identification is contested).

  The Avienus fragments preserve features broadly
  consistent with what is independently known of
  northwestern European Atlantic waters:

  > "There is great quantity of seaweed in those waters,
  > and many sea-monsters move among the slow ships..."
  > "The waters there are calm, the winds slack..."
  > "The voyage takes four months from the Pillars of
  > Heracles to reach the inhabited regions..."

  Whether Himilco actually reached Britain or the
  Cassiterides is contested in modern scholarship; the
  voyage's southward extent (Brittany) is more
  defensibly attested than its northward limit. Either
  way, the voyage represents, paired with Hanno's
  southward African voyage, the only systematic
  state-sponsored Atlantic exploration of the ancient
  Mediterranean world before the Roman imperial period.

  The voyage's strategic significance lies in what it
  preserves of Carthaginian commercial-political
  ambition: a metropolitan power capable of
  long-distance state-sponsored exploration, with
  enough confidence in its Atlantic shipping
  infrastructure to dispatch official expeditions
  beyond the limits of regular commerce. The pairing of
  Hanno's African and Himilco's European voyages is the
  clearest single piece of surviving evidence for
  Carthage's Atlantic strategic horizon.
