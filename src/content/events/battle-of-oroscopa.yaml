summary: >
  The battle of 150 BCE in which Masinissa defeated the Carthaginian army
  under [Hasdrubal the boetharch](/people/hasdrubal-boetharch). The name
  is a modern convenience: Oroscopa is the town Masinissa was besieging
  when Carthage marched against him (Appian *Punica* 70), and Appian does
  not name the battlefield or say where it was.

  Appian (70–73) is the only account. Hasdrubal, with 25,000 foot and 400
  citizen cavalry and 6,000 Numidian horse who had deserted to him, won
  some skirmishes, then followed Masinissa's feigned retreat into a
  desert ringed by hills and crags. The battle lasted from morning to
  night, and Masinissa, eighty-eight and riding bareback in the Numidian
  way, seemed to have the advantage. Scipio Aemilianus, who had come from
  Spain to obtain elephants for Lucullus, watched it from a height and
  later said he had seen 110,000 men join battle, a spectacle granted
  before only to Zeus and Poseidon at Troy.

  Aemilianus tried to arrange terms; Carthage offered the Emporia
  territory and 1,000 talents but refused to hand over the deserters,
  and the talks failed. Masinissa then walled in the Carthaginian camp on
  its hill. Roman envoys arrived with orders to end the war if he was
  losing and to spur him on if he was winning, and they spurred him on
  (72). Hunger and disease wasted the army until it surrendered, and
  Gulussa's cavalry attacked the unarmed men as they came out. Of 58,000,
  Appian says, only a few returned to Carthage (73).

  The battle mattered twice over. Rome treated the war as Carthage's
  breach of the treaty of 201, and it gave Rome its pretext; and it cost
  Carthage an army, 5,000 talents owed to Masinissa and its general,
  whom the city condemned to death to placate Rome (74). See the
  [war with Masinissa](/events/war-with-masinissa).
