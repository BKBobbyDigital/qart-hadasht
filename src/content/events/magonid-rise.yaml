summary: >
  The structural transformation of mid-6th century BCE
  Carthaginian governance, in which Mago I and his sons
  established the Magonid family as the dominant aristocratic
  line of Carthaginian political and military leadership for
  the next century. The shift's principal feature was a
  reorganization of the Carthaginian armed forces from a
  primarily mercenary configuration into a citizen-led
  professional army, with the Magonid family providing the
  hereditary military command class. Justin's narrative (18.7)
  gives Mago and his sons Hasdrubal and Hamilcar the
  successive command authority that produced the western-
  Mediterranean expansion of the second half of the century.

  The Magonid period, conventionally extending from c. 550
  to c. 396 BCE, is the formative phase of Carthaginian
  imperial governance. The family produced the commanders of
  the Battle of Alalia (~535 BCE), the Sardinian and
  Sicilian campaigns of the late 6th and early 5th
  centuries, and the Battle of Himera in 480 BCE (where
  Mago I's grandson Hamilcar commanded). The dynasty's end
  is conventionally placed at the murder of the last
  Magonid commanders Himilco and Mago II in the early 4th
  century BCE, though the precise transition to the post-
  Magonid governance pattern is not securely documented.

  The historicity of specific episodes Justin records is
  contested, but the structural reading, Magonid family
  ascendancy as the central feature of 6th- and 5th-century
  Carthaginian political life, is the consensus modern
  interpretation.
