summary: >
  The diplomatic-political event that opened the Sicilian
  theater of the Second Punic War. Hiero II of Syracuse, who had ruled for 54 years and held the Roman alliance
  consistently across his reign, died in mid-215 BCE,
  shortly after the disaster at Cannae. His successor was
  his grandson Hieronymus, aged about fifteen.

  ## It began in Hiero's own house

  The swing did not start with Hieronymus. Livy says that not
  even the whole house of Hiero kept clear of defection: Gelo,
  the eldest of the line and his father's co-regent, despising
  at once his father's old age and the Roman alliance after
  Cannae, went over to the Carthaginians, and would have
  overturned things in Sicily had he not been carried off by a
  death so timely as to cast suspicion even on his father, while
  he was arming the populace and working on the allies
  (23.30.10-12). So a Syracusan heir had declared for Carthage
  and was raising the city while Hiero was still alive.

  ## Who approached whom

  The initiative was Syracusan, as it was in Italy. Hieronymus
  sent envoys to Hannibal, and Hannibal answered by sending
  another Hannibal, the commander of his triremes, together with
  Hippocrates and the younger Epicydes. Polybius calls the
  brothers Syracusans who had been serving under Hannibal for
  some time, having adopted Carthage as their country because
  their grandfather had been exiled from Syracuse on suspicion
  of murdering Agatharchus, one of the sons of
  [Agathocles](/people/agathocles); their mother was
  Carthaginian (Polybius 7.2.3-4; Livy 24.6.1-2). They were not
  Hannibal's opening move but his answer to an approach.

  When the Roman praetor at Lilybaeum sent to renew the treaty
  made with his ancestors, Hieronymus said in front of the Roman
  envoys that he was sorry for them, wiped out by the
  Carthaginians in Italy, and when they asked who said so he
  pointed at the Carthaginians in the room and invited them to
  refute it. He then asked why, shortly before his grandfather's
  death, they had sailed as far as Pachynus with fifty ships and
  turned back. They admitted they had heard Hiero was dead and
  had come to protect a boy's throne. His reply is the best line
  anyone in this episode is given: allow me too, Romans, to keep
  my throne by turning round and steering for what I expect from
  Carthage (Polybius 7.3).

  ## Two treaties, not one

  Hieronymus sent Agatharchus, Onesigenes and Hipposthenes to
  Carthage with terms: Carthage to help with land and sea
  forces, and once the Romans were expelled the island to be
  divided at the river Himeras, which, Polybius notes, very
  nearly bisects Sicily. Carthage was accommodating on every
  point. Then Hippocrates and Epicydes worked on the king in
  private, telling him that nobody had a better right to rule
  the whole of Sicily, since he was the son of Nereis daughter
  of [Pyrrhus](/people/pyrrhus), the only man all the Sicilians
  had accepted as leader out of affection, and the heir of
  Hiero. While the first embassy was still negotiating he sent a
  second claiming the whole island as his by right, offering to
  help Carthage in Italy if Carthage helped him recover Sicily.
  Polybius says the Carthaginians now saw the young man's
  instability plainly and agreed anyway, because abandoning
  Sicily was against their interests (7.4).

  Two things follow. The site's older version of this page had a
  single treaty granting Syracuse rule over Greek Sicily; there
  were two, and the first is the interesting one, because an
  equal partition at the Himeras is a Carthaginian war aim
  stated in a document and it is the old frontier of the Punic
  province. And the second shows what an ally could extract from
  Carthage in 214: Carthage conceded a claim to the whole island
  it had fought two wars over, to a fifteen-year-old its own
  negotiators thought deranged, because it needed the harbors.

  ## The end of him

  Hieronymus reigned about thirteen months and was killed in an
  ambush at Leontinoi in 214 (Polybius 7.7.3). Who arranged it
  is not recoverable. MacDonald notes that Rome had the most to
  gain and that Roman agents are entirely possible, but also
  that there was a substantial anti-monarchist party at
  Syracuse, and the site does not pick. The killing of
  Adranodorus followed, and then the slaughter of every surviving
  member of Hiero's family, women and children included (Livy
  24.25-26). The new government moved toward Rome; Hippocrates
  and Epicydes, by then elected to magistracies in Syracuse,
  seized the city instead.

  The defection's strategic significance was substantial:
  for the only time in the Second Punic War, Carthage
  acquired an active Greek-state ally in the central
  Mediterranean, with the strategic possibility of
  Sicilian resupply for Hannibal's Italian operation. The
  Roman response was the multi-year Sicilian campaign that
  closed the theater by 210 BCE.
