summary: >
  The two-year Roman siege of Syracuse from 213 to 211 BCE,
  the engagement that ended Carthaginian-Sicilian alliance and
  preserved one of the most-cited episodes of the
  Second Punic War's secondary theater. Following the death of
  Hiero II of Syracuse in 215 BCE and his grandson Hieronymus's
  pro-Carthaginian alignment (a brief tyranny ended by
  assassination in 214), Syracuse formally aligned with Carthage
  through the influence of two Carthaginian-allied politicians,
  Hippocrates and Epicydes. Roman response was the dispatch of
  Marcus Claudius Marcellus with consular forces in 213 BCE.

  The siege was substantially prolonged by Syracusan defensive
  engineering, attributed in the surviving sources principally
  to Archimedes. Polybius (8.3-7) and Plutarch (*Marcellus*
  14-17) preserve detailed accounts of the defensive engines:
  catapults of varying ranges; the so-called "claw of
  Archimedes" that lifted Roman ships out of the water and
  dropped them; specialized siege-tower-counter weapons.
  Marcellus reportedly observed that Archimedes was "playing
  ball with the Roman ships." The Roman naval assault was
  repulsed; the Roman land assault was contained for nearly
  two years.

  ## Henna, and a method that failed

  While the blockade held, the war moved into the interior, and
  the worst thing in it is also the clearest test of a policy.
  Morgantina betrayed its Roman garrison and went over (Livy
  24.36.9-10). At Henna, in the center of the island, the Roman
  garrison commander trapped the townspeople in the theater and
  had them cut down, an unarmed crowd crushed in flight as much
  as killed, and the troops then ran through the town as though
  it had been stormed. Livy's verdict on it is a shrug with a
  hesitation in it: Henna was held by a crime, whether wicked or
  necessary. Marcellus, he says plainly, did not disapprove of
  the deed and gave the plunder of the Hennans to his soldiers,
  reckoning that the Sicilians would be frightened out of
  betraying garrisons (24.39.7).

  They were not. Livy says the news went through the whole of
  Sicily in nearly a day, and that because people thought an
  unspeakable slaughter had violated the dwelling of gods as
  well as of men, those who had been wavering before now went
  over to the Carthaginians (24.39.8).

  MacDonald observes that this was the same deterrent Marcellus
  had used in Campania at Nola, where he had executed more than
  seventy men for treating with the enemy after the
  [engagement of 216](/events/first-battle-of-nola), and that he
  seems to have been mistaken in Sicily. The observation is worth
  keeping with the qualification that the two are not the same
  act: Nola was a judicial inquiry with condemnations, Henna a
  massacre by a garrison that Marcellus approved after the fact.
  What they share is the reasoning, and in Livy the reasoning is
  stated for Henna and the result is stated against it.

  ## The sea

  Carthage did not abandon the city. Bomilcar broke out of the
  Roman blockade with thirty-five ships in a heavy sea, reported
  at Carthage, and returned within a few days with a hundred
  ships and provisions (Livy 25.25.11-13). MacDonald notes that
  Livy does not say whether the hundred included the thirty-five,
  and that on the likelier reading Carthage found another
  sixty-five hulls at short notice in 212. That bears on the
  question of what Carthaginian naval capacity actually was
  during the war, which the site treats as unsettled.

  Roman success came through penetration of an undefended
  section of wall during a religious festival in spring 212
  BCE, followed by a year of street fighting and starvation
  in the city's outer districts before the citadel surrendered
  in spring 211. During the sack, Archimedes was killed by a
  Roman soldier (in circumstances preserved with multiple
  variant accounts; see his page). Marcellus reportedly was
  furious at the death and ordered the mathematician's burial
  with honors.

  The Carthaginian relief expedition under Himilco that had
  attempted to break the siege was defeated and largely
  destroyed. The war in Sicily did not end with the city,
  though: after Marcellus sailed, a Punic fleet landed eight
  thousand foot and three thousand Numidian horse, several towns
  went back over, and Muttines's Numidians ranged over the whole
  island burning the lands of Rome's allies (Livy 26.21). The
  theater closed in 210 at
  [Agrigentum](/events/fall-of-akragas-210), and it closed
  through a quarrel in the Carthaginian command rather than
  through Roman arms.

  ## What was carried away, and what was said about it

  Livy puts the famous judgment at the moment of the capture.
  Marcellus took the ornaments of the city, the statues and
  paintings in which Syracuse abounded, to Rome; they were the
  enemy's spoils and acquired by the law of war, but from this
  came the first beginning of admiring Greek works of art and of
  the license to plunder everything sacred and profane alike,
  which in the end turned against Roman gods, and first of all
  against the very temple Marcellus had adorned so handsomely
  (25.40.1-3). The verdict is written about a century and a half
  later, by a man explaining his own age to itself, and should be
  read as that.

  The contemporary objection is better evidence and is not
  usually quoted. Polybius devotes a chapter to it. A city is not
  adorned by external splendors but by the virtue of its
  inhabitants; the Romans decided to transfer all of it and leave
  nothing behind; much can be said on both sides, but the weightier
  arguments are that they were wrong to do it. If they had risen by
  such things it would be reasonable to bring them home, but they
  had conquered while living the simplest of lives and beating
  people who owned the finest examples of this kind of work, so to
  abandon the victors' habits and imitate the conquered's was an
  error, and it attached to them the envy that follows such
  possessions. Nobody looking at the objects admires the luck of
  those who took another's property; he pities and envies the
  people they came from (9.10).

  That is worth holding onto when the site discusses Polybius's
  framing. The same book contains the fullest praise of
  [Hannibal's](/people/hannibal-barca) generalship anywhere in his
  history, for the march on Rome in 211, and the sharpest criticism
  of Roman conduct he ever wrote.

  ## The triumph that was not one

  Marcellus came home and asked the senate, at the temple of
  Bellona, to be allowed to enter the city in triumph. He was
  refused. Livy gives the argument: it was inconsistent to have
  decreed a thanksgiving in his absence and then deny him a triumph
  in person, but equally inconsistent to let a man triumph as though
  the war were finished when he had been ordered to hand his army
  to a successor, which was decreed only when war remained in the
  province, and when the army that was the witness to a triumph's
  merit was absent. The middle course was an ovation. He triumphed
  on the Alban Mount the day before, and entered the city on foot
  the next (26.21). MacDonald suggests the refusal came from rivals
  in the senate resisting his growing reputation; that is possible
  and it is not what Livy says, and the reason Livy does give is a
  good one, since the war in Sicily was in fact not over.

  The procession is worth recording for what Rome chose to show.
  Catapults and ballistas, a representation of the captured city,
  the furniture of a long peace and a royal treasury, worked silver
  and bronze, precious cloth, and the noble statues with which
  Syracuse had been adorned among the first cities of Greece. Eight
  elephants walked as the sign of a Punic victory. And at the head
  of it, in golden crowns, came Sosis of Syracuse and Moericus the
  Spaniard, the men who had given Rome the city: Sosis had guided
  the night entry, Moericus had handed over Nasus and its garrison.
  Both were voted citizenship and five hundred iugera of land.

  Set that beside what Fabius is said to have done at
  [Tarentum](/places/tarentum) two years later, where the Bruttians
  who opened the gate were cut down, in Plutarch's version so that
  the capture should not be known to be owed to treachery. Two
  cities taken by betrayal within two years, and Rome paraded the
  betrayers of one in gold and killed the betrayers of the other.
