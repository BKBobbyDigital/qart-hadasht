summary: >
  A mid-6th-century BCE Carthaginian political crisis,
  preserved almost entirely in Justin's epitome of Trogus
  (18.7). Justin's narrative: the general Malchus campaigns
  successfully in Sicily; is sent to Sardinia and there
  suffers a defeat; the Carthaginian senate exiles him and
  his army in punishment; Malchus marches the exiled army
  back on Carthage, takes the city by force, briefly rules,
  and is in turn defeated and executed — possibly by Mago I's
  faction. Justin's account is dramatized with literary set-
  pieces (the gruesome punishment of Malchus's son Carthalo,
  the senatorial deliberations) that are conventionally
  treated as Hellenistic tragic-pattern elaboration rather
  than preserved historical detail.

  The historicity of specific episodes is genuinely
  contested. Modern scholarship divides between treatments
  that take Justin's narrative as a substantially accurate
  preservation of a real political crisis, treatments that
  treat it as wholly literary fabrication, and treatments
  that accept the structural claim, that 6th-century
  Carthaginian governance included episodes of senatorial-
  military conflict severe enough to produce exile and
  execution outcomes, while remaining agnostic about the
  specific narrative. The third position is the consensus
  in current scholarship.

  The episode matters as one of the very few surviving
  windows on 6th-century Carthaginian political culture
  beyond inscriptions and treaty records. Whatever its
  exact historicity, the Malchus narrative preserves a
  Hellenistic-era understanding of how Carthaginian power
  could fracture between commanders and senate — a pattern
  the much-better-documented 3rd century would repeat.
