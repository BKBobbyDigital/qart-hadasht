    notes: >
      Diodorus (14.77) reports that the Carthaginian state, after
      its 396 BCE Sicilian disaster — the siege of Syracuse
      collapsed under a devastating plague that the Carthaginian
      command and the surviving Greek tradition both interpreted as
      divine punishment for Carthaginian impieties against Greek
      sanctuaries — formally adopted the cult of Demeter and Kore
      as a state religious institution at Carthage. The adoption is
      one of the few documented moments of explicit Carthaginian
      cultic absorption from the Greek world.
summary: >
  Around 396 BCE, in the aftermath of the disastrous Carthaginian
  siege of Syracuse and the plague that destroyed the besieging
  army (treated under
  [the 396 BCE Sicilian disaster event](/events/siege-of-syracuse-and-plague-396)),
  the Carthaginian state formally adopted the cult of Demeter and
  Kore — the Greek mother-and-daughter agricultural deities
  whose principal Sicilian sanctuary the Carthaginian armies were
  reported to have desecrated during the campaign — as a state
  religious institution.

  Diodorus (14.77) preserves the report and treats the adoption
  as a substantive Carthaginian-religious response to the
  perceived divine retribution. The episode is one of the most
  explicit documented moments of Carthaginian cultic absorption
  from the Greek world; it stands alongside the broader pattern
  of Punic-Hellenistic religious interaction treated under the
  [Punic religion theme](/themes/punic-religion) and the
  [Carthage as cultural integrator editorial take](/editorialTakes/carthage-as-cultural-integrator).

  The substantive significance of the episode is partly literary
  (a Greek-source moralizing narrative about Carthaginian
  impiety meeting its divine consequences) and partly
  institutional (the formal state-cult adoption of Greek
  deities is unusual in the Carthaginian record and indicates
  the kind of pragmatic cultic openness the broader Carthaginian
  religious tradition operated with). The site reads it within
  the broader pattern of Carthaginian agency in cultural-religious
  absorption rather than as passive Greek influence.
