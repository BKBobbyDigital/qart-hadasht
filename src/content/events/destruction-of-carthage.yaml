summary: >
  The Roman siege of Carthage (149–146 BCE) and the destruction of the
  city in spring 146. After Carthage refused to abandon its site, the
  consuls of 149 tried the walls and failed; the Carthaginians burned
  part of their fleet with fireships and kept an army in the field under
  Hasdrubal (Appian *Punica* 97–99, 102–104). In 148 Piso attacked the
  towns of the interior instead (110). Inside the city Hasdrubal had his
  rival, Masinissa's grandson Hasdrubal, beaten to death in the assembly
  on a charge of treason (111).

  Scipio Aemilianus arrived as consul in 147. He drove Hasdrubal's army
  into the city by a night attack on the suburb of Megara, walled off the
  isthmus, and began a mole across the harbor mouth. The Carthaginians cut
  a new entrance and sailed out a fleet built from old timber, but lost
  the sea battle that followed; Scipio then took the quay outside the
  walls and, that winter, destroyed the last Carthaginian army at
  Nepheris (113–126). Hasdrubal, now commanding in the city, had Roman
  prisoners tortured on the walls in sight of their comrades and put to
  death councillors who objected (118); Polybius describes him as a
  corpulent braggart in armor and a purple cloak, refusing Scipio's offer
  of safety for himself and ten families (38.7–8).

  In spring 146 the Romans took the wall of the naval harbor and the
  forum, looted the gold of the temple of Apollo, and fought for six days
  and nights up the three streets to the Byrsa, burning them as they went
  (127–130). On the seventh day 50,000 men and women came out under guard.
  Hasdrubal slipped out to surrender; the Roman deserters burned
  themselves in the temple of Aesculapius (Eshmun), and his wife, after
  reproaching him, died in the fire with their two sons (Polybius 38.20;
  Appian 131). Scipio returned to the Sicilian cities the treasures
  Carthage had taken from them, and the senate's commissioners ordered
  whatever remained obliterated and forbade anyone to live on the site;
  Carthage's territory became a province under an annual praetor (Appian
  133–135). A fire of seventeen days (Orosius) and a plow over the ruins
  (Modestinus) are late details, and the salting of the earth is not
  ancient at all; see the
  [claim on the final assault](/claims/tpw-final-assault-destruction).

  Polybius was present with Scipio. A fragment of his own account survives
  in which Scipio grasps his hand and says he fears the same fate for Rome
  (38.21); Appian and Diodorus add the tears and the lines from Homer, and
  name Polybius as their witness. Most of Polybius's narrative is lost, and
  the continuous account is Appian's, written about three centuries later.
