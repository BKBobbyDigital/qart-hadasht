summary: >
  The Roman embassy to Africa, conventionally dated to 153 BCE, on which
  M. Porcius Cato served, and which the ancient tradition makes the
  starting point of his campaign for Carthage's destruction. It was sent
  to arbitrate another of the border disputes between Carthage and
  Masinissa, and it never did. Masinissa, confident of Roman support,
  accepted arbitration. The Carthaginians, fearing from past experience
  that they would not receive justice, refused to let the treaty made
  with Scipio be reopened and asked only that violations of it be
  judged; the envoys would not rule on the dispute piecemeal and went
  home (Appian *Punica* 69).

  What mattered was what they saw. Appian says they found the country
  carefully cultivated, with large estates, and a city grown in wealth
  and population since Scipio's victory, and that Cato told the senate
  Rome's liberty would never be secure until Carthage was destroyed
  (*Punica* 69). Plutarch's Cato found Carthage full of fighting men,
  overflowing with wealth, and stocked with arms and military supplies,
  and warned the senate of the danger (*Cato Major* 26). The summary of
  Livy records a later embassy rebuking the Carthaginian senate for
  collecting an army and ship timber contrary to the treaty (*Periochae*
  48). In the sources, then, Carthaginian recovery is presented as
  rearmament, a security threat, rather than as prosperity alone.

  From his return until his death in 149, Cato argued for Carthage's
  destruction, reportedly ending his speeches in the senate with the
  demand whatever the subject, while Scipio Nasica argued that Rome
  needed Carthage as a rival to keep its own discipline (Plutarch *Cato
  Major* 27; *Periochae* 48). Appian says the senate resolved on war at
  this point but waited for a pretext; Polybius, the contemporary
  witness, establishes only that war had been decided before the
  Carthaginian surrender of 149. How far the embassy changed Roman
  policy, rather than becoming its most memorable symbol, is weighed in
  the editorial take
  [Why was Carthage destroyed in 146 BCE?](/editorialTakes/destruction-not-weak-enough)
  (See claim: cato-delenda-est-historicity for the transmission of the
  famous formula.)
