summary: >
  The decisive naval engagement that ended the First Punic War. After
  twenty-three years of fighting, Rome had constructed a new fleet of
  approximately 200 quinqueremes financed by private subscription
  from wealthy citizens, the treasury being depleted. The Roman
  consul Gaius Lutatius Catulus took command of the new fleet in
  the summer of 242 BCE and operated it off western Sicily through
  the autumn and winter, blockading the Carthaginian-held ports and
  drilling his crews in conditions where Carthage could not contest
  him at sea. Carthage assembled a relief fleet under Hanno through
  the winter, intending to resupply Hamilcar Barca's land forces at
  Mount Eryx and then take on Lutatius with experienced rowers
  detached from Hamilcar's army. Hanno arrived first. Lutatius
  intercepted him in the channel between the Aegates Islands and
  the Sicilian coast on 10 March 241 BCE. The Carthaginian ships,
  weighted with supplies and crewed by inexperienced rowers, were
  defeated decisively. Polybius reports approximately 50 Carthaginian
  ships sunk and 70 captured; the Roman losses were substantially
  smaller. The defeat eliminated Carthaginian capacity to continue
  the war and produced direct negotiations between Lutatius and
  Hamilcar that became the Treaty of Lutatius.

  The engagement is now exceptionally well documented
  archaeologically. The Marsala Punic Warship — the only surviving
  Punic-period warship hull anywhere, recovered off Lilybaeum in
  1971 — is plausibly a casualty of this battle or its surrounding
  operations. The Egadi Islands Bronze Warship Rams — twenty-seven
  recovered from the seabed since 2010, with Punic inscriptions
  invoking Baal on the Carthaginian examples and Latin construction
  marks on the Roman examples — preserve direct physical evidence
  of the ram-against-ram engagement Polybius described.
