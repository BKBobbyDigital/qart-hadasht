summary: >
  The three Carthaginian relief operations across 213-211 BCE
  that attempted to break the Roman siege of Syracuse and
  preserve the Sicilian-Carthaginian alliance. None succeeded;
  the cumulative failure produced the closing of the
  Carthaginian Sicilian theater by 210 BCE.

  The three operations:

  1. Himilco's expedition (213 BCE). A substantial
     Carthaginian force landed at Heraclea Minoa on the
     southwestern Sicilian coast and advanced inland. The
     expedition recovered most of the Sicilian interior
     from Roman control and established Carthaginian
     positions in support of Syracuse, but could not
     directly threaten Marcellus's siege lines around
     Syracuse itself. Himilco wintered in Sicily without
     achieving relief.
  2. Bomilcar's naval relief (212 BCE). A Carthaginian
     fleet under the admiral Bomilcar carried supplies and
     reinforcements toward Syracuse during the siege.
     Bomilcar's force reached the harbor approaches but,
     facing the Roman fleet under Marcellus's command,
     withdrew without attempting to force the engagement.
     Polybius and Livy treat the withdrawal as failure of
     nerve; modern reconstructions are more sympathetic to
     the operational difficulty Bomilcar faced.
  3. Final relief failure (212-211 BCE). A combined
     Carthaginian-Syracusan effort to break the siege
     through coordinated land-and-sea action collapsed
     under the plague that swept the Carthaginian land
     camp during the late summer of 212. Himilco and
     Hippocrates both died in the plague; the relief force
     dispersed.

  The strategic outcome: by spring 211, Syracuse was on its
  own. The siege's fall in spring 211 was the consequence as
  much of relief failure as of Roman pressure.
