summary: >
  The first engagement between Hannibal and a Roman force on
  Italian soil, fought in the late autumn of 218 BCE shortly
  after Hannibal's descent from the Alps. The engagement was a
  cavalry skirmish rather than a major battle: Hannibal's
  combined Numidian and Iberian horse, screened by light
  troops, met the Roman cavalry under the consul Publius
  Cornelius Scipio (the elder, father of the future Africanus)
  near the Ticino river west of Placentia. The Carthaginian
  cavalry's tactical superiority, particularly the Numidians'
  capacity for envelopment, broke the Roman force. Polybius has
  the Romans scatter with a few men gathered closely round the
  consul, who was severely wounded and withdrew his army to
  safety in consequence (3.65, 3.66.2).

  The famous detail, that Scipio was saved by his teenage son,
  the future Africanus, is not in Polybius's account of the
  battle. It appears later, in his digression on the younger
  Scipio, where he gives it on Laelius's authority (10.3), and
  [Coelius Antipater](/sources/coelius-antipater) gave the
  credit to a Ligurian slave instead. Livy reports both and
  prefers the son, on the ground that more authorities recorded
  it. The site treats the
  [rescuer as unresolved](/claims/ticinus-young-scipio-rescue).

  The Roman defeat at the Ticinus, combined with Scipio's
  wound, set the conditions for the engagement at the Trebia,
  where the wounded Scipio's caution was overruled by his
  consular colleague Sempronius Longus.
