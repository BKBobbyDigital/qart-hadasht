summary: >
  The declaration of war in 149 BCE and the demands that followed it,
  which ended with Rome ordering the Carthaginians to abandon their city.
  Appian (*Punica* 75–93) gives the fullest account, with Polybius
  (36.2–6) and Diodorus (32.6) for parts of it.

  When Utica went over to Rome, Carthage sent envoys with full powers.
  They found war declared and the consuls, Manius Manilius and Lucius
  Marcius Censorinus, already sailing with 80,000 foot and about 4,000
  horse, under secret orders, Appian says, not to stop until Carthage was
  razed (75). The envoys surrendered Carthage to Rome's discretion. The
  senate promised freedom, laws, territory and property, and said nothing
  of the city itself, which Polybius says alarmed the Carthaginians and
  Diodorus says concealed the intention to destroy it (Polybius 36.3–4;
  Diodorus 32.6).

  The demands then came one at a time:

  - Hostages: three hundred children of the leading families, sent to the
    consuls at Lilybaeum within thirty days. Carthage sent them early.
  - Arms: at Utica the consuls demanded every weapon, and received armor
    for 200,000 men, countless javelins and 2,000 catapults (Appian 80).
  - The city: Censorinus told the envoys to yield Carthage and settle at
    least eighty stades (about fifteen kilometers) from the sea, "for we
    are resolved to raze your city to the ground" (81). The envoy Banno
    pleaded that this broke Rome's promise and its piety toward the gods;
    Censorinus answered that the sea had been Carthage's ruin, that its
    temples and tombs would be spared, and that Rome had promised freedom
    to the Carthaginians, not to the ground they lived on (83–89).

  When the envoys reported, the crowd killed senators who had advised
  compliance and Italians caught in the city. The same day the senate
  declared war, freed the slaves, reinstated the condemned Hasdrubal as
  general outside the walls, and turned temples and squares into
  workshops (92–93). The consuls, perhaps hesitating, did not attack at
  once (94).

  Whether the sequence was designed to be refused is weighed in the
  [claim on the 149 demands](/claims/149-demands-as-deliberate-trap): the
  sources attest the intention to raze the city and its concealment, but
  not an expectation of refusal, and acceptance would have ended the city
  as surely as war.
