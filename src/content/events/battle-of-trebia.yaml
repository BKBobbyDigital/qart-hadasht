summary: >
  Hannibal's first major Italian victory and the engagement that
  established the operational pattern of his subsequent
  Italian campaigns: deliberate engagement of a Roman field army
  on terms favoring Carthaginian preparation, with concealed
  reserves and exploitation of Roman command-political
  pressures. The Roman force of approximately 40,000 was drawn
  by light Carthaginian skirmishers across the cold Trebia
  river before breakfast and engaged in poor condition;
  Mago Barca's concealed reserve of approximately 2,000 picked
  troops emerged from a watercourse to attack the Roman rear at
  the engagement's critical moment. Approximately 20,000 Romans
  were killed; Carthaginian losses were comparatively light.
  The consul Sempronius Longus survived; his colleague Scipio
  the elder, who had counseled against engagement, withdrew the
  remnants to Placentia. Hannibal had won his first major
  Italian victory within weeks of arriving from the Alps.
