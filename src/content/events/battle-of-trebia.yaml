summary: >
  Hannibal's first major Italian victory, and the engagement that
  set the pattern of the campaigns that followed: a Roman field
  army brought to battle on ground and at an hour of Hannibal's
  choosing, with a concealed reserve and with the rivalries of
  the Roman command doing part of the work.

  ## The approach

  After the Ticinus the Romans fell back across the Trebia and
  camped in the hills east of it, waiting for the second consular
  army. Sempronius Longus had been at Lilybaeum preparing to
  invade Africa and was recalled; his men reached Ariminum either
  by sea up the Adriatic, as Livy has it, or overland under oath
  to assemble there on a fixed day, as in Polybius (3.68.14;
  Livy 21.49-51). Hannibal camped some forty stades off, across
  the river. In the meantime Clastidium went over: Polybius says
  the town was betrayed by a man of Brundisium to whom the
  Romans had entrusted it, and Livy names him Dasius and gives
  the price as four hundred gold pieces (Polybius 3.69.1; Livy
  21.48). It was the Roman grain depot for the region, and the
  first Italian to sell Hannibal a position was bought rather
  than won over.

  ## The battle

  Polybius puts it near the winter solstice on a day of snow and
  rain. The Numidian horse rode up to the Roman camp at first
  light to draw the Romans out, Hannibal's hope being to engage
  them before they had eaten or prepared (3.71.10). His own men
  had breakfasted and oiled themselves at their fires. The Romans
  crossed the Trebia breast-high and came on cold and unfed
  (3.72.1-4). Hannibal screened his line with about eight
  thousand pikemen and slingers and drew up some twenty thousand
  Spanish, Celtic and African foot in a single line, with more
  than ten thousand horse on the wings and the elephants in front
  of them; the Roman foot were about sixteen thousand Romans and
  twenty thousand allies (3.72.7-13).

  Before dawn Hannibal had sent his brother Mago, "still quite
  young, but full of martial enthusiasm", into the watercourses
  of the plain with a force picked by a method Polybius describes:
  a hundred horsemen and a hundred infantry, each told to choose
  ten of the bravest from his own company, making a thousand of
  each (3.71.5-9). They struck the Roman rear once the lines were
  engaged. Ten thousand Romans or more cut their way out and held
  together as far as Placentia; most of the rest were killed near
  the river by the elephants and the cavalry. Polybius gives no
  total for the Roman dead. Carthaginian losses fell chiefly on
  the Celts, and in the cold that followed many men and horses
  died and every elephant but one (3.74).

  Scipio the elder, wounded and against the engagement, withdrew
  the remnants to Placentia. Hannibal had won his first pitched
  battle against Rome within weeks of coming down from the Alps.
