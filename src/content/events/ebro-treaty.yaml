summary: >
  The principal Roman-Carthaginian agreement of the inter-war
  period, negotiated in 226 BCE between Hasdrubal the Fair
  and a Roman diplomatic mission concerned about the
  expanding Carthaginian Iberian project. The treaty's
  central provision is firmly attested in Polybius:
  Carthaginian armed operations were not to cross the Ebro
  river. The agreement effectively recognized Carthaginian
  control of the Iberian peninsula south of the river while
  reserving the territory north of it as a Roman sphere of
  interest.

  The treaty's terms beyond this central provision are
  imperfectly preserved. The most consequential interpretive
  question — whether the agreement specifically excluded
  Saguntum (a Roman ally located south of the Ebro) from
  the Carthaginian sphere — became the central diplomatic
  question of the decade leading to the Second Punic War.
  Polybius's account suggests the Saguntum question was
  addressed; Roman tradition (Livy) emphasizes Saguntine
  immunity as a separate prior agreement; the modern
  scholarly literature treats the question as genuinely
  contested. Hannibal's siege of Saguntum in 219 BCE forced
  the question and produced Roman declaration of war in
  spring 218 BCE.
