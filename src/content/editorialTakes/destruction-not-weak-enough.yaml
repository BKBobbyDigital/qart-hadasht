slug: destruction-not-weak-enough
subject_question: >
  Why was Carthage destroyed in 146 BCE despite the Treaty of
  201's apparent success in reducing the city to a permanently
  constrained Mediterranean power?
subject_entity:
  type: event
  slug: third-punic-war
  role: subject
position: >
  Carthage was destroyed in 146 BCE not because it had become
  weak but because it had not become weak enough. The Treaty
  of 201 had reduced Carthage to a regional African polity,
  stripped of its capacity for Mediterranean military
  projection, and across the half-century that followed the
  city met its indemnity obligations, accepted Numidian
  encroachment on its own territory under Roman cover, and
  refrained from independent foreign policy as the treaty
  required. By the time Cato's commission visited Carthage in
  153 BCE the city had visibly recovered: prosperous markets,
  a busy harbor, the African agricultural hinterland producing
  again. That recovery is what produced the destruction. The
  Roman senatorial faction that decided to destroy Carthage
  did so in response to its visible vitality, not in response
  to any specific Carthaginian threat or treaty violation. The
  150 BCE war with Masinissa provided the legal pretext, but
  the strategic decision had been made earlier. The 149 BCE
  demand sequence was designed to convert that decision into
  action.
reasoning: |
  The "not weak enough" reading is the modern consensus, and
  it sits in real tension with the surviving Roman tradition,
  which frames the war as a response to Carthaginian
  aggression (the Masinissa expedition) rather than a Roman
  choice. Three observations support the modern reading.

  Cato's 153 commission report is the pivot. What Cato saw at
  Carthage — a prosperous, peaceful, commercial city — was not
  what the Treaty of 201 had been designed to produce in
  perpetuity. The senate's reception of Cato's report, and
  the decade of advocacy for destruction that followed, is
  the political mechanism through which the strategic
  decision was made. Whatever specific border dispute had
  triggered the commission, the policy shift Cato produced
  was about Carthaginian recovery, not about any specific
  Carthaginian threat.

  The 149 demands were designed for refusal. The escalating
  sequence (hostages, which Carthage could comply with;
  disarmament, which Carthage could also comply with;
  relocation sixteen kilometers inland, which a maritime
  commercial city could not) has the shape of an instrument
  designed to convert a settled strategic objective into
  action, not the shape of a real negotiation. The claim
  [149-demands-as-deliberate-trap](/claims/149-demands-as-deliberate-trap)
  develops this. Polybius and Appian preserve the sequence;
  the trap reading is the reconstruction from how the
  sequence is shaped.

  The Masinissa pattern was Roman as much as Numidian. Over
  fifty years, every Carthaginian-Numidian arbitration
  produced Roman commissions ruling for Masinissa, and every
  Carthaginian appeal to Roman protection of treaty rights
  was refused. The pattern was consistent enough that, even
  without conscious Roman strategic design, it produced the
  same end result: Carthaginian territorial loss under Roman
  cover, with the only Carthaginian alternative being a
  treaty-violating military response. The 150 BCE war was
  the predictable conclusion of the configuration.

  The position is contested in the surviving Roman tradition
  but broadly consistent across modern scholarship. Hoyos,
  Goldsworthy, and Miles all converge on the deliberate
  Roman decision reading, with variations in the specific
  causal mechanism. The site takes the modern consensus as
  the better-supported reading despite the surviving Roman
  tradition's contrary framing.
confidence: moderate
weighed_claims:
  - 149-demands-as-deliberate-trap
competing_positions:
  - position: >
      The destruction was the appropriate Roman response to
      genuine Carthaginian treaty violation in the 150 BCE
      Masinissa war. Roman intentions in 149 were not
      pre-settled; the escalating demand sequence was an
      attempt at coercive diplomacy that Carthage chose to
      refuse.
    why_rejected: >
      Under-weights the fifty-year pattern of Roman
      commissions ruling for Masinissa (which made some
      Carthaginian military response eventually unavoidable),
      the timing of Cato's decade of advocacy (which preceded
      the 150 war), and the designed-for-refusal shape of the
      149 demand sequence. The Roman-tradition framing is
      preserved but reads better as retrospective legal
      justification than as a description of how the decision
      was actually made.
    held_by: >
      The surviving Roman tradition (Polybius's preserved
      framing in part, Appian's framing, Livy's coverage) and
      some nineteenth-century scholarship.
  - position: >
      The destruction was overdetermined. Specific causal
      mechanisms (Cato's advocacy, Masinissa's encroachment,
      the 149 demands) matter less than the long-run fact of
      Roman Mediterranean expansion making any independent
      Carthaginian polity eventually intolerable.
    why_rejected: >
      This is compatible with the site's reading rather than
      competing with it. It downplays the contingent role of
      specific decisions (Cato's commission, the design of
      the 149 demand sequence) but does not actually
      contradict the "not weak enough" framing. We treat it
      as a compatible alternative emphasis rather than a
      rival position.
    held_by: >
      Some structural-historical readings that emphasize
      long-arc causation over specific decision mechanisms.
