slug: destruction-not-weak-enough
subject_question: >
  Why was Carthage destroyed in 146 BCE despite the Treaty of
  201's apparent success in reducing the city to a permanently
  constrained Mediterranean power?
subject_entity:
  type: event
  slug: third-punic-war
  role: subject
position: >
  Carthage was destroyed in 146 BCE not because it had become weak but
  because it had not become weak enough. The Treaty of 201 largely did
  what it was designed to do. It ended Carthage as a Mediterranean
  military power: no territory overseas, no war fleet beyond ten
  triremes, no war outside Africa, and no war inside Africa without
  Roman consent. It did not make Carthage poor. Over the next
  half-century the city paid its indemnity, kept within the treaty's
  limits on war while it contested Masinissa's territorial claims
  through appeals to Rome, and recovered its wealth, its population and
  its farmland. By the 150s influential Romans, Cato most visibly, read
  that recovery as a threat: Plutarch has Cato report a city full of
  fighting men, money and weapons, and Livy's summaries record Roman
  envoys complaining of an army and ship timber gathered against the
  treaty. The treaty had succeeded without making Carthage disappear,
  and a later generation of Romans decided that was not enough.
  Carthage's war against Masinissa in 150 gave Rome a genuine treaty
  breach and its formal reason for war, though Masinissa had broken the
  treaty first by besieging a Carthaginian town, and his destruction of
  the Carthaginian army that year left the city much weakened before Rome
  moved (Appian *Punica* 70–74). The demands of 149 show what
  Rome wanted by then: after Carthage gave hostages and surrendered its
  weapons, it was ordered to abandon the city and settle inland, terms
  under which acceptance and refusal alike ended Carthage as it
  existed.
reasoning: >
  Rome's formal justification was the treaty breach. The summary of
  Livy's lost book lists it: ships held against the treaty, an army led
  beyond Carthage's borders, and war on Masinissa, a friend and ally of
  the Roman people (*Periochae* 49). The breach was real. The question is
  whether it explains a war of elimination, and two ancient witnesses
  say it does not. Polybius, who was at the siege with Scipio
  Aemilianus, says the Romans had resolved on war and were looking for
  an occasion that would seem just to foreign opinion, and that the
  Carthaginian envoys who came to surrender in 149 found war already
  decided and the armies on their way (36.2–3). Appian says that after
  the embassy on which Cato served, the senate resolved on war but
  waited for a pretext and concealed its intention (*Punica* 69).

  The two witnesses do not carry the same weight. Polybius was a
  contemporary, but what he establishes is that war was decided before
  the final Carthaginian surrender, when Carthage had already fought
  Masinissa; he also says the senate's arguments over how the war would
  look very nearly stopped it. The claim that the decision went back to
  Cato's embassy rests on Appian, writing three centuries later. The
  site therefore holds with some confidence that Rome's determination
  preceded the final diplomacy of 149, and with less that it preceded
  the war with Masinissa.

  Appian's envoys saw large estates, cultivated land and a city grown in
  wealth and population, and Cato told the senate that Rome's liberty
  would never be secure while Carthage stood (*Punica* 69). Plutarch has
  him find the city full of fighting men, wealth, arms and military
  supplies, and produce a Libyan fig in the senate to show how near it
  lay (*Cato Major* 26–27). The summary of Livy records envoys rebuking
  the Carthaginian senate for an army and ship timber collected against
  the treaty (*Periochae* 48). The sources, then, do not describe a Rome
  alarmed by prosperity as such. They describe prosperity read as the
  means of rearmament. Whether that fear was sincere, exaggerated, or
  cover for other motives, among them Cato's own politics, the lure of
  Carthaginian land and wealth, and the habits of a Rome that had just
  broken up the Macedonian kingdom, cannot be recovered, and modern
  historians weigh these motives differently. On this site's reading,
  "not weak enough" means that Rome stopped tolerating a Carthage able
  to recover. Scipio Nasica's recorded opposition, that Rome needed a
  rival to keep its discipline, shows the outcome was argued over rather
  than automatic (*Periochae* 48; Plutarch *Cato Major* 27).

  The harbors are the one part of the recovery that can still be seen,
  and they show what tolerance looked like. In their excavated form the
  circular harbor and its stone ship-sheds date to the late third or
  early second century and could hold about 170 ships, in a city the
  treaty limited to ten warships (see the [harbors](/places/cothon)).
  The sheds were for warships. Appian, probably following Polybius, who
  saw them, puts the merchant ships in the outer harbor and the sheds,
  under the admiral's house, in the inner one, hidden even from
  incoming merchants (*Punica* 96); and ship-sheds with slipways are
  built to haul out oared warships, not merchantmen that lay afloat at
  a quay. Nor could such a harbor be built unseen, with Roman
  commissions visiting Carthage through these decades. On this site's
  reading, Rome knew of a large Carthaginian naval harbor and let it
  stand while Carthage was a useful and paying ally. The treaty obliged
  Carthage to supply ships for Rome's wars, a Carthaginian ship fought
  on the Roman side off Corycus in 191, and Carthage was offering grain
  and early payment of the indemnity (Livy 36.4, 36.44–45). The same
  harbor read differently once the recovery itself had become the
  question: ships held against the treaty head the charges in Livy's
  summary (*Periochae* 49). Richard
  [Miles](/sources/miles-carthage-2010) reads the complex as a tolerated
  merchant fleet; the site accepts the tolerance but not the merchant
  use. One caveat stands: the excavation date reaches back before 201,
  and a harbor begun before the treaty did not breach it.

  The demands of 149 are the clearest evidence of the objective.
  Carthage surrendered to Rome's discretion, gave three hundred hostages
  and handed over its arms. Only then did the consuls order the
  population to leave the city and settle at least eighty stades, about
  fifteen kilometers, from the sea (Appian *Punica* 76–81). If Rome's
  aim had been security or compliance with the treaty, Carthage had
  already given it. And the sources say the aim was settled and hidden
  before the demands were made: Appian has the consuls sail with secret orders not to
  stop until Carthage was razed (75), and the senate's promise to the
  surrendering envoys named freedom, laws and territory but not the city,
  an omission Polybius says alarmed the Carthaginians and Diodorus says
  concealed the intention to destroy it (Polybius 36.4; Diodorus 32.6).
  Those writers knew the outcome, and Appian and Diodorus probably follow
  Polybius, so this is one tradition, but it is a contemporary one. The
  sequence is often read as a trap designed to be refused. The sources
  attest the intention and the concealment, not an expectation of
  refusal, and the reading set out in the
  [claim on the 149 demands](/claims/149-demands-as-deliberate-trap)
  is that Rome did not need a refusal: acceptance would have ended
  Carthage as a maritime city, its harbors, temples and civic life
  abandoned even if its people survived inland, and refusal meant a
  war that ended it by force.

  The Numidian disputes are harder than the older picture allows.
  Polybius, a contemporary, says that in the long dispute over the
  Emporia Carthage always came off worse at Rome, not for want of right
  but because the judges thought a ruling against Carthage served Rome,
  and in the end lost the towns and paid five hundred talents (31.21). Appian
  describes Roman envoys confirming Masinissa's gains by leaving disputes
  undecided or by delay (*Punica* 68). Against this, a
  [2018 treatment of Third Punic War diplomacy](/sources/hoyos-third-punic-war-diplomacy-2018)
  dates Roman tolerance of Masinissa's annexations to after 167, with his
  earlier attempts rebuffed, though the site has not checked that argument
  in the work itself.
  [Colin Bailey](/sources/bailey-rome-carthage-numidia-2018) argues that
  Rome mostly sought to keep the settlement of 201 and that several
  decisions went Carthage's way. The record of rulings is too thin to
  settle the matter; the embassy on which Cato served issued no ruling
  at all, because Carthage refused to reopen the treaty (Appian
  *Punica* 69). The site reads the evidence as showing Roman restraint
  of Masinissa weakening over time, most sharply in the last decades
  before the war, not a fifty-year policy of deciding against Carthage.
  The evidence is set out in the
  [claim on Masinissa's territorial seizures](/claims/masinissa-territorial-seizures-pattern).
  That weakening, and Carthage's eventual decision to answer Numidian
  pressure with force, made the war of 150 increasingly likely, though
  not inevitable. The decision was a popular one: Appian has the people
  vote and swear to exile Masinissa's partisans, and after the defeat
  the city condemned its general Hasdrubal and the boetharch Carthalo to
  death and blamed them for the war (*Punica* 70, 74). Its outcome was
  Numidia's doing. Masinissa's siege of Oroscopa, which Appian calls
  contrary to the treaty, began the fighting, and Carthage met Rome in
  149 having just lost an army of 58,000 to him; Appian's own verdict makes
  Masinissa a cause of the destruction (106). The site treats him as the
  principal cause of the weakness Rome exploited, and Rome as the author
  of the decision to destroy the city, as set out in the
  [take on Masinissa](/editorialTakes/masinissa-strategic-opportunist).

  Cato is the hardest figure to weigh. The tradition of his refrain, known
  only from writers two centuries later and never in the modern Latin
  tag ([claim](/claims/cato-delenda-est-historicity)), makes him the
  cause: a man who ended every speech with the same demand until
  he got his war. The site treats his advocacy as real and his causal
  weight as unrecoverable, because the evidence pulls two ways. Against
  the singular reading, the embassy he served on issued no ruling
  (Appian *Punica* 69), several years passed between it and the decision
  for war, Nasica argued the other side and the senate followed him at
  least three times (*Periochae* 48; Plutarch *Cato Major* 27), and both Polybius
  and Appian describe a senate deliberating about timing and appearances
  rather than one being swept along. For it, the sources that survive
  put his name on the argument that carried, above all after Carthage
  offered its surrender in 149, when his motion to hold to the decree of
  war prevailed (*Periochae* 49), and Appian has him say
  Rome's liberty would never be secure while Carthage stood. What cannot
  be recovered is whether he moved the senate or articulated where it
  was already going, and the site declines to decide it.

  Modern historians broadly separate the treaty breach, as the occasion
  of the war, from its deeper causes, but they do not agree on how to
  weigh those causes. The position here is the site's synthesis of the
  ancient evidence, not a consensus it is reporting.
