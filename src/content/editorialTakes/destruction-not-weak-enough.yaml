competing_positions:
  - position: >
      The destruction was Rome's response to a genuine Carthaginian
      treaty violation in the 150 BCE war with Masinissa. Roman
      intentions were not settled beforehand; the demands of 149 were
      coercive diplomacy that Carthage chose to refuse.
    why_rejected: >
      The treaty breach was real, and the site treats it as the war's
      occasion. But Polybius says war had been decided before the
      Carthaginian envoys arrived to surrender, Appian says the senate
      had resolved on war and was waiting for a pretext, and both Appian
      and Diodorus say the intention to raze the city was fixed and
      concealed when the demands were made (Appian 75; Diodorus 32.6). And
      the demands of 149 continued after Carthage had given up hostages
      and arms, which is hard to square with an aim of securing
      compliance.
    held_by: >
      Rome's formal justification for the war, as preserved in the
      summary of Livy (*Periochae* 49); some older scholarship.
  - position: >
      Rome had pursued a consistent policy for fifty years of using
      Masinissa to strip Carthage of territory, and the war of 150 was
      the intended end of that policy.
    why_rejected: >
      Polybius and Appian do describe Roman favoritism toward
      Masinissa, but the record of individual rulings is fragmentary,
      one recent reading dates Roman tolerance of annexations to after
      167, and Bailey argues that Rome mostly upheld the settlement of 201. The
      evidence supports a weakening of Roman restraint in the later
      decades, not a single policy running from Zama to 150.
    held_by: >
      Older accounts that take Polybius 31.21 and Appian *Punica* 68 as
      a description of the whole inter-war period.
  - position: >
      Cato's persistent advocacy was the decisive cause. Without him the
      senate would not have moved, and the war is best explained by one
      man's campaign rather than by Roman strategic calculation.
    why_rejected: >
      Not rejected so much as unprovable. The surviving sources put
      Cato's name on the winning argument, which is exactly what a
      tradition built around a memorable phrase would do, and they also
      show a senate weighing how the war would look, an opposing case
      argued by Nasica, and years passing between his embassy and the
      decision. The site cannot separate the man who persuaded from the
      man who spoke for what was coming, and says so rather than
      choosing.
    held_by: >
      The *delenda est* tradition as it reaches popular treatments; the
      ancient sources give it more support than the structural reading
      usually admits.
  - position: >
      The destruction was overdetermined. Specific mechanisms (Cato's
      advocacy, Masinissa's encroachment, the 149 demands) matter less
      than the long-run fact of Roman Mediterranean expansion making any
      independent Carthaginian polity eventually intolerable.
    why_rejected: >
      Compatible with the site's reading rather than competing with it.
      It plays down the contingent decisions, the embassy reports, the
      senate debate between Cato and Nasica, and the shape of the 149
      demands, but it does not contradict the "not weak enough" reading.
      The site treats it as a compatible emphasis, with the caution that
      "eventually intolerable" should not be read as inevitable.
    held_by: >
      Structural readings of Roman imperialism that emphasize long-run
      causes over specific decisions.
