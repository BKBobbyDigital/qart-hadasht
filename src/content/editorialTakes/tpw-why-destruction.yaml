competing_positions:
  - position: >
      Cato's persistent advocacy was the decisive cause; without
      him the Roman decision would not have occurred.
    why_rejected: >
      Underweights the structural conditions and the long Roman
      strategic preparation. Cato gave voice to a position; he did
      not produce it. His personal influence is real but
      overdetermined by the broader Roman strategic context.
    held_by: A traditional reading sometimes encountered in
      popular treatments of the war.
  - position: >
      The destruction was a contingent outcome of escalating
      Roman-Carthaginian tensions, not a pre-decided strategic
      choice.
    why_rejected: >
      Underweights the deliberate impossibility of the relocation
      ultimatum. Rome had alternatives in 149 BCE and chose the
      ones that ensured destruction. The decision-tree the senate
      followed in 149 was structured to produce the outcome it
      did.
    held_by: A reading consistent with some modern scholarship
      cautious about retrospective causation.
