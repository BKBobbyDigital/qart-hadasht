slug: carthage-as-cultural-integrator
subject_question: >
  How should we read the Hellenistic forms visible in fourth- and
  third-century BCE Carthaginian practice: the Greek visual language of
  the coinage, the adoption of Demeter and Kore in 396 BCE, the
  identification of Melqart with Heracles, the war elephants, and the
  Greek-language culture around the Barcid commanders? Was Carthage
  being Hellenized, was it Hellenistic in some real sense, or is another
  reading more accurate?
subject_entity:
  type: theme
  slug: punic-identity
  role: subject
position: >
  Fourth- and third-century BCE Carthage took part deeply in the shared
  culture of the Hellenistic Mediterranean without becoming a
  Hellenistic polity. Carthaginian institutions and elites selected Greek
  religious practices, visual conventions, military technology and
  literary culture and reworked them, alongside older Phoenician,
  Egyptian and North African traditions. The useful question is not how
  much Greek influence reached an untouched Punic core, but how
  Carthaginians chose and remade what they took. On this site's reading
  the answer is actively and selectively, and continuity and adaptation
  were not opposites: over time the borrowed forms became part of what
  Carthaginian culture was.

  Both familiar labels can mislead when treated as one-way processes.
  "Hellenization" can hide the Carthaginian choices behind each
  borrowing, while "Greek influence" can understate how deeply some
  borrowed forms entered Carthaginian institutions. "Cultural
  integrator" is offered here as a way of asking who adopted a form, for
  what audience and with what local meaning, not as a third category of
  civilization.

  The borrowings differ in kind and depth. A civic cult, the images on
  state coinage, a shared religious vocabulary, a military technology and
  the habits of a command elite are not the same sort of evidence, and
  the site does not treat them as proving the same degree of change. The
  surviving evidence is also much richer for the elite than for everyone
  else. Engagement with Greek literary, diplomatic and court culture was
  probably deepest among political and military leaders, but the
  evidence is too uneven to map cultural participation cleanly by class,
  and some Greek cult forms clearly reached well beyond the elite.
reasoning: >
  The clearest case is the adoption of Demeter and Kore. In 396 BCE
  Himilco's army before Syracuse was destroyed by plague after
  Carthaginian troops had plundered the goddesses' temple, and the
  disaster was read as divine punishment. According to Diodorus, the
  Carthaginians voted to propitiate the goddesses, appointed their most
  renowned citizens as priests, consecrated statues, followed Greek
  ritual, and assigned the most prominent Greeks living among them to
  the goddesses' service (14.77). The cult was incorporated into
  Carthaginian civic religion, staffed by Carthaginians, and informed by
  Greek expertise from within the city. It did not displace Tanit or
  Baal Hammon. Nor did it begin or stay as an elite affair. Miles points
  out that the goddesses had long been worshipped by the Punic population
  of Sicily, which is the likelier route by which the cult first reached
  Carthage, and that Diodorus, probably following Timaeus, stresses its
  Greek character and presents the adoption of 396 only as panic after
  the plague. Afterward the pair became one of the commonest motifs of
  the Punic world, above all on terracotta incense burners in the form of
  a goddess's head, with a hollow headdress to hold the perfumed pellets;
  within the fourth century the cult spread across Punic areas of the
  western Mediterranean, as far as the rural shrine of Genna Maria in
  Sardinia, where it merged with the worship of local deities
  (*Carthage Must Be Destroyed*, pp. 142–143).

  The coinage shows the same choosing at the level of state imagery.
  From its beginnings in Sicily around 410 BCE, Carthaginian coinage used
  Greek-Sicilian conventions: a female divine head conventionally
  identified as Tanit but modeled on Syracusan images of Kore, paired
  with a horse or a palm tree, a Punic emblem. The identification of the
  head is not secure, and it may have been meant to read as Tanit to one
  viewer and Kore to another. That ambiguity is itself a sign of
  integration: an image made for a Mediterranean in which the same coin
  crossed cultural lines. The Barcid Iberian issues later used
  Hellenistic portrait conventions for a male head read variously as
  Melqart, a Barcid commander in divine guise, or a deliberate fusion of
  the two.

  Melqart and Heracles show religious translation without replacement.
  The equation is already explicit in Herodotus, who visited the Tyrian
  temple of the god he calls Heracles (2.44), and it became a durable
  shared vocabulary across the Phoenician and Greek Mediterranean.
  Herodotus shows how Greeks named the god, not how Tyrians did, but the
  later record shows Phoenicians using the equation too (the bilingual
  dedications from Malta name Melqart, lord of Tyre, in Phoenician and
  Heracles Archegetes in Greek; KAI 47), and Melqart did
  not stop being Melqart. Carthaginian envoys still went to Tyre for
  the god's annual festival in 332, when Alexander's siege caught them
  there (Arrian 2.24; Curtius 4.2.10).

  War elephants are a different kind of evidence: a military technology
  transfer, not a sign of cultural identity. Carthage adopted them within
  the wider Hellenistic military world, probably with Pyrrhus's
  campaigns in Italy and Sicily in the 270s as the nearest model, and
  fielded about fifty at Agrigentum by 262 (Polybius 1.19). The adoption
  shows Carthage taking what it needed from the Hellenistic repertoire
  while keeping its own command structure and its reliance on Libyan,
  Numidian and Iberian troops.

  The Barcids give the clearest picture of elite participation in
  Hellenistic political and intellectual culture: Hannibal learned Greek
  from Sosylus and campaigned with Greek historians (Nepos, *Hannibal*
  13.3), negotiated with Philip V in Greek diplomatic forms (Polybius
  7.9), and his family built a palace on a hill at Carthago Nova in a
  manner Polybius read as royal (10.10). His entourage resembled the
  intellectual circles of Hellenistic kings, though he was not a king.
  The Barcids were also unusually international, militarized and
  dynastic, so they show how far Carthaginian elite engagement could go,
  not what every aristocrat did. And they remained Carthaginian: the oath
  before Melqart's altar, the vows at Gades, and the gods of Carthage,
  under their Greek names, sworn by in the treaty with Philip.

  Continuity ran alongside all of this, and it was not static. The Punic
  language and script, the civic institutions of suffetes, senate and
  assembly, the Tophet and the cults of Tanit and Baal Hammon, and Punic
  theophoric names all persisted. The mature constitution kept
  Carthaginian and Phoenician civic forms rather than turning into a
  Hellenistic monarchy, and Aristotle discussed it as a constitution in
  its own right (*Politics* 2.11). But the household religion often cited
  as the unchanged Punic core itself shows what integration looked like
  over longer spans: the amulets of the Egyptian god Bes found in Punic
  homes and graves are an older borrowing that had long since become
  Carthaginian. That is the pattern this take describes, and Greek forms
  were one major case of it.

  The same pattern runs through Carthage's other relationships: Egyptian
  and Egyptianizing images in its art, the long interaction with Libyan
  and Numidian neighbors, and Barcid rule in Iberia, treated under
  [art and material culture](/themes/art-and-material-culture),
  [the Numidian-Punic interface](/narratives/the-numidian-punic-interface)
  and [the Barcid Iberian state](/narratives/the-barcid-iberian-state).
  Ancient DNA from western Punic sites points the same way at the level
  of population: Punic identity could hold people of varied ancestry
  (see [the open question on demographic composition](/openQuestions/punic-demographic-composition)).
  That is context, not proof of any particular borrowing.
