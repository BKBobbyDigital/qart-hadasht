competing_positions:
  - position: >
      Carthage was substantively Hellenistic. By the third century BCE
      its elite political behavior, military organization, coinage,
      religious translations and diplomacy shared so much with other
      Hellenistic states that stressing continuity overstates it and
      understates transformation. The Barcids are not exceptions but the
      clearest surviving evidence of a general development.
    why_rejected: >
      The reading is right that the change was deep and that the Barcids
      are evidence of something real. It goes too far in treating
      participation as conversion. Punic remained the language of civic
      inscriptions, the civic institutions persisted without a monarchy,
      the major cults continued, and the Barcids' own religious practice
      was Punic. Carthage belonged to the Hellenistic world without
      becoming one of its kingdoms.
    held_by: >
      Recent readings that emphasize Carthage's Hellenistic character as
      a corrective to treatments of the city as an isolated Semitic
      outlier.
  - position: >
      Carthage remained fundamentally a western Phoenician polity. Its
      Greek artistic, religious and military borrowings were pragmatic
      responses to long contact with Sicily and the wider Mediterranean
      and did not substantially change its institutions or collective
      identity.
    why_rejected: >
      The reading is right about continuity. It understates what the
      borrowings became: the Demeter and Kore cult was made an official
      civic cult staffed by Carthaginians and spread far beyond the
      elite, the coinage created a lasting new visual language for the
      state, and elite political culture became thoroughly
      Mediterranean. "Influence" undersells incorporation on that scale.
    held_by: >
      Older treatments that read Carthage chiefly through its Phoenician
      origins.
