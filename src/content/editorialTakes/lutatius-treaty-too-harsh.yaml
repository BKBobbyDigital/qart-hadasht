competing_positions:
  - position: >
      The Lutatius treaty as ratified was already harsh
      enough to produce the Second Punic War without the
      238 BCE seizure as a separate cause.
    why_rejected: >
      The original treaty was paid in full and Carthage
      recovered enough economic capacity by the late 230s
      to begin the Iberian project. The treaty was a
      stress, not a structural injury. The structural
      injury came in 238.
    held_by: >
      Some popular military histories.
  - position: >
      Roman post-Aegates conduct was incidental; the Second
      Punic War was caused by Hamilcar's personal ambition
      and the Barcid family's reach for revenge.
    why_rejected: >
      The "Barcid agency" reading under-weights the
      structural shifts the Sardinian seizure produced and
      treats Carthaginian politics as if it were purely a
      function of one family's desires. The Carthaginian
      senate's authorization of the Iberian project, and
      its later support for Hannibal's operations, indicates
      broader political support that the "personal revenge"
      framing does not adequately explain.
    held_by: >
      An older Roman-historiographic reading, surviving in
      some popular treatments.
