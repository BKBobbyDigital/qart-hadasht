competing_positions:
  - position: >
      Roman-client reading. Masinissa's power after 201 depended on
      Roman victory, Roman recognition of his enlarged kingdom, and
      the treaty that disarmed Carthage. His expansion cannot be
      separated from Roman hegemony: even where Rome did not direct
      him, he functioned as Rome's favored ally in Africa, and his
      gains served Rome's interest in a weak Carthage, which is why
      Roman judges let him keep them.
    why_rejected: >
      Partly accepted. The dependence is real, and the take states
      it. But dependence does not erase aims of his own. The land he
      sought enriched Numidia, not Rome; he built up a kingdom with a
      treasury and army of its own; and in 149 he resented
      Rome's takeover of the endgame while Rome distrusted him (Appian
      94). A client with a strong agenda of his own is still a client
      in the loose sense, but not an instrument.
    held_by: >
      A common reading in narrative histories of Rome's wars, and
      close to how the Roman tradition presents him, as Rome's loyal
      friend in Africa.
  - position: >
      Architect-of-destruction reading. Masinissa pursued Carthage's
      ruin deliberately, understanding that steady encroachment would
      force a Carthaginian response and a Roman war, and he belongs
      beside Cato as a co-author of the destruction.
    why_rejected: >
      Nothing in the sources shows him shaping the senate's decision
      or the demands of 149, and his reaction in 149 (Appian 94) is
      hard to square with a man watching his own plan succeed. His
      pressure made the crisis likely; that is a cause, which is
      Appian's word, not a design.
    held_by: >
      Rarely argued in this strong form; it appears mostly as an
      implication in accounts that make Numidian provocation the main
      cause of the Third Punic War.
  - position: >
      Long-range planner reading. Masinissa followed a coherent
      program from 201 to 150, pacing his encroachment to what Rome
      would tolerate and widening it as Roman tolerance widened, with
      his longevity supplying the patience a plan of that length
      required.
    why_rejected: >
      It reads a consistent intention back from an outcome. The
      pressure was persistent, but whether Roman tolerance widened
      over time is itself disputed, and a king in his late thirties
      in 201 could not plan on half a century. Repeated opportunism explains
      the same record without assuming the plan.
    held_by: >
      Implicit wherever his reign is described as a fifty-year
      program of encroachment paced to Roman tolerance.
