weighed_claims: []
competing_positions:
  - position: >
      Roman-client reading. Masinissa was Rome's chosen
      Numidian ally, and his post-Zama encroachment on
      Carthaginian territory was carried out in service of
      Roman strategic interests. His agency was real but
      directed; he was the instrument through which Roman
      Mediterranean policy worked in North Africa.
    why_rejected: >
      Under-weights how Numidian-aggrandizement-oriented his
      program actually was. Cannot account for the
      calibration pattern (incremental escalation timed to
      Roman tolerance, not directed by Roman command). Treats
      his unusual longevity-enabled patience as if it were
      Roman policy patience rather than his own. The framing
      makes Rome the active agent and Masinissa the executor;
      the patient decades-long calibration reverses the
      relationship: Masinissa was the patient agent, and Rome
      was the frame inside which he calibrated.
    held_by: >
      The historiographical default in older Anglophone
      treatments; the Polybian framing taken at face value,
      where Polybius positions Masinissa as the Roman-aligned
      Numidian.
  - position: >
      Architect-of-destruction reading. Masinissa's fifty-year
      program was designed to produce the destruction of
      Carthage; he understood from early in his reign that
      systematic encroachment would eventually force a
      Carthaginian response and Roman elimination, and he
      pursued the program with destruction as the goal. He
      is a co-architect alongside Cato and the Roman
      destruction faction.
    why_rejected: >
      Credits him with more design than the record supports.
      The 149 demand sequence and the senate's decision-making
      were Roman senate work; Masinissa's program enabled the
      decision but did not draft it. The "architect" framing
      also assumes a degree of foresight about Roman
      senatorial politics that the evidence does not really
      support. Masinissa understood Roman strategic intent
      generally, but the specific decision to destroy in 149
      depended on Roman political dynamics he could not have
      directly controlled.
    held_by: >
      Some recent treatments that push back against the
      Roman-client reading by inverting it toward maximal
      Masinissan agency; rarely articulated as the strong
      form rejected here.
