slug: masinissa-strategic-opportunist
subject_question: >
  What was Masinissa's actual role in the destruction of
  Carthage? Was he a Roman client doing Roman bidding, an
  architect of the destruction in his own right, or something
  in between?
subject_entity:
  type: person
  slug: masinissa
  role: subject
position: >
  Masinissa was a strategic opportunist: neither Rome's instrument
  nor the designer of Carthage's destruction. What he pursued was
  Numidian: more territory, fertile and revenue-bearing land, and a
  stronger kingdom. Rome made that possible without necessarily
  directing it. His throne rested on Roman victory and Roman
  recognition, and the treaty of 201 left Carthage unable to answer
  him by force and obliged to take its complaints to Rome. How
  consistently Rome then ruled for him is disputed; what is clear is
  that he pressed his claims for decades and gained ground.

  The expansion should not be reconstructed as a single fifty-year
  plan. What the record shows is repeated pressure, adjusted to
  circumstances, and an unusually long reign that let gains made at
  different moments accumulate. Nothing shows that he set out in 201
  to force Carthage into breaking the treaty, or that he expected
  Rome to destroy the city.

  His part in Carthage's downfall was larger than pressure. In 150 he
  besieged a Carthaginian town in breach of the treaty, Carthage answered
  with force, and only Carthage's answer was treated as a breach. He then
  destroyed its army: of some 58,000 men only a few came
  home, and the survivors agreed to pay him 5,000 talents over fifty
  years. The Carthage Rome attacked in 149 had already lost its army to
  Numidia and was, in Appian's words, much weakened. That makes him the
  principal cause of the weakness Rome exploited. The destruction that
  followed was still Roman policy. When Rome moved in 149, Appian
  reports that Masinissa was angry to be left out of an endgame he felt he had prepared, and
  that the Romans, already suspicious of him, turned down his help.
  Appian's own verdict is close to the site's: Masinissa was a cause
  of the destruction, because he left Carthage weakened and exposed
  to Rome (106). He was not its author.
reasoning: >
  Masinissa's aims are best read in what he took and what he built.
  Polybius says he coveted the Emporia district on the Lesser Syrtis
  for its towns, its fertility and its revenue (31.21). Polybius also
  credits him with proving that Numidia, thought incapable of growing
  crops, could be farmed as well as any country (36.16), and Appian
  adds that he left a full treasury and a disciplined army (106).
  Pressure on Carthage was one part of building a kingdom, not an
  end in itself.

  His power depended on Rome. He began the war on the Carthaginian
  side, commanding Numidian cavalry in Iberia, and changed sides
  around 206. Appian ties the change to Sophonisba, betrothed to him
  and then given by the Carthaginians to Syphax (Appian 10); Livy has
  her father arrange the Syphax marriage and knows nothing of a
  betrothal (29.23), so the personal grievance should be held
  loosely. What is certain is that he lost his father's kingdom to
  Syphax and recovered it only with Roman help, after Syphax was
  defeated and captured in 203. At Zama he commanded his own
  Numidian cavalry alongside Scipio. The peace of 201 then required
  Carthage to restore to him whatever had belonged to him or his
  ancestors, and barred Carthage from making war on anyone in Africa
  without consulting Rome (Polybius 15.18). The first clause gave
  him an open-ended basis for claims; the second meant Carthage had
  to answer them in Rome rather than on the ground.

  How Rome handled those claims is the disputed part (see the
  [claim on his territorial seizures](/claims/masinissa-territorial-seizures-pattern)).
  Appian says the first arbitrators were told to favor Masinissa as
  far as they could (67). Polybius, a contemporary living in Rome,
  says that in the long quarrel over Emporia the Carthaginians always
  came off worse, not because their case was weak (Masinissa had
  once asked their permission to cross the district) but because the
  senators judged a ruling against them to be in Rome's interest;
  Carthage lost the towns and paid five hundred talents (31.21). Both
  are strong evidence of partiality in particular disputes, and Appian
  describes more: a second commission around 180 again told to help him
  secretly, which confirmed his gains by refusing to hear either side,
  and a delay over the Great Plains and Tysca that lasted until
  Carthaginian interests were nearly ruined (68). Silence and delay
  favored him as surely as a verdict, because the land stayed with
  whoever held it. Not every embassy did: one in the 150s proposed a
  peace in which he would give the disputed land back, before a
  Carthaginian magistrate roused the people against it (*Periochae* 48).
  The evidence establishes a pattern of partiality over decades, not a
  verdict for him in every case. Hoyos argues Rome rebuffed
  Masinissa's annexations until after 167, and Bailey that Rome
  mostly upheld the settlement of 201 and sometimes ruled for
  Carthage. The site does not choose between these reconstructions.
  On any of them Masinissa pressed claims, tested what Rome would
  accept, and gained ground, which is what the label means.

  His long life mattered for continuity rather than as evidence of
  foresight. Polybius gives him a reign of over sixty years and a
  death at ninety (36.16); counted from his recovery of the kingdom
  in 203 he ruled for more than half a century, outlasting Hannibal,
  Scipio Africanus and most of the Romans he had first dealt with.
  One king pursuing the same claims across that span gave Numidian
  policy a consistency few states had. He could not have known in
  201 that he would have fifty years to use, so the site does not
  read his patience as a plan.

  The crisis of 150 came out of that pressure, and out of Carthaginian
  politics. Appian's popular party, under Hamilcar the Samnite and
  Carthalo, had been harrying Masinissa's subjects on disputed land
  since around 180 (68). In the 150s the people voted, and swore, to
  exile some forty leaders of the party that favored him; the exiles fled
  to him and urged war, and Appian says he was "nothing loath." When his
  son Gulussa was turned away from the city and then attacked by Hamilcar
  the Samnite, Masinissa used it as an excuse to besiege Oroscopa, a
  town Appian says he wanted "contrary to the treaty" (70). So the first
  breach of the treaty in 150 was his. Carthage's army under Hasdrubal
  marched out, was drawn into waterless hill country, surrounded and
  starved, and surrendered on terms: the deserters handed over, the
  exiles restored, 5,000 talents to Masinissa. As the survivors filed
  out, Gulussa's cavalry cut them down; of 58,000 only a few returned
  (71–73). Carthage then condemned Hasdrubal and Carthalo to death and
  sent envoys to Rome blaming them for the war, because, Appian says, it
  feared both the king at its door and a Rome that would make his
  affairs its excuse (74). Rome treated Carthage's war, not Masinissa's
  siege, as the breach, and it had its pretext. Masinissa's seizures made
  such a breach increasingly likely; the evidence does not show he
  intended it, but he made its military outcome. The decision to destroy the city belonged to the
  Roman senate, where Cato was its most famous advocate, and to the
  demands of 149, framed so that either Carthaginian answer ended the
  city as it existed (see
  [why the destruction happened](/editorialTakes/destruction-not-weak-enough)).

  What happened in 149 is the best evidence against both extreme
  readings. Appian says Masinissa "was vexed with the Romans," taking
  it hard that when he had brought Carthage to its knees others
  should carry off the glory, without consulting him as they had in
  earlier wars. Asked for help, he said he would send it when he saw
  they needed it; when he later offered, the Romans, suspicious of
  him, said they would send for him when they did (94). That is not
  how an instrument of Roman policy behaves, and it is not how the
  author of the policy behaves either. The passage shows resentment
  over glory and consultation. It does not show that he wanted
  Carthage to survive, and the relationship did not break: dying in
  148, he left the division of his kingdom to Scipio Aemilianus, and
  his son Gulussa went straight to the aid of the Roman army (Appian
  105–107). Appian is the only source for all of this.
