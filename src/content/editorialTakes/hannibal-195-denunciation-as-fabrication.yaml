slug: hannibal-195-denunciation-as-fabrication
subject_question: >
  Was the 195 BCE denunciation of Hannibal to Rome, alleging he was
  conspiring with Antiochus III against Rome, a report of real prior
  contact, or a political fabrication by the Carthaginian opponents his
  196 BCE reforms had made?
subject_entity:
  type: event
  slug: hannibal-exile-and-death
  role: subject
position: >
  The denunciation was certainly a political weapon, and it was probably
  fabricated or heavily exaggerated. Whether Hannibal had any contact
  with Antiochus before he fled cannot be recovered.

  Three questions need keeping apart. Who made the accusation, and why,
  is well attested: both surviving narratives trace it to Hannibal's
  opponents at Carthage, men whose profits his reforms had cut off, and
  Livy himself records Scipio Africanus objecting that Rome should not
  lend itself to Carthaginian faction. Whether a developed conspiracy
  with Antiochus already existed is not established. Livy appears to
  accept that Hannibal was exchanging messengers and letters with the
  king; Justin, following Pompeius Trogus, says the charges were false;
  Nepos records the embassy and the flight without judging the charge;
  and Polybius's account, which might have settled it, is lost. The site
  leans toward fabrication or exaggeration because one ancient tradition
  denies the charge outright and the other names interested accusers,
  but zero contact cannot be shown, and a hostile accuser can still
  tell the truth.

  The third question has the clearest answer. Roman pressure drove
  Hannibal out of Carthage, and within a year or two he was at
  Antiochus's court urging war against Rome, exactly the role the charge
  had claimed he already held. The accusation may have been false when
  it was made and true soon afterward, and Rome's intervention helped
  make it so.
reasoning: >
  The political origin of the charge is the best-attested part of the
  episode. As suffete in 196, Hannibal carried a law that the judges of
  the order later called the Hundred and Four, who had held office for
  life, should be elected annually and that no one should serve two years
  in succession (Livy 33.46.6). He then exposed the waste and embezzlement
  of public revenues by leading men and showed that, properly collected,
  they would pay the annual installments to Rome without a special tax
  on citizens (33.46–47). Livy says these measures made him enemies among
  the leading men, and that they wrote to their friends at Rome that
  Hannibal was sending messengers and letters to Antiochus and receiving
  the king's agents (33.45). Justin gives the same origin: Hannibal's
  enemies told the Romans he had joined Antiochus (31.1–2). The motive is
  plain, and it means the charge cannot be treated as neutral
  intelligence. Motive alone does not make it false.

  Livy is more careful than he is sometimes given credit for. He accepts
  the correspondence, but he sets it inside Carthaginian faction, and he
  records that Scipio Africanus long resisted acting on it, arguing that
  it was beneath the dignity of the Roman people to take up the quarrels
  of Hannibal's accusers (33.47). The embassy of Cn. Servilius, M.
  Claudius Marcellus and Q. Terentius Culleo was given out as a mission
  to settle a dispute between Carthage and Masinissa; Hannibal, judging
  that he was its real object, spent the day in public and left at
  nightfall (33.47–48).

  Justin's account is harsher on Rome and is the only ancient source that
  calls the charges false: the accusations, he says, were believed by
  the fearful, and the senate sent Servilius with secret instructions to
  have Hannibal killed through his enemies if he could (31.1–2). Nepos
  says only that Roman envoys came, that Hannibal believed they had been
  sent to demand his surrender, and that he escaped by ship to Antiochus
  before the senate received them, after which Carthage sent ships after
  him, confiscated his property, razed his house and declared him an
  exile (*Hannibal* 7). Nepos does not describe accusers or judge the
  charge.

  Some arguments that have been made for fabrication do not hold. That
  no letters, quotations or named intermediaries survive is an argument
  from silence in a record this fragmentary. That Hannibal arrived at
  Antiochus's court without a command waiting for him says little, since
  earlier contact could have been tentative or indirect. And his flight
  proves neither guilt nor innocence: anyone facing Roman envoys and his
  own city's enemies at once had reason to leave. What supports the
  site's lean is positive, not silence: an ancient tradition that denies
  the charge, and the interest of the men who made it.

  The episode's clearest lesson is the one both sides of the question
  share. Hannibal went east and became Antiochus's adviser against Rome;
  from Ephesus in 193 he sent Aristo of Tyre to Carthage to win support
  for a new war (Livy 34.61). His later conduct makes the 195 charge
  plausible. It does not show that the conspiracy existed before Rome
  and his enemies pushed him out.
