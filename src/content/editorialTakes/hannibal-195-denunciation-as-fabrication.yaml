competing_positions:
  - position: >
      The denunciation reported real prior contact. Hannibal had been in
      communication with Antiochus before 195, as Livy says; his enemies
      exposed what was happening rather than inventing it, and his flight
      to Antiochus's court followed the plan he was already pursuing.
    why_rejected: >
      Not ruled out, and Livy's acceptance of the charge is real evidence.
      But Livy also shows that the charge came from men with every reason
      to want Hannibal gone, Justin explicitly calls it false, and no
      surviving source gives independent evidence of the correspondence.
      Hannibal's later work for Antiochus shows what Roman pressure
      produced, not what preceded it.
    held_by: >
      Livy's account taken at its word, and treatments that follow it.
  - position: >
      Limited real contact, exaggerated. Hannibal had some informal or
      tentative contact with the Seleucid court, as any anti-Roman
      statesman watching Antiochus's preparations might, and his enemies
      inflated it into a conspiracy.
    why_rejected: >
      Not rejected. The site cannot distinguish this reading from full
      fabrication on the surviving evidence and treats the two together as
      its lean. Exaggeration of slight contact is as consistent with Livy
      and Justin as invention from nothing.
    held_by: >
      Cautious modern syntheses that decline to choose between Livy and
      Justin.
