slug: aristotle-carthaginian-governance-praise-qualified
subject_question: >
  Aristotle's treatment of the Carthaginian constitution in
  *Politics* II.11 has been read variously as genuine
  philosophical praise, as a rhetorical backhand, and as
  neutral description. What was Aristotle actually doing in
  the passage, and how should the site frame it?
position: >
  Aristotle's praise is real, and it is qualified, and both halves come
  from the text. In *Politics* 2.11 (1272b24–1273b26; numbered 2.8 in
  some editions) he says the Carthaginians are thought to be well
  governed, in many respects better than others, and closest to Sparta
  and Crete, and he gives his reason: though the people share in
  government, the constitution has stayed stable, with no civil strife
  worth mentioning and no tyranny. He admires particular institutions:
  common meals like the Spartan ones; the board of the Hundred and Four,
  like the Spartan ephors but chosen on merit rather than from anyone
  at all; and the way the "kings" (the suffetes) are chosen, not from
  one family and not by seniority but by merit.

  He is just as specific about the faults. The constitution leans
  toward oligarchy because offices are filled with an eye to wealth as
  well as merit, which makes the highest offices purchasable and teaches
  the whole city to value money above virtue; one man may hold several
  offices, which he thinks bad practice; and the city avoids unrest by
  sending some of the people out to the subject towns to get rich,
  which he calls stability by good fortune rather than by design,
  leaving no legal remedy if disaster strikes and the people revolt.
  Aristotle was not simply hostile to that last practice: in Book 6 he
  recommends something like it to democracies, citing the Carthaginians,
  who kept the people's goodwill by constantly sending some of them out
  to the dependent towns (6.5, 1320b).

  The qualification is the one Aristotle applies to every existing
  constitution in Book II, which he examines in order to find their
  faults: Sparta and Crete are handled the same way. Carthage is not
  being held at arm's length as a foreign or barbarian state. He treats
  it as a constitution of the same kind as the best Greek ones and judges
  it by the same standard, and by that standard it is among the three
  best actually in existence and still falls short of the ideal. The
  site uses the chapter as its most substantial outside witness to how
  Carthage was governed in the fourth century (see the
  [suffeteship arc](/narratives/the-suffeteship-arc)), with the caution
  that it describes a working system through Greek categories.
reasoning: >
  The placement matters. Book II reviews the constitutions that seem
  best, both the theoretical ones (Plato's *Republic* and *Laws*,
  Phaleas, Hippodamus) and the actual ones held in high repute, and
  Carthage is the last of the three actual ones, after Sparta and Crete,
  before a closing chapter on lawgivers. Aristotle says at the outset of
  the book that he examines these constitutions because none is
  satisfactory; being included is a compliment, and being criticized is
  the purpose. That rules out both the reading of the chapter as a
  backhand and the reading of it as unreserved praise.

  The detail shows he was working from information about real
  institutions: the Hundred and Four, the boards of Five that co-opt one
  another and choose the Hundred, the rule that the people decide when
  the kings and the council disagree, with anyone free to speak against
  a proposal, and the single set of magistrates judging all cases. Some
  of these he counts as democratic tendencies, some as oligarchic, some
  as aristocratic; the chapter is an analysis of a mixed constitution,
  not a eulogy. His two most pointed criticisms, that wealth buys office
  and that stability depends on exporting the discontented, are
  observations about how the system worked, and the site treats them as
  evidence alongside the praise.

  One thing the text does not support is a reading in which Aristotle
  sets Carthage outside the Greek political world. He puts it in the
  same class as Sparta and Crete, and elsewhere uses Carthage as an
  ordinary example in arguments about constitutions. Whatever Greek
  hostility to Carthage existed in the fourth century, it is not what
  shapes this chapter. Aristotle also refused the Sicilian Greek story
  that Carthage and Persia had coordinated their attacks of 480: the
  battles of Salamis and Himera, he says, happened at the same time but
  did not tend to the same end (*Poetics* 23).
confidence: moderate
weighed_claims: []
competing_positions:
  - position: >
      Unqualified praise. Aristotle saw Carthaginian governance as equal
      or superior to the Greek constitutions he placed it with, and the
      criticisms are minor.
    why_rejected: >
      The criticisms are not minor: venal offices, love of money set
      above virtue, and stability that rests on luck are serious charges
      in Aristotle's terms. And the praise sits inside a book whose stated
      purpose is to show that no existing constitution is good enough.
      Carthage ranks with Sparta and Crete, not above them.
    held_by: >
      Popular writing that quotes the chapter as an endorsement, without
      its second half.
  - position: >
      A rhetorical backhand. The praise is framing, and the chapter uses a
      non-Greek state as a foil for Greek superiority.
    why_rejected: >
      Aristotle treats Carthage exactly as he treats Sparta and Crete,
      with the same mixture of admiration and criticism, and the
      institutional detail is not what a foil needs. Nothing in the
      chapter marks Carthage as barbarian.
    held_by: >
      A reading sometimes brought to Greek writing on Carthage in general;
      the site does not know of a published argument for it about this
      chapter in particular.
  - position: >
      Neutral description. Aristotle is cataloging institutions, and the
      praise and blame are incidental.
    why_rejected: >
      He evaluates throughout: the opening judgment that Carthage is well
      governed, the preference for its way of choosing kings and the
      Hundred and Four over Sparta's, and the closing verdict that its
      stability depends on chance are all judgments.
    held_by: >
      No specific holder; stated so that the reading can be weighed.
