competing_positions:
  - position: >
      Territorial empire on the Roman model. Carthage ruled an empire
      of provinces and subject territories across Africa, Sardinia,
      Sicily, and Spain, a maritime state administering its holdings
      much as Rome would later administer the same regions.
    why_rejected: >
      Projects Roman provincial administration backward onto a power
      that did not work that way. Allied cities kept their own
      institutions and could defect (Utica in 149); the outer empire
      was regulated by commercial treaty rather than by provincial
      officials; there is no evidence of a Carthaginian provincial
      bureaucracy outside the African core and late Barcid Iberia. The
      directly-ruled territory was a minority of the whole, and the
      "empire" of the sources is partly their own imperial categories
      imposed on a differently organized hegemony.
    held_by: >
      Older narrative histories and the default popular picture of
      Carthage as a Mediterranean empire mirroring Rome; the reading
      Whittaker 1978 set out to correct.
  - position: >
      Not an empire at all, only a network. Carthaginian "empire" is a
      modern and Greco-Roman fiction; what existed was a decentralized
      commercial network of Phoenician cities with no metropole
      genuinely ruling the others, Carthage merely the largest node.
    why_rejected: >
      Understates the coercion the evidence records. The Libyan core
      was directly and harshly taxed, to the point that its
      population rose in mass during the Mercenary War, which a network
      of autonomous partners does not do. The Barcid Iberian state was
      a real conquest-and-administration enterprise. Carthage was a
      dominant, coercive power over its core and capable of territorial
      state-building; the network framing captures the outer rings well
      but cannot absorb the inner ones.
    held_by: >
      The strongest form of the Quinn 2018 revisionist reading, taken
      further than Quinn himself does; anyone who dissolves
      Carthaginian power entirely into the Phoenician colonial network.
  - position: >
      A single "commercial hegemony" with no meaningful internal
      gradation. Carthage exercised one uniform kind of loose
      commercial dominance everywhere, held together by trade and
      treaty.
    why_rejected: >
      More compatible with the site's reading than opposed to it, but
      it flattens a structure the evidence shows was layered. The
      relationship Carthage had with the Libyan hinterland (direct
      taxation of subjects) was categorically different from its
      relationship with Utica (unequal alliance) and different again
      from its Sardinian and Sicilian sphere (treaty-and-garrison
      influence) and from Barcid Iberia (territorial conquest). The
      site takes the layered reading because those differences of kind,
      not just degree, are what the sources actually attest.
    held_by: >
      A reasonable simplification of the Whittaker hegemony reading; the
      site keeps the internal distinctions that this version smooths
      away.
