competing_positions:
  - position: >
      Territorial empire on the later Roman model. Carthage ruled
      provinces across Africa, Sardinia, Sicily and Spain, administering
      its holdings much as Rome would later administer the same regions.
    why_rejected: >
      There is no evidence of standardized provinces, appointed governors
      or a uniform administration outside the African core and late
      Barcid Iberia, and cities inside the system kept their own
      governments. The comparison is also anachronistic in the other
      direction: Rome's own Italian system in this period was itself
      differentiated and treaty-based.
    held_by: >
      Older narrative histories and the popular picture of Carthage as a
      mirror of Rome.
  - position: >
      Not an empire at all, only a network. "Carthaginian empire" is a
      Greco-Roman and modern fiction; what existed was a decentralized
      web of Phoenician cities with no metropole really ruling the
      others, Carthage merely the largest node.
    why_rejected: >
      It cannot absorb the coercion the sources record: half the harvest
      taken from the Libyan peasantry, a subject population that rose in
      mass when it saw the chance, commanders and garrisons in Sardinia,
      and a treaty tradition in which Carthage closes whole coasts to
      foreign shipping. Network and coercion are not alternatives, but a
      reading that keeps only the network is describing one mode of a
      system that had several.
    held_by: >
      Stated here as the limiting case of the revisionist argument rather
      than as any one scholar's position.
  - position: >
      One uniform commercial hegemony. Carthage exercised the same loose
      dominance everywhere, held together by trade and treaty.
    why_rejected: >
      Closer to the site's reading than the other two, but it flattens
      differences of kind. Taxing Libyan farmers, leading Utica in war,
      garrisoning Sardinia and regulating Roman access to the Atlantic
      coast are not degrees of one relationship, and the treaties
      themselves distinguish Carthage, its allies, Utica, Tyre, Libya,
      Sardinia and the Carthaginian part of Sicily.
    held_by: >
      A simplification of the hegemony reading.
