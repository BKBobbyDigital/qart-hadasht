slug: carthaginian-empire-layered-hegemony
subject_question: >
  What kind of empire was the Carthaginian "empire": a territorial state
  on the Roman provincial model, a loose commercial network, or
  something the word does not prepare a reader for? And did it stay the
  same across the city's history?
subject_entity:
  type: theme
  slug: phoenician-colonial-network
  role: subject
position: >
  Carthage ruled an empire, but it did not rule every part of it in the
  same way. Empire here means durable, unequal power over communities
  outside the citizen body, exercised through taxation, troops,
  garrisons, control of foreign relations or command of strategic space.
  By that measure Carthage qualifies. What it did not have, so far as the
  evidence shows, was anything like Rome's later system of standardized
  provinces and appointed governors, and the absence of that machinery is
  not the absence of territorial rule.

  Four modes of power are visible in the record, overlapping rather than
  forming neat rings. In the African hinterland Carthage taxed subjects
  directly and hard. Old Phoenician and Punic cities such as Utica kept
  their own institutions inside unequal relationships whose obligations
  differed from city to city. Sardinia and western Sicily were spheres
  held by conquest, garrison and supremacy over cities that kept their
  own governments; Polybius, reading the early treaties, says the
  Carthaginians treated Sardinia and Libya "as their own private
  property," while of Sicily they named only the part under their rule.
  Beyond that lay coasts and harbors where Carthaginian power took the
  form of navigation rules, exclusion zones and regulated trade, and
  where Punic presence should not be read as political possession.

  Barcid Iberia intensified these practices rather than inventing them.
  Rapid conquest, silver, a sustained coinage, a great new city and
  twenty years of continuous family command produced a concentrated
  territorial power, but Carthage had conquered, garrisoned and taxed
  long before 237. The other qualification is chronological: Carthage did
  not inherit a ready-made western empire from Tyre. It began as one
  western Phoenician city among many and built supremacy over older
  communities by degrees, in different ways in different places. The
  phrase "Carthaginian empire" names a real structure of unequal power,
  never one constitutional relationship applied everywhere.
reasoning: >
  The African core was ruled, not merely traded with. The farmland behind
  Carthage paid in kind, and in the emergency after the First Punic War
  the demand reached half the harvest, with the towns' taxes doubled and
  the governors who squeezed hardest rewarded (Polybius 1.72). That is a
  state taxing subjects. How the Libyans experienced it showed in 241,
  when they needed no incitement to join the mutinous army and the women
  of the towns gave their jewelry to the war fund (1.72). Trading
  partners do not rise like that; taxed subjects do. What the evidence
  does not show is the machinery: whether Carthage collected through its
  own officers, through local notables or by farming the tax is not
  recorded, and the lack of a bureaucracy would not make the extraction
  less real.

  Cities inside the system kept their own politics. Utica, the oldest
  Phoenician foundation in Africa, appears in the second Romano-
  Carthaginian treaty as a named party alongside Carthage and Tyre
  (Polybius 3.24), and in 149 it made its own decision and went over to
  Rome. That is not proof that Utica stood outside the empire, since
  subject communities revolt too; it is proof that its institutions were
  still working. Local self-government and imperial subordination are
  not opposites, and the obligations of the Punic and Libyphoenician
  coastal cities, in troops, money and following Carthage in war,
  probably differed from one city to the next in ways the sources do not
  let us reconstruct.

  Sardinia and western Sicily were territorial, not merely commercial.
  This is where the older version of this take was wrong. Polybius says
  the wording of the first two treaties shows the Carthaginians
  "consider Sardinia and Libya as their own," closing them to Roman
  trade and settlement entirely, while for Sicily they mention only "the
  part under Carthaginian rule" (3.23, 3.24). Carthaginian forces were
  stationed in Sardinia: when the mercenaries there mutinied in 240 they
  killed Bostar, the commander of the foreign contingent, and crucified
  the general Hanno sent to replace him (1.79). The Sicilian zone that
  Greek writers call the *epikrateia*, the Carthaginian "command," was a
  frontier that moved with every war, which is why the treaties describe
  it differently from Sardinia. Neither looked like a Roman province.
  Both involved conquest, garrisons and supremacy over cities that kept
  their own institutions.

  Farther out, the power was maritime and commercial. The treaties define
  where Roman ships could sail, where Romans could trade and on what
  terms, and beyond which points they could not settle or raid at all
  (Polybius 3.22–25). That is control of access, not administration, and
  it says nothing about how Carthage governed anyone. Nor does a Punic
  trading station on the Atlantic coast make a Carthaginian possession.
  The treaties are excellent evidence for how Carthage represented and
  defended its sphere against another power, and poor evidence for what
  went on inside it.

  Barcid Iberia is treated separately, in the
  [take on the Iberian state](/editorialTakes/barcid-iberian-state-as-state).
  Its relevance here is that it concentrated what had been dispersed:
  conquest and revenue and command in one man's hands, in one region, for
  twenty years. Calling it the first territorial Carthaginian formation
  would contradict the Sardinian and African evidence above.

  Two further points. The first is chronological: what these modes
  covered changed over centuries, from a Carthage that was one western
  Phoenician city among several, through expansion in Africa, Sardinia
  and Sicily, to the mature system of the fourth and third centuries,
  and then to the treaty of 201, which stripped the overseas empire but
  left Carthage its African cities and territory and its own laws and
  customs, while forbidding it war outside Africa or inside Africa
  without Roman consent (Polybius 15.18). An African territorial state
  survived the loss of everything else. The second is about the word.
  Every connected account of Carthaginian power comes through Greek and
  Roman writers using the categories of their own empires, which is the
  correction
  [Whittaker's 1978 chapter](/sources/whittaker-carthaginian-imperialism-1978)
  is known for. The site accepts that the Roman provincial picture is a
  retrojection, and does not accept that the empire dissolves into a
  network, because the taxed African hinterland, the garrisons and the
  Barcid state are facts such a reading has to explain away.
confidence: moderate
