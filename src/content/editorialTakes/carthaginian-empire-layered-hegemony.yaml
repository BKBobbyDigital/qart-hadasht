slug: carthaginian-empire-layered-hegemony
subject_question: >
  What kind of imperial structure was the Carthaginian "empire": a
  territorial state on the Roman model, or a hegemonic network with a
  narrow directly-ruled core? And did that structure stay the same
  across the city's history?
subject_entity:
  type: theme
  slug: phoenician-colonial-network
  role: subject
position: >
  Carthaginian power was not a territorial empire on the Roman
  provincial model. It was a layered hegemony of different
  intensities, and its shape changed over time. Read from the center
  out, it had four rings. The innermost was a small African core, the
  Libyan hinterland behind Carthage, that the city ruled directly and
  taxed hard enough to provoke revolt. Around that lay a belt of
  Libyphoenician and old Phoenician towns, Utica and Hadrumetum and
  the rest, bound as allies and tributaries but keeping their own
  institutions. Beyond those lay a sphere of commercial dominance held
  by treaty rather than administration: no-sail zones, trading
  monopolies, and garrison-points in Sardinia and western Sicily whose
  boundaries moved with each war. And in the last generation before
  the fall, in Barcid Iberia, Carthage built something genuinely new
  that did look like a territorial state, which the site treats
  separately and reads as a departure from the older pattern rather
  than its culmination.

  The site's position threads between two corrections. Against the old
  picture of a Rome-before-Rome ruling provinces, the evidence is
  decisive: allied cities kept their own governments, commerce was
  policed by treaty rather than by provincial officials, and much of
  the "empire" the Greek and Roman sources describe is those sources
  fitting Carthaginian power into their own imperial vocabulary. But
  against the opposite move, dissolving Carthage into a stateless
  merchant network, the site holds that the direct rule over the
  Libyan core was real, coercive, and territorial, and that the Barcid
  Iberian state shows Carthage was capable of building a conquest-state
  when it chose to. Carthage was an empire; it was simply not the kind
  of empire the word imports.
reasoning: >
  Four bodies of evidence carry the reading, one for each ring, and a
  fifth point about the sources.

  The African core was ruled, not merely traded with. The Libyan
  farmland behind Carthage paid tribute in kind, and in the emergency
  after the First Punic War the demand reached half the harvest, with
  town levies doubled ([Polybius](/sources/polybius-histories) 1.72).
  That is not the behavior of a
  commercial hegemon toward trading partners; it is a state taxing
  subjects. The proof of how the Libyans experienced it is that when
  the mercenaries mutinied in 241, the Libyan communities joined the
  revolt in mass, supplying most of the manpower and their own
  coinage, and the war that followed was the most savage Carthage ever
  fought. A network does not produce that kind of rising; an
  exploited subject population does. Over this innermost ring Carthage
  was a territorial power in the ordinary sense.

  The allied towns were held by hegemony, not administration.
  [Utica](/places/utica), the oldest Phoenician foundation in Africa,
  kept its own institutions
  throughout, and the decisive proof of its status is that in 149 it
  could simply change sides, defecting to Rome and handing over its
  harbor. A province cannot defect; an ally can. The Libyphoenician
  and Phoenician towns of the coast sat in a relationship of unequal
  alliance with Carthage, contributing troops and money and following
  its lead in war, but they were not administered from Carthage in the
  way a Roman province was administered from Rome.

  The outer sphere was policed by treaty and trade. The series of
  Romano-Carthaginian treaties that Polybius preserves (3.22–26) shows
  what the outer empire actually consisted of: agreements defining
  where Roman ships could and could not sail, which coasts were closed
  to foreign trade, and on what terms commerce could happen at all in
  the Carthaginian sphere. Carthage projected power over Sardinia, the
  African Atlantic coast, and western Sicily by controlling access and
  exchange, backed by garrisons at key points, rather than by planting
  a provincial apparatus. The Sicilian epikrateia, the zone the Greek
  sources call the Carthaginian "command," was a contested frontier
  whose extent shifted with every Sicilian war, not a fixed province.

  Barcid Iberia was the exception that shows the rest was a choice. In
  Spain after 237 the Barcids did the things the older empire never
  did: they conquered territory, founded planned capitals, minted a
  sovereign coinage, integrated local aristocracies by treaty and
  marriage, and ran a standing field army under a dynastic succession.
  That looks far more like a territorial state, and the site treats it
  as such in a [separate take](/editorialTakes/barcid-iberian-state-as-state).
  Its importance here is comparative. The
  fact that Carthage could build a conquest-state when it set out to,
  and that this was recognizably new, is the strongest evidence that
  the older, looser structure was not a failure to become Rome but a
  different way of organizing power. Whether Iberia was the shape
  Carthage was moving toward, cut short by the Second Punic War,
  cannot be known.

  Finally, the word does much of the distorting. Every connected
  account of Carthaginian power comes through Greek or Roman writers
  describing it in the categories of their own imperial forms, the
  polis-hegemony of the Greeks and the provincial empire of the
  Romans. [Whittaker's 1978 argument](/sources/whittaker-carthaginian-imperialism-1978)
  was that the territorial-empire
  picture is substantially their retrojection;
  [Quinn's later work](/sources/quinn-phoenicians-2018)
  presses further, doubting whether "Carthaginian empire" names a real
  unified thing rather than a modern tidying of a looser reality. The
  site follows Whittaker's correction and stops short of the strongest
  form of Quinn's, because the coercive African core and the Barcid
  state are real facts a pure-network reading has to explain away.
  [Ameling's insistence](/sources/ameling-karthago-1993) that a genuine polis with a citizen-military
  tradition stood behind the commercial face is the counterweight the
  site keeps in view against dissolving Carthage into its trade.
confidence: moderate
weighed_claims:
