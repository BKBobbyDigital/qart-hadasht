competing_positions:
  - position: >
      Hannibal did fail to use his victory and could have ended the
      war by an immediate march on Rome.
    why_rejected: >
      Rests on the Maharbal anecdote, which is probably not historical,
      and requires Hannibal to have had a siege capacity and a supply
      line he is not attested to have possessed. It also ignores what
      happened when he did reach Rome's walls in 211.
    held_by: The Roman literary tradition from Livy on; some popular military histories.
  - position: >
      The march on Rome was impossible but Hannibal still erred by not
      pressing his advantage in some other form.
    why_rejected: >
      Hannibal did press his advantage: the ransom embassy and offer of
      terms, the Italian defections, the alliance with Philip V, and
      later his brother Hasdrubal's relief expedition. The criticism
      demands something dramatic he is not attested to have considered.
      The site does think Hannibal misjudged Rome, but in his expectation
      that it would negotiate, not in declining to march.
    held_by: Some twentieth-century military historians.
