slug: cannae-march-on-rome
subject_question: >
  Could Hannibal have ended the war by marching on Rome immediately after
  Cannae?
subject_entity:
  type: event
  slug: battle-of-cannae
  role: subject
position: >
  No. The march on Rome is a question the Roman literary tradition made
  famous, not an option Hannibal threw away through failure of nerve. His
  army had just fought the largest battle of the war and needed rest;
  Rome lay roughly 400 kilometers away by road, behind a stone circuit
  wall, with new troops being raised in and around it; and Hannibal had
  no siege train. Saguntum, the one walled city he had taken, had cost
  him eight months. More fundamentally, taking Rome was not what he was
  trying to do. His strategy was to strip Rome of its Italian allies and
  bring it to terms, and in the weeks after Cannae that strategy was
  producing defections. The anecdote of Maharbal's reproach survives
  because it dramatizes a Roman thesis, that the city was saved by
  Hannibal's hesitation.
reasoning: >
  Livy, who preserves Maharbal's taunt (22.51), also records that
  Hannibal's other officers urged him to rest himself and his exhausted
  men after the battle. The army had fought through a summer day and had
  the Roman camps and thousands of prisoners on its hands. From Cannae to
  Rome is roughly 400 kilometers by road, some three weeks of marching,
  through country whose towns had not yet chosen sides and past the
  survivors of Cannae regrouping at Canusium.

  Rome was not an open town. After the Gallic sack the Romans rebuilt the
  city's circuit in squared stone, and Livy records the censors' contract
  for it in the 370s (6.32). In the weeks after Cannae the state sent
  1,500 naval troops from Ostia to garrison the city, raised four new
  legions and a thousand cavalry from men as young as seventeen, and
  bought 8,000 slaves to arm at public expense (Livy 22.57). Hannibal had
  no siege train. He could take a fortified city, but Saguntum fell by
  storm only after eight months (Polybius 3.17), with his whole army
  before it and no Roman relief force in the field. A siege of Rome would
  have given Rome and its allies exactly the time to recover that his
  strategy needed them not to have.

  Hannibal did eventually march on Rome, in 211, and the episode shows
  what such a march was worth to him. Polybius gives him a double
  purpose: to gain what he could against the city by surprise, and
  failing that to force the Roman commander at Capua to lift the siege
  (9.4.7–8). He camped within forty stades of the walls and found the men
  of a newly enrolled legion assembling in Rome that very day, sworn to
  report in arms (9.6.5–7). The two accounts then part. In Polybius the
  besiegers of Capua never moved, and when Hannibal learned the siege was
  continuing he withdrew (9.7.7). In Livy the senate called on the Capua
  army after all, and Quintus Fulvius brought 15,000 foot and 1,000 horse
  to Rome while the siege went on (26.8–10). Both describe a moment when
  Hannibal was ready to fight: Polybius has the Carthaginians advance
  "not without hope" of an assault, and Livy has the armies drawn up on
  two successive days and parted each time by a hailstorm (Polybius
  9.6.8; Livy 26.11). Capua fell later that year. The march was chiefly
  an instrument of pressure and never a siege of Rome, though both
  sources leave room for an opportunist who would have taken more had
  the city been less ready.

  What Hannibal wanted after Cannae was a settlement. He sent Roman
  captives to negotiate a ransom, with Carthalo instructed to offer terms
  if the Romans were inclined to peace, and in the speech Livy gives him
  he says he is contending for honor and dominion, not waging a war of
  extermination (22.58). His treaty with Philip V the following year
  plans for a peace that leaves Rome in existence (Polybius 7.9). The
  evidence is set out in the
  [claim on Hannibal's limited war aims](/claims/hannibal-limited-war-aims).
  A general with those aims had no reason to stake his army on a siege
  while Capua and much of the south were coming over to him.

  The exchange is in Livy but not in Polybius, whose account of the
  aftermath (3.117–118) has neither the scene nor any council about
  marching. Plutarch tells the same story but gives the reproach to
  "Barca, the Carthaginian" (*Fabius* 17). A saying with no fixed
  speaker, in neat Latin, serving Livy's verdict that the day's delay
  saved the city, is tradition rather than record. Livy returns to the
  question at Hannibal's departure from Italy in 203, where Hannibal
  curses himself for not leading his soldiers, still reeking with blood,
  straight from Cannae to Rome (30.20). That is the same verdict given to
  Hannibal to speak, in a scene Livy composed.

  Richard [Miles](/sources/miles-carthage-2010) reads the decision the
  same way, giving the exhaustion of men and animals, the distance and
  the fortifications as the practical reasons and the isolation of Rome
  from its allies as the strategy. The decision fits the
  [alliance-detachment strategy](/editorialTakes/hannibal-italian-objective-alliance-dismemberment):
  with the defections in motion, the priority was to hold the southern
  gains, not to gamble the field army on a siege it was not equipped to
  prosecute. The strategy was sound. Its weakness lay elsewhere, in its
  dependence on Rome agreeing to negotiate, which is treated under
  [Why did Cannae not end the war?](/editorialTakes/cannae-roman-refusal-to-negotiate)
confidence: strong
