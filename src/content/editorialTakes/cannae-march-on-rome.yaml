competing_positions:
  - position: >
      Hannibal did fail to use his victory and could have ended the
      war by an immediate march on Rome.
    why_rejected: >
      Built on the Maharbal anecdote (probably non-historical) and
      requires assuming Hannibal had siegecraft and logistics he is
      not attested to have possessed. Sympathetic reading of the
      sources rather than analysis of the operational situation.
    held_by: The Roman literary tradition; some popular military histories.
  - position: >
      The march on Rome was logistically impossible but Hannibal still
      erred by not pressing his advantage in some other form.
    why_rejected: >
      Defensible but non-specific. Hannibal did press his advantage:
      diplomatic outreach, the Italian defections, alliance with
      Philip V of Macedon, his brother Hasdrubal's eventual relief
      expedition. The criticism implicitly demands that he have done
      something dramatic he is not attested to have considered.
    held_by: Some 20th-century military historians.
