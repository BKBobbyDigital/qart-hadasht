slug: himera-greek-pairing
subject_question: >
  How should we read the ancient pairing of Himera with Salamis, and the
  claim that Persia and Carthage coordinated their attacks in 480?
subject_entity:
  type: event
  slug: battle-of-himera
  role: subject
position: >
  As a claim that began with the Syracusan rulers who won the battle, and
  grew in the telling, not as evidence that Persia and Carthage planned
  their attacks together. The pairing is on record within a decade: in
  the ode Pindar wrote for Hieron, Gelon's brother, around 470, Salamis
  earns the poet the Athenians' thanks, Plataea the Spartans', and the
  river Himeras the sons of Deinomenes (*Pythian* 1.75–80). Herodotus,
  a generation later, reports the same-day synchronism with Salamis as
  what the Sicilians say, alongside their excuse for Gelon's failure to
  help Greece, and sets beside it a Carthaginian account of Hamilcar's
  death that he finds more credible (7.165–167). By the fourth century
  the story had grown: Diodorus, probably following Ephorus, has Xerxes
  and Carthage agree to attack the Greeks of Greece and of Sicily at the
  same time (11.1.4–5), and moves the synchronism to Thermopylae (11.24).
  Aristotle, meanwhile, cited the two battles as the example of events
  that happened at the same time "but did not tend to any one result"
  (*Poetics* 23).

  The Carthaginian expedition had a local cause that Herodotus names:
  Terillus, tyrant of Himera, expelled by Theron of Acragas, brought in
  Hamilcar with the help of Anaxilas of Rhegium, who gave Hamilcar his
  own children as hostages (7.165). That is enough to explain the war.
  Whether there was also contact with Persia cannot be excluded, since
  Phoenician cities served in Xerxes' fleet, but the only source that
  asserts an agreement wrote four centuries later, in a tradition shaped
  by Syracusan interest in the story. The one other ancient report of
  Persia asking Carthage for help points the other way: Justin says that
  Darius's envoys asked for auxiliaries against Greece and that Carthage
  refused, pleading its wars with its neighbors (19.1.10–13).
reasoning: >
  The pairing served Syracuse. Gelon had refused to help the mainland
  Greeks unless he commanded, and had sent Cadmus to Delphi with money to
  give Xerxes if the Persians won (Herodotus 7.157–164). A western
  victory over a "barbarian" invasion on the same day as Salamis turned
  that record into a share in the Greek triumph, and the Deinomenids
  advertised it: Gelon's golden tripod at Delphi (Diodorus 11.26), and
  Pindar's ode for Hieron. Miles makes this case (*Carthage Must Be
  Destroyed*, pp. 117–119), and the sources bear it out.

  Herodotus is not the author of the pairing. He introduces both the
  Sicilian excuse and the synchronism as what "the dwellers in Sicily"
  and "they" say (7.165–166), and gives the Carthaginian account of
  Hamilcar's end as the one with "a show of truth" (7.167). Reading 7.166
  as Herodotus's own rhetorical argument, as this site once did, misreads
  a report as an endorsement.

  The coordination story is late and grows with time. Diodorus states it
  as fact and adds the Thermopylae date, a choice Miles attributes to
  Timaeus (p. 142); either way, the synchronism moved from one battle to
  another, which is what a literary claim does and a record does not.
  Aristotle, who could have used it, rejected it.

  What the pairing does show is real: that Greek writers came to imagine
  the struggle with Persia and with Carthage as one war, and that
  Carthage entered Greek thought as the western barbarian partly through
  Syracusan self-promotion. That is a fact about Greek history-writing,
  and a reason to read everything the Greek tradition says about Carthage
  in Sicily with its origins in mind.
