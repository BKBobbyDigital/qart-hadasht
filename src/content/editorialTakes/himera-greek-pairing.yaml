competing_positions:
  - position: >
      The Carthaginian and Persian invasions were coordinated, as
      Diodorus says.
    why_rejected: >
      The only source that asserts an agreement is Diodorus, four
      centuries later, probably after Ephorus; Herodotus, much closer,
      gives a purely Sicilian cause, Aristotle rejects the connection,
      and Justin records Carthage refusing Darius's earlier request for
      help against Greece (19.1). The claim first appears in Syracusan self-presentation,
      which had every reason to want it. Contact cannot be ruled out, but
      nothing establishes it.
    held_by: >
      Diodorus (11.1.4–5), probably following Ephorus.
  - position: >
      Even the shared year is a construction, with Himera's date adjusted
      to match the Persian War.
    why_rejected: >
      Possible but not required. Herodotus, Pindar and Diodorus all place
      Himera in the year of Xerxes' invasion, and the Sicilian cause
      Herodotus gives fits that date. The synchronism of the day is what
      shifts between sources; the year does not.
    held_by: >
      No specific holder; the skeptical limit of the argument.
