weighed_claims:
  - barcid-dynastic-succession-as-state-form
  - carthago-nova-as-planned-foundation
competing_positions:
  - position: >
      War preparation. The Iberian apparatus was durable because a
      long campaign abroad needs durable institutions: cities, revenue,
      silver, coinage and local alliances are what an expeditionary
      empire requires to keep armies in the field for decades. They do
      not call for a separate category of "state." The Barcid command
      remained a Carthaginian military enterprise whose central purpose
      was rebuilding the power lost after 241 and, in the end,
      restoring Carthage against Rome.
    why_rejected: >
      The reading is right that the institutions served war, and the
      site agrees that the command stayed Carthaginian. It
      underdescribes what the institutions had become. A capital with a
      palace, a coinage struck for two decades, marriage alliances with
      Iberian dynasts and a succession kept within one family go beyond
      what "military command" conveys. The disagreement is partly about
      a word, but the word shapes how the period is read.
    held_by: >
      The long-standing default in narrative histories of the Punic
      Wars, which read the Iberian years chiefly as preparation for
      Hannibal's invasion.
  - position: >
      Imperial reconstruction. The Iberian project was primarily
      Carthage's recovery after the First Punic War: Hamilcar sought
      territory, revenue and power, Hasdrubal consolidated them, and
      Hannibal inherited the result. Hostility to Rome existed, but war
      with Rome was not the organizing purpose of the nineteen years;
      the apparatus was built to rule Iberia and restore Carthage, and
      only later became a platform for war.
    why_rejected: >
      Largely compatible with the site's reading, which accepts that
      conquest and recovery came first. It understates how early the
      anti-Roman horizon was present: Polybius places Hamilcar's anger
      and the Sardinian grievance at the root of the Iberian venture,
      and Rome itself treated Barcid expansion as a threat by the 220s.
      The site's nested reading keeps both.
    held_by: >
      Readings that stress the Barcid project as Carthaginian recovery
      and state formation rather than as a preparation for war.
  - position: >
      One integrated project. State-building and war preparation were
      the same activity from 237 BCE; the harbor, the Iberian alliances
      and the silver revenue were shaped from the start to the needs of
      an eventual invasion of Italy, which was one of the system's
      planned outputs.
    why_rejected: >
      No source shows that any Barcid institution was designed or sized
      for an Italian campaign; that inference reads Hannibal's later use
      of the system back into its origins. The integrated reading also
      makes the timing of the war look fixed, when the crisis over
      Saguntum and the Roman response were contingent.
    held_by: >
      Strong forms of the state-building reframing that merge it with
      the older war-preparation reading.
