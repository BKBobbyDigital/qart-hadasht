competing_positions:
  - position: >
      Conditions reading. The savagery was the product of the war's
      conditions: an unpaid army of many nations with no shared loyalty,
      a subject population with long grievances, and a state fighting
      for its existence. Given those conditions escalation was all but
      certain, and the leaders' choices were expressions of pressures
      that would have produced the same result under other leaders.
    why_rejected: >
      Right about the revolt, too strong about the atrocity. Within the
      same conditions Gisco negotiated, Hamilcar released prisoners, and
      the rebel leaders chose the massacre precisely because that policy
      was working. The argument that Carthaginian violence matched the
      rebels' in a way that shows shared conditions does not survive the
      sequence: Hamilcar's killing of prisoners
      followed the massacre and was a response to it.
    held_by: >
      A structural reading found in modern treatments that read the war
      through Carthage's fiscal and imperial failures.
  - position: >
      Leadership reading. The savagery came from the characters of the
      rebel leaders: a runaway slave with nothing to lose, a Libyan who
      feared punishment, and a Gallic chief, who together dragged an
      army that might have settled into a war of extermination.
    why_rejected: >
      Right that their decisions were the turning point, wrong to make
      character the explanation. The personal stakes Polybius gives
      Spendius and Mathos are motives, not temperaments, and the
      conditions explain why the soldiers and the Libyans followed them.
      The reading also tends to treat Hamilcar's reprisals as neutral,
      which neither Polybius's own sequence nor Diodorus allows.
    held_by: >
      The reading suggested by Polybius's moral language about the
      rebel leaders, though not by his whole analysis.
