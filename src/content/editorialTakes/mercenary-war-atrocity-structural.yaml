slug: mercenary-war-atrocity-structural
subject_question: >
  Why did the Mercenary War (241–237 BCE) become the war Polybius
  called "truceless," a war that "far excelled all wars we know of in
  cruelty"? Was the savagery the product of the conditions the war
  was fought in, or of decisions made by the men who led it?
subject_entity:
  type: event
  slug: mercenary-war
  role: subject
position: >
  Both, in sequence. The conditions produced the revolt and made it a
  war Carthage might not survive. Decisions by leaders on both sides
  made it truceless.

  The revolt was structural. Carthage came out of the First Punic War
  unable to pay the army it brought home from Sicily, handled its
  demobilization badly, and tried to talk the soldiers down from what
  they had been promised. At the same time it had ruled its Libyan
  subjects so harshly during the war that, in Polybius's words, they
  "required no incitement to revolt." A pay dispute met a countryside
  ready to rise, and because Libya supplied Carthage with food, revenue
  and soldiers, its revolt put the city itself in danger.

  The atrocity was not inevitable. Settlement was still possible after
  the mutiny began: Gisco brought money and began paying the troops,
  and after his first victories Hamilcar let captured rebels join his
  army or go home. The rebel leaders, fearing that this leniency would
  dissolve their army, answered by mutilating and killing Gisco and
  about seven hundred prisoners and resolving to torture every
  Carthaginian they took. Hamilcar then began throwing his prisoners to
  the elephants. From that point the violence fed itself: surrender was
  dangerous, trust was gone, and each side had reason to expect the
  worst from the other. Both ancient accounts describe this sequence,
  and Polybius offers his own theory of how cruelty escalates.
reasoning: >
  Polybius is more structural about the causes than he is usually given
  credit for. He says the Carthaginians "had chiefly themselves to thank":
  during the war they had taken half the crops of the Libyan peasantry,
  doubled the taxes of the towns without relief for the poor, and
  honored the governors who extracted most, "Hanno for example." When
  the revolt came the men needed only a messenger, and the women, who
  had watched their husbands and fathers arrested for unpaid taxes, gave
  their jewelry to the war fund (1.72). He is just as explicit about the
  handling of the army: Carthage gathered the whole force in one place,
  sent the men and their families out of the city to Sicca, and there
  Hanno pleaded the state's poverty and asked them to give up part of
  their pay (1.66–68). Diodorus says bluntly that Carthage "defrauded"
  its troops (25.2), and Appian that the soldiers were claiming rewards
  Hamilcar had promised them in Sicily (*Iberica* 4–5). The war joined
  two crises, a mutiny over pay and a revolt of subject communities with
  older grievances. Polybius himself calls it the Libyan war (1.88).

  Settlement remained possible for a time. Carthage conceded the
  soldiers' claims one after another (Polybius says the soldiers kept
  inventing new ones, 1.68), and they chose Gisco, whom they trusted, to
  settle the rest; he came with money and began paying the troops nation
  by nation (1.68–69). The break came when Spendius and Mathos worked to
  prevent an agreement. Polybius gives each a personal stake: Spendius,
  a runaway Roman slave, faced torture and death if handed back, and
  Mathos, a free Libyan prominent in the unrest, feared being made to
  bear the whole penalty (1.69). When the Libyans, still unpaid, were
  rebuffed by Gisco, they seized him and the treasury (1.70).

  Hamilcar's early policy shows that the savagery that followed was not
  dictated by the conditions alone. After defeating Spendius and
  Autaritus he let the prisoners who wished join his army and released
  the rest with a warning (1.78). Mathos, Spendius and Autaritus "were
  apprehensive of the effect of Hamilcar's leniency to the prisoners,"
  fearing their men would come to terms (1.79). Their answer was to
  make terms impossible. Gisco and about seven hundred prisoners had
  their hands and limbs cut off, their legs broken, and were thrown
  alive into a trench; Carthage's heralds were told any future envoy
  would suffer the same, and the rebels resolved to torture and kill
  every Carthaginian they captured and send back allies with their hands
  cut off (1.80–81). The act bound the rebel army to the war by making
  its men partners in a crime Carthage would not forgive.

  Carthage's reply was deliberate too, and the site does not treat it as
  mere reaction. Hamilcar now killed rebels taken in the field and threw
  prisoners to the elephants, judging that the rebellion "would never be
  stamped out until the enemy were utterly exterminated" (1.82, 1.84).
  Diodorus draws the connection explicitly: Spendius's cruelty
  "succeeded in undermining Barca's strategy of leniency," and Hamilcar
  "was in this way forced to abandon his kindness to prisoners" (25.3).
  The later war bears the marks of both sides: the rebels trapped at the
  Saw ate their prisoners and slaves; Hamilcar took their leaders by a
  trick, turning a negotiation into an arrest, and cut down the army of
  more than forty thousand; Spendius was crucified before Tunis, and
  when Mathos captured the Carthaginian general Hannibal he crucified him
  on the same cross and killed thirty nobles around it; Mathos was
  finally tortured through the streets of Carthage (1.85–88).

  Polybius explains the escalation in terms close to the site's. Treat
  men in that state with pardon and kindness, he says, and they suspect
  a trick; treat them with retaliation and they compete to outdo you. He
  puts the origin in bad customs and upbringing, but adds that a chief
  contributory cause is "habitual violence and unscrupulousness on the
  part of those in authority over them" (1.81). The site sets aside the
  moral language (he calls the rebels brutalized beyond humanity) and
  his contempt for a many-nationed army, while keeping his real
  observations. An army of many languages, which no general could
  address as a body and which it was impracticable to address through
  several interpreters, was genuinely hard to negotiate with and to
  hold together (1.67).

  Mercenary dependence was a vulnerability, not a sufficient cause, as
  the site argues about the Carthaginian army generally (see the
  [take on the army](/editorialTakes/carthaginian-army-institutionally-mixed)).
  Nor was the revolt a single national movement: the rebel side joined
  foreign soldiers, Libyan subjects, runaway slaves and leaders whose own
  survival depended on the war continuing. Rome, for its part, kept to
  its treaty during the war, refusing both the Sardinian mutineers and
  Utica when they offered themselves (Polybius 1.83); the seizure of
  Sardinia came afterward.
