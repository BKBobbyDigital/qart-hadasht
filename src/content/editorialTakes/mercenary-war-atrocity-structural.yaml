slug: mercenary-war-atrocity-structural
subject_question: >
  Why did the Mercenary War (241–237 BCE) escalate into the
  sustained reciprocal atrocity Polybius called
  *aspondos polemos*, "truceless war"? Was the escalation
  driven by individual rebel leadership (Polybius's framing)
  or by the conditions in which the war was fought (Hoyos's
  framing)?
subject_entity:
  type: event
  slug: mercenary-war
  role: subject
position: >
  Hoyos's reading — that the conditions of the war did most
  of the work — is the better account. The atrocity
  escalation was driven principally by the situation in which
  the war was fought: a multi-ethnic mercenary force with no
  shared political identity to ground restraint, an
  indigenous Libyan rural revolt drawing on long-running
  grievances against Carthaginian rule, a Carthaginian state
  whose survival was at stake, and the early atrocities that
  foreclosed any settlement faster than political machinery
  could rebuild it. Polybius's emphasis on the criminal
  psychology of the rebel leaders captures less of what was
  going on than the conditions did.

  The site holds the reading with explicit acknowledgment
  that the evidence is thin and that part of the case depends
  on importing modern conflict-studies frameworks back onto
  ancient material. Confidence is tentative-to-moderate, not
  stronger. Polybius's framing remains the surviving
  narrative source and has its own explanatory weight.
reasoning: |
  Three observations support the conditions-driven reading,
  with two qualifications about where it is thin.

  Carthaginian-side atrocity matched rebel-side atrocity in
  scale. Polybius preserves the Carthaginian record: Hamilcar's
  troops crucified captured rebels by the hundreds, with
  extended public displays. If the escalation came from rebel
  leadership psychology alone — Spendius's fear of Roman
  extradition, Mathos's hatred of Carthaginian rule — the
  symmetry of Carthaginian atrocity is harder to account for.
  Symmetric brutality across two sides with very different
  leaderships points to something both sides shared, not to
  traits one side's leaders held.

  Modern conflict-studies scholarship on atrocity escalation
  consistently tracks to conditions like the ones the
  Mercenary War actually had: irregular multi-ethnic force
  composition, no shared political identity to ground
  restraint, existential stakes that foreclose negotiated
  settlement, early atrocities that create a coordination
  problem for restraint on later rounds. The Mercenary War
  was close to a textbook fit. Reading modern frameworks
  back onto ancient evidence is a methodological move that
  needs to be acknowledged (see below), but the fit is tight
  enough to be informative.

  Polybius had a blind spot. His default explanatory frame
  for political-military catastrophe is individual virtue and
  vice. Reading the Mercenary War as the consequence of
  rebel leadership's criminal character (Spendius the
  fugitive slave, Mathos the bitter Libyan) is consistent
  with how he reads cause and effect across the rest of the
  *Histories*, and it is not particularly responsive to the
  war's specific conditions. The conditions-framework was
  not available to him; he applied the one he had. That does
  not make his framing wrong, but it does mean the surviving
  framing should not be taken as the verdict on the
  conditions question. It is the verdict on the individuals.

  Where the evidence is thin.

  First, the conditions-driven reading depends on importing
  modern conflict-studies frameworks onto ancient evidence.
  That is defensible for the broad pattern — atrocity-cycle
  dynamics, irregular force composition — but it is not
  unimpeachable. A reader who rejects the back-projection on
  methodological grounds will not be moved. We acknowledge
  the move and stand by it while flagging the dependency.

  Second, the Polybian individual-leadership reading has
  real explanatory weight. Spendius's escaped-slave status
  is concrete and well attested, and his stake in
  foreclosing any negotiated settlement (which could have
  meant extradition to Rome) is a specific motive. Mathos's
  particular hostility to Carthaginian rule is similarly
  concrete. The conditions-driven reading does not need to
  deny the individual-leadership reading; both probably
  contributed. The position is that conditions were the
  principal driver, not that leadership was negligible.
confidence: tentative
weighed_claims: []
competing_positions:
  - position: >
      Polybian / individual-leadership reading. The atrocity
      escalation was driven principally by the specific
      characters of the rebel leaders: Spendius's fear of
      Roman extradition giving him a stake in foreclosing
      settlement; Mathos's hatred of Carthaginian rule;
      Autaritus's role as the Gallic enforcer. The rebel
      leadership's pattern of escalation (mutilating
      Carthaginian envoys, executing prisoners under torture)
      foreclosed political restraint, and the Carthaginian
      response was reactive.
    why_rejected: >
      Does not explain the symmetry of Carthaginian atrocity
      under a leadership (Hamilcar) with no parallel
      personal motive for escalation. Under-weights the
      conditions (multi-ethnic force composition, indigenous
      revolt, existential Carthaginian stakes) that obtain
      regardless of who led. Treats Polybius's moral framing
      as descriptive when it is partly normative. The
      Polybian reading is preserved as the surviving
      narrative default but is not the best account of the
      escalation specifically.
    held_by: >
      Polybius 1.65–88 and the surviving narrative tradition
      derived from it; some treatments that take Polybius's
      moral framing as descriptively reliable.
  - position: >
      Both-causes reading. The escalation was driven by
      conditions AND by individual leadership in reinforcing
      combination, with neither alone sufficient. Conditions
      made escalation possible; specific leaders triggered
      and accelerated it. The readings describe different
      causal layers rather than actually competing.
    why_rejected: >
      More compatible with the site's reading than competing
      with it. The site takes the conditions-driven reading
      as the principal account while acknowledging that
      leadership contributed. The both-causes reading is
      probably more honest about the indeterminacy than the
      principal-conditions framing; we take the position we
      do because the symmetry observation
      (Carthaginian-side atrocity matching rebel-side
      atrocity under different leadership) carries some
      weight toward conditions-as-principal rather than
      equal-contribution. Reasonable readers will hold the
      both-causes position.
    held_by: >
      Probably the implicit position of most current
      treatments that engage Hoyos's framework without
      adopting his full conditions-principal reading.
