slug: carthaginian-army-institutionally-mixed
subject_question: >
  Was Carthage's army a mercenary force, as Polybius's framing
  has long suggested, or was it a mixed institution drawing on
  several different recruitment systems at once? What does the
  documented composition actually attest?
position: >
  Carthage's army was a mixed institution throughout its
  classical-period history. Citizen officers from the
  aristocratic political class commanded it. Libyan subject
  populations supplied the heavy infantry under tribute-and-
  conscription obligation. Numidian cavalry and various Iberian
  contingents fought under treaty arrangements. Mercenaries
  recruited across the Mediterranean filled out the rest, and
  on rare high-stakes occasions Carthage drew on its own
  citizen levy as a distinct formation. Polybius's description
  of Carthage as "predominantly mercenary" and therefore weaker
  than Rome's citizen army (developed at 6.52 as part of his
  Roman-constitutional argument) is ideology dressed as
  analysis. The actual record shows a system whose components
  vary by theatre and period and whose performance on the
  battlefield was, for several centuries, formidable.

  This reading does not minimize the mercenary role. Mercenaries
  carried much of Carthage's imperial expansion, especially in
  the Iberian theatre under the Barcids, and the silver coinage
  Hamilcar and his successors minted at
  [New Carthage](/places/carthago-nova) was largely a pay system
  for them. The [Barcid Iberian state](/narratives/the-barcid-iberian-state)
  ran on silver-for-troops exchanges with Iberian, Celtiberian,
  and Gallic recruitment pools. Sicilian campaigns of the fifth
  and fourth centuries similarly relied on Greek, Italian, and
  Campanian recruits. The point of the "mixed institution"
  reading is not that mercenaries were marginal but that they
  were one part of a coherent military system that also included
  citizen officers, allied contingents, and a citizen reserve.

  Hannibal's army defeated Roman citizen armies repeatedly
  across fifteen years and held Italy for seventeen. The
  Polybian inferiority claim cannot account for this without
  attributing everything to Hannibal personally. The mixed-
  institution reading accounts for it through the ordinary
  workings of a competent army under capable command, which is
  what most ancient Mediterranean armies were. Polybius does
  criticize Hellenistic military decline elsewhere (6.57, and
  the broader anacyclosis argument), but the specific charge
  that mercenary recruitment proves constitutional weakness
  belongs to his Carthage chapter and serves his Roman case.
  That is the argument the army-composition question should
  push against.

  Hannibal's [oath at his father's altar](/people/hannibal-barca)
  shapes the long-arc reading of his strategic orientation. It
  does not bear directly on army composition, but it does bear
  on the broader question of whether the Barcid project was
  improvisation or design. The Iberian state and the army it
  produced were two decades in the making. Treating that army
  as a mercenary rabble that happened to win at Cannae misreads
  what Hamilcar, Hasdrubal the Fair, and Hannibal actually
  built.
reasoning: >
  Three lines of evidence carry the position.

  Composition of the major engagements. The army Hannibal led
  across the Alps included Libyan heavy infantry under
  Carthaginian officers (drawn from the African subject
  populations under tribute and conscription), Iberian and
  Celtiberian infantry under a mix of treaty and recruitment,
  Numidian cavalry serving under the Massylii and Masaesyli
  kingdoms, Gallic contingents picked up in the Po valley, and
  a small core of citizen-Carthaginian officers. The Zama army
  of 202 BCE drew, for the first time in decades, on a
  significant Carthaginian citizen levy, alongside Italian
  veterans who came back with Hannibal, Ligurian and Gallic
  mercenaries from his northern campaigns, and what was left of
  the Numidian cavalry. Across these engagements the "mostly
  mercenary" label fits poorly. Libyans were not mercenaries:
  they were subjects fulfilling a state obligation. Numidians
  were not mercenaries either: they served under treaties with
  their own kings. The Iberian contingents were a mix that
  modern category systems do not map cleanly.

  The Mercenary War as demobilization crisis, not structural
  pattern. The 240–238 BCE war (treated in the
  [Mercenary War narrative](/narratives/the-mercenary-war)) was
  what happened when a specific army (the Sicilian-theatre
  force of the First Punic War, heavily mercenary in
  composition, owed substantial back pay) could not be
  demobilized cleanly because the Carthaginian treasury was
  exhausted by the indemnity. Some readings have taken the
  crisis as evidence that Carthage was structurally dependent
  on troops it could not control. That reading conflates a
  post-war demobilization failure (driven by fiscal exhaustion
  and command incompetence in the immediate post-treaty months)
  with a permanent feature of the system. The Barcid Iberian
  project that followed rebuilt army composition with much
  better pay infrastructure and command continuity. That army,
  not the demobilizing remnant of 241, is the one that fought
  the Second Punic War.

  The mint-and-mercenary system as a functional institution.
  The Barcid Iberian silver coinage (treated under
  [Barcid Iberian coinage](/artifacts/barcid-iberian-coinage))
  is the material trace of a working military-financial
  system. The Barcids extracted silver from the Iberian mines
  at scale, minted it on Carthaginian standards calibrated for
  pay across several recruitment pools, and distributed it
  through a command apparatus that held the army together
  across Iberian, Mediterranean, and Italian theatres for two
  decades. An army that runs that kind of operation across that
  much time and ground is not the "structurally inferior
  mercenary force" Polybius wants. It is a functional military
  state. Mercenaries were essential to it; that does not make
  them the whole of it.

  Unit cohesion as institutional achievement, not contingent
  command. Rawlings and Hall
  ([2023](/sources/rawlings-hall-unit-cohesion-2023)) is the
  most direct recent specialist treatment of how a multi-ethnic
  Carthaginian force could function as a coherent fighting
  institution rather than as the structurally weaker force
  Polybius describes. Their analysis identifies the mechanisms
  the Polybian framing cannot account for: ethnically-coherent
  sub-units commanded by officers from the same recruitment
  pool, shared religious practice and pre-battle ritual binding
  diverse contingents to a common purpose, the
  financial-administrative infrastructure (the Barcid silver
  apparatus discussed above) that gave troops a tangible
  institutional connection to the army employing them, and the
  multi-year campaign experience that built unit-level cohesion
  through the kind of deployments Hannibal's Italian campaign
  in particular produced. The reading pushes explicitly against
  modern reception that treats Hannibal's army as held together
  only by one man's tactical genius. The army's coherence was
  the achievement of an actual military system. Rawlings's
  earlier
  [1996 chapter](/sources/rawlings-celts-spaniards-samnites-1996)
  on Celtic, Iberian, and Samnite contingents in the war
  develops the parallel point that these were warriors operating
  within their own military traditions rather than passive
  instruments of either great power.
confidence: moderate
weighed_claims: []
competing_positions:
  - position: >
      Polybian mercenary-predominance reading. Carthage's army
      was a mercenary force, and the mercenary character
      produced structural weaknesses relative to Rome's citizen
      army: poor cohesion, defections at decisive moments,
      vulnerability to pay disputes, and the long-arc inability
      to convert battlefield wins into political settlement.
      The Mercenary War proves the structural fragility; Zama
      proves the superiority of citizen recruitment.
    why_rejected: >
      Treats a specific demobilization crisis (the Mercenary
      War) as if it were the permanent shape of the system;
      reads Polybius's inferiority claim as analysis when it is
      argument; cannot account for sustained Carthaginian
      battlefield success across both Punic Wars; collapses
      Libyan subject-population conscription and Numidian
      treaty-allied cavalry into "mercenary" when they are
      neither; and applies a Greek citizen-soldier standard
      that does not actually describe most ancient
      Mediterranean armies of the period. Rawlings's
      [*Ancient Greeks at War*](/sources/rawlings-ancient-greeks-at-war-2007)
      makes the parallel point on the Greek side — the
      citizen-versus-mercenary categorical distinction is a
      modern construction that did not match the actual
      Hellenistic-period institutional reality on either side
      of the Mediterranean.
    held_by: >
      The default position through much of the 19th and 20th
      centuries; still found in popular and survey-level
      writing.
  - position: >
      Substantially-citizen-based reading. Recent revisionist
      work has argued that Carthage's army was closer to a
      citizen-and-allied institution on the Hellenistic
      pattern: Libyan and African subject populations should
      count as a kind of Carthaginian imperial citizenry,
      mercenaries were a smaller share than traditionally
      thought, and the institutional shape is much closer to
      the successor kingdoms than to a mercenary regime.
    why_rejected: >
      Pushes back against Polybius too far in the other
      direction. The Barcid silver-and-mercenary system in
      Iberia is solid material evidence that mercenaries were a
      core part of how the army worked. The Sicilian campaigns
      drew heavily on Greek, Italian, and Campanian
      recruitment. And Carthage's citizen levy capacity was
      simply small next to Rome's. Stretching the "citizen"
      category to absorb Libyan subjects is more an analytical
      move than an institutional fact.
    held_by: >
      Some recent revisionist work in Carthaginian military
      history; a minority position.
