slug: carthaginian-army-institutionally-mixed
subject_question: >
  Was Carthage's army a mercenary force, as Polybius's framing has long
  suggested, or was it a mixed institution drawing on several different
  recruitment systems at once? What does the documented composition
  actually attest?
position: >
  Carthaginian armies were not mercenary armies in any simple sense.
  They were institutionally mixed: their soldiers served through
  different political and economic relationships, not through a single
  system of hire. Carthaginian citizens commanded and, at times, fought;
  Libyan subject communities supplied large infantry contingents; allied
  kings and communities, Numidian and Iberian among them, sent forces;
  and men from across the western Mediterranean served for pay. The
  categories overlapped, especially in Iberia, and the balance among
  them changed greatly by period and theater. Overseas campaigns could
  depend heavily on paid troops, while a direct threat to Carthage
  brought out the citizens in large numbers.

  Polybius identified something real. When he contrasts Rome, whose
  armies were citizens and allies, with Carthage, which used foreign
  mercenaries (6.52), he is describing a genuine dependence on
  non-citizen manpower, and the Mercenary War showed how dangerous that
  dependence could be. Where he misleads is in folding several different
  relationships into one word and treating recruitment status as a
  measure of soldiers' quality. His own narrative distinguishes paid
  troops, Libyan subjects, Numidians and Carthaginian citizens, and the
  record of Carthaginian warfare shows mixed forces holding together and
  fighting well for years at a time.

  The system had real weaknesses, and at the strategic level Polybius
  was partly right. Paid troops had to be financed, allies kept, and
  subjects kept loyal. Rome's citizen-and-allied manpower was more
  deeply bound to the state and let it absorb disasters like Cannae and
  keep raising armies. Carthage's system was flexible and tactically
  formidable but more externally dependent. Polybius mistook a real
  difference in political integration and long-run resilience for a
  simple difference in the quality of soldiers.
reasoning: >
  "Institutionally mixed" means more than multiethnic, since many ancient
  armies were multiethnic. It means that Carthaginian soldiers owed
  service in different ways. Citizens served as officers and, when the
  city required it, in the ranks. Libyan communities under Carthaginian
  rule paid tribute and supplied troops. Numidian and Iberian contingents
  often came through agreements with kings and local leaders. Soldiers
  from Iberia, Gaul, Liguria, the Balearic Islands and the Greek world
  served for pay. The lines between these were not always clean: Libyans
  appear both as levies from subject towns and in large numbers among the
  paid troops (Polybius counts them as the largest group in the army that
  revolted in 241, 1.67.7), and Iberian service under the Barcids mixed
  alliance, obligation and pay in ways the categories do not map neatly.
  Strategic command was normally held by Carthaginian citizens, often of
  leading families, while contingents could keep leaders from their own
  communities.

  The citizen component is easy to underrate. At the Crimisus in Sicily
  (conventionally 341) the citizen Sacred Band of 2,500 was destroyed
  (Diodorus 16.80), but when Agathocles invaded Africa in 310 the
  Carthaginian generals did not wait for troops from the countryside or
  the allies: they led out the citizens, at least 40,000 infantry, with
  the Sacred Band again in the line (Diodorus 20.10–12). Citizens were
  normally few in overseas field armies and numerous in defense of the
  city, as the final defense of Carthage in 149–146 also showed. That
  pattern can be read as weakness, as Polybius reads it, or as a
  particular division of military labor in an imperial state that spared
  its citizens long service abroad. See the
  [Sacred Band](/groups/sacred-band).

  The Mercenary War (241–237) exposed a genuine vulnerability. An army
  of paid troops, many of them Libyans, returned from Sicily owed years
  of wages the exhausted treasury could not pay, and demobilization was
  badly handled. When Libyan subject towns joined the revolt, the danger
  became existential, because two of Carthage's manpower channels had
  turned on it at once (Polybius 1.65–88). The war shows what could go
  wrong when pay and subject loyalty failed together. It does not show
  that Carthaginian armies were normally incoherent, and the
  [Mercenary War narrative](/narratives/the-mercenary-war) treats it in
  full.

  The Barcid decades in Iberia gave Hannibal's generation an unusually
  mature base: steady silver revenue, a coinage struck for two decades,
  command continuity and networks of alliance and recruitment (see the
  [Barcid Iberian coinage](/artifacts/barcid-iberian-coinage) and
  [the Barcid Iberian state](/narratives/the-barcid-iberian-state)).
  Nothing in the sources describes a formal reform of the army, but the
  fiscal and political framework for keeping a mixed army in the field
  was far more stable than the one that had failed in 241.

  The strongest answer to the "mercenary rabble" picture is cohesion over
  time. Hannibal's army of Libyans, Iberians, Numidians and, later, Gauls
  and Italians crossed the Alps, absorbed heavy losses, took on new
  contingents and changed in composition, and still fought as a disciplined
  force across roughly fifteen years in Italy (218–203). Its cohesion
  cannot be put down to Hannibal's personality alone, though his command
  plainly mattered. Joshua Hall and Louis Rawlings, in the most direct
  recent study
  ([2023](/sources/rawlings-hall-unit-cohesion-2023)), stress vertical
  cohesion, the bonds between soldiers and their commanders, while
  acknowledging how much about training and leadership the sources leave
  to inference. Rawlings's
  [earlier chapter](/sources/rawlings-celts-spaniards-samnites-1996) on
  Celtic, Iberian and Samnite warriors treats those contingents as
  fighting within their own military traditions.

  Battlefield success is not the whole story, and the site does not
  claim the Carthaginian system was Rome's equal. Rome lost three armies
  in three years, replaced them, and outlasted Hannibal; Carthage's
  armies depended on money, alliances and loyalties that Roman armies
  did not need to purchase or negotiate in the same way. Mixed
  recruitment did not prevent tactical excellence. It did make the
  system more fragile over a long war.
confidence: moderate
weighed_claims:
  - crimisus-sacred-band
competing_positions:
  - position: >
      The Polybian reading. Carthage's army was essentially mercenary,
      and that made it weaker than Rome's citizen army: less loyal,
      vulnerable to pay disputes, and unable to convert battlefield
      victories into political results. The Mercenary War exposed the
      fragility, and Rome's victory in the Second Punic War showed the
      superiority of an army of citizens and allies.
    why_rejected: >
      Partly accepted. Carthage did depend heavily on non-citizen
      manpower, the Mercenary War did expose a real vulnerability, and
      Rome's manpower system was more resilient in a long war. What the
      reading gets wrong is the reduction of subject levies, allied
      contingents and citizen service to "mercenaries," and the
      inference from recruitment status to fighting quality, which
      Carthaginian armies repeatedly disproved on the battlefield.
    held_by: >
      Polybius (6.52) and the long tradition that followed him; still
      common in popular and survey writing.
  - position: >
      Equal alternative. Carthage's mixed system was as effective as
      Rome's, and Carthage lost the Second Punic War through contingent
      decisions and Roman political obstinacy rather than any weakness
      in how it raised armies.
    why_rejected: >
      Contingency mattered, but the difference in manpower depth is
      real. Rome could replace the armies lost at the Trebia, Trasimene
      and Cannae from its own citizens and allies; Carthage had to pay
      for, negotiate for, and ship its reinforcements, and much of what
      it sent never reached Hannibal. The site treats the Carthaginian
      system as tactically formidable and strategically more fragile,
      not as Rome's equal.
    held_by: >
      Readings that correct the "mercenary rabble" stereotype so far as
      to deny any structural disadvantage.
