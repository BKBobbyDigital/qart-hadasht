slug: fpw-causation
subject_question: >
  What caused the First Punic War: long-developing imperial forces, the
  new proximity of Rome and Carthage after Pyrrhus, or contingent
  decisions at Messana in 265–264 BCE that escalated beyond what either
  party had intended?
subject_entity:
  type: event
  slug: first-punic-war-outbreak
  role: subject
position: >
  The war had a precondition, an occasion, and a decision, and the site
  gives each its own weight. The precondition was proximity. By about
  270 BCE Rome had absorbed the Samnites and the Greek cities of the
  south and stood on the Strait of Messina at Rhegium, while Carthage
  held western Sicily and the Lipari Islands just to the north. With
  Pyrrhus gone, nothing stood between them, and the arrangement made
  Rome in particular uneasy: Polybius records the fear that a Carthage
  holding Messana would have a bridge into Italy. The occasion was
  contingent. The Mamertine crisis of 265–264 unfolded through
  Mamertine, Carthaginian, and Roman decisions, none of which had to go
  the way they did, and nothing required the break to come in that year
  or in that form. The decision came after the outbreak. In 263 Rome
  sent both consuls and four legions, far more than Messana required;
  Carthage answered by building a new mercenary army at Agrigentum
  rather than negotiating; and after Agrigentum fell in 261 Rome
  resolved to drive Carthage out of Sicily and built a fleet to do it.
  The outbreak was contingent, but it happened on ground where friction
  had become likely. The twenty-three-year war for Sicily was chosen, by
  both sides, in its first three years.
reasoning: >
  The treaties between Rome and Carthage (509, 348, and probably 279)
  describe two powers whose spheres barely touched, and for most of
  that period something stood between them: the Greek cities of
  southern Italy, the Samnites, and in the 270s Pyrrhus, against whom
  the two states made common cause. The buffers went in quick
  succession. Pyrrhus left Italy in 275, Tarentum fell to Rome in 272,
  and in 270 Rome retook Rhegium, on the Italian side of the strait, and
  executed the Campanian garrison that had seized it. Carthage already
  held the west of Sicily and kept a naval base in the Lipari Islands.
  The strait became a frontier.

  Polybius (1.10) gives the Roman side of what that felt like.
  Carthage, he says, already ruled Africa, much of Iberia, Sardinia and
  the islands of the Tyrrhenian and Sardinian seas, and if it took
  Messana, and after it Syracuse, it would hem Italy in and hold a
  crossing into it. Polybius wrote with hindsight and the argument
  suits a Roman case for intervention, but the fear is plausible on the
  map, and the Carthaginian side shows the same sensitivity from the
  other direction: the tradition Polybius attributes to Philinus had a
  treaty keeping Romans out of Sicily altogether. Both powers had come
  to treat the strait as a line. That does not make war inevitable, but
  it explains why a local crisis at Messana could not stay local.

  The outbreak itself remains the best case for contingency. Polybius
  reports a senate that would not decide, a question pushed to the
  popular assembly, and a vote carried partly on the prospect of
  plunder. This evidence needs the same caution the site applies to
  Roman self-presentation elsewhere. Polybius very likely had the
  episode from Fabius Pictor, and a reluctant Rome drawn into war by
  others is a flattering story for Rome to tell. Even discounted, it
  points to real hesitation: a state already committed to conquering
  Sicily would not have needed the argument made to it. And the
  sequence of events at Messana (two appeals, a Carthaginian garrison
  admitted and then expelled, a makeshift crossing) is the texture of a
  crisis being improvised, not a plan being executed.

  What contingency cannot explain is what happened next. The
  commitment of 263, with both consular armies in Sicily, went well
  beyond holding Messana; it brought over Hiero of Syracuse and a string
  of Sicilian towns, and it was a fresh decision made with the war
  already under way. Carthage made its own, turning Agrigentum into a
  base and filling it with newly hired mercenaries. After the city fell,
  Polybius (1.20) has the senate resolve to expel Carthage from the
  island and recognize that this required a fleet, a claim the site
  accepts in outline while noting that his neat turning point also
  serves his account of an ambition that grew with success (see the
  [claim on Rome's enlarged war aims](/claims/agrigentum-roman-war-aims-enlarged)).
  By 260 both states were fighting for Sicily as a whole, and both had
  chosen to.

  This gives the first war a structure close to the one the site
  proposes for the second under the
  [SPW causation take](/editorialTakes/spw-causation), with the order
  reversed. There, the underlying grievance made war possible and a
  decision at Saguntum made it happen when it did. Here, proximity made
  war likely, an improvised crisis started it, and the decisions that
  made it a war for Sicily came afterward.
confidence: moderate
