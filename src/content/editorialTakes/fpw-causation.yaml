competing_positions:
  - position: >
      The war was chosen from the start by an aggressive Roman state.
      Roman society was organized for annual war, and the Mamertine
      appeal was an opportunity such a state was always likely to take;
      the senate's hesitation matters less than the fact that Rome
      crossed, escalated, and kept fighting.
    why_rejected: >
      Partly adopted. This reading explains the escalation of 263–261
      better than any other, and the site's position takes it on for
      that phase. As an account of 264 it asks too much. It treats Roman
      appetite as sufficient and gives no weight to the specific
      proximity after 270 that turned Messana into a flashpoint, or to
      the evidence of improvisation in the crisis itself.
    held_by: >
      [William Harris](/sources/harris-war-and-imperialism-1979),
      *War and Imperialism in Republican Rome* (1979), and the
      scholarship that followed him.
  - position: >
      Rome acted defensively. Carthage's garrison at Messana was the
      aggressive act, and Rome crossed the strait to keep a hostile
      power from Italy's doorstep, as it acquired much of its empire,
      reluctantly and in response to threats.
    why_rejected: >
      The fear it describes was real, and the site's emphasis on
      proximity owes something to it. But it takes Polybius, and behind
      him Fabius Pictor, at face value on the question where Roman
      self-presentation had most at stake. The Carthaginian garrison was
      admitted at Mamertine invitation, and the defensive reading has no
      account of why a defensive war became, within three years, a war
      to expel Carthage from Sicily.
    held_by: >
      Polybius's framing, following Fabius Pictor; the older modern
      consensus of "defensive imperialism" from Mommsen through Tenney
      Frank and Maurice Holleaux, which Harris set out to overturn.
  - position: >
      The war was essentially an accident. A local crisis escalated
      through decisions neither side intended, and the conflict that
      followed was the working out of that unplanned beginning rather
      than of any chosen aim.
    why_rejected: >
      This was the site's own earlier position, and it remains right
      about 264. It does not reach the escalation of 263–261, which was
      decided by both powers with the war already under way, and its
      central evidence, the hesitant senate, comes through a pro-Roman
      tradition with reasons to tell it.
    held_by: >
      The strong form of the contingency reading associated with
      [Hoyos](/sources/hoyos-unplanned-wars-1998), *Unplanned Wars*
      (1998).
  - position: >
      Neither power was unusually aggressive. The Mediterranean was a
      system of militarized, expansionist states with no law above them,
      and once the buffers between Rome and Carthage were gone,
      competition between them was structural rather than chosen.
    why_rejected: >
      Largely compatible. The site takes from this reading its
      insistence that Carthage was an actor with a strategy of its own,
      not a passive victim, and its explanation of why proximity was
      dangerous. It rejects only the implication that the particular
      decisions of 263–261 were forced. The system made a clash likely;
      it did not dictate that both states would convert a quarrel over
      Messana into a war for the whole island.
    held_by: >
      [Arthur Eckstein](/sources/eckstein-mediterranean-anarchy-2006),
      *Mediterranean Anarchy, Interstate War, and the Rise of Rome*
      (2006).
