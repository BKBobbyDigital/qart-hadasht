competing_positions:
  - position: >
      Rome's expansion in the western Mediterranean was structurally
      inevitable by the 260s BCE; the Mamertine crisis was a trigger,
      not a cause.
    why_rejected: >
      The structural reading is consistent with the long-term outcome
      but not well-supported by the moment-of-decision evidence. If
      Roman expansion had been settled, the senate would not have
      divided and the comitia would not have needed to be persuaded.
    held_by: An older view, dominant in mid-20th-century scholarship.
  - position: >
      Carthaginian imperial expansion in Sicily was the actual cause;
      Rome's intervention was a defensive response.
    why_rejected: >
      Polybius's framing essentially. Treats the Carthaginian garrison
      at Messana as the aggressive act and Roman action as response.
      Defensible if Polybius is read at face value, but Hoyos's source
      critique and the Philinus tradition complicate the framing.
      The Carthaginian intervention was not unambiguously aggressive
      in the way this reading requires.
    held_by: The Polybian framing; followed by sources that take Polybius
      at face value.
