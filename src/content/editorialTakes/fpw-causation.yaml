competing_positions:
  - position: >
      Rome's expansion in the western Mediterranean was
      inevitable by the 260s BCE; the Mamertine crisis was a
      trigger, not a cause.
    why_rejected: >
      The deterministic reading is consistent with the
      long-term outcome but not well supported by the
      moment-of-decision evidence. If Roman expansion had
      been a settled commitment, the senate would not have
      divided and the comitia would not have needed to be
      persuaded.
    held_by: >
      An older view, dominant in mid-twentieth-century
      scholarship.
  - position: >
      Carthaginian expansion in Sicily was the actual cause;
      Rome's intervention was a defensive response.
    why_rejected: >
      Essentially the Polybian framing. Treats the
      Carthaginian garrison at Messana as the aggressive act
      and the Roman response as defensive. Defensible if
      Polybius is read at face value, but Hoyos's source
      critique and the Philinus tradition complicate the
      reading. The Carthaginian intervention was not
      unambiguously aggressive in the way this position
      requires.
    held_by: >
      The Polybian framing; followed by sources that take
      Polybius at face value.
