slug: fpw-causation
subject_question: >
  Was the First Punic War the product of long-developing
  forces (Roman expansion, Carthaginian imperial defense) or
  of contingent decisions in 265–264 BCE that escalated
  beyond what either party had intended?
subject_entity:
  type: event
  slug: first-punic-war-outbreak
  role: subject
position: >
  The contingent reading is closer to the truth. Rome and
  Carthage in 265 BCE were not on an inevitable collision
  course; they had coexisted under a series of treaties for
  two and a half centuries. The war emerged from a specific
  political crisis at Messana that escalated through
  Carthaginian, Mamertine, and Roman decisions, none of
  which had to be made the way they were. The deterministic
  reading retroactively imposes a teleology of Roman
  expansion that was not visible to the actors of 265–264
  and is hard to reconstruct from the surviving sources.
  This does not imply that Rome was a peaceful actor or that
  Carthage was; neither was. The point is that the war's
  outbreak in this year, in this form, was contingent.
reasoning: >
  Three lines of evidence support reading the war as
  contingent rather than structurally inevitable.

  The Roman senatorial division. Polybius, a historian
  generally favorable to Roman decision-making, explicitly
  reports that the senate could not reach a position on the
  Mamertine appeal and referred the matter to the comitia.
  A coherent imperial program would not have produced that
  kind of constitutional indecision. Whatever was pushing
  Rome toward Sicily in 265 was not a settled policy.

  The unusual character of the comitial vote. The matter
  was unusual enough to require the people's decision, and
  even then was reportedly carried by a mix of strategic
  anxiety and the prospect of plunder. That is not the
  operation of long-developing imperial design.

  The pre-264 record. The known treaties between Rome and
  Carthage (509, 348, possibly 279/278) had established a
  pattern of mutual restraint. Both states had observed it
  through the Pyrrhic War, when their interests aligned
  against a common enemy. The break in that pattern in 264
  was not the culmination of a long deterioration; it was a
  sudden crisis produced by a specific event.

  Hoyos's *Unplanned Wars* (1998) substantially reshaped
  Anglophone scholarship on this question. The site adopts
  the reading not on faith but because the evidence
  preserved in Polybius supports it more clearly than the
  older deterministic reading does. The deterministic
  reading is not refuted by what the sources say; it is
  under-supported by what they say.

  This take applies to the war's outbreak, not to its
  character once underway. Once Rome was committed to
  overseas warfare and Carthage to defending its Sicilian
  position, both states behaved in ways that look more
  imperial, and the war's escalation, duration, and terms
  are properly read in those terms. But the decision to
  begin the war in 264 was not the decision of two states
  pursuing settled imperial programs.
confidence: moderate
