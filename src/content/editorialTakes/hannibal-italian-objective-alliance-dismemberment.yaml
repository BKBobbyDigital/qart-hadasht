weighed_claims: []
competing_positions:
  - position: >
      Strategy-less drift reading. Hannibal was a brilliant
      tactician whose strategic concept never extended beyond
      beating Roman armies in the field. The Italian campaign
      drifted forward year by year because Hannibal had no
      clear end-state in mind and could not translate
      battlefield wins into political settlement. The seventeen
      years are momentum, not intent.
    why_rejected: >
      Cannot account for the prisoner-release pattern across
      multiple major engagements; cannot account for the
      defection cascade after Cannae; treats seventeen years
      of theater-specific persistence as something momentum
      can explain. The reading also underestimates the
      Barcid project Hannibal inherited, treating him as a
      battlefield general rather than as his father's
      strategic heir.
    held_by: >
      Some Polybian-faithful readings that take the Greek
      tradition's Hannibal-as-tactical-genius framing at face
      value; some modern treatments that read the campaign's
      eventual failure backward as evidence of strategic
      incoherence.
  - position: >
      March-on-Rome reading. Hannibal's actual objective was
      to take or destroy Rome itself, and the campaign's
      failure was his decision not to march on Rome after
      Cannae when the city lay open. Maharbal's reported
      reproach ("you know how to win a victory, Hannibal, but
      not how to use one") encodes the historical judgment.
    why_rejected: >
      The Maharbal line is a Livian set-piece (Livy 22.51) that
      may not preserve a real exchange. Even if it does, it is
      a critique of one tactical option, not a description of
      what the campaign was for. Cannae did not put Rome within
      Hannibal's siege capability. He had no siege train, no
      logistical base in Latium, and no allied infrastructure
      to support a Roman siege. The march-on-Rome framing also
      assumes Rome's destruction was the goal, when the
      prisoner-release pattern and the defection cascade show
      the goal was the alliance system, with Rome's reduction
      a downstream consequence rather than the immediate
      target. The framing is largely a nineteenth- and
      twentieth-century reception-history reading rather than
      one the ancient sources actually support.
    held_by: >
      Popular military history from the nineteenth century
      onward; occasional modern military-history treatments.
      Rarely defended in current academic Punic-war
      scholarship.
