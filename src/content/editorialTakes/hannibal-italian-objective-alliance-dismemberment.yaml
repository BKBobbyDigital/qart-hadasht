competing_positions:
  - position: >
      Improvised-endgame reading. Hannibal did deliberately seek Italian
      defections, but he had no adequate theory for turning them into
      victory. His campaign joined a consistent diplomatic tactic to a
      great deal of improvisation, and once Rome refused to negotiate
      and the alliance failed to collapse beyond the south, he never
      found a workable replacement.
    why_rejected: >
      Partly accepted. The site agrees that Hannibal's route to a
      settlement depended on Rome agreeing to negotiate, and that after
      Rome refused and began recovering its allies he had no
      alternative that could win. But the Philip treaty and the
      Carthalo mission show a defined end in view, a negotiated peace
      with a reduced Rome, and the later war was organized around
      holding the coalition rather than around nothing. The failure
      was of reach, not of concept.
    held_by: >
      A skeptical reading found in accounts that stress how far
      ancient strategy was improvised and that judge the plan by its
      failure.
  - position: >
      Military-decision reading. Hannibal sought decisive victories
      that would leave Rome unable to resist. After Cannae an advance
      on Rome might have turned military catastrophe into political
      collapse, and his failure to attempt it gave Rome time to
      recover. Diplomacy with the allies was a supplement, not the
      main mechanism.
    why_rejected: >
      The battles were real attempts to destroy Roman armies, and the
      site does not deny it. But Polybius names the political purpose
      of the prisoner policy from the first winter, the treaty with
      Philip assumes a surviving Rome, and the ancient question of
      whether he should have marched after Cannae (Livy's Maharbal
      scene, 22.51) is a question about one decision, not evidence
      that taking Rome was the campaign's aim. Hannibal also lacked
      the means for a siege of Rome, as the separate take sets out.
    held_by: >
      A long-standing popular reading, encouraged by the Maharbal
      story; rarely argued in this strong form.
