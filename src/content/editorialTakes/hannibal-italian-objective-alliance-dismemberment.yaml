weighed_claims: []
competing_positions:
  - position: >
      Strategy-less drift reading. Hannibal was an operationally
      brilliant commander whose strategic concept never extended
      beyond defeating Roman armies in the field. The Italian
      campaign drifted forward year after year because Hannibal
      lacked a clear strategic end-state and could not translate
      battlefield victories into political settlement. The
      seventeen-year persistence reflects operational momentum
      rather than strategic intent.
    why_rejected: >
      Cannot account for the consistent prisoner-release
      signaling pattern across multiple major engagements; cannot
      account for the post-Cannae Italian defection cascade that
      the signaling program produced; treats
      seventeen years of theatre-specific persistence as
      explicable by momentum rather than by strategic concept.
      The drift reading also under-weights the long-arc Barcid
      project of which the Italian campaign was the culmination,
      treating Hannibal as a tactical commander rather than as
      the strategic heir of his father's two-decade Iberian
      state-building program.
    held_by: >
      Some Polybian-faithful readings that take the Greek-
      historiographical framing of Hannibal as primarily a
      tactical genius at face value; occasional modern
      treatments that emphasize the campaign's failure as
      evidence of strategic incoherence.
  - position: >
      March-on-Rome reading. Hannibal's strategic objective was
      the capture or destruction of Rome itself, and the
      campaign's structural failure was Hannibal's decision not
      to march on Rome after Cannae when the city was most
      vulnerable. Maharbal's reported reproach ("you know how to
      win a victory, Hannibal, but not how to use one") encodes
      the historical judgment.
    why_rejected: >
      The Maharbal reproach is a Livian set-piece that may not
      preserve a historical exchange; even if historical, it
      reflects a tactical-option critique rather than the
      strategic objective. Cannae did not put Rome within
      Hannibal's siege capability — he lacked the siege train,
      the logistics, and the Italian-allied infrastructure that
      a Roman siege would have required. The march-on-Rome
      framing also retrospectively assumes the destruction of
      Rome was the strategic objective; the prisoner-release
      pattern and the alliance-defection program show the
      strategic objective was alliance-dismemberment, with
      Rome's reduction as the downstream consequence of
      alliance collapse rather than as the direct campaign
      goal. The framing is a 19th- and 20th-century reception-
      history reading more than an ancient-source-supported
      one.
    held_by: >
      Popular historical writing from the 19th century through
      the present; occasional modern military-history
      treatments. Rarely articulated as the position to defend
      in current academic Punic-war scholarship.
