slug: hannibal-italian-objective-alliance-dismemberment
subject_question: >
  What was Hannibal's strategic objective in the Italian campaign
  (218–203 BCE)? Was the invasion meant to take Rome, to break up
  Rome's Italian alliance, or did it drift without a clear end in view?
subject_entity:
  type: person
  slug: hannibal-barca
  role: subject
position: >
  Hannibal attacked Rome by attacking the Italian confederation that
  supplied its soldiers, land and reach. Detaching Rome's allies was
  the method, and it is one of the better-attested parts of his
  strategy: Polybius says in so many words that Hannibal released
  allied prisoners without ransom to win the Italians over and turn
  them against Rome (3.77, 3.85). The end the method served was
  probably not Rome's destruction but a Rome reduced and forced to
  negotiate. His treaty with Philip V treats his Italian allies as
  members of a coalition and plans for a peace with a Rome that still
  exists (Polybius 7.9). How far he meant to reduce Rome cannot be
  recovered.

  The strategy changed as the war did. Until Cannae he paired the
  destruction of Roman armies with courting the allies; after Cannae
  a large part of the south came over, and he worked to hold and widen
  that coalition; as Rome won back Capua (211) and Tarentum (209), the
  war became one of defending what remained and waiting for help that,
  after the Metaurus in 207, did not come. That is adaptation, not
  drift, but it is not one unchanged plan across fifteen years either.

  The idea was sound; its reach was not. Hannibal was right that Roman
  power depended on Italy, and he broke away much of the south. But
  the confederation was not uniform. Latium, the Latin colonies,
  Etruria and Umbria did not go over, and Rome raised armies faster
  than the defections could wear down its manpower.
reasoning: >
  The direct evidence comes first. After the Trebia, Polybius says,
  Hannibal kept his Roman prisoners on short rations but treated the
  allies kindly, told them he had come to fight the Romans on their
  behalf and to restore the liberty of the peoples of Italy, and sent
  them home without ransom, "his aim in doing so being both to gain
  over the inhabitants of Italy to his own cause and to alienate their
  affections from Rome" (3.77). After Trasimene he did the same: the
  Romans were put under guard, the allies sent home, with the
  statement that he had come to fight the Romans "for the freedom of
  Italy" (3.85; Livy 22.7). After Cannae Livy has the allies released
  "as they had been at the Trebia and at Trasumennus" (22.58). The
  liberation language is Hannibal's own presentation of the war, not a
  description the site adopts; what matters is that Polybius states
  the political purpose rather than leaving it to inference. He also
  shows that the defections were sought before they came: in 217,
  after two Roman defeats, "not a single Italian city had revolted,"
  and Hannibal was ravaging the Campanian plain in the hope that the
  towns would break away (3.90).

  The treaty with Philip V of Macedon is the best evidence for what
  the method was for. In the text Polybius preserves, Hannibal swears
  to protect his allies "in Italy, Gaul, and Liguria," present and
  future, and provides that if the Romans ask for peace it will
  include Philip, bar Rome from making war on him, and strip it of
  Corcyra, Apollonia and its other Adriatic holdings (7.9). That is a
  coalition with members whose interests a peace would have to cover,
  and a peace with a surviving Rome. Livy's summary of the same treaty
  gives Carthage "the whole of Italy, including Rome itself" (23.33),
  but it is a paraphrase, and Polybius's documentary version should
  carry more weight. After Cannae Hannibal also sent Carthalo with the
  Roman prisoners' envoys, to propose terms if the senate were
  inclined to peace (Livy 22.58). That tested whether Cannae had made
  Rome willing to negotiate. See the
  [claim on Hannibal's limited war aims](/claims/hannibal-limited-war-aims).

  The defections show the method could work, within limits. Livy's
  list of those who went over after Cannae runs from Capua's
  neighbors Atella and Calatia to the Hirpini, part of Apulia, the
  Samnites except the Pentri, the Bruttii and the Lucanians, and later
  the Greek cities of the coast (22.61, compressing several years).
  Capua, which Polybius calls once the wealthiest of cities (3.91),
  came over in 216. Tarentum was betrayed to Hannibal in 212, but the
  Roman garrison held the citadel, which kept the harbor from being of
  full use to him. These were the political results the prisoner
  policy had been meant to encourage. They were concentrated in the
  south. The Latin colonies did not defect, though the strain showed:
  in 209 twelve of the thirty told the consuls they could furnish
  neither men nor money (Livy 27.9).

  In one case the line from the prisoner policy to a defection can be
  followed, and it was not a straight one. In 214, while Hannibal was at
  Lake Avernus, five young Tarentine nobles came to him, men captured at
  Trasimene and Cannae and sent home with Rome's other allies. Out of
  gratitude, they said, they had won most of Tarentum's young men over
  to him (Livy 24.13). He marched on the city, found it held, and
  withdrew when none of them came out to meet him (24.20). When
  Tarentum did fall in 212, the thirteen conspirators Livy names were a
  different group, and what set them moving was Rome's own conduct:
  hostages from Tarentum and Thurii had escaped from Rome, been caught,
  and been scourged and thrown from the Rock (25.7–8). The policy made
  contacts before it produced a defection, and the defection it finally
  got had a Roman cause as well as a Carthaginian one.

  The length of the campaign is weak evidence on its own. Fifteen
  years in Italy fit persistence, but they also fit the defense of
  allies he could not abandon without losing the coalition, hope of
  reinforcement, and the difficulty of leaving. What argues against
  drift is not the duration but the consistency of the diplomacy from
  218 onward and the effort, after 211, to protect the communities
  that had come over.

  Two things the position does not rest on. The oath Hamilcar made the
  nine-year-old Hannibal swear, "never to be the friend of the Romans"
  (Polybius 3.11), shows lasting Barcid hostility to Rome if it is
  historical; it does not show that an Italian invasion or this
  strategy was planned in the 230s, or that the
  [Barcid Iberian state](/narratives/the-barcid-iberian-state) was
  built for it. Long hostility and a contingent outbreak at Saguntum
  are compatible (see the
  [take on the Second Punic War's causes](/editorialTakes/spw-causation)).
  Nor does the position depend on Hannibal's failure to march on Rome
  after Cannae, which is treated separately under
  [why he did not march on Rome](/editorialTakes/cannae-march-on-rome).
