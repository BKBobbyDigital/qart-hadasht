slug: spw-causation
subject_question: >
  What caused the Second Punic War? The surviving accounts offer a
  grievance (Rome's seizure of Sardinia in 238), a family (the Barcids
  and their Iberian project), and an incident (Saguntum in 219). The
  question is how those relate: which of them made the war, which
  merely dated it, and which was doing work of a different kind
  altogether.
subject_entity:
  type: event
  slug: second-punic-war
  role: subject
position: >
  Rome's seizure of Sardinia in 238 was a real grievance and it was
  also, later, a useful one. Both halves matter, and accounts that take
  only one of them produce a distorted war.

  The grievance was genuine. Rome exploited the Mercenary War to take
  an island it had renounced seven years earlier and extracted a
  further twelve hundred talents for the privilege, at a moment when
  Carthage could not resist. Polybius, who is not disposed to make
  Roman conduct look bad, names this as the greatest single cause of
  the war that followed. A Carthage that had accepted defeat in 241
  was converted by 238 into a Carthage that had learned what Roman
  undertakings were worth.

  But the Barcids were not simply carrying that grievance. They had a
  program of their own, and it ran on two tracks that were never
  separable: the family's fortunes and Carthage's recovery. The
  Iberian project made the Barcids rich and powerful in ways the
  Carthaginian constitution had no instrument to check, and it
  simultaneously rebuilt the resource base the city had lost. Sardinia
  gave that program something valuable: a legitimate public
  grievance under which it could operate, and against which objection
  at home was difficult.

  Saguntum then was not a pretext Hannibal stumbled into. The
  Saguntine provocations were real, but a commander who wanted to
  avoid war does not answer them by besieging a city he knew Rome had
  taken under its protection. He took Saguntum understanding what it
  would do, which is the difference between an incident that starts a
  war and a decision that chooses one.

  So: Sardinia made the war possible and gave it its justification;
  the Barcid project made it practicable and gave it its instrument;
  Hannibal's choice at Saguntum made it happen when it did. The war
  was not inevitable in 238 and it was very close to inevitable by
  220, and what changed in between was built on purpose.
reasoning: >
  ## Why Sardinia carries the weight

  The site treats the seizure in its own right under the claims on
  [Roman bad faith](/claims/sardinian-seizure-roman-bad-faith) and the
  [additional indemnity](/claims/sardinian-seizure-additional-indemnity),
  and the case that it caused the next war is the site's
  [existing claim](/claims/sardinian-seizure-cause-of-spw) on the
  subject. What makes it persuasive is the source. Polybius is a
  historian working within Roman patronage, writing an account whose
  organizing argument is why Rome deserved to win, and he nonetheless
  identifies the Sardinian affair as the principal cause of the
  Hannibalic war. Testimony against interest is the strongest kind
  available in this record, and there is not much of it.

  The mechanism is legible without appeal to national character.
  Treaties work because states expect them to be honored. Rome
  demonstrated in 238 that a Carthaginian treaty right could be
  revoked whenever Rome found it convenient and Carthage was weak. A
  state that has learned this does not become vengeful; it becomes
  unwilling to remain weak.

  ## Why the grievance is not the whole account

  The difficulty with a pure grievance reading is that it makes the
  Barcids into instruments of a national mood, which is not what the
  evidence shows them being. The Iberian project was a family
  enterprise as much as a state one. The site's
  [reading of the Iberian state](/editorialTakes/barcid-iberian-state-as-state)
  argues that state-building and Rome-orientation were one project
  rather than two, and the
  [comparison on Barcid autonomy](/sourceComparisons/barcid-autonomy-in-iberia)
  sets out how far the command operated on its own authority. A family
  that governed a province with its own army, its own mint, and its
  own succession was not merely executing a policy formed at Carthage.

  This is where the grievance does its second kind of work. A public
  wrong is politically useful to whoever can present themselves as its
  answer. The Barcid program could be pursued as national recovery
  rather than as family aggrandizement precisely because Sardinia had
  given Carthage a legitimate complaint, and opponents at home who
  wished to check the family had to argue against a project clothed in
  the city's own injury. That the grievance was real and that it was
  convenient are not competing claims. Grievances are most useful when
  they are real.

  ## Why Saguntum was a decision

  The site's
  [comparison on the casus belli](/sourceComparisons/saguntum-casus-belli)
  concludes that Saguntine intrigues against pro-Carthaginian tribes
  were genuine, and that Hannibal's response was not the manufactured
  pretext Livy makes of it. That stands. What it does not settle is
  why the response took the form of an eight-month siege of a city
  under Roman protection.

  A commander seeking to consolidate Iberia without provoking Rome had
  other options, and the [resource-consolidation
  reading](/claims/saguntum-strategic-resource-consolidation) of the
  campaign does not require this particular target. Hannibal knew what
  Saguntum's status was; the Roman embassies had made it explicit.
  Choosing it anyway is consistent with a commander who judged that
  war was coming and preferred to open it at a moment and in a theater
  of his choosing, with Iberia consolidated behind him. Both readings
  of the siege can hold at once: real provocation answered, and the
  answer selected for its consequences.

  ## The asymmetry with the First Punic War

  The site argues under the
  [FPW causation take](/editorialTakes/fpw-causation) that the first
  war was contingent rather than structurally inevitable, and it is
  worth saying plainly that this take does not reach the same verdict
  about the second. That is not a double standard applied to Rome's
  war and Carthage's; it is what the evidence does in each case.

  For 264 the moment-of-decision evidence shows hesitation: a senate
  that could not agree, a matter pushed to the comitia, a vote carried
  partly on the prospect of plunder. Nothing in the record of the
  220s looks like that. Rome had been probing Iberia since the
  embassy of 226 and had taken a city inside the Carthaginian sphere
  under its protection. Carthage had spent nineteen years building a
  military and fiscal apparatus on the peninsula. Both states were
  preparing, and neither was surprised. A war that two states have
  spent two decades getting ready for is not well described as an
  escalation that got away from them.

  The contingency that remains is in the timing and the shape. Had
  Hasdrubal not been assassinated in 221, had Saguntum's alliance been
  concluded differently, had Rome's Gallic emergency of 225 resolved
  otherwise, the war could have come later, or opened in Africa, or
  been fought by a different commander. That is real contingency, and
  it is a smaller kind than 264's.
confidence: moderate
