competing_positions:
  - position: >
      Hannibal's personal hatred, inherited from his father and sworn
      at the altar, was the cause. The war was the working out of a
      Barcid vendetta.
    why_rejected: >
      The oath tradition is not dismissible and the site keeps it as
      an [open question](/openQuestions/hamilcar-oath-tradition), but
      a vendetta does not explain why the war came in 218 rather than
      228, why it required nineteen years of fiscal and military
      construction first, or why Carthage funded it for seventeen
      years after Hannibal's death would have ended a merely personal
      quarrel. Character explanations are attractive because they are
      simple and because the sources supply them. They do not account
      for the apparatus.
    held_by: >
      The Livian tradition, and most popular reception of the war
      since.
  - position: >
      Carthage was an innocent party. Rome's seizure of Sardinia and
      its subsequent interference in Iberia forced a defensive war on
      a state that wanted only to recover.
    why_rejected: >
      The seizure was indefensible and the site says so. But a
      genuinely defensive Carthage does not spend two decades building
      an offensive capability in Iberia, and does not respond to
      Roman protest by besieging a Roman protectorate. The reading
      also requires the Barcids to have had no interests of their own,
      which the evidence for how they governed Iberia does not
      support.
    held_by: >
      Implicit in some reactive corrections of the pro-Roman
      tradition; not a position much defended in specialist work.
  - position: >
      Rome's expansion made a second war inevitable regardless of what
      Carthage did; the Barcid project and Saguntum were occasions
      rather than causes.
    why_rejected: >
      The structural pressure was real, and this take accepts that the
      war was close to inevitable by 220. What the position cannot
      accommodate is that the thing making it inevitable was largely
      built during the intervening years by identifiable people making
      identifiable decisions. Treating the Barcid project as an
      occasion rather than a cause removes Carthaginian agency from
      the account of a war Carthage prepared for and began.
    held_by: >
      A structural-determinist reading; the mirror of the position the
      site rejects for the First Punic War.
  - position: >
      Saguntum was the cause. Hannibal's attack on a Roman ally left
      Rome no alternative.
    why_rejected: >
      This is the Roman public case and it was weak at the time, which
      is why the legal exchange preserved in Polybius 3.21 and Livy
      21.18-19 turns on treaty ratification rather than on the merits.
      Saguntum lay well south of the Ebro, inside the zone the 226
      agreement left to Carthage. The position also cannot explain the
      Roman conduct that preceded it, particularly the decision to
      take a city in the Carthaginian sphere under Roman protection.
    held_by: >
      The Roman diplomatic position of 218; reproduced in much of the
      Latin tradition.
