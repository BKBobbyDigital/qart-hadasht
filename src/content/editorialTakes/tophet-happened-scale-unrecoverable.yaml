competing_positions:
  - position: >
      Systematic sacrifice. Most or all of the Tophet's human deposits
      are children killed as offerings, and the ancient accounts
      describe the practice accurately, including its scale.
    why_rejected: >
      Nothing in the evidence supports reading every urn as a killing.
      The bones cannot establish cause of death, Diodorus's figures
      describe one crisis, and the inscriptions, which cover only part
      of the deposit, show an offering rite without showing that each
      offered child was killed. That the rite existed does not mean it
      accounts for most of the deposits.
    held_by: >
      Stager and Wolff (1984) and older treatments that took the
      literary accounts as a guide to scale.
  - position: >
      Predominantly funerary. The Tophet mainly received prenatal
      infants and babies who died of natural causes; its separate
      location and cremation rite reflect their particular social or
      religious status. Sacrifice may have happened occasionally, but
      the skeletal evidence does not show it as the usual cause of
      death, and hostile literary testimony should not govern how the
      archaeological deposit is read.
    why_rejected: >
      This is a serious scholarly position, and the site shares its
      central caution: the bones do not show that sacrifice was common.
      It parts from it on what the rite was. The stelae record vows
      fulfilled with an offering term that distinguishes a lamb from a
      person, which is the language of sacrifice rather than burial,
      and the literary tradition, for all its hostility, points the same
      way. The site therefore treats the rite as a genuine offering that
      very probably included the killing of children, while leaving the
      proportion open, which is the same place this position leaves it.
    held_by: >
      Schwartz, Houghton, Macchiarelli and Bondioli (2010, 2012, 2017);
      in an earlier form, Moscati and Ribichini in Italian Phoenician
      and Punic studies.
  - position: >
      Mixed practice in known proportions. The Tophet held both
      sacrificial and funerary deposits in proportions that can be
      reconstructed from the bioarchaeological and inscriptional
      evidence.
    why_rejected: >
      The site's own position is a form of mixed practice, since it
      allows that some children were killed and others died naturally.
      What it rejects is the claim that the ratio can be recovered. No
      method yet separates killed from naturally dead children in
      cremated remains, and the inscriptions do not accompany enough
      deposits to measure it.
    held_by: >
      Syntheses that attempt to state sacrificial and funerary
      fractions.
