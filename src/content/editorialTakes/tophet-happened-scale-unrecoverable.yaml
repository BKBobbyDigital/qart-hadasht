slug: tophet-happened-scale-unrecoverable
subject_question: >
  Did the Carthaginians ritually sacrifice children at the Tophet, and
  if so, at what scale?
subject_entity:
  type: institution
  slug: tophet
  role: subject
position: >
  Ritual killing of children as religious offerings very probably
  happened at the Carthaginian Tophet. How often it happened cannot be
  recovered from the surviving evidence.

  The case is cumulative, and it does not rest on the bones. The Tophet
  was a sanctuary, and its stelae record vows fulfilled to Baal Hammon
  and Tanit using a specialized offering term, *mlk*, with variants
  that appear to distinguish an offering of a lamb from an offering of
  a person. Greek and Roman writers describe Carthaginian child
  sacrifice across several centuries. Neither body of evidence is
  decisive alone: the meaning of the inscriptions is debated, and the
  writers are hostile, often late, and not independent of one another.
  Together they make the view that no child was ever killed as an
  offering harder to hold than the view that the rite was real.

  The cremated remains do not settle the question either way. Two teams
  working on urns from the same excavations reached different age
  profiles, and even an agreed age at death would not show how a child
  died. Some children may have been killed as offerings; others may
  have died naturally and then received the same rite. The proportion,
  and how it changed over the precinct's six centuries, is not
  recoverable.

  The strongest competing position is not the old claim that the
  ancient accounts were simply invented. It is the reading of Jeffrey
  Schwartz and his colleagues: that the precinct mostly received
  children who died naturally, with sacrifice at most occasional. The
  site agrees with them that the bones cannot show sacrifice was common.
  It parts from them in treating the rite as an offering rather than a
  form of burial, because that is what its own inscriptions call it.
reasoning: >
  The inscriptions and the sanctuary carry the case. The Carthage Tophet
  was a precinct set apart from the city's cemeteries and used from the
  eighth century BCE to the destruction in 146. Its stelae typically
  name a dedicator who fulfills a vow to Baal Hammon, and later to Tanit
  and Baal Hammon, because the god heard his voice. The offering is
  called *mlk*. The word appears with *ʾmr*, usually read "lamb," and
  with *bʿl* or *ʾdm*, which never occur together and seem to be
  interchangeable, usually read "citizen" and "person." Since Otto
  Eissfeldt's work in 1935, *mlk* has been understood as a term for a
  kind of offering rather than the name of a god, though its exact sense
  (from "gift" or "presentation" to "sacrifice") is still argued over,
  and so is the reading of each variant. What is not in doubt is that
  this is the vocabulary of offering and vow, not of commemorating the
  dead. A cemetery for children who died naturally has no obvious reason
  to describe its deposits in terms that separate an offering of a lamb
  from an offering of a person.

  That argument has limits, and they matter for the question of scale.
  A votive inscription does not by itself show that the child in the urn
  was killed: a child who died naturally could have been cremated and
  given as an offering. Many urns had no inscribed stele, and the
  inscribed stelae belong mostly to the later centuries of the
  precinct, so the epigraphy speaks for part of its history, not all of
  it.

  The literary tradition adds weight without being independent
  confirmation. Cleitarchus describes children placed in the arms of a
  bronze statue; Diodorus says that in the crisis of 310 BCE the
  Carthaginians sacrificed two hundred children of leading families,
  and that at least three hundred more who had fallen under suspicion
  sacrificed themselves voluntarily (20.14); Quintus
  Curtius says the Tyrians under Alexander's siege proposed reviving the
  sacrifice of a freeborn boy, a rite he says Carthage kept until its
  destruction (4.3.23); Plutarch describes the practice in *On
  Superstition* (13); and Tertullian says children were sacrificed to
  Saturn in Africa into Roman times (*Apology* 9). These writers are
  hostile, several wrote long after the events, and later ones may
  depend on earlier ones or share a stereotype, so they cannot be
  counted as five witnesses. Their persistence makes wholesale invention
  harder to assume. The biblical passages on a *tophet* in the valley of
  Hinnom (2 Kings 23:10; Jeremiah 7:31), from which the modern name of
  the precinct comes, are evidence for a wider Levantine background, not
  testimony about Carthage. Tertullian speaks to continuity in Roman
  Africa, not to what any Punic urn contains.

  The bioarchaeology is a dispute, not a verdict. Schwartz, Houghton,
  Macchiarelli and Bondioli (2010) examined remains from 348 urns and
  found many individuals who died before or within weeks of birth, a
  profile they read as natural perinatal mortality. Smith, Avishai,
  Greene and Stager (2011) argued that cremation shrinks infant bone and
  biases such estimates downward; weighting dental evidence, they found
  the ages peaking at about one to one and a half months, with few
  prenatal individuals, which they read as selection rather than natural
  death. Each team answered the other (Schwartz and colleagues in 2012
  and 2017, Smith and colleagues in 2013), and the disagreement over
  aging cremated infants remains open. The more basic point is that age
  at death is not manner of death. A six-week-old could have died of
  disease; a newborn could have been killed. The bones can narrow how
  old the children were. They cannot show which of them were offered
  alive.

  Scale is therefore beyond reach. The size of the precinct, thousands
  of urns over six centuries, measures how many deposits there were, not
  what they were; Stager and Wolff's inference from precinct size to the
  scale of sacrifice (1984) was rightly criticized. Diodorus's figures
  describe a single crisis and cannot be turned into a normal rate. The
  animal bones in some urns can be read as substitutes for a child, as
  offerings made alongside one, or as offerings for a child who had
  died, and the bones do not decide between these. Cremation destroys
  evidence, excavation has been partial, and the rite very likely
  changed over time. The tophets at Motya, Sulci and Tharros differ from
  Carthage in the proportions of animal and human remains and in their
  stelae, which shows that practice was not identical across the Punic
  world; it does not show that sacrifice was absent or rare.
