competing_positions:
  - position: >
      Universal-systematic reading. The Tophet was a sacrificial
      precinct across its full six centuries of use; the classical
      sources describe the practice descriptively if hostilely; the
      scale was substantial across the entire timespan.
    why_rejected: >
      Under-weights the perinatal-mortality demographic baseline,
      which means at least some Tophet deposits were natural-death
      cremations; assumes Diodorus's specific numbers and the
      hostile-source framing are descriptively accurate at scale;
      cannot explain the inter-site variation across Punic Tophets.
      The position was the mid-20th-century Anglophone consensus
      (Stager-Wolff 1984) but has been substantially modified in
      most current treatments toward acknowledging at least some
      natural-mortality component.
    held_by: Older Anglophone scholarship; Stager and Wolff 1984;
      partially preserved in some Israeli and American treatments.
  - position: >
      Pure-cemetery reading. The Tophet was a burial precinct for
      children who died of natural causes; the *molk* formula is a
      generic votive vocabulary covering ordinary infant burial;
      the classical sources are entirely polemical fabrication
      built on Greek-Roman misreading of an unfamiliar Phoenician
      mortuary practice.
    why_rejected: >
      The 2010s dental-development evidence for the 1–3 year
      cohort cannot be explained by perinatal natural mortality
      and is not addressed by the cemetery hypothesis in any
      surviving reply. The *molk* formula's restriction to Tophet
      contexts (and absence from other Punic infant burials)
      argues against reading it as generic funerary vocabulary.
      The cross-source consistency of independent hostile
      traditions across five centuries is hard to dismiss
      entirely as topos.
    held_by: Moscati, Ribichini, Xella; Italian-French Phoenician-
      Punic studies through the 1990s–2010s; some continental
      European scholarship still.
  - position: >
      Mixed-practice reading with stated proportions. The Tophet
      contained both sacrificial and funerary deposits in
      identifiable proportions that varied across the precinct's
      use; the proportions can be reconstructed from
      bioarchaeological and inscriptional patterns.
    why_rejected: >
      Compatible with this site's position on the "it happened"
      question and on "probably not uniform," but pushes further
      than the evidence supports on the specific-proportions
      question. The surviving evidence is consistent with mixed
      practice; it is not consistent with a confident
      reconstruction of *what* mix. We would treat this as a
      direction the evidence points without committing to the
      specific reconstructions sometimes proposed.
    held_by: Some current syntheses that try to specify
      sacrificial-vs-funerary fractions, e.g. some treatments
      following Quinn 2018's framing.
