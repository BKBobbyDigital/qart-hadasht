slug: agathocles-masterstroke-or-gamble
subject_question: >
  Was Agathocles's invasion of Africa a strategic masterstroke
  or a desperate gamble?
subject_entity:
  type: event
  slug: agathocles-invasion-of-africa
  role: subject
position: >
  A desperate gamble, not a masterstroke. Agathocles crossed to Africa
  because he was shut up in Syracuse and losing, and nothing in the
  sources suggests a plan he had nursed; Justin says he told the
  Syracusans only that he had found the road to victory. For three years
  it went better than he had reason to expect, and mostly because of
  Carthage's own weaknesses rather than his skill: a home army split
  between two feuding generals, one of whom wanted to be tyrant and held
  back in the first battle; Libyan subjects ready to change sides; and a
  general in Sicily who threw his army away in a night attack. What
  Agathocles added was boldness and treachery, the latter most of all in
  the murder of Ophellas, whose army he took over. He could not take
  Carthage,
  could not get supplies or men across a sea Carthage controlled, and
  could not pay his army. When his
  Libyan allies turned, he had no way home for his soldiers, and the
  campaign ended with his army surrendering, his sons killed by his own
  men, and a peace in which Carthage recovered everything it had held in
  Sicily.

  Two parts of the older reading on this site do not survive a check of
  the texts. Hamilcar son of Gisco was not recalled from Sicily; he sent
  5,000 men home, stayed, and was killed attacking Syracuse in 309. The
  invasion did draw the war away from Syracuse, as Diodorus says, but not
  by bringing Carthage's general home. And the
  campaign's reputation for moral shock rests on a tradition Diodorus
  himself partly rejects: he says he cannot accept Timaeus's books on
  Agathocles. The murder of Ophellas and the flight of 307 are in every
  version; the coloring around them is contested.
reasoning: >
  The invasion was forced. Diodorus has Agathocles defeated at the
  Himeras, abandoned by the Greek cities and besieged (19.107–110), and
  Justin makes the choice explicit: unable to match the Carthaginians
  in Sicily or to withstand a siege, he decided to carry the war to Africa
  (22.4). Diodorus gives his reckoning: that Carthaginians softened by
  long peace would lose to veterans, that Carthage's Libyan subjects
  would seize the chance to revolt, that an unravaged country would feed
  and pay his army, and that the war would be drawn away from Syracuse
  and Sicily, which last, Diodorus says, "was accomplished" (20.3). The
  diversion worked; it did not require, and did not produce, a recall. He sailed with sixty ships and about 13,500 men, took the
  chance of a gap in the blockade, and burned the ships on landing
  (Diodorus 20.5–7).

  It then worked, for a time, because Carthage was unready at home. Its
  field army was in Sicily; the citizen levy was put under two generals
  chosen for their mutual hatred; and one of them, Bomilcar, wanted to be
  tyrant and held back in the first battle, in which Hanno died fighting
  (20.10–12). The Libyan countryside, taxed and unfortified, went over
  readily, and so did a Libyan king (20.17–18). Miles credits Agathocles
  with a shrewd understanding of Carthage's army and politics
  (*Carthage Must Be Destroyed*, pp. 146–149), and his own reckoning in
  Diodorus did count on Libyan revolt. But the weaknesses were
  Carthage's, and most of the early gains came from them. He won one
  pitched battle against a divided command, not a campaign of
  generalship.

  It failed for structural reasons. Carthage held the sea, so Agathocles
  could neither bring reinforcements nor, at the end, ship his army home.
  Carthage could raise new armies and pay them; Agathocles' army mutinied
  over pay more than once (20.33–34; Justin 22.8). And the African allies
  he depended on stayed only while he was winning, deserting as soon as
  Carthage sent out three armies in 307 (20.59–61, 68). The peace of 306
  confirmed the result: Carthage recovered all its Sicilian cities and
  paid Agathocles to go (20.79). The campaign showed that Carthage could
  be attacked at home, and in Livy's telling Scipio cited it in 205 when
  he argued for invading Africa (28.43); it also showed why an invader
  without command of the sea would struggle to finish the job.

  The moral charge is real in part. The surprise attack that killed
  Ophellas, an ally who had marched two months to join him, is in both
  Diodorus and Justin (Diodorus 20.42; Justin 22.7). The flight of 307 is
  more complicated than "abandoning his sons": he tried to leave with his
  younger son, was chained by his own soldiers when the elder betrayed the
  plan, and escaped in a night panic, after which the army killed both
  (20.68–69). The site treats the facts as secure and the character
  sketch as Diodorus's, drawn from a divided and partly hostile tradition
  ([claim](/claims/agathocles-diodorus-bias)).
