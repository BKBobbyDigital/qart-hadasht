competing_positions:
  - position: >
      The invasion was a strategic masterstroke whose
      collapse came from contingent factors (troop revolt,
      supply problems) rather than any strategic flaw.
    why_rejected: >
      Under-weights the moral and personnel pattern that
      runs through the whole campaign: the Ophellas episode,
      the Bomilcar coup attempt that Agathocles partly
      courted, the eventual abandonment of the army. The
      strategic vision was real but the agent's character
      contributed to the collapse, not just contingently.
    held_by: >
      Some military-history readings that emphasize
      operational art over moral assessment.
  - position: >
      The invasion was a doomed gamble whose temporary
      successes were owed to Carthaginian unpreparedness
      rather than to Greek planning.
    why_rejected: >
      Under-weights both the strategic logic (which the
      Sicilian recall validated) and the operational
      achievement (which has no obvious peer in the period).
      The "lucky early success" reading depends on dismissing
      too much of what Agathocles actually accomplished in
      310–308 BCE.
    held_by: >
      Older condemnatory readings drawing more directly on
      the Diodoran-Timaean moral framing.
