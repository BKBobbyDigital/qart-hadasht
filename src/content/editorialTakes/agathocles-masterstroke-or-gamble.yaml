competing_positions:
  - position: >
      A strategic masterstroke that worked as designed: it drew Carthage's
      Sicilian commander home, turned the Sicilian war, and failed only
      through contingent accidents such as the mutinies.
    why_rejected: >
      Hamilcar was not recalled, and the Sicilian victory of 309 came from
      his failed attack on Syracuse. The failure was not accidental: an
      invader who could not control the sea, pay his army or hold his
      African allies was always exposed to exactly what happened in 307.
      The site formerly held a version of this reading.
    held_by: >
      No specific holder; the reading of the campaign as a design that
      succeeded until bad luck intervened.
  - position: >
      A doomed act of desperation whose early successes owed nothing at
      all to Agathocles.
    why_rejected: >
      Rejected only in its absolute form. The site agrees that the early
      successes came mainly from Carthaginian unpreparedness and division.
      But Agathocles did expect the Libyans to defect and planned for it
      (Diodorus 20.3), and he did win a pitched battle while outnumbered;
      boldness counted for something, even if it was not mastery.
    held_by: >
      No specific holder; the hostile tradition's picture of Agathocles as
      reckless and lucky.
