competing_positions:
  - position: >
      The expectation of negotiation was reasonable and Rome's refusal
      was unforeseeable, so it reflects no failure of judgment on
      Hannibal's part.
    why_rejected: >
      The Hellenistic norm was real, and the site keeps it as the reason
      the expectation made sense. But a Roman precedent pointing the
      other way was available, in the refusal to treat with Pyrrhus, and
      a commander staking a war on the enemy's willingness to negotiate
      had reason to weigh it. The site holds a softer version of this
      reading in the limits it sets on the charge.
    held_by: >
      Readings that judge Hannibal against Hellenistic practice rather
      than against Roman precedent.
  - position: >
      Cannae did not end the war because Hannibal failed to march on
      Rome immediately afterward. Had he done so, the city would have
      fallen and the war would have ended.
    why_rejected: >
      Treated under the editorial take
      [cannae-march-on-rome](/editorialTakes/cannae-march-on-rome).
      Rome's walls, the troops raised in and around it after the
      battle, the distance, and Hannibal's lack of a siege train made
      an assault very unlikely to succeed, and when he did reach the
      walls in 211 he withdrew. The reading here does not depend on the
      counterfactual either way.
    held_by: >
      A long-standing position drawing on the reproach Livy (22.51) puts
      in Maharbal's mouth: "you know how to win a victory but not how to
      use one."
  - position: >
      The war's outcome was determined less by Roman political refusal
      than by attritional capacity. Roman manpower, fiscal capacity and
      shipbuilding produced a resource advantage that eventually defeated
      Hannibal regardless of any specific political choice.
    why_rejected: >
      Roman manpower and fiscal capacity were larger than Carthaginian,
      but the reading under-weights political choice. A senate that had
      negotiated after Cannae would have ended the war regardless of
      underlying resources. The capacity advantage only mattered because
      the choice to keep fighting was made and sustained.
    held_by: >
      Some economic-historical treatments of the war that emphasize
      structural rather than contingent factors.
