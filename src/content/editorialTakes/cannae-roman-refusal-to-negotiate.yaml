slug: cannae-roman-refusal-to-negotiate
subject_question: >
  Why did the Battle of Cannae not end the Second Punic War?
subject_entity:
  type: event
  slug: battle-of-cannae
  role: subject
position: >
  Rome's refusal to negotiate after Cannae is the single fact Hannibal's
  strategy could not overcome, and Hannibal misjudged it. By Hellenistic
  standards a state that lost a field army of roughly 50,000 in an
  afternoon came to terms, and Hannibal acted on that expectation at
  once, sending captives to Rome to arrange a ransom with an envoy ready
  to offer peace. The senate would not receive the envoy, would not pay
  the ransom, and kept mobilizing. The expectation was reasonable by the
  standards of the Greek world Hannibal was educated in, but Rome's own
  record pointed the other way: some sixty years earlier the senate had
  refused to treat with Pyrrhus while his victorious army stood in Italy.
  Richard Miles calls the expectation Hannibal's first serious
  miscalculation, and the site agrees. The tactical brilliance and the
  strategy of detaching Rome's allies were both real; what failed was a
  reading of the enemy. This is a synthesis position, not an ancient
  framing: Polybius records the refusal and admires it but does not
  present it as a Carthaginian error.
reasoning: >
  Within days of Cannae Hannibal did what a Hellenistic victor did. He
  released the allied captives, held the Romans, and sent ten of them to
  Rome under oath to arrange the ransom of the roughly 8,000 prisoners
  taken in the Roman camp, with the Carthaginian noble
  [Carthalo](/people/carthalo) instructed to offer terms if the senate
  was inclined to peace (Livy 22.58; Polybius 6.58). Ransom was the
  normal first step toward a settlement. The dictator's lictor ordered
  Carthalo out of Roman territory, the senate refused the ransom, and
  it sent back under guard the one envoy who tried to evade his oath
  (Livy 22.58–61). Polybius, telling the story to illustrate Roman
  character, says Hannibal was less elated by his victory than dismayed
  by the Romans' resolve.

  The refusal held because Rome could afford it. The defections after
  Cannae were real, Capua and much of the south, and later Syracuse, but
  the Latin colonies and the Roman citizen body did not move. Polybius's
  manpower figures (2.24) suggest Rome could replace the Cannae losses
  from its own citizens, and the post-Cannae levy of youths and the
  purchase of 8,000 slaves to fight (Livy 22.57) show a willingness to
  go beyond normal limits. The senate kept the policy across years of
  further disasters and changing consuls, which made it a settled
  position rather than a moment of defiance.

  Why call it a misjudgment rather than bad luck? Hannibal's model of how
  wars ended came from the Greek world, where kings who lost a great
  battle made terms, and on that evidence his expectation was
  reasonable. But Rome was not a Hellenistic kingdom, and its own recent
  history said so. After Pyrrhus defeated the Romans at Heraclea in 280,
  his envoy Cineas found the senate leaning toward peace until the old
  and blind Appius Claudius Caecus was carried into the house and turned
  it; the answer sent back was that Rome would not negotiate while
  Pyrrhus remained in Italy (Plutarch *Pyrrhus* 18–19). Stories like
  that one were part of how the senators Hannibal faced understood
  themselves. [Miles](/sources/miles-carthage-2010) adds two reasons
  Hannibal missed it: an education in Hellenistic statecraft under Greek
  tutors, and twenty years of war in Iberia that made him a superb
  general against Iberians and Celts but gave Carthaginian commanders
  almost no experience of Rome.

  The charge has limits. The Caecus story reaches us through Roman
  writers who knew how the Hannibalic war ended, and no one before
  Hannibal had inflicted a defeat on Rome at the scale of Cannae, so
  Rome's behavior after one was not strictly predictable. Nor is it clear
  what else Hannibal could have done: he could not take Rome, and he
  could not make it negotiate. The misjudgment lies in the expectation
  that shaped the campaign, not in any single decision after the battle.
