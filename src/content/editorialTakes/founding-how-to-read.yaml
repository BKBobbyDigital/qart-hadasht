competing_positions:
  - position: >
      The 814 BCE date is approximately accurate and Dido is a
      historical figure preserved through the foundation tradition.
    why_rejected: >
      No contemporary Phoenician source attests Dido. The 814
      date is calculatedly precise in the Greek-historiographic
      style and is not independently confirmed. Treating both as
      historical pushes the evidence further than the surviving
      record supports.
    held_by: A traditional reading sometimes encountered in older
      scholarship and in some popular treatments.
  - position: >
      The whole tradition is later Greek-Latin literary
      construction with no historical core.
    why_rejected: >
      The Tyrian colonial relationship is firmly attested and
      cannot be dismissed as fiction. Carthaginian state
      delegations to Tyre across centuries indicate that Carthage
      itself treated the Tyrian connection as historical and
      foundational. Dismissing the entire tradition as fiction
      requires explaining away substantial independent
      attestation.
    held_by: A skeptical position in some post-1960s
      historiographic writing; rarely defended in the strong
      form.
