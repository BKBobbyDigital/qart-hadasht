slug: sid
name_display: Sid
name_punic: Sid (or Sid Babi at Antas)
name_punic_script: 𐤑𐤃
name_greek: not consistently identified through interpretatio
name_latin: identified by Roman-period Sardinian inscriptions as Sardus Pater
epithet: at Antas, "Sid Babi" — possibly indicating a specific Sardinian-Carthaginian local variant
etymology: >
  The name's etymology is contested. The most-cited
  reading derives it from a Phoenician root associated
  with hunting or fishing; others argue for a pre-
  Carthaginian Sardinian linguistic origin that the
  Phoenician colonists adapted into their pantheon.
interpretatio:
  roman: Sardus Pater (the Roman-period syncretization at Sardinian sanctuaries)
domain: Sardinian patron deity; possibly hunting and fishing functions; civic-territorial protector
attestation: well-attested in the Sardinian Carthaginian context, particularly through the Antas sanctuary inscriptions
consort: not consistently paired; the Antas record names Sid alongside Tanit and Baal Hammon in some dedications but does not establish a fixed consort
cult_period: 6th c. BCE – 146 BCE in the Sardinian Punic context, with Roman-period continuation as Sardus Pater into the 3rd c. CE
sanctuaries:
  - Antas sanctuary in southwestern Sardinia — the principal cult site, with extensive Carthaginian Phoenician-language dedications continued in Latin under the Sardus Pater identification
  - Secondary attestations at Sulci, Tharros, and other Punic-period Sardinian sites
iconography: >
  Standing male figure with attributes that vary across the surviving Sardinian record: a bow and arrows in some depictions (consistent with the proposed hunting domain), a staff or sceptre in others. The Antas cult statue survives only in fragments; the Roman-period Sardus Pater iconography preserves a standing male in Hellenistic-style drapery with a feathered headdress, which may or may not continue the Punic-period visual convention.
summary: >
  The principal Carthaginian deity of the Sardinian
  cultic context — distinctive among Carthaginian gods
  in being substantively connected to Sardinia in
  particular rather than to the metropolitan Carthaginian
  pantheon as it appears in Carthage itself. Sid's most
  important cultic site is the **sanctuary at Antas**
  (in southwestern Sardinia, modern Province of South
  Sardinia), where the deity was worshipped under the
  designation "Sid Babi" through the Carthaginian period
  and into the Roman period after the 238 BCE Roman
  seizure of the island.

  The Antas sanctuary's epigraphic record — Carthaginian
  Phoenician-language dedications followed by Latin
  inscriptions identifying the same deity as Sardus
  Pater — is the principal surviving evidence for the
  Carthaginian-Sardinian religious accommodation. The
  Roman-period continuation of the cult, with the
  explicit Sardus Pater identification, is one of the
  cleaner surviving examples of Carthaginian-Latin
  religious continuity at a non-metropolitan site.

  Sid's status in the Carthaginian metropolitan pantheon
  is minor — he is rare to absent in dedications from
  Carthage itself — but his Sardinian prominence makes
  him one of the most archaeologically visible Punic
  deities outside of the four-deity metropolitan core.
  The Sardinian Carthaginian religious configuration,
  with Sid as the principal local-civic deity, is the
  clearest surviving instance of how the Carthaginian
  pantheon adapted to specific colonial contexts rather
  than imposing a uniform metropolitan religious
  structure across the Punic-cultural zone.
