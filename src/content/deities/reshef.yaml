slug: reshef
name_display: Reshef
name_punic: Rshp
name_punic_script: 𐤓𐤔𐤐
name_greek: Ἀπόλλων (Apollo, in some Greek attestations)
name_latin: Apollo (in Roman-period North African attestations)
epithet: variable; "Reshef of the arrow," "Reshef of the gateway" attested in Levantine Phoenician inscriptions
etymology: >
  West Semitic *ršp*, with cognates across the Levantine
  pantheon (Ugaritic Reshef, Phoenician Reshef, Hebrew
  *resheph* "flame, plague, lightning bolt"). The deity's
  domain encompassed plague and the lightning-bolt
  weapon, with a long-standing martial-warrior character
  visible across the Bronze Age and Iron Age Near Eastern
  record.
interpretatio:
  greek: Apollo (in his plague-bringing aspect)
  roman: Apollo (occasionally Mars in martial contexts)
domain: Plague, lightning, war, gateway-protection; chthonic-martial deity with prophylactic functions
attestation: well-attested in Levantine Phoenician inscriptions; less prominent at Carthage but attested in dedications
consort: not paired at Carthage; in some Ugaritic and Levantine traditions paired with the goddess Adat
cult_period: 8th c. BCE – c. 4th c. BCE at Carthage; longer in Levantine Phoenicia
sanctuaries:
  - No identified principal sanctuary at Carthage; the cult is attested through votive inscriptions and theophoric personal names
  - Reshef shrines attested at city gates in several Phoenician homeland cities, consistent with his gateway-protection function
iconography: >
  Standing warrior male in the "smiting god" pose — arm raised and brandishing a weapon (mace, axe, or arrow), often with a horned headdress and a shield. The iconography is inherited essentially intact from Bronze Age Levantine convention. Reshef figural depictions are rare in surviving Carthaginian material relative to the inscriptional and onomastic evidence; the deity is named more often than shown.
summary: >
  A martial-chthonic deity inherited by Carthage from the
  Phoenician homeland tradition, where Reshef had been
  attested across the Levantine pantheon since the Bronze
  Age. At Carthage, Reshef is less prominent than Baal
  Hammon or Tanit but attested in votive inscriptions and
  in personal-name theophoric elements (the Punic name
  *ʿbdršp*, "servant of Reshef," appears in inscriptional
  records).

  The deity's domain combined what modern frameworks
  would treat as separate functions: plague (the diseases
  understood as Reshef's arrows), lightning (the weather-
  weapon characteristic of the Levantine *Baʿal* type),
  warfare (the martial aspect), and gateway-protection
  (a prophylactic function attested at homeland city
  gates). The combination is characteristic of the
  Levantine Phoenician deity-type and was preserved
  largely intact in the Carthaginian inheritance.

  The Greek identification with Apollo reflects Apollo's
  own plague-bringing aspect (the *Iliad*'s opening
  episode, the Apollo Smintheus cult); the identification
  is less complete than the Heracles-Melqart or
  Asklepios-Eshmun assimilations but consistent across
  the surviving Greek references to Punic Reshef cult.

  The deity's lower visibility at Carthage relative to
  the Levantine homeland — where Reshef had been a major
  cult figure — is one of the small but visible features
  of the Carthaginian pantheon's divergence from the
  Tyrian pattern, alongside the rise of Tanit and the
  decline of Astarte's primary attestation.
