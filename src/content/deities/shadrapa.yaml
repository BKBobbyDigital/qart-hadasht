slug: shadrapa
name_display: Shadrapa
name_punic: Shadrapa / Šdrpʾ
name_punic_script: 𐤔𐤃𐤓𐤐𐤀
name_greek: Διόνυσος (Dionysus, in some Greek attestations); also Asklepios
name_latin: identified variously by Roman-period North African inscriptions
epithet: 'lord of healing; protector'
etymology: >
  The name's etymology is contested. The most-cited
  reading derives it from a Phoenician compound
  meaning "Shed" (a pre-Phoenician deity name) plus
  *rapaʾ* ("healer"); other readings argue for a
  unified non-compound origin. The deity is attested in
  Levantine Phoenician inscriptions from the 8th
  century BCE forward and follows the broader Phoenician-
  Punic colonial diffusion to Carthage and the western
  Mediterranean.
interpretatio:
  greek: Dionysus (in the Greek interpretatio of the western Phoenician colonies); occasionally Asklepios
  roman: Liber Pater (in some Roman-period North African attestations)
domain: Healing; protection; viticulture and wine; possibly Dionysiac-ecstatic associations in some local cults
attestation: attested in Phoenician homeland and Punic colonial inscriptions; secondary in importance to Eshmun in healing functions at Carthage
summary: >
  A Phoenician healing-and-protection deity whose cult
  was established in the Carthaginian religious landscape
  alongside the more prominent Eshmun. Shadrapa is
  attested in the Phoenician homeland from at least the
  8th century BCE — the Amrit stele (a 6th-century
  Phoenician monumental sculpture in southern Syria)
  shows Shadrapa standing on a lion, holding a
  weapon — and the deity's cult diffused with the
  broader Phoenician colonial network across the
  Mediterranean.

  At Carthage and across the Punic-cultural zone,
  Shadrapa appears in dedicatory inscriptions
  particularly in personal-name theophoric elements
  (Punic names containing the *šdrpʾ* element are
  attested in the inscriptional record). The deity's
  domain — healing combined with protective and
  apotropaic functions — overlapped with Eshmun's
  healing-deity profile, with Shadrapa appearing as
  the more popular (private/personal) and Eshmun as
  the more civic-institutional of the two healing
  deities.

  The Greek interpretatio with Dionysus is one of the
  more interesting features of the Carthaginian record:
  it reflects Dionysus's own protective-prophylactic
  aspect and his association with viticulture (a domain
  Shadrapa came to share in some western Mediterranean
  attestations) rather than the better-known ecstatic-
  mystery side of the Greek god. The choice of Greek
  identification is itself evidence for which aspects of
  Shadrapa the Greek observers found most salient in
  the Punic religious landscape.

  Shadrapa's archaeological footprint at Carthage is
  smaller than Eshmun's but clearly present: dedications,
  amulets, and small-scale figurines have been recovered
  from Punic-period contexts, with continued attestation
  in the Roman-period North African religious record.
