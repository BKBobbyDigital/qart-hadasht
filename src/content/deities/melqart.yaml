name_greek: Ἡρακλῆς (Heracles)
name_latin: Hercules
epithet: King of the city (literal etymological reading)
etymology: >
  *Mlk* "king" + *qrt* "city" — "king of the city," referring
  specifically to Tyre, his cult center and the Phoenician
  homeland city to which Carthaginian religious tradition
  remained linked across the Punic period. The etymology is
  uncontested.
interpretatio:
  greek: Heracles
  roman: Hercules
domain: Tyrian city-god; patron of seafaring and colonization; royal-heroic deity; identified across the Mediterranean with Heracles/Hercules
attestation: well-attested inscriptionally; richly attested in Greek literary sources via the Heracles identification; iconographically distinctive
summary: >
  The patron deity of Tyre — Carthage's mother city — and the
  Phoenician-Punic god most extensively identified with a
  Greek counterpart through the Greek literary tradition.
  Melqart's identification with Heracles was so thorough,
  beginning at least by the 5th century BCE, that the two
  largely fused in Greek discussion of Phoenician religion;
  Herodotus (2.44) explicitly conflates them and reports a
  Tyrian Heracles cult of substantial antiquity. The
  *interpretatio* is the most consequential single
  Greek-Phoenician religious assimilation in the surviving
  record.

  At Carthage, Melqart's role was distinctively continuous
  rather than displaced. Where many Phoenician gods adapted
  or transformed in Carthaginian use (the rise of Tanit, the
  marginalization of Astarte), Melqart remained the link to
  Tyre across the entire Punic period. The annual delegation
  of envoys from Carthage to Tyre — to make offerings at the
  Melqart sanctuary there and to conduct ritual transactions
  on Carthage's behalf — is attested across centuries and
  is one of the most striking surviving instances of
  metropolitan-colonial religious continuity in the ancient
  Mediterranean. Aristotle (cited by ps.-Aristotle, *On
  Marvellous Things Heard*) attests the practice; Diodorus
  preserves additional detail.

  The most-discussed individual reference to Melqart in the
  Carthaginian record is Hannibal's pre-war oath, sworn
  before his father Hamilcar Barca on the eve of the
  Iberian campaign of 237 BCE. Polybius (3.11) preserves
  the episode: Hamilcar leads his nine-year-old son to the
  altar and has him swear "never to be a friend of Rome."
  Polybius does not specify which god's altar, but ancient
  and modern tradition consistently identify it as
  Melqart's — the deity most associated with the
  Tyrian-Carthaginian heroic tradition and the natural
  patron for an oath of campaign and dynastic continuity.

  Melqart's iconography in the Carthaginian record is
  comparatively scarce. He is not the principal recipient
  of Tophet stelae and his cult appears to have been
  centered at temples (which have not survived
  archaeologically in good condition) rather than at the
  Tophet precinct. His image survives on a few coins,
  amulets, and in Greek-period material that may reflect
  Heracles-as-Melqart or pure Heracles. The clearest
  iconographic continuity is from later Roman-period
  Hercules cults at sites with Punic substrate populations.
