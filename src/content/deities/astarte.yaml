slug: astarte
name_display: Astarte
name_punic: ʿAshtart / ʿštrt
name_punic_script: 𐤏𐤔𐤕𐤓𐤕
name_greek: Ἀστάρτη (Astarte) / Ἀφροδίτη (Aphrodite)
name_latin: Venus (in some Roman-period attestations)
epithet: variable — "great mother," "mistress" (in Phoenician homeland inscriptions)
etymology: >
  Astarte is the West Semitic cognate of Mesopotamian Ishtar,
  with an extended attestation across the entire Levantine
  and broader Near Eastern religious sphere going back to
  the second millennium BCE. The name's deep linguistic
  background and its presence across multiple cultures make
  it one of the most widely attested divine names in the
  surviving Bronze Age and Iron Age Near Eastern record.
interpretatio:
  greek: Aphrodite (most common); occasionally Astarte transliterated directly
  roman: Venus (in some Roman-period attestations)
domain: Female sovereign deity in the Phoenician homeland; fertility, sexuality, war, sovereignty; partially displaced at Carthage by the rise of Tanit
attestation: well-attested in earlier Carthaginian inscriptions; declining in attestation from approximately the 5th century BCE
summary: >
  The principal female deity of the Phoenician homeland — the
  paramount goddess at Tyre, Sidon, and Byblos through the
  Iron Age — and the original female deity of the
  Carthaginian pantheon before her partial displacement by
  the rise of Tanit in the 5th century BCE. Astarte's
  presence in the early Carthaginian record is attested in
  votive inscriptions and (more visibly) in the personal
  names of Carthaginian individuals: theophoric names
  containing the *ʿštrt* element are common in pre-5th-
  century Punic prosopography and decline thereafter,
  paralleling the inscriptional decline of explicit
  Astarte dedications.

  The relationship between Astarte and Tanit is one of the
  central interpretive questions of Punic religion. Three
  readings divide modern scholarship:

  1. **Tanit as differentiation from Astarte** — the
     Carthaginian goddess developed from Astarte through a
     local theological process, with the new name marking
     the differentiation. The two are continuous; Tanit
     is the local form that emerged.

  2. **Tanit as separate deity displacing Astarte** —
     Tanit was a distinct goddess (possibly imported from
     elsewhere in the Phoenician colonial network, possibly
     emerging from a different theological tradition) whose
     rise in the 5th century BCE displaced Astarte from
     primary attestation in Carthaginian dedications.

  3. **Continuing dual presence** — both goddesses
     remained active in Carthaginian religion across the
     Punic period, with Tanit dominating public-civic
     attestation and Astarte retaining importance in
     private and personal religious practice. The
     theophoric-name evidence partly supports this reading.

  Astarte continues to appear in Carthaginian inscriptions
  through the 4th and 3rd centuries BCE, though much less
  frequently than in the earlier period. The Greek
  identification of Tanit with Astarte (which appears in
  some Sicilian Greek attestations) preserves an awareness
  of the connection — though whether the identification
  was theologically meaningful at Carthage or was purely a
  Greek reading of a less differentiated foreign pantheon
  is itself contested.
