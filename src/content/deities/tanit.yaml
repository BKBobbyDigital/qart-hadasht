slug: tanit
name_display: Tanit
name_punic: Tinnit / Tnt
name_punic_script: 𐤕𐤍𐤕
name_greek: Ἀστάρτη (Astarte) / Ἥρα (Hera) / Οὐρανία (Ourania, in some Sicilian Greek attestations)
name_latin: Iuno Caelestis (later Roman-period Tanit)
epithet: Pene Baʿal, "Face of Baal" (the standard inscriptional formula)
etymology: >
  The Punic vocalization *Tinnit* is reconstructed from Latin
  transliterations and from comparative Phoenician evidence; her
  name has no settled etymology. Older readings connecting her
  to Phoenician verbal roots meaning "to weep" or "to suckle"
  are no longer accepted. The current scholarly consensus
  treats the name as opaque: a divine name whose
  pre-Carthaginian linguistic background does not cleanly
  reduce to known Semitic roots.
interpretatio:
  greek: Astarte / Hera / Ourania
  roman: Iuno Caelestis
domain: Great mother goddess; fertility and protection; consort of Baal Hammon; civic patroness of Carthage
attestation: extremely well-attested epigraphically and iconographically from the 5th century BCE forward; rare in earlier inscriptions
consort: Baal Hammon (in the standard "Tanit Pene Baal" inscriptional formula from the 5th c. BCE forward)
cult_period: 5th c. BCE – 146 BCE, with Roman-period continuation as Iuno Caelestis through the 4th c. CE
sanctuaries:
  - Tophet at Carthage (where the "Tanit Pene Baal" formula appears on thousands of stelae)
  - Tophet at Motya in Punic Sicily
  - Tophet at Tharros and other Sardinian Punic sites
  - Dedications attested across Punic Iberia, North Africa, and the Aegean diaspora
  - Sanctuary of Iuno Caelestis at Roman Carthage (the post-146 continuation of the cult)
iconography: >
  The Sign of Tanit (a stylized human figure formed from a triangular body, a horizontal arms-bar, and a disc head) is the single most recognized Carthaginian religious symbol, appearing on stelae, mosaics, coins, amulets, and pottery across the entire Punic-cultural sphere. The crescent moon is a frequent companion attribute; the dove, lion, and pomegranate appear as secondary motifs in stele iconography. Figural depictions are rarer than abstract ones; the cult preferred symbolic over anthropomorphic representation.
summary: >
  The principal female deity of Carthage from the 5th century
  BCE through the city's destruction, and after Tanit's rise
  to prominence the most widely invoked goddess in the entire
  Punic-cultural zone. Her formal title in Carthaginian
  inscriptions is *Tnt Pn Bʿl*, "Tanit Face of Baal", a
  formula that appears on thousands of Tophet stelae and on
  dedications across Punic Sicily, Sardinia, Iberia, and
  Africa.

  Tanit's iconographic sign (the so-called "sign of Tanit" or
  signum Tanit, a stylized human figure formed from a triangle
  topped by a horizontal bar topped by a disc) is the most
  widely recognized Carthaginian religious symbol and the one
  that anchors most modern visual identification of Punic
  material. The sign appears on stelae, mosaics, coins,
  amulets, and pottery; its specific meaning is interpreted
  variously (a stylized goddess, a representation of the
  sky-earth relationship, an apotropaic device) without
  consensus.

  The most striking single feature of Tanit in the surviving
  record is her late emergence. She is rare to absent in the
  earliest Punic inscriptions, pre-5th-century Carthaginian
  votive material names Astarte where it names a female deity
  at all, and becomes ubiquitous from approximately the 5th
  century BCE onward. The transition is one of the few
  features of Punic religion clearly visible in the
  inscriptional record over time. Whether she emerged from
  Astarte through a process of differentiation, was
  imported from elsewhere in the Phoenician world, or
  represents a genuinely Carthaginian theological development
  is genuinely contested.

  Greco-Roman observers identified Tanit with multiple Greek
  goddesses depending on the aspect emphasized. The
  identification with Hera reflects her sovereign-female-
  consort role; with Ourania (the Heavenly One) her
  cosmic-celestial associations; with Astarte the survival
  of the older identification before Tanit's emergence;
  with Juno Caelestis the post-146 Romanization of her cult
  in North Africa. The cult of Iuno Caelestis at Roman-period
  Carthage was sufficiently vital that it was Christianized
  rather than suppressed in the 4th century CE: the last
  major North African pagan cult to receive Christian
  attention in the surviving record.
