slug: baal-hammon
name_display: Baal Hammon
name_punic: Baʿal Ḥamon
name_punic_script: 𐤁𐤏𐤋𐤇𐤌𐤍
name_greek: Κρόνος (Kronos, in interpretatio Graeca)
name_latin: Saturnus (in interpretatio Romana)
epithet: Lord of the brazier / Lord of Amanus / Hot one (epithet element contested)
etymology: >
  *Baʿal* is the standard West Semitic title "lord," used across the
  Phoenician-Punic pantheon for senior male deities. The second
  element *Ḥamon* is contested in modern scholarship: it has been
  read as referring to a brazier or thurible (the cult object), as
  toponymic (a Mt. Amanus connection imported from the Levantine
  homeland), or as a divine epithet meaning "the hot one." No
  reading is settled; the Phoenician homeland evidence is
  ambiguous.
interpretatio:
  greek: Kronos
  roman: Saturn
domain: Supreme male deity of Carthage; sky and weather; sovereign authority; recipient of the *molk* offering
attestation: well-attested epigraphically and iconographically; thousands of Tophet stelae name him
summary: >
  The chief male deity of Carthage from at least the 7th century
  BCE through the city's destruction in 146 BCE — and the Punic
  god most extensively attested in the surviving archaeological
  record. Baal Hammon's name and image appear on more Tophet
  stelae than any other deity (the precinct is conventionally
  termed his sanctuary), and dedications to him are found across
  the Punic-cultural zone from Carthage to Sicily, Sardinia, and
  Iberia.

  Greco-Roman observers identified Baal Hammon with Kronos and
  Saturn — the displaced senior father-god whose mythology
  emphasized world-rule and child-association. The
  identification has had substantial consequences for how the
  Tophet evidence is read: the Greek tradition of Kronos
  receiving child sacrifice provided the analytical framework
  through which Greco-Roman writers (Diodorus, Plutarch,
  Tertullian) interpreted Carthaginian *molk* practice. Whether
  the identification was accurate or pre-shaped the
  interpretation is part of the broader Tophet question.

  Baal Hammon's iconography on Punic stelae is conventional and
  recurring: a seated figure on a throne, often beneath a solar
  disc and crescent moon, sometimes with a sceptre, sometimes
  with worshippers in attendance. Surviving terracotta and
  bronze figurines show variations on the standard form;
  several monumental stone representations from the Punic-
  successor sites in modern Tunisia preserve the iconography
  into the Roman period.

  His cultic relationship to Tanit shifts visibly across the
  surviving inscriptional record. In the earliest Punic
  attestations Baal Hammon appears alone or paired with
  Astarte; from approximately the 5th century BCE onward,
  joint dedications to "Tanit Pene Baal" and Baal Hammon
  become the standard formula. Whether this reflects Tanit's
  rise to formal co-equal status, Tanit's emergence as Baal
  Hammon's consort distinct from Astarte, or a more complex
  syncretism is genuinely contested.
