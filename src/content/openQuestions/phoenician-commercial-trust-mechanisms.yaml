what_would_resolve_this: >
  Systematic metrological study of the excavated Punic weight corpus
  would help most, and is the kind of work that has transformed the
  picture for Iron Age Levantine weights: enough measured examples from
  secure contexts, analyzed together, would show whether the values
  cluster or scatter. The western sites are the ones to look at, since
  the question is about the Carthaginian network rather than the
  homeland, and Punic Iberia and Sardinia are both under-published in
  this respect.

  A commercial document would settle a great deal on its own, but the
  prospect is remote. The one realistic route is a waterlogged or sealed
  deposit preserving perishable material, of the kind that has
  occasionally produced writing elsewhere in the Mediterranean. Failing
  that, the question will continue to be argued from weights, from
  coinage, and from comparison, which is to say it will remain open.
