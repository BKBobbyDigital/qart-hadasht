what_would_resolve_this: >
  Further ancient-DNA work would refine the
  picture: larger sample sizes (the 2025 study's ~210
  individuals will likely double or triple within several
  years as more sites are sampled), expanded geographic
  coverage (Punic Spain in particular is under-sampled),
  and improved ancestry-component attribution methods that
  better distinguish the relevant western-Mediterranean
  sources at the relevant time depths. None of this is
  realistically going to overturn the broad finding (a
  predominantly Mediterranean demographic profile with
  minimal Levantine component is too well-supported by the
  current data to plausibly reverse), but the magnitude of
  the residual Levantine component, the period-by-period
  trajectory of the demographic mix, and the comparative
  patterns across the colonial network are all questions
  that further work will substantially refine. The
  foundation question itself is unlikely to be addressed
  directly by aDNA — the founding population is too small
  and too long ago to be sampled at adequate resolution —
  and will continue to rest on the literary and
  archaeological record.
