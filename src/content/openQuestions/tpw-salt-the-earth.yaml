    slug: third-punic-war
    role: subject
what_would_resolve_this: >
  Already resolved in scholarship. The popular myth persists in
  cultural circulation but is not seriously defended in
  historical work. The site flags it explicitly as one of the
  most common modern misconceptions about the destruction of
  Carthage.
