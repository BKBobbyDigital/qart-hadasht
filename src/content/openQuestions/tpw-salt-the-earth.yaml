slug: tpw-salt-the-earth
question: >
  Did the Romans "salt the earth" of Carthage to prevent regrowth?
why_unknown: >
  This is one of the most popular claims about the destruction of
  Carthage and one of the most clearly unsupported. The "salting of
  the earth" appears in no ancient source. Salting a conquered city
  has a biblical precedent (Abimelech sows Shechem with salt, Judges
  9:45), which may be where the idea attached itself to Carthage, but
  when and how it did so is a question for the history of scholarship
  that the site has not checked. The historical question is settled;
  the interesting one is why the claim has lasted.
evidence_summary: >
  No surviving ancient source mentions the salting of the earth.
  Polybius does not mention it. Appian, who gives the most detailed
  surviving narrative of the destruction, does not mention it.
  Plutarch, Cicero, Livy's summaries, Diodorus and Orosius do not
  mention it. What the ancient sources do record is a decree that
  whatever remained be obliterated and that no one live on the site,
  with curses on rebuilding the Byrsa or Megara (Appian *Punica* 135),
  and, in a third-century legal writer, a plow drawn over the city
  (Modestinus, *Digest* 7.4.21). Neither involves salt.
candidate_answers:
  - answer: It did not happen
    arguments_for: >
      No ancient source attests it. The Romans had no agricultural
      reason to render territory permanently uncultivable (they
      reorganized the territory as the province of Africa and
      developed it as one of the principal grain-producing
      regions of the empire). The military reason (preventing
      reoccupation) was achieved by the systematic demolition of
      buildings, the ban on settlement and the curses (Appian 135),
      and, if Modestinus is right, a ritual plowing; none of it
      needed salt.
    arguments_against: >
      None compelling. The negative case is essentially complete.
    held_by: >
      No modern account the site knows of defends the salting as
      historical.
  - answer: Some symbolic salt was scattered as part of the ritual
    arguments_for: >
      The destruction did carry ritual elements: curses on
      rebuilding, and a plow drawn over the site in Modestinus. A
      token scattering of salt could in principle have been part of
      such a rite. No source attests it for Carthage or for any
      Roman destruction.
    arguments_against: >
      Speculative. Even if some such ritual occurred, it would
      have been symbolic-religious, not the practical
      agricultural-poisoning the popular myth describes.
    held_by: A speculative position rarely defended; not the
      same as the popular myth.
relevant_entities:
