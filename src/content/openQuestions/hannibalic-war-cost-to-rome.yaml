what_would_resolve_this: >
  Better archaeological field survey data from southern Italy, with
  tighter dating, is the most likely source of movement. Settlement
  density in Bruttium, Lucania and Apulia across the second century is
  exactly the evidence the dispute needs, and the surveys that exist have
  been read in both directions largely because the ceramic dating is not
  fine enough to separate wartime abandonment from gradual later change.
  Improved demographic modeling and further work on what the Republic's
  census was actually counting would sharpen the numerical side. None of
  this is likely to produce a clean answer, since the underlying question
  asks about causation across two generations, and that is the kind of
  question ancient evidence rarely settles outright.
