what_would_resolve_this: >
  Discovery of late-antique or early-medieval Punic-language
  textual material in any form (monumental, manuscript,
  papyrological), or systematic excavation of late-antique rural
  North African contexts that would document the spoken-language
  and cultural-practice continuity Augustine attests for the
  early 5th century. The current evidence base is structurally
  thin for the post-5th-century question; recovery of even
  fragmentary additional evidence would substantially shift the
  picture in either direction.
