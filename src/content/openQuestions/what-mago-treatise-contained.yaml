what_would_resolve_this: >
  Discovery of any portion of the original Punic text, or of
  Decimus Silanus's full Latin translation, or of Cassius
  Dionysius's full Greek abridgment, in any manuscript or
  papyrus context. The Mago original has not survived in any
  known textual transmission; the question's resolution depends
  on chance archival or papyrological recovery rather than on
  reanalysis of available evidence.
