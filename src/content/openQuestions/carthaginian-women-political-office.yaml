what_would_resolve_this: >
  Discovery of Carthaginian-period inscriptional documentation
  of female civic-office holders — votive inscriptions naming
  women in civic-official capacity, administrative-document
  fragments documenting female participation in civic
  institutions, post-146 BCE Punic-cultural North African
  inscriptional evidence of continued female civic-political
  practice — would substantively address the question.
  Alternatively, discovery of substantial Carthaginian-period
  prosopographic record of civic-office holders showing
  consistent male-only patterns across multiple generations would
  strengthen the "no female office" reading. Neither type of
  evidence is realistically likely to surface given the
  destruction of the Carthaginian libraries and the limited
  Carthaginian-period inscriptional preservation, but
  comparative evidence from the Punic diaspora and the
  Numidian-Punic post-146 record could inform the question
  partially.
