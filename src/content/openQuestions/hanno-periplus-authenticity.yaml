what_would_resolve_this: >
  Discovery of an independent pre-Byzantine textual witness to
  the Periplus — a quotation in a 1st-3rd century CE author, a
  papyrus fragment, an inscriptional reference — would
  resolve much of the transmission-history
  question. Discovery of an actual votive inscription at the
  Carthage Temple of Baal Hammon site documenting the voyage
  (highly unlikely given Roman destruction) would resolve the
  authenticity question definitively. Comparative archaeological
  evidence from the Atlantic Moroccan and West African coasts
  documenting Carthaginian-period commercial-exploration activity
  would substantially strengthen the genuine-document reading
  even without textual-witness discovery.
