what_would_resolve_this: >
  Discovery of substantial Carthaginian-period domestic-literacy
  documentation — household account-keeping inscriptions,
  ostraca with personal-name lists, graffiti from non-elite
  contexts, perishable-material documentation preserved through
  exceptional preservation conditions — would substantively
  shift the picture. The most-likely source of such evidence
  would be exceptional preservation at a Carthaginian-period
  site (the Kerkouane domestic-quarter excavations are
  particularly promising; Kerkouane's First-Punic-War destruction
  and subsequent non-overbuilding provide preservation conditions
  analogous to Herculaneum/Pompeii but for Punic material
  culture). Comparative evidence from Numidian and Roman-period
  North African contexts also informs the question through the
  continuity arguments treated under the
  [continuity in Roman Africa narrative](/narratives/punic-continuity-in-roman-africa).
