what_would_resolve_this: >
  The question is substantively settled-by-inference rather than
  open-to-evidence; the surviving Greco-Roman record is unlikely
  to receive significant additional Carthaginian-side documentation.
  What would substantively shift the modern reading would be
  discovery of: pre-war Carthaginian senate deliberation records
  documenting the Italian campaign's planning; Hannibalic
  correspondence with the senate during the campaign; or
  substantive post-war Carthaginian-tradition reconstructions of
  the war that would have circulated in literate Carthaginian
  contexts before 146 BCE and survived through some preservation
  channel the standard tradition has not. None of these are
  realistically available; the question is likely to remain a
  modern-inferential debate rather than an evidence-resolvable one.
