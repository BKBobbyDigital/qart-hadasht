what_would_resolve_this: >
  The question is more a question of inference than of
  evidence: the Greco-Roman record is unlikely to gain
  significant new Carthaginian-side material. A genuine
  shift in the modern reading would require something like
  pre-war Carthaginian senate records of the Italian
  campaign's planning, Hannibal's correspondence with the
  senate during the war, or a substantial post-war
  Carthaginian historical tradition surviving through some
  channel outside the standard one. None of these are
  realistically available. The question is likely to remain
  a modern interpretive debate.
