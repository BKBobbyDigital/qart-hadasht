slug: alps-which-pass
question: >
  Which Alpine pass did Hannibal use to cross into Italy in 218 BCE?
why_unknown: >
  Polybius and Livy describe the crossing in detail but neither
  names the pass. The geographic features they describe (the
  rivers approached, the peoples encountered, the duration of
  ascent and descent, the broken path in the descent) can be read
  against modern Alpine geography
  in several plausible ways. Five principal candidates have been
  proposed in modern scholarship, with no consensus.
evidence_summary: >
  **One criterion widely used to choose between the passes may not be
  evidence at all.** Polybius has Hannibal halt the army at the summit
  and raise its spirits by the sight of Italy, showing the men the plain
  of the Po, reminding them of the friendly Gauls below, and pointing
  out the situation of Rome itself; the Alps, he adds, stand to the
  whole of Italy as a citadel stands to a city (3.54.1-4). A summit with
  that view has been treated as a test a candidate pass must pass.
  [Eve MacDonald](/sources/macdonald-hannibal-2015) reports the
  objection that no Alpine pass offers it: from no summit on any
  proposed route can one stand and look out over the Po valley and
  Italy. If that is right, either a source invented the scene or
  imagined what the moment ought to have looked like.

  The suggestion she carries further, credited to a conversation with
  Michael Crawford rather than to anything in print, is that the view
  described is a real one seen from the wrong place: from the northern
  edge of the Apennines, looking north across the Po to the Alps, the
  whole plain and the mountain wall appear much as Polybius describes
  them, like a citadel. That is a view a Roman would have, which would
  point to Fabius Pictor as Polybius's source for the scene (p. 96 and
  her note 62). The site reports this as an argument and does not adopt
  it: it is unpublished, the site has not seen Crawford's reasoning, and
  Mahaney is cited on the other side for the Col de la Traversette
  offering the view after all. What follows for this question either
  way is a caution. A criterion that may be a literary set-piece should
  not be doing heavy work in choosing a pass, and it is doing that work
  in the Clapier case below.

  One late witness is worth adding to the geography, for what it is
  worth. Appian says the road Hannibal opened through the rock was
  still in use in his own day and was still called Hannibal's pass
  (*Hannibalica* 4). That is a claim about local memory in the
  second century CE rather than about the third century BCE, and
  Appian does not say which pass he means, so it cannot narrow the
  candidates. It does suggest a single route carried the name by
  then, which is a reason the identification felt settled in
  antiquity and is not now.

  Polybius (3.50-56) gives the fullest geographic account; Livy
  (21.32-37) supplements with elements that sometimes seem
  inconsistent with Polybius. Modern reconstructions draw on
  historical geography, comparative chronology of Alpine route
  use, and (in recent decades) archaeological work that has
  identified Hannibalic-period horse manure deposits at one of
  the candidate passes.
candidate_answers:
  - answer: Col du Clapier
    arguments_for: >
      The geographic features Polybius describes (a single
      large valley approach, a relatively low pass, a clear view
      of the Po Valley from the summit) match Col du Clapier
      reasonably well, though the summit view is the weakest of
      the three, for the reason given above. The route is consistent with Polybius's
      description of the peoples encountered (the Allobroges, the
      Insubres on the descent).
    arguments_against: >
      Some details of Polybius's geography are difficult to map
      onto Col du Clapier specifically; the pass's elevation
      may be lower than Polybius's account requires.
    held_by: A traditional view; defended in earlier 20th-century
      reconstructions.
  - answer: Col de la Traversette
    arguments_for: >
      Recent (2010s) archaeological work has identified
      Hannibalic-period horse manure deposits at this pass,
      providing physical evidence of the kind no other candidate
      pass has produced. Strongest currently available evidence.
    arguments_against: >
      The pass is high (~3,000 m) and steep; the Polybian
      account's emphasis on the army's exhaustion and the
      logistical difficulties is consistent with this elevation
      but the specific geographic details are mixed.
    held_by: An increasingly favored modern view since the
      archaeological work; not universally accepted.
  - answer: Other candidate passes (Col de Montgenèvre, Col du
      Mont-Cenis, Col de Larche)
    arguments_for: >
      Each candidate pass has specific Polybian-Livian textual
      details that fit. The Mont-Cenis route was the principal
      Alpine crossing in subsequent Roman use, suggesting it was
      operationally feasible.
    arguments_against: >
      None has decisive evidence; the proposals depend on
      reading specific textual elements as prioritized over
      others.
    held_by: A range of minority modern positions.
relevant_entities:
  - type: event
    slug: crossing-of-the-alps
    role: subject
what_would_resolve_this: >
  Further Alpine archaeological work, particularly at the
  candidate passes that have not yet been systematically tested.
  The 2016 Traversette horse-manure-deposit study established
  that ancient archaeology can in principle settle this question;
  comparable work at other passes would settle it definitively.
