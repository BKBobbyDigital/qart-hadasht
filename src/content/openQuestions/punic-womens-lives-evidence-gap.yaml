what_would_resolve_this: >
  Three discoveries would substantially shift the picture.
  First, recovery of Carthaginian legal documents governing
  family and property structures (the Phoenician homeland
  has produced fragmentary parallel material; a Carthaginian
  equivalent would be transformative). Second, large-scale
  systematic excavation of ordinary Punic domestic contexts
  (with attention to household economic and household
  religious evidence beyond what Kerkouane and adjacent
  sites have produced). Third, recovery of any extended
  Punic-language textual material treating family, household,
  or women's lives — substantially less likely given the
  loss of the broader Punic literary tradition, but not
  impossible. The current evidence base supports the
  partial reconstruction the site's women-and-family theme
  offers; the gap is unlikely to be substantially filled
  without one of these discoveries.
