what_would_resolve_this: >
  Discovery of an independent attestation of a fourth pre-264 treaty
  — a Greek source citing a different tradition, an inscription
  preserving treaty text, or an archival reference in a now-fragmentary
  source — would settle it. Such attestation is unlikely to surface
  given the survival pattern of the relevant historiography.
