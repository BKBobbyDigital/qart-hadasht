slug: cannae-strategic-objective
question: >
  What was Hannibal's actual strategic objective in Italy — and was Cannae
  meant to achieve it?
why_unknown: >
  Hannibal left no surviving statement of his war aims; the sources that
  attempt to reconstruct them (especially Polybius and Livy) write decades
  or centuries later, with access to events but not always to motivation.
  The result is that modern scholarship can describe what Hannibal did
  but must infer what he was trying to do — and the inference is
  genuinely contested, because the same actions are consistent with
  several distinct strategic theories.
evidence_summary: >
  What we have to work with: Hannibal's pre-war actions in Iberia, his
  diplomatic outreach to Italian communities throughout the campaign,
  his alliance with Philip V of Macedon, his brother Hasdrubal Barca's
  attempted relief expedition (defeated at the Metaurus), and his
  reported peace overtures at various points. What we lack: any direct
  statement of war aims, any preserved Carthaginian state strategic
  document, or any independent Punic-language source on the campaign.
candidate_answers:
  - answer: Detach Rome's Italian allies and force a negotiated peace
    arguments_for: >
      Best fits Hannibal's actual conduct: the systematic diplomatic
      outreach to Italian communities, the post-Cannae defections of
      Capua and most of the south, the alliance with Philip V, the
      offer of moderate peace terms after Cannae. The strategy is
      coherent, has historical precedents (Pyrrhus had attempted
      something similar), and explains why Hannibal did not march on
      Rome itself.
    arguments_against: >
      Required Roman cooperation in negotiating, which Rome systematically
      refused to provide. The strategy contained no answer to Roman
      refusal-to-negotiate, which suggests either Hannibal expected
      eventual Roman concession (not given) or had a contingency he
      never reached.
    held_by: The dominant view in modern scholarship — Hoyos, MacDonald,
      Goldsworthy, Lazenby.
  - answer: Destroy Roman military capacity and dictate terms by force
    arguments_for: >
      Cannae itself is consistent with this — a battle of annihilation
      rather than positioning. The earlier engagements at Trebia and
      Trasimene were also intended as decisive battles. Hannibal
      consistently sought engagement on his terms.
    arguments_against: >
      Underspecifies what "destroying Roman military capacity" would
      have looked like operationally given the manpower depth Rome
      drew on after Cannae. The strategy is consistent with the
      battles but does not explain Hannibal's diplomatic activity or
      his refusal to march on Rome.
    held_by: A minority view; defended in some military analyses.
  - answer: Restore the strategic situation prior to the First Punic War
    arguments_for: >
      Carthage had lost Sicily, Sardinia, and Corsica in the first war
      and the inter-war Roman annexations. A negotiated peace returning
      these territories — and confirming Carthaginian dominance in
      Iberia — would have been a substantive Carthaginian victory short
      of destroying Rome.
    arguments_against: >
      Plausible as a desired endpoint but not directly attested. The
      reading is consistent with the previous strategic theory and may
      be its more concrete articulation rather than a separate option.
    held_by: A reading consistent with several modern accounts; rarely
      stated in this exact form.
