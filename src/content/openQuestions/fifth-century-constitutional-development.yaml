what_would_resolve_this: >
  Discovery of Carthaginian internal-political documentation
  from the fifth century — substantial Punic-language texts
  treating constitutional development, biographical material on
  fifth-century political figures, or surviving fragments of
  the Carthaginian historiographical tradition that Polybius
  references in passing but does not transmit — would address
  the question directly. Realistically extremely unlikely given
  the [146 BCE destruction](/events/destruction-of-carthage)
  and the broader loss of the Punic literary tradition.
  Alternatively, archaeological recovery of inscriptional
  material expanding the fifth-century epigraphic
  record could shift the picture incrementally; the
  [Punic inscriptional record](/themes/punic-inscriptional-record)
  has continued to grow across the past century and further
  finds remain possible. The mechanism question is unlikely to
  be definitively settled either way, and the site's working
  position is that the gradual-evolution reading is the more
  defensible default while acknowledging the genuine
  uncertainty around the specific developmental pattern.
