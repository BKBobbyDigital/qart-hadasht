what_would_resolve_this: >
  New excavation evidence reaching pre-late-8th-century strata at
  the site, particularly in areas not yet systematically excavated.
  Independent epigraphic attestation of either the foundation
  event or the early Phoenician presence. Additional radiocarbon
  series from the earliest levels, ideally on short-lived samples,
  that would either confirm or undercut the Bir Massouda dates.
  Resolution of the wider Iron Age Mediterranean absolute-
  chronology debate, which would settle whether the ceramic and
  radiocarbon frameworks can be reconciled.
