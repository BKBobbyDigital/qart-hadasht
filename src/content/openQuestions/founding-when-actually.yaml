what_would_resolve_this: >
  New excavation evidence reaching pre-late-8th-century strata at
  the site, particularly in areas not yet systematically excavated.
  Independent epigraphic attestation of either the foundation
  event or the early Phoenician presence. Refinement of the
  Phoenician colonial chronology across the western Mediterranean
  that would bracket the Carthage foundation more precisely.
