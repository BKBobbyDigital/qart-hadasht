slug: agathocles-how-close-to-carthage
question: >
  How close did Agathocles actually come to taking Carthage?
why_unknown: >
  The principal source, Diodorus,
  records an Agathoclean army repeatedly defeating
  Carthaginian forces in the field and operating in the
  immediate hinterland of the city, but does not give a
  clear assessment of whether he could have taken the city
  itself by storm or sustained siege. The questions that
  matter — Greek siege capacity in this period, the state
  of Carthage's walls in the late fourth century BCE,
  whether the Carthaginian fleet could have continued
  resupplying the city by sea — are imperfectly answered
  by the surviving evidence and have produced a wide
  range of modern reconstructions.
evidence_summary: >
  Diodorus reports the victory over Hanno and Bomilcar in
  310, the capture of towns across the hinterland and along
  the coast, a camp near Tunis, and in 307 the storming of
  Utica and Hippou Acra (20.8–18, 54–55). Agathocles never
  laid siege to Carthage itself. There is no clear ancient
  assessment of whether Carthage itself was a realistic
  objective. Modern scholarship has to infer from the
  operational context, from comparative evidence (the much
  later Roman siege of 149–146 BCE gives some baseline for
  what taking the city required), and from the limits of
  late fourth-century Greek siegecraft.
candidate_answers:
  - answer: >
      Agathocles came close to taking Carthage; the
      campaign's collapse in 307 was contingent rather than
      structural.
    arguments_for: >
      The Bomilcar coup attempt, a sign of senatorial panic,
      indicates the Carthaginian government was under
      genuine threat. Carthage's walls had not been
      seriously tested at this point, and the city's
      experienced field force was tied up in Sicily for
      much of the campaign. With the Ophellas reinforcement
      absorbed, the Greek force had the numerical capacity
      for a serious siege attempt.
    arguments_against: >
      The Greek army never seriously invested Carthage.
      Carthaginian sea power remained operational and could
      have resupplied the city indefinitely. Agathocles's
      force, even reinforced, was probably too small to
      maintain a sustained siege without reliable supply.
    held_by: >
      No specific holder; a reading that weights the coup
      attempt and the defeats in the field.
  - answer: >
      Carthage was never a realistic objective. Agathocles's
      goal was to draw the war away from Sicily, live off
      Carthaginian territory and force a negotiated peace,
      not to take the city itself.
    arguments_for: >
      Greek armies of this period rarely took fortified
      cities of Carthage's scale by storm or sustained
      siege. Agathocles's stated strategic logic, as
      preserved in Diodorus, was about plunder, Libyan revolt
      and drawing the war away from Sicily, which Diodorus
      says was accomplished (20.3); taking Carthage is not
      among his stated aims.
    arguments_against: >
      Under-weights the operational reach Agathocles
      achieved. If taking the city was implausible, why did
      Carthaginian internal politics dissolve into a coup
      attempt? The answer the ancient sources implicitly
      give is that the city was in real danger.
    held_by: >
      No specific holder; the reading closest to Diodorus's
      own account of Agathocles' aims.
  - answer: >
      The question is unanswerable in principle.
    arguments_for: >
      The relevant facts (the state of Carthage's walls in
      308 BCE, Greek siegecraft capacity, the actual
      proximity of Agathocles's forces, the political will
      inside Carthage) are inadequately preserved.
      Counterfactual military reasoning depends on data we
      do not have and cannot recover.
    arguments_against: >
      Counsel of despair. Historians do regularly
      reconstruct operational situations from imperfect
      evidence and produce defensible if uncertain
      conclusions.
    held_by: >
      No specific holder; stated as the skeptical limit.
