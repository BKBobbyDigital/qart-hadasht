what_would_resolve_this: >
  New archaeological evidence on the state of Carthage's
  land walls in the late fourth century BCE; survival of
  an additional Greek or Carthaginian source describing the
  operational situation in 308 BCE in greater detail; a
  fragmentary attestation of Agathocles's own strategic
  articulation beyond the brief paraphrases preserved in
  Diodorus.
