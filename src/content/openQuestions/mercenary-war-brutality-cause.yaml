slug: mercenary-war-brutality-cause
question: >
  Was the Mercenary War's exceptional brutality the product
  of its particular leaders (Spendius's escaped-slave
  status, Mathos's Libyan cause), or did the brutality
  emerge from the conditions of conflict between Carthage
  and its African subjects?
why_unknown: >
  Polybius's account (1.65–88) is almost the only detailed source, and
  Diodorus's fragments (25.2–6) follow the same sequence. Both describe
  the conditions and the leaders' decisions, and both attach heavy moral
  language to the rebels. What the sources cannot settle is how far the
  decisions were free choices and how far the conditions left the
  leaders little room, a question of weighting rather than of fact.
evidence_summary: >
  The conditions are attested: Carthage could not pay the army it had
  brought back from Sicily and asked the soldiers to accept less
  (Polybius 1.66–67), and it had taxed the Libyans so heavily in the war
  that they rose at a word (1.72). So is the sequence of the atrocities.
  Hamilcar at first released captured rebels (1.78); the rebel leaders,
  afraid his leniency would dissolve their army, killed Gisco and some
  seven hundred prisoners and vowed to kill every Carthaginian captive
  (1.79–81); Hamilcar then threw his prisoners to the elephants (1.82),
  which Diodorus says the rebels' cruelty "forced" him to do (25.3).
  Polybius adds his own analysis of escalation, blaming bad upbringing
  and "habitual violence and unscrupulousness on the part of those in
  authority" (1.81). The ancient accounts are compared in the
  [source comparison](/sourceComparisons/mercenary-war-atrocities).
candidate_answers:
  - answer: The brutality came from the conditions.
    arguments_for: >
      A long-unpaid army of many nations, a subject population with deep
      grievances, and a state fighting for its existence made a war
      without restraint likely whoever led it. The revolt spread at once
      and needed no leader to create the grievances behind it.
    arguments_against: >
      Within the same conditions Gisco negotiated and Hamilcar released
      prisoners with some success. The massacre that closed off
      settlement was a decision taken because that policy was working,
      and Hamilcar's reprisals followed it.
    held_by: >
      A structural reading found in modern treatments that stress
      Carthage's fiscal and imperial failures.
  - answer: The brutality came from the leadership.
    arguments_for: >
      Polybius assigns the decisive escalations to specific choices:
      Spendius and Mathos wrecking the negotiations for personal reasons,
      the rebel leaders ordering the massacre to stop defections, Hamilcar
      adopting extermination in reply.
    arguments_against: >
      The leaders could only take their men where the men were willing to
      go, and the conditions explain why a mutiny over pay became a war
      for Carthage's survival. Polybius's moral language about the rebel
      leaders should not be taken as the explanation.
    held_by: >
      The reading suggested by Polybius's and Diodorus's moral language,
      though not by Polybius's analysis at 1.81.
  - answer: Both, in sequence.
    arguments_for: >
      The conditions produced the revolt and made it existential;
      decisions by the rebel leaders and then by Hamilcar made it
      truceless; after that the violence became self-reinforcing. The
      reading fits the attested sequence, including Hamilcar's early
      leniency, and matches Polybius's own account of escalation.
    arguments_against: >
      It depends on Polybius's reports of the leaders' motives, which he
      could only infer, and Diodorus's agreement may not be independent
      of him.
    held_by: >
      The site's reading, set out in the
      [editorial take](/editorialTakes/mercenary-war-atrocity-structural).
