what_would_resolve_this: >
  Difficult. The question requires comparative evidence about
  ancient civil wars and indigenous revolts that the surviving
  sources do not always preserve. Modern comparative work on
  ancient asymmetric warfare and on the Carthaginian-Libyan
  relationship is relevant but rarely conclusive.
