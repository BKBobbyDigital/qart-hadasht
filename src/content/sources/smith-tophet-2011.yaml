author: "Patricia Smith, Gal Avishai, Joseph A. Greene, and Lawrence E. Stager"
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2011
  precision: exact
summary: >
  The principal modern bioarchaeological case *for* reading the
  Carthage [Tophet](/institutions/tophet) as a sacrificial
  precinct (*Antiquity* 85, 2011, pp. 859–874, with a follow-up
  in *Antiquity* 87, 2013, "Cemetery or Sacrifice? Infant
  Burials at the Carthage Tophet"). Working from the
  ASOR/Stager excavation material, Smith and colleagues argued
  that the [Schwartz team's age estimates](/sources/schwartz-tophet-2010)
  were skewed downward by a methodological error: cremation
  shrinks and distorts infant bone, so skeletal measurements
  on burned remains systematically underestimate age at death.
  Their re-analysis, weighting dental evidence that survives
  cremation better, found an age distribution concentrated
  between roughly one and two months, with prenatal individuals
  far rarer than Schwartz reported.

  The interpretive force of the finding: a natural-mortality
  cemetery should be dominated by perinatal deaths, since
  mortality in ancient conditions was highest at and
  immediately after birth. A distribution that peaks weeks
  later looks selected rather than natural, which is what the
  sacrifice reading predicts. Together with the
  ["bones of contention" rebuttal](/sources/xella-bones-of-contention-2013)
  on the archaeological and epigraphic side, the Smith papers
  moved the weight of specialist opinion back toward the
  position that real sacrifice underlies the
  hostile literary tradition, while leaving frequency and
  scale unresolved.

  This site's position, which leans on this work for the
  "practice happened" half while refusing the scale question,
  is the
  [tophet-happened-scale-unrecoverable editorial take](/editorialTakes/tophet-happened-scale-unrecoverable);
  the full exchange is narrated in
  [the Tophet controversy](/narratives/the-tophet-controversy).
