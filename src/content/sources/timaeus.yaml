bias_notes: >
  A Sicilian Greek historian writing in exile at Athens, and the
  earliest connected historian of the western Mediterranean whose
  work the later tradition depended on. Two biases matter for
  Carthage. First, the perspective is Sicilian-Greek: Carthage
  appears mainly through the lens of the Sicilian wars, as the
  barbarian power against which the western Greeks defined
  themselves. Second, Timaeus had a personal quarrel with
  Agathocles, the tyrant of Syracuse who had driven him into exile,
  and his account of Agathocles' African expedition is colored by
  that animosity; Diodorus, who followed Timaeus closely, transmits
  much of the hostility, and Polybius singles it out for attack. The
  work is also open to the charge Polybius pressed hardest, that it
  was compiled from books in the Athenian libraries rather than from
  travel and inquiry. Almost nothing survives directly; the
  Carthage-relevant material reaches us at one remove, chiefly
  through Diodorus and through the very polemic Polybius wrote to
  discredit it.
summary: >
  The lost history that stands behind much of what the later
  tradition preserved about early Carthage and the Greek west.
  Timaeus of Tauromenium (c. 350 to c. 260 BCE), son of the
  Tauromenian dynast Andromachus, was exiled from Sicily by
  Agathocles and spent some fifty years writing in Athens. His
  Histories ran to thirty-eight books and carried the story of
  Sicily and the western Mediterranean from mythical origins down to
  264 BCE, stopping deliberately at the point where Polybius chose to
  begin. A separate chronographic work, the Olympionikai,
  synchronized Olympic victors, Spartan kings, and Athenian archons
  into a common timeline, and gave Greek historiography much of its
  dating apparatus.

  For this site Timaeus matters at three points in particular. He is
  the origin of the traditional foundation date of Carthage: the
  calculation that placed the city's founding thirty-eight years
  before the first Olympiad, in 814/813 BCE, is his, and it descends
  through Justin and Velleius to become the date every later account
  repeats. He is an early witness to the Elissa foundation legend. And
  he is the principal source, by way of Diodorus, for the western
  Greek wars against Carthage and for Agathocles' invasion of Africa
  in 310 BCE, the campaign that carried the war onto Carthaginian soil
  for the first time.

  Timaeus is also the target of the most famous surviving piece of
  ancient source-criticism. Polybius devoted almost the whole of his
  Book 12 to demolishing him, mocking him as "Epitimaeus," the
  fault-finder, for his malice toward predecessors, his invented
  speeches, his pedantry over minor points, and above all for writing
  the history of places he had never seen from a library rather than
  from the field. The attack was partly self-interested, clearing the
  ground for Polybius's own claim to be the serious historian of the
  west, and modern scholarship has substantially rehabilitated
  Timaeus: his chronographic method was foundational, and his
  attention to the western Mediterranean preserved a body of material
  that would otherwise be lost entirely. The paradox is that Polybius's
  hostility is one of the main reasons so much of Timaeus survives at
  all. The fragments are collected as FGrHist 566.
