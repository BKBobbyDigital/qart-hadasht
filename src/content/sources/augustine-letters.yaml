bias_notes: >
  Augustine is a complicated source for Punic continuity. He
  was Carthaginian-cultural by birth (from Thagaste in modern
  Algeria, of a Latin-citizen-class but North-African family),
  educated in the Latin literary tradition, and writing as a
  Christian theologian whose principal frame is the universal-
  Christian one. He is not himself a Punic-language writer.
  But across his correspondence and sermons, Augustine
  repeatedly attests to Punic as a living spoken language
  among his rural North African congregations in the early
  5th century CE, defends Punic linguistic and cultural
  identity against Latin-elite mockery (Epistula 17 to
  Maximus of Madauros), and treats Punic-cultural rural
  populations as part of his pastoral charge in
  Hippo Regius. The site reads Augustine as a Carthaginian-
  born Latin writer whose Latin literary framing does not
  prevent him from speaking, sometimes explicitly, from a
  position of identification with the Punic-cultural
  substrate of his own world. He is not a "Roman witness
  to Carthage"; he is a Carthaginian-cultural witness
  whose Latin literary form filters but does not eliminate
  his Punic-cultural position.
