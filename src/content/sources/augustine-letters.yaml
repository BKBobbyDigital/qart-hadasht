summary: >
  Augustine of Hippo's letters and sermons, dating from
  approximately 391-430 CE, contain the principal late
  surviving testimony to the spoken Punic language and to
  the persistence of Punic-cultural identity in late
  Roman North Africa.

  The single most important text for the site is *Epistula
  17* to Maximus of Madauros (c. 390 CE). Maximus, a
  Latin-letters-trained pagan at Madauros (the same city that
  produced Apuleius two centuries earlier), had written
  Augustine a letter mocking Punic names and Punic cultural
  identity. Augustine's reply explicitly defends Punic:
  "Don't make Punic names something to laugh at, but
  remember that they are the same names which our ancestors
  in your city carried." The letter goes on to argue that
  Punic linguistic and cultural identity is a substantive
  African inheritance that Latin literary culture has no
  business dismissing. It is, for a Christian bishop writing
  in Latin to a Latin pagan, an unusually direct defense of
  Punic identity by reference to its substantive cultural
  reality rather than as a mere linguistic curiosity.

  Across the sermons, Augustine regularly references Punic
  words and phrases, explains Punic etymologies, and treats
  Punic-speaking congregants as part of his expected
  audience. He proposes Punic translations of biblical terms
  where Punic words illuminate the Hebrew underlying the
  Greek; he treats Punic and Hebrew as cognate Semitic
  languages whose shared vocabulary illuminates scripture
  for his African audience. The cumulative impression is of
  a bishop pastoring a partly Punic-speaking population in
  the early 5th century CE and treating that fact as
  unremarkable rather than as evidence of incomplete
  Romanization.

  For the site, Augustine is the principal late-Roman witness
  to spoken Punic and one of the strongest single pieces of
  evidence that Punic-cultural identity did not have a clean
  endpoint in late antiquity. The Latin literary framing of
  his work has to be acknowledged, but his Punic-cultural
  position is substantive and direct enough that he reads as
  a Carthaginian-cultural voice rather than as a Latin
  imperial observer.
