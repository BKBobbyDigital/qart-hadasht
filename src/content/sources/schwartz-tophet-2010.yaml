author: "Jeffrey H. Schwartz, Frank Houghton, Roberto Macchiarelli, and Luca Bondioli"
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2010
  precision: exact
summary: >
  The principal modern bioarchaeological case *against* the
  systematic-sacrifice reading of the Carthage
  [Tophet](/institutions/tophet) (*PLoS ONE* 5(2): e9177, 2010,
  with a follow-up defense in *Antiquity* 86, 2012). Schwartz
  and colleagues examined the cremated remains from 348 urns
  and argued, on skeletal and dental evidence, that a large
  fraction of the individuals died prenatally or within weeks
  of birth, an age profile they read as consistent with
  natural perinatal mortality in an ancient city rather than
  with the selective ritual killing the Greco-Roman literary
  tradition describes. On their reading the Tophet is
  primarily a cemetery for the very young, and the literary
  sacrifice tradition is at best a distorted account of a rare
  practice.

  The paper gave the older cemetery hypothesis of
  [Moscati](/sources/moscati-adoratori-1991) and
  [Ribichini](/sources/ribichini-tophet-2013) a new
  laboratory-science footing, and it set off the sharpest
  exchange in recent Punic studies: the
  [Smith team's counter-analysis](/sources/smith-tophet-2011)
  disputed the aging methods (bone shrinkage during cremation
  biases age estimates downward), and the
  ["Phoenician bones of contention" rebuttal](/sources/xella-bones-of-contention-2013)
  attacked the argument's archaeological and epigraphic
  framing. The dispute over cremated-infant age estimation
  remains methodologically live.

  This site's position on the underlying question is the
  [tophet-happened-scale-unrecoverable editorial take](/editorialTakes/tophet-happened-scale-unrecoverable);
  the debate this paper anchors is narrated in
  [the Tophet controversy](/narratives/the-tophet-controversy).
