bias_notes: >
  Jongeling's systematic onomastic study collects approximately
  6,000 personal names of demonstrably Punic, Libyan, and
  Berber origin attested in Latin-language epigraphy and
  literary sources from Roman-period North Africa. The work is
  the principal modern reference for the prosopographic
  evidence of Punic-cultural persistence through the imperial
  period: theophoric names containing *bʿl*, *mlk*, *ʿbd*-
  divine-name compounds, the *Bod-* and *Him-* and *Han-*
  elements that mark Punic onomastic identity, all continuing
  to appear in the Latin epigraphic record through the 3rd-4th
  centuries CE. The methodological discipline is conservative:
  Jongeling includes only names whose Punic etymology is
  securely demonstrable, excluding ambiguous cases.
summary: >
  Karel Jongeling's *North-African Names from Latin Sources*
  (Brill, 1994) is the principal modern reference for Punic and
  Libyo-Berber personal names attested in Roman-period
  North-African Latin epigraphy. The work collects approximately
  6,000 names with secure Punic, Libyan, or Berber etymology,
  with each entry providing the attestation, the etymological
  reconstruction, and the geographic and chronological
  distribution.

  For the site, Jongeling is the load-bearing source for the
  onomastic dimension of Punic-cultural continuity. Names are
  the most directly transmitted single line of cultural
  evidence — Punic-cultural parents named their children in
  Punic forms even when the families operated in Latin civic
  and religious contexts — and the persistence of theophoric
  Punic names through the 3rd and 4th centuries CE is direct
  evidence that Punic religious-cultural identity was
  maintained at the family level across multiple generations
  of nominal Romanization. The corpus also documents the
  geographic distribution of Punic-name persistence (the
  former Carthaginian heartland in modern Tunisia, the
  Numidian and Mauretanian zones, the Tripolitanian coastal
  cities), giving a partial map of where Punic identity
  remained substantively active in late antiquity.

  Jongeling's work supplements the inscriptional-corpus
  evidence (CIS, KAI) for the Punic-language record proper by
  showing how Punic identity persisted within Latin-language
  documentation. Together the two bodies of evidence — direct
  Punic-language inscriptions through the 3rd c. CE, and Punic
  names in Latin inscriptions running later — establish
  Punic-cultural continuity through the late Roman imperial
  period across a substantial population.
