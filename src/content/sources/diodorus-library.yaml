bias_notes: >
  Greek historian writing in the late Hellenistic period under Caesar and
  Augustus. Compiled from earlier sources rather than original investigation;
  for Carthage and Sicily, his principal source was Timaeus of Tauromenium
  (early 3rd c. BCE), giving us indirect but valuable access to a tradition
  hostile to Carthage from the Sicilian-Greek perspective. Reliability varies
  sharply by passage depending on which source he was excerpting; generally
  most reliable when paraphrasing Polybius or contemporaries of events, less
  so for early periods.
