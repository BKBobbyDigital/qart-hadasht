critical_read:
  what_it_gives: >
    The principal narrative for Carthaginian Sicily, and for long stretches
    the only one: Himera, the campaigns of 409–405, the wars with Dionysius,
    the Crimisus, and the Agathocles crisis. Books 25–26 survive as
    fragments that carry the Mercenary War and the Barcid conquest of
    Iberia, including the Iberian recognition of Hasdrubal as *strategos
    autokrator* (25.12) and the judgment that the rebels' cruelty forced
    Hamilcar to abandon leniency (25.3).
  what_it_argues: >
    A universal history on a moralizing frame, compiled from earlier writers
    rather than from investigation, in which events demonstrate the
    consequences of impiety and excess. For Sicily he depends on Timaeus,
    whose Sicilian-Greek and anti-Carthaginian outlook comes through, and
    his numbers are frequently impossible: he has Hamilcar sail for Himera
    with not less than three hundred thousand men (11.20).
  dependence: >
    Because he excerpts, his reliability changes with whichever source he is
    following, and a reader is really assessing that lost author. Timaeus
    stands behind the Sicilian books; for the First Punic War the underlying
    source may be Philinus or Polybius. The Book 25 fragments follow the
    same sequence as Polybius Book 1 closely enough that they should not be
    treated as independent confirmation of it.
public_domain_translation:
  translator: C. H. Oldfather
  year: 1933
  url: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Diodorus_Siculus/home.html
summary: >
  A forty-book universal history covering events from the mythical age to
  60 BCE. Books 1–5 and 11–20 survive complete; the rest in fragments and
  Byzantine excerpts. For Carthage, the indispensable books are 11–14 (the
  fifth-century Sicilian Wars between Carthage and Syracuse, including the
  campaigns of Hamilcar, Himilco, and Hannibal son of Gisco), 15 (further
  Sicilian conflicts), 19–20 (the Agathocles crisis and his African
  invasion, 310–307 BCE), and the surviving fragments of 21–32, which cover
  the Pyrrhic and First and Second Punic Wars from a perspective independent
  of, though sometimes harmonizing with, Polybius.
