bias_notes: >
  The foundational French-language treatment of how African
  (Punic and Berber) cultural identity persisted under Roman
  imperial administration. Bénabou's argument — that
  "Romanization" as conventionally framed by Latin-language
  scholarship under-weights the substantial continuity of
  African religious, linguistic, and political-cultural forms
  through the Roman period — is the principal scholarly reading
  against the closure narrative that treats 146 BCE as the
  endpoint of Punic culture. The book is methodologically
  important for the site because it reads the post-146 evidence
  from the African side rather than from the Roman
  administrative side, treating the continuation of Punic and
  Berber forms as a positive cultural fact rather than as
  residual "incompleteness" of Romanization.
summary: >
  Bénabou's *La résistance africaine à la romanisation*,
  published by Maspero in 1976, is the foundational French
  treatment of the question that Eve MacDonald and others have
  more recently re-raised: how far Punic and Berber cultural
  identities actually persisted under Roman imperial
  administration of North Africa, and how the historiographical
  framing of "Romanization" has tended to under-weight that
  persistence. The book works through the religious evidence
  (the Saturnus Africanus cult as the Roman-period continuation
  of Baal Hammon, the Iuno Caelestis cult as the continuation
  of Tanit, the persistence of the *molk* dedication formula in
  Latin epigraphy, the rural temple complexes that maintained
  pre-Roman religious organization through the imperial period);
  the linguistic evidence (neo-Punic inscriptions through at
  least the 3rd c. CE, the substantial Punic-name corpus in
  Latin epigraphy, Augustine's testimony to spoken Punic in the
  4th and early 5th c. CE); and the political-cultural evidence
  (the persistence of African civic institutions in modified
  Roman form, the Donatist controversy as partly a rural-African
  vs. urban-Latin religious-cultural fault line).

  The site reads Bénabou's work as the principal scholarly
  anchor for the "Punic continuity in Roman Africa" treatment,
  particularly for the methodological discipline of leading
  with non-Roman primary evidence (neo-Punic inscriptions,
  onomastic persistence, religious-architectural continuity)
  rather than reading the continuation question through Latin
  imperial-period framings. Bénabou's specific positions are
  contested in subsequent scholarship (some are read as
  overstating the resistance dimension; others as
  understating the genuine cultural-administrative absorption
  that occurred), but the foundational methodological move —
  treating African continuity as a substantive historical
  reality on its own terms — has shaped the broader field's
  approach to post-146 Punic Africa.
