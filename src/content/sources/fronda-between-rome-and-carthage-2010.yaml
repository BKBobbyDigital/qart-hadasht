summary: >
  Monograph (Cambridge University Press, 2010) on the southern
  Italian communities during the Second Punic War and the question
  of why particular cities went over to Hannibal while their
  neighbors did not. Listed here as further reading on the
  defections, which is the one question in the Italian campaign the
  site treats at length without a specialist study behind it. The
  site has not read the book, so it attributes no position to it and
  repeats no argument from it.
