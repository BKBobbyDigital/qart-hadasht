bias_notes: >
  An eyewitness writing from inside Hannibal's entourage, and
  therefore about as close to a Carthaginian-aligned account of the
  Second Punic War as survives, filtered through a Greek pen. The
  perspective is sympathetic to Hannibal, whom Sosylus served and
  taught. The one hostile external verdict is Polybius's: he lumps
  Sosylus together with Chaereas and dismisses both as retailing
  "the common talk of the barber's shop" (3.20). That judgment has
  to be weighed against Polybius's habit of clearing rivals out of
  his path, and against the one substantial fragment that does
  survive, a competent and technical piece of naval narrative that
  reads nothing like gossip.
summary: >
  A history of Hannibal in seven books by a Spartan who accompanied
  the campaign. Sosylus of Sparta was one of the Greek intellectuals
  attached to Hannibal's staff; the tradition remembers him as the
  man who taught Hannibal Greek, and Cornelius Nepos names him
  alongside [Silenus of Caleacte](/sources/silenus-caleacte) as the
  two who wrote up the general's deeds and stayed with him "as long
  as fortune allowed." The two are companions in the record rather
  than a documented traveling pair, but both saw the Second Punic
  War from within Hannibal's entourage, which makes their lost
  histories the nearest thing to the war seen from the Carthaginian
  side.

  Almost none of it survives. The exception is a single papyrus, the
  Würzburg fragment, which preserves part of Sosylus's account of a
  naval engagement, most likely the battle off the mouth of the Ebro
  in 217 BCE, and turns on a Massaliot tactical maneuver described
  with real technical understanding. The fragment matters out of all
  proportion to its length: it is direct access to a contemporary,
  Hannibal-aligned narrative, and its competence sits awkwardly
  against Polybius's contemptuous dismissal of Sosylus as a purveyor
  of barbershop gossip. Where Polybius names Sosylus, he does so to
  reject him; that Polybius bothered to reject him at all is a sign
  the work circulated and was taken seriously. The remainder is known
  only from scattered citation.
