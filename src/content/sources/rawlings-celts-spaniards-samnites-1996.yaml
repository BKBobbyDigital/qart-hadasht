title: "Celts, Spaniards and Samnites: warriors in a soldiers' war"
author: "Louis Rawlings"
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 1996
  precision: exact
summary: >
  Chapter in Tim Cornell, Boris Rankov, and Philip Sabin (eds),
  *The Second Punic War: A Reappraisal* (Institute of Classical
  Studies, Bulletin Supplement 67, 1996, pp. 81–95). Treats the
  non-Carthaginian and non-Roman contingents who fought on both
  sides of the Second Punic War — the Celtic and Gallic
  warriors Hannibal recruited in northern Italy and from his
  Iberian operations, the Iberian, Celtiberian, and Lusitanian
  units who served across the Italian, Iberian, and African
  theatres on the Carthaginian side, the Samnite and other
  Italian allies who deserted Rome for Hannibal after Cannae,
  and the parallel non-Roman recruitment Rome relied on in
  Iberia and the Italian allied system.

  The chapter's argument is that these populations were
  warriors operating within their own cultural-military
  traditions rather than passive instruments of either great
  power. Rawlings reads the engagement of Celtic, Iberian, and
  Samnite warriors in the war as expressing the political and
  cultural agency of communities whose interests intersected
  the Punic War without being absorbed by it, a methodological
  move closely related to the site's broader treatment of
  non-Greco-Roman agency. The chapter is one of the earlier
  modern treatments to take the war's "third parties" seriously
  on their own terms rather than as scenery in a
  Rome-versus-Carthage drama.

  The volume itself (Cornell, Rankov, and Sabin's *Reappraisal*)
  is a foundational mid-1990s collection that helped reset
  how the field approached the Second Punic War, with contributions from Lazenby, Cornell,
  Rankov, Sabin, and others. Rawlings's contribution is the
  one most directly useful for the site's army-composition
  material and its treatment of non-Greco-Roman agency.
