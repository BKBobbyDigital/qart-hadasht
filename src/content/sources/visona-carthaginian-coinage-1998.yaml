summary: >
  The standard modern survey of the field (*American Journal of
  Numismatics* 10, 1998, pp. 1–27). Visonà, the leading
  specialist on Punic numismatics of his generation, reviews the
  whole arc of Carthaginian coin production: the late adoption
  (Carthage struck no coins until roughly the end of the 5th
  century BCE, three centuries into its existence), the
  Siculo-Punic military issues that began the tradition, the
  metropolitan gold, electrum, silver, and bronze series, the
  Sardinian production, and the
  [Barcid Iberian coinage](/artifacts/barcid-iberian-coinage)
  that closed the sequence. The article is also a methodological
  statement: it takes stock of what hoards, overstrikes, and
  metal analysis can and cannot establish, and flags the
  chronological soft points where the standard sequence rests on
  thinner evidence than its neatness suggests.

  Visonà also wrote the numismatic chapter of the
  [Krings *Manuel de recherche*](/sources/krings-manuel-1995),
  which covers the same ground in French with fuller
  bibliography; the two together are the natural entry points to
  the specialist literature. On this site the survey anchors the
  [Carthaginian coinage theme](/themes/carthaginian-coinage),
  particularly its treatment of coinage as a military-fiscal
  instrument rather than a commercial habit, a point Visonà's
  account of the Siculo-Punic beginnings makes directly.
