bias_notes: >
  Greek historian writing in the mid-5th century BCE, approximately
  forty years after the events of Himera. Herodotus's principal
  subject is the Persian Wars and the broader confrontation between
  Greeks and "barbarians" he reads as their structural counterpart;
  Carthage and Sicily enter his narrative substantially as the
  western mirror of the eastern Persian-Greek conflict, with the
  Sicilian victory over Carthage explicitly paired with Salamis as
  a Greek dual triumph. The framing is more rhetorically
  constructed than historically grounded: the same-day coincidence
  Herodotus emphasizes is impossible to verify and may be
  literary rather than factual. Where Herodotus reports specific
  details about Carthage and Carthaginian practice, his information
  is often distant and sometimes confused, having traveled to him
  through multiple intermediaries. Where he provides Greek-Sicilian
  political detail, his sources were likely better.
