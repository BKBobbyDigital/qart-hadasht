summary: >
  Nine-book history of the Persian Wars, conventionally treated as
  the foundational work of Greek (and Western) historical writing.
  Books 7-9 cover the years 480-479 BCE in detail, including the
  battles of Thermopylae, Salamis, and Plataea on the Greek
  mainland. Book 7.165-167 contains Herodotus's brief but
  influential account of the Carthaginian invasion of Sicily and
  the Battle of Himera, framed as the western counterpart to the
  Persian invasion. The chapter introduces the same-day-as-Salamis
  tradition that subsequent Greek and Latin authors (especially
  Diodorus) would elaborate. For Carthaginian history, Herodotus
  is the earliest preserved literary source naming Carthaginian
  individuals; for the Sicilian-Greek world he is essential
  background.
