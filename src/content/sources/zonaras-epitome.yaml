bias_notes: >
  A Byzantine chronicle whose value for Roman history lies almost entirely
  in its summary of Cassius Dio, whose books on the Punic Wars are
  otherwise lost. Zonaras compresses and occasionally confuses, and what
  he reports is Dio's version at one remove.
summary: >
  A world chronicle by a twelfth-century Byzantine official, which for the
  Roman Republic abridges the lost books of Cassius Dio. On the end of
  Carthage (9.30) it gives what no other surviving source does: most of
  the men captured in 146 were thrown into prison and died there and a
  few were sold, while the leading men, the hostages, Hasdrubal and the
  Numidian Bithyas lived out their lives in honorable confinement in
  different parts of Italy; and Scipio Aemilianus took the name Africanus
  for his own achievements.
