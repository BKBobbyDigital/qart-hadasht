bias_notes: >
  Appian's subject is Rome's wars in Spain, so the Barcids appear only
  in the opening chapters, as the background a Roman reader needed.
  That brevity is the problem and the interest together: he compresses
  two decades into a few sentences, and the compression preserves a
  line on Carthaginian internal politics that the Polybian tradition
  does not carry. Where he differs from Polybius he is not therefore
  better informed, but he is drawing on something else, and on the
  Barcids he is markedly less friendly. Nothing here should outweigh
  Polybius on a matter Polybius treats at length; it is worth having
  where Polybius is silent, which is mostly on what happened in the
  courts at Carthage.
summary: >
  Chapter 4 gives the Carthaginian politics around Hamilcar Barca in a
  few lines, and almost none of it is in Polybius.

  Appian makes Hamilcar the cause of the Mercenary War. While
  commanding in Sicily he had promised large rewards to his Celtic
  mercenaries and African allies; when they demanded payment after he
  came home, the African war broke out, Carthage suffered badly, and
  Sardinia was ceded to Rome. His enemies held him answerable for all
  of it and prosecuted him. He escaped by securing the support of
  leading men in the state, and Appian names the most important of
  them: **Hasdrubal**, who had married his daughter. The man the site
  elsewhere treats as Hamilcar's successor in Iberia appears here first
  as the political connection that kept him out of court.

  Two further details are worth keeping. Hamilcar was given a command
  against a Numidian disturbance jointly with
  [Hanno the Great](/people/hanno-the-great) although, Appian says, he
  had still not rendered an account of his earlier generalship, which
  is a concrete glimpse of how far the Carthaginian audit of commanders
  could be deferred for a man with backing. And when Hanno was in turn
  recalled to face charges, Hamilcar was left in sole command, took
  Hasdrubal as his associate, crossed to Gades and began raiding, which
  Appian presents as giving him a reason to stay out of the country
  while winning glory and popularity.

  That last is a motive for the Iberian project the Polybian tradition
  does not offer, and the site treats it as one reading among several
  rather than as the explanation: it is late, it is hostile, and a man
  who stayed abroad for nine years and died in the field was doing more
  than avoiding a courtroom. See
  [the Barcid Iberian state](/narratives/the-barcid-iberian-state) for
  what the project became.

  Appian's blunt attribution of the war to Hamilcar's promises is set
  against Polybius and Diodorus in the
  [source comparison on the Mercenary War atrocities](/sourceComparisons/mercenary-war-atrocities).
