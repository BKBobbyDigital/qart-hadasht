summary: >
  Two volumes (Oxford University Press, 1965) arguing that the Second
  Punic War was the hinge on which the Roman Republic turned toward its
  own destruction. Toynbee's case is that the fifteen years Hannibal
  spent operating in Italy ruined the countryside he moved through,
  broke the smallholding peasant families who had supplied Rome's
  citizen legions, and cleared the ground for the slave-worked estates
  that replaced them. The land crisis the Gracchi tried and failed to
  solve two generations later is, on this reading, a delayed
  consequence of the war Rome won.

  The thesis dominated the field for decades and shaped how the middle
  Republic was taught, partly because it supplies a single mechanism
  linking a military event to a social transformation that is otherwise
  hard to explain. It has since been challenged on demographic grounds,
  most directly by
  [Rosenstein](/sources/rosenstein-rome-at-war-2004), and the argument
  is now among the live disputes in Roman republican history rather
  than a settled account. This site cites Toynbee as the strong
  statement of the war-as-rupture position in the
  [open question on what the war cost Rome](/openQuestions/hannibalic-war-cost-to-rome),
  not as the answer.

  Toynbee's interest for a Carthage-side reference is narrower than his
  interest for Roman history. He is the fullest attempt to work out
  what Hannibal actually did to Italy, as opposed to what he did to
  Roman armies, and the accounting matters for understanding the Rome
  that chose to destroy Carthage in 146.
