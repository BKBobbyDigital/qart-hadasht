summary: >
  Monumental 142-book history of Rome from its founding to 9 BCE. Books 21–30 cover
  the Second Punic War (218–201 BCE) and are the fullest surviving narrative of
  Hannibal's war. Books 31 onward continue through the Macedonian wars and the
  Third Punic War (in books now lost; survives only in epitome).
