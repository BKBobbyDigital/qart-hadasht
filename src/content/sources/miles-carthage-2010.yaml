title: "Carthage Must Be Destroyed: The Rise and Fall of an Ancient Civilization"
author: Richard Miles
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2010
  precision: exact
summary: >
  Wide-ranging modern history that places Carthage in its full Phoenician and
  Mediterranean context, tracing the cultural construction of "Carthage" as much
  as the political history. Miles is particularly attentive to how the Roman
  destruction shaped — and continues to shape — what we know and what we can
  recover. Strong on Hellenistic-era Carthage and on the religious and ideological
  dimensions of the conflict with Rome.
