summary: >
  Hoyos's entry on the Third Punic War in *The Encyclopedia of
  Diplomacy*, edited by Gordon Martel (Wiley-Blackwell), a short
  reference treatment of the war's diplomatic origins by one of the
  leading historians of Carthage. The point the site draws on is his
  statement that Masinissa's attempts to annex Carthaginian territory
  were, contrary to the general view, rebuffed by Rome until after 167
  BCE, which dates the Roman shift toward tolerating Numidian expansion
  to the last two decades before the war rather than to the whole
  period after Zama.

  Cited in the
  [claim on Masinissa's territorial seizures](/claims/masinissa-territorial-seizures-pattern)
  alongside [Bailey](/sources/bailey-rome-carthage-numidia-2018), and in
  the [editorial take on why Carthage was destroyed](/editorialTakes/destruction-not-weak-enough).
  For Hoyos's longer treatment of Carthage see
  [The Carthaginians](/sources/hoyos-carthaginians-2010).
