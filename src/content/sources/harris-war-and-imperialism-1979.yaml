summary: >
  The book that ended the long dominance of "defensive imperialism" in
  the study of Roman expansion (Oxford: Clarendon Press, 1979). The
  older consensus, running from Mommsen through Tenney Frank and
  Maurice Holleaux, held that the Republic acquired its empire more or
  less reluctantly, drawn into war after war by threats to its security
  or to its allies. Harris argued the reverse: that Roman society was
  organized for war, that the aristocracy's routes to glory and wealth
  ran through annual campaigning, that ordinary citizens expected and
  shared in plunder and land, and that Rome went to war nearly every
  year because its institutions and values made war normal.

  For the First Punic War the argument cuts directly against any
  reading of 264 as an accident. On Harris's view the Mamertine appeal
  was an opportunity that a state built this way was always likely to
  take, and Polybius's picture of a hesitant senate is less important
  than the fact that Rome crossed, escalated, and kept fighting for
  twenty-three years. The site cites Harris as the strongest statement
  of the position that the war was chosen, set against
  [Hoyos](/sources/hoyos-unplanned-wars-1998) on contingency and
  [Eckstein](/sources/eckstein-mediterranean-anarchy-2006) on the
  pressures of the interstate system, in its
  [editorial take on what caused the First Punic War](/editorialTakes/fpw-causation).
