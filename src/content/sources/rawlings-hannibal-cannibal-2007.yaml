summary: >
  Working paper published in Cardiff Historical Papers 9
  (Cardiff School of History and Archaeology, 2007, pp. 1–30),
  open-access through the Cardiff orca repository. The paper
  takes the specific Polybian charges of Barcid atrocity, most provocatively the (almost certainly fabricated)
  cannibalism allegation Polybius reports about Hannibal in
  passing, and treats them as ideology rather than analysis,
  arguing that the surviving Polybian framing of Punic
  military violence systematically over-attributes structural
  Hellenistic-era warfare practices to a specifically
  Carthaginian or Barcid character defect.

  The methodological move is the substantive contribution.
  Rawlings is careful that the question is not whether
  atrocities occurred (they did, on both sides, in proportion
  to the period's norms) but how the surviving record's
  framing of those atrocities reflects the historiographical
  needs of the source rather than the historical situation it
  records. The reading is closely aligned with the site's
  broader methodological discipline of reading
  Polybian-and-Latin moral framings against the grain, and
  particularly with the
  [mercenary-war atrocity editorial take](/editorialTakes/mercenary-war-atrocity-structural)
  that treats the 240–238 BCE atrocities as a structural
  pattern of post-war demobilization breakdown rather than as
  Barcid character defect.

  The paper is also a useful methodological reference for any
  claim that turns on whether a specific Polybian or Livian
  framing should be read at face value or as part of the
  source's broader Roman-constitutional or moralizing
  program.
