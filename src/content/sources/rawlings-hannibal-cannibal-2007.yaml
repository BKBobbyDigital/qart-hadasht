summary: >
  Working paper published in Cardiff Historical Papers 9 (Cardiff School
  of History and Archaeology, 2007, pp. 1–30), open access through the
  Cardiff ORCA repository. As its title says, it examines Polybius's
  treatment of the atrocities charged against the Barcids. In Polybius
  the notorious cannibalism proposal is made not by Hannibal but by his
  officer Hannibal Monomachus, and Polybius presents Hannibal's circle as
  the source of the cruelty attributed to him (9.22–26). The site has not
  checked the paper's arguments against its text, so it cites the paper
  for further reading without attributing specific conclusions to it.
