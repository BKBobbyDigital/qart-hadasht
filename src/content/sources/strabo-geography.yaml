bias_notes: >
  A Greek geographer from Amaseia in Pontus, writing under Augustus and
  Tiberius, who drew heavily on earlier writers (Polybius, Artemidorus,
  Posidonius among them) and often reports their disagreements. His
  judgments on those earlier writers are his own and tend to favor
  Polybius. For the Punic world he is a compiler at a distance, but a
  careful one who names his authorities, which is how several lost
  writers survive in him at all.
public_domain_translation:
  translator: H. L. Jones
  year: 1917
  url: http://penelope.uchicago.edu/Thayer/e/roman/texts/strabo/home.html
summary: >
  Seventeen books describing the inhabited world as known in the early
  Roman empire, region by region, with history, ethnography and
  natural wonders folded into the geography. Book 3 covers Iberia and
  is the richest single ancient account of the peninsula the Barcids
  ruled, including the silver country and the Phoenician foundation at
  Gades.

  The passage that matters most for Hannibal is 3.5.7, on the spring
  in the sanctuary of Heracles (Melqart) at Gades whose flow was said
  to rise and fall against the tides. Strabo names Silenus among the
  writers who described it, alongside Polybius and Posidonius, and
  prefers Polybius's account. That makes this one of the few places
  where a fragment of
  [Silenus of Caleacte](/sources/silenus-caleacte), Hannibal's
  historian, can be tied to a subject: the sanctuary where Hannibal made
  his vows before the march on Italy.

  How Strabo handles Silenus is part of the story. Silenus was the
  earliest writer on the spring, but Strabo leads with Polybius, reports
  Silenus only as a name quoted by Artemidorus, and dismisses both as
  laymen, then sets out Posidonius's failure to find the spring at all.
  [Fernández Camacho](/sources/fernandez-camacho-silencing-silenus-2025)
  argues that this chain silenced the spring's real author, and that
  Silenus invented the marvel on the model of the Spring of the Sun at
  Siwah. See [The march as a labor](/narratives/hannibal-and-heracles).
