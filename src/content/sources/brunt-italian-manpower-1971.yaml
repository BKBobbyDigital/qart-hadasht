summary: >
  Oxford University Press, 1971. The standard modern reconstruction of
  Roman and Italian population and military manpower across the middle
  and late Republic, and the work most of the casualty and mobilisation
  figures in the literature ultimately rest on. Brunt works from the
  census returns, the legionary levies, and the colonisation record to
  estimate how many men Rome and its allies could field, how many they
  lost, and what proportion of the adult male population was under arms
  in a given year.

  For the Second Punic War the reconstruction is stark. The proportion
  of Roman adult male citizens serving in the war years is
  extraordinarily high by any pre-modern standard, and the recorded
  census figures fall sharply between the survey taken shortly before
  the war and the one taken as it closed. The site uses Brunt for the
  scale of the Roman loss in the
  [narrative on what the war cost the winner](/narratives/what-the-war-cost-the-winner),
  while noting that census figures are themselves difficult evidence:
  what exactly the Republic was counting, and how completely it counted
  it during a war, are both disputed.
