bias_notes: >
  A defense speech, and an argument about Cicero's own banishment
  carried on through other people's examples. The Hannibal passage sits
  in a list of men expelled by ungrateful cities, so it is shaped to
  make exile the city's fault and the exile's honor. It tells us how
  Hannibal's end was remembered at Rome in the 50s BCE, not how
  Carthaginian politics worked.
summary: >
  Cicero's defense of Publius Sestius, delivered in 56 BCE, which turns
  into a long justification of Cicero's own career and recall. Arguing
  that cities disgrace themselves by driving out the men who served
  them, he runs through Greek examples and then reaches the enemy:
  who among the Carthaginians, he asks, surpassed Hannibal in judgment,
  courage and achievement, the one man who contended with so many Roman
  generals for so many years over empire and glory? His own citizens
  threw him out of the state, and Rome celebrates him in its literature
  even as an enemy (68.142).

  The remark is useful on two counts. It is a Roman statement, made
  about 130 years after the event and before Livy wrote, that the
  expulsion was Carthage's doing, which bears on the question of who
  drove Hannibal out; and it is an early instance of the Roman habit of
  honoring him, which the same literature pairs with the charge of
  Punic treachery.
