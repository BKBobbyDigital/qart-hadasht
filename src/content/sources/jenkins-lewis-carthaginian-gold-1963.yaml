summary: >
  The standard catalog of Carthage's gold and electrum coinage
  (Royal Numismatic Society Special Publication 2, London, 1963).
  Jenkins, then Keeper of Coins and Medals at the British Museum,
  and Lewis organized the precious-metal series into a sequence of
  groups that remains the reference chronology: from the
  high-purity gold staters of the mid-4th century BCE, through
  the progressively alloyed electrum of the early 3rd century, to
  the heavily debased issues of the First Punic War and Mercenary
  War years.

  The catalog's lasting analytical contribution is that
  trajectory itself. Because the fineness of the metal can be
  measured, the series functions as a fiscal record no
  Carthaginian document survives to provide: the state's
  precious-metal coinage is at its purest in the prosperous
  mid-4th century and degrades in step with the
  [First Punic War's](/events/first-punic-war) costs and the
  [Mercenary War](/events/mercenary-war) pay crisis. The site's
  treatment of coinage as evidence for state finance, in the
  [Carthaginian coinage theme](/themes/carthaginian-coinage),
  rests on the sequence Jenkins and Lewis established.

  Sixty years on, individual datings have been refined,
  particularly where hoard evidence has accumulated, but the
  group structure has not been replaced. Specialist work on the
  gold and electrum series still cites the catalog's group
  numbers.
