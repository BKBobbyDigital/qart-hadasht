bias_notes: >
  A Greek senator and governor under Hadrian, writing more than four
  centuries after Alexander but working from the memoirs of men who had
  served with him, chiefly Ptolemy and Aristobulus, whom he names and
  often compares. That practice makes him the most careful surviving
  historian of Alexander, and also the one who shows most clearly how
  much of the Alexander story was already shaped by his companions'
  interest in presenting him as favored by the gods.
