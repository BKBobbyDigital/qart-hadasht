summary: >
  The standard German-language reference work on Carthage, in its third
  edition (Verlag C. H. Beck). Huss is one of the most prolific modern
  scholars of Carthaginian history; his earlier Geschichte der Karthager
  (1985) remains a foundational reference, and Die Karthager is the
  more accessible synthesis aimed at a wider readership. For specialist
  questions where Anglophone scholarship is thin, particularly on
  Carthaginian institutions, religion, and the structure of the empire,
  Huss is often the deepest source available, and is cited by virtually
  every serious modern study including the English-language syntheses
  by Miles, MacDonald, and Hoyos.
