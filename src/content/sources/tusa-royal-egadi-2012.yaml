title: "The landscape of the naval battle at the Egadi Islands (241 B.C.)"
author: "Sebastiano Tusa and Jeffrey Royal"
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2012
  precision: exact
summary: >
  The first full publication of the underwater survey of the
  [Battle of the Aegates Islands](/events/battle-of-aegates-islands),
  in *Journal of Roman Archaeology* 25 (2012), pp. 7-48. Tusa, then
  superintendent of the Sicilian Soprintendenza del Mare, and Royal, of
  the RPM Nautical Foundation, set out the results of the systematic
  survey of the seabed off Levanzo: bronze warship rams, helmets, and
  amphoras, the last plausibly part of the supplies the Carthaginian
  fleet was carrying to the army in western Sicily.

  The paper's argument is spatial. The distribution of finds on the
  seabed fixes the general location of the engagement, which modern
  reconstructions from Polybius (1.60-61) had placed across several
  kilometers of channel, and it defines the battle's landscape well
  enough to test the literary narrative against it. That makes it the
  foundation for everything written since on the
  [Egadi rams](/artifacts/egadi-bronze-ram), and it is the site's
  principal citation for the archaeology of the battle.

  The helmets it reports are of the Montefortino type, a form of
  Celtic origin that was standard equipment for Roman infantry and was
  also worn by the Italian and Celtic soldiers who served Carthage. A
  helmet on this seabed therefore cannot, on type alone, be assigned to
  either fleet, while an inscribed ram can. The contrast is a useful
  reminder of how much of the evidence from an ancient battle is
  ambiguous even when it is physically in hand.
