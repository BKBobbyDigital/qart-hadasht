summary: >
  A twenty-book history of Rome from its legendary origins to the
  outbreak of the First Punic War, of which the first eleven books
  survive substantially. The site cites it for a single passage that
  bears on Hannibal. In Book 1 Dionysius tells the story of Heracles and
  Cacus twice (1.39–42). The first telling is the familiar myth of the
  hero resting his cattle and the robber who steals them. The second,
  which he calls the truer account, turns Heracles into a general: at
  the head of a great army, having already conquered Spain, he forces
  the passes of the Ligurian mountains, overthrows grievous despotisms
  and sets up lawful governments, defeats Cacus as a barbarian chieftain
  who raided his sleeping camp, and carries his prisoners with him
  before settling them on conquered land with a share of the spoils.

  Richard Miles argues that the correspondences with Hannibal's march
  from Spain over the Alps to "liberate" Italy from Rome are too close
  to be accidental, and that the rationalized Heracles was shaped by, or
  for, the Hannibalic campaign. Dionysius does not say where he found
  the version, so the direction of influence cannot be proved. The
  argument is set out in
  [The march as a labor](/narratives/hannibal-and-heracles).
