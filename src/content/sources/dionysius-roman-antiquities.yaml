bias_notes: >
  A Greek rhetorician writing at Rome under Augustus, whose declared aim
  was to show Greek readers that the Romans were Greeks by origin and
  worthy of their empire. For Carthaginian history his value is
  indirect. His early books preserve a large body of older Greek
  mythography about Italy, often in two versions, the fabulous one and a
  "truer" rationalized one, and he rarely names where the rationalized
  version came from.
