summary: >
  A full-length study of the Mercenary War (also called the Truceless
  War, from Polybius's ἄσπονδος πόλεμος) by the editor of *A Companion to
  the Punic Wars*, covering the conflict from the pay dispute at Sicca to
  the defeat of Mathos. Cited on this site as the modern monograph on the
  war. The site has not checked the book's specific arguments against its
  text, so it does not attribute particular interpretations to it.
