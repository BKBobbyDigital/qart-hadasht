summary: >
  The standard modern monograph on the Mercenary War, also called the
  Truceless War from Polybius's characterization (ἄσπονδος πόλεμος).
  Hoyos provides a sustained reconstruction of the conflict from the
  pay dispute at Sicca through the final defeat of Mathos and the
  African rebels, drawing on Polybius's extensive Book 1 narrative
  and the surviving fragments of Diodorus and other sources. The
  book treats the war as both a Carthaginian existential crisis and
  the formative episode of Hamilcar Barca's late-career command,
  and analyzes the structural conditions (the Lutatius indemnity, the
  Libyan tribute system, the disposition of mercenary contingents
  recovered from Sicily) that produced the revolt. Indispensable for
  any treatment of Carthage between the First and Second Punic Wars
  and a natural companion to Hoyos's *Hannibal's Dynasty* (2003) and
  *Unplanned Wars* (1998).
