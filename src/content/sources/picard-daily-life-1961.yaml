  value: 1961
  precision: exact
summary: >
  Translated by A. E. Foster from the French original (La vie quotidienne
  à Carthage au temps d'Hannibal, 1958). The Picards, Gilbert as a leading
  French archaeologist who excavated at Carthage, Colette as a historian
  of Punic religion, produced a synthesis of mid-20th-century knowledge
  about Carthaginian society at its peak: housing, food, dress, work,
  religion, family life, social structure. Now superseded in many
  particulars by later excavation and scholarship, but still cited as
  the first sustained attempt to reconstruct ordinary Carthaginian life
  rather than merely military and political events. Useful with caution
  and against more recent works.
