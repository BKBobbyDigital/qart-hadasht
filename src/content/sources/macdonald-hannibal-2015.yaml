title: "Hannibal: A Hellenistic Life"
author: Eve MacDonald
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2015
  precision: exact
summary: >
  Modern scholarly biography that situates Hannibal squarely within the
  Hellenistic Mediterranean world rather than the older Romano-centric frame.
  MacDonald — who has written extensively on Carthage and the wider Punic
  world — draws on archaeology and recent scholarship as well as the literary
  sources, reconstructing Hannibal not only as a general but as a
  Carthaginian statesman, a member of the Barcid family in its political
  context, and a figure shaped by the Hellenistic kingdoms whose practices
  and personnel he interacted with throughout his life. Companion to her
  broader work on Carthage; particularly strong on the Iberian command, on
  Hannibal's post-war career as suffete, and on the long exile that ended
  in Bithynia.
