bias_notes: >
  Roman biographer of the late Republic, contemporary with Cicero and Atticus
  (to whom he dedicated his works). Nepos's biographies are short, Hellenizing
  in form, and openly admiring of his non-Roman subjects in a way that
  contrasts notably with the standard Roman annalistic treatment. For
  Hannibal he draws on now-lost biographical sources — possibly including
  Sosylus and Silenus, the Greek historians who accompanied Hannibal — giving
  occasional access to traditions independent of Polybius and Livy.
public_domain_translation:
  translator: John Selby Watson
  year: 1886
  url: https://www.tertullian.org/fathers/nepos_02_lives.htm
summary: >
  A short biography of Hannibal — perhaps fifteen Latin pages — covering his
  early life under his father's tutelage, his command in Spain and the
  invasion of Italy, the campaigns down to Zama, and his later career as
  suffete, exile, and adviser to Hellenistic kings. Nepos's framing is
  notably positive: he opens by calling Hannibal the greatest general of
  his age and treats his exile as a tragedy of Roman vindictiveness rather
  than just punishment. The biography is too brief to be a primary narrative
  source for any single episode, but it preserves details (and a tone) found
  nowhere else in the Latin tradition.
