critical_read:
  what_it_gives: >
    A short life of Hannibal written from outside the annalistic tradition,
    and admiring of him in a way no other Latin source is. Two passages
    carry weight on this site: the Alpine route described as the one
    Hercules took (3.4), and an account of the 195 denunciation that names
    no accusers and declines to judge the charge (7), which is the principal
    tradition standing against Livy's.
  what_it_argues: >
    That foreign commanders can be measured against Roman ones and come off
    well, which is the point of a collection of lives of famous foreign
    generals written for a Roman readership in the late Republic. The
    brevity is a genre constraint rather than a sign of caution: he
    compresses hard, and errs in detail.
  dependence: >
    He drew on lost biographical sources, possibly including Sosylus and
    Silenus, the Greek historians who traveled with Hannibal, which is what
    makes him occasionally independent of Polybius and Livy. Since those
    sources are lost, the independence cannot be demonstrated, only argued
    from where he differs.
public_domain_translation:
  translator: John Selby Watson
  year: 1886
  url: https://www.tertullian.org/fathers/nepos_02_lives.htm
summary: >
  A short biography of Hannibal, perhaps fifteen Latin pages, covering his
  early life under his father's tutelage, his command in Spain and the
  invasion of Italy, the campaigns down to Zama, and his later career as
  suffete, exile, and adviser to Hellenistic kings. Nepos's framing is
  notably positive: he opens by calling Hannibal the greatest general of
  his age and treats his exile as a tragedy of Roman vindictiveness rather
  than just punishment. The biography is too brief to be a primary narrative
  source for any single episode, but it preserves details (and a tone) found
  nowhere else in the Latin tradition.
