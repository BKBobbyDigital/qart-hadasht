bias_notes: >
  Moscati's polemical statement of the cemetery-hypothesis position
  on the Tophet question. The book argues, rather
  than rhetorically, that the classical-source narrative of
  Carthaginian child sacrifice is a hostile-tradition projection
  onto what was in fact an infant-cemetery practice misread by
  Greco-Roman observers. Moscati was the founding figure of the
  modern Italian Phoenician-Punic studies tradition and his
  position substantially shaped continental European scholarship
  on the Tophet through the 1990s and 2000s. The site treats his
  reading as one of the principal competing positions on the
  Tophet question, not as the position the surviving evidence
  supports (the 2010s bioarchaeology challenges the strong-cemetery
  reading); but Moscati's argument is preserved as a serious
  scholarly position that any honest treatment of the question
  has to weigh.
summary: >
  The most polemically developed statement of Sabatino Moscati's
  cemetery-hypothesis reading of the Carthaginian Tophet. Published
  by Jaca Book in Milan in 1991, the book argues that the Tophet
  precinct was a burial ground for infants who died of natural
  causes, given ritual cremation and dedicatory commemoration
  because of their special religious status, rather than a
  sacrificial precinct, and that the classical-source descriptions
  of Carthaginian child sacrifice (Diodorus, Plutarch, Tertullian)
  are hostile-tradition projection onto an unfamiliar Phoenician
  mortuary practice. The argument is substantive: Moscati develops
  the perinatal-demographic case (a cemetery for infants would
  naturally accumulate at the scale the Tophet shows), the
  animal-remains-as-offerings-for-the-deceased reading, and the
  literary-source critique in detail.

  Moscati's broader contribution to Phoenician-Punic studies is
  enormous and not confined to the Tophet question. He founded
  the *Studi Fenici* journal and the corresponding research
  programme at the Università di Roma "La Sapienza"; his
  multi-volume *I Fenici* (1988, Bompiani) is the major Italian
  handbook for the field; his methodological emphasis on
  archaeology and inscriptional evidence over the Greco-Latin
  literary tradition has substantially shaped how continental
  European scholarship reads the Punic record. The site's
  treatment of the inscriptional corpus as a primary evidence
  category in its own right is part of the broader methodological
  tradition Moscati's work consolidated.

  The cemetery-hypothesis position itself, as the site reads the
  current state of the evidence, was substantially modified after
  the 2010s bioarchaeological work of Smith, Stager, and Avishai;
  see the site's editorial take on
  [Did Tophet sacrifice happen, and at what scale?](/editorialTakes/tophet-happened-scale-unrecoverable)
  for the weighing.
