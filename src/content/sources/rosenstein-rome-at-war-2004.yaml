summary: >
  University of North Carolina Press, 2004. The most sustained modern
  challenge to the
  [Toynbee](/sources/toynbee-hannibals-legacy-1965) account of what the
  Hannibalic War did to Italy. Rosenstein works the demography rather
  than the literary tradition, modeling how Roman farm households
  actually absorbed military service, and concludes that the damage has
  been badly overstated.

  His argument turns on who was conscripted. Rome drew its legions
  heavily from young unmarried men, whose absence a farm family could
  survive in a way it could not have survived losing its working
  householders, and the recruitment pattern therefore did not gut rural
  production the way the older account assumes. The census figures show
  recovery rather than collapse. Rosenstein reads the agrarian crisis
  of the later second century as driven by other pressures, above all
  the long overseas deployments that came after the war rather than the
  devastation during it, together with population growth pressing on
  available land.

  The disagreement with Toynbee is not about whether the war was
  costly, which neither doubts, but about whether it was the cause of
  what followed. The site treats the two as the principal competing
  readings in the
  [open question on what the war cost Rome](/openQuestions/hannibalic-war-cost-to-rome).
