bias_notes: >
  Strictly contemporary with the Carthaginian constitution he describes,
  4th-century BCE Athens looking across the Mediterranean to a polity Greek
  philosophy classed as one of the few non-Greek constitutions worth serious
  analysis. Aristotle's frame is comparative: he discusses Carthage alongside
  Sparta and Crete as a "well-ordered" mixed constitution. The account is
  schematic and idealized rather than ethnographic, Aristotle is interested
  in institutional types, not Carthaginian self-understanding, but the
  detail is precise enough that he plainly worked from informants.
