summary: >
  Aristotle devotes Politics II.11 to a sustained analysis of the Carthaginian
  constitution, identifying suffetes, the Council of 104, the senate, and the
  popular assembly, and praising the city's institutional stability. Despite
  its brevity (a few pages of Greek), the passage is the single most important
  external description of Carthaginian government we possess, fuller and
  more analytic than anything in the Roman tradition, and uniquely free of
  the Punic-Wars frame that distorts most surviving accounts. Indispensable
  for any treatment of Carthaginian institutions.
