bias_notes: >
  Varro's three-book agricultural treatise was composed in his
  old age (he was eighty) and is the earliest surviving Roman
  systematic agronomic work. The treatise is structured as
  three dialogues (on agriculture proper, on livestock, and on
  estate-based animal-and-poultry husbandry) and draws on a
  substantial body of prior agronomic literature that Varro
  names systematically in his opening source-list (1.1.7-11).
  That source-list is the principal surviving documentary
  evidence for the network of earlier Greek and Carthaginian
  agronomic authors whose work entered the Roman tradition
  through the late Republic. Varro is the proximate Latin
  vehicle through which the Mago tradition reaches Columella
  and Pliny.
