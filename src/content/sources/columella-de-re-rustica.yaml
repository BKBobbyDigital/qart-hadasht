bias_notes: >
  Columella's twelve-book agricultural treatise is the most
  extensive surviving Latin agronomic work and the single
  largest preserved body of Mago-derived material. Columella
  himself was an estate owner in southern Italy who wrote from
  practical experience; the treatise is technically sophisticated
  and treats agronomy as a serious intellectual field rather than
  as a gentleman's pastime. His extensive Mago citations are the
  principal channel through which the specific technical
  content of the Carthaginian agronomic tradition reaches
  modern reconstructions.
