summary: >
  Columella's *De Re Rustica*, written around 60 CE, is the most
  extensive surviving Latin agronomic work: twelve books
  treating viticulture, olive cultivation, grain agriculture,
  cattle and sheep husbandry, beekeeping, gardens, and estate
  management with a depth and technical precision unmatched in
  the prior Roman tradition. The treatise's structure parallels
  the breadth of [Mago's twenty-eight Punic books](/sources/mago-treatise),
  and Columella cites Mago by name dozens of times across the
  work as one of the foundational authorities.

  For the site, Columella is the single most important
  surviving vehicle for Mago's technical content. The Mago
  fragments that modern scholarship works from are
  preponderantly Columella's citations: on vine training,
  olive grafting, soil typology, beekeeping conventions, and
  estate organization. Where Pliny preserves the
  transmission-history context for Mago's preservation,
  Columella preserves the technical material itself in greater
  quantity than any other surviving source. The Mago Columella
  cites is the Mago modern Punic studies has.

  Columella's broader importance to the site extends to his
  documentation of late-Republican-and-early-Imperial Roman
  estate agriculture, the institutional configuration that
  Mago's Carthaginian framework had documented a century or
  more earlier and that Roman estate-owners had subsequently
  adopted. The Roman estate agriculture Columella documents
  is, in significant part, the Carthaginian estate
  agriculture Mago had documented, transmitted through the
  intervening Latin and Greek tradition.
