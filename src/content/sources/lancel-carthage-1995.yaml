summary: >
  Translated from the 1992 French edition. Lancel, who directed excavations at
  Carthage for decades, anchors his narrative in archaeology in a way few
  general histories do. Particularly authoritative on the topography of the city,
  the harbors, the Tophet, and on identifying battlefield sites including the
  vexed location of Zama.
