summary: >
  A military history of the three Punic Wars from the perspective of an
  established specialist in Roman warfare. Goldsworthy is meticulous on
  battlefield tactics, the structure and logistics of armies on both sides,
  and the operational decisions that shaped each campaign. Less interested
  in the wider Carthaginian world than Miles or MacDonald — this is
  consciously a war book — but for any claim about how a battle was fought,
  or how an army was constituted, Goldsworthy is among the first modern
  works to consult. Particularly strong on Cannae, the recovery of Roman
  manpower after Cannae, and the Iberian campaign that brought Scipio to
  prominence.
