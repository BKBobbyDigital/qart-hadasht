bias_notes: >
  Xella's monograph on Baal Hammon is the canonical modern study
  of the deity, working through the inscriptional, iconographic,
  and literary evidence with characteristic Italian-school
  philological care. Xella has been one of the principal Italian
  voices on Phoenician-Punic religion since the 1970s and a
  long-standing collaborator of Sabatino Moscati and Sergio
  Ribichini in the cemetery-hypothesis tradition on the Tophet
  question. The site reads Xella's work on Baal Hammon as
  authoritative on the deity's identity, attestation patterns,
  and iconographic-formulaic vocabulary; on the Tophet question
  specifically, his position is part of the cemetery-hypothesis
  reading that the site treats as one of the principal competing
  positions rather than as the reading the surviving evidence
  best supports.
summary: >
  The canonical modern monograph on Baal Hammon, published in the
  Collection de l'École française de Rome series. Xella reconstructs
  the deity's identity from the inscriptional record (the formulaic
  *l-bʿl ḥmn ʾdn* "to Lord Baal Hammon" dedications across the
  Tophet corpus, the variant epithets, the Levantine background),
  traces his iconography across Phoenician and Punic material
  culture, and analyzes the Greco-Roman interpretatio with Kronos
  and Saturn that shaped the literary tradition's framing. The
  book is the standard reference for Baal Hammon and is cited
  across subsequent scholarship on Punic religion.

  Xella's broader contribution to the Italian Phoenician-Punic
  studies tradition includes co-editorial work on the *Dictionnaire
  de la civilisation phénicienne et punique* (1992, with Krings)
  and the 2013 supplement to *Studi Epigrafici e Linguistici*
  on the Tophet question, the latter of which was the principal
  Italian-school response to the Smith-Stager bioarchaeological
  work. The site cites Xella's Baal Hammon monograph as the
  principal modern scholarly source for the deity and references
  his Tophet-question contributions as part of the cemetery-
  hypothesis tradition rather than the bioarchaeologically-
  modified position the site itself takes.
