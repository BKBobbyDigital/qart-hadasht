bias_notes: >
  A late epitome (selective abridgement) of a now-lost universal history
  written by Pompeius Trogus in the Augustan period. Justin's date is itself
  uncertain — anywhere from the 2nd to 4th century CE. The text is therefore
  a digest of a source we cannot check, written centuries after the events
  and shaped by the epitomator's interests as well as Trogus's. Useful but
  to be handled carefully: where Justin agrees with better-attested sources
  he confirms; where he disagrees, the disagreement may be due to Trogus,
  to Justin's selection, or to genuine alternative tradition.
