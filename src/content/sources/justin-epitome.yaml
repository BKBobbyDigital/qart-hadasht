critical_read:
  what_it_gives: >
    Carthaginian material that survives nowhere else, chiefly in books 18–19:
    the foundation story, the Malchus episode, the Magonid ascendancy, the
    early treaties. It also carries a tradition on the 195 denunciation that
    runs against Livy's, and the anecdote of Hannibal's restraint among
    captive women (32.4). Where the site cannot check him, it usually cannot
    check anyone.
  what_it_argues: >
    Less an argument than a selection. Justin abridged Pompeius Trogus's
    Augustan universal history at some point between the second and fourth
    centuries, keeping what struck him as memorable, so the text is shaped
    twice: by Trogus's Gallo-Roman, notably un-Romanocentric frame, and by
    an epitomator with an eye for the striking episode.
  dependence: >
    Everything rests on Trogus, who cannot be checked, and Trogus rests on
    Hellenistic writers who cannot be identified. Agreement with another
    source may mean a shared Hellenistic origin rather than confirmation.
    Disagreement is the harder case: it may preserve a genuine alternative
    tradition, or come from Trogus, or be an artifact of compression, and
    the site does not usually treat a Justin variant as decisive either way.
public_domain_translation:
  translator: John Selby Watson
  year: 1853
  url: https://www.attalus.org/translate/justin1.html
summary: >
  An epitome of Pompeius Trogus's Historiae Philippicae, organized around
  the rise and succession of empires. Book 18 is the principal preserved
  account of the Tyrian foundation legend of Carthage, Elissa/Dido fleeing
  Tyre, the Byrsa stratagem, the city's foundation. Books 19–22 cover the
  Sicilian Wars and Agathocles. Justin/Trogus preserves traditions independent
  of the Roman annalistic mainstream, including elements of the foundation
  story that the Romans (especially Virgil) reshaped. For the foundation
  period, Justin is irreplaceable.
