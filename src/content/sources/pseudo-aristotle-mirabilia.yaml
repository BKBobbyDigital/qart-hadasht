summary: >
  A compilation of about 180 short reports of marvels, natural and
  human, drawn from across the Greek world and its fringes. The
  collection keeps its conventional English title, which is why the
  spelling is not Americanized here. Several entries bear on the
  Phoenician and Punic west, including material on the Melqart cult
  cited elsewhere on the site.

  Entry 85 describes a "Heracleian road" running from Italy through the
  lands of the Celts and Ligurians to Iberia, along which travelers,
  Greek or native, were protected by the peoples through whose country
  it passed. If the entry is as early as its likely source suggests, it
  shows that a tradition of Heracles's route over the western mountains
  existed before Hannibal marched it, which bears on whether the Barcid
  use of that tradition invented a story or exploited an existing one.
  See [The march as a labor](/narratives/hannibal-and-heracles).
