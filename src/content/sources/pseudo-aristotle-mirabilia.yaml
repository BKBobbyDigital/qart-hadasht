bias_notes: >
  Not by Aristotle, and not a single work so much as a collection of
  wonders gathered from earlier writers over a long period, probably
  reaching its present form in the Hellenistic age. Individual entries
  cannot be dated with confidence, and the western Mediterranean
  material is often thought to derive from Timaeus, which would place
  it before the Second Punic War. Each item has to be judged on its own.
