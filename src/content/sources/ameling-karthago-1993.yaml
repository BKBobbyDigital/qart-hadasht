summary: >
  A study of the Carthaginian military, state, and society that
  complicates the caricature of Carthage as a merchant republic which
  hired all its fighting. Ameling argues for a genuine citizen-military
  tradition and a functioning polis behind the commercial face, with
  Carthaginian citizens serving and the state organized as more than a
  trading company with mercenaries attached. The book bears on how this
  site characterizes the Carthaginian state in the debate over the
  nature of its empire: it is the principal counterweight to any reading
  that dissolves Carthage into a stateless commercial network, and it
  sits alongside the site's editorial take on that question.
