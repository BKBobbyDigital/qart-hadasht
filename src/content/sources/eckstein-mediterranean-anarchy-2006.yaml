summary: >
  The principal answer to
  [Harris](/sources/harris-war-and-imperialism-1979) (Berkeley:
  University of California Press, 2006). Eckstein brings the realist
  theory of international relations to the ancient Mediterranean and
  argues that Rome was not unusually aggressive. The system it belonged
  to had no law above the states in it, little diplomacy capable of
  settling disputes, and a set of powers (Carthage, the Hellenistic
  kingdoms, the Greek leagues, the peoples of Italy) that were all
  militarized, all expansionist, and all acting under the constant
  threat of each other. What distinguished Rome, on this account, was
  not its appetite for war but its ability to absorb allies and
  manpower and so to survive the competition.

  The reading matters for Carthage because it refuses to treat Rome as
  the only actor with a strategy. Carthage in the 260s was a
  militarized hegemon of the same system, and its garrison at Messana
  and its build-up at Agrigentum are moves in the same game as Rome's
  crossing and escalation. The site uses Eckstein for the pressure that
  proximity put on both powers once the buffers between them were gone,
  in its
  [editorial take on what caused the First Punic War](/editorialTakes/fpw-causation).
