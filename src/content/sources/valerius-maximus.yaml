bias_notes: >
  Not a history but a handbook of examples for speakers, arranged by
  moral heading, with Roman cases first and foreign ones appended at the
  end of each chapter. Valerius takes his material from earlier writers,
  Livy and Cicero above all, and shapes each item to the virtue or vice
  it is filed under. Where he preserves a detail no historian gives, the
  detail may come from a lost source or from the rhetorical tradition
  that shaped the anecdote, and there is usually no way to tell which.
summary: >
  A collection of about a thousand anecdotes, grouped under headings
  such as courage, cruelty, gratitude and anger, made for the use of
  orators. Two items in the chapter on anger (9.3) belong to the Barcid
  material. In the first, Hamilcar, looking at his four sons of
  childhood age, said he was rearing that number of lion cubs for the
  ruin of Rome's empire; in the second, Hannibal, at nine years old and
  holding the altar while his father sacrificed before taking the army
  over to Iberia, swore to be Rome's bitterest enemy as soon as his age
  allowed. The oath is the story Polybius has Hannibal tell Antiochus
  (3.11); Valerius is a late witness to it, and to the lion-cub saying,
  which no earlier surviving text gives. The four sons are a problem:
  three are known to history, and this is the only ancient statement of
  a number. See the [open question on the
  oath](/openQuestions/hamilcar-oath-tradition).

  A third item belongs to the Punic-treachery tradition. In the chapter
  on stratagems, Valerius tells how Claudius Nero slipped his force into
  his colleague's camp before the Metaurus so that Hasdrubal would not
  learn he faced two consuls until both had beaten him, and sums it up:
  that Punic cunning, infamous throughout the whole world, was outplayed
  by Roman foresight (7.4.4). The phrase is quoted in modern accounts as
  evidence of the stereotype, and it is, but it is worth noting where it
  sits. The stereotype is invoked to describe a Roman deception.

  The same chapter runs the other way a few entries later. Among the
  foreign examples Valerius turns to Cannae and explains the defeat:
  such was Punic valor, equipped with tricks and treachery and deceit,
  that the Romans were deceived rather than beaten (7.4.ext.2). One
  chapter therefore uses Punic cunning to praise a Roman stratagem and
  to subtract a Carthaginian victory, which is the stereotype doing
  the work it was for.

  One more item is the sharpest statement of the stereotype anywhere
  in the collection, and it is about a Spartan. Opening the foreign
  examples of his chapter on treachery, Valerius announces that he
  will now contemplate the fountainhead of perfidy itself, *ipsum
  fontem perfidiae*, and turns to Carthage. The Carthaginians, he
  says, had had excellent service from Xanthippus the Lacedaemonian
  in the First Punic War and had captured Atilius Regulus with his
  help; then, pretending to convey him home, they drowned him at sea.
  What were they after with so great a crime, he asks, unless it was
  that no partner in their victory should survive? The memory of it
  survives anyway, and to their disgrace, of a man they could have
  left unharmed without any loss of glory (9.6.ext.1). Polybius, two
  centuries earlier and the main source for the whole episode, has
  Xanthippus sail away safely, and then says there is another account
  of his departure which he will give on a more suitable occasion,
  and never does (1.36.1–4). See [Xanthippus](/people/xanthippus).
