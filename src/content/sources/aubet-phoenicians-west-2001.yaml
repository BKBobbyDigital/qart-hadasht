summary: >
  The standard scholarly synthesis of Phoenician expansion into the western
  Mediterranean — the context out of which Carthage grew. Aubet, an
  archaeologist who has excavated key Phoenician sites, integrates Levantine
  archaeology with the colonial record at Gades, Motya, Sardinia, Ibiza,
  and Carthage itself. The book is essential for the period before
  Carthage's rise to dominance — roughly the 9th to 6th centuries BCE —
  and for situating Carthage as one Phoenician colony among many before its
  emergence as a metropolitan power. Translated from Spanish; the second
  edition is substantially expanded over the first.
