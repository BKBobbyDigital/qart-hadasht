bias_notes: >
  Bonnet's monograph on Astarte is the canonical modern study of
  the goddess, covering her attestation across the Phoenician
  homeland, the western Mediterranean, the Aegean, and the
  Greco-Roman interpretatio with Aphrodite and Venus. Bonnet,
  Belgian by training but writing in French and in the broader
  continental European scholarly tradition, has been one of the
  principal voices on Phoenician religion since the 1980s and
  the most consistent voice on the Astarte-Tanit relationship
  specifically. Her position is broadly that the rise of Tanit
  at 5th-century-BCE Carthage was a process of theological
  differentiation in which Astarte was partly displaced from
  primary civic attestation but retained in personal-religious
  and theophoric-name practice. The site reads Bonnet's work as
  authoritative on Astarte and as one of the principal modern
  treatments of the Tanit-Astarte question.
summary: >
  The standard modern monograph on the goddess Astarte, published
  in the Contributi alla Storia della Religione Fenicio-Punica
  series. Bonnet works through the goddess's attestation across
  the Phoenician homeland (Tyre, Sidon, Byblos), the Cypriot
  context (Kition, Idalion), the western Mediterranean (Carthage,
  Punic Sicily, Sardinia, the Pyrgi Etruscan dedication), the
  Greco-Roman interpretatio with Aphrodite and Venus, and the
  Roman-period continuation. The methodological emphasis is on
  the inscriptional and iconographic record over the literary
  tradition, in keeping with the broader continental European
  approach to Phoenician religion.

  For the site, Bonnet's work is the principal reference on
  Astarte's attestation history and on the Astarte-Tanit
  relationship at Carthage. Her reading, that Astarte was
  partly displaced by the 5th-century-BCE rise of Tanit but
  retained in personal-religious practice and in the theophoric-
  name evidence, is one of the three principal modern readings
  of the Astarte-Tanit transition the Astarte and Tanit deity
  pages weigh. Her broader methodological work on Phoenician
  religion in the *Manuel de recherche* (Krings ed., 1995) and
  in subsequent publications including *Les enfants de Cadmos*
  (2015) on the Phoenician colonial diaspora is also drawn on
  across the site's treatment of the homeland-colonial religious
  network.
