summary: >
  Edited volume (Wiley-Blackwell, 2011) of twenty-seven
  specialist chapters covering the three Punic Wars and the
  societies that fought them. It is the standard single-volume
  entry point to the current state of scholarly debate: each
  chapter is a commissioned survey by a specialist in that
  sub-question, with bibliography, and the volume as a whole
  maps where the field agrees, where it divides, and where the
  evidence runs out.

  The coverage extends well beyond campaign narrative. Chapters
  treat Carthaginian state and society before and between the
  wars, the economies that sustained the fighting, manpower and
  military institutions on both sides, the wars' religious
  dimensions, and the destruction of 146 BCE and its aftermath.
  Contributors include several scholars this site cites
  independently, among them
  [Louis Rawlings](/sources/rawlings-war-in-italy-2011) (whose
  chapter on the war in Italy is cataloged separately here)
  and the editor, whose monographs on
  [Carthaginian society](/sources/hoyos-carthaginians-2010),
  [the Mercenary War](/sources/hoyos-truceless-war-2007), and
  [the outbreak of the wars](/sources/hoyos-unplanned-wars-1998)
  anchor much of this site's modern apparatus.

  On this site the Companion functions as the general reference
  behind the war-period synthesis: where a period page or
  warfare theme states the current scholarly consensus without
  attributing it to a single monograph, the Companion is
  usually the place that consensus is most accessibly laid out.
