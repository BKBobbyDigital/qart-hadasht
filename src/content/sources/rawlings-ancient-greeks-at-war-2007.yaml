summary: >
  Survey monograph (Manchester University Press, 2007) of
  Greek warfare from the Mycenaean period through the death
  of Alexander, c. 1600–323 BCE. The book is structured around
  thematic chapters (the warrior in society, the development
  of the hoplite phalanx, naval warfare, mercenaries and the
  monetarization of war, siege warfare, the rise of the
  professionalized armies of the fourth century) rather than
  a strict campaign-by-campaign narrative.

  For the site, the book is useful primarily as the standard
  reference treatment of Greek military institutions that
  Carthage interacted with across centuries of contact: the
  Sicilian Greek armies Carthage fought from the sixth through
  fourth centuries BCE, the mercenary recruitment pools
  Carthage drew on for its own forces, the siegecraft
  traditions that shaped both Greek operations against
  Carthaginian-held Sicilian cities (Motya, Lilybaeum) and
  Carthaginian sieges of Greek ones (Selinous, Himera,
  Akragas), and the fourth-century Hellenistic military
  transformation that Carthage participated in on its own
  terms. Rawlings is particularly strong on the mercenary
  economy of the late classical period, which is the
  recruitment context behind both Carthaginian and Sicilian
  military operations across the
  [Sicilian dialectic period](/narratives/the-sicilian-dialectic).

  The monograph is also methodologically useful: Rawlings
  pushes against the once-standard reading that distinguished
  "citizen" Greek warfare sharply from "mercenary" Hellenistic
  warfare, which is the comparative-anachronism the site's
  [carthaginian-army-institutionally-mixed editorial take](/editorialTakes/carthaginian-army-institutionally-mixed)
  pushes against on the Carthaginian side.
