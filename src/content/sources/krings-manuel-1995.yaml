bias_notes: >
  The standard multi-author reference handbook for Phoenician and
  Punic studies, published in the Brill Handbook of Oriental
  Studies series. Krings edited the volume; the chapter-level
  contributions are by Sznycer, Ribichini, Xella, Bondì, Sader,
  and other principal voices in the field, predominantly from the
  Italian and French scholarly traditions. The handbook is the
  natural single reference for the state of the field as of the
  mid-1990s and remains the de facto starting point for
  continental European scholarship on most Punic topics. Its
  Anglophone equivalents — Hoyos's *The Carthaginians* (2010) and
  Miles's *Carthage Must Be Destroyed* (2010) — are narrower in
  scope and more sympathetic to the Greco-Roman literary tradition's
  framing; the Krings handbook is more philologically and
  archaeologically oriented and more skeptical of the literary
  tradition. The site relies on both bodies of work.
summary: >
  The principal multi-author French-language handbook for
  Phoenician and Punic studies, edited by Véronique Krings and
  published in the Brill Handbook of Oriental Studies series in
  1995. The volume's chapter-level contributions cover the
  history of the field, the source base (literary, inscriptional,
  archaeological, iconographic), the geographical and chronological
  framework of the Phoenician-Punic world (homeland, colonial
  network, post-Carthaginian continuation), and the major topical
  areas (religion, language, economy, politics, art, daily life)
  with chapters by the principal Italian, French, Belgian, and
  Spanish scholars working in the field — Sznycer on language,
  Ribichini and Xella on religion, Bondì on history, Sader on
  the homeland, and others.

  The site treats the Krings *Manuel* as the principal continental
  European reference work and cites it across multiple surfaces:
  the punic-religion theme draws on the Ribichini-Xella chapters;
  the punic-language-and-script theme draws on Sznycer; the punic-
  identity theme draws on the historiographical sections. The
  handbook's chapter structure makes it useful both as a topic-
  level reference and as a guide to the deeper specialist
  literature in each sub-field.

  Krings's own broader contribution to the field includes work on
  the historiography of Carthaginian studies (her own thesis
  treated the European-modern reception of Carthage) and on the
  Phoenician-Punic Mediterranean as an interconnected system
  rather than as a peripheral colonial network. The site's overall
  framing of Carthage as part of a wider Phoenician-Mediterranean
  system rather than as an isolated North African polity is
  consistent with the Krings-edited handbook's broader
  methodological approach.
