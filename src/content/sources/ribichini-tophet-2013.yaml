bias_notes: >
  Ribichini is the principal living voice of the Italian cemetery-
  hypothesis tradition on the Tophet question and the most
  consistent critic across the 1980s through 2010s of the
  systematic-sacrifice reading. His 2013 contributions to the
  Xella-edited *The Tophet in the Phoenician Mediterranean*
  supplement (the Italian-school venue for responding to the 2011
  Smith-Stager bioarchaeological work) include the principal
  methodological reply: that the bioarchaeological dental-
  development methods are themselves contested, that the sample
  sizes are too small to support the conclusions drawn, and that
  the underlying source-criticism case against the systematic-
  sacrifice reading remains intact even if some deposits are of
  older children than the strict cemetery hypothesis would predict.
  The site reads Ribichini's position as a serious scholarly
  reply that the bioarchaeology has not decisively closed off,
  but takes the position that the older-child cohort the
  bioarchaeology identifies cannot be absorbed into the pure-
  cemetery reading as Ribichini's framing would require.
summary: >
  Ribichini's contributions to the 2013 *Tophet in the Phoenician
  Mediterranean* supplement (Studi Epigrafici e Linguistici 29-30)
  are the principal Italian-school methodological response to the
  Smith-Stager-Avishai bioarchaeological work of 2011. The
  arguments: that the dental-cementum and tooth-development
  techniques are not as decisive as the bioarchaeology claims;
  that the sample sizes drawn from the Carthage Tophet urns are
  insufficient to support the conclusions about age-at-death
  distributions; that the underlying critique of the
  literary tradition (the Greco-Roman hostile-source framing
  remains a methodologically suspect single body of evidence)
  remains intact; and that the wider Italian-school case for the
  cemetery reading (built across decades of philological,
  inscriptional, and comparative-religion work by Moscati, Xella,
  Ribichini, and others) should not be displaced by one new
  bioarchaeological technique.

  Ribichini's broader contribution to Italian Phoenician-Punic
  studies is substantial: his *Poenus advena: Gli Dei Fenici e
  l'Interpretazione Classica* (1985) is the standard treatment
  of how Greek and Roman observers interpreted Phoenician deities
  through Greco-Roman frameworks; his contributions to the
  Krings-edited *Manuel de recherche* (1995) cover Phoenician-
  Punic religion and ritual practice. The Tophet position is one
  part of his wider methodological program, which the site
  characterizes as careful and substantively engaged rather than
  merely defensive.

  The site's editorial take on the Tophet question weighs
  Ribichini's position explicitly. The position is rejected as the
  principal description (the bioarchaeology's older-child cohort
  is the structural difficulty the cemetery reading does not
  resolve), but the site preserves the Italian-school case as a
  serious reading that any honest treatment of the evidence must
  engage rather than dismiss.
