bias_notes: >
  Ribichini has been, since the 1980s, one of the principal Italian
  voices skeptical of the sacrificial reading of the Tophet, in the
  tradition of Sabatino Moscati. That tradition treats the Greek and
  Roman accounts as a hostile frame laid over an unfamiliar Phoenician
  rite and resists letting any single new method settle a question that
  also turns on philology and the history of religion. The site weighs
  that caution seriously while holding that the inscriptions describe
  an offering rather than a burial.
summary: >
  Ribichini's contributions to the 2013 volume *The Tophet in the
  Phoenician Mediterranean* (Studi Epigrafici e Linguistici 29–30),
  edited by Paolo Xella, which gathered the main positions on the tophet
  precincts across the Phoenician and Punic world. The volume appeared
  in the same year as the sharpest exchange over the cremated remains
  from Carthage, between the
  [Schwartz team](/sources/schwartz-tophet-2010) and the
  [Smith team](/sources/smith-tophet-2011).

  Ribichini's broader contribution to Phoenician and Punic studies is
  substantial: his *Poenus advena: Gli dei fenici e l'interpretazione
  classica* (1985) is a standard treatment of how Greek and Roman
  observers interpreted Phoenician deities through their own frameworks,
  and he wrote on Phoenician and Punic religion for the Krings-edited
  *Manuel de recherche* (1995). His skepticism about the Tophet belongs
  to that wider program of reading classical testimony against its
  framing.

  The site's position on the Tophet is set out in the
  [editorial take](/editorialTakes/tophet-happened-scale-unrecoverable),
  where the Italian skeptical tradition appears in its strongest modern
  form, the predominantly funerary reading of Schwartz and colleagues.
