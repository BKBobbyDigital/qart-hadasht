title: "The Perception of Carthage in Classical Greek Historiography"
author: Pedro Barceló
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 1994
  precision: exact
summary: >
  Journal article (Acta Classica 37, 1994, pp. 1–14) examining how
  Carthage was constructed as an object of Greek historical thought,
  from Herodotus and the Sicilian-Greek tradition through Polybius,
  and how the resulting frame was inherited by Latin historiography.
  Barceló argues that the "Carthage" of the surviving sources is
  substantially a Greek conceptual artifact, with implications for any
  modern reconstruction that takes the literary tradition at face value.
  Important for thinking about the source-bias problem this encyclopedia
  has to navigate.
