bias_notes: >
  The text presents itself as a Greek translation of a Punic original — the
  account of Hanno's voyage along the Atlantic coast of West Africa, said
  to have been inscribed on a stele in the temple of Baal (or Kronos, in
  Greek interpretatio) at Carthage. The translation is undated; the original
  inscription, if real, was 5th-century BCE. The text's authenticity has
  been debated since antiquity. Most modern scholars accept it as broadly
  genuine — a real Punic geographic record, transmitted via Greek — though
  with corruptions in the place-names and animals that have accumulated in
  transmission. Whether genuine in detail or not, it is the closest thing
  we have to a Punic-authored text surviving from Carthage's classical period.
