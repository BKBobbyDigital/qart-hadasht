  url: https://www.metmuseum.org/art/metpublications/The_Periplus_of_Hanno_a_voyage_of_discovery_down_the_West_African_coast_by_a_Carthaginian_admiral_of_the_fifth_century_B_C
summary: >
  A short text — under a thousand words — recording a Carthaginian
  expedition along the Atlantic coast of Africa, founding colonies and
  reaching as far as (most likely) the Gulf of Guinea or the Cameroon
  highlands. The voyage is dated to the 5th century BCE. The text describes
  fortified outposts, encounters with peoples and animals, fires seen from
  the sea, and a return prompted by exhausted supplies. Specifics — including
  the famous "gorillai" — are uncertain in identification, but the document
  is unique: a near-contemporary Carthaginian record of Carthaginian activity,
  not a Greco-Roman description from outside.
