summary: >
  Forty-six paired biographies (Greek and Roman, presented in matched pairs
  with comparative essays). Several Lives are central to Carthaginian
  history: Fabius Maximus and Marcellus (the Italian campaign of the Second
  Punic War from the Roman side), Aemilius Paullus (Cannae, where his
  father fell), and especially Cato the Elder (the architect of the Roman
  case for the Third Punic War, including the famous "Carthago delenda est"
  formulation). Plutarch's Lives of Pyrrhus and Timoleon are also relevant
  for earlier Mediterranean conflict involving Carthage.
