bias_notes: >
  Greek biographer writing under Trajan, drawing extensively on Polybius and
  on now-lost Hellenistic sources. The Lives are biographies, not histories:
  shaped by moral and characterological aims, with anecdotes selected for
  illustrative power rather than strict reportage. Plutarch's distance from
  his Roman subjects is real, and where he and Polybius overlap, Polybius
  is generally to be preferred. Where Plutarch preserves material absent
  from elsewhere — sayings, domestic details, anecdotes about Roman public
  life — the material may be authentic transmission from lost intermediaries
  or may be Plutarchean elaboration; usually impossible to tell.
