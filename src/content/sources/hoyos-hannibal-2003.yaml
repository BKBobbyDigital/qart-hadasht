slug: hoyos-hannibal-2003
title: "Hannibal's Dynasty: Power and Politics in the Western Mediterranean, 247–183 BC"
author: Dexter Hoyos
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2003
  precision: exact
summary: >
  A scholarly history of the Barcid family's command of Carthaginian
  political and military affairs from Hamilcar's emergence in the First
  Punic War to Hannibal's death in 183 BCE. Hoyos treats the Barcids as a
  political dynasty operating within Carthaginian factional politics rather
  than as autonomous warlords, and gives sustained attention to the Iberian
  command and to Hannibal's career after Zama as suffete and exile. Strong
  on military analysis and on Carthaginian politics; complemented by Hoyos's
  later The Carthaginians (2010) for institutional and cultural context.
