summary: >
  Modern scholarly biography arguing that Hannibal Barca should be understood
  primarily as a Hellenistic-era general — culturally, militarily, and politically —
  rather than through the older "alien Semitic enemy of Rome" frame. Hoyos draws
  on Polybius, Livy, and the broader scholarship to reconstruct Hannibal's
  campaigns and the Barcid family's role in Carthaginian politics. Strong on
  military analysis; cautious on Hannibal's interior life, where sources fail.
