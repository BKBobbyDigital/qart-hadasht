summary: >
  The thirty-seven-book encyclopedic compilation by Pliny the
  Elder, completed in 77 CE and the largest single surviving
  Roman work of its kind. The *Natural History* is the principal
  surviving compendium of Roman technical and natural-historical
  knowledge as of the late 1st century CE, drawing on hundreds
  of earlier Greek and Latin sources that Pliny names
  systematically.

  For the site, the *Natural History*'s most important single
  passage is Book 18.5, which preserves the 146 BCE Roman
  senatorial decree ordering the Latin translation of
  [Mago's twenty-eight-book agricultural treatise](/sources/mago-treatise)
  — the only Carthaginian intellectual work systematically
  preserved in the Greco-Roman tradition. The decree's specific
  language (the assignment to Decimus Junius Silanus, the
  treatment of the Carthaginian libraries as gifts to the
  Numidian allies) is the principal evidence for how the Roman
  senatorial class understood the post-destruction disposition
  of Carthaginian intellectual culture. Pliny's characterization
  of Mago at *NH* 18.22-23 as *parens rusticationis* ("the
  father of country science") is the most striking Roman
  acknowledgment of a Carthaginian intellectual figure in the
  surviving literature.

  Beyond the Mago material, Pliny preserves substantial citations
  of earlier agronomic authorities (Cato, Varro, Cassius
  Dionysius, Columella, the Mago tradition through these
  intermediaries) and of Greek and Phoenician technical and
  geographical writers, including material attributed to
  Hanno's Periplus and other Carthaginian sources. The site
  cites Pliny for the Mago transmission, the surviving Punic
  technical material the *NH* preserves at second hand, and the
  Roman imperial-period framing of Carthaginian cultural
  inheritance.
