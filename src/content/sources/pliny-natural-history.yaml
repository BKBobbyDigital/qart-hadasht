bias_notes: >
  Roman encyclopedist writing under Vespasian and Titus. The
  *Natural History* is a vast compilation of natural-historical,
  technical, and ethnographic material drawn from prior Greek
  and Roman sources; for Carthaginian matters, Pliny is at
  considerable temporal distance from the events and works
  through derivative material. His value for the site is
  twofold: as the principal preserver of the 146 BCE Roman
  senatorial decree on Mago's treatise (*NH* 18.5 and 18.22-23)
  and as a rich source of citations of earlier Latin and Greek
  agronomic writers, including Mago, that no longer survive
  independently. Pliny's framing is straightforwardly Roman-
  imperial, the standpoint from which Carthage was a defeated
  rival whose useful technical contributions had been
  appropriately absorbed into Roman knowledge, but his
  preservation of specific passages and decree-language gives
  the site direct evidentiary access it would otherwise lack.
