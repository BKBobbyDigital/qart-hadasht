slug: kai
title: Kanaanäische und Aramäische Inschriften (KAI)
author: Herbert Donner and Wolfgang Röllig
type: inscription
is_primary: true
language: phoenician
date_composed:
  value: 1962
  precision: year
  notes: >
    First edition published 1962-1964 in three volumes (Wiesbaden:
    Harrassowitz). Successive editions through the 2002 fifth edition
    revised readings, expanded the corpus, and updated the bibliography.
    The fifth edition is the current standard reference.
bias_notes: >
  KAI is a selective scholarly corpus rather than a comprehensive one;
  Donner and Röllig included the inscriptions they judged most important
  for philological, historical, or religious purposes. The selection is
  defensible and is the de facto canon of "the inscriptions every
  Phoenician-Punic specialist knows," but a question that turns on a
  fragmentary or obscure inscription may need the underlying CIS or
  site-corpus publications. Editorial readings are 20th-century
  philological judgments and have themselves been refined in later
  scholarship.
summary: >
  The standard modern scholarly corpus of Northwest Semitic inscriptions,
  published by Donner and Röllig at Harrassowitz from 1962 forward. KAI
  collects, transcribes, translates (into German), and annotates the
  principal Phoenician, Punic, Neo-Punic, Old Aramaic, Imperial Aramaic,
  Moabite, and related inscriptions, with extensive philological apparatus
  and bibliography. The corpus is selective rather than exhaustive — it
  publishes the inscriptions Donner and Röllig judged most important for
  philological and historical purposes — but it is the working reference
  through which most Phoenician-Punic inscriptions are cited in
  contemporary scholarship.

  When the encyclopedia cites "KAI 14" (the Eshmunazar II Sarcophagus) or
  "KAI 69" (the Marseille Tariff) or "KAI 277" (the Pyrgi Tablets), it is
  citing a specific inscription by its standard KAI number. The underlying
  primary evidence is the inscribed object; KAI is the philological
  apparatus through which the modern reader accesses it.

  The Phoenician-Punic section of KAI is the single most-cited body of
  inscriptional evidence in Punic studies and the principal published
  reference for the Tophet *molk* formula corpus, the votive-dedication
  formulae, the Punic-language funerary epitaph tradition, the few
  surviving Punic civic texts (the Marseille and Carthage Tariffs), and
  the bilingual Phoenician-Greek inscriptions that anchor the
  philological reconstruction of Punic vocabulary and syntax. For
  Carthaginian religious practice in particular, KAI is the body of
  evidence the Greco-Roman literary tradition does not preserve and
  cannot substitute for.

  KAI substantially supplements (and for the most-cited inscriptions
  effectively supersedes) the earlier CIS publication. For comprehensive
  coverage of any particular site or genre, the working scholar combines
  KAI with CIS and with site-specific corpora.
