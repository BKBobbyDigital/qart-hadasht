summary: >
  Short paper published in *Nature* (Vol. 75, pp. 10–11, November
  1906) using the solar eclipse witnessed by
  [Agathocles](/people/agathocles)'s fleet on the second day of
  the
  [African crossing](/narratives/agathocles-invasion-of-africa)
  as an astronomical constraint on the expedition's position.
  The eclipse is preserved by Diodorus 20.5.5 in narrative
  detail (the soldiers terrified, stars appearing in many
  places, Agathocles reassuring his men that the omen favored
  the Greeks rather than the Carthaginians); modern
  astronomical back-calculation places it on 15 August 310 BCE,
  with the path of totality crossing the central Mediterranean
  between Sicily and the African coast.

  Cowell worked the problem from the astronomical side: given
  that the fleet witnessed totality rather than partial eclipse,
  the fleet's position at the moment of the event must have
  fallen within the roughly 100-mile-wide band where the Moon's
  shadow actually crossed. Combined with the literary record's
  account of the crossing's timing and direction, this lets
  the fleet's position be constrained to a substantially
  tighter margin than the narrative sources alone permit.

  Cowell (1870–1949) was a Royal Greenwich Observatory
  mathematician best known for the numerical-integration
  method (the "Cowell method," still used in orbital
  mechanics) by which he and Andrew Crommelin predicted the
  return of Halley's Comet in 1909. His work on the Agathocles
  eclipse is part of the broader Royal Greenwich tradition of
  using ancient eclipse observations as constraints on both
  ancient chronology and on the slow secular deceleration of
  Earth's rotation. The Agathocles eclipse is one of the
  canonical anchor points of that field, alongside the 763
  BCE Assyrian eclipse preserved in the eponym lists and a
  handful of other narrative-and-eclipse records preserved
  across the ancient Mediterranean and Near East. The modern
  productive period of the tradition (Robert Newton in the
  1970s, F. Richard Stephenson and Leslie Morrison through
  the 2000s) built on the kind of work Cowell's 1906 paper
  represents.
