summary: >
  The radiocarbon study that reopened the foundation-date
  question (*Mediterranea* 1, 2005, pp. 557–577, from the
  Ghent–Hamburg excavations at Bir Massouda on the
  [Byrsa](/places/byrsa) seaward slope). Animal bones from the
  earliest occupation levels yielded calibrated radiocarbon
  dates in the second half of the ninth century BCE, roughly
  835–800. That is up to two generations earlier than the
  conventional ceramic-based archaeological horizon of
  approximately 760–750 BCE, and it brings the scientific
  dating for the first time within reach of the literary
  tradition's 814 BCE foundation
  ([founding of Carthage](/events/founding-of-carthage)).

  The result matters for two debates at once. For Carthage, it
  weakens the long-standing argument that the literary date
  must be symbolic calculation because archaeology could not
  find the ninth century; the earliest strata now appear to
  reach it. For Mediterranean archaeology generally, it feeds
  the wider controversy over Iron Age absolute chronology,
  since Phoenician-colonial radiocarbon dates running earlier
  than Greek ceramic chronologies put pressure on the
  conventional dating framework itself. The dates have their
  critics, and radiocarbon calibration in this period is
  genuinely difficult; the result is best treated as moving
  the question rather than closing it.

  This site weighs the radiocarbon evidence within the
  [founding-date open question](/openQuestions/founding-when-actually),
  alongside the literary tradition and the contested
  [Douïmès Pendant reading](/sources/krahmalkov-foundation-1981).
