summary: >
  The Schwartz team's reply to Smith and colleagues in the long exchange
  over the Carthage [Tophet](/institutions/tophet) (*Antiquity* 91,
  2017, pp. 442–454, with a later corrigendum). It follows their
  original analysis ([2010](/sources/schwartz-tophet-2010)) and a first
  defense in *Antiquity* 86 (2012). Smith, Avishai, Greene and Stager
  had argued that the Schwartz team's aging of the cremated infants was
  wrong, and that the corrected ages pointed to sacrifice
  ([2011](/sources/smith-tophet-2011);
  [2013](/sources/smith-age-estimations-2013)). This article defends
  the Schwartz team's methods and their conclusion that not all of the
  Tophet's interments were the result of sacrifice.

  The exchange matters for how the site states its position. The two
  teams disagree about the ages, and the disagreement is not resolved.
  The larger lesson, which both sides' arguments expose, is that an age
  at death, however well estimated, does not by itself show how a child
  died. The site's reading is set out in the
  [editorial take on the Tophet](/editorialTakes/tophet-happened-scale-unrecoverable)
  and the history of the debate in
  [the Tophet controversy](/narratives/the-tophet-controversy).
