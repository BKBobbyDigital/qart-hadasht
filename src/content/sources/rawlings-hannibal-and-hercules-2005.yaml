summary: >
  Chapter in Louis Rawlings and Hugh Bowden (eds), *Herakles
  and Hercules: Exploring a Graeco-Roman Divinity* (Classical
  Press of Wales, 2005). Treats Hannibal's deliberate
  self-association with Hercules across the Italian campaign:
  the offerings at the Heracleion of Gades before the Italian
  expedition (Livy 21.21.9), the Alps crossing presented as a
  Heraclean labor in the surviving rhetoric, the bilingual
  Greek-Punic dedication Hannibal set up at the Lacinium
  sanctuary in southern Italy (Polybius 3.33 records its
  existence; the inscription itself does not survive), and
  the broader propaganda dimension of mobilizing the
  Heracles-Melqart syncretism to address Greek-speaking
  audiences in Italy and Sicily on terms culturally legible
  to them.

  Rawlings reads Hannibal's Hercules-association as a real
  strategic and religious project rather than as rhetorical
  decoration. The Heracles-Melqart syncretism (treated under
  the [Melqart deity page](/deities/melqart)) was a working
  cultural bridge across the Phoenician-Greek divide; Hannibal
  used it to frame his campaign in terms his potential Italian
  Greek allies could read as familiar rather than alien. The
  chapter is part of the broader 2005 Rawlings-Bowden volume,
  which surveys the Heracles cult across the Mediterranean and
  is one of the more substantive recent treatments of the
  cult's political and propagandistic uses across Greek,
  Phoenician, Roman, and Hellenistic contexts.

  Substantively the chapter supports the site's framing of
  Hannibal as an integrated cultural figure who operated
  fluently across Phoenician, Greek, and Roman religious and
  political idioms rather than as a purely Punic actor
  surprised by his Mediterranean context.
