title: "Rome, Carthage, and Numidia: Diplomatic Favouritism before the Third Punic War"
author: "Colin Bailey"
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2018
  precision: exact
summary: >
  An article in *Antichthon* 52 (2018), 43–71, that challenges the
  standard picture of Roman arbitration between Carthage and Masinissa
  in the half-century after the Second Punic War. The ancient accounts,
  above all Polybius (31.21) and Appian (*Punica* 68), describe Rome as
  consistently siding with Masinissa, and modern narratives long treated
  the Third Punic War as the end of fifty years of Roman hostility
  worked through Numidian encroachment. Bailey argues instead that Rome
  sought to maintain the territorial division imposed at the end of the
  Second Punic War through most of the inter-war period, and that
  several of its decisions actually favored Carthage.

  The site uses the article as the principal modern counterweight to the
  ancient tradition of favoritism, in the
  [claim on Masinissa's territorial seizures](/claims/masinissa-territorial-seizures-pattern)
  and the
  [editorial take on why Carthage was destroyed](/editorialTakes/destruction-not-weak-enough).
  Its title keeps the British spelling of the original.
