summary: >
  Article in *Philologus* 169.1 (2025), pp. 24–46, open access
  (doi:10.1515/phil-2024-0031), by a specialist in the Greek and Latin
  image of Gades at the University of Cádiz. It takes up the famous
  spring in the sanctuary of Heracles-Melqart at Gades, said to fail at
  high tide and fill at low tide, which [Strabo](/sources/strabo-geography)
  discusses at length through Polybius, Artemidorus, Silenus and
  Posidonius.

  The argument runs in three steps. First, [Silenus](/sources/silenus-caleacte),
  Hannibal's historian, was the earliest source for the spring, but
  Strabo's account pushes him down to a name quoted by another writer,
  and Polybius, who presents the description as his own, probably
  followed Silenus while suppressing him, as he does with the Hannibal
  historians over the Alps. Second, the spring as described may never
  have existed: Posidonius, who spent a month at Gades, found only
  ordinary wells and had to strain to connect them to the tides, and no
  surviving source mentions the Gades sanctuary at all before Silenus.
  Third, the reverse-tidal spring was most likely Silenus's invention,
  modeled on the Spring of the Sun at Siwah, which ran against the sun
  as the Gades spring ran against the moon's tides. Hannibal's detour to
  Gades before the Italian war would then be written up on the template
  of Alexander's detour to the oracle of Ammon: a sanctuary at the edge
  of the world, a marvel, and an oracle, with Heracles as the model both
  generals followed.

  Subsidiary points the site uses: Cicero's dating of Hannibal's dream
  "after the capture of Saguntum" suggests Silenus set it at the Gades
  temple, which had associations with dream oracles, before Livy moved
  it to the Ebro; Polybius's wavering between "a god" and "a hero" as
  the Alpine guide may reflect the dual identity of Heracles-Melqart;
  and Silius Italicus's scene of Hannibal watching the Ocean tides at
  Gades may echo Silenus. The author presents the invention thesis as
  increasingly plausible rather than proved, and the site treats it as a
  strong scholarly argument, set out in
  [The march as a labor](/narratives/hannibal-and-heracles) and the
  [claim on the Alexander model](/claims/hannibal-alexander-model).
