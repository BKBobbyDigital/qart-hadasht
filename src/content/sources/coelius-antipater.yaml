bias_notes: >
  Coelius matters to this site less for his own judgments than for what
  he carried. He took [Silenus](/sources/silenus-caleacte), an
  eyewitness from inside Hannibal's entourage, as a principal
  authority, and [Livy](/sources/livy-auc) in turn drew on Coelius.
  That chain is how a Hannibal-aligned account reached the Roman
  tradition at all.

  It also means the material arrives twice mediated, and by a writer
  with his own manner. Cicero judged Coelius a considerable advance on
  the bald annalists who preceded him but faulted his style, and later
  readers found him given to rhetorical heightening and to dramatic
  set-pieces. Where Livy carries a vivid Hannibalic scene that Polybius
  lacks, Coelius is the likeliest conduit, and the question of how much
  is Silenus and how much is Coelius cannot usually be settled.

  That general argument should be set against the places where Livy
  cites him by name, because in both of the clearest cases Livy is
  declining him. At the Ticinus, Coelius gave the rescue of the
  wounded consul to a slave of Ligurian birth; Livy reports it and
  prefers the version in which the consul's son saves him, on the
  ground that more authorities recorded it (21.46). At the Po, Coelius
  had Mago swim the river at once with the cavalry and the Spanish
  infantry while Hannibal took the army across at the upper fords with
  the elephants ranged in line to break the current; Livy says that
  men who know that river would scarcely credit it (21.47). So Livy is
  not a passive conduit for this material. Where we can watch him use
  Coelius, he is weighing him and saying no.
summary: >
  The first Latin historical monograph, a treatment of the Second Punic
  War alone rather than a history of Rome from the founding. Lucius
  Coelius Antipater wrote in the later second century BCE, and his work
  does not survive; it is known from citation, principally in
  [Livy](/sources/livy-auc) and [Cicero](/sources/cicero-de-divinatione).

  Its importance here is as a transmission link. Coelius took
  [Silenus of Caleacte](/sources/silenus-caleacte) as a principal
  source, and Livy used Coelius, so an eyewitness account written from
  inside Hannibal's camp passed through a Latin monograph into the
  standard Roman narrative of the war. The Carthaginian side of the
  Second Punic War survives, to the extent that it survives at all,
  largely by that route. The narrative on
  [Hannibal's historians](/narratives/hannibals-historians) follows the
  chain.
