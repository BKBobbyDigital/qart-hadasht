summary: >
  Chapter in Dexter Hoyos (ed), *A Companion to the Punic Wars*
  (Wiley-Blackwell, 2011, pp. 299–319). The standard modern
  reference chapter on the Italian theatre of the Second
  Punic War — from Hannibal's arrival in northern Italy in 218
  through the campaigns of the Italian Allied defection, the
  long stalemate after Cannae, the Metaurus, the
  Pyrrhic-style attritional warfare of the post-Cannae years,
  and Hannibal's recall to Africa in 203 in advance of Zama.

  Rawlings treats the Italian campaign as a coherent
  operational arc rather than as a series of disconnected
  episodes, with the structural question — could Hannibal
  have won by detaching Rome's Italian alliance? — running as
  a connecting thread. The chapter is methodologically careful
  about distinguishing what the sources can support from what
  modern reception has read into them, and is one of the
  better recent treatments of the difficult middle years of
  the Italian war (215–209) where the source-base thins out
  and modern narratives often collapse into highlight reels.

  The chapter is the standard scholarly reference on this
  site for any claim about the structure and trajectory of
  Hannibal's Italian campaign, alongside Goldsworthy 2003 on
  the military-operational side and Hoyos's own 2003 Hannibal
  biography on the personal-strategic side.
