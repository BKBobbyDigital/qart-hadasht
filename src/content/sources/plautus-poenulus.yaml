bias_notes: >
  A comedy, adapted from a lost Greek play called the *Karchedonios*,
  written to be laughed at by a Roman and Italian audience a few years
  after Hannibal left Italy. Nothing in it is reportage. Its value is
  that the jokes had to land, so the play preserves what a Roman
  audience in the 190s was assumed to know about Carthaginians, and it
  preserves it earlier than any surviving Roman historian. The
  characterization is also not uniformly hostile, which is itself
  evidence about how the stereotype worked.
summary: >
  The earliest surviving portrait of a Carthaginian in Latin
  literature, and the only extant Latin play with a Carthaginian
  protagonist. Hanno comes to a Greek town looking for the daughters
  stolen from him years before, and the comedy runs on his foreignness.

  The jokes are a catalog of what the audience expected. He is
  introduced as searching for his daughters "cleverly and cunningly"
  (*docte atque astu*), and the next line is the one most often
  quoted: he knows every language and conceals that he knows,
  "plainly a Carthaginian" (111–113). Seeing him arrive, a character
  asks what bird this is coming in tunics, and whether he was walked
  out of his cloak at the baths, to which the answer is that his face
  is Punic (975–977); his slaves are recognized as foreign because
  they walk about with rings in their ears (978–981). Insults
  elsewhere reach for Sardinian fleeces, salt fish and garlic, the
  cargo a Carthaginian merchant was expected to carry.

  Two things in the play are worth more than the jokes. The first is
  the language. Act V opens with Hanno speaking a long passage of
  Punic, transmitted in Latin letters (930 onward), and it is not
  nonsense: parts of it have been read, and it is one of the few
  stretches of connected Punic that survive anywhere. Hanno then says
  he will address the men in Punic and keep speaking it if they answer,
  and otherwise turn his tongue to their ways; the scene that follows
  gets its laughs from mistranslation. The second is that the play's
  Carthaginian-born young man, carried off from Carthage at six,
  remembers no Punic at all. For a question about who could use the
  language, a comedy that assumes a Roman audience can enjoy hearing
  it spoken is a strange and useful witness.

  Hanno himself is devout, patient and in the end sympathetic, so the
  Roman picture of Carthaginians was not a single hostile note even in
  the years when the hostility was freshest.
