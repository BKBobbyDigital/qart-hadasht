summary: >
  Specialist study arguing that neither the First nor the Second Punic
  War was the product of long-planned imperial design on either side —
  that both wars emerged from contingent decisions, miscalculations, and
  escalations across years that, individually, no party to them had
  intended to lead to total war. For the First Punic War, Hoyos analyzes
  in detail the Mamertine crisis, the Roman senate's division, the
  comitia's role, the fragmentary evidence for pre-264 treaties between
  Rome and Carthage, and the lost Philinus tradition. The book is the
  starting point for any serious treatment of the war's outbreak; its
  thesis substantially reshaped Anglophone scholarship on Roman
  imperialism in the western Mediterranean.
