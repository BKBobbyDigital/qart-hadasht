bias_notes: >
  A pro-Carthaginian Sicilian Greek historian whose work
  Polybius treats as the principal pro-Carthaginian
  counterweight to the pro-Roman Fabius Pictor. Philinus's
  perspective was that of a Sicilian Greek caught between
  the two metropolitan powers; his Akragantine origin and
  the destruction of Akragas by Roman forces in 262 BCE may
  have shaped his hostility to Rome. The text survives only
  in fragments preserved in Polybius and Diodorus, and only
  the points where Polybius is correcting Philinus are
  recoverable in any detail.
summary: >
  A lost contemporary history of the First Punic War (264-241
  BCE) by Philinus of Akragas, a Sicilian Greek
  historian writing from the Carthaginian-aligned
  perspective. Philinus's history was one of two principal
  contemporary accounts of the war (the other being Quintus
  Fabius Pictor's pro-Roman work); Polybius used both
  critically as the basis for his own Book 1.

  The text survives only in fragments preserved primarily
  in Polybius. The most consequential surviving fragment
  is Philinus's claim that a fourth Roman-Carthaginian
  treaty had existed before 264 BCE — a treaty in which
  Rome had agreed to stay out of Sicily and Carthage to
  stay out of Italy. Polybius (3.26) denies the
  treaty's existence and treats Philinus's claim as
  pro-Carthaginian advocacy. The dispute is the principal
  surviving instance of historiographical controversy
  about the diplomatic record before the First Punic War.

  Philinus's work likely covered the war's full duration,
  but only the diplomatic-causation argument and a few
  specific battlefield episodes are recoverable from the
  surviving fragments. Modern scholarship treats his work
  as an essential corrective to Polybius's pro-Roman
  framing while acknowledging that Polybius's preserved
  treatment of the conflict's chronology and operations is
  generally more reliable than Philinus's where the two
  conflict.
