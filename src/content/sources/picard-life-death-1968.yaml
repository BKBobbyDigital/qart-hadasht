date_composed:
  value: 1968
  precision: exact
summary: >
  Translated by Dominique Collon from the French original (Vie et mort de
  Carthage, 1970 — published in French slightly after the English
  translation). A narrative history of Carthage from foundation to
  destruction, complementing the Picards' earlier work on daily life. Like
  Daily Life in Carthage, the book reflects mid-century French archaeology
  and historiography and has been substantially supplemented by later work,
  but remains useful for its synthesis of the archaeological evidence then
  available and for traceability of arguments developed in subsequent
  scholarship.
