summary: >
  The multi-disciplinary rebuttal to the
  [Schwartz team's cemetery reading](/sources/schwartz-tophet-2010)
  of the Carthage [Tophet](/institutions/tophet) (*Antiquity*
  87, 2013, pp. 1199–1207). Where the
  [Smith papers](/sources/smith-tophet-2011) answered Schwartz
  on the osteological ground, this paper assembled the rest of
  the case: the epigraphy of the stelae (the *molk* dedication
  formulas address vows fulfilled to
  [Baal Hammon](/deities/baal-hammon) and
  [Tanit](/deities/tanit), which is votive language, not
  funerary language), the archaeology of the precincts
  (Tophets are spatially and ritually separate from the
  ordinary child burials found in Punic cemeteries), the
  comparative evidence from Motya, Sulci, and Tharros, and the
  cross-source consistency of the literary tradition. Its
  summary judgment is that the cemetery hypothesis requires
  explaining away several categories of evidence at once.

  The authors span the Italian, Anglophone and western
  Mediterranean research traditions: [Xella](/sources/xella-baal-hammon-1991), the leading
  specialist on Baal Hammon and editor of the principal Tophet
  volume, alongside [Quinn](/sources/quinn-phoenicians-2018),
  Melchiorri, and van Dommelen. Xella's place among the authors
  matters: he is a defender of the sacrificial reading, not a
  member of the Italian cemetery school he is sometimes grouped
  with.

  The site follows the paper in leading with the inscriptions
  and the sanctuary for its conclusion that sacrifice very
  probably happened, while treating frequency and scale as
  unrecoverable; see the
  [tophet-happened-scale-unrecoverable editorial take](/editorialTakes/tophet-happened-scale-unrecoverable)
  and [the Tophet controversy narrative](/narratives/the-tophet-controversy).
