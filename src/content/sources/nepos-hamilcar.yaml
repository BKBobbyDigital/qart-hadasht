bias_notes: >
  A very short life, four chapters, by the same author as the
  [Life of Hannibal](/sources/nepos-hannibal), and admiring in the same
  way: Nepos measures foreign commanders against Roman ones and lets
  them win. That makes him useful where the annalistic tradition is
  hostile and unreliable where the praise is the point. He is also
  compressed to the edge of error, giving the whole Mercenary War a
  paragraph. Where he preserves something Polybius does not, as with
  the exchange with Catulus over the evacuation terms, the detail may
  come from a lost source or from the rhetorical shaping of a life
  built to admire its subject, and there is no way to separate the two.
summary: >
  Nepos's Hamilcar runs from the Sicilian command to the death in
  Iberia, and several of its details are not in Polybius.

  On Sicily he says Hamilcar took command "admodum adulescentulus",
  quite a young man, in the last phase of the First Punic War; that
  before he came Carthaginian affairs went badly by land and sea;
  and that once there he never gave way to the enemy, never gave them
  an opening, often provoked them when the chance offered, and always
  came off the better. He defended Eryx, Nepos says, so well that the
  war did not seem to be being fought there (1.1–1.2).

  On the peace he is more specific than any other source. After the
  defeat at the Aegates the Carthaginians decided to end the war and
  **left the matter to Hamilcar's judgment**. Though he burned to go
  on fighting, he judged that peace had to be served, because he
  understood that a country drained by expense could not bear the
  calamities of war any longer, and he made the peace intending to
  renew the war the moment resources recovered (1.3–1.4). Then the
  exchange that gives the chapter its point: Catulus said he would
  not conclude anything unless Hamilcar and the men who held Eryx
  laid down their arms and left Sicily, and Hamilcar answered that
  though his country was going under he would die sooner than go home
  in such disgrace, since it was not in him to hand over to the enemy
  the arms he had received from his fatherland. Catulus gave way
  (1.5). Compare Polybius 1.62.3, where Carthage gives Hamilcar full
  powers to deal with the situation.

  On the Mercenary War he supplies the line most often quoted from
  him: the long foreign war kindled so great an internal one that
  Carthage was never in equal danger except when it was destroyed
  (2.1). He then compresses the war into a paragraph (twenty thousand
  mercenaries revolting, all Africa going over, Carthage asking Rome
  for help and getting it, Hamilcar made commander in near despair,
  the rebels shut into narrow ground where hunger killed more of them
  than the sword, Utica and Hippo recovered) whose figures and
  sequence have to be checked against Polybius 1.65–88 rather than
  used on their own (2.2–2.5).

  One remark from elsewhere in the same collection belongs with this
  life. Nepos closes *De Regibus*, his catalog of kings, by saying
  it seems not out of place to add Hamilcar and Hannibal, who, it is
  agreed, surpassed all those born in Africa in greatness of spirit
  and in *calliditas* (3.5). Two things are worth noticing. He
  appends two Carthaginians who held no royal title to a list of
  Hellenistic kings, which is a Roman writer placing the Barcids in
  that company. And the quality he credits them with, *calliditas*,
  is shrewdness or cunning, the same word the Punic-treachery
  tradition uses as an accusation; here it is praise.
