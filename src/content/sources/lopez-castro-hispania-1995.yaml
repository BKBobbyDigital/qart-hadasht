slug: lopez-castro-hispania-1995
title: "Hispania Poena: los fenicios en la Hispania romana (206 a.C. – 96 d.C.)"
author: José Luis López Castro
type: modern_scholarship
is_primary: false
language: spanish
date_composed:
  value: 1995
  precision: exact
bias_notes: >
  López Castro is the principal Spanish voice on the Punic
  presence in Iberia and on the continuity of Phoenician-Punic
  culture under Roman rule. His *Hispania Poena* synthesizes the
  archaeological and inscriptional evidence for the Punic Iberian
  cultural sphere from the late Republic into the early Roman
  imperial period. The work is methodologically more
  archaeologically-oriented than the parallel Anglophone
  syntheses of the Barcid Iberian period and is the natural
  reference for the post-218 continuation of Punic identity in
  southern Iberia. The site cites López Castro on the foundation
  pattern at Carthago Nova and on the broader cultural continuity
  the Roman conquest absorbed rather than displaced.
summary: >
  The canonical Spanish-language synthesis of the Phoenician-Punic
  cultural sphere in Iberia from the late Republic into the early
  Roman imperial period. López Castro works through the
  archaeological record (the southern Iberian Punic-cultural
  sites, the urban networks, the continuation of Punic religious
  practice into the Roman period) and the inscriptional evidence
  (Neo-Punic inscriptions from southern Iberia, theophoric naming
  patterns, civic-administrative texts) to argue that the Roman
  conquest of southern Iberia substantially absorbed the Punic-
  cultural infrastructure rather than dismantling it, with
  continuity in urban networks, administrative arrangements,
  religious cults, and elite naming practices visible across the
  conquest moment.

  For the site, López Castro is the principal reference for the
  Barcid Iberian state's institutional substance — particularly
  the planned-foundation reading of Carthago Nova, where his
  archaeological work on Cartagena documents the Barcid-period
  strata at the harbor, the residential quarters, and the
  administrative complex as a single planned urban program. His
  broader work on the post-Barcid continuity of Punic identity in
  Iberia is part of the structural argument for the Barcid project
  as a substantive state-building enterprise rather than as a war-
  preparation operation that incidentally produced a polity.

  Later work by López Castro and his collaborators has extended
  the Iberian Punic-cultural argument into the late-Republican
  and early-imperial periods, treating the Punic substrate in
  Roman Hispania as a substantive cultural-political reality
  through to at least the mid-1st century CE.
