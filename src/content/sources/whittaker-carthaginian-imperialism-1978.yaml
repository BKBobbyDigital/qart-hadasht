summary: >
  The chapter (in Garnsey and Whittaker, *Imperialism in the Ancient
  World*, 1978) that reframed how the field understands Carthaginian
  power. Whittaker argued against the older picture of a territorial
  empire on the Roman model and in favor of a looser, commercially
  driven hegemony: a small directly controlled African core, a ring
  of allied and tributary cities that kept much of their autonomy, and
  beyond that a sphere of influence policed by treaty and trade rather
  than by administration. The "empire" visible in the Greek and Roman
  sources, on this reading, is partly those sources imposing their own
  imperial categories on a differently organized power. The argument
  is the reference point for the network-and-hegemony reading of
  Carthage, and the position this site's editorial take on the nature
  of Carthaginian empire threads with and against.
