summary: >
  Chapter in Garnsey and Whittaker (eds), *Imperialism in the Ancient
  World* (Cambridge, 1978), the standard reference for the argument
  against reading Carthaginian power as a territorial empire on the
  Roman model, and for treating the "empire" of the Greek and Roman
  sources as partly their own categories imposed on a differently
  organized power. The site has not checked the chapter's detailed
  arguments against its text and does not attribute specific
  reconstructions to it. It is the reference point for the
  [editorial take on the nature of Carthaginian empire](/editorialTakes/carthaginian-empire-layered-hegemony).
