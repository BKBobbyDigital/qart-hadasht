bias_notes: >
  Greek historian held as a political hostage in Rome (167–150 BCE), where he became
  a close associate of the Scipionic family — including Scipio Aemilianus, who would
  destroy Carthage in 146 BCE. This gave him direct access to Roman commanders'
  testimony and family archives, but also a strongly pro-Scipionic perspective.
  Generally considered the most reliable surviving source for the Punic Wars, with
  a stated commitment to factual accuracy and a critical eye for predecessors like
  Fabius Pictor.
public_domain_translation:
  translator: Evelyn Shuckburgh
  year: 1889
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0234
summary: >
  Forty-book history of Rome's rise to Mediterranean dominance, 264–146 BCE.
  Books 1–5 are largely preserved; later books survive in fragments and excerpts.
  Books 1, 3, 6, 14, and 15 are the principal narrative sources for the First and
  Second Punic Wars, the Carthaginian constitution, and the Battle of Zama.
