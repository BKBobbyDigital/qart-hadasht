bias_notes: >
  Another eyewitness from within Hannibal's entourage, and the more
  influential of the two: Silenus's history became the principal
  source for Coelius Antipater's Latin account of the war, and so fed,
  at one remove, into Livy. The perspective is sympathetic to
  Hannibal, and it carries the religious and portentous coloring of a
  court tradition. The clearest surviving example is the dream Silenus
  reports Hannibal having at the outset of the invasion, in which a
  divine guide leads him toward Italy and forbids him to look back at
  the devastation following behind. Material like this is best read as
  the campaign's own self-presentation rather than as neutral
  reportage, but it is precisely that presentation, Carthaginian
  intent rendered from the inside, that makes Silenus valuable. Cicero
  rated him highly, calling him the writer who followed Hannibal's
  affairs most diligently.
summary: >
  A history of Hannibal's campaigns by a Sicilian Greek who traveled
  with the army. Silenus of Caleacte, from Kale Akte on the north
  coast of Sicily, was, with [Sosylus of Sparta](/sources/sosylus-sparta),
  one of the two Greek historians Cornelius Nepos names as Hannibal's
  companions on campaign, present with him "as long as fortune
  allowed." They are paired in the tradition rather than attested as a
  travelling pair, but both wrote the Second Punic War from inside
  Hannibal's circle.

  Silenus is the more consequential of the two because of what became
  of his work. Coelius Antipater, writing the first Latin monograph on
  the Second Punic War in the later 2nd century BCE, took Silenus as
  his principal authority, and Livy in turn drew on Coelius; so a
  Hannibal-aligned eyewitness account survives, diluted and at two
  removes, inside the Roman tradition that otherwise frames the war
  from the enemy's side. Cicero singles Silenus out as the historian
  who followed Hannibal's affairs most diligently, and preserves
  through him the famous dream at the invasion's outset. Silenus is
  also among the sources for Hannibal's cultivation of a bond with
  Hercules, the Greek face of the Tyrian [Melqart](/deities/melqart),
  a piece of deliberate self-fashioning the site treats as evidence of
  Carthaginian cultural strategy rather than as mere legend. Nothing
  survives in full; the work is known through later citation, above
  all through Coelius and through Cicero.
