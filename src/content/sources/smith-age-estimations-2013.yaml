summary: >
  The Smith team's defense of their aging of the cremated infants from
  the Carthage [Tophet](/institutions/tophet) (*Antiquity* 87, 2013,
  pp. 1191–1199), published in the same issue as the
  ["Phoenician bones of contention"](/sources/xella-bones-of-contention-2013)
  article by Xella, Quinn, Melchiorri and van Dommelen. It answers the
  Schwartz team's 2012 reply and restates the argument of their
  [2011 paper](/sources/smith-tophet-2011): that dental evidence places
  most of the infants at around one to two months old, older than a
  profile of natural perinatal deaths would predict, and that this
  supports sacrifice. The Schwartz team answered in turn in
  [2017](/sources/schwartz-two-tales-2017).

  The site treats the age dispute as unresolved and does not rest its
  position on either team's figures, since age at death does not
  establish manner of death. See the
  [editorial take on the Tophet](/editorialTakes/tophet-happened-scale-unrecoverable).
