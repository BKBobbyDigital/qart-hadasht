summary: >
  Chapter by Joshua R. Hall and Louis Rawlings in *Unit Cohesion and
  Warfare in the Ancient World: Military and Social Approaches*
  (Routledge, 2023, pp. 78–106), a volume the two also co-edited with
  Geoff Lee. Rawlings is a specialist in ancient warfare at Cardiff
  University.

  The chapter asks how Carthage's multiethnic armies, in which many
  soldiers came from communities with no stake in Carthage itself, held
  together as fighting forces. Reviewers single out its emphasis on
  vertical cohesion, the bonds between soldiers and their commanders,
  and note that the authors openly acknowledge how much about training
  and leadership has to be inferred, since every surviving narrative is
  Greek or Roman.

  The site cites it in the
  [editorial take on the Carthaginian army](/editorialTakes/carthaginian-army-institutionally-mixed)
  as the most direct recent study of the question, and as a counterweight
  to the older picture of Hannibal's army as a mercenary collection held
  together only by one man's genius. Detailed mechanisms beyond its focus
  on commanders should be checked against the chapter itself before they
  are attributed to it.
