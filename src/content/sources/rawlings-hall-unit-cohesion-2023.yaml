summary: >
  Chapter in *Unit Cohesion and Warfare in the Ancient World*
  (Routledge, 2023, pp. 78–106). Co-authored by Louis Rawlings
  (Senior Lecturer in Ancient History, Cardiff University, with
  ancient warfare as his principal research field) and J. R.
  Hall, the chapter is the most direct specialist treatment in
  recent scholarship of the question the
  [carthaginian-army-institutionally-mixed editorial take](/editorialTakes/carthaginian-army-institutionally-mixed)
  argues: how a multi-ethnic force composed of Libyan subject
  infantry, Numidian and Iberian allied contingents,
  Mediterranean-recruited mercenaries, and a small Carthaginian
  citizen officer cadre could function as a coherent
  fighting institution rather than as the "structurally
  weaker than Roman citizen recruitment" force Polybius 6.52
  describes.

  The chapter's principal argument is that unit cohesion in
  Carthaginian armies was a real and reproducible institutional
  achievement, not a contingent product of charismatic
  command. The mechanisms it identifies include: the use of
  ethnically-coherent sub-units commanded by officers from the
  same recruitment pool, the role of shared religious practice
  and pre-battle ritual in binding diverse contingents to a
  common cause, the financial-administrative infrastructure
  (especially the Barcid Iberian silver coinage and pay
  distribution apparatus) that gave troops a tangible
  institutional connection to the army employing them, and the
  long campaign experience that built unit-level cohesion
  across multi-year deployments. The reading explicitly pushes
  back against the inherited Polybian framing and against
  modern reception that has treated Hannibal's army as a
  collection of disparate mercenaries held together only by
  one man's tactical genius.

  Substantively the chapter strengthens the site's working
  position on Carthaginian army composition: the institution
  was mixed, the mixing was coherent rather than incoherent,
  and the battlefield success of Carthaginian armies across
  both Punic Wars was the product of an actual military system
  rather than the personal achievement of individual
  commanders fighting against the grain of their own
  institution.
