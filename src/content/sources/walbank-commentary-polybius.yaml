summary: >
  Three-volume commentary (Oxford: Clarendon Press; vol. I 1957,
  vol. II 1967, vol. III 1979) covering the whole of Polybius's
  *Histories* book by book and passage by passage. It is the
  standard scholarly apparatus for reading
  [Polybius](/sources/polybius-histories): for any given passage
  it assembles the textual problems, the parallel ancient
  evidence, the topographical and chronological questions, and
  the modern bibliography to its date of publication. Sixty-plus
  years on, no replacement exists; specialist work on Polybius
  still begins from Walbank.

  For Carthaginian history specifically, the commentary is the
  reference point for the passages this site leans on most: the
  Romano-Carthaginian treaties of book 3 (where Walbank's
  treatment of the treaty sequence and of the disputed "Philinus
  treaty" frames the modern debate the
  [pre-264 treaties open question](/openQuestions/fpw-pre-264-treaties)
  covers), the Mercenary War narrative of book 1, the
  constitutional comparison of book 6 (including the army
  comparison at 6.52 that the
  [army-composition editorial take](/editorialTakes/carthaginian-army-institutionally-mixed)
  pushes against), and the African campaign and Zama material of
  books 14 and 15.

  Walbank's own positions matter as much as the assembled
  apparatus. He reads Polybius as a genuinely critical historian
  whose pro-Scipionic access is both his greatest asset and his
  most consistent distortion, a judgment this site's
  [bias notes on Polybius](/sources/polybius-histories) follow.
  Where this site's claims rest on a contested Polybius passage,
  Walbank's commentary is the first place the modern argument
  was usually had.
