summary: >
  Single-volume modern history of Carthage from foundation to destruction,
  emphasizing recent archaeological evidence and the wider Mediterranean context.
  MacDonald foregrounds Carthage as a major power in its own right, not merely
  Rome's antagonist, and integrates work on Punic colonies, trade networks, and
  religion. Particularly strong on the city's material culture and on situating
  political events alongside archaeological data.
