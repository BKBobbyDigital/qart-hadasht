bias_notes: >
  Mago's treatise is the only sustained Carthaginian intellectual
  production preserved in extended Greco-Roman transmission. It is
  also, by the same token, the only Carthaginian voice that survives
  on Carthaginian terms (technical-empirical, written by a
  Carthaginian for Carthaginian readers, transmitted because Roman
  agronomists found it useful rather than because it was a Roman
  cultural object). What survives is a fragmentary picture of one
  technical field; what is lost is the wider Carthaginian
  intellectual literature the treatise presupposes (Mago cites
  earlier Punic authors who have not survived even in fragments).
  The site reads Mago as the only substantive primary Carthaginian
  literary source we have, with the survival itself a window into
  the selectivity of what Greco-Roman transmission preserved.
summary: >
  Mago's twenty-eight-book agricultural treatise is the single
  most important surviving Carthaginian intellectual product and
  the only Carthaginian literary work systematically preserved in
  the Greco-Roman tradition. The original was composed in Punic,
  most probably across the late 4th and early 3rd centuries BCE,
  and is lost. What survives is approximately fifty substantial
  citations and paraphrases preserved across the Roman agronomic
  tradition — principally in Varro, Columella, Pliny the Elder,
  Palladius, Gargilius Martialis, and the Byzantine Geoponica —
  alongside scattered later references through the medieval
  Arabic and Latin agronomic literatures.

  The treatise covered the full range of Mediterranean
  agriculture as practiced on substantial estates: viticulture
  (vine selection, training, pressing, wine production), olive
  cultivation (grafting, soil, pressing techniques), grain
  agriculture (rotation, threshing, storage), cattle and sheep
  husbandry, horse breeding, beekeeping, and the administrative-
  organizational structures of estate management (overseer
  responsibilities, slave-and-tenant labor organization,
  accounting, seasonal labor allocation). The framework
  presupposes large-estate production in a Mediterranean
  tree-crop and cereal economy and is the principal evidence
  for the structural character of Carthaginian agricultural
  political economy.

  The transmission history is one of the most striking
  surviving instances of Greco-Roman selective preservation.
  After the 146 BCE destruction of Carthage, the Roman senate
  gave the Carthaginian libraries to the Numidian allies but
  specifically held back Mago's treatise for Latin translation
  — the work commissioned, per Pliny *NH* 18.5, to Decimus
  Silanus, a senator who had the requisite Punic competence.
  The Latin translation is itself lost, but circulated through
  the early Empire and was the basis for subsequent Greek
  abridgments by Cassius Dionysius of Utica (c. 88 BCE) and
  Diophanes of Bithynia (c. 50 BCE), and for the extensive
  Latin engagement by Varro, Columella, and Pliny.

  Pliny the Elder calls Mago *parens rusticationis*, "the
  father of country science," at *Natural History* 18.22-23 —
  a remarkable acknowledgment by a Roman writer about a
  Carthaginian intellectual just over two centuries after the
  destruction of Carthage. The Roman agronomic tradition
  treated Mago as one of the foundational authorities of the
  field through at least the early Empire. The Mago-derived
  material in the late Roman Palladius (*Opus Agriculturae*,
  4th c. CE) and in the Byzantine Geoponica (10th c. CE)
  carried the treatise's substance forward; the medieval
  Arabic agronomic tradition (Ibn al-Awwam's *Kitāb
  al-Filāha*, 12th c. CE al-Andalus) drew on Mago's material
  through the Palladius and Geoponica transmission; and the
  Latin agronomic literature of the European Middle Ages and
  early modern period continued to cite Mago by name through
  Pier de' Crescenzi (13th c.) and beyond.

  The treatise's preservation makes Mago the only Carthaginian
  voice that entered the Western intellectual canon and stayed
  there for two millennia. The narrative
  [Mago of Carthage and the surviving Carthaginian voice](/narratives/mago-of-carthage)
  treats the transmission chain, the surviving fragments, and
  what the survival reveals about the broader Carthaginian
  intellectual culture in which the treatise was produced.
