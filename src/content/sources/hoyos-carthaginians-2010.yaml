summary: >
  Hoyos's broader treatment of Carthaginian civilization, its institutions,
  religion, economy, society, and military culture, written for the
  Routledge "Peoples of the Ancient World" series and complementing his
  earlier biographical work on Hannibal. Where Hoyos's 2003 Hannibal is a
  military and biographical study, The Carthaginians steps back to
  reconstruct the city and society that produced him. Particularly useful
  on the suffeteship and the Carthaginian assemblies, on the relationship
  between the Barcid family and Carthaginian politics, and on the structure
  of Carthage's commercial and territorial empire. A natural companion to
  MacDonald 2015 and Miles 2010 in the trio of accessible modern syntheses.
