slug: ringbauer-punic-genetics-2025
title: "Punic people were genetically diverse with almost no Levantine ancestors"
author: "Harald Ringbauer, Ilan Gronau, David Reich et al."
type: modern_scholarship
is_primary: false
language: english
date_composed:
  value: 2025
  precision: exact
summary: >
  Ancient-DNA study published in *Nature* (April 2025) that
  analyzed genome-wide data from approximately 210 individuals
  recovered from Phoenician and Punic burial contexts across
  the Mediterranean, including sites at Carthage, Tharros,
  Motya, Kerkouane, Cadiz, Ibiza, and several others.

  The principal finding is that individuals buried at Punic
  sites in the western Mediterranean across the period from
  roughly the seventh through second centuries BCE carry
  predominantly Sicilian, Aegean, and North African genetic
  ancestry, with only minimal Levantine genetic component —
  including at Carthage itself. Individuals buried at
  Phoenician homeland sites (e.g. Akhziv) showed the expected
  Levantine genetic profile, providing the comparative baseline.
  The data are consistent with a model in which the Phoenician
  cultural-religious-linguistic package was transmitted
  westward and sustained for centuries by populations whose
  demographic composition was overwhelmingly western
  Mediterranean rather than Tyrian-descended.

  This is the largest aDNA dataset yet assembled for the
  Phoenician-Punic world and the first to address the
  population question with sample sizes that allow
  statistically informative inferences. It does not address
  the foundation event itself, the small founding population
  of any colonial outpost is below the resolution of the
  available samples, but it does address the long-run
  demographic composition of the cities the foundation
  produced.

  Methodological cautions the paper itself flags: the
  difficulty of distinguishing "Sicilian-like" from
  "Aegean-like" ancestry components at the relevant time
  depths; the under-sampling of certain key sites (Punic
  Spain in particular); and the standard ancient-DNA caveat
  that population-level inference from cemetery samples
  depends on the cemeteries being representative of the
  living populations, which is not always assured for
  the Punic Tophet and elite-burial contexts that have
  produced the bulk of the samples.

  The framing implication for Punic studies is that
  "Phoenician" and "Punic" were cultural identities sustained
  by socialization, religious practice, language, and civic
  institutions, carried across centuries by genetically
  heterogeneous populations whose composition reflected the
  full Mediterranean integration the literary and
  inscriptional record has long suggested. The Tyrian
  foundation event the site treats as well-attested is not
  in tension with the finding; what the finding clarifies is
  that the population produced by that founding event was, by
  the time of the Punic-period samples, demographically
  Mediterranean rather than predominantly Levantine.
