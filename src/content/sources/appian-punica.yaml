critical_read:
  what_it_gives: >
    The only continuous narrative of the Third Punic War and the destruction
    of Carthage, which makes him indispensable whatever his distance from
    the events. He also preserves traditions absent from the other
    survivors: the Sophonisba betrothal made without Hasdrubal's knowledge
    (*Pun.* 10), Masinissa's last years and Scipio's settlement of the
    succession (105–107), and a Cannae with Celtiberian false deserters and
    a ravine ambush that no one else reports.
  what_it_argues: >
    Writing in Greek under the Antonines, about three and a half centuries
    after the Second Punic War, he organizes his history by theater rather
    than by year, which suits a reader who wants one war's arc and costs the
    chronological cross-checks annalistic writing provides. The Punica reads
    the long conflict as an enmity working itself out, and he compresses
    heavily.
  dependence: >
    His sources cannot be securely identified, which is the central problem
    in using him. Where he agrees with Polybius he may be drawing on
    Polybius or on a tradition they share; where he differs, the difference
    may preserve something lost or may be his own compression, and usually
    the text gives no way to tell. The site treats his divergences as a
    separate tradition to be reported rather than as a correction to be
    preferred or a confusion to be discarded.
public_domain_translation:
  translator: Horace White
  year: 1899
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0230
summary: >
  Book 8 of Appian's Roman History, covering Rome's wars with Carthage. Strongest
  on the Third Punic War (chapters 67–135), where it is our principal narrative
  source for the siege and destruction of Carthage. Earlier sections on the First
  and Second Punic Wars are derivative and should be checked against Polybius
  where overlap exists.
