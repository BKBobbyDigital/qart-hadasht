bias_notes: >
  An Augustan epic poem rather than a historical source, written
  approximately 800 years after the legendary foundation of Carthage
  and 130 years after the city's destruction. The Aeneid's treatment
  of Dido and Carthage is a literary construction shaped by Virgil's
  Augustan-era purposes: positioning Rome's foundation as the
  providential successor to the Phoenician one, dramatizing the
  origins of the Roman-Carthaginian conflict, and developing
  Aeneas's character through his relationship with Dido. The
  Aeneid's account is therefore not evidence about Carthage's
  actual foundation; it is evidence about how the foundation
  tradition was reshaped in Augustan Rome and how it has been
  received in the European literary imagination since. The
  romantic-tragic Dido of European reception is substantially
  Virgil's, not the earlier tradition's.
