summary: >
  Latin epic poem in twelve books, narrating the journey of Aeneas
  from the fall of Troy to the founding of the Latin people in
  Italy. Books I and IV contain Virgil's elaborated treatment of
  Dido, the Tyrian queen who founds Carthage, falls in love with
  Aeneas during his enforced stop in North Africa, and takes her
  own life when he departs to fulfill his destiny in Italy. The
  Aeneid is essential reading for the reception history of the
  Carthage foundation tradition but is not a historical source
  for the foundation itself.
