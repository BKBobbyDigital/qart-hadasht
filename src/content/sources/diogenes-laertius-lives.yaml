bias_notes: >
  A compilation of philosophers' lives, anecdotes and doctrines drawn from
  earlier biographers and handbooks, uneven in quality and rarely naming
  its sources. Its short entries preserve facts found nowhere else, and
  its anecdotes need the usual caution.
summary: >
  Ten books of lives of Greek philosophers, written about the third
  century CE. It matters on this site for one short entry (4.67) on
  [Clitomachus](/people/clitomachus): a Carthaginian whose real name was
  Hasdrubal, who taught philosophy at Carthage in his own language before
  going to Athens at forty, studied under Carneades, wrote more than four
  hundred treatises and succeeded him as head of the Academy.
