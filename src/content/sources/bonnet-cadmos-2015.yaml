bias_notes: >
  Bonnet's monograph on Hellenistic-period Phoenician religion
  develops the broader argument that the Phoenician colonial
  network operated as a substantive religious-cultic system
  with coordinating infrastructure (the Melqart cult, the
  annual delegations, the shared inscriptional and ritual
  vocabulary) that maintained its coherence across centuries
  of geographic dispersion and political transformation. The
  book is the principal recent French-language treatment of
  the Phoenician diaspora as a substantively integrated
  system rather than as a series of independent colonial
  foundations, and it is the natural complement to Aubet's
  earlier archaeological-economic synthesis. Bonnet's
  position aligns with the broader continental European
  scholarly tradition that reads the Phoenician colonial
  world from the inside rather than through Greco-Roman
  external framings.
summary: >
  Corinne Bonnet's *Les enfants de Cadmos: le paysage religieux
  de la Phénicie hellénistique*, published by the Pulim
  Presses in 2015, is the principal recent French-language
  monograph on the Hellenistic-period Phoenician religious
  landscape. The book works through the religious-cultic
  infrastructure of the Phoenician colonial network — the
  Melqart cult as the principal cross-network deity, the
  Astarte and Eshmun cults' coordinated colonial diffusion,
  the annual delegations and ritual exchanges that
  maintained the network's coherence across centuries, the
  Hellenistic-period adaptations that transformed Phoenician
  religion without displacing its Phoenician core — and
  argues that the colonial network's religious dimension was
  substantively integrative rather than merely shared.

  For the site, Bonnet 2015 is the principal modern source for
  the Phoenician-colonial-network-as-system framing. Her
  argument that the network's religious infrastructure
  functioned as substantive coordinating mechanism — not as
  loose shared culture, but as institutionalized practice with
  documented annual cycles, formal delegation systems, and
  cross-network elite recognition through ritual participation
  — is what the site's
  [Phoenician colonial network theme](/themes/phoenician-colonial-network)
  draws on for the Melqart-cult-as-network-infrastructure
  framing. Bonnet's broader work on Phoenician religion
  (including her earlier *Astarté* monograph treated under
  [the source entry](/sources/bonnet-astarte-1996)) sits
  behind the site's treatment of the religious-cultic
  evidence base across multiple themes and narratives.
