summary: >
  Major synthesis chapter (pp. 545–593) in Claude Nicolet's edited volume
  Rome et la conquête du monde méditerranéen (vol. 2, Presses Universitaires
  de France, 1978). Sznycer was one of the foremost 20th-century editors
  of Punic and Neo-Punic inscriptions and brought specialist epigraphic
  expertise to a wider treatment of Carthaginian civilization. The chapter
  remains a standard reference for Punic institutions, language, and
  culture and is repeatedly cited in subsequent scholarship including the
  English-language syntheses. A short, dense, authoritative starting point
  for the Punic-speaking world on its own terms.
