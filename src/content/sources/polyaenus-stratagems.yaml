bias_notes: >
  A Macedonian rhetor writing nearly four centuries after the Punic
  wars, who assembled some nine hundred military anecdotes as material
  the emperors might imitate against Parthia. The purpose governs the
  form: each item is stripped to the trick it illustrates, with the
  campaign, the date and often the outcome left out. He names no
  sources. Nothing in him can carry a fact on its own authority, and a
  stratagem that appears only here should be treated as a story that
  was circulating by the second century CE rather than as a report.

  He is still worth having for two reasons. Where he overlaps the
  narrative historians he shows which episodes had become set pieces,
  and his Hannibal chapter does overlap them: the oxen with torches on
  their horns, the weak center that draws an enemy into
  encirclement, the wind and dust at Cannae, the fighting near
  Casilinum. And occasionally he preserves a detail the historians do
  not, in which case the site reports it as his and says so.
summary: >
  Eight books of stratagems arranged by people and commander, of which
  parts of the sixth and seventh are lost. Hannibal has ten sections in
  book 6 (chapter 38).

  The site cites him principally for one of them. At 6.38.2 Hannibal
  persuaded his soldiers that men who died bravely in battle would come
  back to life soon afterwards, and produced a man resembling a fallen
  soldier to claim that he had returned. The second half is the part
  that matters and is usually dropped when the passage is quoted: what
  Polyaenus describes is not a belief held in the army but a
  demonstration staged for it. The question of what, if anything, it
  drew on is treated under [Melqart](/deities/melqart).

  Two other sections touch material the site treats from the narrative
  sources. At 6.38.8 he has the oxen driven with torches on their horns
  against the Romans guarding the pass, the escape from Campania that
  Polybius and Livy both describe at length (see
  [the Fabian campaign](/events/fabian-campaign-217)). At 6.38.4 he has
  Hannibal position his army at
  [Cannae](/events/battle-of-cannae) so that the wind blew sand into
  Roman eyes, a detail Livy also carries. Their appearance here is
  evidence that the episodes had hardened into exempla, not independent
  confirmation of them.
