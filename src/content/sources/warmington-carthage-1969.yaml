summary: >
  A second edition of Warmington's earlier (1960) general history of
  Carthage from foundation to destruction. For decades the standard
  English-language single-volume treatment, now substantially superseded
  by Lancel (1995), Miles (2010), and MacDonald (2015), but still useful
  for tracing how the field's standard narrative was put together in the
  mid-20th century before the major late-20th-century excavations at
  Carthage transformed the archaeological picture. Cited in essentially
  every later work as a reference point.
