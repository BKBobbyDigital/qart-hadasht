name_display: Tophet of Carthage (the precinct as institution)
name_punic: The Punic name for the precinct is not preserved (the modern name "Tophet" is derived from the Hebrew Bible's term for a place of child sacrifice in the Hinnom valley near Jerusalem and is not a Carthaginian self-designation).
name_greek: Not named in surviving Greek sources as a single entity.
name_latin: Not named in surviving Latin sources as a single entity.
