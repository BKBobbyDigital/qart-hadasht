summary: >
  The two annual chief magistrates of Carthage, attested from at least the
  6th century BCE through the destruction of the city in 146 BCE. The
  Punic title šofeṭ (cognate with the Hebrew shofet, "judge") was
  rendered into Greek and Latin in different ways across the surviving
  sources: earlier Greek writers, including some Polybian passages,
  treat the suffetes as kings (basileis), while later Greek and Latin
  writers more accurately translate them as "judges" (dikastai,
  iudices). The institution is described directly by Aristotle in the
  one substantial pre-conquest external account of the Carthaginian
  constitution.

  Two suffetes were elected each year, evidently from the senatorial
  aristocracy and apparently with eligibility shaped by family standing
  and merit rather than strict hereditary right. Their functions
  combined elements that Greek and Roman analysts mapped onto their own
  consular and archontic categories: presidency over the senate and
  popular assembly, judicial authority, ceremonial leadership at civic
  festivals, and (early in the institution's history) command of
  Carthaginian armies. By the third century BCE the military function
  had become detachable: military commanders were elected separately,
  and suffetes might or might not also hold imperium. Hannibal Barca's
  service as suffete in 196 BCE, in which he reformed Carthaginian
  finances rather than commanded armies, illustrates the institution's
  late-Republican civilian character.

  Aristotle's analysis (Politics II.11) compared the Carthaginian
  suffeteship to the Spartan kingship and the Roman consulship, treating
  it as one component of a "mixed" constitution that he counted, with
  the Carthaginian senate and popular assembly, among the better
  organized non-Greek polities of his day. The institution survived the
  Roman destruction of Carthage in 146 BCE in altered form: at sites of
  Punic continuity in North Africa, including Roman-period inscriptions
  from Lepcis Magna and other former Punic-sphere cities, suffetes
  continued to be elected as local magistrates well into the early
  imperial period.

  The site's substantive treatment of the office is the narrative
  [The suffeteship — an institutional arc](/narratives/the-suffeteship-arc),
  which walks the institutional history from the late-6th-c.
  transition out of the early monarchical period through Aristotle's
  classical-period external recognition, the structural separation
  from military command, Hannibal's 196 BCE reform moment, the
  destruction, and the Roman-period continuation in former Punic-
  cultural cities. The framing is Phoenician-first: the suffeteship
  is a Phoenician civic institution drawing on the
  broader Phoenician city-state governance tradition, not a
  proto-Roman or proto-republican developmental form. The
  structurally distinctive feature — separation from military
  command across the 4th-3rd c. BCE — is treated as a substantive
  Phoenician constitutional achievement rather than as accidental
  practice; the
  [central claim](/claims/suffeteship-military-command-separation)
  develops this with sourced evidence.
