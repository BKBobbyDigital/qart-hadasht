summary: >
  The mixed Libyan-Phoenician population of the Carthaginian
  African hinterland — descendants of intermarriage between
  Phoenician colonists and the indigenous Libyan-Berber
  population, formed across centuries of Punic settlement
  in coastal North Africa. The Libyo-Phoenicians were the
  principal manpower base for Carthaginian heavy infantry
  through the entire Punic Wars period, after the
  Sacred Band's destruction at Crimisus in 341 BCE
  removed the citizen-elite alternative.

  The status distinction between Libyo-Phoenicians and
  full Carthaginian citizens was substantial: Libyo-
  Phoenicians paid tribute, served in Carthaginian armies,
  and inhabited Carthaginian-administered cities outside
  Carthage itself, but they did not vote in the
  Carthaginian popular assembly or hold senatorial
  office. Polybius (1.71) describes the Libyan rural
  population's tribute and military-levy obligations as
  the structural grievance that produced the broad
  Libyan adherence to the Mercenary War in 241-237 BCE.
  Whether the "Libyans" of the Mercenary War narrative
  are coextensive with the "Libyo-Phoenicians" of the
  later imperial-army accounts, or whether the two
  categories were already distinct by the late 3rd
  century, is contested in modern scholarship.

  Operationally, Libyo-Phoenician troops served principally
  as heavy infantry — armed in the Greek hoplite tradition
  in the 4th century, evolving toward Roman-style equipment
  by the late 3rd century BCE as Carthaginian armies
  fought Roman opponents and adapted equipment accordingly.
  Polybius (3.114) describes the Libyan heavy infantry at
  Cannae as armed with captured Roman equipment from the
  earlier engagements. The Libyans were the formation
  Hannibal positioned on the wings of his crescent at
  Cannae, the troops who closed the envelopment after the
  Iberian and Gallic center had drawn the Roman advance
  forward.

  The Libyo-Phoenician contribution to Carthaginian
  military capacity was central rather than auxiliary,
  but the surviving Greek-Latin sources consistently
  emphasize Carthaginian commanders' use of mercenary
  troops over the African subject-citizen base. The
  framing reflects ancient ethnographic categories more
  than the actual composition of Carthaginian armies, in
  which Libyans were the largest and most reliable single
  component.

  The Libyo-Phoenicians are also methodologically important
  for the broader question of Punic demographic composition.
  The very fact that the surviving Greek and Latin sources
  named the category — Λιβυφοίνικες, a distinct integrated
  population produced by centuries of mixing between
  Phoenician colonists and Libyan locals — is direct
  literary attestation that the colonial process involved
  substantive demographic mixing from very early. The
  2025
  [Ringbauer aDNA study](/sources/ringbauer-punic-genetics-2025)
  has now confirmed empirically what the ancient sources had
  already documented categorically: Punic-period populations
  in the western Mediterranean were genetically Mediterranean
  rather than predominantly Levantine, with Libyo-Phoenician-
  type integrated populations representing the dominant
  demographic reality across the Carthaginian sphere. The
  category was not an exception to Punic demographic identity
  but closer to its core. The
  [open question on Punic demographic composition](/openQuestions/punic-demographic-composition)
  treats the broader methodological framing.
