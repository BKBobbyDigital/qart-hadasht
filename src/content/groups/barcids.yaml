summary: >
  The aristocratic family that dominated Carthaginian
  military operations across the second half of the third
  century BCE, founded by [Hamilcar Barca](/people/hamilcar-barca)
  and producing, across two generations, the figures who
  conducted the Iberian conquest, the Hannibalic Italian
  campaign, the Iberian theater of the Second Punic War,
  and the post-Zama political reform program. The family's
  operational pattern was distinct from the Magonid model
  of the previous era: where the Magonids had run hereditary
  command from Carthage itself, the Barcids ran it from
  Iberia, with substantial political-military distance from
  the senatorial oversight that the post-Magonid reaction
  had institutionalized.

  Principal Barcid figures:

  - **[Hamilcar Barca](/people/hamilcar-barca)** (~275-228
    BCE): founder; commander in the late
    [First Punic War](/events/first-punic-war), conqueror in
    the [Mercenary War](/events/mercenary-war), founder of
    the [Iberian project](/events/hamilcars-iberian-conquest);
    drowned during a Vettonian engagement in 228 BCE
  - **[Hasdrubal the Fair](/people/hasdrubal-the-fair)**
    (Hamilcar's son-in-law): successor to the
    [Iberian command](/events/hasdrubal-the-fairs-command);
    founder of [Carthago Nova](/events/founding-of-carthago-nova);
    negotiator of the [Ebro Treaty](/events/ebro-treaty);
    [assassinated](/events/assassination-of-hasdrubal-the-fair)
    221 BCE
  - **[Hannibal Barca](/people/hannibal-barca)** (247-183
    BCE): the second-generation principal figure; commander
    of the [Italian campaign](/events/second-punic-war);
    [Carthaginian suffete](/events/hannibal-196-reforms)
    196 BCE; suffered exile and suicide at Bithynia
  - **[Hasdrubal Barca](/people/hasdrubal-barca)** (Hannibal's
    brother): Iberian commander after Hannibal's
    crossing; killed at the
    [Battle of the Metaurus](/events/battle-of-metaurus) 207
    BCE
  - **[Mago Barca](/people/mago-barca)** (Hannibal's
    youngest brother): Iberian and northern Italian
    operations; [died at sea](/events/mago-barca-death-203)
    in 203 BCE during the African recall

  The family's distinctive operational mode combined three
  features: a geographic-political base in Iberia (the
  conquered territory functioning effectively as Barcid
  family-administered domain rather than as senatorially-
  governed province); cultivated indigenous-elite alliance
  networks (Hasdrubal the Fair's marriage policy, Hannibal's
  treatment of Iberian troops, the Numidian Massylian
  alliance); and a degree of operational autonomy from
  senatorial oversight that no Carthaginian command had
  exercised since the Magonid period.

  The Barcid pattern's structural implication was the
  Italian campaign's ambition itself. A field army that the
  metropolitan senate could not directly control was free
  to attempt the kind of strategic gamble (allied defection
  through direct pressure on Italy) that more closely
  supervised commanders would have been unable to authorize.
  The campaign nearly succeeded; its eventual failure was
  partly the product of the same autonomy that had enabled
  it, since the Barcid faction's ability to commit
  Carthaginian state resources to Italian operations was
  bounded by what the senate would underwrite.

  The family's political end is the
  [Hannibal exile of 195 BCE](/events/hannibal-exile-and-death),
  produced by the post-196 reform's senatorial backlash.
  The structural lesson the surviving Carthaginian political
  class drew, that family-faction command produced
  outcomes the senate could not control, was the same
  lesson the post-Magonid generation had drawn after 396 BCE.
  The Council of 104 reform Hannibal had attempted in 196,
  on the site's reading, was the post-Barcid attempt to
  break the same family-versus-institution tension the
  post-Magonid period had originally addressed; it produced
  Hannibal's exile rather than the structural reform he had
  argued for.
