summary: >
  A Celtiberian people of the central Meseta — the middle Tagus
  basin and the highlands of the Sistema Central — occupying
  approximately the modern Madrid and Toledo regions. The
  Carpetani are best known to Carthaginian-period sources as the
  principal force at the Battle of the Tagus in autumn 220 BCE,
  the final engagement of Hannibal's pre-Saguntum Iberian
  consolidation.

  After Hannibal's twin 220 BCE campaigns against the Olcades
  and the Vaccaei, a coalition force assembled to challenge his
  return southward across the Tagus. The Carpetani were the
  largest contingent — Polybius and Livy give a coalition force
  of around 100,000 with the Carpetani at its core, augmented by
  Olcades and Vaccaei refugees and other regional allies. The
  figure is the kind of round number ancient narratives offered
  with confidence and modern readers should treat as scale
  signal rather than census; whatever the actual count, the
  coalition was clearly substantial. Hannibal feigned a
  retreat across the Tagus, ambushed the coalition during its
  river-crossing pursuit, and destroyed it as a coherent force.
  The battle effectively ended organized central-Iberian
  resistance to the Carthaginian command for the duration of
  the Second Punic War's pre-Italian phase.

  Roman engagement with the Carpetani begins in earnest in the
  early 2nd century BCE; Cato the Elder's praetorian campaign
  in 195 BCE included Carpetani territory, and by the Lusitanian
  Wars of the mid-2nd century the people were nominally Roman
  but a frequent participant in the broader Celtiberian
  resistance. The Carpetani identification with the central
  Meseta survived into Roman provincial geography — Toletum
  (modern Toledo) was reckoned Carpetani in the Roman period.
