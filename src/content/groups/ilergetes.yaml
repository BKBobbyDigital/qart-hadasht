summary: >
  An Iberian tribal confederation occupying the lower-Ebro
  region of northeastern Iberia (modern southern Catalonia and
  lower Aragon, around the cities of modern Lleida and
  Tarragona). The Ilergetes are the best-attested Iberian
  political entity of the Second Punic War period, principally
  because of the prominent role of their two leading brothers,
  Indibilis and Mandonius, across the war's Iberian theatre.

  The confederation's political behavior across the Second
  Punic War is the clearest surviving instance of Iberian
  agency in a war that the Greco-Latin sources usually
  presented as a Carthaginian-Roman binary. The Ilergetes
  shifted alignment multiple times — initially Carthaginian-
  aligned under Hasdrubal Barca's command; defected to Rome
  after Scipio's capture of New Carthage in 209 BCE;
  revolted against Rome after Scipio's departure from Iberia
  in 206 BCE in response to Roman post-victory misgovernance;
  defeated and largely destroyed by Roman counter-action in
  205-204 BCE under Scipio's deputies.

  The Ilergetes' record is an important corrective to the
  surviving Carthaginian-Roman framing of the SPW Iberian
  theatre. Iberian tribes had their own political interests,
  their own internal rivalries, and their own capacity for
  collective action; their alignments with metropolitan
  powers were tactical and revisable rather than identity-
  level commitments. The brothers Indibilis and Mandonius
  are the best-documented individuals in this pattern.
