summary: >
  The Celtic-Iberian peoples of the central-northern Iberian
  meseta — a fusion population produced by Celtic migration
  into pre-Celtic Iberian territory beginning in the 6th
  century BCE — and one of the principal mercenary
  populations employed by both Carthage and Rome across the
  Punic Wars period. Celtiberian troops appear consistently
  in Carthaginian field armies from the Barcid Iberian
  conquest onward, and equally consistently in Roman
  armies after the post-206 BCE Roman occupation of
  Iberia.

  The Celtiberian specialist contributions to ancient
  Mediterranean armies were two-fold:

  - **The *gladius hispaniensis*.** The double-edged
    short sword that the Romans adopted as their standard
    legionary weapon was Celtiberian in origin — recovered
    from Carthaginian armies fighting in Iberia and Italy,
    standardized as Roman equipment by the late 3rd
    century BCE. Polybius (6.23) and Livy (22.46) preserve
    the adoption explicitly. The weapon defined Roman
    infantry tactics through the late Republic.
  - **Heavy infantry capacity.** Unlike many of Rome's
    auxiliary populations who provided cavalry or light
    troops, the Celtiberians provided heavy infantry of
    quality comparable to Roman or Carthaginian-trained
    forces. Celtiberian contingents served as principal
    line-infantry in Hannibal's Italian armies and in
    Scipio's later Iberian operations.

  The political relationship between Celtiberian
  confederations and metropolitan powers (Carthage, then
  Rome) was tactical and revisable on the same pattern
  documented in detail for the Ilergetes under Indibilis
  and Mandonius. The famous death of Hamilcar Barca in
  228 BCE was at the hands of a Vettonian (or possibly
  Celtiberian) coalition; the Celtiberian kingmaker for
  Hasdrubal the Fair's assassination in 221 BCE was an
  individual whose precise tribal identity is contested.
  Celtiberian alignments with Carthage were never
  identity-level commitments; they were specific-
  contingent arrangements.

  Roman Iberian wars from 197 BCE through Numantia (133
  BCE) and beyond were substantially Celtiberian wars on
  the Roman side — a continuation of the patterns that
  had characterized Carthaginian-Iberian relations a
  century earlier.
