summary: >
  An Iberian people occupying the central-eastern interior of the
  peninsula — most plausibly the upper Guadiana and Júcar headwaters
  in modern Cuenca province — and the first independent target of
  Hannibal Barca's command in Iberia. After succeeding his
  brother-in-law Hasdrubal the Fair in 221 BCE, Hannibal launched
  his first independent campaign the following year against the
  Olcades, taking their principal town (Polybius calls it Althaia,
  Livy calls it Cartala) and bringing the territory into the
  tributary Carthaginian sphere.

  The campaign is principally significant as the opening of
  Hannibal's pre-Italian consolidation of Iberia. The Olcades
  themselves leave little independent trace in the surviving
  record outside the 220 BCE narrative; like most Iberian
  peoples of the central Meseta they had no native literary
  tradition that survived, and the Greco-Latin sources are
  interested in them principally as the first stage of the
  campaign that Hannibal's Vaccaei expedition (the same year)
  and the Battle of the Tagus (autumn 220) would complete. The
  combination brought the south-central Meseta and the upper-
  Tagus basin into the Carthaginian tributary system in
  preparation for the Saguntum campaign of 219 BCE.

  The geographic identification is approximate — Polybius and
  Livy give a campaign route rather than an ethnographic
  description, and the modern reconstruction of the Olcades'
  exact territory varies among scholars from the upper Guadiana
  to the Júcar basin. What is consistent across the sources is
  that the Olcades were inland, agricultural, and politically
  organized at a level that could field substantial forces in
  defense of fortified towns — typical of the Iberian
  central-Meseta polities of the late 3rd century.
