summary: >
  The eastern of the two principal Numidian confederations,
  occupying the territory between Carthaginian Africa and the
  Masaesylian zone (modern eastern Algeria and western
  Tunisia). The Massylii's political behavior across the late
  4th and 3rd centuries BCE shifted between Carthaginian
  alignment and Carthaginian opposition depending on
  internal succession politics and external pressure.

  The principal Massylian historical figures in the surviving
  Carthaginian record:

  - **Naravas**: brought his own 2,000 Numidian cavalry
    over to Hamilcar Barca during the Mercenary War in 239
    BCE, sealed by marriage to Hamilcar's daughter.
    Polybius calls him a Numidian of high rank with an
    inherited attachment to Carthage and names no people
    (1.78), so his place in this house is a modern
    identification. The defection was a turning point of the
    war.
  - **Masinissa**: king of the Massylii from c. 206 BCE,
    serving in Carthaginian armies in Iberia until his
    defection to Rome in 206 BCE; subsequently king of a
    unified Numidia after defeating Syphax of the
    Masaesyli in 203 BCE. The Massylii were the
    consolidating faction of the post-Zama Numidian
    political configuration.

  The Massylii's specialist contribution to Carthaginian
  armies was light cavalry: skirmishing horsemen armed
  with javelins, riding without saddle or bridle in the
  characteristic Numidian style. Numidian cavalry was the
  arm Hannibal most consistently used to envelop
  larger Roman formations; the tactic at Cannae depended
  substantially on Numidian-Massylian mobility.

  Following Masinissa's consolidation of unified Numidia
  in the early 2nd century BCE and the Roman destruction
  of Carthage in 146 BCE, the Massylii became the core
  of the Roman client kingdom of Numidia under Masinissa's
  successors. The confederation as a distinct political
  entity persisted until the 46 BCE incorporation.
