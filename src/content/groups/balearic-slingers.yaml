summary: >
  Specialist mercenaries from the Balearic Islands —
  Mallorca, Menorca, and (with the Carthaginian colony at
  Ebusus) Ibiza — whose particular skill with the sling made
  them the most consistently employed missile-troops of
  Carthaginian armies from the 6th century BCE through
  the 146 BCE destruction. The slingers were renowned
  through the ancient Mediterranean for accuracy at
  unusual ranges; surviving accounts (Diodorus 5.18, Strabo
  3.5) describe Balearic boys trained from childhood by
  having their bread suspended out of reach until they
  could knock it down with a sling.

  Each slinger reportedly carried three slings of varying
  length for different range bands: short for close work,
  medium for skirmishing, long for extreme range. Lead
  sling-bullets recovered from Punic and Roman-period
  battlefields are often Balearic-stamped and constitute
  one of the most-recovered artifact types from
  Mediterranean military archaeology.

  Balearic slingers appear in essentially every major
  Carthaginian battle for which detailed orders of battle
  survive: at Crimisus (341 BCE) where their accurate
  missile-fire troubled the Greek hoplite line; at the
  Trebia, Trasimene, and Cannae as Hannibal's principal
  light-infantry missile component; at Zama where their
  Numidian-cavalry cooperation was insufficient against
  Scipio's reformed Roman tactics. After the destruction
  of Carthage they were employed by Rome itself in the
  2nd and 1st centuries BCE.

  The Balearic Islands' Carthaginian alignment across the
  Punic period was probably less formal alliance than
  practical commercial-political integration: the
  Carthaginian colony at Ebusus and the Balearic-Carthaginian
  shipping ties produced the recruitment patterns the
  slingers' employment reflects. The economic
  significance of Balearic mercenary service for the
  islands themselves was substantial enough that Roman
  conquest of the Balearics in 123 BCE was justified in
  part as eliminating a long-standing source of
  professional military labor.
