summary: >
  The western of the two principal Numidian confederations,
  occupying central and western Algeria from the limits of
  the Massylian zone west to the Mauretanian frontier. The
  Masaesyli were the larger and historically more powerful
  Numidian confederation through the late 4th and 3rd
  centuries BCE, but their elimination as an independent
  political entity in 203 BCE made them the briefer
  surviving presence in the post-Zama record.

  The principal Masaesylian figure in the surviving
  Carthaginian record is **Syphax**, king of the Masaesyli
  from approximately 215 BCE through his capture in 203 BCE.
  Syphax's diplomatic career across the SPW is the clearest
  surviving instance of Numidian political agency exercised
  through marriage and treaty: he negotiated alliances
  alternately with Rome (early phase, 213-205 BCE, including
  the famous joint embassy from both Scipio Africanus and
  Hasdrubal Gisco) and Carthage (later phase, after his
  marriage to Hasdrubal Gisco's daughter Sophonisba in 206
  BCE), with the choice depending on what each metropolitan
  power could offer in return.

  Syphax's defeat by Masinissa and Scipio at the Great
  Plains in 203 BCE, his capture, and his deportation to
  Rome (where he died c. 202) ended the Masaesylian
  confederation as an independent political entity. The
  Masaesylian territory was incorporated into Masinissa's
  unified Numidian kingdom — the political configuration
  that would, fifty years later, provide the casus belli
  for the Third Punic War through Masinissa's encroachments
  on Carthage.

  The Masaesyli contributed cavalry contingents to
  Carthaginian armies on the same model as the Massylii:
  light skirmishing horse riding without saddle or bridle.
  The confederation's specific cavalry contributions to the
  Carthaginian field forces of 218-203 BCE are imperfectly
  preserved in the surviving sources, but the Masaesylian
  alignment was the structural reason Hannibal's African
  recall in 203 was a strategic rather than tactical
  necessity: the Masaesylian collapse left Carthage
  without effective cavalry capacity at home.
