summary: >
  An Iberian people of the interior Catalan Pyrenean foothills,
  occupying the territory inland of Barcino (modern Barcelona) and
  Tarraco (modern Tarragona) — roughly the modern Bages, Solsonès,
  and Berguedà comarques and the upper Llobregat basin. The
  Lacetani sat at the geographic and political hinge of the
  northeastern Iberian theatre: north of the Ilergetes, south of
  the Pyrenean passes, inland of the coastal Laeetani (a separate
  but easily confused people), and adjacent to the Cessetani of
  the Tarraco region.

  In the Second Punic War the Lacetani appear as one of the
  smaller Iberian peoples whose alignment was sought by both
  Carthaginian and Roman commands without ever becoming the
  decisive force the Ilergetes became. They participated in the
  Iberian operations after Scipio's capture of New Carthage,
  generally on the anti-Roman side, and were among the peoples
  Scipio's deputies brought to terms in the 205–203 BCE
  consolidation of Roman control of northeastern Iberia.

  The fullest record of the Lacetani comes from the Roman
  campaigns of the early 2nd century BCE, principally Cato the
  Elder's praetorian command in 195 BCE during which Cato
  campaigned against Lacetani strongholds in the Pyrenean
  foothills. Livy preserves an account of Cato's siege of the
  Lacetani capital and the negotiations that followed; the
  episode is one of the more substantial Livian descriptions of
  Roman dealings with a small Iberian people, and it captures
  the asymmetric character of Roman counter-resistance against
  inland Iberian polities that had no role comparable to the
  Ilergetes' in the original SPW alignment.

  The frequent confusion between Lacetani (interior) and
  Laeetani (coastal) in the Latin sources, and in some modern
  scholarship that follows them, is a real philological problem;
  the entry here adopts the standard ancient identification of
  the Lacetani as the inland people, with the Laeetani as a
  separate coastal group of the lower Llobregat.
