summary: >
  The pre-Roman civilization of central Italy — a confederation
  of city-states (Tarquinia, Caere, Veii, Vulci, Volterra, and
  others) whose political and economic alliance with Carthage
  across the 6th and 5th centuries BCE was the structural
  basis of western Mediterranean strategic configuration
  before Roman ascendancy. The Etruscan-Carthaginian alliance
  is one of the most consequential ancient Mediterranean
  partnerships of the period and the principal reason the
  western Mediterranean's 6th-5th-century BCE political
  geography was Carthaginian-Etruscan rather than purely
  Carthaginian.

  The alliance's defining moment was the Battle of Alalia
  (c. 535 BCE), in which a combined Carthaginian-Etruscan
  fleet of 120 ships engaged the Phocaean Greek fleet of 60
  off the eastern coast of Corsica. The engagement was a
  tactical Phocaean victory at prohibitive strategic cost
  (the famous "Cadmean victory" of Herodotus); the
  Phocaean withdrawal from Alalia confirmed Carthaginian-
  Etruscan control of the western Mediterranean for the
  next 250 years.

  Beyond Alalia, the Etruscan-Carthaginian alliance is
  attested in the **Pyrgi tablets** — three gold sheets
  with parallel Etruscan and Phoenician inscriptions
  recording a 6th-century treaty or dedication between
  Etruscan Caere and a Carthaginian-aligned political
  authority. The tablets, discovered in 1964 at the
  Pyrgi sanctuary on the Etruscan coast, are one of the
  most important surviving epigraphic documents for
  Phoenician-Etruscan relations and the principal
  bilingual inscription in either language.

  Etruscan political decline from the late 5th century
  BCE — through Roman conquest of Veii in 396 BCE and
  the gradual Roman absorption of central Italy across
  the 4th century — eliminated the alliance's structural
  basis well before the First Punic War. By 264 BCE
  Etruscan independence had effectively ended; Etruscan
  cities provided merchant shipping for Roman operations
  during the Punic Wars (including, possibly, the
  vessels for Appius Claudius Caudex's 264 BCE crossing
  to Sicily) on the same basis as other Roman Italian
  allies.

  The Etruscan religious and cultural inheritance —
  particularly the haruspical divinatory tradition —
  passed substantially to Rome and persisted as a Roman
  institutional element through the imperial period. The
  Etruscans' distinctive cultural and political identity
  did not survive Roman absorption, but their material
  legacy in central Italian archaeology is extensive and
  the linguistic record preserved in inscriptions
  remains the most substantial surviving non-Indo-
  European Italian language.
