summary: >
  The Celtic-Gallic peoples of the Po valley and surrounding
  northern Italy — a confederation of distinct tribes
  (principally the Insubres, Boii, Cenomani, and Senones)
  whose anti-Roman alignment provided Hannibal with the
  immediate strategic basis for his Italian campaign of
  218-203 BCE. The Cisalpine Gauls were Hannibal's
  numerically largest source of additional troops in Italy:
  the army that crossed the Alps had been reduced to
  approximately 26,000 effectives by the descent into the
  Po valley; Cisalpine Gallic recruitment doubled that
  figure within months.

  The Cisalpine-Gallic anti-Roman position was structurally
  motivated rather than opportunistic. Roman expansion into
  the Po valley across the 220s BCE — culminating in the
  Roman victory at Telamon in 225 BCE that destroyed the
  Gallic invasion of central Italy and produced the Roman
  colonization of Cisalpine territory at Placentia and
  Cremona — had created exactly the kind of population of
  recently-conquered tribes whose alliance Hannibal's
  strategic plan required.

  Cisalpine Gallic troops formed substantial portions of
  Hannibal's field armies through the Italian campaign:

  - **Trebia (218 BCE):** Gallic infantry contributed
    substantial frontline numbers; the engagement consolidated
    the Gallic alliance.
  - **Lake Trasimene (217 BCE):** Gallic light troops
    occupied the ambush positions on the lake's wooded
    shore.
  - **Cannae (216 BCE):** Gauls and Iberians together
    formed the forward-projecting center of Hannibal's
    crescent — the formation that absorbed the Roman
    assault while retreating in measured fashion to draw
    the legions into the envelopment.
  - **Subsequent Italian operations:** Gallic recruitment
    sustained Hannibal's Italian forces through the
    long attritional phase after Cannae, declining only
    as Roman counter-pressure on Cisalpine territory
    forced Gallic withdrawal back home in the late 210s
    and 200s BCE.

  Gallic military dress and equipment in Hannibal's army
  was distinctive and well-attested in the surviving
  sources: many Gauls fought stripped to the waist or
  naked, with long Celtic swords and large oval shields,
  in marked contrast to Carthaginian and Iberian troops'
  more conventional Mediterranean equipment. Polybius
  treats the visual contrast at Cannae as a feature of
  the formation's psychological impact.

  Roman reconquest of Cisalpine Gaul after the Second
  Punic War — through campaigns of 200-191 BCE that
  destroyed Boian political independence and forced
  Insubrian submission — was a direct response to the
  alliance pattern Hannibal had exploited. The strategic
  lesson was specifically that Cisalpine Gaul had to be
  fully Romanized rather than left as a separately-
  administered conquered zone.
