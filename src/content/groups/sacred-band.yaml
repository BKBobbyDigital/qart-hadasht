summary: >
  An elite infantry formation of Carthaginian citizens, known from Greek
  accounts of Carthage's wars in Sicily and Africa in the later fourth
  century BCE. Its distinguishing feature was citizenship: in armies
  that relied heavily on subject levies, allies and paid troops, the
  Sacred Band was made up of Carthaginians themselves, men of standing
  and wealth.

  Diodorus is the source that names it. At the Crimisus, where Timoleon
  of Corinth caught a Carthaginian army crossing a swollen river in a
  storm, he says the Carthaginians of the Sacred Band, 2,500 in number
  and drawn from citizens distinguished for courage, reputation and
  wealth, fought hard and were all cut down (16.80.4). Plutarch, without
  naming the unit, says that 3,000 of the dead were Carthaginians, men
  unsurpassed in birth, wealth and reputation, and that so many native
  Carthaginians had never before fallen in a single battle (*Timoleon*
  28). The loss fell on the families that ran the city.

  The Crimisus did not end the formation. In 310, when Agathocles landed
  in Africa, the Carthaginian generals did not wait for troops from the
  countryside or the allied cities but led out the citizens themselves,
  at least 40,000 infantry, and Diodorus places the Sacred Band on the
  right wing under Hanno, where it pressed the Greeks hard until Hanno
  fell (20.10.5–6, 20.12.3). The unit had been rebuilt, or had survived
  in part, within a generation.

  After 310 the Sacred Band disappears from the record, and the armies
  of the Punic Wars are described without it. Whether it lapsed, was
  merged into other citizen formations, or simply goes unmentioned in
  sources focused on other things is not known. Its history is evidence
  that Carthage kept a citizen military tradition alongside its paid and
  allied troops, and that it could put large numbers of citizens in the
  field when the city itself was threatened. The wider question of how
  Carthaginian armies were composed is treated in the
  [editorial take on the Carthaginian army](/editorialTakes/carthaginian-army-institutionally-mixed).

  Why the unit was called "sacred" is not explained by the sources. The
  name echoes the famous Sacred Band of Thebes, and Greek writers may
  have applied a familiar label to a Carthaginian institution.
