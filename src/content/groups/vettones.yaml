summary: >
  An Iberian people occupying the upper Tagus river region
  of central-western Iberia (modern provinces of Cáceres,
  Salamanca, and Ávila in Spain).

  They are best known for the death of Hamilcar Barca, and the
  attribution rests on one sentence in one author.
  [Nepos](/sources/nepos-hamilcar) writes that Hamilcar was killed
  fighting in battle against the Vettones in the ninth year after he
  came into Spain (*Hamilcar* 4.2). No other source names them in this
  connection: [Polybius](/sources/polybius-histories) says only that he
  died against one of the most warlike and powerful tribes (2.1.8),
  [Diodorus](/sources/diodorus-library) names a king of the Orissi
  at Helike (25.10.3), and [Appian](/sources/appian-iberica) has a
  combination of Spanish kings and the burning ox-drawn wagons
  (*Iberica* 5). The wagons are sometimes credited to this page's
  people, and to Diodorus; they belong to Appian and Cassius Dio, who
  name no people at all. The traditions are set out separately on
  [the death event](/events/death-of-hamilcar-at-helike).

  Nepos's attribution also sits oddly with the geography. The Vettones
  held the upper Tagus, while Helike, the only place any source puts
  the death at, is placed in the southeastern interior. Either the
  campaign ranged much further north than the Diodoran account
  suggests, or the two traditions are not describing the same
  engagement.

  The competing attribution is better supported. Diodorus not only
  names the king of the Orissi but follows the consequence: Hasdrubal's
  first act in command was to attack that king, kill the men
  responsible for Hamilcar's rout, and take the Orissi's twelve cities
  (25.12). One sentence in Nepos stands against a sequence in Diodorus,
  and the site treats the Vettones as the weaker of the two traditions
  without discarding it.

  Beyond the Hamilcar episode, the Vettones appear in the
  surviving record principally as one of the central-
  Iberian peoples Hannibal's pre-Italy campaigns of 221-220
  BCE engaged. The Vettones are listed in some sources
  among the Carpetani-Vaccaei coalition that Hannibal
  defeated at the Tagus in 220 BCE, though the precise
  tribal composition of the coalition is preserved
  inconsistently across Polybius and Livy.

  Roman conquest of Vettonian territory occurred in stages
  across the 2nd century BCE, with substantial integration
  into the Roman provincial system by the early 1st
  century. The Vettones survived as a distinct ethnic
  identity into the early imperial period, with
  Vettonian-style stone bull statues (*verracos*)
  preserved as one of the more distinctive surviving
  classes of pre-Roman Iberian sculpture.
