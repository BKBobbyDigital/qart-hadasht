summary: >
  A Celtiberian people of the northwestern Meseta, occupying the
  middle Duero basin in what is now the modern region of Castile
  and León (centered on the area of modern Valladolid, Salamanca,
  and Zamora). The Vaccaei were known to ancient sources as
  agricultural: Diodorus Siculus describes a system of communal
  cultivation and redistribution among them, the most famous
  surviving description of a non-Greco-Roman agrarian institution
  from western antiquity, though the reading is contested and may
  be a Greek ethnographic projection rather than a historical
  reconstruction.

  The Vaccaei enter Carthaginian history in 220 BCE as the second
  major target of Hannibal Barca's pre-Saguntum consolidation
  campaign. After subduing the Olcades earlier in the year,
  Hannibal moved north to the Vaccaei territory and took their two
  principal cities: Helmantica (modern Salamanca) and Arbocala
  (probably modern Toro). The campaign brought the Carthaginian
  tributary frontier deep into the northern Meseta, well beyond the
  reach of any earlier Punic operation. The famous Battle of the
  Tagus that closed the year was fought against a Vaccaei-led
  coalition force on Hannibal's return southward, and was the
  tactical demonstration that probably more than any other
  established his command authority in the eyes of the Iberian
  Carthaginian army.

  After Carthage's defeat in the Second Punic War the Vaccaei
  remained independent of Rome and were the focus of repeated
  Roman campaigns through the 2nd century BCE, culminating in
  the destruction of Numantia in 133 BCE. Though Numantia
  itself was an Arevaci rather than Vaccaei city, the two
  peoples were closely allied and Roman counter-operations
  often took both as a single front. The Vaccaei were
  effectively brought under Roman administration only with the
  early imperial Cantabrian Wars (29–19 BCE), more than a
  century after their first appearance in Carthaginian-period
  sources.
