  notes: >
    The dynasty's effective end is conventionally placed at
    Himilco's suicide in 396 BCE following the Syracuse
    plague, after which the senatorial reaction (the founding
    of the Council of 104, on Justin's account) constrained
    Magonid family operation. The family's later members
    appear sporadically in the surviving record but no longer
    as a coordinated dynasty.
summary: >
  The aristocratic family that dominated Carthaginian political
  and military leadership for more than a century and a half,
  from approximately 550 BCE through the Syracuse catastrophe
  of 396. Founded by [Mago I](/people/mago-i) — the figure
  Justin (18.7) credits with the structural reorganization of
  the Carthaginian armed forces and the establishment of the
  hereditary military command pattern that would characterize
  the dynasty — the Magonids ran the city through a
  combination of senatorial standing and effectively
  hereditary battlefield command, operating within and through
  the formal Carthaginian institutions but with a degree of
  family concentration that would eventually produce
  institutional reaction.

  The dynasty's principal figures across five generations:

  - **Mago I** (fl. ~550 BCE) — founder; military reorganizer
  - **Hasdrubal son of Mago** (fl. ~530 BCE) — early
    Sardinian operations; killed in battle against the
    Nuragic interior
  - **Hamilcar (the Magonid)** (fl. ~480 BCE) — Mago I's
    grandson; commander at the [Battle of Himera](/events/battle-of-himera)
    where he was killed
  - **Hannibal son of Gisco** (fl. ~410-406 BCE) — commander
    of the Selinus-Himera-Akragas-Gela campaign of the
    [Second Sicilian War](/events/second-sicilian-war);
    died of plague at Akragas
  - **Himilco** (fl. ~406-396 BCE) — Hannibal son of Gisco's
    successor; conducted the [Carthaginian counter-offensive](/events/wars-of-dionysius)
    against Dionysius I; the [plague at Syracuse](/events/siege-of-syracuse-and-plague-396)
    destroyed his army; suicided on return to Carthage

  The family's distinctive operational mode combined three
  features: hereditary military command (transferred within
  the family across generations rather than competitively
  appointed by the senate); persistent Sicilian engagement
  (the principal external theatre of all five generations'
  major operations); and substantial concentration of
  political authority within the family network at Carthage.
  Aristotle's praise of the Carthaginian *politeia* in
  *Politics* II.11, written approximately fifty years
  after the dynasty's effective end, analyzes a system
  that had been substantially shaped by the post-Magonid
  reaction; the institutional configuration he describes
  was the product of constraining the kind of family
  concentration the Magonids had embodied.

  The dynasty's end is structurally consequential. The
  founding of the [Council of 104](/institutions/council-of-104)
  in the post-Magonid period, Justin (19.2) attributes
  it to the senatorial reaction against accumulated
  Magonid family power, is the institutional response
  that would shape Carthaginian governance through the
  rest of the Punic period. The family-and-institution
  tension the Magonid period had embodied persisted, but
  in modulated form: the [Barcid family](/groups/barcids)
  of the third century would face the same structural
  question Magonid descendants had, how to operate
  effective military command authority within senatorial
  oversight, and would solve it through Iberian
  geographic distance rather than through the metropolitan
  command-monopoly the Magonids had practiced.
