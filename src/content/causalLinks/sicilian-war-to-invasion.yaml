slug: sicilian-war-to-invasion
cause: third-sicilian-war
effect: agathocles-invasion-of-africa
relation: produced the strategic crisis that drove
confidence: attested
mechanism: |
  The Sicilian War's catastrophic course for Agathocles in 311–310 BCE,
  defeat at the Himera River, loss of most of Greek Sicily, the siege of
  Syracuse, the depletion of his treasury, the deterioration of his
  political position at home, created the strategic crisis that the
  African invasion was a desperate response to. Diodorus (20.3) gives
  his reasoning: that an inexperienced Carthaginian citizenry would lose
  to veterans, that Carthage's Libyan subjects would revolt, that the
  unravaged country would supply plunder, and that the war would be
  drawn away from Syracuse and Sicily. The causal connection is direct and
  consciously articulated in the surviving narrative tradition.
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "20.3"
    passage_summary: >
      Diodorus narrates Agathocles's decision to invade Africa as a
      direct strategic response to the Sicilian situation, with the
      explicit aim of compelling Carthage to fight at home rather than
      maintain pressure in Sicily.
  - source: justin-epitome
    stance: supports
    passage_ref: "22.4"
    passage_summary: >
      Justin's epitome of Trogus preserves substantively the same
      causal narrative.
notes: >
  The reverse causation also holds, though not by a recall: Carthage
  asked Hamilcar son of Gisco for help and he sent 5,000 men home
  (Diodorus 20.15–16), and his failed attack on Syracuse in 309, in
  which he was captured and killed, came while the war in Africa
  absorbed Carthage's attention. That feedback effect is treated in
  the narrative rather than as a separate causal link, since the two
  events are best read as phases of a single conflict whose tactical
  geography Agathocles deliberately changed.
