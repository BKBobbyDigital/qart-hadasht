slug: declaration-of-war-218
title: "The 218 BCE declaration of war across the ancient sources"
subject_event: roman-declaration-of-war-218
summary: >
  The formal Roman declaration of war on Carthage in March
  218 BCE — preserved as the famous scene in which the
  senior Roman envoy gathers a fold of his toga to dramatize
  the choice between peace and war and lets it fall when the
  Carthaginian senate's response is unsatisfactory — is one
  of the most theatrical moments in the surviving Punic
  Wars record. Polybius 3.20–21 and 3.33 preserves the
  episode analytically as the procedural conclusion of the
  diplomatic exchanges following Saguntum's fall; Livy
  21.18–19 expands the scene with developed formal speeches
  and dramatic detail. The comparison surfaces the broader
  question of how much of the surviving theatricality is
  authentic diplomatic behavior versus how much is later
  literary elaboration of a memorable procedural gesture.

source_passages:
  - source: polybius-histories
    passage_ref: "3.20–21, 3.33"
    paraphrase: >
      Polybius preserves the embassy as procedural and
      analytical. The Roman ambassadors, led by Quintus
      Fabius Maximus (a different figure from the later
      Cunctator) and including the other principal
      embassy members, reached Carthage in early 218 BCE.
      They demanded the surrender of Hannibal and his
      principal lieutenants on the grounds of the
      Saguntum siege. The Carthaginian senate's response
      was a legal defense of Hannibal's actions — Saguntum
      was outside the Ebro Treaty zone, Saguntine intrigues
      had provided the casus belli, the Roman protection
      of Saguntum had been established outside formal
      treaty arrangements. The senior Roman envoy then
      performed the dramatic toga-gesture: he gathered a
      fold of his toga and declared that it contained
      peace and war, and asked the Carthaginian senate
      which they would have. The Carthaginian response, "whichever you choose" or similar, produced the
      release of the toga-fold and the declaration of
      war. Polybius preserves the gesture in straightforward
      analytical-procedural mode without developed formal
      speeches.
    source_note: >
      Polybius's analytical-procedural reading is consistent
      with his broader methodological approach. The
      toga-gesture itself is preserved in straightforward
      terms; the rhetorical elaboration around it is
      minimal compared to the Livian treatment.
  - source: livy-auc
    passage_ref: "21.18–19"
    paraphrase: >
      Livy expands the scene with substantial dramatic
      detail and developed formal speeches. The
      Carthaginian senate's legal defense of Hannibal is
      rendered as an extended formal address; the Roman
      response is developed as a counter-address; the
      toga-gesture is rendered with substantially more
      theatrical detail; the Carthaginian response is
      given as a developed formal answer rather than as
      Polybius's brief acknowledgment. The scene becomes a
      set-piece of Latin rhetorical historiography rather
      than the procedural climax of an embassy.
    source_note: >
      Livy's expansion is characteristic of his approach
      throughout the SPW outbreak narrative: where
      Polybius preserves an event with analytical detail,
      Livy frequently expands it with developed formal
      speeches that bear the marks of Latin
      rhetorical-historiographical convention rather than
      of authentic diplomatic record. The expansion adds
      narrative weight at the cost of analytical clarity.

points_of_difference:
  - topic: Whether the toga-gesture actually happened
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Yes. Preserved in procedural terms without
          developed rhetorical reading. The gesture is
          treated as the kind of formal-diplomatic act
          that survives in participant memory.
      - source_slug: livy-auc
        what_it_says: >
          Yes. Preserved with substantially more
          theatrical detail and developed surrounding
          speeches.
    commentary: >
      The toga-gesture itself is almost certainly
      authentic. Both sources preserve it; the specific
      gesture is the kind of formal-symbolic act that
      survives in participant memory across the
      Polybius-to-Livy transmission chain; the Roman
      diplomatic apparatus across the period used
      symbolic-procedural gestures of exactly this kind in
      formal embassy contexts (compare the
      Roman fetial-priesthood declaration of war procedure
      with its symbolic-procedural elements).
      The gesture probably happened roughly as preserved.

  - topic: The developed formal speeches
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Brief and functional. The Roman demand is
          rendered as a procedural demand; the
          Carthaginian response is rendered as a legal
          defense in summary form.
      - source_slug: livy-auc
        what_it_says: >
          Extended and rhetorically developed. The
          Carthaginian legal defense is rendered as a
          formal speech; the Roman response is rendered
          as a counter-speech; both bear the marks of
          Latin oratorical historiography.
    commentary: >
      The developed Livian speeches are almost certainly
      Latin rhetorical construction rather than
      authentic record. The pattern across Livy's SPW
      outbreak narrative, Polybius's analytical-procedural
      record expanded into developed formal speeches, reflects the conventions of Latin historiography
      under the late Republic and early Empire rather
      than the actual texture of the diplomatic exchanges.
      Modern reading should retain the broad legal-defense
      and procedural-demand structure while discounting
      the specific developed speeches.

  - topic: The "whichever you choose" response
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Brief acknowledgment from the Carthaginian
          senate, treated as the procedural close of the
          embassy.
      - source_slug: livy-auc
        what_it_says: >
          Rendered as a developed formal Carthaginian
          response with rhetorical-symbolic weight that
          fits the Latin theatrical reading of the scene.
    commentary: >
      The Polybian brief acknowledgment is preferable as
      reconstruction. The substantive point, the
      Carthaginian senate did not accept the Roman
      demand and the embassy concluded with the
      declaration of war, is well-attested across both
      sources; the specific developed speech is Latin
      elaboration.

working_reconstruction: >
  The 218 BCE declaration of war is one of the cases where
  Polybius and Livy preserve substantially the same
  procedural event with very different rhetorical
  treatments. The broad facts are well established: the
  Roman embassy reached Carthage in early 218, demanded the
  surrender of Hannibal and his lieutenants, the
  Carthaginian senate refused on legal grounds (the
  Saguntine geography, the Saguntine provocations), the
  senior Roman envoy performed the formal toga-gesture, the
  Carthaginian senate's response (probably brief) led to
  the formal declaration. The substantive sequence is
  uncontested.

  The methodological point the comparison surfaces is the
  Polybius-Livy expansion pattern: Polybius preserves the
  analytical-procedural event with brief functional
  treatment, Livy expands with developed formal speeches
  that bear Latin rhetorical-historiographical conventions
  rather than authentic diplomatic record. The pattern is
  worth surfacing on its own because it appears repeatedly
  across the SPW outbreak narrative (Saguntum embassies,
  the 218 declaration, the Carthaginian senate
  deliberations) and produces the moral-narrative texture
  that has dominated popular reception of the war's
  outbreak.

  Reading the Polybian procedural-analytical reading
  forward — with the toga-gesture preserved as authentic
  formal-symbolic act, the developed speeches discounted
  as Latin elaboration, and the substantive legal-
  diplomatic exchanges read as the actual content of the
  embassy — produces a less theatrical but more honest
  account of how the SPW actually began. The war was
  declared as the procedural conclusion of an embassy
  that the Carthaginian senate had legally-defensible
  grounds for refusing; the famous gesture marked the
  formal moment but did not produce the substantive
  outcome.

