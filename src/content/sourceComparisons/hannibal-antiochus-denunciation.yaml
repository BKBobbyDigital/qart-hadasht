slug: hannibal-antiochus-denunciation
title: "The 195 BCE denunciation of Hannibal across the ancient sources"
subject_event: hannibal-exile-and-death
summary: >
  The Roman embassy of 195 BCE that traveled to Carthage to
  demand [Hannibal](/people/hannibal-barca)'s surrender on
  charges of secret correspondence with
  [Antiochus III](/sources/livy-auc) drove him into exile and
  reshaped the political-strategic position of post-Zama
  Carthage. The specific charge (that Hannibal was sending
  letters to Antiochus's court urging him to wage war on Rome,
  and that proof had reached the Roman senate) is preserved
  in three principal sources with substantially different
  readings. Polybius's account survives only in fragments
  (much of Book 18 and the relevant material from earlier
  books is lost); Livy 33.45–49 preserves the fullest surviving
  Latin tradition with full dramatic-narrative shape; Justin's
  epitome of Trogus 31.1–2 preserves a tradition more
  skeptical of the Roman case. The
  [site's editorial take on this episode](/editorialTakes/hannibal-195-denunciation-as-fabrication)
  argues that the denunciation was very likely fabricated —
  a political move by Hannibal's domestic enemies in
  cooperation with Roman interests rather than a response to
  actual treasonable correspondence.

source_passages:
  - source: polybius-histories
    passage_ref: "fragmentary"
    paraphrase: >
      Polybius's surviving fragments preserve scattered
      detail on Hannibal's post-Zama Carthaginian political
      activity, his suffeteship of 196 BCE, and the
      subsequent denunciation. The fragments are consistent
      with a Hannibal acting as Carthaginian political
      reformer (the suffeteship reforms targeting elite
      corruption that his domestic enemies opposed) and with
      a denunciation in which the alleged correspondence
      with Antiochus served as the pretext rather than as
      the actual cause. The fragmentary preservation
      prevents reconstruction of Polybius's full reading,
      but the surviving material is consistent with a
      structural-political account of the denunciation
      rather than a literal-treasonable-correspondence
      reading.
    source_note: >
      Polybius's loss of substantive coverage on this
      episode is a major source-critical handicap. Where
      Polybius's full treatment is preserved on the FPW or
      the SPW we have a methodologically careful analytical
      account against which the Latin tradition can be
      checked; for 195 we lose that check, and the modern
      reading has to weigh Livy and Justin against each
      other plus what Polybian fragments survive.
  - source: livy-auc
    passage_ref: "33.45–49"
    paraphrase: >
      Livy preserves the fullest surviving Latin narrative.
      Hannibal's suffeteship reforms (196 BCE) had targeted
      the corruption of the Hundred and Four — the standing
      Carthaginian court that exercised oversight of
      generals and officials. The reforms produced
      substantial enemies among the elite political class
      whose income from the existing corruption was
      threatened. Livy then describes the embassy: Roman
      ambassadors arrive at Carthage with the charge that
      Hannibal has been corresponding with Antiochus,
      urging war on Rome; Hannibal, perceiving the
      embassy's intent, slips out of Carthage by night
      with a small escort, makes for the coast, and
      escapes by ship to Tyre and ultimately to Antiochus's
      court. Livy presents the embassy and the
      correspondence-charge at face value: Hannibal was
      genuinely engaged in treasonable correspondence and
      his flight confirms guilt.
    source_note: >
      Livy worked from earlier Latin annalistic sources
      that took the Roman political-diplomatic reading
      largely at face value. The face-value account of the
      charge (Hannibal was indeed corresponding with
      Antiochus, his flight confirms it) has been
      influential in popular reception but is
      methodologically vulnerable: it requires accepting
      both the Roman diplomatic claim and the
      flight-as-confirmation inference, neither of which
      is independently supported.
  - source: justin-epitome
    passage_ref: "31.1–2"
    paraphrase: >
      Justin's epitome of the lost universal history of
      Pompeius Trogus preserves the broad sequence of the
      embassy and the flight but with a substantially more
      skeptical reading of the Roman case. The denunciation
      is presented as a political move by Hannibal's
      Carthaginian enemies, the corrupt elite class
      whose oligarchic interests the suffeteship reforms
      had threatened, operating in cooperation with Roman
      interests that wanted Hannibal out of the way. The
      specific correspondence charge is presented as the
      pretext rather than as the actual cause. The flight
      is treated as the rational response to a fabricated
      charge rather than as confirmation of guilt.
    source_note: >
      Trogus (transmitted by Justin) wrote in the Augustan
      period working from earlier Greek sources, some of
      which preserved readings closer to the
      Carthaginian-perspective tradition that the Latin
      annalistic mainline largely lost. The Trogan-Justinian
      reading on the 195 episode is methodologically more
      honest than the Livian face-value account because it
      explicitly weighs the political motives of Hannibal's
      domestic enemies and acknowledges the asymmetry of
      the Roman diplomatic apparatus.

points_of_difference:
  - topic: Whether the correspondence with Antiochus actually occurred
    positions:
      - source_slug: livy-auc
        what_it_says: >
          Yes. The Roman case is presented at face value:
          Hannibal was corresponding with Antiochus, urging
          war on Rome, and the Roman senate had reliable
          intelligence to that effect.
      - source_slug: justin-epitome
        what_it_says: >
          Skeptical reading. The charge is presented as the
          pretext rather than as the actual cause; the
          political motives of Hannibal's Carthaginian
          enemies are foregrounded.
      - source_slug: polybius-histories
        what_it_says: >
          The fragments are consistent with the
          structural-political account but cannot be
          definitively interpreted in either direction
          given the loss.
    commentary: >
      The site treats the charge as very likely fabricated.
      The evidence pattern: Hannibal's suffeteship reforms
      had created powerful domestic enemies; the Roman
      diplomatic apparatus had its own interest in
      neutralizing him; the specific "evidence" the
      Roman embassy presented is not preserved in any
      surviving source in concrete-document form (no
      verbatim quotations of letters, no specific named
      intermediaries); the flight is consistent with the
      rational response to fabricated charge rather than
      with confirmation of guilt; Hannibal had been at
      Carthage for half a decade without engaging in
      anti-Roman conduct that could otherwise be
      established. The
      [editorial take on this episode](/editorialTakes/hannibal-195-denunciation-as-fabrication)
      develops the full position.

  - topic: The role of Hannibal's Carthaginian enemies
    positions:
      - source_slug: livy-auc
        what_it_says: >
          The 196 BCE suffeteship reforms had targeted
          the corruption of the Hundred and Four and
          produced enemies, but these enemies are presented
          as the legitimate political opposition Hannibal
          had genuinely earned rather than as the
          fabricators of the 195 denunciation.
      - source_slug: justin-epitome
        what_it_says: >
          The Carthaginian enemies are presented as the
          actual moving party behind the 195 denunciation,
          operating in cooperation with Roman interests
          that wanted Hannibal out of the way. The
          oligarchic class whose income from existing
          corruption the suffeteship reforms had threatened
          is foregrounded as the political-economic agent.
      - source_slug: polybius-histories
        what_it_says: >
          The fragments preserve the political opposition
          context but cannot be definitively interpreted on
          the question of whether they manufactured the
          denunciation or merely supported it.
    commentary: >
      The Justinian account is methodologically more honest.
      The political-economic logic — that the reforms
      threatened the income of the existing oligarchic
      class, that the threatened class had every motive to
      seek Hannibal's removal, that the Roman side had its
      own motives for the same outcome, and that
      cooperation between the two would have been the
      rational political move on both sides — is consistent
      with how Carthaginian and Roman political-diplomatic
      operations worked across the period. The Livian
      face-value account requires accepting a Roman case
      that has none of the documentary specificity Roman
      diplomatic cases ordinarily had.

  - topic: The reading of Hannibal's flight
    positions:
      - source_slug: livy-auc
        what_it_says: >
          Flight as confirmation of guilt. Hannibal,
          perceiving the embassy's intent, slips out by
          night to escape arrest. The inference Livy draws
          is that he fled because he was guilty.
      - source_slug: justin-epitome
        what_it_says: >
          Flight as rational response to a fabricated
          charge. Hannibal, perceiving that the political
          combination against him made his position
          untenable, removed himself rather than be
          surrendered to Roman custody on a fabricated
          basis.
    commentary: >
      The flight-as-rational-response account is
      methodologically more honest. Flight from a
      fabricated charge that one cannot disprove, particularly in a political context where the
      domestic opposition is allied with the diplomatic
      power demanding surrender, is the rational move
      regardless of guilt or innocence. The inference
      from flight to guilt is the kind of move Roman
      political-diplomatic rhetoric routinely made and
      that the surviving Latin annalistic tradition then
      preserved at face value. Modern source-critical
      reading should resist the inference.

working_reconstruction: >
  The site's working reading on the 195 BCE denunciation:
  the correspondence-with-Antiochus charge was very likely
  fabricated, the political move was a coordinated action
  between Hannibal's Carthaginian enemies (whose oligarchic
  interests his 196 BCE suffeteship reforms had threatened)
  and Roman diplomatic interests (which wanted Hannibal
  out of the way as a potential strategic threat in any
  future eastern Mediterranean conflict), and the flight
  was Hannibal's rational response to a political
  combination against him that he could not have
  defeated within Carthaginian political institutions.
  The
  [editorial take on this episode](/editorialTakes/hannibal-195-denunciation-as-fabrication)
  develops the full position.

  Methodologically the comparison is one of the clearest
  cases on the site where the Polybian loss is genuinely
  consequential. With Polybius's full treatment available
  the Latin tradition's face-value account could be
  checked directly; without it, the modern reading has to
  weigh Livy against Justin and infer the structural
  political logic. The Justinian account is preferable
  because the political-economic logic it preserves is
  consistent with how Carthaginian and Roman politics
  actually worked across the period; the Livian account
  requires accepting a Roman diplomatic claim that has
  none of the specific documentary substance such claims
  ordinarily carried.

  The deeper point is that 195 BCE represents the
  political settlement of the SPW completing itself in
  the inter-war period: Carthage's most capable military
  and political figure is removed from his city not by
  Roman military pressure but by the cooperation of his
  domestic political enemies with Roman diplomatic
  interests. The mechanism is fabrication; the reading
  the surviving sources impose on the mechanism is
  largely the Livian face-value account that has shaped
  popular reception. The site's reading reads against
  the surviving reading.

