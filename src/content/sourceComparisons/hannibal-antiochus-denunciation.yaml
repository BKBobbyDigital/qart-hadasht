slug: hannibal-antiochus-denunciation
title: "The 195 BCE denunciation of Hannibal across the ancient sources"
subject_event: hannibal-exile-and-death
summary: >
  In 195 BCE Hannibal's opponents at Carthage told their Roman contacts
  that he was conspiring with Antiochus III, a Roman embassy came to
  Carthage, and [Hannibal](/people/hannibal-barca) fled to the east,
  where he did become an adviser to Antiochus against Rome. Three
  accounts survive. Livy (33.45–49) gives the fullest narrative and
  appears to accept the charge, while showing where it came from.
  Justin's epitome of Pompeius Trogus (31.1–2) calls the charge false
  and makes the Roman mission darker. Nepos (*Hannibal* 7) records the
  embassy and the flight without judging the charge. Polybius, who would
  have been the best witness, survives only in fragments that do not
  cover the episode. The sources agree on who made the accusation and
  why; they disagree on whether it was true. The site's position is in
  the
  [editorial take on the denunciation](/editorialTakes/hannibal-195-denunciation-as-fabrication).

source_passages:
  - source: livy-auc
    passage_ref: "33.45–49"
    paraphrase: >
      As suffete Hannibal passes a law that the judges, who had held
      office for life, are to be chosen annually with no one serving two
      years running, and exposes the embezzlement of public revenues,
      showing that the installments to Rome can be paid without taxing
      citizens (33.46). The leading men he has offended write to their
      friends at Rome that he is exchanging messengers and letters with
      Antiochus and receiving the king's agents (33.45). Scipio Africanus
      long opposes acting on this, holding it beneath Rome's dignity to
      take up the quarrels of Hannibal's accusers (33.47). Servilius,
      Marcellus and Culleo are sent, officially to settle a dispute
      between Carthage and Masinissa; Hannibal, seeing that he is their
      real target, shows himself in public all day and leaves at
      nightfall, sailing by way of Cercina to Tyre and then to Antiochus
      at Ephesus (33.47–49).
    source_note: >
      Livy writes nearly two centuries later from earlier Latin and Greek
      sources. He appears to accept the correspondence as real, but he
      does not present the charge as disinterested: he names the
      accusers, gives their motive, and preserves a leading Roman's
      objection to Rome's involvement.
  - source: justin-epitome
    passage_ref: "31.1–2"
    paraphrase: >
      Hannibal's enemies inform the Romans that he has joined Antiochus,
      saying that a man used to command cannot live under the laws and is
      always looking for war. The charges, though false, are believed by
      the fearful. The senate sends Cn. Servilius to Africa, ostensibly as
      an envoy, with secret instructions to bring about Hannibal's death
      through his enemies if he can. Hannibal learns of it, spends the day
      in the forum, rides at evening to his estate by the sea, and sails
      with ships he has kept ready to Antiochus.
    source_note: >
      Justin's epitome, probably of the third century CE, abridges the
      Augustan-era universal history of Pompeius Trogus, which drew on
      Greek sources. It is the only surviving source that calls the
      charges false, and it is openly hostile to Roman conduct.
  - source: nepos-hannibal
    passage_ref: "7"
    paraphrase: >
      After serving as chief magistrate at Carthage, Hannibal sees Roman
      envoys arrive and, believing they have come to demand his surrender,
      boards a ship secretly before the senate receives them and escapes
      to Antiochus in Syria. Carthage sends two ships after him,
      confiscates his property, razes his house to its foundations and
      declares him an exile.
    source_note: >
      Nepos's short Latin biography, written in the first century BCE,
      is sympathetic to Hannibal but says nothing here about accusers or
      the truth of the charge.

points_of_difference:
  - topic: Whether Hannibal was already in contact with Antiochus
    positions:
      - source_slug: livy-auc
        what_it_says: >
          Apparently yes: the letters and messengers are reported as
          fact, and Livy does not dispute them.
      - source_slug: justin-epitome
        what_it_says: >
          No. The charges are called false, believed only by the fearful.
      - source_slug: nepos-hannibal
        what_it_says: >
          Silent. Nepos gives Hannibal's belief about the envoys' purpose
          but not the charge.
    commentary: >
      This is the question the sources cannot settle. Livy's acceptance
      and Justin's denial are both real evidence, and the loss of
      Polybius removes the witness who might have decided between them.
      Some arguments that have been used on the fabrication side are
      weak: the absence of surviving letters or named intermediaries is
      an argument from silence, and Hannibal's lack of an immediate
      command at Antiochus's court does not show there had been no
      earlier contact. The site leans toward fabrication or exaggeration
      on the strength of Justin's denial and the accusers' evident
      interest, while holding that some contact before the flight cannot
      be excluded.

  - topic: Who brought the charge, and why
    positions:
      - source_slug: livy-auc
        what_it_says: >
          Leading men at Carthage whose interests Hannibal's reforms had
          damaged, writing to friends at Rome. Scipio Africanus objects
          that Rome should not serve Carthaginian faction.
      - source_slug: justin-epitome
        what_it_says: >
          Hannibal's enemies, portraying him as a man of war who could not
          live under the laws.
      - source_slug: nepos-hannibal
        what_it_says: >
          Not described.
    commentary: >
      Here Livy and Justin agree, which makes the political origin of
      the charge the most secure part of the episode. The agreement
      establishes that the accusation was weaponized by interested men;
      it does not by itself show that it was false. Livy's inclusion of
      Scipio's objection shows that a Roman tradition itself recognized
      the embassy as intervention in Carthaginian party politics.

  - topic: What the Roman embassy was for
    positions:
      - source_slug: livy-auc
        what_it_says: >
          Officially, to settle a dispute between Carthage and Masinissa;
          Hannibal understood that he was the real object.
      - source_slug: justin-epitome
        what_it_says: >
          To watch Hannibal, with secret instructions to have him killed
          through his enemies if possible.
      - source_slug: nepos-hannibal
        what_it_says: >
          Hannibal believed the envoys had come to demand his surrender.
    commentary: >
      The accounts escalate from pretext to surrender to assassination,
      and none can be checked. What they share is that Hannibal read the
      embassy as a threat to his person and left before it could act.
      His flight is consistent with guilt or innocence alike; a man
      facing Roman envoys and hostile colleagues at home had reason to
      go either way.

working_reconstruction: >
  Hannibal's reforms as suffete in 196 made powerful enemies at
  Carthage. They took their case to Rome, alleging that he was working
  with Antiochus, and found listeners in a senate already wary of him,
  despite Scipio Africanus's objection. Rome sent envoys in 195, and
  Hannibal, judging himself their target, fled and made his way to
  Antiochus. Whether the charge was true when it was made is unresolved:
  Livy accepts it, Justin denies it, Nepos does not say, and Polybius is
  lost.

  What happened next is not in dispute. Hannibal became Antiochus's
  adviser against Rome, and by 193 was sending an agent, Aristo of Tyre,
  to rally support at Carthage (Livy 34.61). His later conduct makes the
  charge plausible without proving that it was true in 195. The most
  striking reading the sources allow is that the accusation, whether
  invented or inflated, helped bring about the alliance it described.

