slug: peace-of-203
title: "The peace of 203 and who broke it"
subject_event: second-punic-war
summary: >
  After the defeat at the Great Plains and the capture of Syphax in 203,
  Carthage sued for peace. Scipio granted an armistice and terms, a
  Carthaginian embassy went to Rome, Hannibal and Mago were recalled
  from Italy, and within months the truce had collapsed: storm-driven
  Roman supply ships were seized at Carthage, the envoys Scipio sent to
  protest were attacked on their way back, and the war resumed toward
  Zama. Three accounts survive in detail, Polybius (15.1–3, 15.7–8),
  Livy (30.16–25) and Appian (*Punica* 31–34), and they disagree on
  nearly every point that bears on blame: what the Carthaginian envoys
  admitted, whether Rome ever accepted the peace, who decided to seize
  the ships, and who ordered the attack.

  The episode is also a study in blame being moved around. Carthage's
  envoys lay the war on Hannibal; Hannibal lays his recall on the
  Carthaginian senate and on Hanno; and each surviving author assigns
  the breach of the truce to a different Carthaginian body. A fourth
  witness complicates it further. Richard
  [Miles](/sources/miles-carthage-2010), in a note, points to a papyrus
  from Egypt, P. Rylands III 491, dated before about 130 BCE, which
  appears to tell the negotiations differently and does not mention
  either the seizure of the ships or the attack on the envoys. It has
  been read as evidence that those episodes were exaggerated or even
  invented in the pro-Roman tradition, and also defended against that
  reading. The site has not seen the papyrus and reports only what
  Miles says of it.

source_passages:
  - source: polybius-histories
    passage_ref: "15.1–3, 15.7–8"
    paraphrase: >
      Scipio sends three legates to Carthage to protest the seizure of
      his transports and to announce that the Roman people have
      ratified the treaty. They remind the Carthaginians that their
      envoys at Tunis prostrated themselves and confessed that Carthage
      alone had broken the original treaty, and they warn that relying
      on Hannibal is folly, since for two years he has been shut in on
      the Lacinian promontory. Most Carthaginian politicians dislike the
      harsh terms, will not give up the captured ships and hope for
      victory with Hannibal; the assembly dismisses the legates without
      an answer. A faction set on renewing the war provides an escort
      and secretly arranges for the admiral Hasdrubal to attack once
      the escort turns back, and three triremes fall on the legates'
      ship. At the parley before Zama, Scipio lists the terms of 203:
      the cession Hannibal was now offering (Sicily, Sardinia, Spain,
      the islands between Italy and Africa), plus prisoners returned
      without ransom, the war fleet surrendered, 5,000 talents and
      hostages. He says the senate agreed and the people consented.
    source_note: >
      Polybius survives only in excerpts for this stretch, and much of
      what he says about Carthaginian behavior comes through speeches
      by Roman legates and by Scipio, written by a historian close to
      the Scipionic family.
  - source: livy-auc
    passage_ref: "30.16, 30.19–25"
    paraphrase: >
      The Thirty Seniors, the most senior council at Carthage, prostrate
      themselves before Scipio and throw the responsibility for the war
      on Hannibal and his supporters. Scipio's terms: prisoners and
      deserters returned, the armies withdrawn from Italy and Gaul, Spain
      given up, the islands between Italy and Africa evacuated, the navy
      surrendered except twenty ships, grain; the indemnity Livy cannot
      fix, finding 5,000 talents, 5,000 pounds of silver and double pay
      for the troops in different authors. He says Carthage accepted any
      terms to buy time for Hannibal's return. At Rome the envoys say
      Hannibal had no orders to cross the Ebro, much less the Alps, and
      ask to return to the treaty of Lutatius; young men, they cannot
      answer questions about its terms. The senate adopts Laevinus's
      motion and dismisses them with no prospect of peace. When Roman
      transports are scattered by a storm, the senate and people,
      almost merged into one body, vote to send Hasdrubal with fifty
      ships to seize them. Scipio's protesting envoys are attacked on
      their return by quadriremes from the fleet under Hanno, on secret
      orders from Carthage or on Hanno's own responsibility. Hannibal,
      recalled, blames the senate's envy and Hanno, and curses himself
      for not marching on Rome after Cannae. He lands at Leptis.
    source_note: >
      Livy used Polybius for parts of his narrative and Roman annalists
      for others; the speeches are his compositions.
  - source: appian-punica
    passage_ref: "31–34"
    paraphrase: >
      Carthage seeks either peace or delay until Hannibal arrives. At
      Rome some senators dwell on Carthaginian faithlessness; others
      argue that Rome needs peace as much as Carthage, Italy being
      exhausted, and fear the armies converging on Scipio. The senate
      cannot agree and leaves the decision to Scipio, who makes peace:
      Mago to leave Liguria, no mercenaries, no more than thirty
      warships, Carthage confined within the "Phoenician trenches,"
      prisoners and deserters returned, 6,000 talents, and Masinissa to
      have his kingdom and as much of Syphax's as he can take. Hannibal
      sails unwillingly, distrusting Carthage's bad faith toward its
      commanders, and lands at Hadrumetum. The common people of Carthage
      plunder Scipio's storm-driven stores in spite of their council's
      warnings; Hanno the Great and Hasdrubal the Kid rescue Scipio's
      messengers from the mob and send them off in two galleys; "some
      others" send word to the admiral Hasdrubal, who attacks them.
    source_note: >
      Appian's sources cannot be identified. The site treats his
      divergences as a separate tradition rather than as corrections or
      errors.

points_of_difference:
  - topic: What the Carthaginian envoys said about responsibility
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          At Tunis they confessed that Carthage alone had broken the
          original treaty (15.1.7), as the Roman legates later remind
          them.
      - source_slug: livy-auc
        what_it_says: >
          They blamed Hannibal and his supporters (30.16), and at Rome
          argued he had made war without orders, so that the treaty of
          241 had never been broken (30.22).
      - source_slug: appian-punica
        what_it_says: >
          At Rome they asked pardon (*Punica* 31). He gives no argument
          about Hannibal's authority.
    commentary: >
      The speech in which Hannibal had "no orders" is Livy's alone, and
      it is close to the thesis of Fabius Pictor that Polybius spends
      3.8–9 refuting: that the war was a private Barcid enterprise
      undertaken against Carthage's will. It may be the Roman tradition
      speaking through Carthaginian envoys. It may also be what they
      said. In 218 Carthage had used the same argument about Hasdrubal's
      Ebro agreement, that a commander's act did not bind the state (see
      the [Saguntum comparison](/sourceComparisons/saguntum-casus-belli)),
      so the defense was part of its diplomatic repertoire. The sources
      cannot decide between these readings. Nor are Polybius and Livy
      quite opposites: a government can confess the state's fault and
      blame a general for it in the same breath.
  - topic: The terms
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Sicily, Sardinia, Spain and the islands ceded; prisoners
          returned without ransom; the war fleet surrendered; 5,000
          talents; hostages (15.7.8, 15.8.7).
      - source_slug: livy-auc
        what_it_says: >
          Withdrawal from Italy and Gaul; Spain and the islands given
          up; all but twenty ships surrendered; grain; the indemnity
          uncertain between three versions, one of them 5,000 talents
          (30.16).
      - source_slug: appian-punica
        what_it_says: >
          Mago out of Liguria; no mercenaries; thirty warships; Carthage
          within the "Phoenician trenches"; 6,000 talents; Masinissa's
          kingdom confirmed (*Punica* 32).
    commentary: >
      Polybius's 5,000 talents matches one of the figures Livy found and
      could not choose between. Appian's list differs in its figures and
      its clauses. The broad shape is common to all three: Carthage out
      of Italy and the islands, its fleet cut down, an indemnity. The
      details were already uncertain to Livy.
  - topic: Whether Rome accepted the peace
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          The senate agreed and the people consented; Scipio's legates
          announced the ratification to Carthage (15.1.3–4, 15.8.9).
      - source_slug: livy-auc
        what_it_says: >
          The senate adopted Laevinus's motion and sent the envoys away
          with no prospect of peace (30.23). When the truce broke,
          Rome's decision was not yet known in Africa (30.25).
      - source_slug: appian-punica
        what_it_says: >
          The senate could not agree and left the decision to Scipio,
          who made the peace; envoys crossed in both directions to take
          the oaths (*Punica* 32).
    commentary: >
      The three versions cannot be reconciled. The stakes are not small.
      In Livy, Carthage broke an armistice while a peace was still in
      doubt; in Polybius it broke a treaty the Roman people had
      ratified, the graver charge, and the one a historian close to
      Scipio had reason to press. Appian alone preserves senators who
      argued that Rome needed peace too, a voice Livy's senate does not
      have. Wherever the ratification is stated as fact, it rests on
      Polybius, against Livy.
  - topic: Who decided to seize the supply ships
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Most of the leading politicians and of those who deliberated,
          unwilling to give up the ships they had brought into port
          (15.2.2).
      - source_slug: livy-auc
        what_it_says: >
          The senate and the people together, "so mixed up … that they
          almost formed one body," voting unanimously to send Hasdrubal
          with fifty ships (30.24).
      - source_slug: appian-punica
        what_it_says: >
          The common people, in spite of their council's threats and
          warnings not to break the treaty (*Punica* 34).
    commentary: >
      The same act passes from a decision of the governing class, to a
      joint decision of council and people, to a mob acting against its
      council. Appian's version clears the council; Polybius's makes it
      responsible.
  - topic: Who attacked Scipio's envoys
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          A faction of politicians determined to renew the war, who
          provided the escort themselves and arranged for the admiral
          Hasdrubal to attack once it turned back (15.2).
      - source_slug: livy-auc
        what_it_says: >
          Quadriremes from the fleet under Hanno, either on secret
          orders from Carthage or on Hanno's own responsibility without
          his government's connivance (30.25).
      - source_slug: appian-punica
        what_it_says: >
          "Some others," who sent word to the admiral Hasdrubal; Hanno
          the Great and Hasdrubal the Kid had rescued the envoys from
          the mob (*Punica* 34).
    commentary: >
      The accounts do not even agree on names. Livy's fleet commander is
      a Hanno; Appian's Hanno the Great is the envoys' protector, and
      his attacker is an admiral Hasdrubal, as in Polybius. The
      possibility Livy raises, a commander acting without his
      government, is the same defense the Carthaginian envoys made for
      Hannibal. No account leaves the Carthaginian state simply guilty
      or simply innocent.
  - topic: Hannibal's view of his recall
    positions:
      - source_slug: livy-auc
        what_it_says: >
          Beaten not by Rome but by the Carthaginian senate's envy, and
          by Hanno, who has crushed his house beneath the ruins of
          Carthage; he curses himself for not marching on Rome after
          Cannae (30.20).
      - source_slug: appian-punica
        what_it_says: >
          He sails against his will, knowing Carthage's bad faith toward
          its commanders, doubting a treaty would be made or, if made,
          would last (*Punica* 33).
    commentary: >
      Both have Hannibal blaming Carthage rather than Rome, which fits
      the long hostility between the Barcids and their opponents at
      home. The regret over Cannae is Livy putting his own verdict in
      Hannibal's mouth, the same judgment the Maharbal anecdote carries,
      and it should be read as Livy's (see
      [why Hannibal did not march on Rome](/editorialTakes/cannae-march-on-rome)).

working_reconstruction: >
  In 203, after the Great Plains and the capture of Syphax, Carthage
  asked Scipio for terms and he granted an armistice. The terms
  required Carthage to leave Italy and the islands, surrender most of
  its fleet and pay an indemnity; the exact figures were uncertain even
  to Livy. An embassy went to Rome. What Rome decided cannot be
  recovered: Polybius says the senate and people ratified the peace,
  Livy that the senate rejected it, Appian that it left the matter to
  Scipio. Hannibal was recalled and sailed from Croton, where he had
  spent his last years in Italy (see [Croton](/places/croton)). Roman
  transports driven ashore near Carthage were then seized, and the
  envoys Scipio sent to protest were attacked on their way back. The
  war resumed, and ended at Zama in 202.

  On blame, the site's reading is that the breakdown happened but that
  its allocation is precisely what each tradition shaped. A Carthaginian
  party that wanted to keep fighting, strengthened by Hannibal's
  return, and a party that wanted the peace are both plain in all three
  accounts. Which body decided to seize the ships, and who ordered the
  attack, are told three ways, and the episodes themselves are absent
  from the papyrus Miles cites, which should keep any reconstruction of
  them provisional. The recurring feature is the defense of the
  unauthorized commander. Carthage used it for Hasdrubal's Ebro
  agreement in 218, its envoys used it for Hannibal in 203, and Livy
  offers it for the fleet commander in the same year. Whether that says
  something about how much independent authority Carthaginian
  commanders really held, or only about how Roman writers liked to
  describe a state they considered faithless, is a question the sources
  raise and do not answer.

