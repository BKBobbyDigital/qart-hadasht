slug: mercenary-war-atrocities
title: "The Mercenary War atrocities across the ancient sources"
subject_event: mercenary-war
summary: >
  The [Mercenary War](/events/mercenary-war) of 241–237 BCE is the war
  Polybius called "truceless": the rebels mutilated and killed the
  Carthaginian commander Gisco and some seven hundred prisoners, Hamilcar
  Barca threw captives to the elephants, the rebels trapped at the Saw ate
  their prisoners, Spendius was crucified before Tunis and the Carthaginian
  general Hannibal crucified on the same cross in reply. Polybius
  (1.65–88) is by far the fullest account. Diodorus's fragments (25.2–6)
  tell the same story in shorter and more moralizing form, and Appian
  mentions the war only in passing. The sources agree on the sequence of
  the atrocities to a striking degree; they differ on who is to blame for
  the war and on how much weight to give the rebels' grievances.

source_passages:
  - source: polybius-histories
    passage_ref: "1.65–88"
    paraphrase: >
      Polybius opens by offering the war as the best example of a
      "truceless war" and a lesson for anyone who employs mercenaries. He
      blames Carthage for the causes: it gathered the unpaid army together,
      sent it to Sicca, and asked it to give up part of its pay (1.66–67),
      and it had ruled the Libyans so harshly, taking half their crops and
      doubling the towns' taxes, that they "required no incitement to
      revolt" (1.72). He blames the soldiers too, for inventing new claims
      (1.68). Spendius, a runaway Roman slave afraid of being handed back,
      and Mathos, a Libyan afraid of punishment, wreck Gisco's
      negotiations (1.69–70). Hamilcar releases prisoners after his victory
      (1.78); the rebel leaders, afraid of that leniency, have Gisco and
      about seven hundred prisoners mutilated and thrown alive into a
      trench and resolve to torture every Carthaginian captive (1.79–81).
      Hamilcar then throws prisoners to the elephants (1.82, 1.84). At the
      Saw the starving rebels eat their prisoners and slaves; Hamilcar
      seizes their leaders when they come to negotiate and destroys the
      army of more than forty thousand (1.85). Spendius is crucified at
      Tunis, and Mathos crucifies the captured general Hannibal on the same
      cross with thirty nobles killed around it (1.86). The war ends with
      Mathos tortured through Carthage, having lasted three years and four
      months and "far excelled all wars we know of in cruelty" (1.88).
    source_note: >
      Polybius wrote about a century after the war, and his narrative is
      the source of nearly all the detail. He is not simply a moralist
      about the rebel leaders. At 1.81 he gives a theory of escalation:
      men in such a state take kindness for a trick and meet retaliation
      by outdoing it, a condition whose causes include bad upbringing and
      "habitual violence and unscrupulousness on the part of those in
      authority over them." His contempt for an army of many nations and
      languages (1.65–67) colors the account, but the practical difficulty
      he describes, an army no general could address as a body, is real.
  - source: diodorus-library
    passage_ref: "25.2–6"
    paraphrase: >
      The surviving fragments state that Carthage suffered more from this
      war than from twenty-four years against Rome, and that it came about
      because Carthage defrauded its foreign troops of their arrears (25.2).
      They list the army's peoples, including "mongrel Greek slaves." They
      record the rebels' refusal to return the bodies of Gisco's party,
      their threat against future heralds, and their decree to kill
      Carthaginian captives and send back allies with their hands cut off,
      and say that by this "impiety and cruelty" Spendius undermined
      Hamilcar's "strategy of leniency," so that Hamilcar "was in this way
      forced to abandon his kindness to prisoners" and threw captives to
      the elephants (25.3). Hippo and Utica threw their garrisons from the
      walls. Hamilcar crucified Spendius and Mathos nailed Hannibal to the
      same cross, which Diodorus reads as Fortune punishing offenders
      against humanity (25.5). Another fragment says the soldiers demanded
      excessive compensation for horses and men lost in Sicily and that the
      war lasted four years and four months (25.6).
    source_note: >
      Diodorus wrote in the first century BCE, and the Book 25 fragments
      survive in Byzantine excerpts. They follow the same sequence as
      Polybius and are, if anything, more moralizing, framed by an opening
      reflection that injustice brings misfortune on nations as well as
      individuals (25.1). They also preserve both sides of the pay dispute:
      Carthage defrauding its troops, and the troops demanding too much.
  - source: appian-punica
    passage_ref: "*Iberica* 4–5"
    paraphrase: >
      In introducing Hamilcar's Iberian command, Appian says Hamilcar had
      promised large rewards to his Celtic mercenaries and African allies in
      Sicily, which they demanded after he returned to Africa, and that this
      kindled the African war. Hamilcar's enemies later prosecuted him as
      responsible for the disaster, and he escaped punishment through his
      political connections.
    source_note: >
      Appian wrote in the second century CE. His passing reference places
      responsibility on Hamilcar's promises, a version hostile to the
      Barcids and at odds with Polybius, who has the soldiers blaming
      Hamilcar for not coming to them (1.68) but credits him with winning
      the war. The passage is cited here from Appian's *Spanish Wars*.

points_of_difference:
  - topic: Who caused the war
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Carthage, principally: its handling of the army and its harsh rule
          of Libya ("they had chiefly themselves to thank"), with the
          soldiers' mounting claims and two leaders' personal fears turning a
          dispute into a war.
      - source_slug: diodorus-library
        what_it_says: >
          Carthage defrauded its troops of their pay; in another fragment the
          troops demanded excessive compensation.
      - source_slug: appian-punica
        what_it_says: >
          Hamilcar's promises of large rewards in Sicily, which the soldiers
          then demanded.
    commentary: >
      None of the three presents the war as the work of wicked leaders
      alone. Polybius and Diodorus both blame Carthage for the unpaid army,
      and Polybius adds the Libyan grievances that made a mutiny into a war
      of survival. Appian's version shifts the blame onto Hamilcar and fits
      the political attack on him after the war; it is the least
      informative of the three, but it shows that responsibility was
      argued over in antiquity.

  - topic: How the atrocities began
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Hamilcar's release of prisoners threatened to dissolve the rebel
          army; the leaders killed Gisco and his fellow prisoners to make
          reconciliation impossible, and only then did Hamilcar begin killing
          captives.
      - source_slug: diodorus-library
        what_it_says: >
          The same sequence, stated as cause and effect: the rebels' cruelty
          undermined Hamilcar's leniency and forced him to abandon it.
    commentary: >
      This is the most important agreement in the record, and it cuts
      against both simple readings of the war. The violence did not start
      from the conditions alone, since within the same conditions Hamilcar
      had been releasing prisoners; nor was the Carthaginian side merely a
      victim, since Hamilcar's answer was a deliberate policy of
      extermination. Both sources may reflect the same tradition, possibly
      Polybius's own account, so their agreement is not independent proof,
      but nothing in the record contradicts it.

  - topic: How to judge the violence
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          The rebels became like wild beasts, but the cause lies partly in
          their treatment by those in authority; Hamilcar's reprisals are
          narrated without condemnation, and Fortune is said to have given
          both sides in turn the chance to inflict the cruelest punishments
          (1.86).
      - source_slug: diodorus-library
        what_it_says: >
          The rebels are impious offenders against humanity punished by a
          higher power; Hamilcar is praised for his services in Sicily and
          Libya, though the same fragment goes on to accuse him of
          demagoguery afterward (25.8).
    commentary: >
      Both writers condemn the rebel leaders in stronger terms than they
      use for Hamilcar, and a modern reader should not adopt that
      asymmetry: Hamilcar's elephants and his seizure of the rebel leaders
      under cover of negotiation belong to the same war. But the record
      does not support the opposite view either, that the sources invented
      rebel cruelty to excuse Carthage. The massacre of Gisco's party is
      reported in detail by both, and Polybius's own analysis spreads the
      blame more widely than his moral language suggests. The site's
      treatment is in the
      [editorial take on the war's savagery](/editorialTakes/mercenary-war-atrocity-structural).

  - topic: How long the war lasted
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Three years and four months (1.88).
      - source_slug: diodorus-library
        what_it_says: >
          Four years and four months (25.6).
    commentary: >
      The difference probably reflects different starting points, for
      example the first unrest at Carthage and Sicca in 241 or the open
      break with the seizure of Gisco. The site follows the conventional
      dates of 241–237.

working_reconstruction: >
  The sequence is well attested and the sources largely agree on it.
  Carthage, unable to pay the army it had brought back from Sicily,
  gathered the soldiers at Sicca and asked them to accept less. The
  dispute escalated while Carthage conceded claim after claim, and when
  Gisco came to pay the troops, Spendius and Mathos, each with personal
  reasons to fear a settlement, broke the negotiations and the Libyans
  seized Gisco. The Libyan countryside, taxed to exhaustion in the war,
  rose at once, and a mutiny became a war for Carthage's survival.

  The truceless character came later and was chosen. Hamilcar's early
  release of prisoners worked well enough that the rebel leaders feared
  their army would dissolve, and they killed Gisco and some seven hundred
  prisoners to make surrender unthinkable. Hamilcar answered by killing
  every captive, and from then on each side's violence justified the
  other's, down to the Saw, the crosses at Tunis and the torture of
  Mathos. Polybius's own theory at 1.81, that neither kindness nor
  retaliation can cure men once brutalized, is an ancient version of that
  dynamic. What the site discounts is the moral language both ancient
  writers attach to the rebels, not the sequence of events they report.

