slug: alps-crossing
title: "Hannibal's Alps crossing across the ancient sources"
subject_event: crossing-of-the-alps
summary: >
  Hannibal's [crossing of the Alps](/events/crossing-of-the-alps)
  in late autumn 218 BCE took fifteen days and cost him a large part
  of his army, and the pass he used has never been securely identified.
  Polybius (3.47–56) is the principal account, written by a historian
  who says he questioned men who had been there and walked the route
  himself. Livy (21.30–38) follows the same broad sequence but adds
  speeches, the famous fire-and-vinegar episode, and a frank admission
  that his own sources disagreed wildly about the army's size.

  Behind both lies an older quarrel about what kind of feat the crossing
  was. Hannibal's own Greek historians wrote it as a march through
  country no army could pass without a divine guide. Polybius answered
  that Gallic armies crossed the Alps all the time. Each version carried
  a judgment on Hannibal, and the comparison sets them side by side along
  with the questions of route, method and losses.

source_passages:
  - source: polybius-histories
    passage_ref: "3.47–56"
    paraphrase: >
      Polybius opens with a polemic (3.47–48) against historians who make
      the Alps an impassable wilderness and then need a god or hero to
      bring Hannibal through. The Celts of the Rhône, he says, had crossed
      them often and recently with large armies, and Hannibal planned the
      march with care, learning in advance about the country beyond and
      hiring native guides. He then narrates the ascent through Allobrogian
      country, the ambushes by mountain peoples, the view of the Po plain
      shown to the exhausted army, and a descent blocked by a landslide on
      old ice and fresh snow. Hannibal's men cut a new path along the cliff,
      wide enough for pack animals after a day and, with Numidians working
      in relays, for the elephants after three (3.55). The crossing took
      fifteen days, and the army reached the plain with 12,000 African and
      8,000 Iberian foot and no more than 6,000 horse (3.56).
    source_note: >
      Polybius wrote with more first-hand investigation than any other
      ancient writer on the crossing, and he says so (3.48.12): he
      inquired of men present at the time and made the passage himself.
      His topographical sequence is what modern attempts to identify the
      pass have to satisfy. He also wrote more than half a century after
      the event, through a northern Italy Rome had since conquered and
      colonized, and his polemic has targets, chiefly the Hannibal
      historians Silenus and Sosylus. His arrival figures come from the
      bronze tablet Hannibal set up at the Lacinian promontory.
  - source: livy-auc
    passage_ref: "21.30–38"
    paraphrase: >
      Livy follows Polybius's sequence and adds material Polybius lacks.
      At the summit Hannibal points out Italy and tells his men they are
      climbing the walls of Rome itself. In the descent the blocked path
      is cleared by felling trees, burning them against the rock and
      pouring vinegar on the heated stone to split it (21.37). On numbers
      Livy is candid about disagreement (21.38): estimates of the army
      that reached Italy ranged from 20,000 foot and 6,000 horse up to
      100,000 foot and 20,000 horse, and Cincius Alimentus, a Roman taken
      prisoner by Hannibal, reported losses of 36,000 men after the Rhône.
      Livy also notes the dispute over which pass was used.
    source_note: >
      Livy wrote about two centuries after the crossing, using Polybius
      and Latin annalists, and his Alpine narrative is shaped for drama
      and moral effect. His value here is partly as a witness to how much
      his sources disagreed, which Polybius's confident figures conceal.
  - source: nepos-hannibal
    passage_ref: "3.4"
    paraphrase: >
      Nepos says that no one before Hannibal had crossed the Alps with an
      army except the Greek Hercules, after whom the pass was named, and
      that Hannibal opened roads through the mountains where there had been
      only tracks.
    source_note: >
      A short Latin biography of the late Republic, useful here because it
      preserves, nearly two centuries on, the tradition Polybius was
      attacking: the crossing as a feat matched only by Heracles.

points_of_difference:
  - topic: How hard was the crossing?
    positions:
      - source_slug: nepos-hannibal
        what_it_says: >
          A feat without precedent among mortals. Only Hercules had led an
          army over the Alps before Hannibal. This is the tradition of
          Hannibal's own historians, still current in Rome in Nepos's day.
      - source_slug: polybius-histories
        what_it_says: >
          Hard but ordinary. Gallic armies from the Rhône had crossed many
          times, and not long before. Hannibal's achievement lay in
          intelligence and preparation: he knew what lay beyond and he took
          native guides.
    commentary: >
      The question sounds technical, but both answers are verdicts on
      Hannibal. The impassable Alps belong to the
      [Heraclean presentation](/claims/hannibal-campaign-heraclean-presentation)
      of the campaign: if only a hero could cross, Hannibal had joined
      the hero. Polybius's reply takes the gods out and gives the credit to
      planning, which is a compliment of a kind.

      Richard [Miles](/sources/miles-carthage-2010) (pp. 258–259) draws
      out two further edges. First, "the Gauls do it all the time" puts
      Hannibal in a line of barbarian invaders breaking into Italy, rather
      than a new Heracles. Polybius's own habits support this. He says he
      wrote up Rome's Gallic wars so that Greeks would not panic at
      sudden barbarian invasions, setting them beside the Persian
      invasion and the Gallic attack on Delphi (2.35). Gauls crossing
      mountains were, for him, a recurring type, and Hannibal came over
      with them.

      Second, Miles argues that Polybius's research trip shows his distance
      rather than his authority. By the time he walked the route, Rome had
      planted colonies across the Po country and moved whole peoples,
      among them more than 40,000 Apuan Ligurians sent to Samnium in 180
      (Livy 40.38); the people he met were settlers, not the Celts of 218,
      and a crossing through pacified country could look routine. The site
      accepts this in a narrower form. Polybius did not forget that
      northern Italy had been dangerous: he is the main surviving source
      for that danger, writing that with the Celts on its frontier Rome
      could never master Italy or be safe in Rome itself (2.13), and
      putting 50,000 foot and 20,000 horse and chariots into the Gallic
      army of 225 (2.23). He also claims informants who had been present
      in 218 (3.48.12). What the changed landscape could distort was his
      sense of the mountains themselves, and of what hostile Alpine
      peoples meant to an army on the march, since he saw the route after
      Rome had removed that threat. Hannibal came down into a Gallic war
      already under way, with the Boii and Insubres in revolt and the new
      colonies at Placentia and Cremona under attack (3.40); that political
      setting is treated on the
      [Cisalpine Gauls](/groups/cisalpine-gauls) page.

  - topic: Divine guidance over the mountains
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Rejects it outright (3.47–48). Polybius ridicules historians who
          exaggerate the Alps into an impassable wilderness and then need a
          god or hero to show Hannibal the way, like tragedians who end a
          play with a god from the machine.
      - source_slug: livy-auc
        what_it_says: >
          Keeps a version of it. Livy (21.22) reports the dream near the
          Ebro in which a godlike youth sent by Jupiter guides Hannibal
          toward Italy, followed by a vast serpent and a storm. He frames
          it as a report, not as the reason the crossing succeeded.
    commentary: >
      The writers Polybius attacks are almost certainly Hannibal's own Greek
      historians, Silenus above all, whose account of the dream survives
      more fully in Cicero (*On Divination* 1.49) as a commission from a
      council of the gods. Polybius's wording betrays the target: three
      times in the passage he wavers between "a god" and "a hero" as the
      guide, which Briquel read as the trace of Heracles-Melqart, who was
      both. The motif of a divine guide through impassable country also
      follows the model of Alexander's march to Siwah, led by snakes or
      ravens, a template the site treats in its
      [claim on the Alexander model](/claims/hannibal-alexander-model).
      Polybius's scorn is evidence twice over: that the divinely guided
      crossing was a story in wide circulation, and that the best-informed
      surviving historian treated it as literature. The site follows
      Polybius on what happened in the mountains and treats the divine
      narrative as evidence of how Hannibal's circle presented the march,
      set out in [The march as a labor](/narratives/hannibal-and-heracles).

  - topic: Which pass Hannibal used
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Does not name it, but supplies a sequence of features: the
          approach through Allobrogian country, the ambushes in a narrow
          defile, the summit view of the Po plain, the snow lying on the old
          ice at the top, and the broken path in the descent.
      - source_slug: livy-auc
        what_it_says: >
          Does not name it either, and says the question was already
          disputed in his day. His geography is looser than Polybius's and
          sometimes hard to reconcile with it.
    commentary: >
      Modern candidates include the Col du Clapier, Mont Cenis, the Little
      St Bernard, Montgenèvre and the Col de la Traversette. A 2016 study
      reported a layer of disturbed, dung-rich soil below the Traversette
      dated to around the right time, which has drawn attention to that
      pass, though the dating and its interpretation have been challenged.
      Polybius's sequence remains the test any identification has to pass.
      The question is open and treated as such under
      [which pass](/openQuestions/alps-which-pass).

  - topic: Breaking the rock
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          No fire and no vinegar. The broken stretch is rebuilt by cutting a
          path along the cliff face, one day's work for horses and pack
          animals and three for the elephants, with Numidians in relays
          (3.55).
      - source_slug: livy-auc
        what_it_says: >
          Trees are felled and burned against the rock, and vinegar is
          poured on the heated stone to split it (21.37).
    commentary: >
      The vinegar story is the most retold detail of the crossing and it is
      not in Polybius, who was interested in exactly this kind of practical
      detail and describes the road-building at length. That silence is the
      strongest reason to doubt it. The technique itself is not absurd.
      Fire-setting was a real way of breaking rock, and Pliny (*Natural
      History* 33.71) describes miners splitting hard stone with fire and
      vinegar, though whether the vinegar did any work is debated. So the
      episode may be a Latin elaboration built on a known mining practice,
      or a garbled memory of fire used somewhere on the route. What the
      evidence does not support is telling it, as popular accounts
      usually do, as the way Hannibal got down the mountain.

  - topic: How many men came through
    positions:
      - source_slug: polybius-histories
        what_it_says: >
          Precise and confident. About 50,000 foot and 9,000 horse after the
          Pyrenees (3.35); 12,000 African and 8,000 Iberian foot and no more
          than 6,000 horse on reaching the Po plain (3.56), figures he took
          from Hannibal's own inscription.
      - source_slug: livy-auc
        what_it_says: >
          No settled figure. His sources ranged from 26,000 to 120,000 men
          reaching Italy, and Cincius Alimentus put the losses after the
          Rhône at 36,000 (21.38).
    commentary: >
      Polybius's arrival figures are the best evidence, because they come
      from a document Hannibal published. They are also Hannibal's numbers,
      set up years later at a Greek sanctuary, and a general has reasons
      both to shrink the army he brought and to magnify the obstacles he
      beat. Livy's range shows that the Roman tradition had no agreed
      count at all, and that the higher figures served a story of a vast
      invading horde. How the losses divide between the march through Gaul
      and the mountains, or between Africans and Iberians, cannot be
      recovered.

working_reconstruction: >
  The broad facts are secure: a crossing of about fifteen days in late
  autumn 218 BCE, heavy losses, and an army of roughly 26,000 that came
  down into the Po plain still able to fight. The pass is not known.
  Polybius's account is the base for everything else, and his detailed
  topography is what makes the route question answerable at all.

  It is not a neutral base. Polybius was arguing with Hannibal's
  historians, and his deflation of the Alps served two purposes at once:
  it removed the gods and credited Hannibal's planning, and it placed
  Hannibal among the Gallic invaders Polybius had already written up as a
  recurring danger to civilized peoples. He also saw the route after Rome
  had conquered the country on both sides of it. Livy adds drama and the
  vinegar, but he preserves something Polybius hides, which is how little
  agreement there was about the army that came over.

  The site's reading takes Polybius on what happened, Livy on the extent
  of disagreement, and neither on what the crossing meant. For Hannibal's
  circle it was a labor worthy of Heracles; for Polybius a well-run march
  of the kind barbarians made regularly. For the Romans of 218 it was an
  enemy army arriving in the middle of a Gallic revolt, which is where its
  danger lay.

