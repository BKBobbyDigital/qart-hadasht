summary: >
  Tyrant and later king of Syracuse from 317 to 289 BCE, and Carthage's
  most dangerous Greek enemy before Rome. He was born at Therma, then
  under Carthaginian rule, rose as a soldier and mercenary captain, and
  according to Justin took power in 317 with 5,000 African troops lent by
  the Carthaginian general Hamilcar, to whom he swore loyalty (22.2);
  Diodorus tells the coup without them (19.6–9). After Hamilcar son of
  Gisco defeated him at the Himeras in 311 and besieged Syracuse, he
  invaded Africa in 310, the first foreign invasion of Carthage's
  territory, and held out there until 307, when he escaped to Sicily and
  his army, abandoned, killed his sons. The peace of 306 returned
  Carthage's Sicilian cities and paid him gold and grain (Diodorus
  20.79). He took the royal title after Alexander's Successors did, and
  died in 289, poisoned at the instigation of his grandson while
  planning a new war on Carthage (21.16). The ancient tradition about him
  was divided: Timaeus hostile, Callias paid to praise him, and Scipio
  Africanus, Polybius says, naming him with Dionysius as the statesman
  who best combined daring and wisdom (15.35). See
  [his life](/narratives/agathocles-life) and
  [the invasion](/narratives/agathocles-invasion-of-africa).
