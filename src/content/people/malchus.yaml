summary: >
  A Carthaginian general of the mid-6th century BCE, known
  almost entirely from Justin's epitome of Trogus (18.7).
  Justin's narrative is dramatic: Malchus campaigns
  successfully in Sicily; is sent to Sardinia where he
  suffers a defeat; the Carthaginian senate, in punishment
  for the defeat, exiles him along with his army; Malchus
  with his exiled army returns to Carthage by force, takes
  the city, and rules briefly before being defeated and
  killed in turn, possibly by Mago I or Mago's faction.

  The historicity of specific episodes is genuinely
  contested. Justin's Trogus-derived account preserves
  details (campaign sequences, the senatorial exile, the
  return-march coup, the execution) that may reflect a real
  6th-century political crisis or may be Hellenistic
  literary elaboration on patterns of usurper-and-tyrant
  story. The structural fact (that 6th-century Carthaginian
  political life included episodes of military commanders
  and senatorial governments in serious conflict, with
  outcomes that included exile and execution) is consistent
  with what other sources preserve. The Malchus narrative is
  the principal surviving instance of the pattern.

  Justin's account also gives Malchus the gruesome
  punishment of his son Carthalo, an episode usually
  treated as Hellenistic tragic-pattern elaboration rather
  than preserved historical detail.
