etymology: >
  The name as preserved in Justin (18.7) is generally taken
  to be a Greek-Latin transmission of the Punic title-name
  *Malik* / *Melqart* (king, sovereign), possibly indicating
  that Justin's "Malchus" is in fact a title rather than a
  proper name, a common confusion in Greek and Latin
  treatment of Punic naming. The figure may be the same as
  the Carthaginian commander Mazeus or other surviving forms.
