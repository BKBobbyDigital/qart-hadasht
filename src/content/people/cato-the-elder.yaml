summary: >
  Roman consul of 195 BCE, censor of 184 BCE, and the senator most
  associated with the destruction of Carthage. His first campaign, at
  seventeen, fell in the years when Hannibal was in Italy (Plutarch
  *Cato Maior* 1); Cicero has him at Capua in 214, at Tarentum in 209 and
  quaestor in 204 (*De senectute* 10), and Nepos adds a military
  tribunate in Sicily and service at the Metaurus (*Cato* 1). He served
  on the embassy to Africa conventionally dated to 153, returned alarmed
  at Carthage's recovery, and argued for war from then until his death in
  149 (Appian *Punica* 69; Plutarch *Cato Maior* 26–27).

  Later writers say he added the demand to his vote on any question
  whatever. Plutarch gives it in Greek as "it seems to me that Carthage
  must not exist"; Pliny (*Natural History* 15.74) and Florus (1.31) give
  the Latin *Carthaginem delendam (esse)*. The familiar tags *Carthago
  delenda est* and *ceterum censeo Carthaginem esse delendam* are modern,
  and nothing Cato wrote that survives contains the saying; see
  [the claim on the phrase](/claims/cato-delenda-est-historicity). He did
  not win at once. The summary of Livy's Book 48 has the senate follow
  Scipio Nasica against him three times, and it was only after Carthage
  offered its surrender in 149 that Cato's motion to hold to the decree
  of war carried (*Periochae* 49). How much his advocacy decided the war
  is weighed in the editorial take
  [Why was Carthage destroyed in 146 BCE?](/editorialTakes/destruction-not-weak-enough)

  Cato's career was much more than the saying: he was a major figure
  in Roman political and cultural life, the author of the oldest
  complete Latin prose work to survive (*De Agricultura*), an opponent of
  Hellenizing trends in Roman culture, and a moralist whose
  political-cultural program shaped Roman conservative thought for
  centuries. The persona preserved in the surviving tradition
  (the stern moralist, the relentless advocate for old Roman
  virtues, the unwavering enemy of Carthage) is itself partly the
  product of his own self-presentation in his speeches and
  *Origines*.
