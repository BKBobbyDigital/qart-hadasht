  notes: >
    Himilco's voyage is conventionally dated to the late
    6th or 5th century BCE; the surviving sources do not
    fix the chronology precisely. Some modern treatments
    place him as a contemporary of Hanno the Navigator,
    with whom his voyage may have been coordinated as a
    paired Carthaginian Atlantic-exploration program.
