etymology: >
  Punic *Ḥimilkat*, a common Carthaginian aristocratic
  name; one of multiple bearers in the surviving record.
  Distinguished by epithet from the 5th-century military
  commander Himilco who led the Carthaginian Sicilian
  counter-offensive of 397-396 BCE.
