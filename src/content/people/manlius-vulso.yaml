summary: >
  Roman consul of 256 BCE, colleague of Marcus Atilius Regulus,
  co-commander of the Roman fleet at Cape Ecnomus and the
  subsequent African expedition. Vulso commanded one of the four
  squadrons in the Roman triangular formation at Ecnomus and
  participated in the African campaign through 255 BCE before
  being recalled to Rome with part of the Roman force after
  Regulus's initial successes appeared to have settled the
  campaign. The decision to split the African force, leaving
  Regulus with a reduced army, has been cited by modern
  scholarship as a structural error contributing to the Roman
  defeat at the Bagradas River the following year. Vulso's
  subsequent career is less prominent in the surviving record
  than Regulus's; he survived the war but did not reach a second
  consulship.
