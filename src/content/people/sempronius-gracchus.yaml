summary: >
  Consul in 215 and 213 and the commander of the army of freed slaves
  raised after [Cannae](/events/battle-of-cannae). He is on this site
  for two things: he was killed by his own guest-friend in an ambush
  arranged with a Carthaginian commander, and
  [Hannibal](/people/hannibal-barca) buried him with honors. He is also
  the father of the consul of 177 and the grandfather of the Gracchi,
  which is how most readers meet the name.

  ## The slave army

  After Cannae Rome bought eight thousand slaves and armed them, having
  first asked each whether he was willing to serve. Gracchus commanded
  them, and the surviving account treats their performance as his
  achievement rather than theirs, which is the usual shape of such a
  story and should be read with that in mind.

  ## The ambush

  In 212 the consuls besieging [Capua](/events/siege-of-capua) sent for
  him to bring his army from Lucania and cover Beneventum. Flavus, a
  Lucanian, was the head of that part of his people which had stayed
  with Rome while the rest went over, and he was in his year as their
  elected praetor. He was also Gracchus's guest-friend. Changing sides
  suddenly and looking for credit with the Carthaginian, he judged that
  going over himself and bringing the Lucanians with him was not
  enough: he would seal the agreement with the head and blood of his
  commander and host. He went secretly to a Carthaginian commander
  named Mago who was in Bruttium, and was promised that if he handed
  over the Roman general the Lucanians should come into alliance free
  and under their own laws. The site notes the terms, which are the
  same ones Hannibal had given
  [Capua](/claims/capua-treaty-terms-216) and
  [Tarentum](/events/fall-of-tarentum-212).

  Flavus then told Gracchus that he had persuaded the magistrates of
  the peoples that had gone over to return to Rome, that they wanted to
  hear it from Gracchus himself and clasp his hand as a pledge, and
  that he had named a meeting place out of sight not far from the Roman
  camp. Gracchus went with his lictors and a squadron of cavalry and
  rode into the ambush. He dismounted, told the rest to do the same,
  and told them that all fortune had left them was to make their deaths
  worth something; they had not even brought their shields, so he
  wound his cloak round his left arm and went in. The Carthaginians
  tried to take him alive; seeing his Lucanian host among the enemy he
  attacked so hard that he could not be spared without heavy loss
  (Livy 25.16).

  ## Three deaths and two funerals

  Livy gives the Lucanian ambush, and then a version in which he was
  killed near the river Calor by Beneventum, having gone out of camp
  with his lictors and three slaves to bathe, naked and unarmed and
  fighting with stones from the riverbed; and a third in which he had
  gone five hundred paces from camp on the soothsayers' advice to
  perform a rite on clean ground and was surrounded by two troops of
  Numidians who happened to be sitting there. He then says, in a
  sentence the site quotes because it is the honest one, that neither
  the place nor the manner of the death of so famous and distinguished
  a man is established.

  The funeral splits the same way. In one account his men buried him in
  the Roman camp. In the account Livy calls the more widely current,
  Mago sent the body at once to Hannibal with orders to lay it before
  the general's tribunal with the captured fasces, and Hannibal built
  a pyre at the entrance of the Carthaginian camp and had the army
  parade round it under arms, with Spanish war dances and the movements
  each nation was accustomed to, himself conducting the rites with
  every honor of word and act. In the version where only the head was
  taken, Hannibal sent [Carthalo](/people/carthalo) to carry it to the
  Roman camp and hand it to the quaestor (25.17).

  The parade is worth noticing for a reason beside the courtesy. An
  army performing the dances of each of its nations at a funeral is the
  army the site describes at
  [the take on its composition](/editorialTakes/carthaginian-army-institutionally-mixed),
  seen for once doing something other than fighting.

  ## What his death did

  The army of volunteers, which had served with complete fidelity while
  Gracchus lived, left the standards as though discharged by the death
  of its commander (25.20.1). Livy reports it without comment and it is
  the sharpest surviving measure of how that force was held together:
  not by the oath, and not by the cause, but by one man. Rome had
  promised the volunteers their freedom and they had not yet been given
  it.
