etymology: >
  Punic *Magon*, from a root associated with offering or gift;
  one of the most common Carthaginian aristocratic names. The
  founder of the Magonid family that would dominate
  Carthaginian leadership through the 6th and 5th centuries
  BCE is by convention numbered Mago I to distinguish him from
  later bearers of the name.
