summary: >
  The founder of the Magonid family, the aristocratic line
  that would dominate Carthaginian political and military
  leadership across the 6th and 5th centuries BCE, and, as
  Justin records (18.7), the architect of the structural
  transformation that turned the Carthaginian armed forces
  from a primarily mercenary configuration into a citizen-
  led professional army. The reform produced the military
  basis for the Carthaginian expansion of the second half of
  the 6th century: the western-Mediterranean engagement
  against the Phocaeans at Alalia, the Sardinian and
  Sicilian campaigns, the consolidation of the Punic
  trading network, and the diplomatic engagement with Rome
  in the first treaty of 509 BCE.

  Mago I's biography is preserved imperfectly. Justin's
  epitome of Trogus is the principal source; Justin treats
  Mago as the central figure of his Carthaginian narrative
  for the period, the architect of "the empire of Africa"
  that the Magonid family would administer. The historicity
  of specific episodes Justin records (the campaign
  authorizations, the family successions, the assassination
  intrigues) is contested in modern scholarship and treated
  with appropriate caution, but the structural role, Magonid family ascendancy as the central feature of
  6th-century Carthaginian governance, is firmly attested
  across the surviving sources. Mago's sons Hasdrubal and
  Hamilcar continued the family program; the dynasty
  endured into the 5th century with the Hamilcar of the
  Battle of Himera (480 BCE), Mago's grandson.
