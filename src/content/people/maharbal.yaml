  notes: >
    Maharbal disappears from the surviving record after Cannae (216
    BCE); no death date is preserved. He may have died during the
    subsequent Italian campaign, may have been transferred to other
    operational theaters, or may have survived but ceased to be a
    figure of literary interest after Cannae. The decade estimate
    is a placeholder; the Greco-Roman tradition's interest in him
    centers on the cavalry command through 216 BCE, and what
    happened to him afterward is not recoverable.
