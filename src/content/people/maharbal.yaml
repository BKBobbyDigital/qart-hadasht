etymology: >
  Maharbaʿl combines *mhr* ("swift, skilled") with the divine name
  *Baʿal*, yielding something like "swift one of Baʿal." His
  patronymic in the Roman tradition is "son of Himilco." The name
  is attested in the broader Carthaginian onomastic record but the
  Maharbal of Hannibal's cavalry command is the principal figure
  the surviving sources preserve.
