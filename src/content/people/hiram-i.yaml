etymology: >
  Phoenician *Ḥīrām* ("my brother is exalted"), the short form
  of the related name Ahiram. The Hebrew Bible transliterates
  the name as Hiram (Hebrew Ḥīrām); Greek and Latin traditions
  transmit it as Eiromos, Cheiramos, or Hiram. The I
  distinguishes him from the later Hiram II (8th century BCE)
  and Hiram III (7th century BCE) of Tyre.
