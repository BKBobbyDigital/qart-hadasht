summary: >
  King of [Tyre](/places/tyre) in approximately the late 10th
  century BCE, the principal Phoenician ruler of the period
  during which the Tyrian commercial-political position over the
  broader Phoenician network developed substantively. Hiram is
  the earliest reliably-attested individual Phoenician king and
  is the figure with whom the Tyrian colonial expansion that
  produced [Carthage](/places/carthage) and the broader
  western Phoenician network is conventionally associated as a
  beginning point.

  ## Sources for Hiram

  Hiram is documented through three principal lines of
  evidence, none of which is contemporary with his reign:

  - **Phoenician annalistic tradition** preserved through
    Josephus (1st century CE, *Against Apion* 1.117–125 and
    *Jewish Antiquities* 8.50–60), who quotes the lost Phoenician
    historian Menander of Ephesus's translation of Tyrian
    archival records. Menander provides specific dates,
    construction programs, and dynastic relationships for
    Hiram's reign.
  - **Hebrew Bible** narratives (1 Kings 5, 7, 9; 2 Chronicles 2,
    4) describing Hiram's commercial-political relationship with
    Solomon of Israel — cedar timber and craftsmen sent from Tyre
    in exchange for grain, oil, and territory. The relationship
    is the principal central Hebrew-Bible attestation of
    Phoenician-Israelite cooperation in the 10th century BCE.
  - **Archaeological evidence** from the Tyrian-controlled
    coastal sites of the period — Phoenician installations at
    Tyre itself, at Sarepta, and at the more peripheral coastal
    sites that the Tyrian commercial network operated through.

  ## The Solomonic alliance

  The Hiram-Solomon commercial-political relationship is the
  most famous episode of Hiram's reign in the surviving record.
  Per the biblical narrative (1 Kings 5), Hiram supplied
  Solomon with cedar timber from Lebanon for the Jerusalem
  Temple construction, master craftsmen including the
  metalworker also named Hiram (likely a different Tyrian
  Hiram), and gold for the temple's decoration; in exchange,
  Solomon transferred to Hiram a substantial annual provision
  of wheat and olive oil, plus (per 1 Kings 9) a transfer of
  twenty cities in the Galilee that Hiram subsequently rejected
  as inadequate. The narrative is preserved with sufficient
  detail in both Hebrew Bible and Phoenician traditions to be
  treated as historical, even if specific details
  reflect later editorial layers.

  ## The Tyrian commercial expansion

  Hiram's reign is the period during which the Tyrian
  commercial-political position over the broader Phoenician
  network developed substantively. Menander attributes to Hiram
  the construction projects that linked the original Tyrian
  island to the mainland, the temple of Melqart that became the
  principal Tyrian religious-political center for the next
  millennium, and the expansion of Tyrian commercial reach into
  the wider Mediterranean. The Phoenician-colonial expansion that
  the [Phoenician colonial network theme](/themes/phoenician-colonial-network)
  treats begins in Hiram's reign or the
  generation after him.

  ## Relevance to Carthaginian history

  The Tyrian foundation tradition of Carthage places the city's
  founding in 814 BCE, approximately 120 years after Hiram's
  death. The intervening period, from Hiram's reign through the
  successive Tyrian kings down to the foundation generation, is
  the period during which Tyrian commercial reach extended across
  the Mediterranean and produced the chain of Phoenician colonial
  installations that the Carthage foundation completed. Hiram is
  the figure with whom this Tyrian expansion is conventionally
  associated as a starting point, even though most of the
  specific colonial foundations attributed to him are likely
  later than his actual reign.

  The
  annual Carthaginian delegation to Tyre, the centuries-long ritual that maintained the metropolitan-
  colonial relationship between Carthage and Tyre, was
  a delegation to the Melqart sanctuary Hiram had
  constructed. The
  [Cult of Melqart](/deities/melqart) was the central
  religious-political institution that maintained the Tyrian-
  Carthaginian connection across the centuries; Hiram's role in
  establishing the cult's principal Tyrian center is the indirect
  foundation for the Carthaginian religious continuity with
  Phoenician metropolitan tradition.

  ## Sources

  The principal modern reference is the Phoenician historiographic
  literature (Briquel-Chatonnet's *Les relations entre les cités
  de la côte phénicienne et les royaumes d'Israël et de Juda*
  1992 for the Hiram-Solomon relationship; [Aubet's *The
  Phoenicians and the West*](/sources/aubet-phoenicians-west-2001)
  for the commercial-colonial expansion). The
  [Phoenician colonial network theme](/themes/phoenician-colonial-network)
  treats the broader framing.
