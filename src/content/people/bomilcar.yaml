summary: >
  Carthaginian general during the invasion of Agathocles. When
  Agathocles landed in 310 BCE, the council gave the home army to
  Bomilcar and Hanno, chosen because their families were feuding, so
  that neither could turn the command against the city. Diodorus says
  Bomilcar had long wanted to be tyrant, and he held back when Hanno
  fell in the first battle (Diodorus 20.10–12). In 308 he declared
  himself tyrant with some 500 citizens and 1,000 mercenaries and fought
  his way into the agora; the citizens drove him back from the buildings
  around it, offered terms, and then tortured and killed him despite
  their oaths (20.43–44). Justin has him crucified in the forum and
  accusing the Carthaginians from the cross of their injustice to their
  generals, among them his uncle
  [Hamilcar](/people/hamilcar-ally-of-agathocles), the general who had
  backed Agathocles in 317 (22.7). See the
  [claim](/claims/agathocles-bomilcar-coup).
