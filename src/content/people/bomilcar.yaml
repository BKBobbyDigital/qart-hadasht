etymology: >
  Bod-Milkat combines the Punic prefix bd ("by the hand of, in the
  service of") with Melqart, the patron deity of Tyre and Carthage,
  yielding "by the hand of Melqart." A common Carthaginian name borne
  by several distinct historical figures.
