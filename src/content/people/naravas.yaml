summary: >
  Numidian prince of the Massylii confederation who joined Hamilcar
  Barca with approximately 2,000 cavalry during the Mercenary War in
  239 BCE. His defection to the Carthaginian side was a decisive
  reinforcement: cavalry was the rebel forces' principal weakness
  and Hamilcar's principal need. Polybius (1.78) reports that
  Hamilcar married his daughter to Naravas to seal the alliance,
  one of the few preserved cases of a Carthaginian dynastic marriage
  used for diplomatic purposes. Naravas's cavalry was central to
  Hamilcar's victory at the Battle of the Bagradas River and to the
  subsequent campaign that contained and ultimately destroyed the
  rebel forces. The Massylii relationship Naravas opened would
  recur a generation later under Massylii kings whose alliance
  Carthage and Rome would compete for during the Second Punic War,
  including Masinissa.
