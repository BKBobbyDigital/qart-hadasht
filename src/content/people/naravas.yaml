name_greek: Ναραύας
name_latin: Naravas
etymology: >
  The Numidian name *Naravas* is preserved only in Greek and Latin
  transliteration. The underlying Numidian-language form and
  etymology are not recoverable. He is the principal attested
  Massylii royal figure of the third quarter of the 3rd century
  BCE; the broader Massylii royal genealogy of the period is
  fragmentary, and his exact relationship to subsequent Massylii
  rulers (and to [Gala](/people/gala), [Masinissa](/people/masinissa)'s
  father) is not securely preserved.
