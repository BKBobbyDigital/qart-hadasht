summary: >
  Tyrant of Akragas (modern Agrigento) from approximately 488 BCE
  until his death in 473 BCE, contemporary and ally of Gelon of
  Syracuse. Theron's seizure of Himera in 483 BCE (expelling its
  tyrant Terillus, who would subsequently appeal to Carthage) was
  the proximate trigger of the Carthaginian invasion of 480 BCE.
  At the Battle of Himera, Theron commanded the Akragantine
  contingent that held the city under siege while Gelon's larger
  Syracusan force engaged the Carthaginian camp. The combined
  victory was the foundation of the Greek-Sicilian dominance of
  the next half-century. Theron was the patron of the poet
  Pindar, whose Olympian Odes preserve some of the few
  near-contemporary literary references to Himera and to the
  Greek-Sicilian victory tradition. After his death his son
  Thrasydaeus's misrule produced a popular revolt that ended the
  Akragantine tyranny in 472 BCE.
