summary: >
  Quintus Baebius Tamphilus is the principal Roman diplomat of the
  Second Punic War's outbreak in the surviving record — the one
  envoy who served on both the 219 BCE Roman embassy to Hannibal at
  the Saguntum siege and the 218 BCE Fabius embassy to Carthage that
  delivered the formal declaration of war. He is preserved in
  Polybius (3.20) and Livy (21.6, 21.18) as a participant in both
  embassies and as a senatorial figure engaged with
  the Roman diplomatic response to the Saguntum crisis.

  The 219 BCE embassy to Hannibal. When the Saguntum siege began
  in spring 219 BCE, the Roman senate dispatched an embassy under
  [Publius Valerius Flaccus](/people/valerius-flaccus) to Hannibal's
  Iberian command, with Baebius Tamphilus as the second named envoy.
  The embassy's instructions were to demand the cessation of the
  siege and, on Hannibal's expected refusal, to proceed to Carthage
  to deliver the formal Roman protest to the senate. The embassy
  reached Hannibal's camp; Hannibal refused to receive them or
  refused to alter his operations (the surviving sources disagree on
  exactly what happened at the camp interaction); the envoys
  continued to Carthage where the Carthaginian senate's response was
  also non-conciliatory. The embassy returned to Rome without having
  altered the crisis trajectory. The [219 embassy](/events/roman-embassy-to-hannibal-219)
  has its own event page.

  The 218 BCE Fabius embassy. When the Roman senate decided on
  formal declaration of war after the fall of Saguntum, the embassy
  to Carthage was led by Quintus Fabius Maximus (the future
  Cunctator) with four co-envoys: Baebius Tamphilus, Marcus Livius
  Salinator, Lucius Aemilius Paullus, and Gaius Licinius Varus.
  Baebius's inclusion was a continuation of the 219
  embassy's mandate — he was the senator with direct prior
  experience of the Carthaginian senate's response to Roman
  diplomatic pressure on the Saguntum question. The embassy
  delivered the famous "toga episode" ultimatum and the war
  declaration; see the [218 declaration event](/events/roman-declaration-of-war-218)
  for the full diplomatic sequence.

  Later career. Baebius continued in Roman politics through the
  early 2nd c. BCE; he served as praetor in 199 BCE (Livy 31.50)
  with command in Hispania Citerior, and is occasionally attested in
  the senatorial record across the post-Zama period without
  achieving consular rank. He is the principal Roman diplomat of the
  SPW outbreak the surviving record preserves in detail, and the
  one named figure whose career intersects both Roman embassies that
  bracketed the war's diplomatic opening.
