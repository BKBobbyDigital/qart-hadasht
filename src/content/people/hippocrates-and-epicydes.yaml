polity: Carthage / Syracuse (dual identity throughout careers)
summary: >
  The pair of brothers — Syracusan by family origin,
  Carthaginian by birth and upbringing — who returned to
  Syracuse in 215 BCE as Carthaginian envoys to King
  Hieronymus and remained as the architects of Syracusan-
  Carthaginian alliance through the city's resistance to
  Marcellus's siege. Polybius and Livy treat them as a
  unit throughout; the surviving tradition rarely separates
  the two beyond noting that Hippocrates was the elder.

  Their political career at Syracuse:

  - **215 BCE: arrival as Carthaginian envoys.** Sent by
    Hannibal's Carthaginian command in Italy to negotiate
    Syracusan defection. Their dual Syracusan-Carthaginian
    identity made them ideal intermediaries; Hieronymus's
    youth and inexperience made him receptive to their
    influence.
  - **214 BCE: power consolidation after Hieronymus's
    assassination.** The brothers survived the assassination
    and the subsequent factional conflict at Syracuse,
    emerging as effective leaders of the pro-Carthaginian
    faction in the surviving political class. Hippocrates
    became one of the two annual *strategoi* (generals)
    elected at Syracuse; Epicydes the other.
  - **213-212 BCE: defense of Syracuse against Marcellus.**
    The brothers led the political-military leadership
    during the siege itself, in coordination with
    Archimedes's defensive engineering. Their command
    sustained the city's resistance through nearly two
    years of Roman pressure.
  - **212 BCE: separation.** Hippocrates was killed in
    plague during the late phases of the siege; Epicydes
    escaped to the Carthaginian relief force in southern
    Sicily and survived the Syracusan fall.
  - **211-210 BCE: Sicilian rear-guard.** Epicydes
    continued operating with the Carthaginian Sicilian
    forces as the theater closed; his exit from the
    surviving record is undated but he does not appear in
    accounts of the post-210 Carthaginian operations.

  The brothers are an unusual case in the surviving record:
  central political figures of a major Second-Punic-War
  episode whose dual cultural identity was itself the
  political instrument that produced the alliance.
