slug: hippocrates-and-epicydes
name_display: Hippocrates and Epicydes
name_greek: Ἱπποκράτης καὶ Ἐπικύδης
name_latin: Hippocrates et Epicydes
etymology: >
  Common Greek personal names. The brothers were of
  Syracusan-Carthaginian descent — their grandfather had
  emigrated from Syracuse to Carthage after a political
  conflict; they were born and raised at Carthage and
  served in Carthaginian armies as adults before returning
  to Syracuse on diplomatic mission in 215 BCE.
