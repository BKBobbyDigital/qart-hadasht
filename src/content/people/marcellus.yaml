summary: >
  Roman consul five times (222, 215, 214, 210, 208 BCE), the
  most successful Roman field commander of the Second Punic
  War's Italian phase. Won early renown for killing the Gallic
  king Viridomarus in single combat at the Battle of
  Clastidium in 222 BCE, earning the *spolia opima* (the third
  and last Roman ever to do so).

  ## Nola, 216

  His standing in the Hannibalic war began in the autumn after
  Cannae, when he was praetor and the Campanian cities were
  going over. Warned by the Nolan council that the commons were
  about to hand the city to Hannibal, he came over the mountains,
  held the town, and then sallied from three gates while
  Hannibal's men were scattered fetching siege equipment. Livy
  will not vouch for the casualty figures and says the thing was
  great whatever its scale, because not to be beaten by Hannibal
  was harder then than beating him was afterward
  ([first battle of Nola](/events/first-battle-of-nola)). He then
  executed more than seventy Nolans for treating with the enemy
  and handed the city's government to its senate, which is the
  other half of how a city stayed loyal.

  The reputation carried him to the consulship of 215, in place
  of Lucius Postumius Albinus, killed by the Boii before taking
  office. It thundered as he entered on it, the augurs declared
  the election faulty and he abdicated; Livy records the general
  talk that the real objection was two plebeian consuls at once
  (23.31.12-14). Fabius Maximus was elected in his place and
  Marcellus went south again as propraetor. He was consul in 214,
  210 and 208.

  ## Syracuse and after

  His principal achievement in the war was the conquest of
  Syracuse in 213-211 BCE after extended siege, breaking the
  Carthaginian-Sicilian alliance that had threatened to reopen
  the western theater.
  Operations against Hannibal in southern Italy through 210-208
  BCE produced no decisive engagement; Marcellus was killed in
  a Numidian-cavalry ambush in 208 BCE. Plutarch's *Life of
  Marcellus* preserves the Syracuse siege in extensive detail,
  including the famous Archimedes episodes.
