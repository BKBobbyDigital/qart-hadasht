summary: >
  Tyrant of Syracuse from approximately 405 BCE until his death
  in 367 BCE, the dominant Greek-Sicilian political figure of
  the 4th century BCE and the principal Carthaginian adversary
  through four wars across nearly forty years. Dionysius rose
  to power in the political crisis produced by the Carthaginian
  invasion of 410-406 BCE; his consolidation of Syracusan power
  was substantially shaped by the need to defend Greek Sicily
  against continued Carthaginian pressure. The four wars he
  fought against Carthage (398-397, 393-392, 383-376, 368-367
  BCE) produced no decisive resolution but established the
  long-running pattern of Greek-Sicilian and Carthaginian
  contestation that ran through to the Agathocles period a
  generation later. His siege and capture of the Carthaginian
  Sicilian stronghold of Motya in 397 BCE was the principal
  Greek tactical achievement of the period; his subsequent
  defeats indicate the structural difficulty of expelling
  Carthage from Sicily that all his successors would face.
