summary: >
  Carthaginian naval commander of the late First Punic War,
  principally remembered for the decisive Carthaginian victory at
  the [Battle of Drepana](/events/battle-of-drepana) in 249 BCE —
  the largest Carthaginian naval victory of the war and one of the
  worst Roman naval defeats anywhere in the ancient Mediterranean.
  Adherbal's tactical handling of the engagement, and the Roman
  commander Publius Claudius Pulcher's tactical incompetence,
  combined to produce a Roman fleet destruction so severe that
  it substantively suspended Roman naval operations in the western
  Mediterranean for years.


  ## The Drepana engagement

  By 249 BCE the First Punic War had run for fifteen years and
  the Carthaginian position in Sicily had narrowed to the
  fortified harbors of Lilybaeum and
  [Drepana](/places/drepana) on the western coast. Adherbal
  commanded the Carthaginian fleet based at Drepana; the Roman
  consul Publius Claudius Pulcher attempted a surprise attack on
  the harbor with 123 quinqueremes. Adherbal's response — sortie
  the Carthaginian fleet out of the harbor mouth before the Roman
  force could complete its blockade, deploy in line along the
  open sea outside the harbor with Drepana itself protecting his
  rear, and force the Roman fleet to fight with the harbor and
  coastal shoals behind it — produced a tactical situation in
  which the Roman fleet could neither maneuver freely nor retreat
  cleanly.


  Polybius (1.49–51) preserves the engagement's tactical sequence
  in detail. The Roman fleet was crushed: 93 ships captured, the
  remainder forced ashore or sunk, with extensive Roman casualties.
  Claudius Pulcher escaped with ~30 ships and was subsequently
  prosecuted at Rome under the religious-omen charge famously
  associated with the engagement (he allegedly threw the sacred
  chickens overboard when they refused to eat — "let them drink,
  then" — before the battle; Cicero treats the episode as
  morally instructive).


  ## Strategic consequence

  The Drepana defeat substantively eliminated Roman naval
  capacity in the western Mediterranean for the next several
  years. Combined with the storm losses the Roman replacement
  fleet suffered the same year, the Roman state effectively
  withdrew from naval warfare until the final fleet construction
  of 243 BCE that produced the
  [Battle of the Aegates Islands](/events/battle-of-aegates-islands)
  in 241 BCE — the engagement that finally ended the war in
  Roman favor.


  Adherbal himself fades from the surviving record after Drepana.
  His subsequent career is not documented; the name appears in
  later Carthaginian contexts but with no firm prosopographic
  connection to the Drepana commander. Whether he died shortly
  afterward, retired, or simply ceased to feature in the surviving
  Greco-Roman sources is not recoverable.


  ## Assessment

  Drepana is one of the principal Carthaginian naval victories
  of the entire Punic Wars period — the only major naval engagement
  Carthage won decisively. Adherbal's tactical handling demonstrated
  that the Carthaginian naval institutional system, treated under
  the [Carthaginian sea power as institutional system narrative](/narratives/carthaginian-sea-power-as-system),
  was substantively competent when commanded by an experienced
  professional. The broader First Punic War's Carthaginian
  naval-defeat pattern reflected systemic problems (fleet rebuilds
  after catastrophic storm losses, mercenary-crewed ships against
  Roman citizen crews) rather than a uniform Carthaginian
  tactical-naval inferiority. Adherbal's victory at Drepana is
  the load-bearing counter-evidence to the standard narrative.
