etymology: >
  The Punic name *ʿAzrubaʿl* ("Baʿal helps") is the same root as
  Hasdrubal; the Greek and Latin traditions transmitted the name
  as Adherbal to distinguish this Carthaginian naval commander
  from the contemporaneous and later Hasdrubals. The name was
  common in the Carthaginian aristocratic onomastic register.
