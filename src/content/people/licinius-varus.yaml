summary: >
  Gaius Licinius Varus was one of the four co-envoys, alongside
  [Quintus Fabius Maximus](/people/fabius-maximus-cunctator) (the
  embassy leader), [Marcus Livius Salinator](/people/livius-salinator),
  [Lucius Aemilius Paullus](/people/aemilius-paullus), and
  [Quintus Baebius Tamphilus](/people/baebius-tamphilus), of the
  spring 218 BCE Roman embassy to Carthage that delivered the formal
  declaration of war that opened the Second Punic War. His specific
  role in the embassy's proceedings is not separately preserved in
  the surviving sources — Polybius (3.33) and Livy (21.18) treat the
  embassy as a senatorial delegation with Fabius as the principal
  speaker and the others as the senior senatorial witnesses. The
  five envoys' joint signature on the formal embassy was the Roman
  senate's collective political weight directed at the Carthaginian
  senate; Licinius Varus's specific contribution to the
  ceremonial-diplomatic act is not separately attested.

  Licinius Varus is preserved in the surviving record principally as
  one of the five names of the 218 embassy; his subsequent career
  is fragmentary in the Roman annalistic tradition. He is the
  least-attested of the five envoys in terms of independent
  biographical detail — the figure whose substantive contribution
  to the war's diplomatic opening is documented only through his
  inclusion in the embassy roster. The site treats him as a
  documented historical participant in the SPW outbreak whose
  specific role we cannot recover beyond the embassy fact itself;
  see the [218 declaration event](/events/roman-declaration-of-war-218)
  for the full diplomatic sequence.
