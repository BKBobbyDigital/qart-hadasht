etymology: >
  Same name as Hannibal's brother and Hasdrubal Gisco — Punic ʿAzrubaʿl,
  "Baʿal helps." The Carthaginian elite produced multiple men named
  Hasdrubal in any given generation; modern scholars distinguish this one,
  who has no surviving patronymic, by his role at Cannae.
