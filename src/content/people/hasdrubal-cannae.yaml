summary: >
  Carthaginian cavalry commander under Hannibal in Italy. Distinct from
  both Hannibal's brother Hasdrubal Barca and from Hasdrubal Gisco; the
  ancient sources identify him only by role. At Cannae in 216 BCE,
  Hasdrubal commanded the heavy cavalry on the left wing, opposite the
  Roman cavalry under Aemilius Paullus. After breaking the Roman horse,
  he led the wheel that crossed behind the Roman line to attack the
  Italian allied cavalry on the opposite wing — a maneuver that completed
  the encirclement and made Cannae's annihilating outcome possible. He
  disappears from the record after the campaigns immediately following
  Cannae.
