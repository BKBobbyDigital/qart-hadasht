name_greek: Ἰνδιβίλης
name_latin: Indibilis
etymology: >
  An Iberian personal name preserved only through Greek and
  Latin transliteration; no Iberian-language record from the
  Ilergetes survives that would confirm the original form. The
  name's Iberian etymology is not securely recoverable.
