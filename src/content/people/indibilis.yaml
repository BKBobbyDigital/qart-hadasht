polity: Ilergetes (Iberian)
summary: >
  The senior of two brothers who jointly led the Ilergetes
  confederation across the Second Punic War's Iberian theatre,
  and the best-documented individual Iberian political-
  military figure in the surviving record. Indibilis's
  career is structurally significant for understanding
  Iberian agency in the SPW: his alignments with Carthage
  and Rome were tactical and revisable, his political
  decisions reflected genuine Ilergetes-specific interests
  rather than imposed identity, and his fate illustrates
  the limits of post-victory accommodation that imperial
  conquerors typically extended to local elites.

  The principal phases of his career:

  - **218-209 BCE: Carthaginian alignment.** Indibilis and
    Mandonius were initial Carthaginian allies under
    Hasdrubal Barca's command. Their forces participated
    in Carthaginian operations against the Roman Iberian
    expedition of Scipio's father and uncle. The brothers
    were captured by Scipio Africanus along with their
    families at the fall of New Carthage in 209 BCE.
  - **209-206 BCE: Roman alignment.** Scipio's reportedly
    notable treatment of the Ilergetes captives (including the famous restoration of the betrothed
    young Iberian woman to her future husband, often
    cited as an exemplary act of Scipionic *humanitas*) won Indibilis and Mandonius's defection to the Roman
    side. They served with Scipio through the Iberian
    campaign and were instrumental in the Battle of
    Ilipa in 206 BCE.
  - **206-205 BCE: revolt against Rome.** After Scipio's
    departure from Iberia in 206 BCE, his successor
    commanders (Lucius Marcius and others) mistreated
    the Iberian allies — exactions, broken commitments,
    and what Polybius and Livy treat as a general failure
    of Scipionic *humanitas* in his absence. Indibilis
    and Mandonius led an Ilergetes revolt against the
    Roman occupation.
  - **205 BCE: defeat and death.** The Roman counter-
    offensive under Scipio's deputies defeated the
    Ilergetes in pitched battle. Indibilis was killed in
    the engagement; Mandonius was captured and (per the
    surviving sources) crucified.

  Indibilis is the principal Iberian historical figure of
  the SPW with substantial surviving documentation. His
  career is preserved across Polybius (9.11, 10.18-19,
  10.34-40), Livy (27, 28, 29), and the broader Greco-Latin
  tradition. The trajectory, from Carthaginian ally to
  Roman ally to anti-Roman rebel, is the clearest
  surviving illustration of how the SPW's Iberian theatre
  appeared to Iberians.
