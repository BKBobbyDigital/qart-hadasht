summary: >
  Roman consul of 207 BCE, co-commander with Marcus Livius
  Salinator at the Metaurus. Claudius Nero is the operational
  hero of the engagement: while holding command in southern
  Italy against Hannibal, he intercepted dispatches from
  Hasdrubal Barca to his brother detailing the planned
  rendezvous in Umbria, executed a forced march of approximately
  300 miles in seven days with a picked force of about 6,000
  infantry and 1,000 cavalry to join Livius in the north
  unannounced, and contributed the decisive intervention in the
  Metaurus engagement itself. The march and the surprise
  reinforcement is one of the most-praised tactical-strategic
  decisions in the surviving Roman military tradition. Honored
  with an ovation after the engagement (the lesser triumph,
  reflecting that he had not held overall command).
