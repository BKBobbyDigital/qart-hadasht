etymology: >
  Yet another Carthaginian named Hasdrubal (Punic ʿAzrubaʿl,
  "Baʿal helps"). Distinguished from the others on the site by
  his Greek title *boetharch* ("commander of auxiliary forces" or
  "rescue commander," used by Appian as a translation of an
  unrecorded Punic title) and by his role in the city's final
  defense.
