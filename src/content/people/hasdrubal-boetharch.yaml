summary: >
  Carthaginian commander of the city's defense during the Roman
  siege of 149-146 BCE. Hasdrubal had previously commanded
  Carthaginian forces against Masinissa in the 150 BCE engagement
  that gave Rome the legal pretext for war (the violation of the
  Lutatius treaty's allied-protection clause). With the Roman
  declaration of war, the Carthaginian senate condemned Hasdrubal
  in absentia as a scapegoat to placate Roman demands; he
  withdrew from the city with a force of approximately 30,000 and
  conducted a campaign against the Romans in the Carthaginian
  hinterland through 148 BCE. After the Carthaginian senate
  reversed his condemnation and recalled him in 147 BCE, he
  commanded the city's defense through the final siege under
  Scipio Aemilianus.

  His conduct in the final phase is preserved with hostile detail
  in Appian (*Punica* 113-131): repeated executions of Roman
  prisoners on the city walls in sight of the besiegers, harsh
  treatment of Carthaginian citizens suspected of pro-Roman
  sympathies, and on the day of the final Roman breakthrough into
  the citadel, Hasdrubal's survival through surrender to Scipio
  rather than fighting to the death. Hasdrubal's wife, whose name
  is not preserved, scorned his survival from a balcony of the
  temple of Eshmun, denounced him as a coward, killed her two
  children, and threw herself into the burning temple. The
  episode is one of the most famous in Appian's account and was
  reportedly witnessed by Scipio Aemilianus and Polybius from
  the Roman lines.
