summary: >
  Carthaginian commander of the city's defense during the Roman
  siege of 149-146 BCE. He had commanded the army Masinissa destroyed
  in 150, the war Rome treated as Carthage's breach of the treaty of 201
  (Appian *Punica* 70-73). To placate Rome the Carthaginians condemned
  him to death and blamed him for the war (74); he gathered some 30,000
  men in the countryside. When Carthage chose to fight in 149 it
  reinstated him as general outside the walls, begging him not to hold
  against them a wrong done from fear of Rome (93), and he campaigned in
  the hinterland. After the city's other general, Masinissa's grandson
  Hasdrubal, was killed on his accusation in 148, he commanded the city
  itself (111) through the final siege under Scipio Aemilianus.

  His conduct in the final phase is preserved with hostile detail.
  Appian has him torture Roman prisoners on the walls in sight of
  the besiegers, so that the Carthaginians would see there was no
  peace to be had, and put to death councillors who objected
  (*Punica* 118). Polybius, who was there, draws him as a
  corpulent braggart in armor and a purple cloak with ten
  swordsmen, well fed while his people starved, who refused
  Scipio's offer of safety for himself, his family and ten others
  (38.7–8). On the last day he slipped out of the Byrsa and
  surrendered to Scipio (Appian 131). His wife, whose name is not
  recorded, came out and denounced him before the Romans (Polybius
  38.20); later writers say she then killed their two sons and
  died with them in the fire (Appian 131; Livy *Periochae* 51).
  See the [claim on her death](/claims/tpw-hasdrubals-wife-immolation).

  Hasdrubal himself survived. Zonaras, abridging Cassius Dio, says he,
  the Numidian Bithyas, the hostages and the leading men spent the rest
  of their lives in honorable confinement in different parts of Italy
  (9.30); Miles adds that they were first led in Scipio's triumph.
