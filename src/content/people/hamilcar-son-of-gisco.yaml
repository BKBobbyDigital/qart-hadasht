summary: >
  The Carthaginian general sent to Sicily in 311 BCE to undo the peace
  that the earlier Hamilcar had made with Agathocles, and the commander
  who came closest to ending Agathocles' career. Justin says the
  Carthaginian council, voting in secret on the earlier Hamilcar's
  conduct, sealed its ballots in an urn until this Hamilcar should
  return from Sicily (22.3).

  His expedition was large: 130 warships, 2,000 citizen soldiers with
  many nobles among them, 10,000 Libyans, Etruscan and Balearic
  mercenaries, and money and supplies. A storm on the crossing sank
  sixty warships and two hundred transports and drowned many nobles, and
  Carthage hung its walls with black sackcloth, its custom after great
  disasters (Diodorus 19.106). Hamilcar gathered the survivors, hired
  more mercenaries, and took the hill of Ecnomus near Gela. When
  Agathocles attacked his camp by the river Himeras, the arrival of
  reinforcements by sea turned the battle, and the Greeks were cut down
  in the pursuit across the plain (19.107–109). Hamilcar then won over
  the Greek cities with generous terms and shut Agathocles up in
  Syracuse (19.110).

  Agathocles' crossing to Africa in 310 did not bring him home. Carthage
  asked him to send help; after a failed assault on Syracuse he sent
  5,000 men and stayed (20.15–16). In 309 he marched his whole army
  against Syracuse by night, trusting a soothsayer who had told him he
  would dine in the city the next day. The column fell into confusion on
  narrow roads, the Syracusans holding Euryalus charged, and Hamilcar
  was captured, dining in Syracuse as a prisoner, as Diodorus remarks, and
  was tortured and killed (20.29–30). Justin credits the victory to
  Agathocles' brother Antander (22.7). The site formerly said he was
  recalled to Africa; see the
  [claim](/claims/agathocles-hamilcar-recalled) and
  [Agathocles in Africa](/narratives/agathocles-invasion-of-africa).
