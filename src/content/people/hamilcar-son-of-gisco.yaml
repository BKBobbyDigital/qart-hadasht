name_punic: ʿAbd-Melqart
name_punic_script: 𐤏𐤁𐤃𐤌𐤋𐤒𐤓𐤕
name_greek: Ἀμίλκας
name_latin: Hamilcar
etymology: >
  Hamilcar is the Greek/Latin rendering of the Punic *ʿAbd-Melqart*,
  "servant of Melqart" — a common Carthaginian theophoric name
  honoring the Tyrian patron deity. The patronymic "son of Gisco"
  distinguishes him from the several other Carthaginian commanders
  named Hamilcar across the 4th and 3rd centuries BCE, including
  [Hamilcar Barca](/people/hamilcar-barca) (the more famous father
  of Hannibal, more than half a century later) and
  [Hamilcar Magonid](/people/hamilcar-magonid) (the 480 BCE Himera
  commander).
