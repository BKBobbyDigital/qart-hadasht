  notes: >
    Killed near Syracuse in 309 BCE during the Greek counterattack
    that turned the closing phase of the Sicilian war against
    [Agathocles](/people/agathocles)'s African expedition. Diodorus
    20.29 reports that Hamilcar's head was decapitated and sent to
    Agathocles in Africa as a trophy of victory; the detail is
    plausible Greek-Sicilian psychological-warfare practice but is
    preserved by Diodorus only.
