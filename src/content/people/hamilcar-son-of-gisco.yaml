etymology: >
  Hamilcar renders a Punic name usually given as *ḤMLQRT*, "Melqart is
  gracious", though the exact form is not certain. The patronymic "son
  of Gisco" distinguishes him from the
  [Hamilcar who backed Agathocles](/people/hamilcar-ally-of-agathocles)
  in the 310s, whom Justin calls "the other Hamilcar" (22.3), and from
  [Hamilcar Barca](/people/hamilcar-barca) and
  [Hamilcar Magonid](/people/hamilcar-magonid).
