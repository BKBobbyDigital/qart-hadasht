name_greek: Ἄννων
name_latin: Hanno
etymology: >
  Punic *Ḥanno* (𐤇𐤍𐤀), one of the most common Carthaginian
  given names; from the root *ḥnn* (gracious / merciful),
  also the basis of biblical *Hananiah* and similar Semitic
  names. Distinguished by epithet from other Hannos in the
  Carthaginian record.
