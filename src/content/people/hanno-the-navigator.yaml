summary: >
  The Carthaginian commander of a major colonization-and-
  exploration voyage along the West African Atlantic coast,
  preserved in a Greek translation known as the Periplus of
  Hanno, one of the very few surviving Carthaginian
  literary documents (in any form, even via Greek
  translation) and the principal evidence for Carthaginian
  Atlantic exploration. The Periplus describes Hanno's
  expedition: 60 fifty-oared ships, some 30,000 colonists
  (the figure has the standard ancient-numbers caveat),
  passage through the Pillars of Heracles, foundation of
  several coastal colonies along the Mauretanian Atlantic
  coast, and continuation southward to a furthest point
  conventionally identified with the Senegal river estuary
  or possibly Sierra Leone.

  The Periplus's most-discussed episode is its account of
  encountering "wild men and women" called *gorillai* on a
  southern island, a passage that gave modern zoology its
  name for the species. Whether the encounter was with
  actual gorillas, with chimpanzees, or with a human
  population the Carthaginians could not communicate with is
  contested.

  Hanno's exact chronology is not securely established. The
  voyage is conventionally placed in the late 6th or early
  5th century BCE; modern scholarship places it variously
  between c. 510 and c. 470 BCE, though some authorities
  argue for a later date. The surviving Greek translation
  was produced at an unclear date; whether it derives from
  an inscribed monumental original at the Tanit temple in
  Carthage (as the translator's preface claims) or is a
  later literary fabrication is itself contested.
