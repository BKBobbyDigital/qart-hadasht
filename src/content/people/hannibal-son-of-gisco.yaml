etymology: >
  Ḥannibaʿl ("grace of Baʿal"), the same name borne by the more
  famous Hannibal Barca two centuries later. Distinguished from
  him by the patronymic and family designation. Grandson of the
  Hamilcar Magonid who died at Himera in 480 BCE.
