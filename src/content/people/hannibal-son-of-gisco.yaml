summary: >
  Carthaginian commander of the Magonid family who led the
  great Sicilian invasion of 410-406 BCE, the campaign
  understood by the Greek tradition as Carthaginian revenge for
  the defeat at Himera in 480 BCE that had killed his
  grandfather. Hannibal's army sacked Selinus and Himera in
  409 BCE in successive campaigns of unusual brutality (Selinus
  in particular was effectively destroyed; tens of thousands of
  Greek inhabitants killed or enslaved). In 406 BCE he returned
  with a larger force to besiege Akragas, the principal Greek
  city of central-southern Sicily. He died of plague during the
  siege; his subordinate Himilco completed the operation. The
  invasion's scale and brutality reshaped Greek-Sicilian
  geography for generations and produced the political
  conditions for the rise of Dionysius I of Syracuse.
