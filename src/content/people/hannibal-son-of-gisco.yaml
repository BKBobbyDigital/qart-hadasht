name_display: Hannibal son of Gisco (Magonid)
name_punic: Ḥannibaʿl
name_punic_script: 𐤇𐤍𐤁𐤏𐤋
name_greek: Ἀννίβας
name_latin: Hannibal
etymology: >
  Ḥannibaʿl ("grace of Baʿal"), the same name borne by the more
  famous [Hannibal Barca](/people/hannibal-barca) two centuries
  later. Distinguished from him by the patronymic and family
  designation. Grandson of the [Hamilcar Magonid](/people/hamilcar-magonid)
  who died at the Battle of [Himera](/events/battle-of-himera) in
  480 BCE. The Magonid family designation indicates his descent from
  the founder of the dynasty that dominated Carthaginian political-
  military leadership across the 6th through 4th centuries BCE,
  before the rise of the Barcids.
