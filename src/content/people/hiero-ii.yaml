summary: >
  King of Syracuse for more than half a century, and the third party in
  the First Punic War whom accounts of a war between two powers tend to
  leave out. Hiero began that war as Carthage's partner, crossed to Rome
  in its second year, and stayed there until his death in 215. Polybius
  gives him more than ninety years of life and fifty-four of rule, and
  treats his Syracuse as a fixed point in a Mediterranean that was
  otherwise in motion.

  ## The path to power

  Hiero did not come from the royal house of
  [Agathocles](/people/agathocles). He was chosen as general by the
  Syracusan army in the confused years after
  [Pyrrhus](/people/pyrrhus) left Sicily, and he made his reputation
  against the [Mamertines](/groups/mamertines), the Campanian
  mercenaries who had held Messana since 288 and raided Greek Sicily
  from it. A victory over them at the Longanus river brought his
  acclamation as king. The date of that battle is disputed, and with it
  the start of the reign: some reconstructions put it in 269, others
  close to 265, directly before the crisis it helped produce.

  ## Carthage's partner, then Rome's

  The pressure Hiero put on Messana is what drove the Mamertines to
  appeal both to Carthage and to Rome in 265. When the Roman consul
  [Appius Claudius](/events/appius-claudius-crossing) crossed the strait
  in 264, he found Hiero and a Carthaginian army besieging the city
  together from opposite sides. Appius attacked the Syracusans first,
  and Hiero, beaten, withdrew to Syracuse.

  The decisive change came the following year. In 263 both consuls
  crossed with the full four legions, and a string of Sicilian towns
  went over to them. Hiero read the situation and came to terms:
  prisoners returned, an indemnity of one hundred talents in Polybius's
  figure, and an alliance that Diodorus gives as fifteen years and that
  was later renewed. From then on Rome fought in Sicily with a
  Syracusan base, Syracusan supplies, and a Greek ally who had spent his
  life learning how Carthage fought. The supplies were not a formality.
  At the [siege of Agrigentum](/events/siege-of-agrigentum) in 262, with
  the Roman army starving under a Carthaginian counter-blockade,
  Polybius says Hiero's convoys were what kept the siege from being
  abandoned.

  ## Help for Carthage in 240

  The episode that best shows how Hiero thought came after the war.
  During the [Mercenary War](/narratives/the-mercenary-war), when
  Carthage was fighting for its survival in Africa, Hiero sent it
  everything it asked for. Polybius explains the policy directly: Hiero
  judged that Syracuse's own safety, and its standing with Rome, both
  depended on Carthage surviving, so that Rome could not have its way
  in everything without effort. A Roman ally keeping Rome's defeated
  enemy alive is not a contradiction. It is the balance-of-power
  thinking of a Hellenistic king who needed two great powers in the
  western Mediterranean, not one.

  ## The long Roman alliance

  Hiero kept the Roman alliance through the rest of his reign and into
  the Second Punic War, sending grain and a golden statue of Victory to
  Rome after the disaster at Trasimene in 217. At home his reign was a
  period of stable government and prosperity: he patronized
  [Archimedes](/people/archimedes), whose engineering later defended the
  city against Rome, and built on a scale that included the giant ship
  *Syracusia*, which he eventually sent to Egypt as a gift.

  ## After Hiero

  His death in 215 undid his settlement within months. His grandson
  [Hieronymus](/people/hieronymus) took Syracuse over to Carthage after
  Cannae, was assassinated within the year, and left a city divided
  between factions. The result was the Roman
  [siege of Syracuse](/events/siege-of-syracuse-marcellus) and the
  city's capture in 211, which ended Syracusan independence. The
  half-century of neutrality-by-alliance that Hiero had maintained was
  a personal achievement, and it did not outlast him.
