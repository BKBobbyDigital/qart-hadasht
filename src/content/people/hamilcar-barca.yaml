name_latin: Hamilcar Barca
etymology: >
  Hamilcar is the Greek and Latin rendering of a Punic name usually
  given as ḤMLQRT, "Melqart is gracious," after the patron deity of
  Tyre; the exact Punic form is not certain. The cognomen Barca,
  Punic Brq ("lightning"), was a personal epithet of Hamilcar that
  became the family name of his line. His son Hannibal also bore the
  Barca cognomen, as did his other sons.
