summary: >
  Carthaginian general and statesman, founder of the Barcid family,
  whose hold on Carthaginian political and military life ran across
  two generations from the late First Punic War to Zama. He took
  command in Sicily in 247 BCE during the closing phase of the war,
  operating first from Heirkte at the Panormus end of the north coast
  and from 244 from the town of [Eryx](/places/eryx), where Polybius
  has the Romans holding the summit above him and a second garrison
  below (1.58.2–3). From there he ran a raiding campaign that pinned
  Roman forces in western Sicily for the war's last years, and he was
  never beaten in the field.

  When the naval defeat at the
  [Aegates Islands](/events/battle-of-aegates-islands) made that
  position untenable, Carthage gave him full powers to deal with the
  situation (Polybius 1.62.3), and in Nepos's version left the
  decision to his judgment: he wanted to go on fighting and concluded
  that a country drained by expense could not, so he made peace
  intending to resume the war once resources recovered
  ([Nepos](/sources/nepos-hamilcar), *Hamilcar* 1.3–1.4). The one
  demand he refused was that his men lay down their arms before
  leaving Sicily, and Catulus gave way (1.5). The man who negotiated
  the [Treaty of Lutatius](/events/treaty-of-lutatius) was therefore
  also the one commander on the island who had not been beaten, which
  is the shape of the grievance the family carried into Iberia.

  Returned to Africa to find Carthage in the grip of the
  Mercenary War (241–237 BCE), suppressed it after extended and
  brutal fighting, and used the resulting political authority to
  open a new strategic front in Iberia. From 237 BCE to his death in
  228 BCE he conquered substantial parts of southern Iberia,
  establishing the Carthaginian Iberian dominion that his
  son-in-law Hasdrubal the Fair and his son Hannibal would extend.

  ## How the conquest worked

  [Diodorus](/sources/diodorus-library) preserves the only sequence of
  named engagements, and it shows a consistent method. Against the
  Celts under Istolatius and his brother he destroyed the whole force,
  killed the two leaders, and enrolled three thousand of the survivors
  in his own army. Against Indortes, who raised fifty thousand men and
  fled before fighting, he besieged the hill the army had taken,
  captured Indortes alive, had him blinded and crucified, and released
  the other prisoners, more than ten thousand of them (25.10.1–25.10.2).
  Exemplary violence against the leader, absorption of the rank and
  file: an army that grew by defeating people. [Nepos](/sources/nepos-hamilcar)
  summarizes the result from the Carthaginian end, saying Hamilcar
  subdued very great and warlike peoples and "enriched all Africa with
  horses, arms, men and money" (*Hamilcar* 4.1).

  Diodorus also gives the one city Hamilcar is said to have founded,
  Akra Leuke, the White Citadel, which he calls a very large city and
  which served as the winter quarters for the army and the elephants
  (25.10.3). He is the only source for it, there is no secure material
  evidence, and
  [Eve MacDonald](/sources/macdonald-hannibal-2015) notes that this
  leaves even its existence open to question (p. 66). Alicante is the
  usual identification and is not established.
  Father of Hannibal, Hasdrubal Barca, and Mago Barca; the founder of
  the family that would carry the war to Rome a generation after his
  death. The "oath of eternal enmity" his son Hannibal allegedly
  swore at Hamilcar's altar before the Iberian expedition is the
  most famous moment in his late life and is treated as a separate
  open question on this site.

  His reputation traveled. Nepos closes *De Regibus*, a catalog of
  Hellenistic kings, by saying it seems not out of place to add
  Hamilcar and Hannibal, who are agreed to have surpassed all those
  born in Africa in greatness of spirit and in *calliditas* (3.5). A
  Roman writer appending two Carthaginians who held no royal title to
  a list of kings is worth noticing, and so is the quality he picks:
  *calliditas* is shrewdness or cunning, the word the Punic-treachery
  tradition uses as a charge, used here as praise.

  The Iberian state Hamilcar built is attested most directly by
  the Barcid Iberian Coinage — the silver shekel series initiated
  under his command from 237 BCE forward, which would become the
  fiscal foundation of the Second Punic War effort under his son
  Hannibal.
