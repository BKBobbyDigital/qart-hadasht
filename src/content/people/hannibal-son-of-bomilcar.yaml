etymology: >
  Phoenician *ḤNBʿL* ("Baʿal is gracious") — the same name as
  Hannibal Barca, Hannibal son of Gisco, and the multiple other
  Carthaginians named Hannibal who feature in the surviving
  record. The patronymic "son of Bomilcar" (*Bod-Melqart*, "in
  the hand of Melqart") distinguishes this commander from the
  others; the surviving sources sometimes confuse them.
