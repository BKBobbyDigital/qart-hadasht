summary: >
  Carthaginian commander of the Second Punic War, principally
  active in the Sicilian theater during the period 215–210 BCE.
  Hannibal son of Bomilcar is distinct from the more famous
  [Hannibal Barca](/people/hannibal-barca) and from the
  Magonid-period [Hannibal son of Gisco](/people/hannibal-son-of-gisco);
  the surviving Greco-Roman tradition sometimes confuses the
  three figures, and modern scholarship has had to work
  carefully to keep them separate.


  ## The Sicilian theater commander

  Hannibal son of Bomilcar's principal documented role is as
  one of the Carthaginian commanders in the Sicilian theater
  during the post-Cannae phase of the Second Punic War. The
  215 BCE [Syracusan defection from Rome](/events/syracusan-defection-215)
  produced an opening for direct Carthaginian intervention in
  Sicily for the first time since the First Punic War's end in
  241 BCE; Hannibal son of Bomilcar commanded one of the
  Carthaginian forces operating in support of Syracuse and the
  broader Sicilian anti-Roman coalition that the defection
  produced.


  Polybius (8.5.4 and following) and Livy (24.36, 25.27, 26.40)
  preserve scattered references to Hannibal son of Bomilcar's
  command across the period. The picture that emerges is of a
  competent but not exceptional commander operating with limited
  Carthaginian resources against an increasingly-committed Roman
  Sicilian campaign under Marcellus and subsequently Laevinus.
  The principal documented engagements involve naval-amphibious
  operations supporting Syracuse during the Roman siege, attempts
  to relieve other Sicilian cities that had defected from Rome,
  and the campaign against the Roman position in central Sicily.


  ## After the Sicilian collapse

  By 211 BCE the Roman position in Sicily had substantively
  reconsolidated through the
  [siege and capture of Syracuse](/events/siege-of-syracuse-marcellus)
  under Marcellus and the subsequent
  [fall of Akragas](/events/fall-of-akragas-210) under Laevinus.
  Carthaginian forces withdrew from Sicily. Hannibal son of
  Bomilcar's subsequent career is not documented; whether he
  returned to Africa, served in another theater, or died in the
  Sicilian operations is not recoverable from the surviving
  record.


  ## The naming-confusion problem

  Hannibal son of Bomilcar's relevance for an encyclopedia of
  Carthage is partly his Sicilian command and partly the
  example he provides of the broader Carthaginian onomastic
  pattern. The name Hannibal was extraordinarily common in the
  Carthaginian aristocratic register — at least a dozen distinct
  Hannibals feature in the surviving Greco-Roman record across
  the Punic period. Modern scholarship has substantially less
  evidence for distinguishing them than for the Roman
  prosopographic tradition, which means that some references in
  ancient sources cannot be securely assigned to a specific
  individual. Hannibal son of Bomilcar is a clear case of the
  pattern: a substantively-documented commander whose career is
  preserved but whose biography beyond the documented military
  command is not recoverable.


  ## Sources

  The principal sources are Polybius (Book 8) and Livy (Books
  24–26) for the Sicilian theater operations. Modern treatments
  include [Hoyos's *The Carthaginians*](/sources/hoyos-carthaginians-2010)
  and Lazenby's *Hannibal's War* (1978) for the broader Sicilian
  theater context.
