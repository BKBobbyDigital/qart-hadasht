summary: >
  King of [Sidon](/places/sidon) in the early 5th century BCE,
  known principally from the inscription on his sarcophagus —
  one of the longest preserved Phoenician inscriptions anywhere
  and a foundational piece of evidence for Persian-period
  Phoenician royal politics, religious practice, and dynastic
  ideology. Eshmunazar II died as a young teenager (the
  inscription describes him as "snatched away before my time, a
  few-of-days orphan, the son of widow"), with his mother and
  grandfather mediating his reign and the subsequent burial.

  ## The Eshmunazar Sarcophagus inscription

  The [Eshmunazar II Sarcophagus](/artifacts/eshmunazar-ii-sarcophagus)
  was discovered in 1855 in the royal necropolis at Sidon and
  is now in the Louvre (object AO 4806). The black basalt
  sarcophagus is of Egyptian anthropoid form, recut from an
  earlier Egyptian original; the Phoenician inscription was
  cut on the front and lid in the early 5th century BCE.

  The inscription runs to 22 lines and is the longest single
  Phoenician royal inscription anywhere in the surviving record.
  Its content covers:

  - The dedicatory framing (Eshmunazar invoking the gods to
    protect his tomb)
  - Curses against any future violator of the sarcophagus
  - A summary of Eshmunazar's lineage (son of Tabnit, grandson
    of Eshmunazar I)
  - A list of religious works the king and his mother performed
    on behalf of Sidon (temples built, sanctuaries restored)
  - A reference to Persian (Achaemenid) patronage of Sidon, with
    the explicit grant of territories around Joppa (Jaffa) and
    Dor to Sidonian control "for the services rendered" — the
    principal documentary evidence for the Persian–Sidonian
    political relationship in the early 5th century BCE

  The Persian-grant reference is one of the principal pieces of
  primary evidence for Sidonian political-administrative status
  under Achaemenid Persian suzerainty: Sidon was a substantively
  autonomous client kingdom with delegated administrative
  control over coastal territories south to Jaffa.

  ## Family and the regency

  Eshmunazar's mother, Amoʿashtart ("handmaiden of Astarte"),
  features prominently in the sarcophagus inscription as the
  regent who managed Sidon during Eshmunazar's minority and
  oversaw the religious-construction program the inscription
  documents. Amoʿashtart was herself a priestess of Astarte
  (per the inscription's description) and the daughter of the
  earlier Eshmunazar I. She acted as effective ruler during
  Eshmunazar II's brief reign and probably after his early
  death as well.

  The Sidonian dynastic sequence the inscription preserves
  (Eshmunazar I → Tabnit → Eshmunazar II → Bodashtart) is the
  principal documentary anchor for Persian-period Sidonian
  kingship and is one of the few cases in the surviving
  Phoenician record where a royal succession is documented
  with substantive multi-generational detail.

  ## Relevance to Carthaginian history

  Eshmunazar's relevance for an encyclopedia of Carthage is
  indirect but substantive in two respects. First, the cult of
  [Eshmun](/deities/eshmun), Sidon's patron deity and the
  source of Eshmunazar's name, was transmitted
  westward to Carthage and became one of the four principal
  Carthaginian deities. Second, the Sidonian religious-
  construction program the inscription documents is the same
  category of state-religious activity that the Carthaginian
  state subsequently undertook in its own metropolitan context;
  the Eshmunazar inscription provides the principal Phoenician-
  homeland comparative material for understanding Carthaginian
  royal-religious practice. The
  [Phoenician colonial network theme](/themes/phoenician-colonial-network)
  treats the broader metropolitan-colonial framing.

  ## Sources

  The principal modern reference is the broader Phoenician
  epigraphic literature ([KAI](/sources/kai) 14 is the standard
  scholarly entry on the Eshmunazar inscription;
  [CIS](/sources/cis) I 3 has the inscription text). The
  [Punic inscriptional record theme](/themes/punic-inscriptional-record)
  treats the broader Phoenician-Punic epigraphic tradition.
