summary: >
  Numidian prince and ally of Syphax, and through him, of Carthage. According
  to Polybius (15.3), Tychaeus brought 2,000 cavalry to join Hannibal's army
  shortly before Zama. The reinforcement was the only meaningful cavalry
  Hannibal had at the battle, and its inadequacy against the combined Roman
  and Massylian horse under Laelius and Masinissa proved decisive in the
  battle's outcome. Tychaeus disappears from the record after Zama.
