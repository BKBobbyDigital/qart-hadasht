name_greek: Ἄννων
name_latin: Hanno
etymology: >
  Ḥanno is one of the most common Carthaginian personal names, derived
  from the Punic root ḥnn ("to be gracious"). Multiple distinct
  historical figures named Hanno appear in the surviving record;
  modern scholars distinguish them by patronymic, role, or epithet.
  This Hanno is identified by his role at the Aegates.
