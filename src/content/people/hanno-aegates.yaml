summary: >
  Carthaginian admiral commanding the relief fleet sent to Sicily in
  early 241 BCE. The fleet was hastily assembled, undermanned, and
  weighted with supplies for the besieged Carthaginian land forces in
  western Sicily under Hamilcar Barca. Intercepted by the Roman fleet
  under Lutatius at the Aegates Islands on 10 March 241 BCE, Hanno's
  ships were defeated decisively. The principal sources differ on his
  fate after the battle: some traditions report that he returned to
  Carthage and was crucified for the defeat, in keeping with
  Carthaginian practice toward unsuccessful commanders; others have
  him surviving in some form. Modern scholarship is generally
  cautious about the execution detail, treating it as plausible given
  the political pressures on the Carthaginian government at the time
  but not securely attested.
