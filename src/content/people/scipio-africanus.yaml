name_display: Scipio Africanus
name_latin: Publius Cornelius Scipio Africanus
etymology: >
  The cognomen "Africanus" was awarded after his victory at Zama and the defeat
  of Carthage in Africa — making it one of the earliest examples of a Roman
  general taking a triumphal name from the territory he conquered.
