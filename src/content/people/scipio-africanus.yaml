name_greek: Σκιπίων ὁ Ἀφρικανός
name_latin: Publius Cornelius Scipio Africanus
etymology: >
  The cognomen *Africanus* was awarded after his victory at Zama and
  the defeat of Carthage in Africa, making it one of the earliest
  examples of a Roman general taking a triumphal name from the
  territory he conquered. The Cornelii Scipiones were an old patrician
  Roman gens; the family included his father (Publius Cornelius Scipio,
  the elder Scipio, consul of 218 BCE) and uncle (Gnaeus Cornelius
  Scipio Calvus), both of whom commanded the Iberian theater of the
  Second Punic War until their deaths in 211 BCE.
