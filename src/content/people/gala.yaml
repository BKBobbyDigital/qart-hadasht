slug: gala
name_display: Gala
name_greek: Γάλας / Γαλᾶ
name_latin: Gala
etymology: >
  The Numidian name *Gala* is preserved only in Greek and Latin
  transliteration. No reliable Punic-script attestation
  survives, and the underlying Numidian-language etymology is
  not securely reconstructable. The name was held by at least
  one other Numidian royal figure of similar dynastic
  significance.
