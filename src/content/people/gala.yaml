summary: >
  Gala was the Massylii king through the principal Second Punic
  War period and the father of [Masinissa](/people/masinissa).
  His political-strategic decisions in the years 218–207 BCE
  shaped the Numidian alignment of the war's
  African theater: he maintained the long-standing Massylii-
  Carthaginian alliance through the war's early-to-middle
  phases, contributed Numidian cavalry contingents to the
  Carthaginian forces operating in Iberia and Africa, and
  arranged the political education and marriage prospects of
  his son Masinissa within the Carthaginian aristocratic
  network. His death c. 206 BCE produced the Massylii
  succession crisis that intersected directly with the
  Sophonisba realignment and Masinissa's defection to Rome,
  the moments that subsequently reshaped the war's African
  outcome.

  Gala's importance in the surviving record is principally
  structural rather than biographical: the surviving sources
  (Polybius, Livy, Appian) preserve specific decisions and
  alliances he undertook but do not give us substantive access
  to his political character, his strategic style, or his
  personal life. What can be reconstructed is the pattern of a
  Massylii king who maintained Carthaginian alliance through
  three decades of Numidian-Carthaginian relations and whose
  death created the political vacuum the war's African phase
  would shortly exploit.

  The Carthaginian alliance. Gala's reign over the
  Massylii, datable to approximately the 230s through 206 BCE
  on the basis of the surviving political-event references, was built on the Carthaginian alliance system
  that had developed through the late third century BCE. The
  Massylii contributed cavalry contingents to Carthaginian
  forces during the [Iberian campaigns](/places/iberia) of the
  220s and 210s, with Masinissa himself commanding Numidian
  cavalry under Carthaginian authority during his late teens
  and early twenties. The alliance was the structural
  framework within which both Gala's external political
  position and Masinissa's military career developed.

  The Sophonisba betrothal. Appian says Hasdrubal Gisco
  betrothed his daughter Sophonisba to Masinissa, and that the
  Carthaginians later gave her to Syphax without the knowledge
  of Hasdrubal or Masinissa, both then in Iberia (*Punica* 10).
  Livy has no betrothal (29.23). No source gives Gala any part
  in the match or records his response to its reversal.

  The succession. Livy narrates what followed Gala's death in
  detail, in the digression he allows himself on Masinissa's
  loss and recovery of his father's kingdom (29.29–30), and the
  sequence is specific rather than obscure. Gala died while
  Masinissa was serving for Carthage in Iberia. The throne went
  not to the son but to Gala's brother Oezalces, a very old man,
  "for such is the custom among the Numidians": succession by
  seniority within the royal kin, which is the one statement any
  source makes about how the Massylian kingship passed. Oezalces
  died soon after, and the elder of his two sons, Capussa,
  took the kingdom with the younger still a boy.

  Capussa held it by the custom of his people rather than by
  standing or force, and a man of royal blood from a rival
  branch, Mazaetullus, raised the commons against him, forced a
  battle and killed him. Mazaetullus declined the royal name,
  called the surviving boy Lacumazes king and made himself his
  guardian, married Oezalces's widow, a Carthaginian noblewoman
  who was the daughter of Hannibal's sister, in the hope of an
  alliance with Carthage, and renewed an old friendship with
  Syphax (29.29; see the
  [claim](/claims/barcid-numidian-royal-marriage)). Masinissa
  came back from Iberia by way of Mauretania, whose king gave him
  four thousand Moors as an escort, beat Mazaetullus in the
  field and recovered his father's kingdom, then pardoned both
  him and Lacumazes, which Livy says the Carthaginians worked
  hard to prevent (29.30).

  Gala's death therefore did not open a vacuum that Masinissa
  walked into. It set a collateral branch on the throne and then
  a usurper who sought Carthaginian backing, and Masinissa had
  to take the kingdom by war before Carthage set Syphax on him
  and took it away again.

  Gala is the second-most-attested Numidian figure of the
  Second Punic War period after his son Masinissa. The site's
  treatment foregrounds his structural role in maintaining
  the Massylii-Carthaginian alliance system across three
  decades and in producing, through his death and the
  succession crisis it triggered, the political configuration
  Masinissa would subsequently exploit to defect, marry into
  Roman alignment, and reshape North African politics for the
  next half-century.
