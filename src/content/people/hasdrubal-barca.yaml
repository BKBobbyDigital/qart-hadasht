summary: >
  Middle son of Hamilcar Barca, brother of Hannibal and Mago,
  Carthaginian commander in Iberia from 218 BCE to 207 BCE and
  the principal hope of Hannibal's strategic position in Italy.
  Hasdrubal took over the Iberian command when Hannibal
  departed for Italy in 218 BCE, defended the peninsula against
  the elder Scipios for nearly a decade, and after the Roman
  capture of Carthago Nova in 209 BCE under the future Africanus
  began the march to Italy that the Roman strategy of his elder
  brother in southern Italy desperately needed. He crossed the
  Alps in 208-207 BCE (more easily than Hannibal had a decade
  earlier) and entered northern Italy in early summer 207. The
  Roman consuls Marcus Livius Salinator and Gaius Claudius Nero
  intercepted him at the Metaurus river before he could reach
  Hannibal in Bruttium; Hasdrubal was defeated and killed. The
  delivery of his severed head to Hannibal's camp is preserved
  in Livy 27.51 and was understood by Hannibal himself, in the
  surviving tradition, as the moment the war's strategic
  outcome became unrecoverable.
