etymology: >
  ʿAzrubaʿl ("Baʿal helps") with the Barca cognomen ("lightning")
  inherited from his father [Hamilcar Barca](/people/hamilcar-barca).
  Distinguished from the several other Carthaginian commanders named
  Hasdrubal on the site by the Barca surname — principally from
  [Hasdrubal the Fair](/people/hasdrubal-the-fair) (his
  brother-in-law and Barcid Iberian-command predecessor) and
  [Hasdrubal Gisco](/people/hasdrubal-gisco) (the non-Barcid
  Carthaginian commander of the late war's African phase).
