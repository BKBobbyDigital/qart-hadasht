name_latin: Hamilcar
etymology: >
  Hamilcar (Punic ʿAbd-Melqart, "servant of Melqart") was a common
  Carthaginian theophoric name borne by multiple distinct historical
  figures. This Hamilcar is distinguished by his patronymic (son of
  Hanno) and by his Magonid family connection. The Magonids, named
  after the founding general Mago, dominated Carthaginian military
  and political life from the late 6th to the mid-5th century BCE
  and provided the principal commanders of the early Carthaginian
  Sicilian campaigns.
