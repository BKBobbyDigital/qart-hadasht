summary: >
  Carthaginian general of the Magonid family who commanded the
  Carthaginian invasion of Sicily in 480 BCE that ended in the
  catastrophic defeat at Himera. Sent in response to appeals from
  Terillus (the exiled tyrant of Himera) and Anaxilas of Rhegium,
  Hamilcar landed at Panormus (modern Palermo) with a force the
  surviving sources estimate at hundreds of thousands of men, almost
  certainly an inflated figure but pointing to a major expedition by
  any reasonable reading. The army marched east along the north
  coast of Sicily and was met at Himera by the combined forces of
  Gelon of Syracuse and Theron of Akragas. The engagement that
  followed was a Greek victory of the first magnitude. Hamilcar,
  according to Herodotus, killed himself in the Carthaginian camp by
  leaping into the sacrificial fire when he saw the battle going
  against him; Diodorus has a slightly different version. Either
  way, his death and the Carthaginian rout produced a Greek victory
  the surviving sources treat as comparable in scale to the
  contemporary Greek victories over the Persians on the mainland.
  Hamilcar is the first major Carthaginian commander to enter the
  surviving record by name and the first to suffer a catastrophic
  defeat at Greek hands.
