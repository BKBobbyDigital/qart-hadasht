etymology: >
  Hamilcar (Punic *ḤMLQRT*, usually read as "Melqart is gracious"; the exact form behind the Greek is not certain) is a common
  Carthaginian theophoric name borne by several distinct historical
  figures across four centuries. This Hamilcar is distinguished by
  his patronymic, son of Hanno, and by his Magonid family
  connection. The Magonids, named after the founding general Mago,
  dominated Carthaginian military and political life from the late
  sixth through the mid-fifth century BCE and supplied the
  principal commanders of the early Carthaginian Sicilian
  campaigns. He should not be confused with
  [Hamilcar Barca](/people/hamilcar-barca) (Hannibal's father, two
  and a half centuries later) or with
  [Hamilcar son of Gisco](/people/hamilcar-son-of-gisco) (the
  Carthaginian commander against Agathocles in the 310s).
