summary: >
  The Roman senator who led the opposition to Cato the Elder's campaign
  for war on Carthage in the late 150s. Scipio Nasica Corculum was the
  son-in-law of Scipio Africanus (married to Africanus's daughter
  Cornelia), consul in 162 and 155 BCE and censor in 159, and is usually
  said to have been *princeps senatus*, first in the senate's speaking
  order, from 147 until his death in 141.

  His importance for Carthaginian history is that he won the argument
  for several years before losing it. The summary of Livy's Book 48 has
  Cato move for war three times and the senate each time follow Nasica,
  sending envoys to investigate and then passing a conditional
  resolution, on his grounds that nothing should be done rashly and that
  no just cause for war yet existed. Plutarch (*Cato Maior* 27) says that
  where Cato added to every vote that Carthage must not exist, Nasica
  added that it should be spared; Florus (1.31) gives the Latin as
  *servandam*. On why the popular tags are modern, see
  [the claim on Cato's phrase](/claims/cato-delenda-est-historicity).

  The reason he is remembered for is a different one: that Rome needed a
  Carthage to fear, to keep its people disciplined and its rule over its
  allies restrained. Plutarch, Appian, Florus and a fragment of Diodorus
  give it, and Augustine (*City of God* 1.30) later cited it as a
  prophecy that came true. All of them wrote after the Gracchi and the
  civil wars, and Plutarch offers the motive as his own guess, so the
  argument may owe more to later Roman explanations of the republic's
  decline than to what Nasica said in the 150s. The two reasons are
  weighed in [the claim on his opposition](/claims/nasica-opposition-to-delenda-est).

  The war was declared in 149, over his objection, after Carthage had
  fought Masinissa without Roman consent. The name Nasica was also borne
  by his father, the *vir optimus* chosen to receive the Magna Mater in
  204, and by his son Serapio, who led the killing of Tiberius Gracchus
  in 133; the later tradition sometimes runs the three together.
