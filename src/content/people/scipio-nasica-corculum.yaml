name_display: Publius Cornelius Scipio Nasica Corculum
name_latin: Publius Cornelius Scipio Nasica Corculum
etymology: >
  *Corculum*, "little heart", a personal cognomen reflecting
  reputed wisdom and prudence (a Latin idiom in which "heart"
  meant intelligence). Distinguished from his father (Scipio
  Nasica, the *vir optimus* selected to receive the Magna
  Mater in 204 BCE) and his son (Scipio Nasica Serapio).
