summary: >
  The Roman senator who served as the principal sustained
  opponent of Cato the Elder's decade-long advocacy for
  Carthage's destruction. Scipio Nasica Corculum was the
  son-in-law of Scipio Africanus (married to Africanus's
  daughter Cornelia), held the consulship twice (162 and
  155 BCE), the censorship in 159 BCE, and was elected
  *princeps senatus* (head of the senate's speaking order)
  in 147 BCE, a position he held until his death in 141.

  His political importance for Carthaginian history lies
  in his consistent senatorial opposition to Cato's
  campaign for the city's destruction. Where Cato ended
  every senatorial speech with the famous formula
  advocating destruction, Nasica reportedly ended his with
  the counter-formula *Carthago servanda est*, "Carthage
  must be preserved", though the surviving textual
  evidence for this exact formula is, like Cato's
  *delenda est*, somewhat reconstructed from Plutarch's
  Greek-language preservation.

  The substantive political argument Nasica made, preserved
  most fully in Plutarch (*Cato Major* 27) and in Diodorus
  (34/35 fragment), was structural: Carthage's
  preservation was strategically valuable to Rome
  precisely *because* it kept the Roman political class
  disciplined. The fear of an external rival, Nasica
  argued, was the principal mechanism preventing the
  internal moral and political decay that would otherwise
  follow Roman Mediterranean dominance. The famous
  Augustinian critique of Roman virtue as
  fear-of-Carthage-dependent (*De Civitate Dei* 1.30)
  draws explicitly on this Nasica-tradition argument
  preserved through the Stoic-Roman moral-political
  literature.

  Nasica's position lost the senatorial debate. Cato died
  in 149 BCE shortly after the war's outbreak; the war
  proceeded without him; the destruction occurred in 146
  BCE while Nasica was *princeps senatus*. Whether
  Nasica's continued senatorial influence affected the
  war's prosecution is contested in modern scholarship:
  the evidence is consistent with persistent Nasica
  opposition that did not prevent the destruction but
  may have shaped its terms. After 146 BCE Nasica's
  position was reportedly vindicated in his own framing:
  the Roman political class did indeed shift toward the
  internal conflicts of the Gracchan period within a
  generation of Carthage's destruction, consistent with
  his earlier prediction.

  Nasica is one of the more morally interesting figures
  of late-republican-era Roman senatorial politics.
  Plutarch, Diodorus, and the later Stoic tradition treat
  him as the exemplary case of strategic-moral foresight
  in the senatorial debate; modern scholarship has been
  more cautious about taking his preserved arguments at
  face value, since they reach us through filters
  (Plutarch, Augustine) that have their own reasons to
  preserve a counter-narrative to the destruction-as-
  inevitable framing.
