polity: Ilergetes (Iberian)
summary: >
  The junior of the two brothers who led the Ilergetes
  through the Second Punic War's Iberian theatre. Mandonius's
  career is preserved in the surviving sources almost
  entirely as a paired narrative with his elder brother
  Indibilis: the two appear together at every documented
  moment, are captured together at New Carthage in 209 BCE,
  defect together to Rome, revolt together in 206 BCE, and
  meet their parallel fates in 205. The pair is treated as
  a unit through Polybius and Livy with rare separation.

  Mandonius's distinctive role in the surviving record is
  primarily diplomatic. Where Indibilis appears as the
  senior military commander, Mandonius is given the role
  of negotiator and envoy in the brothers' interactions
  with Roman authority. Polybius and Livy preserve
  particular detail of Mandonius's negotiation with Scipio
  Africanus during the surrender at New Carthage and his
  later embassy to Rome on behalf of Iberian interests. The
  diplomatic role is consistent with the typical
  Mediterranean tribal-confederation pattern of senior
  brother as warrior-chief and junior as diplomat-envoy.

  Mandonius's death by crucifixion in 205 BCE, captured
  rather than killed in battle, is preserved across the
  surviving sources as the parallel and counterpoint to
  Indibilis's battlefield death. The execution is the
  clearest surviving Roman example of post-revolt
  punishment of an allied chieftain who had switched sides
  twice; it is also part of the body of evidence for the
  collapse of Scipionic *humanitas* in his absence from
  Iberia.
