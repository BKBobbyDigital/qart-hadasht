summary: >
  King of Tyre in the foundation legend of Carthage, the elder
  brother of Dido. In the tradition preserved by Justin (Book 18),
  Pygmalion murdered his sister's husband Sychaeus for the
  treasure Sychaeus was reported to have buried. Dido's flight
  with the treasure (which she successfully concealed from
  Pygmalion's officers and brought to North Africa) was the
  proximate cause of her foundation of Carthage. A historical
  Pygmalion of Tyre is attested independently of the Carthage
  legend in various Phoenician epigraphic sources (notably a
  ninth-century BCE Tyrian dedication on Cyprus) and reigned
  approximately 820-774 BCE, which is broadly consistent with the
  traditional 814 BCE foundation date. The historicity of the
  king as a Tyrian sovereign is therefore on more secure footing
  than the historicity of Dido or the foundation narrative
  itself.
