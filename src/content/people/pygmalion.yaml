name_latin: Pygmalion
etymology: >
  The Punic name Pumayyaton (PMYTN) is reconstructed from the
  preserved Greek and Latin renderings and from a small number of
  potential Phoenician epigraphic attestations. The name combines
  the divine name Pumay (a Cypriot Phoenician deity) with -yton
  ("given by"), yielding "given by Pumay." The Greek-Latin form
  Pygmalion is a Hellenizing rendering. The Pygmalion of the Greek
  myth of the sculptor and his statue is unrelated; the names
  coincide.
