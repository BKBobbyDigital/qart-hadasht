summary: >
  Ruler of Cyrene and a former companion of Alexander the Great, who
  joined Agathocles against Carthage in 308 BCE and was killed by him.
  Agathocles offered him a partition, Africa for Ophellas and Sicily for
  himself once Carthage was defeated. Ophellas, who hoped to rule Libya,
  recruited colonists from Athens (his wife was an Athenian of the family
  of Miltiades) and marched more than 10,000 foot, 600 horse and 100
  chariots, with as many noncombatants, across the desert of the Syrtis
  for more than two months (Diodorus 20.40–42). A few days after he
  arrived, Agathocles accused him of plotting, attacked his camp while
  many of his men were foraging, and took over his army; Ophellas died
  fighting (20.42). Justin tells it as a murder off guard after the two
  had dined together often and Ophellas had adopted Agathocles' son
  (22.7). The popular banquet version combines the two; see the
  [claim](/claims/agathocles-ophellas-murder).
