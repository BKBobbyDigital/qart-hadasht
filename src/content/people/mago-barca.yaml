etymology: >
  Magon (𐤌𐤂𐤍) derives from the Punic root *mgn* ("to bestow, give"),
  yielding "gift" or "benefactor" — a common Phoenician personal name
  also borne by the founder of the Magonid dynasty (Mago I), by
  [the Carthaginian agricultural writer](/people/mago-agronomist), and
  by several other figures across Carthaginian history. The Barca
  surname (Punic *brq*, "lightning") was his father Hamilcar's personal
  epithet that became the family name of his line.
