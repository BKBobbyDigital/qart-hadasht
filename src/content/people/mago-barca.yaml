etymology: >
  Magon (𐤌𐤂𐤍) derives from the Punic root mgn ("to bestow, give"),
  yielding "gift" or "benefactor", a common Phoenician personal name
  also borne by the Carthaginian agricultural writer Mago and several
  earlier figures. The Barca surname distinguishes him as a son of
  Hamilcar.
