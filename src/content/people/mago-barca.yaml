summary: >
  Youngest brother of Hannibal and Hasdrubal Barca. Commanded the
  Carthaginian reserve at Cannae in 216 BCE, where his veteran African
  troops were decisive in the encirclement that destroyed the Roman army.
  Sent back to Carthage after Cannae to deliver the news (and reportedly
  the famous bushel of equestrian rings), then commanded in Iberia
  (215–206 BCE) before opening a third front in northern Italy in
  205–203 BCE in an attempt to relieve pressure on his brother. Wounded
  at the Battle of Insubria (203 BCE), he died at sea on the return
  voyage to Africa, never reaching Carthage.
