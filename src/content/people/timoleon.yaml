summary: >
  Corinthian general dispatched to Sicily in 344 BCE to
  reorganize Greek-Sicilian politics after the chaos of the
  later Dionysian period. Timoleon overthrew the dynastic
  succession of Dionysius II at Syracuse, restored
  constitutional government across Greek Sicily, and in 341
  BCE defeated a major Carthaginian invasion at the Battle of
  the Crimisus river. The victory restored Greek-Sicilian
  control over much of the territory lost during the late
  4th-century Carthaginian advances and is preserved in
  Plutarch's *Life of Timoleon* with detailed tactical and
  political framing. Timoleon retired from public office after
  his Sicilian achievements and died at Syracuse in 337 BCE,
  honored by both contemporary and later Greek tradition as
  an exceptional statesman.
