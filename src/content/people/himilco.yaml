etymology: >
  Punic *Ḥimilkat* — common Carthaginian aristocratic name
  meaning roughly "[my] brother is the king" or "brother of
  the king." Used by multiple Carthaginian commanders across
  the Punic period; this Himilco, the Magonid commander of
  the early 4th century BCE, is sometimes designated
  "Himilco I" or "Himilco son of Hanno" in modern scholarship
  to distinguish him from later bearers of the name.
