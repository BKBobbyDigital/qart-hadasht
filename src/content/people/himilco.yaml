summary: >
  The principal Carthaginian field commander of the late 5th
  and early 4th centuries BCE — the figure who led the
  Carthaginian Sicilian campaigns from the death of his
  cousin Hannibal son of Gisco at Akragas in 406 BCE through
  the catastrophic plague-and-retreat at Syracuse in 396.
  Himilco's record runs from the high point of Carthaginian
  Sicilian power to its sharpest reversal in a decade.

  The campaigns under his command:

  - **406–405 BCE: completion of the second Hannibalic
    invasion.** Took over from Hannibal son of Gisco at
    Akragas; completed the city's sack; campaigned south to
    Gela in 405 BCE, sacked it, accepted Dionysius's
    inconclusive surrender of Camarina, and concluded the
    406-405 phase with most of southern Sicily under
    Carthaginian control.
  - **397–396 BCE: counter-offensive against Dionysius.**
    Following Dionysius's 398 invasion of Carthaginian
    Sicily and the spectacular capture of Motya in 397,
    Himilco led the Carthaginian counter-attack. His army
    recovered most of western Sicily, advanced east, and
    laid siege to Syracuse itself.
  - **396 BCE: the catastrophe.** A plague broke out in the
    Carthaginian camp at Syracuse — interpreted by the
    surviving Greek tradition as divine punishment for
    Carthaginian temple desecration during the campaign,
    most pointedly at Demeter and Persephone shrines. The
    army was effectively destroyed; Himilco negotiated
    safe passage home for his Carthaginian citizen troops
    while abandoning the African and mercenary contingents.

  Himilco returned to Carthage in disgrace and committed
  suicide by self-starvation, after performing public
  acts of penance for the Demeter sacrilege. The Demeter
  cult was subsequently incorporated into Carthaginian
  state religion — a structurally significant act of
  Carthaginian-Greek religious accommodation.
