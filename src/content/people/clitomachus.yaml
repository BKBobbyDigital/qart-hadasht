etymology: >
  His Carthaginian name was Hasdrubal, Punic *ʿAzrubaʿl*, "Baal is my
  help", one of the commonest names in the city. Clitomachus, "famed in
  battle", is the Greek name he used in Athens. Diogenes Laertius gives
  both (4.67).
