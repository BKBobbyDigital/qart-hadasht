summary: >
  Daughter of [Hasdrubal Gisco](/people/hasdrubal-gisco) and the
  most-attested individual Carthaginian woman in the surviving
  ancient record. Originally betrothed to the Numidian Massylii
  prince Masinissa during his service with the Carthaginian army
  in Iberia, Sophonisba was instead married by her father to
  Syphax of the Masaesyli around 206 BCE as a Carthaginian
  diplomatic move to secure western Numidian alliance against
  the Roman threat. After Syphax's defeat by Scipio and
  Masinissa at the Battle of the Great Plains in 203 BCE,
  Masinissa entered Cirta (the Masaesylian capital) and married
  Sophonisba within a day of her former husband's capture — a
  marriage understood by both Greek and Roman sources as a
  political move to extend Masinissa's authority over Syphax's
  kingdom under cover of dynastic continuity, though Livy's
  narrative framing reads it as Masinissa's sudden passion.

  Scipio Africanus, learning of the marriage, demanded that
  Masinissa surrender Sophonisba for the Roman triumph as a
  Carthaginian war captive. Masinissa, unwilling to surrender
  her and unwilling (or unable) to refuse Scipio's demand, sent
  her poison; Sophonisba took it and died at Cirta in late 203
  BCE. The episode is preserved in Livy 30.12-15 with
  characteristic dramatic detail; the substance is firmly
  attested across the parallel accounts in Appian (*Punica*
  27-28) and Diodorus (27.7), while the specific dialogue and
  the romantic-tragic framing are Livian and Greek-Latin
  literary elaboration. The episode has had an extensive
  literary afterlife in European reception — Petrarch's *Africa*,
  multiple Renaissance and Baroque tragedies, at least a dozen
  operas (Caldara, Gluck, and others), Voltaire's *Sophonisbe* —
  with the femme-fatale framing increasingly elaborated across
  the European tradition.

  The site treats Sophonisba carefully because she comes to us
  almost entirely through hostile Roman literary framing. Livy's
  narrative reads her as the Carthaginian political-sexual
  instrument whose marriage to Syphax substantively caused his
  defection from a Roman alliance to Carthage, and whose
  marriage to Masinissa risked the same realignment a second
  time. Modern scholarship has worked on reading past this
  framing to recover what's directly attested versus what's
  Livy's narrative shaping. The reframing is parallel to the
  site's reading of [Indibilis and Mandonius](/narratives/indibilis-and-mandonius):
  political agency that the hostile Greco-Roman tradition frames
  in moralizing-affective terms (femme fatale, faithless ally)
  which can be re-read as substantive political action within
  the structures the actor actually faced.

  Three structural observations are worth foregrounding against
  the Livian framing. First, Syphax's commitment to Carthage in
  205-203 BCE had substantive non-marital political grounds —
  Numidian-territorial interests, the calculation about which
  Mediterranean power was more likely to prevail, the existing
  Masaesyli-Carthaginian relationship that predated the marriage
  — that the surviving Roman tradition under-weights in favor
  of the Sophonisba-causation framing. Second, marriage
  diplomacy at this scale was a standard Hellenistic-and-
  Mediterranean practice (Ptolemaic-Seleucid, Antigonid-Attalid,
  the broader Hellenistic-royal network all operated similar
  systems); Sophonisba's marriages were not a uniquely
  Carthaginian intelligence operation but participation in the
  routine political-diplomatic instrument of the period. Third,
  the suicide pattern Livy elaborates — defiant final speech,
  acceptance of poison as wedding gift, refusal of Roman
  triumphal display — fits the broader Greco-Roman noble-suicide
  literary topos closely enough to be read as substantially
  literary shaping of a kernel event (the suicide by poison)
  that the parallel sources preserve in less developed form.

  The reframing does not assert that Sophonisba was a fully
  autonomous political actor exercising her own foreign policy —
  the surviving evidence does not support that and the political
  structures she operated within would not have permitted it.
  What it asserts is that her actions and death followed the
  logic of her position within the marriage-diplomacy structures
  of late-3rd-century-BCE Carthaginian foreign policy rather
  than the moral shape the Livian tradition assigned them. She
  is the most-attested individual Carthaginian woman in the
  surviving record; what we know of her is principally the
  political-historical context her actions intersected, with
  her own life as such largely not recoverable from the
  surviving evidence.

  Her treatment is part of the broader site discussion of
  [women and family in Carthage](/themes/women-and-family),
  which addresses the surviving-evidence base for Carthaginian
  women's lives and the methodological discipline of working
  honestly within its limits.
