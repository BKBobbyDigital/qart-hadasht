summary: >
  Carthaginian general and son-in-law of Hamilcar Barca, who
  inherited the Iberian command on Hamilcar's death in 228 BCE
  and held it until his own assassination in 221 BCE.

  He appears in the record as a political operator before he
  appears as a commander.
  [Appian](/sources/appian-iberica) says that when Hamilcar's
  enemies prosecuted him after the Mercenary War, holding him
  answerable for the promises that started it and for the loss
  of Sardinia, he escaped by winning the support of leading men,
  and names Hasdrubal, his son-in-law, as the chief of them (4).
  Polybius carries nothing of this, and Appian is late and
  unfriendly to the Barcids, so the episode is his alone. If it
  is right, the succession in Iberia looks less like a soldier
  handing on a command than like a partnership in which one man
  held the field and the other held Carthage.

  Hasdrubal
  consolidated and extended the Carthaginian Iberian conquest
  Hamilcar had begun: completed the subjugation of southern
  Iberian populations through diplomacy and dynastic marriage
  rather than primarily through campaign; founded the city of
  Carthago Nova (modern Cartagena) on the southeastern Iberian
  coast as the new Carthaginian Iberian capital and naval base;
  negotiated the Ebro Treaty with Rome in 226 BCE establishing
  the Ebro river as the boundary of Carthaginian operations in
  Iberia.

  What stands behind the marriage is gossip, and two Roman authors
  carry it. [Nepos](/sources/nepos-hamilcar) says there was with
  Hamilcar a distinguished and handsome young man, Hasdrubal, whom
  some said Hamilcar loved more basely than was decent; that a
  prefect of morals forbade Hasdrubal to be in his company; and that
  Hamilcar gave him his daughter, since custom did not allow a
  son-in-law to be barred from his father-in-law (*Hamilcar* 3.2).
  [Livy](/sources/livy-auc) has the rumor without the mechanism:
  Hasdrubal was first attached to Hamilcar by the bloom of his youth,
  "so they say", and became son-in-law later for other qualities
  (21.2.4). Both authors mark it as talk rather than assert it, and
  neither says what the talk was worth. Two things in it are worth
  more than the scandal: it supplies a reason for a marriage the other
  sources only record, and Nepos's prefect of morals is a Carthaginian
  office concerned with conduct that is attested nowhere else.

  The political charge travels with it. Nepos says Hasdrubal won great
  victories but corrupted the old Carthaginian customs by his largess
  to soldiers and people (3.3). Livy makes the same point structurally:
  the Barcine faction's standing with the soldiers and the common
  people carried him, and the leading men were against him (21.2.4).
  That is a Roman reading of Carthaginian politics through Roman
  categories of populist and optimate, and it should not be taken for
  a description of Carthaginian institutions. But it is also the second
  independent indication, alongside
  [Appian](/sources/appian-iberica) 4, that the Barcid position rested
  on a faction and had organized opposition.

  Iberia was not his only command. Diodorus says he was sent from Spain
  to Carthage against the Numidians when they revolted, killed eight
  thousand and took two thousand alive, and that the rest, who had
  been paying tribute, were reduced to slavery (25.10.3). The Iberian
  army was therefore used on African business while Hamilcar still
  lived, which is worth weighing against any picture of the province as
  a wholly separate enterprise.

  When Hamilcar died, [Polybius](/sources/polybius-histories) says the
  Carthaginians handed the army over to Hasdrubal, "his son-in-law and
  chief naval officer" (2.1.9). The naval title is the only indication
  of what he had been doing in the preceding nine years, and it suits a
  project whose base was a port.

  Hasdrubal's command differed from Hamilcar's: where
  Hamilcar had favored military conquest, Hasdrubal favored
  state-building through administrative infrastructure. His
  marriage to an Iberian princess anchored a network of
  aristocratic intermediaries; the formalized treaty-and-tribute
  structures with the named Iberian polities of southern and
  eastern Iberia extended the apparatus's reach by political-
  administrative means rather than by garrison; the foundation
  of Carthago Nova on one of the finest harbors of the coast,
  where Polybius says the Carthaginians kept the bulk of their
  money and war material and where he saw a palace said to have
  been built when Hasdrubal aspired to royal power (10.10),
  established the project's institutional
  center.

  How long the command ran is not agreed. The conventional 228–221
  gives seven years, Livy says about eight (21.2.3), and Diodorus has
  him killed in the ninth year of his command (25.12). The site keeps
  the conventional dates while noting that they are a reconstruction
  rather than a figure any source supplies. The Hasdrubal command is
  the period in
  which the Barcid Iberian apparatus took shape as a substantive
  polity, treated under the editorial take on
  [the Barcid Iberian state as state](/editorialTakes/barcid-iberian-state-as-state)
  and the narrative
  [The Barcid Iberian state](/narratives/the-barcid-iberian-state).
  He was assassinated in 221 BCE by a Celtiberian attendant in
  revenge for an execution Hasdrubal had ordered earlier. Command
  passed by acclamation of the army to the 26-year-old Hannibal
  Barca, who would prosecute the inherited project to the
  Saguntum siege and the Second Punic War.
