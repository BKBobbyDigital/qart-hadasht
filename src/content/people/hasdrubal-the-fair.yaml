summary: >
  Carthaginian general and son-in-law of Hamilcar Barca, who
  inherited the Iberian command on Hamilcar's death in 228 BCE
  and held it until his own assassination in 221 BCE. Hasdrubal
  consolidated and extended the Carthaginian Iberian conquest
  Hamilcar had begun: completed the subjugation of southern
  Iberian populations through diplomacy and dynastic marriage
  rather than primarily through campaign; founded the city of
  Carthago Nova (modern Cartagena) on the southeastern Iberian
  coast as the new Carthaginian Iberian capital and naval base;
  negotiated the Ebro Treaty with Rome in 226 BCE establishing
  the Ebro river as the boundary of Carthaginian operations in
  Iberia.

  Hasdrubal's command style differed from Hamilcar's: where
  Hamilcar had favored military conquest, Hasdrubal favored
  state-building through administrative infrastructure. His
  marriage to an Iberian princess anchored a network of
  aristocratic intermediaries; the formalized treaty-and-tribute
  structures with the named Iberian polities of southern and
  eastern Iberia extended the apparatus's reach by political-
  administrative means rather than by garrison; the foundation
  of Carthago Nova as a planned colonial capital — designed
  harbor, residential and administrative quarters, sanctuary,
  mint — established the Barcid Iberian project's institutional
  center. The seven-year Hasdrubal command is the period in
  which the Barcid Iberian apparatus took shape as a substantive
  polity, treated under the editorial take on
  [the Barcid Iberian state as state](/editorialTakes/barcid-iberian-state-as-state)
  and the narrative
  [The Barcid Iberian state](/narratives/the-barcid-iberian-state).
  He was assassinated in 221 BCE by a Celtiberian attendant in
  revenge for an execution Hasdrubal had ordered earlier. Command
  passed by acclamation of the army to the 26-year-old Hannibal
  Barca, who would prosecute the inherited project to the
  Saguntum siege and the Second Punic War.
