etymology: >
  Yet another Carthaginian Hasdrubal (Punic ʿAzrubaʿl, "Baʿal
  helps"). The Greek-Latin epithet *kalos* / *pulcher* ("the
  fair" or "the handsome") distinguishes him from the multiple
  other Hasdrubals across the surviving record. Son-in-law of
  Hamilcar Barca through marriage to one of Hamilcar's
  daughters.
