summary: >
  Carthaginian general and son-in-law of Hamilcar Barca, who
  inherited the Iberian command on Hamilcar's death in 228 BCE
  and held it until his own assassination in 221 BCE. Hasdrubal
  consolidated and extended the Carthaginian Iberian conquest
  Hamilcar had begun: completed the subjugation of southern
  Iberian populations through diplomacy and dynastic marriage
  rather than primarily through campaign; founded the city of
  Carthago Nova (modern Cartagena) on the southeastern Iberian
  coast as the new Carthaginian Iberian capital and naval base;
  negotiated the Ebro Treaty with Rome in 226 BCE establishing
  the Ebro river as the boundary of Carthaginian operations in
  Iberia.

  Hasdrubal's command style differed from Hamilcar's: where
  Hamilcar had favored military conquest, Hasdrubal favored
  political integration through dynastic marriage (he himself
  married an Iberian princess; his Iberian-Carthaginian alliance
  network became the structural foundation of Carthaginian
  authority in the peninsula). He was assassinated in 221 BCE by
  a Celtiberian attendant in revenge for an execution Hasdrubal
  had ordered earlier. Command passed by acclamation of the
  army to the 26-year-old Hannibal Barca, who would prosecute
  the inherited Iberian project to its catastrophic conclusion
  at Saguntum and the Second Punic War.
