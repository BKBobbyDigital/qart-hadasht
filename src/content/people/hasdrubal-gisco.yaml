summary: >
  Carthaginian general active in Iberia during the later Second Punic War, where
  he commanded one of the three Punic armies confronting Scipio. Defeated at
  Ilipa in 206 BCE, he withdrew to Africa to organize the defense of Carthage
  itself. Took a leading role at Zama in 202 BCE, where ancient sources name
  him among Hannibal's principal subordinates. His daughter Sophonisba married
  first the Numidian king Syphax, securing him as a Carthaginian ally, and
  later, briefly, Masinissa. Tradition reports that Hasdrubal Gisco took his
  own life after Zama to avoid Roman reprisal.
