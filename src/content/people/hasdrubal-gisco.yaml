  notes: >
    Death conventionally placed at or shortly after Zama in 202 BCE.
    The surviving tradition (Appian *Punica* 38; Livy 30.7 and 30.42)
    reports that Hasdrubal Gisco took his own life after Zama to
    avoid Roman reprisal and to escape the political consequences of
    the war's outcome.
