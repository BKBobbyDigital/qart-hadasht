name_punic: ʿAzrubaʿl
name_punic_script: 𐤏𐤆𐤓𐤁𐤏𐤋
name_greek: Ἀσδρούβας
name_latin: Hasdrubal
etymology: >
  ʿAzrubaʿl combines *ʿzr* ("help") with the divine name *Baʿal*
  ("lord"), yielding "Baʿal helps" or "help of Baʿal." The patronymic
  "son of Gisco" (Punic *GSKN*) distinguishes him from the several
  other Carthaginian commanders named Hasdrubal active in the same
  period, including [Hasdrubal Barca](/people/hasdrubal-barca)
  (Hannibal's brother) and [Hasdrubal the Fair](/people/hasdrubal-the-fair)
  (Hamilcar's son-in-law and Barcid Iberian-command predecessor).
