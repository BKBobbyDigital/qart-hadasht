name_latin: Hannibal Monomachus
etymology: >
  The personal name is the common Punic *Ḥannibaʿl*, "grace of Baal",
  shared with his commander and with many other Carthaginians. The
  distinguishing epithet is Greek: *monomachos*, "the single-combat
  fighter", which the Latin tradition renders as "the gladiator". It is
  a nickname rather than a patronymic, and it is the only thing that
  separates him from the other Hannibals in the record.
