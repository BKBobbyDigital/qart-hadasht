summary: >
  One of the named members of [Hannibal Barca's](/people/hannibal-barca)
  circle, and the source of the most-repeated story about Carthaginian
  savagery in the whole tradition. Everything known about him comes from
  a single passage of [Polybius](/sources/polybius-histories) (9.24),
  preserved not in the main manuscript tradition but in a tenth-century
  Byzantine anthology of virtues and vices.

  ## The proposal

  During the planning for the march on Italy, the question arose of how
  an army was to be fed across country that could not supply it.
  Monomachus proposed that the troops be taught to eat human flesh and
  accustomed to it. Polybius records that Hannibal could find no fault
  with the boldness or the usefulness of the suggestion, and could
  persuade neither himself nor his friends to entertain it. **The
  proposal was rejected.**

  That ordering matters, because the story is almost always repeated
  the other way round. What the source actually reports is a commander
  declining a subordinate's extreme recommendation. The popular
  association of Hannibal with cannibalism inverts the only evidence
  there is for it.

  ## What Polybius is doing with him

  Monomachus is not introduced for his own sake. He appears inside
  Polybius's digression on Hannibal's character, whose argument is that
  a man in Hannibal's position is pushed by the promptings of friends
  and the pressure of circumstances into acting against his own nature.
  Polybius then says it plainly: the acts of cruelty in Italy for which
  Hannibal is blamed were the work of this man.

  This is exculpation with a named scapegoat, and the site does not take
  it at face value. Polybius admired Hannibal's generalship and had a
  reason to want the atrocity charges attached to somebody else, and the
  device of loading a commander's worst conduct onto a bad adviser is an
  old one. [Rawlings](/sources/rawlings-hannibal-cannibal-2007) treats
  the Polybian handling of Barcid atrocity as ideology rather than
  analysis, and the same caution applies here.

  What the passage does establish, whatever one makes of the
  attribution, is that Hannibal had a circle whose members were known by
  name, whose advice was recorded, and whom a later historian could
  treat as an explanation for his commander's conduct. That is the
  nearest the sources come to describing the Barcid entourage as a body,
  and it is treated further in the narrative on
  [Hannibal's historians](/narratives/hannibals-historians) and in the
  [claim on the character digression](/claims/hannibal-circle-polybian-exculpation).

  ## Identification

  He is not to be confused with any of the other Hannibals of the
  period, and the epithet is the only safeguard. He is a different
  person from Hannibal Barca, from
  [Hannibal son of Bomilcar](/people/hannibal-son-of-bomilcar), from
  Hannibal the Rhodian of the Lilybaeum blockade, and from the Magonid
  [Hannibal son of Gisco](/people/hannibal-son-of-gisco). Nothing
  further about his family, rank, or fate survives.
