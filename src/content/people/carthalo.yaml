summary: >
  A Carthaginian officer of the Second Punic War who appears three
  times in Livy, each time doing the same kind of work: carrying
  something to the Romans that Hannibal wanted them to receive. He is
  one of the few men in the Carthaginian command whose career can be
  followed at all, and he is worth a page because what he was used for
  says something about how Hannibal conducted the war.

  ## The embassy after Cannae, 216

  After [Cannae](/events/battle-of-cannae) Hannibal sent ten Roman
  captives to Rome under oath to arrange the ransom of the prisoners
  taken in the camp, and sent Carthalo with them with instructions to
  offer terms if he found the Romans inclined to peace. A dictator's
  lictor met him and ordered him out of Roman territory before dark,
  and the senate refused the ransom (Livy 22.58). Polybius tells the
  story of the ten envoys without naming Carthalo at all (6.58), and
  says the refusal dismayed Hannibal more than the victory had elated
  him.

  The episode carries two of the site's arguments: that Hannibal
  expected a negotiated end, treated at
  [the claim on his war aims](/claims/hannibal-limited-war-aims), and
  that Rome's refusal to treat while an enemy stood in Italy is the
  decision the rest of the war follows from, treated at
  [the take on the refusal](/editorialTakes/cannae-roman-refusal-to-negotiate).

  ## The head of Gracchus, 212

  In one of the versions Livy reports of the death of the proconsul
  Tiberius Sempronius Gracchus, ambushed in Lucania after being
  betrayed by his own guest-friend, only the head was taken. It was
  brought to Hannibal, who at once sent Carthalo to carry it to the
  Roman camp and hand it to the quaestor Gnaeus Cornelius, and the
  Beneventans held the general's funeral (Livy 25.17). Livy gives
  three accounts of the death and two of the funeral, and says that
  neither the place nor the manner of so distinguished a man's end is
  established; in the version he calls the more widely current,
  Hannibal built the pyre himself at the gate of his camp and the army
  paraded round it with Spanish war dances and the movements each
  nation was accustomed to.

  Both traditions have Hannibal returning the body. Whether that is
  policy or the ordinary courtesy of a Hellenistic general toward a
  dead opponent cannot be settled from the passage, and the site does
  not read it as either.

  ## Tarentum, 209

  He was prefect of the Carthaginian garrison at
  [Tarentum](/places/tarentum) when Fabius took the city back. Livy
  has him lay down his arms and come to the consul invoking a
  guest-friendship his father had held with Fabius; a soldier who met
  him on the way cut him down. The sentence sits inside a passage
  describing indiscriminate killing of armed and unarmed, Carthaginian
  and Tarentine alike (27.16). It is the end of the one Carthaginian
  career in Italy that can be traced across the war, and it is
  recorded as an accident of a sack.

  Whether the man of 209 is the envoy of 216 cannot be proved. Livy
  does not connect them and the name is common. The guest-friendship
  with Fabius's house is a small argument that the Tarentine prefect
  was an aristocrat of the kind who would be sent on an embassy, and
  the site treats the identification as likely rather than secure.

  ## Other men of the name

  The father of Carthaginian name-confusion is onomastic habit: names
  recurred in the same families across generations, and the
  Greco-Roman record often preserves too little to tell two bearers
  apart. Two others are on this site. Justin's account of
  [Malchus](/people/malchus) has a son Carthalo, a priest returning
  from Tyre, whom his father put to death outside the walls. And a
  Carthalo was condemned along with Hasdrubal by the Carthaginian
  assembly after the defeat by Masinissa in 150, in the
  [war that preceded the Roman declaration](/events/war-with-masinissa).
  Neither can be connected to the officer treated here.
