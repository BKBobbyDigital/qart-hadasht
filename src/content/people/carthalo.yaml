summary: >
  Carthaginian commander and envoy of the Second Punic War,
  principally remembered for his role in the diplomatic
  aftermath of [Cannae](/events/battle-of-cannae) — the famous
  "Roman refusal to ransom" episode that the surviving sources
  preserve as one of the structurally consequential moments of
  the war's middle phase. Carthalo is distinct from the multiple
  other Carthaginians named Carthalo who feature in the surviving
  record; this page treats the Cannae-envoy figure.


  ## The Cannae embassy

  Following Hannibal Barca's annihilation of the Roman field
  army at [Cannae](/events/battle-of-cannae) on 2 August 216
  BCE, Hannibal dispatched Carthalo to Rome as envoy, charged
  with delivering a peace proposal and negotiating the return
  of the approximately 8,000 Roman prisoners taken in the
  battle. The proposal followed Hannibal's broader strategic
  expectation that the Cannae disaster would produce a Roman
  political settlement — the standard Hellenistic post-defeat
  outcome.


  The Roman senate's response — refusing Carthalo entrance to
  the city, declining the prisoner-return arrangement, and
  formally voting that no Roman citizen captured at Cannae
  would be ransomed by the state — is one of the
  structurally-significant episodes of the war. The
  [editorial take on Roman refusal to negotiate](/editorialTakes/cannae-roman-refusal-to-negotiate)
  treats the strategic logic in detail. Polybius (6.58) and Livy
  (22.58–61) preserve the diplomatic sequence; the Roman
  decision substantively eliminated the standard Hellenistic
  victor-defeated political-settlement option and committed Rome
  to total war as the framework within which the SPW would be
  resolved.


  Carthalo himself was sent away without an audience and
  returned to Hannibal in southern Italy. His subsequent career
  appears intermittently in the surviving sources: Livy
  (25.21) records a Carthalo commanding Carthaginian cavalry
  in southern Italian operations during the 212–211 BCE
  campaigns, possibly the same figure, possibly a different
  Carthalo of the period.


  ## Other Carthalos

  At least two other Carthalos appear in the surviving record
  with substantively different careers:

  - **Carthalo the priest of Melqart** — a senior Carthaginian
    religious official mentioned in Diodorus and Justin in
    connection with various 3rd-century BCE Carthaginian
    political moments
  - **Carthalo of the Mercenary War** — a Carthaginian officer
    sometimes identified with [Hamilcar Barca](/people/hamilcar-barca)'s
    immediate command circle; killed by the mercenary forces
    during the [Mercenary War](/events/mercenary-war), 241–238 BCE.
    The relationship of this Carthalo to the Cannae envoy is
    not clear in the surviving sources


  The pattern is the broader one of Carthaginian aristocratic
  onomastics — names recurred across generations, and the
  surviving Greco-Roman record sometimes preserves figures
  with insufficient distinguishing detail for secure
  prosopographic assignment.


  ## Sources

  The principal sources are Polybius (Book 6 and Book 9) and
  Livy (Books 22–25) for the Cannae embassy and the subsequent
  southern-Italian operations. Modern treatments include
  [Hoyos's *Hannibal's Dynasty* (2003)](/sources/hoyos-hannibal-2003)
  and the broader Lazenby *Hannibal's War* (1978).
