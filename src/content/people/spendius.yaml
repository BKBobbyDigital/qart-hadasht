summary: >
  Escaped Roman slave of Campanian origin who emerged as one of the
  two principal leaders of the Mercenary War (241–237 BCE) alongside
  the Libyan Mathos. Polybius reports that Spendius's prior status
  as a runaway slave gave him a particular interest in opposing any
  settlement that might return him to Roman jurisdiction; he became
  the rebel cause's most committed advocate and an effective
  spokesman among the multi-ethnic mercenary contingents. Captured
  by Hamilcar Barca in the climactic battle at "the Saw" or Defile
  in 238 BCE, Spendius was crucified outside the walls of Tunis
  along with the other captured rebel leaders. His career is one
  of the most fully attested cases in ancient warfare of a
  formerly enslaved man rising to military command at the head of
  a multi-ethnic rebel force.
