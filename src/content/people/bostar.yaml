summary: >
  A Carthaginian officer attested twice in Livy, in two episodes that
  happen to sit at opposite ends of the same question: what hostages
  were worth, and what happened when they were mishandled. Both times
  he was the man left holding something while his general was
  elsewhere.

  ## Saguntum, 217: the hostages given away

  Carthage held the children of the Iberian peoples' leading families
  at [Saguntum](/places/saguntum) as a guarantee of their loyalty, and
  Bostar commanded the garrison there, camped outside the town on the
  shore to block that approach to the Romans. Abelux, a Spaniard of
  standing who had decided to go over to Rome, judged that a deserter
  who arrives without betraying something substantial is only one
  cheap and disgraced body, and looked round for the largest thing in
  his reach. He settled on the hostages.

  Knowing their guards would do nothing without the prefect's order,
  he worked on Bostar himself. Taken aside, Bostar was told the
  position as though he did not know it: fear had held the Spaniards
  so far because the Romans were far off, and now there was a Roman
  camp south of the Ebro, a refuge for anyone wanting a change, so
  those whom fear did not hold must be bound by kindness. Asked what
  gift could possibly serve, Abelux said: send the hostages home. It
  will please their parents privately and their peoples publicly;
  everyone wants to be trusted, and trust given is usually what
  creates trust. And let me conduct them myself, so that I may add
  what gratitude I can to a thing that is grateful by nature.

  Livy's aside at this point is the stereotype doing its usual work:
  he calls Bostar a man not shrewd by the standard of other Punic
  characters. Abelux went out by night, had himself brought to Scipio,
  arranged the time and place, came back, and spent the next day
  taking his instructions from Bostar for the operation. Then he led
  the children into the ambush he had prepared, and the handover was
  carried out exactly as agreed with Bostar, except that it was done
  in Rome's name. Livy adds the sentence that matters: the Romans got
  considerably more credit for the same act than the Carthaginians
  would have, because the Carthaginians could be taken for harsh men
  whom misfortune and fear had softened, while the Roman, newly
  arrived and previously unknown, had begun with an act of mercy and
  generosity (22.22).

  That is the first of three hostage episodes in this war, and the
  site reads them together. Carthage lost the Iberian hostages by a
  trick in 217 and the goodwill with them;
  [Rome executed the Tarentine hostages](/events/fall-of-tarentum-212)
  in 213 and lost a city for it; and
  [Scipio released the Iberian hostages](/events/capture-of-new-carthage)
  he took at New Carthage in 209 and bought a coalition. Abelux's
  argument in 217 is the one Scipio acted on twelve years later.

  ## Capua, 211: the letter

  He commanded the Carthaginian garrison inside
  [Capua](/events/siege-of-capua) with a Hanno during the Roman siege,
  and led its share of the joint sortie when Hannibal attacked the
  Roman camps from outside. When that failed and Hannibal went to
  Bruttium, the two of them wrote him a letter which Livy describes as
  not merely free but harsh, accusing him of abandoning them, telling
  him that the Roman was a more constant enemy than the Carthaginian
  was a friend, and that they had not crossed the Alps to make war on
  Rhegines and Tarentines. It is the only surviving objection to
  Hannibal's Italian strategy from anyone under his command, and is
  treated at
  [its own claim](/claims/capua-garrison-letter-to-hannibal). Livy says
  the two were anxious for their own danger rather than their allies',
  which is a judgment and not a fact, and worth marking as one.

  What became of him is not recorded. The garrison was arrested when
  the gate was opened.

  ## Other men of the name

  A Bostar commanded in Sardinia with a Hanno in the First Punic War
  (Polybius 1.79). The site's earlier version of this page made its
  principal Bostar a commander captured by Scipio at
  [Carthago Nova](/places/carthago-nova) in 209, and also listed a
  Bostar of the African operations and a Bostar the envoy. Neither of
  those two appears in the passages checked for this page, and the
  Carthago Nova capture could not be found in Livy's account of the
  assault; the claims have been removed rather than repeated. Where
  the name recurs the usual Carthaginian difficulty applies: a narrow
  name pool, and patronymics preserved only sometimes.
