summary: >
  Carthaginian commander of the Second Punic War, principally
  documented through his role in the Iberian theatre and his
  capture by [Scipio Africanus](/people/scipio-africanus) during
  the 209 BCE Roman assault on [Carthago Nova](/places/carthago-nova).
  Bostar is one of multiple Carthaginian officers of the period
  named Bostar; this page treats the Iberian-theatre commander,
  the most-attested of the group in the surviving sources.


  ## The Carthago Nova capture

  The 209 BCE Roman assault on Carthago Nova under Scipio
  Africanus was the principal Roman operational achievement of
  the Iberian theatre's middle phase: a surprise attack on the
  Carthaginian Iberian capital that exploited tidal-lagoon
  conditions to bypass the city's principal defenses. The
  Carthaginian garrison commander was Mago Barca's lieutenant
  Bostar; the city fell within a day. Polybius (10.10–14) and
  Livy (26.42–46) preserve the engagement in substantive detail.


  Bostar was captured rather than killed in the assault and
  features in the subsequent Roman administrative-political
  episode at Carthago Nova: the famous "continence of Scipio"
  episode (Polybius 10.18–19; Livy 26.50) involves Scipio's
  return of high-status Iberian hostages to their families
  rather than retaining them as the Carthaginian command had
  done. Bostar's status as captured Carthaginian commander is
  one of the pieces of evidence in the broader Carthago Nova
  political reconfiguration; he features in the surviving
  sources as the official Carthaginian counterparty to Scipio's
  diplomatic-political work with the Iberian populations.


  ## The Bostar prosopographic problem

  At least three distinct Bostars feature in the surviving
  Greco-Roman record of the period:

  - **Bostar at Carthago Nova** (this page): the Iberian-theatre
    commander captured in 209 BCE
  - **Bostar of the African mainland**: a Carthaginian commander
    sometimes mentioned in the post-Cannae African operations,
    not always clearly distinguishable from the Iberian Bostar
  - **Bostar the envoy**: a Carthaginian official involved in
    diplomatic operations during the SPW, possibly distinct from
    the military commanders


  Modern prosopographic work (Hoyos and others) has worked to
  separate the three but the surviving evidence is sometimes
  thin enough that secure assignment of specific source
  references is not always possible. The pattern is the broader
  one of Carthaginian aristocratic onomastics: the name pool
  was narrow and surnames or patronymics that would distinguish
  individuals are inconsistently preserved.


  ## Sources

  The principal sources are Polybius (Book 10) and Livy (Book
  26) for the Carthago Nova operations. Modern treatments
  include [Hoyos's *Hannibal's Dynasty* (2003)](/sources/hoyos-hannibal-2003)
  for the Iberian theatre context and the broader Barcid command
  network within which Bostar operated.
