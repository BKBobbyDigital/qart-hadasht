etymology: >
  Phoenician *Bod-Ashtart* ("in the hand of Astarte"),
  invoking the principal Phoenician-Punic goddess. The name was
  reasonably common in the Carthaginian aristocratic register;
  at least three distinct Bostars feature in the surviving
  Greco-Roman record across the Second Punic War period alone.
  This page treats the most-attested Bostar: the Carthaginian
  commander captured by [Scipio Africanus](/people/scipio-africanus)
  in Iberia during the 209 BCE Carthago Nova operation.
