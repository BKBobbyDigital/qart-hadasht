etymology: >
  Phoenician *Bod-Ashtart*, "in the hand of Astarte", invoking the
  principal Phoenician and Punic goddess. A common name in the
  Carthaginian aristocratic register, so more than one bearer appears
  in the record of the Second Punic War and they cannot always be told
  apart.
