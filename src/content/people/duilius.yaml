summary: >
  Roman consul of 260 BCE and the Roman commander at the Battle
  of Mylae, the first major naval victory of the new Roman
  fleet built specifically for the First Punic War. Duilius's
  victory was honored by the Romans with an unusual public
  monument in the Forum (the *columna rostrata*, a column
  decorated with the rams of captured Carthaginian ships) and
  with a substantive inscription preserving the engagement's
  outcome (the *Elogium Duilii*, an early-Republican Latin
  inscription preserved in fragmentary form). The Mylae victory
  is conventionally treated as the moment Rome's naval
  improvisation first matched Carthage's traditional naval
  superiority, and Duilius's command is the first Roman naval
  victory preserved in detail in the surviving record.
