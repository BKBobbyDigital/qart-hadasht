summary: >
  Major Carthaginian aristocrat and political figure of the
  late-third-century BCE, leader of the senatorial faction
  generally opposed to the Barcid family. Commanded Carthaginian
  operations in Africa during the early phase of the Mercenary War
  with conspicuous lack of success: his attempt to negotiate
  reduced back pay with the assembled mercenaries at Sicca produced
  the initial revolt, and his subsequent military operations
  against the rebels were ineffective enough that the Carthaginian
  senate transferred command to Hamilcar Barca in 240 BCE. The
  political rivalry between Hanno and Hamilcar (and subsequently
  between Hanno and the broader Barcid family) became one of the
  defining axes of Carthaginian internal politics for the next
  three decades, with Hanno consistently advocating accommodation
  with Rome and the Barcids consistently advocating strategic
  redirection toward Iberia and eventual confrontation. He
  reappears in the surviving record at intervals through the Second
  Punic War as the principal opponent of Hannibal's strategy in
  the senatorial debates at home.
