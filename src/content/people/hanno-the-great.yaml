summary: >
  Major Carthaginian aristocrat and political figure of the
  late-third-century BCE, leader of the senatorial faction
  generally opposed to the Barcid family. Commanded Carthaginian
  operations in Africa during the early phase of the Mercenary War
  with conspicuous lack of success: his attempt to negotiate
  reduced back pay with the assembled mercenaries at Sicca produced
  the initial revolt, and his subsequent military operations
  against the rebels were ineffective enough that the Carthaginian
  senate transferred command to Hamilcar Barca in 240 BCE. The
  following year produced the sharpest moment of the rivalry: put
  back in the field alongside Hamilcar as joint commander, Hanno
  proved unable to work with him, and Carthage broke the resulting
  paralysis by
  [letting the soldiers choose which of the two would hold supreme
  command](/claims/mercenary-war-army-chose-hamilcar). They chose
  Hamilcar, and Hanno went home. Whatever else the episode was, it
  was a senior aristocrat being rejected by an army in favor of a
  rival, and the enmity that defined the next three decades of
  Carthaginian politics is difficult to separate from it. The
  political rivalry between Hanno and Hamilcar (and subsequently
  between Hanno and the broader Barcid family) became one of the
  defining axes of Carthaginian internal politics for the next
  three decades, with Hanno consistently advocating accommodation
  with Rome and the Barcids consistently advocating strategic
  redirection toward Iberia and eventual confrontation.

  The preserved speeches. Hanno is the rare Carthaginian
  political voice whose direct speech survives in any quantity in
  the Greco-Roman tradition. Three speeches preserved by Livy
  give the substance of his anti-Barcid program and make him,
  filtered through the inevitable pro-Roman framing of the
  surviving sources, the most-articulated case for the
  alternative Carthaginian strategic position the city did not
  ultimately choose:

  - **The speech against sending Hannibal to Iberia** (Livy
    21.3-4), conventionally placed around 224 BCE. Livy narrates
    it after recounting Hasdrubal the Fair's assassination, which
    has led to its being dated to the succession debate of 221, but
    the speech answers Hasdrubal's written request that the young
    Hannibal be sent out to him, so it belongs to Hasdrubal's
    lifetime. Hanno warns the senate against accustoming the family
    to treat commands as inheritance: the Barcids, he argues, are
    accumulating a family-controlled military instrument that the
    senate's formal authority cannot meaningfully constrain. The
    vocabulary Livy gives him is worth noting on its own account.
    Hanno calls Hamilcar *the king* and describes the armies as a
    legacy left to a son-in-law, which is the same royal framing
    that Diodorus and Polybius supply from the Iberian side and the
    site discusses under
    [Hasdrubal's kingship](/narratives/hasdrubal-the-fair-life).
    The caution is obvious: this is a hostile speech reconstructed
    by a Roman historian a century and a half later, and the royal
    vocabulary may be Livy's rather than Hanno's. The speech loses,
    and Hannibal goes to Iberia.

  - **The 216 BCE response to Mago's Cannae embassy** (Livy
    23.12-13). The most-cited Hanno speech and one of the
    sharpest pieces of strategic analysis in the surviving
    Punic-period record. Mago Barca reported the victory to the
    senate, poured out the gold rings taken from the Roman dead,
    and argued that the nearer the hope of finishing the war the
    more Hannibal should be helped by every means: the army was
    campaigning far from home in the middle of enemy country, and
    the battles that had destroyed the enemy's armies had
    reduced the victor's forces too. What provoked Hanno was not
    Mago but Himilco, whom Livy calls a man of the Barcid faction,
    and who asked whether Hanno still regretted the war, told him
    to propose surrendering Hannibal and forbidding thanks to the
    gods, and invited the house to hear a Roman senator speaking
    in the Carthaginian senate.

    Hanno's reply has two parts, and the first is usually
    dropped. He said he had not ceased to regret the war and
    would not cease to blame the unconquered commander until he
    saw it ended on some tolerable terms, and that the victories
    could only be good news if Carthage used them: if this moment
    passed, when Carthage could seem to be granting a peace
    rather than accepting one, he feared the rejoicing would run
    riot and come to nothing. Then the sarcasm. You have
    destroyed the enemy's armies, so send me soldiers: what else
    would you be asking if you had been beaten? I have taken two
    enemy camps full of plunder and supplies, so send grain and
    money: what else would you ask if you had been stripped of
    your own camp?

    Then four questions, in two pairs. Has any people of the
    Latin name come over to us, and has any individual man out of
    the thirty-five tribes deserted to Hannibal? Mago said no to
    both. Have the Romans sent any envoys to Hannibal about
    peace, and has any mention of peace at Rome been reported to
    you? No to both again. Hanno's conclusion: then we have the
    war as entire as we had it on the day Hannibal crossed into
    Italy. He closed on the First Punic War, when Carthaginian
    affairs had never looked better by land and sea than in the
    year before the Aegates, and asked whether they expected to
    be given, after a defeat, the peace nobody was offering them
    in victory.

    The two pairs are not interchangeable and the site had
    previously run them together. The Latin peoples are
    communities; the thirty-five tribes are the Roman citizen
    body, so the second question asks whether a single Roman
    citizen had gone over. Together they test the two things
    Roman power rested on, and the site's own reading of why
    Cannae settled nothing is the one Hanno states in 216, which
    is the strongest reason to take the speech seriously as a
    record of something said.

    The speech failed. Livy's explanation is better than
    indifference: Hanno's feud with the Barcid family made him a
    lighter authority, and minds taken up with present rejoicing
    would admit nothing that made the joy emptier. The senate
    voted, with great unanimity, four thousand Numidians as
    reinforcement, forty elephants, an unspecified sum in silver
    talents, and a mission sent ahead with Mago to Spain to hire
    twenty thousand foot and four thousand horse for the armies in
    Italy and Spain. The amount of silver and the name of the man
    sent with Mago are both lost: the manuscript is corrupt at
    exactly those two points, so no figure should be quoted for
    the money.

  - **Hanno's speeches against further Barcid resource
    allocation** through 215-213 BCE (Livy 23.43 and later).
    Continuing-debate speeches arguing against
    successive Carthaginian commitments to Hannibal's Italian
    front; partially successful in restricting reinforcements
    in some years, defeated in others.

  The speeches' reliability is the standard ancient-source
  problem: Livy is reconstructing them from earlier (now lost)
  Roman annalists who had every motive to make Hanno the
  prophetic anti-Barcid voice the war's outcome retrospectively
  justified. The specific arguments preserved are nonetheless
  too analytically precise (particularly the "no Latin
  defections, no peace embassies" framework) to be pure
  invention; some core of the actual senatorial debate almost
  certainly survives, however reshaped by the framing.

  Hanno is the rare instance in the surviving record where
  Carthaginian internal political debate is preserved with
  enough specificity to be analyzed as politics rather than as
  reflected Roman concern. The faction he led, generally read
  as the older landed-aristocratic interest opposed to the
  Barcid commercial-military complex of the Iberian phase, did not prevail in the strategic debates of the late
  third century, but it was a real political force, and its
  positions deserve the historiographical weight the
  surviving record affords them.
