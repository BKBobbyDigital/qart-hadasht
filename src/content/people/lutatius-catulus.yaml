summary: >
  Roman consul of 242 BCE, prorogued through 241 BCE to command the
  newly-built Roman fleet that ended the First Punic War at the
  Battle of the Aegates Islands. Of relatively modest aristocratic
  background by the standards of mid-Republican Roman political
  culture, Lutatius reached the consulship at a moment when Rome's
  treasury was depleted and the war effort was being sustained by
  private subscription from wealthy citizens. He commanded the new
  fleet of approximately 200 ships in operations off western Sicily,
  intercepted the Carthaginian relief expedition under Hanno at the
  Aegates on 10 March 241 BCE, and won a decisive victory that broke
  Carthaginian strategic capacity in the war. Negotiated the
  resulting peace treaty with Hamilcar Barca, who held command of the
  Carthaginian land forces in western Sicily; the treaty as
  Lutatius and Hamilcar concluded it was subsequently stiffened by
  the Roman senate and comitia on ratification. Less prominent in
  later Roman political memory than several of his Punic War
  contemporaries, but the architect of the war's end.
