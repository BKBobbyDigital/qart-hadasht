  notes: >
    Active as Carthaginian commander in Sicily in the late 320s and 310s
    BCE; died before the council's verdict on him could be read, around
    312. He may be the Hamilcar who fought against Timoleon (Plutarch,
    *Timoleon* 25), an identification suggested in the Loeb notes to
    Diodorus and not certain.
