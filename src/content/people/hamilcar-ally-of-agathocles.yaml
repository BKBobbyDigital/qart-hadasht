summary: >
  The Carthaginian general in Sicily who helped Agathocles to power in
  Syracuse and was then disowned by his own city. He is the clearest case
  in the fourth century of the problem Miles puts at the center of these
  years: a Carthaginian commander, far from home with his own army,
  acting as a power in Sicilian politics on his own account (*Carthage
  Must Be Destroyed*, pp. 146–149).

  According to Justin, when Agathocles was besieging Syracuse as general
  of Murgantia, Hamilcar's troops were defending the city. Agathocles
  asked him through intermediaries to arrange a peace, promising
  services in return, and Hamilcar made an alliance with him, expecting
  to gain as much power at home as he lent Agathocles in Syracuse.
  Agathocles swore loyalty to Carthage with his hand on the emblems of
  Ceres (Demeter), and with 5,000 Africans from Hamilcar massacred the
  leading men of Syracuse (Justin 22.2). Diodorus describes the coup of
  317 without Carthaginian troops (19.6–9), and says only that Agathocles,
  having become feared by Syracuse and Carthage alike, was persuaded to
  return (19.5); the two accounts need not conflict, but only Justin makes
  Hamilcar a party to the massacre.

  In 314 Hamilcar mediated the peace that ended Agathocles' war with
  Acragas, Gela and Messana: Heraclea, Selinus and Himera remained subject
  to Carthage, and every other Greek city was to be autonomous under
  Syracusan leadership (Diodorus 19.71). He then did nothing while
  Agathocles attacked Carthage's allies. The allies complained to
  Carthage, Justin says, less of Agathocles than of Hamilcar, as a
  would-be master and a traitor; Diodorus says the Carthaginians censured
  him for the terms (Justin 22.3; Diodorus 19.72).

  The council's response is one of the few glimpses of how Carthage
  handled a general still in command. Because Hamilcar held an army, it
  voted on his case in secret and ordered the ballots sealed in an urn
  without being read, until Hamilcar son of Gisco should return from
  Sicily. Hamilcar died first, "freed by the gift of fate", as Justin
  puts it, from a sentence passed on him unheard (22.3). His nephew,
  Justin adds, was the Bomilcar who tried to make himself tyrant in 308,
  and who from the cross reproached the Carthaginians for the secret
  ballots against his uncle (22.7). Carthage then sent
  [Hamilcar son of Gisco](/people/hamilcar-son-of-gisco) with a new army
  to undo the settlement of 314.
