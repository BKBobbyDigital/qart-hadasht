etymology: >
  Hamilcar renders a Punic name usually given as *ḤMLQRT*, "Melqart is
  gracious", though the exact form is not certain. No patronymic is
  recorded for this Hamilcar; Justin distinguishes him from "the other
  Hamilcar, son of Gisco" (22.3).
