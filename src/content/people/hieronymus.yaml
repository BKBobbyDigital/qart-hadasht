summary: >
  Grandson of Hiero II of Syracuse and his short-lived
  successor on Hiero's death in 215 BCE, aged about fifteen.
  Hieronymus's brief reign of about thirteen months produced
  the diplomatic-political reorientation of Syracuse from the
  decades-long Hieronian alliance with Rome to formal alliance
  with Carthage — a shift that brought the Roman siege under
  Marcellus the following year and ended Greek-Sicilian
  political autonomy.

  Polybius (7.2-7) and Livy (24.4-7) preserve the standard
  account: a young king dominated by pro-Carthaginian
  advisors, including the Greek-Carthaginian brothers
  Hippocrates and Epicydes; reception of Carthaginian
  envoys; formal treaty with Carthage; the post-Cannae
  perception that Roman defeat was now likely; rapid
  alienation of the Syracusan political class through
  unstable government and personal excess; assassination by
  pro-Roman conspirators in spring 214 BCE. The
  assassination produced a brief republican-style government
  at Syracuse but the structural alliance with Carthage
  persisted under Hippocrates and Epicydes, who emerged as
  effective Syracusan leaders.

  Hieronymus's historicity is well established but his
  characterization in the surviving Greek-Latin tradition is
  unusually one-sidedly negative: a debauched and incompetent
  young king whose defection from Rome was reckless rather
  than strategically defensible. Modern scholarship has been
  more open to the possibility that the defection's logic
  was sound on the post-Cannae intelligence available — Rome
  did appear to be losing the war in autumn 215 — and that
  the surviving negative tradition reflects the
  retrospective Roman framing of a defeat-aligned defection.
