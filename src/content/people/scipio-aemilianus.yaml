summary: >
  Roman commander who destroyed Carthage in 146 BCE and Numantia
  in 133 BCE, the two principal Roman acts of imperial conquest of
  the mid-2nd century BCE. Born Lucius Aemilius Paullus, son of
  the Aemilius Paullus who defeated Perseus of Macedon at Pydna in
  168 BCE; adopted in adolescence by Publius Cornelius Scipio,
  son of Scipio Africanus (the victor of Zama), and through that
  adoption brought into the Cornelii Scipiones. The double
  ancestry made him the most distinguished Roman aristocrat of
  his generation: heir to the two families that had ended the
  Macedonian and Carthaginian threats to Rome.

  Took command of the Roman siege of Carthage in 147 BCE after
  two years of ineffective Roman command had produced minimal
  progress against the city's defenses. Scipio's command was
  itself irregular: standing for the aedileship and below the
  legal age, he was elected consul by a people who overrode the
  law, and given Africa without the lot (Appian *Punica* 112).
  He drove Hasdrubal's army into the city, walled off the
  isthmus, closed the harbor mouth with a mole, destroyed the
  last Carthaginian army outside the walls at Nepheris that
  winter, and led the final assault in the spring of 146.

  Scipio's relationship with the Greek historian **Polybius** is
  one of the most consequential intellectual partnerships in the
  surviving record of Roman history. Polybius had been brought to
  Rome as a hostage in 167 BCE, after Pydna; he became Scipio's
  intellectual companion, traveling with him on military
  campaigns, and was present at the destruction of Carthage in
  146 BCE. A fragment of his account has Scipio grasp his hand at
  the burning city and say he fears the same fate for Rome
  (38.21); Appian and Diodorus, naming Polybius as the witness,
  add the tears and the lines from Homer on the fall of Troy
  (Appian 132; Diodorus 32.24). See the
  [claim on the eyewitness](/claims/tpw-polybius-eyewitness).

  Scipio later commanded the destruction of Numantia in 133 BCE
  and was a central figure in Roman politics through the Gracchan
  crisis until his death in 129 BCE. After 146 he bore the
  cognomen Africanus, like his adoptive grandfather, and is often
  called Africanus the Younger to tell the two apart.
