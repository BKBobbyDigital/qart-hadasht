summary: >
  King of Epirus and one of the most prominent Hellenistic
  generals of his generation, principal Greek-and-Italian
  opponent of Rome and Carthage during his Italian and Sicilian
  campaigns of 280-275 BCE. Invited to Italy by Tarentum in 280
  BCE to defend Greek-Italian cities against Roman expansion,
  Pyrrhus won notable but costly victories at Heraclea (280) and
  Asculum (279) before crossing to Sicily in 278 BCE at the
  invitation of the Greek-Sicilian cities seeking relief from
  Carthaginian pressure. His Sicilian campaign of 278-275 BCE
  drove Carthage from most of Sicily except Lilybaeum but
  produced political tensions with the Greek-Sicilian
  communities themselves; he returned to Italy in 275 BCE,
  fought one more inconclusive engagement against Rome at
  Beneventum, and withdrew to Epirus.

  He had a dynastic connection to Syracuse, though a frayed one. He
  had married Lanassa, daughter of [Agathocles](/people/agathocles),
  who brought him Corcyra; she left him for Demetrius Poliorcetes
  well before the Sicilian campaign (Plutarch *Pyrrhus* 9.1,
  10.4–10.5), and what survived the marriage was their son Alexander,
  Agathocles's grandson. No source says the tie had anything to do
  with the invitation of 278, so the site does not treat it as the
  reason he was asked.

  The "Pyrrhic victory" tradition is the reflection that another such
  victory would ruin him, attached to Asculum in Plutarch and given
  by Diodorus as the remark that one more battle against the Romans
  would leave him not a single soldier of those who had crossed over
  with him (22.6.2).

  What Carthage met was a commander who won in the field and could
  not convert it. His campaigns produced battles rather than
  settlements, and both states he fought proved able to absorb defeat
  and keep going, which is the difficulty Hannibal would meet in
  Italy two generations later. The year Pyrrhus left Sicily is not
  fixed by the surviving accounts: Plutarch gives only six years for
  the Italian and Sicilian wars together (*Pyrrhus* 26.1), and the
  dates used here are the conventional reconstruction.
