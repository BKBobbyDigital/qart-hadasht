name_greek: Μάγων
name_latin: Mago Carthaginiensis
etymology: >
  Punic *Magon*, the same common Carthaginian aristocratic
  name held by the founder of the Magonid dynasty (Mago I)
  and the Barcid commander Mago Barca. Distinguishing the
  agronomist from other Magos is a modern editorial
  convention; the surviving sources call him simply "Mago of
  Carthage" or "the Carthaginian Mago."
