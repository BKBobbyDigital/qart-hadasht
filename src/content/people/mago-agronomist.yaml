  notes: >
    Mago's exact dates are not preserved. Modern scholarship
    places him variously between the late 4th and the
    mid-3rd century BCE on the basis of the institutional
    context his treatise presupposes (a Carthaginian
    agricultural economy operating across a settled
    African hinterland with substantial estate-scale
    production).
