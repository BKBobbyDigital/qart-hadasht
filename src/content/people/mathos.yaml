summary: >
  Libyan rebel leader, co-leader with Spendius of the Mercenary War
  against Carthage (241–237 BCE). Where Spendius's leadership drew on
  the mercenary contingents brought back from Sicily, Mathos's
  authority rested on the broader Libyan-African revolt against
  Carthaginian tribute and military demands that joined the
  mercenary movement and substantially expanded its scale. The
  combination of mercenary military capacity and Libyan numerical
  weight made the revolt the most existentially dangerous conflict
  Carthage faced before the Third Punic War. Mathos was captured at
  the final battle near Tunis and paraded through the streets of
  Carthage in a humiliating procession before his execution. The
  ritualized public character of his death is preserved in Polybius
  with characteristic detail and is one of the few moments where
  the surviving record opens a window onto Carthaginian state
  ceremony in moments of triumph.
