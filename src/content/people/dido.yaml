slug: dido
name_display: Dido (Elissa)
name_punic: ʾLŠT (Elissa)
name_punic_script: 𐤀𐤋𐤔𐤕
name_greek: Διδώ (Didō); Ἔλισσα (Elissa)
name_latin: Dido; Elissa
etymology: >
  The two preserved names appear in different traditions. *Elissa*
  (Punic ʾLŠT, Greek Ἔλισσα) is the older name and is closer to a
  plausible Phoenician personal name (perhaps cognate with West
  Semitic ʾl, "god/lord," or with ʾlšt as a personal-name element
  of uncertain meaning). *Dido* is preserved in the Greek and Latin
  traditions and is sometimes etymologized in those traditions as
  "wandering one," though the etymology is itself part of the
  legend rather than independently attested. Modern scholarship
  generally treats Elissa as the underlying Phoenician name and
  Dido as the Greek-Latin onomastic development.
