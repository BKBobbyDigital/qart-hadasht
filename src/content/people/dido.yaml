summary: >
  Legendary founder of Carthage, in the foundation tradition
  preserved primarily in Justin's epitome of Pompeius Trogus
  (Book 18) and elaborated romantically by Virgil in the *Aeneid*.
  In the surviving narrative she is a Phoenician princess of Tyre,
  sister of King Pygmalion, who flees the city after Pygmalion
  murders her husband Sychaeus for his wealth. She arrives in
  North Africa with a band of Tyrian followers, persuades the
  local Libyan inhabitants to grant her as much land as can be
  covered by an ox-hide, and (in the famous stratagem) cuts the
  hide into thin strips to enclose the land that becomes the
  citadel of Carthage, called Byrsa from the Greek for "ox-hide."
  In Justin's account she ultimately takes her own life rather
  than marry the Libyan king Iarbas, throwing herself onto a pyre.
  In Virgil's much later elaboration she instead falls in love with
  Aeneas during his enforced stop at Carthage and takes her own
  life when he departs.

  The historicity of the figure is genuinely contested. The
  tradition is preserved across multiple ancient sources, the
  ox-hide stratagem has Phoenician etymological grounding (the
  Greek *byrsa* corresponds to Phoenician *bṣrh*, "fortified
  place," and may be a folk etymology of the Punic place-name
  rather than the origin of the place-name itself), and Phoenician
  princess-flees-into-exile narratives have analogues in the
  Levantine record. But Dido is not attested in any contemporary
  Phoenician source, and the surviving narrative is preserved
  exclusively in Greek and Latin authors writing centuries to a
  millennium after the events. The site treats her as a legendary
  founder figure: not necessarily fictional, not historically
  attested, and useful as the focus around which the foundation
  tradition crystallized rather than as a verifiable historical
  individual.
