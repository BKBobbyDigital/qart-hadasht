summary: >
  The youngest of Masinissa's three sons and the brother
  designated to hold the kingdom's judicial functions
  under the 148 BCE succession arrangement (per Appian
  *Punica* 105). Mastanabal's distinguishing feature in
  the surviving record is his cultural-intellectual
  formation: educated in Greek learning to a degree
  unusual among Numidian royalty of the period, and
  reportedly the most scholarly of the three brothers.

  His political role was junior throughout the joint
  rule of 148 BCE forward. Where Micipsa held the
  treasury and royal capital and Gulussa held the army,
  Mastanabal's judicial portfolio was the
  least-politically-prominent of the three functions, and
  his death some years after his father's left the
  kingdom in effective two-brother rule and then in
  Micipsa's sole rule.

  The historical significance of Mastanabal lies
  principally in his fatherhood: his son Jugurtha, born
  to a concubine rather than to Mastanabal's principal
  wife and therefore initially excluded from the
  Numidian succession, would become the figure whose
  consolidation of the kingdom in the late second
  century BCE produced the Jugurthine War (112–106 BCE)
  with Rome. The structural conditions for that war were
  set up by the Numidian succession arrangements
  Masinissa had established and that his sons preserved
  through their lifetimes; Mastanabal's political
  marginality during his lifetime did not extend to his
  posthumous role through Jugurtha.
