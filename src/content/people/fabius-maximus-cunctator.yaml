slug: fabius-maximus-cunctator
name_display: Quintus Fabius Maximus Verrucosus (the Cunctator)
name_latin: Quintus Fabius Maximus Verrucosus Cunctator
etymology: >
  *Verrucosus* ("warty," from a personal feature; *Cunctator*) "the Delayer," an epithet that began as criticism (for his
  delaying tactics in 217 BCE that critics treated as
  cowardice) and was retrospectively converted into honor as
  the strategy's success became visible. The Cunctator
  designation is the form by which he is best known in the
  modern tradition.
