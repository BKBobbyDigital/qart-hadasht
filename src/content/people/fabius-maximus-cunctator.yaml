summary: >
  The Roman senator and military commander whose strategic
  patience after the disasters of Trebia, Trasimene, and
  (above all) Cannae preserved the Roman position long
  enough for the war to turn. Fabius Maximus's career
  spanned the entire Second Punic War from its declaration
  in 218 BCE through his death in 203 BCE, the year before
  Zama. He held the consulship five times and the
  dictatorship once, and his name became the conventional
  shorthand for delaying-attritional military strategy
  across subsequent Western military thought.

  His role across the war's principal phases:

  - 218 BCE: declaration of war. Fabius led the Roman
    embassy to Carthage in spring 218 BCE that delivered
    the formal declaration of war following the siege of
    Saguntum. The famous "toga episode" (Fabius
    gathering his toga to symbolize "carrying" both peace
    and war, offering Carthage the choice) is preserved
    by Polybius and Livy as the moment of formal rupture.
    The historicity of the precise dramatic detail is
    contested; the structural fact of the embassy and its
    declaration is firmly attested.
  - 217 BCE: dictatorship after Trasimene. Following
    the disaster at Lake Trasimene, the senate appointed
    Fabius dictator. His delaying strategy (refusing
    pitched battle, harassing Hannibal's foragers,
    preserving the field army intact) was politically
    unpopular in 217 (his master of horse Minucius
    publicly disputed it) but is the principal reason
    the post-Trasimene Roman position survived to fight
    again.
  - 216 BCE: post-Cannae recovery. After Cannae, the
    senate returned to Fabian strategy by necessity. The
    delaying-attritional approach defined Roman conduct
    for the next several years.
  - 209 BCE: capture of Tarentum. Fabius's
    consulship of 209 produced the Roman recovery of
    Tarentum, which had defected to Hannibal after
    Cannae.
  - 205 BCE: opposition to Scipio's African plan.
    Fabius led the senatorial opposition to Scipio's
    proposed invasion of Africa, arguing the war should
    be won by attrition in Italy rather than by
    invasion. The opposition failed; Scipio's African
    strategy succeeded; Fabius died in 203, the year
    before Zama, possibly without acknowledging the
    success of the alternative strategy.

  Fabius's strategic legacy is the principal subject of
  one of the most enduring debates in Roman military
  history. Whether the post-Cannae Roman recovery owed
  more to Fabian attrition (his framing) or to Scipionic
  initiative (Scipio's framing) is a question modern
  scholarship has not closed, and the answer that
  satisfies one period's strategic temperament typically
  fails to satisfy another's.
