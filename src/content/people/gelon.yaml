summary: >
  Tyrant of Syracuse from approximately 485 BCE until his death in
  478 BCE, the first ruler to consolidate Syracusan power on the
  scale that would make the city the principal Greek polity of
  Sicily for the next two and a half centuries. Originally tyrant of
  Gela, Gelon transferred his seat to Syracuse around 485 BCE,
  expanded its population through forced relocations and
  conquests, and built the city into a Mediterranean power at a
  scale comparable to contemporary Athens. In 480 BCE he led
  the Greek-Sicilian victory over the Carthaginian invasion at
  Himera, an outcome the Greek-historiographic tradition treats as
  parallel to the contemporary Athenian-led victories over the
  Persians at Salamis and Plataea. The 2,000-talent indemnity
  imposed on Carthage after the battle, and the ~70-year peace it
  produced, gave Syracuse the political and material conditions
  for the cultural flourishing of the early-mid 5th century BCE
  under Gelon and his successor Hieron I.
