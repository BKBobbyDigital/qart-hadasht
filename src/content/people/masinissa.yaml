etymology: >
  The Numidian name *Masinissa* is preserved in Greek and Latin
  transliterations from underlying Numidian and possibly
  Libyo-Punic forms; the etymology is not securely
  reconstructable. He spoke Punic alongside Numidian and was
  acculturated at Carthage in his youth, placing him squarely
  in the Punic-Numidian cultural sphere that defined the
  Massylii royal house's political world.
