summary: >
  Masinissa is one of the most consequential individual actors in
  the story of Carthage. He fought for Carthage in Iberia, went
  over to Rome, commanded the Numidian cavalry on Scipio's side at
  Zama, and then spent half a century pressing territorial claims
  against a Carthage the peace of 201 had forbidden to fight him.
  He died at about ninety in 148 BCE, in the second year of the
  war that destroyed the city. Appian judged him "a cause of the
  destruction of Carthage, having left it a prey to the Romans,
  completely deprived of strength" (106).

  The site treats him under the editorial take
  [Masinissa: strategic opportunist, not architect](/editorialTakes/masinissa-strategic-opportunist).
  He was not simply Rome's instrument: the land he sought enriched
  Numidia, and he built a kingdom of his own. He was not the
  designer of the destruction either: the decision was the Roman
  senate's, and when Rome moved in 149 he resented being shut out.
  His power did depend on Rome, and the take says so.

  Origins and service with Carthage (238–206 BCE). Born into the
  royal house of the Massylii, the eastern of the two principal
  Numidian peoples, and son of [Gala](/people/gala), Masinissa
  grew up in the Carthaginian alliance and commanded Numidian
  cavalry for Carthage in Iberia, where he was present at the
  defeat of the elder Scipios in 211 (Livy 25.34). Appian says he
  was betrothed to [Sophonisba](/people/sophonisba), daughter of
  [Hasdrubal Gisco](/people/hasdrubal-gisco), and that the
  Carthaginians, wanting Syphax's support, gave her to Syphax
  without the knowledge of Masinissa or her father (*Punica* 10).
  Livy knows no betrothal and has Hasdrubal arrange the Syphax
  marriage himself (29.23), so the grievance is Appian's
  explanation of the defection, not an established fact.

  The defection and the war in Africa (206–202 BCE). Masinissa
  reached an understanding with Scipio around 206. On his father's
  death the Massylian throne passed by Numidian seniority to
  Gala's brother Oezalces and then to Oezalces's son Capussa, whom
  the usurper Mazaetullus killed in battle; Masinissa came back
  from Iberia, defeated Mazaetullus and took his father's kingdom
  by war (Livy 29.29–30). Syphax, urged on by Hasdrubal Gisco,
  then invaded and drove him out, and for a year or two he raided
  Carthaginian territory from the mountains with a few hundred men
  (29.31–32). He was restored as king only after the Roman landing.
  After Syphax's defeat at the Great
  Plains and capture in 203, Masinissa took Syphax's capital at
  Cirta and married Sophonisba; Scipio demanded her as a captive,
  and Masinissa sent her poison (Livy 30.12–15). Scipio honored him
  as king with a golden crown, curule chair and ivory scepter (Livy
  30.15). At Zama in 202 he commanded the Numidian cavalry on the
  Roman right, and the return of his and Laelius's horsemen against
  the rear of Hannibal's line decided the battle (Polybius 15.14).

  The long peace (201–150 BCE). The peace of 201 required Carthage
  to restore to Masinissa whatever had belonged to him or his
  ancestors, within boundaries to be fixed later, and forbade
  Carthage to make war on anyone in Africa without consulting Rome
  (Polybius 15.18). The first clause gave him an open-ended basis
  for claims; the second sent Carthage to Rome to answer them.
  Carthage appealed again and again. Appian says the first Roman
  arbitrators were told to favor Masinissa (67), and Polybius says
  that in the long dispute over the rich Emporia district Carthage
  always came off worse, though its case was just, because the
  judges thought it in Rome's interest (31.21). Modern
  reconstructions differ over how consistent that favor was: Hoyos
  argues Rome rebuffed his annexations until after 167, Bailey that
  Rome mostly upheld the settlement and sometimes ruled for Carthage
  (see the
  [claim on his territorial seizures](/claims/masinissa-territorial-seizures-pattern)).
  Either way, he pressed his claims for decades and gained ground.
  He also built up Numidia itself: Polybius credits him with
  proving that land thought barren could grow every kind of crop
  (36.16), and Appian says he left a full treasury and a
  disciplined army (106). His long reign gave Numidian policy
  continuity; the site does not read it as a fifty-year plan, since
  nothing shows he expected to live to ninety.

  The crisis of 150 and the Third Punic War. After Carthage exiled
  about forty leaders of the party that favored him, Masinissa used
  an attack on his son Gulussa as the excuse to besiege Oroscopa, a
  town Appian says he wanted "contrary to the treaty." Carthage sent
  an army under [Hasdrubal the Boetharch](/people/hasdrubal-boetharch)
  against him; Masinissa, eighty-eight and still riding bareback,
  commanded in person, and the Carthaginian army was starved into
  surrender and cut down (Appian 70–73). Rome treated the campaign
  as a breach of the treaty and its grounds for war. The destruction
  that followed was Rome's decision (see the editorial take on
  [why the destruction happened](/editorialTakes/destruction-not-weak-enough)).
  Appian says Masinissa "was vexed with the Romans," resenting that
  others should take the glory after he had brought Carthage to its
  knees, without consulting him, and that the Romans, suspicious of
  him, turned down his help (94).

  Death and succession. Masinissa died in 148 BCE, about ninety, and
  did not live to see the destruction in 146. He had asked Scipio
  Aemilianus to come and settle the succession and told his sons to
  accept Scipio's division. Scipio arrived after his death and gave
  Micipsa the capital at Cirta, Gulussa the conduct of war and
  peace, and Mastanabal the administration of justice; Gulussa went
  straight to the aid of the Roman army (Appian 105–107).

  The site's full biographical treatment is at the narrative
  [Masinissa — A Life](/narratives/masinissa-life); the
  cultural-historical framing of his Numidian-Punic context is at
  the [Numidian-Punic interface narrative](/narratives/the-numidian-punic-interface).
