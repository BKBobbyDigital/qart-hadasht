summary: >
  A leader of the Gallic mercenary contingent within the rebel
  coalition of the Mercenary War (241–237 BCE). Autaritus
  appears in Polybius (1.77–85) as one of the three principal
  rebel commanders alongside Spendius and Mathos, with
  responsibility for the Gallic troops who had served under
  Hamilcar in Sicily and now formed a distinct ethnic faction
  within the revolt. Polybius distinguishes Autaritus by his
  command of Punic — likely from years of service with
  Carthaginian forces — which gave him an unusual political
  position as the only rebel leader who could address the
  combined coalition in the language of the state they had
  revolted against. He was reportedly captured along with
  Spendius and crucified before the walls of Tunes in late
  238 BCE, in the reciprocal atrocity that punctuated the
  war's final phase.
