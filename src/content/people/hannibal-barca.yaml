etymology: >
  Ḥannibaʿl combines ḥnn ("grace, favor") with the divine name Baʿal ("lord"),
  yielding "grace of Baʿal" or "Baʿal has been gracious." The Barca surname,
  Punic Brq, "lightning", was a family epithet of his father Hamilcar, not
  inherited from earlier generations.
