summary: >
  Carthaginian general and statesman, son of Hamilcar Barca. Commanded the
  Carthaginian war effort against Rome in the Second Punic War (218–201 BCE),
  including the crossing of the Alps and the victories at Trebia, Trasimene, and
  Cannae. Defeated by Scipio Africanus at Zama in 202 BCE. Served as suffete in
  Carthage after the war and reformed the city's finances before being driven
  into exile by Roman pressure. Took his own life c. 183 BCE in Bithynia to avoid
  capture.

  The principal physical evidence for Hannibal's command and the
  fiscal foundation of his Italian campaign is the Barcid Iberian
  Coinage — silver shekels minted in Iberia from 237 BCE forward,
  whose male-portrait obverse iconography sustains an ongoing
  modern debate over whether the figure is Melqart, a deified
  Hellenistic-style portrait of Hannibal himself, or deliberately
  ambiguous.

  Hannibal's cultural formation reflects the substantively
  integrated Punic-Hellenistic elite culture of late-3rd-century
  Carthage, treated under the editorial take on
  [Carthage as cultural integrator on Punic terms](/editorialTakes/carthage-as-cultural-integrator).
  He grew up in an aristocratic Carthaginian household that
  maintained Greek-language tutors; Sosylus of Sparta and
  Silenus of Caleacte are attested by Polybius and Nepos as
  Hannibal's court historians and Greek-language intellectuals
  attached to his command. He conducted diplomatic
  correspondence in Greek (the Macedonian alliance negotiations
  with Philip V in 215 BCE survive as a Greek-text fragment in
  Polybius 7.9), operated in Hellenistic-court forms throughout
  the Iberian command and the subsequent eastern Mediterranean
  exile, and was at home in the Greek-language
  Mediterranean elite culture of his period.

  He was also a Carthaginian aristocrat operating
  within Punic religious and political structures. The Melqart
  altar oath narrative his father reportedly administered before
  the Iberian launch (Polybius 3.11; treated by the site as
  contested in form but consistent with broader Barcid religious
  practice) places him within the central Punic religious
  tradition; Polybius preserves his observance of Punic religious
  practice during the Italian campaign; his Carthaginian-political
  position as suffete in 196 BCE and his structural relationship
  with the Carthaginian senate operated within Phoenician-derived
  constitutional forms rather than Hellenistic-royal ones. The
  Hellenistic dimension of his cultural formation was substantive
  but it sat alongside, rather than displacing, his substantive
  Carthaginian-aristocratic identity. He was both, integrated, in
  the same way that the broader 4th-3rd century Carthaginian
  elite culture was both.

  The Hercules-Melqart syncretism (treated under the
  [Melqart page](/deities/melqart)) was a working cultural
  bridge across the Phoenician-Greek divide, and Hannibal
  used it actively across the Italian campaign. Livy
  preserves the offerings he made at the Heracleion of Gades
  before the campaign's launch (21.21.9); Polybius (3.33)
  records the bilingual Greek-Punic
  [dedicatory inscription](/sources/lacinian-inscription)
  Hannibal set up at the Lacinium sanctuary in southern Italy
  documenting his strength and campaign progress (the
  inscription itself does not survive but Polybius states he
  consulted it directly); the Alps crossing was framed in
  the surviving rhetoric as a Heraclean labor. Rawlings's
  ["Hannibal and Hercules" chapter](/sources/rawlings-hannibal-and-hercules-2005)
  reads this Hercules-association as a real strategic and
  religious project rather than rhetorical decoration —
  Hannibal mobilizing the Heracles-Melqart syncretism to
  frame his campaign in terms his Greek-speaking Italian
  potential allies could read as culturally familiar rather
  than as alien Punic invasion. The reading further supports
  the integrated cultural-figure framing of Hannibal that
  the site develops here.

  The circle around him is worth stating separately, because
  it is both better attested than is usually noticed and far
  thinner than the comparison it invites. Hannibal traveled
  with Greek writers: Nepos names
  [Sosylus of Sparta](/sources/sosylus-sparta), remembered as
  the man who taught him Greek, and
  [Silenus of Caleacte](/sources/silenus-caleacte), and
  Polybius adds a third, Chaereas. Their histories are the
  nearest thing that ever existed to a Carthaginian account
  of the war, and almost none of it survives; the
  transmission is traced under
  [Hannibal's historians](/narratives/hannibals-historians).
  Named officers recur across the campaign, among them
  [Maharbal](/people/maharbal),
  [Mago Barca](/people/mago-barca),
  [Carthalo](/people/carthalo) and
  [Bomilcar](/people/bomilcar), though these are attested as
  commanders in particular actions rather than as members of
  a standing body.

  The temptation is to read this as a Carthaginian version of
  Alexander's Companions, and the evidence does not support
  it. The Macedonian *hetairoi* were a named institution with
  a membership and a cavalry corps attached; nothing of the
  kind is recorded for Carthage or for the Barcids. Much of
  what makes Alexander's entourage knowable is that several
  of its members wrote books that were read and used, which
  is precisely what did not happen to Hannibal's. The
  difference in what we can see is substantially a difference
  in survival rather than in structure.

  The one passage that treats the circle as a body is
  Polybius's digression on Hannibal's character (9.22-26),
  which explains his reputation by reference to his
  associates: the cruelty charged to
  [Hannibal Monomachus](/people/hannibal-monomachus), whose
  proposal to teach the army to eat human flesh Hannibal
  rejected, and the avarice shared with Mago the Samnite. It
  also records that the two hostile traditions accused him of
  different things, the Carthaginians of greed and the Romans
  of cruelty. The site reads the passage as
  [valuable evidence wrapped in an argument](/claims/hannibal-circle-polybian-exculpation):
  good for establishing that Hannibal had a circle whose
  advice was recorded and discussed, weaker as an
  apportionment of blame by a historian who admired the
  general and had reason to want the atrocities attached to
  somebody else.
