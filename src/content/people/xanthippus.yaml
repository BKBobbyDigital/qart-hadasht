summary: >
  A Spartan who reached Carthage in the crisis of Regulus's invasion
  and left a few months later having won the battle that saved the
  city. Polybius says he came in with a draft of soldiers one of
  Carthage's recruiting officers had brought back from Greece. He was
  not the leader of a contingent but one man among the recruits,
  Lacedaemonian by birth, raised in the Spartan discipline and with
  some experience of war (1.32.1).

  He talked his way into the command. Hearing how the Carthaginians
  had been beaten, he said the fault lay with their own generals'
  inexperience rather than with Roman strength, and said it where it
  carried; the government sent for him and questioned him; he argued
  that an army with cavalry and elephants had no business fighting
  anywhere but level ground. The generals handed their forces to him.
  He drilled the army outside the city until its confidence came
  back, and they took the field with twelve thousand foot, four
  thousand horse and nearly a hundred elephants (1.32).

  ## The battle

  On the day, the generals gave him authority to conduct operations
  as he judged best (1.33.5). He set the elephants in a single line
  in front, the Carthaginian phalanx behind them, the mercenaries on
  the right wing, and the most active of the light troops with the
  cavalry in front of both wings (1.33.6–7). The Romans deepened
  their line against the elephants, which shortened it, and that cost
  them against the larger cavalry arm (1.33.8–10). The elephants went
  in, the horse on both wings swung round, the Roman cavalry was
  swept off, and the legionaries who got past the elephants met a
  phalanx that had not yet fought. About five hundred were taken,
  Regulus among them, and about two thousand got away to Aspis
  (1.34).

  Polybius names neither the river nor the place, saying only that
  the armies were on level ground. "Bagradas" is the conventional
  modern name for the engagement. He also gives the cavalry no
  national label, and the one thing he does say about Numidians in
  this campaign cuts the other way: at 1.31.2 they are raiding
  Carthaginian territory alongside the Romans and doing it as much
  damage as the Romans were.

  ## What became of him

  Here the sources part. Polybius has him sail home a little while
  after the victory and calls it the sensible thing to have done,
  because great and sudden success attracts envy, and foreigners who
  attract it come quickly to grief. Then Polybius adds that there is
  another account of Xanthippus's departure, and that he will give it
  on a more suitable occasion (1.36.1–4). He never does, at least not
  in what survives of him.

  The other account is in
  [Valerius Maximus](/sources/valerius-maximus), who opens the
  foreign half of his chapter on treachery by announcing that he will
  now contemplate the fountainhead of perfidy itself: the
  Carthaginians, pretending to convey Xanthippus home, drowned him at
  sea; and what, he asks, were they after with so great a crime, if
  not that no partner in their victory should survive (9.6.ext.1).

  The site reads the drowning as a growth of the Punic treachery
  tradition rather than as a fact, because it is exactly the story
  that tradition produces and because the earliest and best source
  does not tell it. What Polybius does establish is that some darker
  version was already current when he wrote, and that he thought it
  worth pointing at and then declining. His own moral, that a
  foreigner who wins a great victory for another man's city stands in
  danger there, is a Greek commonplace about success and envy and is
  not evidence about Carthaginian conduct. For the stereotype itself
  see [the Punic identity theme](/themes/punic-identity).
