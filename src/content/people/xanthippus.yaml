polity: Sparta (mercenary in Carthaginian service)
summary: >
  Spartan mercenary general recruited by Carthage in 256-255
  BCE during the crisis produced by Atilius Regulus's African
  invasion. Xanthippus arrived at Carthage with a force of
  Greek mercenaries and was given operational command of the
  reorganized Carthaginian army. His tactical reorganization
  (combined-arms doctrine integrating the Carthaginian elephants,
  Numidian cavalry, and African heavy infantry around an
  open-plain engagement that neutralized Roman legionary
  capabilities) defeated Regulus at the Battle of the Bagradas
  River in 255 BCE in one of the most decisive Carthaginian
  victories of the First Punic War. Polybius treats Xanthippus
  as the operational genius of the engagement and notes that
  the Carthaginian army he had been given to work with had
  been incapable of similar success under its previous
  commanders. Xanthippus departed Carthage shortly after the
  victory; his subsequent career is not preserved in detail.
