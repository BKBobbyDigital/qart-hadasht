summary: >
  Roman consul of 217 BCE, killed at Lake Trasimene in the ambush
  Hannibal sprang on his consular army on 21 June 217. Flaminius
  was a politically aggressive figure: tribune of the plebs in
  232 BCE (when he forced through the controversial Lex Flaminia
  distributing public land to plebeian settlers despite
  senatorial opposition), consul in 223 BCE (when he defeated the
  Insubres in the Po Valley), censor in 220 BCE (when he built
  the Via Flaminia from Rome north to Ariminum and the Circus
  Flaminius). His political-cultural type (the Roman new man,
  challenging senatorial conservatism, popular with the
  Roman plebs) is distinctive in the surviving record.

  ## The tradition that buried him

  Both surviving accounts are hostile and both were written
  after the defeat they explain. Polybius calls him a thorough
  mob-courtier and demagogue with no talent for the practical
  conduct of war and exceedingly self-confident (3.80.3), and
  closes the episode with the judgment that cowardice and
  stupidity, disgraceful enough in a private man, are the
  greatest of public calamities in a general (3.81.7). Livy
  adds the religious charge: that Flaminius slighted the
  auspices, went straight from Rome to his army and took up the
  consulship there rather than performing the rites, and that
  the omens were frightful, a calf breaking from the hands of
  the men sacrificing it and spattering the bystanders with
  blood (21.63).

  The site reads this the way it reads hostile framing
  anywhere else. Three things sit badly with the portrait of an
  incompetent. Flaminius was not inexperienced: he had
  commanded in Cisalpine Gaul and beaten the Insubres as consul
  in 223, which is more field experience against a serious
  enemy than several of his colleagues had. Going north early
  has an explanation other than impiety, since the campaign was
  urgent and the consul's presence with the army mattered more
  than the ceremony; MacDonald makes that point, and it is
  worth adding that Livy elsewhere shows a Roman magistrate
  could be appointed without a consul coming to the city, so
  the physical presence of a consul at Rome was not the
  absolute requirement the charge implies. And his decision to
  follow Hannibal, which the tradition treats as the act of a
  man goaded past sense, is intelligible as an operation: the
  other consular army under Servilius was moving down from
  Ariminum, and a commander shadowing an invader until a second
  army closes on him is doing what the next several years of
  Roman strategy would be built around. That reading is modern
  inference and no source states it.

  What the sources do state is that he sent no scouts into the
  defile. That is a real failure and the site does not explain
  it away. The difference between a failure and a character is
  the whole of what the hostile tradition supplies, and it had
  every reason to supply it: a dead consul who had spent his
  career against the senate was available to carry the blame
  for a catastrophe that otherwise belonged to the Roman
  system.
