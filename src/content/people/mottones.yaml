name_display: Mottones (Muttines)
name_greek: Μύττωνος
name_latin: Muttines
etymology: >
  A Punic-Numidian compound name; the surviving Greek and
  Latin forms preserve a similar phonetic shape. Modern
  scholarly transliteration varies between Mottones,
  Muttines, and related forms.
