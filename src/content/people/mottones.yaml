etymology: >
  Livy says that his own people called him Muttines, which is the
  nearest thing the record gives to a Punic form of the name. The
  usual modern derivation is from the root behind Mattan, "gift",
  common in Punic personal names; the site has not checked that
  against an inscriptional study and offers it as the standard
  identification rather than a fact.
