polity: Numidian (in Carthaginian service, then Roman service after 210 BCE)
summary: >
  A Numidian-descent cavalry commander in Carthaginian
  service during the Sicilian theater of the Second Punic
  War, principally remembered for the defection that ended
  Carthaginian power in Sicily. Mottones commanded the
  Numidian cavalry contingents attached to the Carthaginian
  army defending Akragas during the closing phase of the
  Sicilian theater under the Carthaginian commander Hanno
  (probably Hanno the Great, though the identification is
  contested). Mottones's reputation in the surviving sources
  is for personal military skill: Livy describes his
  cavalry as the most effective Carthaginian-aligned arm
  on the Sicilian battlefield in the closing campaigns.

  The defection of 210 BCE, when Mottones opened a city
  gate of [Akragas](/places/akragas) to admit the Roman
  forces under Marcus Valerius Laevinus, was the
  immediate cause of the city's fall and the structural
  closure of the Carthaginian Sicilian theater. The
  defection's motivation, per Livy (26.40), was personal:
  Hanno had reportedly mistreated Mottones and his
  Numidian troops over a period of months; Mottones
  responded by negotiating directly with Laevinus and
  arranging the betrayal of the city.

  The Roman reward for the defection was substantial:
  Mottones was granted Roman citizenship, an unusual
  recognition for a non-Italian non-Roman ally figure of
  the period, and continued operating with Roman forces
  through the rest of the war. The episode is the
  prototype of the Numidian-Roman alliance pattern that
  would culminate in Masinissa's role at Zama and in the
  long-term Numidian client-kingdom relationship of the
  second century BCE. The mechanism, a Numidian
  commander whose mistreatment by Carthaginian leadership
  produced strategic-political defection to Rome, is
  the same pattern Masinissa would follow on a much
  larger scale four years later.
