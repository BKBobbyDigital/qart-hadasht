etymology: >
  The Numidian name *Syphax* is preserved only in Greek and Latin
  transliteration; the underlying Numidian-language form is not
  securely reconstructable. The name was held only by this single
  attested figure in the surviving record, making it the principal
  Numidian-royal name not subsequently reused.
