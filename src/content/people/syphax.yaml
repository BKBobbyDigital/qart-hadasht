  notes: >
    Died in Roman captivity at Tibur (modern Tivoli) shortly after
    his capture in 203 BCE, before being paraded in Scipio's
    eventual Roman triumph. The death in captivity is preserved in
    Livy (30.45) and Appian; the specific circumstances are not
    elaborated.
