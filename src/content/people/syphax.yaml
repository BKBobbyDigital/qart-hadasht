summary: >
  King of the Masaesyli, the western Numidian confederation,
  through the late 3rd century BCE until his capture by Scipio
  and Masinissa at the Battle of the Great Plains in 203 BCE.
  Syphax's strategic position in western Numidia made him a
  major prize sought by both Rome and Carthage in the African
  campaign of the closing Second Punic War. The Carthaginians
  secured his alliance through the dynastic marriage with
  Sophonisba, daughter of Hasdrubal Gisco; he commanded a
  substantial Numidian force against Scipio's expedition through
  204-203 BCE before being defeated and captured. His Numidian
  kingdom passed to Masinissa (his rival of the eastern Massylii
  confederation) under Roman patronage, beginning the unified
  Numidian kingdom whose subsequent encroachments on
  Carthaginian territory would produce the Third Punic War half
  a century later.
