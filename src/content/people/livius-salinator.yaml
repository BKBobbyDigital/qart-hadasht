summary: >
  Roman consul of 207 BCE, co-commander with Gaius Claudius Nero
  of the Roman victory at the Metaurus that destroyed Hasdrubal
  Barca's relief expedition from Iberia. Livius had previously
  been consul in 219 BCE (in the campaign against the Illyrian
  pirates), had subsequently been prosecuted on corruption
  charges and gone into rural retirement for a decade, and was
  recalled to public life specifically to take the second
  consulship for the 207 emergency. The improbable return from
  political disgrace to the consular command that saved the war
  is one of the more striking episodes in the surviving Roman
  political tradition. Honored with a triumph after the
  Metaurus.
