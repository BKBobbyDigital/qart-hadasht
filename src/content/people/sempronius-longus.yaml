summary: >
  Roman consul of 218 BCE, co-commander (with the elder Cornelius
  Scipio) of the consular forces sent to engage Hannibal in the
  opening phase of the Second Punic War. Originally dispatched to
  Sicily for what was expected to be a North African campaign,
  Sempronius was recalled to the Po Valley after Hannibal's
  unexpected arrival in Italy. At the Battle of the Trebia in
  December 218 BCE, his eagerness for engagement (against the
  cautious counsel of the wounded Scipio) was exploited by
  Hannibal in the cold-river ambush that destroyed the Roman
  army. Sempronius survived the battle and continued to hold
  imperium afterward, but his political career was substantially
  diminished by the Trebia outcome.
