polity: Numidia (Massylian, in Carthaginian service)
summary: >
  A Numidian prince of the Massylian royal house, nephew
  of [Masinissa](/people/masinissa), who fought as a
  young cavalry combatant on the Carthaginian side at
  the [Battle of Cannae](/events/battle-of-cannae) in 216
  BCE and was captured during the Roman post-battle
  collection of prisoners. Massiva is preserved in Livy
  (24.42) as a teenage prince whose release without
  ransom by the elder Scipio (Publius Cornelius Scipio,
  Scipio Africanus's father) is one of the earliest
  documented instances of the Roman-Numidian
  diplomatic-cultivation pattern.

  The episode is small in itself but structurally
  prefigurative. The release of an enemy combatant
  prince without ransom, and the Roman tradition's
  preservation of the episode as exemplary, established
  the kind of Roman-Numidian relationship that would
  later mature into Masinissa's defection at Ilipa in
  206 BCE. The mechanism is the same: Roman commanders
  treating Numidian elites with personal-protective
  consideration, producing alliance shifts that the
  Carthaginian state's pattern of harsher treatment
  could not match. Massiva is the early instance of the
  Mottones-Masinissa pattern.

  Massiva's subsequent fate is not preserved. The Cannae
  episode is the only attested moment in the surviving
  record. Whether he returned to Numidian service or
  remained in Roman orbit through the rest of the war is
  not recoverable; the latter possibility is consistent
  with the broader pattern but is not directly attested.
  The figure later attested in Rome during the Jugurthine
  War (a different Massiva, killed by Bomilcar in 110
  BCE per Sallust) is a separate historical individual.
