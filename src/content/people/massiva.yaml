name_greek: Μασσίβας
name_latin: Massiva
etymology: >
  A Numidian personal name, the same name held by a later
  Numidian prince killed in Rome during the Jugurthine War.
  This Massiva (Masinissa's nephew, captured at Cannae) is the earlier figure.
