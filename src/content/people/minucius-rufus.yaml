summary: >
  Master of the horse to [Fabius Maximus](/people/fabius-maximus-cunctator)
  in 217 BCE and the one serious challenge the delaying strategy
  faced from inside the Roman command. The sources treat him as a
  foil, and the site treats the foil with the same caution it
  applies to [Flaminius](/people/flaminius), because the men who
  wrote the year down had reasons to need him.

  ## What the office was

  Minucius had been consul in 221 and was no novice. His position
  in 217 was irregular from the start. A dictator normally chose
  his own master of the horse; Minucius was elected to it, by the
  same assembly that had appointed Fabius because one consul was
  dead and the other cut off from the city, and he was a political
  opponent of the man he was appointed to serve (Polybius 3.86.7,
  3.87.9; Livy 22.8.5-7). The disagreement over strategy was built
  into the command before there was a strategy to disagree about.

  ## The argument

  His case against Fabius was made in public and is preserved in
  two forms. Livy has him ask whether the army has come as
  spectators, to watch its allies butchered and their property
  burned (22.14.3). Plutarch has him jeer that the dictator had
  taken great trouble to provide the army with splendid seats for
  the spectacle of Italy being laid waste (*Fabius* 5.5). It is
  worth noticing that neither version is stupid. An army that
  shadows an invader through the territory of its own allies, and
  watches it burn, is paying a political price that the surviving
  accounts, written by men who knew the strategy had worked, are
  not much interested in counting.

  ## Geronium

  The case was then briefly vindicated. With most of Hannibal's
  men out foraging around
  [Geronium](/events/fabian-campaign-217), Minucius took a hill
  in front of the Carthaginian camp, and on a day when the
  foragers were scattered he drew up his legions before the camp
  and sent his cavalry and light troops against them with orders
  to take no prisoners. Polybius says the Romans came close to
  storming the camp, and what stopped them was Hasdrubal arriving
  with about four thousand men who had fallen back on it
  (3.101-102). It is one of the few occasions in the whole
  Italian campaign when the enemy dictated the terms of an
  engagement to Hannibal.

  Rome received the news in terms that exaggerated it, and the
  assembly gave Minucius power equal to the dictator's, so that
  two dictators held command in one theater, which Polybius says
  had never happened before. Fabius offered him alternating days
  or a division of the army; he chose the division, and the camps
  sat about twelve stades apart (3.103). Hannibal, who had
  deserters and spies, laid an ambush in the hollows of a bare
  hill between them, drew Minucius onto it at dawn, and was
  closing on him when Fabius brought his legions up and covered
  the retreat (3.104-105).

  ## The verdict and its authors

  Polybius closes with the judgment Rome kept: that the day made
  plain how far a general's foresight and calm calculation differ
  from the recklessness and bravado of a mere soldier (3.105.9).
  Two things sit beside it. Polybius's patrons were the family of
  Aemilius Paullus, and the whole 217 narrative in Polybius, Livy
  and Plutarch is organized to vindicate Fabius, so the contrast
  is drawn harder than the events require. And Minucius's
  constitutional position, for all that it was unprecedented in
  form, had him behaving much as a second consul would have
  behaved, which is how Rome had fought every other war.

  He died at Cannae the following year, holding proconsular
  authority under the new consuls, which is the ordinary end of a
  Roman career and not the end the moralized version of 217
  prepares a reader for.
