summary: >
  The eldest of Masinissa's three sons and the principal
  inheritor of the Numidian kingdom on his father's death in
  148 BCE during the early phase of the Third Punic War.
  Masinissa had reportedly indicated that his sons should
  divide his political functions among themselves —
  Scipio Aemilianus, present at Cirta in early 148 BCE on
  Roman senatorial mission, formalized the arrangement
  preserved in Appian (*Punica* 105): Micipsa would hold
  the royal treasury and Cirta itself; Gulussa would hold
  the army; Mastanabal would hold the judicial functions.

  Micipsa's reign of thirty years (148–118 BCE) was the
  longest of the three brothers and produced the
  consolidation of Numidia as a stable Roman client
  kingdom. The reign was substantially peaceful relative
  to his father's expansionist period; Masinissa had
  exhausted the most contestable Carthaginian frontier
  before his death, and Numidian-Roman relations across
  the period were stable. Micipsa cultivated Greek
  literary and philosophical culture at his court, the
  Stoic philosopher Panaetius reportedly visited Cirta
  during the reign, and preserved the kingdom as the
  exemplary Roman-aligned North African polity through
  the second century BCE.

  The reign's structural significance is also demographic.
  The Numidian succession crisis that produced the
  Jugurthine War (112–106 BCE) was set up by Micipsa's
  decisions about the next generation: his designation of
  Adherbal and Hiempsal (his own sons) as joint heirs
  with Jugurtha (Mastanabal's son and Micipsa's adopted
  son) created the three-way succession that Jugurtha
  would shortly resolve through the murder of his
  cousins. The structural conditions for Roman
  intervention in Numidian succession politics were
  preserved across the reign without crystallizing into
  conflict during Micipsa's own lifetime.
