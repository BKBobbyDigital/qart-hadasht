summary: >
  The middle of Masinissa's three sons and the brother
  designated to hold the army in the post-Masinissa
  succession arrangement (per Appian *Punica* 105: Micipsa
  the treasury, Gulussa the army, Mastanabal the
  judiciary). Gulussa is the most-attested of the three
  brothers in the surviving record, principally because
  his military role brought him into sustained contact
  with Roman commanders during the Third Punic War.

  His career during the war is preserved across multiple
  surviving sources. Gulussa commanded the Numidian
  cavalry contingents that operated alongside Roman
  forces throughout the siege of Carthage from 149 BCE
  forward. Appian (*Punica* 70-71, 108) preserves
  episodes of Gulussa's diplomatic role early in the war
  — his interventions during the 149 BCE Roman demand
  sequence are part of the surviving record — and his
  subsequent military operations in support of the
  successive Roman commanders Manilius, Censorinus, and
  finally Scipio Aemilianus.

  His most-cited single contribution was the Numidian
  cavalry's blockade of Carthaginian supply routes
  during 148-146 BCE, which was structurally significant
  to the siege's eventual success. Roman manpower and
  fiscal capacity could sustain a long siege; what they
  could not have done as readily without Numidian
  cooperation was deny Carthage the African-hinterland
  food supply that had sustained the city through earlier
  sieges. Gulussa's cavalry made the difference.

  His death some years after the war's end (the precise
  date is not preserved) returned the Numidian throne
  configuration to two-brother joint rule under Micipsa
  and Mastanabal until Mastanabal's death shortly
  thereafter. The post-Gulussa Numidian kingdom was
  effectively Micipsa's alone for the rest of his
  reign.
