slug: tagus-tactical-template-for-italy
statement: >
  The Battle of the Tagus (220 BCE) is the operational
  template for Hannibal's later Italian engagements. The
  combined-arms approach (terrain feature as tactical
  instrument (the river itself), elephants as the screening
  element, cavalry as the envelopment reserve, controlled
  defeat-in-detail of a numerically superior opponent)
  recurs in essentially the same configuration at Trebia
  (218 BCE), Lake Trasimene (217 BCE), and the Cannae
  envelopment (216 BCE).
confidence: inferred
scholarly_consensus: >
  The argument is tagged inferred rather than attested because
  Polybius does not himself draw the connection. He treats the
  Tagus engagement and the Italian engagements separately. The
  continuity is a reading back from comparing them, and it is
  the site's own; modern narrative treatments of the campaign
  make a similar comparison, but the site has not checked the
  argument in any of them.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.14, 3.65-117"
    passage_summary: >
      Polybius narrates the Tagus engagement and the Italian
      engagements separately; the continuity-of-method reading
      is a synthesis from comparison of his accounts.
  - source: macdonald-hannibal-2015
    stance: qualifies
    passage_ref: "pp. 74, 263 n. 56"
    passage_summary: >
      MacDonald gives the Tagus the fullest treatment of any
      modern account the site has checked, and reads it as an
      early display of Hannibal's ability and adaptability
      rather than as a rehearsal for Italy; she draws no line
      from it to Trebia or Cannae. She also records that
      Polybius's figures here, including the more than one
      hundred thousand put to flight, are certainly
      exaggerated. The continuity-of-method reading therefore
      remains the site's own, and the scale of the engagement
      it rests on is smaller than Polybius makes it.
