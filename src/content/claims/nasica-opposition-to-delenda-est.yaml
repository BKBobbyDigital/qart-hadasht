slug: nasica-opposition-to-delenda-est
statement: >
  Publius Cornelius Scipio Nasica Corculum led the principal
  sustained senatorial opposition to Cato the Elder's
  decade-long advocacy for Carthage's destruction across
  the 150s BCE. Where Cato ended every senatorial speech
  with the formula advocating destruction, Nasica
  reportedly ended his with the counter-formula
  *Carthago servanda est* — "Carthage must be preserved."
  Nasica's substantive argument, preserved most fully
  in Plutarch (*Cato Major* 27) and in Diodorus
  (34/35 fragment), was structural: Carthage's
  preservation kept the Roman political class disciplined
  by maintaining an external rival whose presence
  prevented internal moral and political decay.
confidence: attested
scholarly_consensus: >
  The fact of Nasica's opposition is firmly attested in
  the surviving sources. The exact wording of the
  *servanda est* counter-formula is reconstructed from
  Plutarch's Greek-language preservation, like Cato's
  own *delenda est* formula. The substantive structural
  argument, that Carthage's preservation served Roman
  political-moral interests, is preserved consistently
  across multiple sources and is broadly accepted in
  modern scholarship as authentic Nasica position rather
  than later attribution.
dispute_summary: |
  Two interpretive questions are open in modern scholarship:

  1. **Was Nasica's argument primarily strategic or
     primarily moral?** The surviving sources frame it as
     a structural-moral argument about Roman virtue
     requiring external pressure. Some modern readings
     treat this framing as a Stoic-philosophical overlay
     on what was actually a more conventional strategic
     argument about Carthage's diminished military
     capacity making destruction unnecessary. The strict
     historical-evidence base supports both readings.

  2. **How much did Nasica's opposition actually shape
     senatorial deliberations?** Cato's position
     eventually prevailed, the war was launched and
     Carthage destroyed, but Nasica was *princeps
     senatus* during the war years (147-141 BCE) and his
     continued opposition is attested. Whether Nasica's
     position influenced specific war-prosecution
     decisions or remained purely an alternative
     position that lost the underlying debate is
     unclear from the surviving evidence.

  The Augustinian critique of Roman virtue as
  fear-of-Carthage-dependent (*De Civitate Dei* 1.30)
  draws explicitly on the Nasica-tradition argument
  preserved through later Stoic-Roman moral-political
  literature. The continued life of Nasica's position
  in subsequent moralizing literature is itself
  evidence for its genuine senatorial authenticity.
