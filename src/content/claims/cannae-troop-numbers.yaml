slug: cannae-troop-numbers
statement: >
  At Cannae the Roman force outnumbered Hannibal's army roughly two-to-one
  in infantry but was inferior in cavalry, approximately 80,000 Roman
  infantry and 6,000 cavalry against 40,000 Carthaginian infantry and
  10,000 cavalry.
confidence: contested
scholarly_consensus: >
  The asymmetry, Roman infantry preponderance against Carthaginian
  cavalry preponderance, is attested in every surviving account. The
  totals differ between them and are debated in modern work.
dispute_summary: |
  Polybius (3.107, 3.113) gives the Roman army as eight legions plus
  allies, "a thing which had never been done before," roughly 80,000
  infantry and rather more than 6,000 cavalry, against about 40,000
  Carthaginian infantry and 10,000 cavalry. Livy (22.36) warns that his
  authorities differ so widely about the reinforcements that he will not
  assert anything as certain, and reports one tradition giving 87,200
  men in the Roman camp. Appian (*Hannibalic War* 17) gives 70,000 foot
  and 6,000 horse.

  Modern reconstructions keep the asymmetry and debate the total; lower
  estimates of the Roman force have been proposed and none has
  displaced Polybius's figure. An army total is also not the number
  engaged: Polybius says 10,000 Roman infantry were detached to attack
  the Carthaginian camp and were captured there, outside the
  encirclement (3.117).

  What is not disputed is the *structural* situation: a deep, thickened
  Roman line, Varro is reported to have ordered the maniples drawn up
  closer than usual to maximize shock, facing a thinner Carthaginian
  line with cavalry strength concentrated on the wings.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.107, 3.113"
    passage_summary: >
      Polybius gives the Roman army as eight legions plus allies, with
      ~80,000 infantry and ~6,000 cavalry; Hannibal's force at ~40,000
      infantry and ~10,000 cavalry.
  - source: livy-auc
    stance: qualifies
    passage_ref: "22.36"
    passage_summary: >
      Livy says his authorities vary so much on the numbers that he will
      not assert anything as certain, and gives one tradition's total of
      87,200 in the Roman camp.
