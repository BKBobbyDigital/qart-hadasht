slug: mw-cause-indemnity-cash-flow
statement: >
  The proximate cause of the mercenary mutiny was Carthage's
  inability to pay accumulated back wages on the army's return
  from Sicily, a fiscal incapacity that the Lutatius indemnity
  produced or sharply aggravated. The structural cause was the
  Libyan tribute and recruitment regime, which gave the Libyan
  rural population an immediate interest in joining a mercenary
  revolt against the state.
confidence: inferred
scholarly_consensus: >
  The fiscal mechanism is firmly attested in Polybius and is not in dispute. The distinction drawn here between the proximate cause and the structural one is the site's own framing.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.66-67"
    passage_summary: >
      Polybius narrates the post-Sicily settlement crisis, the
      decision to transfer the army to Sicca, and the Libyan
      adherence to the revolt as the structural cause of its
      escalation from mutiny to existential war.
