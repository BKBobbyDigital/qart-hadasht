slug: lutatius-treaty-original-terms
statement: >
  The treaty originally negotiated between Lutatius and Hamilcar in
  the spring of 241 BCE imposed: Carthaginian evacuation of Sicily;
  return of all Roman prisoners without ransom; an indemnity of
  2,200 talents over twenty years; and an undertaking by neither
  side to attack the other's allies.
confidence: attested
scholarly_consensus: >
  Firmly attested in Polybius. The original terms are generally
  read by modern scholarship as relatively moderate by the standards
  of Roman post-war settlements, especially in comparison with the
  stiffer ratified version that followed.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.62"
    passage_summary: >
      Polybius lists the original terms negotiated between Lutatius
      and Hamilcar before the treaty's transmission to Rome for
      ratification.
further_reading:
