slug: war-with-masinissa-defeat
statement: >
  Hasdrubal's Carthaginian army was defeated by Masinissa in 150 BCE,
  besieged in its camp, and surrendered; of 58,000 men only a few,
  Hasdrubal among them, returned. Carthage then condemned Hasdrubal to
  death to placate Rome, and reinstated him as a general when it chose to
  fight in 149.
confidence: attested
sources:
  - source: appian-punica
    stance: supports
    passage_ref: "70–74, 93"
    passage_summary: >
      The campaign, the siege of the camp, the surrender and the massacre
      of the departing army (70–73); the death sentences on Hasdrubal and
      Carthalo (74); Hasdrubal, who had gathered 30,000 men, appointed
      general outside the walls in 149 (93).
