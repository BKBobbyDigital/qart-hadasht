slug: tophet-child-sacrifice-contested
statement: >
  Whether children were ritually killed at the Tophet of Carthage, as
  the Greek and Roman literary tradition reports (Diodorus 20.14,
  Plutarch *On Superstition* 13, Tertullian *Apology* 9), or whether
  the precinct mainly received children who died of natural causes, is
  one of the most contested questions in Carthaginian religious history.
  The inscriptions use a votive vocabulary of offering; the literary
  record is consistent but hostile and not independent; and the
  cremated remains have produced competing age profiles that cannot by
  themselves show how the children died.
confidence: contested
dispute_summary: >
  Three broad positions run through modern scholarship, and individual
  scholars do not always fit neatly into one of them.

  1. Systematic sacrifice. The literary tradition describes something
  real and at scale: the Tophet was a precinct where children were
  killed and cremated as offerings to Baal Hammon and Tanit, and the
  recurrence of the precinct type at Motya, Sulci and Tharros reflects
  a shared rite. Stager and Wolff (1984) gave this reading its best
  known modern form, including an argument from the size of the
  precinct that later critics rejected.

  2. Predominantly funerary. The Tophet mainly received prenatal infants
  and babies who died naturally, set apart and cremated because of their
  particular status, and the literary tradition distorts an unfamiliar
  practice. Moscati and Ribichini developed this reading in Italian
  scholarship from the 1980s. Schwartz and colleagues gave it an
  osteological footing in 2010, arguing that many individuals died
  before or within weeks of birth; in their later work the claim is that
  not all interments were sacrifices, not that none were.

  3. Sacrifice as a genuine rite, with its frequency open. Smith,
  Avishai, Greene and Stager (2011, 2013) argued from dental evidence
  that most infants died at around one to two months, which they read
  as selection rather than natural death, and Xella, Quinn, Melchiorri
  and van Dommelen (2013) set out the epigraphic, archaeological and
  comparative case for a sacrificial sanctuary. The age dispute with the
  Schwartz team (2012, 2017) remains unresolved, and age at death does
  not establish manner of death, so this reading's strength lies in the
  inscriptions and the sanctuary context more than in the bones.

  The site holds a version of the third position: sacrifice very
  probably happened, and its scale cannot be recovered. It is argued in
  the editorial take on the Tophet.
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "20.14"
    passage_summary: >
      In the crisis of 310 BCE the Carthaginians sacrifice two hundred
      children of leading families to Kronos, placed on the hands of a
      bronze statue from which they fall into fire, and at least three
      hundred others under suspicion sacrifice themselves. The most
      cited ancient passage, and a description of one crisis rather
      than a normal rate.
  - source: plutarch-lives
    stance: supports
    passage_ref: "On Superstition 13"
    passage_summary: >
      Plutarch describes Carthaginian child sacrifice, including
      children bought from the poor, as an example of superstition, a
      moralizing and hostile frame.
  - source: lancel-carthage-1995
    stance: qualifies
    passage_summary: >
      Lancel's overview discusses the question across the surviving
      evidence and the modern interpretive tradition.
  - source: hoyos-carthaginians-2010
    stance: qualifies
    passage_summary: >
      Hoyos treats the question as contested and surveys the modern
      positions.
  - source: quinn-phoenicians-2018
    stance: qualifies
    passage_summary: >
      Quinn sets the Tophet question within a wider reconstruction of
      Phoenician and Punic religion and identity.
  - source: moscati-adoratori-1991
    stance: contradicts
    passage_summary: >
      Moscati's statement of the funerary reading: the Tophet was a
      burial ground for infants who died naturally, given ritual
      cremation because of their special religious status, and the
      classical accounts project hostile assumptions onto a misread
      practice.
  - source: ribichini-tophet-2013
    stance: contradicts
    passage_summary: >
      Ribichini represents the Italian tradition skeptical of the
      sacrificial reading, which treats the classical accounts as a
      distorting frame and resists letting new laboratory methods
      settle a question that also turns on philology and religion.
  - source: xella-baal-hammon-1991
    stance: qualifies
    passage_summary: >
      Xella's monograph on Baal Hammon, the god named in most Tophet
      dedications, is the standard reference for the deity behind the
      *mlk* offerings. Xella later co-authored the 2013 case for a
      sacrificial sanctuary.
  - source: schwartz-tophet-2010
    stance: contradicts
    passage_summary: >
      Osteological analysis of remains from 348 urns: many individuals
      died before or within weeks of birth, a profile the authors read
      as natural perinatal mortality rather than sacrificial selection.
  - source: schwartz-two-tales-2017
    stance: contradicts
    passage_summary: >
      Defends the Schwartz team's aging methods against Smith and
      colleagues and maintains that not all Tophet interments were the
      result of sacrifice.
  - source: smith-tophet-2011
    stance: supports
    passage_summary: >
      Cremation shrinks infant bone and biases skeletal age estimates
      downward; dental evidence places the ages at a peak of about one
      to one and a half months, later than natural perinatal mortality
      would produce, which the authors read as selection for sacrifice.
  - source: smith-age-estimations-2013
    stance: supports
    passage_summary: >
      Restates and defends the dental aging and the sacrificial
      interpretation against the Schwartz team's 2012 reply.
  - source: xella-bones-of-contention-2013
    stance: supports
    passage_summary: >
      The epigraphic and archaeological case: votive rather than
      funerary inscriptions, the separation of tophets from ordinary
      child burials, and the recurrence of the precinct type across the
      Punic Mediterranean all point to a sacrificial sanctuary.
