slug: himera-carthaginian-defeat
statement: >
  The Carthaginian expeditionary force under Hamilcar the Magonid was
  decisively defeated at Himera by the combined Greek-Sicilian army
  under Gelon of Syracuse and Theron of Akragas in 480 BCE.
confidence: attested
scholarly_consensus: >
  Attested across the surviving sources without dissent. The fact of the Carthaginian defeat at Himera is
  one of the most secure events in 5th-century BCE western
  Mediterranean history; only the specific scale and detail are
  contested.
sources:
  - source: herodotus-histories
    stance: supports
    passage_ref: "7.165-167"
    passage_summary: >
      Herodotus gives the cause (Terillus's appeal) and the defeat briefly,
      with three accounts of Hamilcar's death, among them the Carthaginian
      one. He gives no battle narrative.
  - source: diodorus-library
    stance: supports
    passage_ref: "11.20-26"
    passage_summary: >
      Diodorus provides the fullest preserved narrative of the
      battle, from lost Greek sources he does not name here. The tactical detail is more developed than in
      Herodotus and is the principal basis for modern
      reconstructions.
entities:
  - type: event
    slug: battle-of-himera
    role: subject
