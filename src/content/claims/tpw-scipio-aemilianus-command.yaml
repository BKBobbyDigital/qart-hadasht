      rescues Mancinus (113–114); the attack on Megara and Hasdrubal's
      withdrawal into the city (117); the isthmus fortification (119–120);
      the mole, the new harbor mouth and the sea battle (121–123); the
      fight for the quay (124–125); Nepheris (126).
