slug: tpw-scipio-aemilianus-command
statement: >
  Scipio Aemilianus, a candidate for the aedileship and below the legal
  age, was elected consul for 147 BCE after two years in which the Roman
  commanders had made little progress, and was given Africa without the
  usual lot. Through 147 he drove Hasdrubal's field army into the city,
  walled off the isthmus and closed the harbor mouth with a mole, then
  destroyed the last Carthaginian army outside the walls at Nepheris that
  winter, before the final assault in spring 146.
confidence: attested
