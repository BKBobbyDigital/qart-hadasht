notes: >
  Mago the Samnite is a distinct person from
  [Mago Barca](/people/mago-barca), Hannibal's brother. Polybius
  identifies him by the epithet, and the site keeps them separate. He
  has no page of his own, since nothing about him survives beyond this
  passage.
