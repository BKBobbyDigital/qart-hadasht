slug: cannae-maharbal-anecdote
statement: >
  Maharbal urged Hannibal to march directly on Rome immediately after
  Cannae and, when Hannibal refused, replied "you know how to win a
  victory, Hannibal, but you do not know how to use one."
confidence: contested
scholarly_consensus: >
  The exchange cannot be treated as a record. It is absent from
  Polybius, its Latin form is an epigram, and Plutarch gives the same
  words to a different speaker. Whether anyone in Hannibal's camp urged
  an immediate march is unrecoverable; the strategic question the story
  raises is real.
dispute_summary: |
  The exchange appears in **Livy 22.51**, where Maharbal promises
  Hannibal will dine on the Capitol in five days. Plutarch (*Fabius* 17)
  has Hannibal's friends urging the same dash on Rome and gives the
  reproach to **"Barca, the Carthaginian"**, not to Maharbal. The
  formulation, *vincere scis, Hannibal; victoria uti nescis*, is a
  tightly constructed epigram.

  Reasons modern scholarship is skeptical:

  1. Polybius does not preserve it. He wrote earlier (~150 BCE against
     Livy's ~25 BCE), knew Roman families who had lost men in the battle,
     and has no such scene, no council and no debate about marching on
     Rome. Silence cannot prove a negative, but the omission is striking.

  1a. The speaker is not fixed. A saying that circulates attached to
     Maharbal in one source and to Barca in another is an anecdote
     rather than a report.

  2. It serves a Roman literary purpose. The exchange dramatizes the
     thesis, central to Livy's narrative, that Rome was saved by
     Hannibal's failure to seize the moment after Cannae. The anecdote
     externalizes onto a Carthaginian voice the criticism Roman
     historiography needed to validate Roman survival.

  3. The military assessment behind the anecdote is questionable.
     Hannibal lacked siege equipment for an assault on Rome, his army
     had just fought a major battle, and the march from Cannae to Rome
     would have taken weeks. Livy himself says Hannibal's other officers
     urged rest. The "if only Hannibal had marched on Rome" scenario is a
     counterfactual the ancient sources favor more than modern military
     analysis does.

  The site treats the anecdote as Roman literary tradition rather than
  historical reportage. The underlying strategic question is treated in
  the editorial take
  [Could Hannibal have marched on Rome?](/editorialTakes/cannae-march-on-rome)
  and the open question on
  [Hannibal's objective in Italy](/openQuestions/hannibal-italian-objective).
sources:
  - source: livy-auc
    stance: supports
    passage_ref: "22.51"
    passage_summary: >
      Livy preserves the exchange in its classic Latin form, with
      Maharbal's epigram as the dramatic close of the Cannae chapter.
  - source: plutarch-lives
    stance: supports
    passage_ref: "*Fabius* 17"
    passage_summary: >
      Hannibal's friends urge him to dash for Rome and promise he will
      sup on the Capitol on the fifth day; when he hesitates, "Barca, the
      Carthaginian" says he can win a victory but not use one. Maharbal
      is not named.
  - source: polybius-histories
    stance: contradicts
    passage_ref: "3.117–118"
    passage_summary: >
      Polybius's account of the aftermath of Cannae has no exchange with
      Maharbal and no council about marching on Rome. The silence is
      generally treated as significant.
