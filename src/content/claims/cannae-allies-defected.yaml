slug: cannae-allies-defected
statement: >
  Major Italian allies of Rome defected to Hannibal after Cannae: Capua
  in 216 with its Campanian neighbors, much of Samnium, Bruttium,
  Lucania and part of Apulia, and over the following years Greek cities
  of the south, Tarentum among them in 212. The defections were
  concentrated in southern Italy; Latium, the Latin colonies, Etruria
  and Umbria did not go over.
confidence: attested
scholarly_consensus: >
  The defections are attested in Polybius and Livy, though Livy's list
  (22.61) gathers into one sentence defections that took several years,
  and Polybius has Tarentum surrender at once when it fell only in 212.
  The site reads them as evidence that Hannibal's strategy of detaching
  Rome's allies partly worked (see the
  [editorial take](/editorialTakes/hannibal-italian-objective-alliance-dismemberment)).
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.118"
    passage_summary: >
      After Cannae the Carthaginians became masters of almost all the
      rest of the coast: Tarentum surrenders (in fact in 212), and
      Argyrippa and some Campanian towns invite Hannibal in.
      Polybius's own list of defectors does not survive.
  - source: livy-auc
    stance: supports
    passage_ref: "22.61, 23.1-7"
    passage_summary: >
      Lists those who revolted: the Atellani, Calatini and Hirpini, part
      of Apulia, the Samnites except the Pentri, the Bruttii and
      Lucanians, the Uzentini, most of the Greek coast (Tarentum, Croton,
      Locri) and Cisalpine Gaul. Gives a full account of Capua's
      defection and its terms.
