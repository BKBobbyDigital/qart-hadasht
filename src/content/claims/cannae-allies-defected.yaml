slug: cannae-allies-defected
statement: >
  Major Italian allies of Rome, including Capua, the second-largest city
  of Italy, and most of the Greek south, defected to Hannibal in the
  weeks and months after Cannae.
confidence: attested
scholarly_consensus: >
  Universally accepted. The pattern of Italian defections in the year
  after Cannae is well-documented and is generally read as evidence that
  Hannibal's broader strategy, to break Rome's confederation rather than
  to take Rome itself, was at least partly working.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.118"
    passage_summary: >
      Polybius lists the principal defections, Capua, Atella, Calatia,
      most of Bruttium and Lucania, the Hirpini, and parts of Apulia,
      and treats this as the immediate consequence of Cannae.
  - source: livy-auc
    stance: supports
    passage_ref: "22.61, 23.1-7"
    passage_summary: >
      Livy gives a fuller and more dramatic account of Capua's defection
      in particular, including the negotiations and the city's
      conditions.
  - source: macdonald-hannibal-2015
    stance: supports
    passage_summary: >
      MacDonald reads the defection pattern as evidence of how thinly
      Rome's hegemony in central and southern Italy had been built,
      and as evidence that Hannibal's strategy of detaching allies was
      a coherent alternative to direct attack on Rome.
  - source: rawlings-celts-spaniards-samnites-1996
    stance: supports
    passage_summary: >
      Treats the Samnite and other Italian allied defections to
      Hannibal after Cannae as substantive political choices by
      communities operating within their own military traditions and
      political interests, not as a passive response to Roman
      defeat. The framing reads the defections as expressions of
      agency by peoples whose interests intersected the Punic War
      without being absorbed by it.
  - source: rawlings-war-in-italy-2011
    stance: supports
    passage_summary: >
      Standard reference chapter on the Italian theater. Treats the
      post-Cannae defection wave as the moment Hannibal's
      alliance-detachment strategy came closest to working, and
      analyzes the Roman response (the legal-political mechanisms
      used to discourage further defections, the punitive treatment
      of recovered allied cities) as evidence of how seriously
      Rome took the strategic threat.
entities:
