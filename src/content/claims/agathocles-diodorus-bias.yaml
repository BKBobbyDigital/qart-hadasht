slug: agathocles-diodorus-bias
statement: >
  The history of Agathocles was contested in antiquity. Timaeus of
  Tauromenium, whom Agathocles had exiled, wrote about him with open
  hostility; Callias of Syracuse, according to Diodorus, was paid to
  praise him. Diodorus says he cannot accept Timaeus's books on
  Agathocles, and Polybius attacks Timaeus for the same bias. How much
  hostile Timaean material nonetheless reached Diodorus's own narrative
  is a modern inference, not something the texts settle.
confidence: inferred
dispute_summary: >
  The ancient testimony is unusually direct. Polybius devotes much of Book
  12 to Timaeus's faults and singles out his treatment of Agathocles as
  malicious (12.15). Diodorus, at Agathocles' death, complains that Timaeus
  blamed him even for misfortunes that were not his fault and called him a
  coward throughout, when "none acquired a greater kingdom with fewer
  resources" (21.17). Diodorus also names the other historians of the
  reign: Callias of Syracuse, whom he accuses of being bribed to praise
  Agathocles, and Antander, Agathocles' own brother (21.16–17). He goes
  further: because Timaeus gave up historical candor to indulge a personal
  grudge, "we cannot fairly accept the last five books of this writer's
  history, in which he covers the deeds of Agathocles" (21.17.3). Modern
  accounts, Miles's among them, often treat Diodorus's narrative as
  essentially Timaeus's; Diodorus's own statement is against that,
  although he does not name his sources passage by passage, and the
  hostile tone of much of his account shows the Timaean view was not
  excluded. The site treats the moral coloring as contested and the
  military narrative as the firmer part.
