slug: treaty-sequence-asymmetry-shift
statement: >
  The three pre-Punic-War Roman-Carthaginian treaties (509,
  348, 279 BCE) read as a sequence preserve the long shift
  in the relationship's asymmetry. The 509 treaty
  presents Carthage as the senior Mediterranean power
  negotiating with a newly republican Rome geographically
  confined to Latium. The 348 treaty tightens commercial
  exclusion as Roman territorial expansion accelerates. The
  279 treaty addresses both states as roughly comparable
  Mediterranean powers facing a common external threat. The
  trajectory across two and a half centuries is from Roman
  junior to Roman near-equal, the precondition for the
  post-Pyrrhic-War rupture at the Mamertine crisis.
confidence: inferred
scholarly_consensus: >
  The trajectory reading is the consensus modern
  interpretation. It is "inferred" rather than "attested"
  because Polybius does not himself draw the long-term
  trajectory. He preserves the three treaties at 3.22–26
  in support of his own argument about the legality of the
  First Punic War, but does not theorize the relationship's
  shift across the period. The trajectory is the modern
  reading of the treaty sequence.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.22-26"
    passage_summary: >
      Polybius preserves the treaty texts and discusses
      their relationship in the context of his analysis of
      the First Punic War's legality.
  - source: hoyos-unplanned-wars-1998
    stance: supports
    passage_summary: >
      Hoyos analyzes the treaty sequence as preserving the
      shift in Roman-Carthaginian relations and
      treats the trajectory as the diplomatic preconditioning
      of the First Punic War.
  - source: hoyos-carthaginians-2010
    stance: supports
    passage_summary: >
      Hoyos's overview integrates the treaty sequence with
      the broader 6th-3rd century Carthaginian Mediterranean
      position.
