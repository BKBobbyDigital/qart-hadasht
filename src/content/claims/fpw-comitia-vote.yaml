slug: fpw-comitia-vote
statement: >
  The comitia centuriata voted for war after being persuaded — by the
  consuls, in Polybius's account — by the prospect of plunder and the
  argument that allowing Carthaginian control of Messana would put a
  hostile power on the Italian doorstep.
confidence: attested
scholarly_consensus: >
  The popular vote and its broad rationale are firmly attested. The
  specific weighting of motives — strategic anxiety vs. expected
  plunder — is shaped by Polybius's source critique and is open to
  some debate.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.11"
    passage_summary: >
      Polybius reports the consular speech to the comitia citing both
      the strategic threat of Carthaginian Messana and the prospect
      of gain to be had from intervention. He treats the latter as
      decisive in moving the vote.
  - source: hoyos-unplanned-wars-1998
    stance: qualifies
    passage_summary: >
      Hoyos analyzes the strategic-anxiety argument as plausible on
      its face — Carthaginian Messana would indeed have been a
      structural change in the central Mediterranean — while treating
      the plunder framing as Polybius's source-critical commentary
      on the popular decision rather than the decisive motive.
entities:
  - type: event
    slug: first-punic-war-outbreak
    role: context
