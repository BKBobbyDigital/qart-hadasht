    stance: supports
    passage_ref: "22.57"
    passage_summary: >
      Reports the conviction of the Vestals Opimia and Floronia for
      unchastity, one buried alive at the Colline Gate and the other a
      suicide, and the man guilty with one of them flogged to death.
      The decemvirs were ordered to consult the books, Quintus Fabius
      Pictor was sent to Delphi, and among the extraordinary sacrifices
      a Gaulish man and woman and a Greek man and woman were let down
      alive under the earth in the Forum Boarium, in a place already
      stained before by human victims, a rite Livy calls not Roman at
      all. The same chapter has about eight thousand able-bodied young
      slaves bought at public expense and armed, having first been
      asked whether they were willing to serve.
notes: >
  The companion fact on the Roman side the year before is the named
  supplication to Hercules among the expiations after the Trebia; see
  [that claim](/claims/rome-supplication-to-hercules-217). Taken
  together the two years show a state answering military catastrophe
  through its own religious machinery on a scale the site has no
  comparable evidence for on the Carthaginian side, which is a fact
  about what survives rather than about what was done.
