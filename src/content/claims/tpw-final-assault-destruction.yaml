      The assault on the Cothon and the forum, the six days and nights of
      street fighting and burning, the surrender of 50,000 from the Byrsa,
      the looting, and the commissioners' decree that nothing be left and
      no one live on the site.
  - source: zonaras-epitome
    stance: supports
    passage_ref: "9.30"
    passage_summary: >
      Most of the men captured died in prison and a few were sold; the
      leading men, the hostages and Hasdrubal lived in honorable
      confinement in Italy; the site was cursed against settlement.
  - source: cicero-tusculan-disputations
    stance: supports
    passage_ref: "3.54"
    passage_summary: >
