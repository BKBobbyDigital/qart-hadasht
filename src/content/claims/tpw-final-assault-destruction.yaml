    stance: supports
    passage_ref: "38.19–22"
    passage_summary: >
      The eyewitness fragments: Hasdrubal's surrender, his wife's
      reproach, and Scipio's words to Polybius as the city burned.
notes: >
  Orosius's seventeen days and Modestinus's plow are cited in the dispute
  summary above; neither author has an entry on the site.
