slug: tpw-final-assault-destruction
statement: >
  In spring 146 BCE Scipio Aemilianus took the wall around the naval
  harbor and the forum, then fought for six days and nights up the three
  streets to the Byrsa, burning them as he went. On the seventh day
  50,000 men and women came out of the citadel under guard. The
  commissioners sent by the senate then ordered whatever remained to be
  obliterated and forbade anyone to live there. Two details often added
  come from much later writers: Orosius's fire of seventeen days, and a
  plow drawn over the site, known only from the jurist Modestinus.
confidence: attested
dispute_summary: >
  Appian gives the sequence: the Cothon wall taken and the forum seized
  (127); six-story houses fought for roof by roof along the three streets,
  then fired (128–130); six days and nights of fighting; the surrender of
  50,000 men and women from the Byrsa, with the deserters excluded (130).
  After the victory the senate's ten commissioners decreed that anything
  left of Carthage be obliterated and no one live there, with dire threats
  against rebuilding the Byrsa or Megara, though walking on the ground was
  not forbidden (135).

  Two popular details are late. Orosius, writing in the early fifth
  century CE, says the city burned for seventeen days without a break
  (4.23.5) and gives the captives as 25,000 women and 30,000 men (4.23.3).
  The plow comes from a third-century CE legal writer, Modestinus, who
  says a city over which a plow is drawn ceases to be a city, "as happened
  to Carthage" (*Digest* 7.4.21); no historian of the war mentions it.
  Appian does not say what became of the 50,000. Zonaras, abridging the
  lost books of Cassius Dio, says most of the men captured were thrown
  into prison and died there and a few were sold, while the leading men,
  the hostages and Hasdrubal lived out their lives in honorable
  confinement in Italy (9.30). Cicero had read a book of consolation that
  the Carthaginian philosopher Clitomachus sent to the captives after the
  city fell (*Tusculan Disputations* 3.54). On the
  salt, which no ancient source mentions, see the
  [open question](/openQuestions/tpw-salt-the-earth).
