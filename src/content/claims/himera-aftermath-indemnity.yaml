slug: himera-aftermath-indemnity
statement: >
  After Himera, Gelon granted Carthage peace on payment of his war costs,
  2,000 talents of silver, and on condition that it build two temples to
  hold copies of the treaty; Carthage added a gold crown of 100 talents for
  his wife Damarete, who had helped secure the peace. No Carthaginian army
  returned to Greek Sicily until 409.
confidence: attested
dispute_summary: >
  Diodorus gives the terms (11.26.2–3) and says Damarete struck a coin
  from the crown's gold, the Damareteion. The prisoners were divided among
  the allied cities and put to work on public buildings; at Acragas, which
  took the most, they quarried the stone for the largest temples and dug
  the city's great drains (11.25). Gelon built temples to Demeter and Kore
  from the spoils and dedicated a golden tripod at Delphi (11.26.7). Miles
  calls the terms surprisingly modest and suggests they protected Magonid
  prestige (*Carthage Must Be Destroyed*, p. 117). Carthage stayed out of
  Greek Sicily for about seventy years, and Miles notes it declined
  openings to return, including an Athenian overture.
sources:
