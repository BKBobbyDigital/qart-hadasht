slug: hannibal-scipio-same-year-deaths
statement: >
  An ancient tradition put the deaths of Hannibal, Scipio Africanus and
  Philopoemen in the same year; Livy rejected it for Scipio, allowing
  only that the three died at about the same time.
confidence: contested
sources:
  - source: livy-auc
    stance: qualifies
    passage_ref: "39.52"
    passage_summary: >
      Polybius and Rutilius put Scipio's death in the year of Hannibal's.
      Livy disagrees, arguing from the censorship of 184 that Scipio was
      already dead, but notes that the three most illustrious men of their
      nations died at about the same time, none of them on native soil.
  - source: justin-epitome
    stance: supports
    passage_ref: "32.4.9"
    passage_summary: >
      The year was marked by the deaths of the three greatest generals of
      the world, Hannibal, Philopoemen and Scipio Africanus.
  - source: nepos-hannibal
    stance: qualifies
    passage_ref: "Hannibal 13.1"
    passage_summary: >
      Hannibal's own death year was disputed: 183 in Atticus, 182 in
      Polybius, 181 in Sulpicius Blitho. Nepos does not mention Scipio's.
notes: >
  The pairing was already a literary theme in antiquity, and it is the
  kind of symmetry historians are drawn to; Livy's objection shows it
  was contested even then. Scipio had withdrawn to his estate at Liternum
  after the prosecutions brought by his enemies at Rome. Both deaths are
  now usually placed in the early 180s, which is as far as the evidence
  allows.
