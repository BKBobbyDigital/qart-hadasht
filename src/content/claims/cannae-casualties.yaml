slug: cannae-casualties
statement: >
  Roman losses at Cannae were among the highest of any single day in
  the history of warfare — perhaps 50,000–70,000 dead and 10,000 captured.
  Carthaginian losses were under 10,000.
confidence: contested
scholarly_consensus: >
  The catastrophic asymmetry is firmly attested. The specific totals
  vary across the principal sources and are treated by modern scholars
  as approximate. The order of magnitude — tens of thousands of Roman
  dead — is not seriously contested.
dispute_summary: |
  The two principal sources give different figures:

  - **Polybius (3.117)** reports approximately 70,000 Roman dead, 10,000
    captured, and roughly 5,700 Carthaginian losses.
  - **Livy (22.49)** gives approximately 47,500 Roman infantry and
    2,700 cavalry killed, with similar figures for captives, and
    approximately 8,000 Carthaginian dead.

  Modern scholarship typically treats Polybius's figure as the upper
  bound and Livy's as the lower; the difference partly reflects whether
  troops who escaped to nearby Roman strongholds and were captured later
  are counted as battle casualties or separately. The proportion of
  Roman forces lost is the more telling figure: on Polybius's totals
  ~75% of the Roman field army was killed or captured in a single day.

  The asymmetry between Roman and Carthaginian losses — roughly 10:1 —
  is striking and may itself be partly inflated. Even at Livy's figure
  of 8,000 Carthaginian dead, a tactical victory of this magnitude with
  losses under 20% is extraordinary and unparalleled in the period.

  The senior Roman casualties are well-attested and not in dispute:
  the consul Aemilius Paullus, the proconsul Servilius Geminus (consul
  in 217), the former magister equitum Minucius Rufus, and a large
  proportion of the Roman senatorial class who served as military
  tribunes all fell at Cannae.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.117"
    passage_summary: >
      Polybius reports approximately 70,000 Roman dead, 10,000 captured,
      and ~5,700 Carthaginian losses; treats the Carthaginian losses as
      heaviest among the Iberian and Gallic infantry of the forward
      crescent.
  - source: livy-auc
    stance: qualifies
    passage_ref: "22.49"
    passage_summary: >
      Livy gives lower Roman totals (~47,500 infantry plus ~2,700
      cavalry killed) and a higher Carthaginian total (~8,000),
      partially reflecting different counting conventions.
  - source: plutarch-lives
    stance: qualifies
    passage_ref: "Aem. Paullus 14, Fabius 16"
    passage_summary: >
      Plutarch preserves figures broadly consistent with Polybius and
      adds detail on the senatorial casualties.
  - source: goldsworthy-fall-carthage-2003
    stance: qualifies
    passage_summary: >
      Goldsworthy surveys the figures and treats the proportion of
      forces lost — rather than any specific total — as the measure
      that matters militarily.
