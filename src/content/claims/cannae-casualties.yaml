slug: cannae-casualties
statement: >
  Roman losses at Cannae were among the heaviest of any single day of
  battle in the ancient record: the surviving accounts give between
  48,000 and 70,000 dead, with thousands more captured, against
  Carthaginian losses of roughly 6,000 to 8,000.
confidence: contested
scholarly_consensus: >
  That a Roman field army was destroyed in a day, with a consul, a
  proconsul and a large part of the senatorial class killed, is not
  disputed. The totals are, and the ancient figures cannot be
  reconciled with one another.
dispute_summary: |
  The four surviving accounts count differently:

  - **Polybius (3.117)** gives about 70,000 infantry dead, about 10,000
    captured (the force left to attack the Carthaginian camp, taken
    outside the main battle), and some 3,000 escaped, with 70 cavalry
    getting away with Varro. Carthaginian losses are about 5,700.
  - **Livy (22.49–52)** enumerates 45,500 infantry and 2,700 cavalry
    killed, so 48,200, with 3,000 infantry and 1,500 cavalry taken in
    the battle and further thousands captured afterward in the two camps
    and at Cannae village. He gives about 8,000 Carthaginian dead.
  - **Plutarch (*Fabius* 16)** gives 50,000 killed, 4,000 taken alive and
    10,000 captured in the camps.
  - **Appian (*Hannibalic War* 24–26)** gives 50,000 killed, with about
    15,000 reaching the camps, of whom 5,000 were captured and 10,000
    broke out to Canusium.

  These are not the same total counted differently. Polybius separates
  the dead from the camp prisoners, so his 70,000 cannot absorb Livy's
  prisoners, and his own figures add up to more than the 80,000 infantry
  he gives for the Roman army. The other three traditions cluster near
  50,000 dead with substantially more survivors. The figures are
  compared in the
  [source comparison](/sourceComparisons/cannae).

  The senior Roman casualties are attested across the sources and are
  not in dispute: the consul Aemilius Paullus, the proconsul Servilius
  Geminus (consul in 217), the former magister equitum Minucius Rufus,
  and a large number of senators and magistrates serving with the
  legions.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.117"
    passage_summary: >
      About 70,000 Roman infantry dead, about 10,000 captured at the
      camp, some 3,000 escaped, and Carthaginian losses of 4,000 Celts,
      1,500 Spaniards and Africans and 200 cavalry.
  - source: livy-auc
    stance: qualifies
    passage_ref: "22.49–52"
    passage_summary: >
      45,500 infantry and 2,700 cavalry killed; 3,000 infantry and 1,500
      cavalry taken prisoner in the battle, with more captured later in
      the camps; about 8,000 Carthaginian dead, "his best troops".
  - source: plutarch-lives
    stance: qualifies
    passage_ref: "*Fabius* 16"
    passage_summary: >
      50,000 Romans killed, 4,000 taken alive, and 10,000 more captured
      in the two camps: closer to Livy's order of magnitude than to
      Polybius's.
