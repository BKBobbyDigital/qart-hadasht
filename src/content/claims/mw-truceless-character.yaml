slug: mw-truceless-character
statement: >
  Polybius's term *aspondos polemos*, "truceless war", is the
  basis for the war's modern English name and reflects his
  view that it "far excelled all wars we know of in cruelty and
  defiance of principle" (1.88). Both sides used mutilation,
  execution of prisoners and crucifixion. The pairing Polybius
  himself draws attention to is Spendius crucified before Tunis
  and the Carthaginian general Hannibal crucified by Mathos on
  the same cross, as if Fortune were giving each side in turn
  the chance to inflict the cruelest punishments (1.86).
confidence: attested
scholarly_consensus: >
  The character of the war rests on Polybius's account, which
  Diodorus's fragments (25.2–6) confirm in outline. How far the
  savagery came from the war's conditions and how far from its
  leaders' decisions is argued in the
  [editorial take](/editorialTakes/mercenary-war-atrocity-structural).
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.65, 1.80–88"
    passage_summary: >
      Polybius opens his account by presenting the war as
      exceptional in its character, and narrates
      the killing of Gisco's party, Hamilcar's reprisals and the
      paired crucifixions at Tunis as the episodes that
      demonstrate this.
