slug: himera-troop-numbers
statement: >
  Herodotus and Diodorus both give Hamilcar 300,000 men at Himera, and
  Diodorus adds over 200 warships and more than 3,000 transports, and
  150,000 Carthaginian dead. No state of the period could have moved or
  fed a force of that size; the figures show a large expedition and a
  Greek interest in magnifying the victory, not its real strength.
confidence: contested
dispute_summary: >
  Herodotus gives 300,000, drawn from Phoenicians, Libyans, Iberians,
  Ligurians, Elisyci, Sardinians and Corsicans (7.165). Diodorus gives not
  less than 300,000 men, over 200 warships and over 3,000 cargo ships
  (11.20), 50,000 foot and over 5,000 horse for Gelon (11.21), and 150,000
  Carthaginian dead with the rest captured (11.22). The same round
  300,000 appears in both, which suggests a figure fixed early in the
  Sicilian tradition rather than two estimates. For comparison, the
  largest armies whose numbers are better grounded, those at Cannae in
  216, were in the tens of thousands on each side. The site does not
  offer its own total, since no source gives a usable one.
sources:
