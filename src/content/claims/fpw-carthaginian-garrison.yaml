slug: fpw-carthaginian-garrison
statement: >
  Carthage responded to the Mamertine appeal first, establishing a
  garrison at Messana under a commander named Hanno before the Roman
  expedition arrived.
confidence: contested
scholarly_consensus: >
  The Carthaginian garrison at Messana is firmly attested. The order
  and circumstances of its establishment, whether Carthage acted before
  Rome had decided to intervene, whether the garrison was at Mamertine
  invitation or by Carthaginian initiative, depends on which lost
  source one trusts and is genuinely disputed.
dispute_summary: |
  Polybius gives a clear sequence (1.10–11): Carthaginian garrison
  established first, Roman vote and expedition following. The narrative
  presents Roman action as a response to a Carthaginian fait accompli.

  But Polybius (3.26) himself reports that an alternative tradition,
  the lost history of **Philinus of Akragas**, a Sicilian Greek writing
  in the early 3rd century BCE with Carthaginian sympathies, held
  that the Romans had violated an existing treaty by intervening in
  Sicily at all. If Philinus's account is given weight, the Carthaginian
  garrison may have been established under a recognized framework
  rather than as an opportunistic seizure.

  Polybius rejects Philinus's claim of a treaty violation. Modern
  scholarship is divided: Hoyos's *Unplanned Wars* treats the Philinus
  tradition as a corrective to the Polybian-Roman narrative, even
  while accepting that the specific treaty Philinus cited probably
  did not exist in the form Philinus claimed. The substantive point,
  that the Carthaginian intervention at Messana was not unambiguously
  aggressive in the way Polybius's narrative implies, is now standard.

  The basic fact of the Carthaginian garrison's existence is not in
  dispute. The political framing of its establishment is.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.10-11, 3.26"
    passage_summary: >
      Polybius reports the Carthaginian garrison and gives a sequence
      that places it before Roman action, while elsewhere acknowledging
      and rejecting Philinus's alternative tradition.
  - source: hoyos-unplanned-wars-1998
    stance: qualifies
    passage_summary: >
      Hoyos's central argument is that Polybius's narrative is shaped
      by Fabius Pictor's pro-Roman framing and that the actual sequence
      and framing of events was substantially more contingent than
      Polybius preserves.
  - source: diodorus-library
    stance: qualifies
    passage_ref: "23.1"
    passage_summary: >
      Diodorus's fragments are too brief to settle the question but
      preserve elements suggesting the Carthaginian and Roman responses
      were closer to simultaneous than Polybius's account implies.
