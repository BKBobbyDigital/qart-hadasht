slug: hannibal-suffete-financial-reform
statement: >
  Hannibal's investigation of Carthaginian state finances as
  suffete in 196 BCE found that public revenues, properly
  collected, could meet the annual installments of the indemnity
  to Rome without a special tax on citizens, the apparent
  shortfall being explained by waste and embezzlement by leading
  men rather than by a real lack of revenue.
confidence: attested
sources:
  - source: livy-auc
    stance: supports
    passage_ref: "33.46-47"
    passage_summary: >
      Livy preserves the financial investigation in detail,
      including Hannibal's address to the assembly exposing the
      misappropriated revenues and showing that the installments
      could be paid without taxing citizens. The offer to pay off
      the whole indemnity early is a separate episode, made by
      Carthaginian envoys in 191 (36.4).
  - source: nepos-hannibal
    stance: supports
    passage_ref: "Han. 7"
    passage_summary: >
      Cornelius Nepos's biography preserves the substance of
      the financial reform in compressed form.
  - source: hoyos-hannibal-2003
    stance: supports
    passage_summary: >
      Hoyos's analysis treats the reform as a substantive
      administrative achievement: Hannibal's competence in
      financial management is consistent with what the
      surviving record preserves about his Italian-campaign
      logistics, and the political reaction it produced was
      severe enough to drive him into exile.
entities:
  - type: event
    slug: hannibal-as-suffete
    role: subject
  - type: person
    slug: hannibal-barca
    role: subject
