notes: >
  Central to the network-as-system reading the site develops
  in the
  [colonial network theme](/themes/phoenician-colonial-network).
  The Melqart cult is the single most tangible and
  well-attested element of the network's coordinating
  infrastructure: the annual delegations are documented across
  centuries of Greco-Roman literary record, the sanctuaries
  are documented archaeologically across all major colonial
  sites, and the cult's specific institutional features (the
  *egersis*, the Tyrian metropolitan centrality) are direct
  evidence for real network integration rather than merely
  shared cultural background.
