slug: 149-demands-as-deliberate-trap
statement: >
  The Roman demands of 149 BCE (hostages, then the surrender of arms,
  then the abandonment of the city for a new site inland) were
  structured so that either Carthaginian answer ended Carthage as it then
  existed. Accepting the last demand would have dissolved the maritime
  city; refusing it led to a war of destruction. The sequence shows that
  by 149 Rome's objective was the end of Carthage in its existing form,
  not its submission.
confidence: inferred
scholarly_consensus: >
  That Rome wanted more than Carthaginian submission in 149 is widely
  accepted, because Carthage had already surrendered to Rome's
  discretion, given hostages and handed over its arms before the
  relocation demand was made. Whether the demands were a trap meant to
  be refused is less certain. No ancient source says so, and the
  relocation demand made refusal unnecessary for Rome's purpose: a
  Carthage moved inland would no longer have been the city Rome feared.
  The reading is inferred from the order and content of the demands,
  supported by Polybius's statement that war had already been decided
  when the Carthaginian envoys reached Rome.
sources:
  - source: appian-punica
    stance: supports
    passage_ref: "75–86"
    passage_summary: >
      Appian gives the sequence in detail: the Carthaginian surrender,
      the three hundred hostages, the handing over of arms, and then the
      consuls' order that the population abandon the city and settle at
      least eighty stades from the sea, followed by a long Carthaginian plea against the order.
  - source: polybius-histories
    stance: supports
    passage_ref: "36.2–3"
    passage_summary: >
      The Romans had resolved on war and were seeking an occasion that
      would look just abroad; the Carthaginian envoys who came to Rome
      found war already decided and the armies departed, and surrendered
      Carthage to Rome's discretion.
  - source: livy-auc
    stance: qualifies
    passage_ref: "Periochae 49"
    passage_summary: >
      The formal grounds for war: ships held contrary to the treaty, an
      army sent beyond Carthage's borders, and war against Masinissa,
      a friend and ally of Rome. This is the justification the demands
      were made under, and it says nothing of relocation.
