slug: hamilcar-iberian-silver-mines
statement: >
  The Carthaginian-controlled silver mines of southern Iberia
  (the Sierra Morena range and the area around modern
  Cartagena) produced substantial revenue during Hamilcar's
  conquest. The Treaty of 201 indemnity paid down ahead of
  schedule across the 190s BCE was substantially financed from
  Iberian silver reserves accumulated during the Barcid
  Iberian project.
confidence: attested
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "2.13, 3.10"
    passage_summary: >
      Polybius preserves the Iberian silver as the principal
      economic engine of the Carthaginian recovery and the
      foundation of the Barcid project's fiscal capacity.
  - source: hoyos-hannibal-2003
    stance: supports
    passage_summary: >
      Hoyos analyzes the Iberian silver-mining operation as the
      structural connector between the Sardinian seizure (which
      lost Carthage its previous principal silver source) and
      the post-Zama recovery (which depended on Iberian
      silver reserves accumulated during the Barcid period).
entities:
  - type: event
    slug: hamilcars-iberian-conquest
    role: context
