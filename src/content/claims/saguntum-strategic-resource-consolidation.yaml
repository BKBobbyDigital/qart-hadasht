slug: saguntum-strategic-resource-consolidation
statement: >
  Hannibal's siege of Saguntum served a strategic-economic
  function beyond the diplomatic provocation: the city was a
  significant regional center whose plunder yielded substantial
  silver and supplies usable for the planned Italian
  expedition. The eight-month investment was itself a logistical
  preparation for the campaign that would begin in spring 218
  BCE. Polybius reports that Saguntum's plunder was
  systematically distributed to fund the Iberian and the
  Italian operations.
confidence: inferred
scholarly_consensus: >
  The dual-purpose reading, diplomatic provocation plus resource
  consolidation, is the site's, but it rests on more than inference.
  Polybius states the motives outright and gives the accounting
  afterward. What stays inferred is the weighting: he supplies the
  aims as a list without ranking them, so the judgment that the
  resources mattered as much as the provocation is ours.

  One caution belongs with it. Polybius lists among the aims the
  funding of an expedition he knows was coming, and he is writing
  long after it came. An aim described by a historian who knows the
  outcome is not the same as an aim recorded at the time, which is
  [the charter's first principle](/charter). The disposition of the
  plunder at 3.17.10-11 is the firmer half of the evidence, because
  it reports what was done rather than what was meant.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "3.17.4-3.17.7, 3.17.10-3.17.11"
    passage_summary: >
      Polybius gives five aims for taking the city: to deny Rome a
      base for a campaign in Iberia, to spread fear so that subject
      peoples stayed quiet and unsubdued ones grew cautious, to leave
      no enemy in his rear, to secure abundant funds and supplies for
      the expedition in prospect, and to raise his troops' spirits
      with booty while winning over opinion at Carthage with the
      spoils sent home. He then records the division: the money set
      aside for Hannibal's own purposes, the captives distributed
      among the army by rank, and the remaining property sent to
      Carthage. He adds that it worked, the troops becoming readier
      for danger, the Carthaginians readier to grant what he asked,
      and the reserved funds letting him do much that was useful.
      Saguntum's territory he calls the most fertile in Iberia
      (3.17.2-3).
