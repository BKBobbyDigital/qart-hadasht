slug: zama-troop-numbers
statement: >
  Only Appian gives army totals for Zama, and his 50,000 for Hannibal is not
  corroborated. The figure Polybius and Livy share is Masinissa's: he joined
  Scipio just before the battle with 6,000 infantry and 4,000 cavalry, which
  with the Roman horse gave Scipio the stronger cavalry.
confidence: contested
scholarly_consensus: >
  The Roman advantage in cavalry follows from the sources' own figures and
  is not in dispute. The total strength of either army cannot be recovered
  from Polybius or Livy, who give none.
dispute_summary: >
  The surviving figures are partial and come from different traditions.

  **Polybius** gives no total for either army. He gives the parts: Tychaeus
  brought Hannibal 2,000 Numidian horse (15.3.7); Masinissa brought Scipio
  6,000 foot and 4,000 horse the day before the parley (15.5.12); Hannibal
  put more than eighty elephants in front and about 12,000 mercenaries,
  Ligurians, Celts, Balearic Islanders and Moors, in his first line, with
  Libyans and Carthaginians in the second and his troops from Italy in the
  third (15.11.1–2). His casualty figures, more than 1,500 Roman dead
  against 20,000 Carthaginian dead and nearly as many prisoners (15.14.9),
  imply a large Carthaginian army without stating its size.

  **Livy** agrees on Masinissa's 6,000 foot and 4,000 horse (30.29) and on
  eighty elephants, and also gives no totals. His order of battle differs in
  two places: a legion of Macedonians stands in the second line, and the
  Italians of the third are "mainly Bruttians" whose loyalty Hannibal
  doubted (30.33, 30.35), where Polybius's third line is simply the troops
  from Italy.

  **Appian** alone gives totals: Hannibal about 50,000 men and eighty
  elephants (*Punica* 40); Scipio about 23,000 foot and 1,500 Italian and
  Roman horse, with Masinissa's Numidian horse, "a large number", and 1,600
  more under a prince named Dacamas (41). His battle narrative departs from
  Polybius's throughout, and his figures cannot be checked against either
  of the other accounts.

  Modern accounts that give totals for both armies are reconstructing them
  from these fragments. Some modern accounts credit Masinissa with a cavalry figure
  of 6,000, which is his infantry figure; Polybius and Livy both give
  4,000 horse.
