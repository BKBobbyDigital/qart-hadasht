slug: tanit-late-emergence
statement: >
  Tanit emerges in the Carthaginian inscriptional record from
  approximately the 5th century BCE forward and is rare to absent
  in earlier Punic dedications. The shift is one of the few
  religious-historical changes clearly visible in the surviving
  evidence over time. Whether Tanit emerged through differentiation
  from Astarte, was imported from elsewhere in the Phoenician
  colonial network, or represents a genuinely Carthaginian
  theological development is contested.
confidence: contested
dispute_summary: |
  The chronological pattern itself is firmly attested — pre-5th-
  century Carthaginian inscriptions name Astarte (or no female
  deity at all); post-5th-century inscriptions overwhelmingly
  name Tanit. The mechanism behind the shift is what divides
  modern scholarship:

  1. Differentiation from Astarte. Tanit emerged as a
     specifically Carthaginian local form of Astarte through
     a process of theological development; the new name
     marked the differentiation. The two are continuous.

  2. Import from elsewhere. Tanit was a deity from
     elsewhere in the Phoenician-Punic colonial network whose
     cult was imported to Carthage and rose to prominence
     there. The Phoenician homeland evidence is too
     fragmentary to confirm or rule this out.

  3. Local Carthaginian development. Tanit emerged from
     a syncretic process involving Phoenician, Libyan, and
     possibly other religious traditions distinctive to
     Carthage's hinterland. This reading takes seriously
     the etymological opacity of the name.

  Modern scholarship has not converged. Quinn's *Phoenicians*
  treatment leans toward (3); older syntheses lean toward (1).
  Aubet's *Phoenicians and the West* discusses the question
  inconclusively.
