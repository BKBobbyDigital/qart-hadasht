slug: agathocles-burned-ships
statement: >
  After landing in Africa in 310 BCE, Agathocles burned his ships on the
  beach, presenting the act as a vow fulfilled to Demeter and Kore, the
  goddesses of Sicily, and as a way of leaving his army no retreat.
confidence: attested
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "20.7"
    passage_summary: >
      After sacrificing to Demeter and Kore, Agathocles tells an assembly
      that he vowed to burn the ships to the goddesses when the fleet was
      pursued by the Carthaginians, and sets the first one alight himself.
  - source: justin-epitome
    stance: supports
    passage_ref: "22.6.4"
    passage_summary: >
      With the army's consent he orders all the ships burned, so that
      every man would know that with flight taken away they must win or
      die.
notes: >
  Diodorus gives the religious framing and Justin the military one; both
  may be true. The goddesses are the same pair Carthage had formally
  adopted in 396 (see [Demeter and Kore](/deities/demeter-kore)), so the
  vow was addressed to deities worshipped on both sides of the war.
entities:
  - type: person
    slug: agathocles
    role: subject
  - type: event
    slug: agathocles-invasion-of-africa
    role: context
