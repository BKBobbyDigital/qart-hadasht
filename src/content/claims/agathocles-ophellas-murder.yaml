slug: agathocles-ophellas-murder
statement: >
  Agathocles invited the Cyrenian governor Ophellas, who had marched
  ~10,000 troops and a similar number of colonists across two months
  of desert to join the African campaign as Agathocles's ally,
  to a banquet a few days after their rendezvous, killed him there,
  and absorbed the surviving Cyrenian army into his own forces.
confidence: attested
scholarly_consensus: >
  Firmly attested in Diodorus and treated as historical by ancient
  and modern scholarship alike. The episode is one of the most
  conspicuous instances of treachery in early Hellenistic warfare and
  is preserved with sufficient detail to be reliable.
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "20.40-42"
    passage_summary: >
      Diodorus gives an extended account: Ophellas's desert march from
      Cyrene with troops and colonists; the rendezvous with Agathocles;
      the few days of joint operations; the banquet; the murder; the
      absorption of the Cyrenian army. Diodorus's framing is morally
      condemnatory, drawing on Timaeus's hostile portrayal of
      Agathocles.
  - source: justin-epitome
    stance: supports
    passage_ref: "22.7"
    passage_summary: >
      Justin preserves the substance of the episode in compressed form.
notes: >
  The episode's preservation owes much to the moral framing the
  Hellenistic and later sources gave it; the bare fact of the murder
  is firmly attested but the dramatic detail of the banquet setting
  may be Diodoran amplification of a more prosaic killing.
