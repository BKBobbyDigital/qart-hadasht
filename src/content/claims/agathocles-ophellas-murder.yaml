slug: agathocles-ophellas-murder
statement: >
  Ophellas, ruler of Cyrene, marched more than 10,000 foot, 600 horse and
  100 chariots, followed by as many noncombatants and colonists, across
  the desert for more than two months to join Agathocles against
  Carthage. A few days after he arrived, Agathocles accused him of
  plotting, attacked his camp while many of his men were out foraging,
  killed him, and took over his army.
confidence: attested
dispute_summary: >
  Diodorus and Justin agree on the treachery and differ on the setting.
  In Diodorus, Agathocles welcomed Ophellas, supplied his exhausted army,
  watched the camp for some days, then roused his own soldiers with a
  charge that Ophellas was plotting against him and led them in battle
  order against the Cyreneans, most of whom were away foraging; Ophellas
  "died fighting" (20.42). Justin has Agathocles win him over with
  flattery; they often dined together, and Ophellas adopted Agathocles'
  son before being killed off his guard (22.7.4–6). Justin also gives the
  bargain behind the alliance: Sicily for Agathocles, Africa for Ophellas
  once Carthage was defeated. The popular version, a murder at a banquet,
  combines the two. Diodorus says Ophellas hoped to rule Libya himself
  and had recruited colonists from Athens, his wife being an Athenian of
  the family of Miltiades (20.40–41).
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "20.40–42"
    passage_summary: >
      The alliance and its terms, Ophellas's army and colonists, the march
      of more than two months, and Agathocles' surprise attack on the camp,
      in which Ophellas died fighting.
  - source: justin-epitome
    stance: supports
    passage_ref: "22.7.4–6"
    passage_summary: >
      Ophellas, aiming at the rule of all Africa, allies with Agathocles;
      after they had dined together often and Ophellas had adopted his son,
      Agathocles kills him unawares and takes his army.
