slug: scipio-humanitas-as-personal-policy
statement: >
  Scipio Africanus's notable post-victory treatment of
  defeated Iberian elites (preserved in the surviving
  Greco-Latin tradition as exemplary *humanitas* and
  illustrated by episodes such as the restoration of the
  Iberian young woman to her future husband at New
  Carthage) was a personal-policy effect rather than a
  Roman institutional norm. The Ilergetes revolt of 206-205
  BCE, triggered by Roman commanders' reversion to harsher
  treatment of allied chieftains after Scipio's departure,
  is the principal evidence for the personal-versus-
  institutional distinction.
confidence: inferred
scholarly_consensus: >
  The reading is broadly accepted in modern scholarship,
  particularly in Hoyos and the recent Iberian-theatre
  treatments. It is "inferred" rather than "attested"
  because the surviving sources frame the post-Scipio
  failures as individual commanders' personal defects
  rather than as evidence about the structural character
  of Roman provincial administration. The "personal-policy"
  reading reframes the same evidence to emphasize that
  Scipio's *humanitas* was unusual rather than typical.
sources:
  - source: polybius-histories
    stance: qualifies
    passage_ref: "10.18-19, 11.32-33"
    passage_summary: >
      Polybius preserves Scipio's New Carthage treatment
      and the post-departure Roman conduct that produced
      the revolt; his framing emphasizes individual
      virtue and individual defect rather than structural
      analysis.
  - source: livy-auc
    stance: qualifies
    passage_ref: "26.50, 29.1-3"
    passage_summary: >
      Livy preserves the same evidence with similar
      framing.
  - source: hoyos-hannibal-2003
    stance: supports
    passage_summary: >
      Hoyos develops the personal-policy reading
      explicitly and uses the Ilergetes revolt as the
      principal evidentiary case.
