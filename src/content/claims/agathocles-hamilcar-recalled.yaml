slug: agathocles-hamilcar-recalled
statement: >
  Hamilcar son of Gisco was not recalled from Sicily when Agathocles
  invaded Africa. Carthage asked him for help, and after a failed assault
  on Syracuse he sent 5,000 men home; he stayed with the rest, and in 309
  BCE, attacking Syracuse by night, he was routed near Euryalus, captured
  and put to death. His head was carried to Agathocles in Africa, who
  showed it to the Carthaginian army.
confidence: attested
dispute_summary: >
  The site formerly described Hamilcar as recalled, and built an argument
  on it: that the invasion "worked" by drawing Carthage's Sicilian
  commander home. Diodorus does not support that. After the defeat in
  Africa the Carthaginians sent to Hamilcar "begging him to send aid"
  (20.15); he tried to storm Syracuse, failed, and sent a relief force of
  5,000 to Carthage (20.16). He remained in Sicily, and the next year led
  his whole army against Syracuse, where a night march in confusion ended
  with his capture by the Syracusans holding Euryalus; he was tortured and
  killed (20.29–30). His head was taken to Africa, and Agathocles rode up
  to the Carthaginian camp and showed it to them (20.33). Justin credits
  the destruction of the army in Sicily to Agathocles' brother Antander
  (22.7.2) and dates events after "Hamilcar son of Gisco was killed"
  (22.8.2). The invasion did divert Carthaginian strength from Sicily; it
  did not bring Hamilcar home.
