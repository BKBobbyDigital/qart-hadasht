notes: >
  The fetiales were a college of Roman priests whose responsibilities
  included the ritual procedure for declaring war: a formal demand
  for redress (rerum repetitio), a 33-day waiting period for
  satisfaction, and, if no satisfaction was received, a ritual
  declaration of war (indictio belli) traditionally performed by
  hurling a sacred spear into enemy territory. By the late
  third century the spear-hurling procedure had been
  symbolicized, performed at a designated plot near the temple
  of Bellona in Rome rather than at the actual frontier, but
  the underlying ritual logic remained operative in
  diplomatic-procedural form. The toga episode at Carthage in
  218 BCE is generally read as the ritual-procedural surface of
  a fetial declaration.
