slug: himera-409-revenge-motivation
statement: >
  Diodorus presents the 409 BCE sack of Himera as revenge. Hannibal son of
  Gisco was the grandson of the Hamilcar who died there in 480 and the son
  of a man exiled for that defeat, and after taking the city he led the
  3,000 men captured to the spot where Hamilcar had died, tortured them,
  and put them to death.
confidence: attested
dispute_summary: >
  The motive is Diodorus's reading, stated at the outset of the campaign
  (13.43: Hannibal, "by nature a hater of the Greeks", wanted to wipe out
  the disgrace done to his family) and repeated at Himera (13.59, 13.62).
  The execution at Hamilcar's place of death is the act that supports it.
  Diodorus does not describe a sacrifice there; he says the prisoners were
  tortured and killed.
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "13.62"
    passage_summary: >
      Hannibal's motive (13.43), the siege and fall of Himera, and the
      torture and execution of 3,000 prisoners at the place where
      Hamilcar died (13.59–62).
