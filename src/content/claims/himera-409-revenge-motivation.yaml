slug: himera-409-revenge-motivation
statement: >
  The 409 BCE sack of Himera was understood by both the
  surviving Greek tradition and (apparently) by the
  Carthaginians themselves as deliberate revenge for the 480
  BCE defeat at Himera that had killed Hannibal son of
  Gisco's grandfather Hamilcar Magonid. Diodorus reports
  Hannibal performing ritual sacrifice on the supposed site
  of his grandfather's death and executing 3,000 Himeran
  prisoners there, in deliberate inversion of the earlier
  engagement. The episode is one of the clearest surviving
  instances of Carthaginian dynastic political memory
  driving operational choice.
confidence: attested
scholarly_consensus: >
  The revenge framing is firmly attested in Diodorus and is
  consistent with the broader Magonid-family pattern of
  dynastic-honor politics that the surviving sources
  preserve. The framing is broadly accepted in modern
  scholarship; the precise number (3,000 executed) bears the
  standard ancient-numbers caveat.
sources:
