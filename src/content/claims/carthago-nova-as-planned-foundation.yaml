notes: >
  Load-bearing for the editorial take on the Barcid Iberian
  state as state. The city's design choices (harbor scale,
  the integration of sanctuary and mint into the urban program,
  the administrative-quarter planning) are calibrated for the
  operation of a polity rather than for the launching of a
  campaign, while remaining compatible with the renewed-war-with-
  Rome strategic orientation that the site treats as the
  project's constant dimension.
