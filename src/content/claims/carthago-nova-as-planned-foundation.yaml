slug: carthago-nova-as-planned-foundation
statement: >
  Carthago Nova, founded by Hasdrubal the Fair in 228 BCE, was a
  Hellenistic-pattern planned colonial foundation rather than a
  military launch facility — designed in advance, integrating
  harbor, fortifications, residential and administrative quarters,
  sanctuary, and mint in a single urban program. The foundation
  pattern is consistent with the Hellenistic-royal foundations of
  the post-Alexander Mediterranean (Antioch under Seleucus I,
  Alexandria under Ptolemy I, Demetrias under Demetrius
  Poliorcetes) and inconsistent with the foundation pattern of
  a war camp or staging point.
confidence: inferred
scholarly_consensus: >
  Polybius's description of the city at length (10.10–11),
  preserved as background to Scipio Africanus's 209 BCE siege,
  is the principal literary witness and is not contested. The
  reading of the foundation pattern as Hellenistic-royal rather
  than as expedient-military is modern synthesis based on
  comparative foundation studies and Spanish archaeological work.
  The reading is "inferred" because the ancient sources preserve
  the description without articulating the Hellenistic-foundation
  comparison.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "10.10-11"
    passage_summary: >
      Polybius's description of Carthago Nova at the time of
      Scipio's 209 BCE siege: a planned coastal city with a
      designed natural harbor, fortified landward and seaward
      approaches, residential quarters, a citadel on the hill
      above the harbor, an administrative complex, a sanctuary
      to Eshmun on the highest point, and a mint. The
      description is detailed and matches what the Spanish
      archaeological excavation has subsequently confirmed at
      modern Cartagena.
  - source: macdonald-carthage-2015
    stance: supports
    passage_summary: >
      MacDonald reads the foundation pattern explicitly as
      Hellenistic-royal, drawing the comparison with the
      Seleucid and Ptolemaic foundation programs.
  - source: hoyos-hannibal-2003
    stance: qualifies
    passage_summary: >
      Hoyos describes the foundation in terms consistent with
      both the strategic-harbor and the planned-capital
      readings without explicitly committing to the
      Hellenistic-pattern framing.
  - source: lopez-castro-hispania-1995
    stance: supports
    passage_summary: >
      López Castro synthesizes the Spanish archaeological work
      at Cartagena and documents the Barcid-period strata at
      the harbor, the residential quarters, and the
      administrative complex as a single planned urban program.
      The archaeological evidence is the principal corroboration
      of the planned-foundation reading.
