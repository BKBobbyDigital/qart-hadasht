slug: carthago-nova-as-planned-foundation
statement: >
  Carthago Nova, founded by Hasdrubal the Fair around 228 BCE, was the
  administrative and strategic capital of the Barcid territory in
  Iberia, not a temporary military base. Polybius describes a walled
  harbor city with a temple on one hill and a palace attributed to
  Hasdrubal on another, where the Carthaginians kept most of their money
  and war material. In function it is comparable to the capitals founded
  by Hellenistic kings, though the evidence supports a functional
  resemblance rather than deliberate imitation of a royal model.
confidence: inferred
scholarly_consensus: >
  Polybius's description (10.10), written by someone who knew the city,
  is the principal literary witness and is not contested. That the city
  served as the capital of the Barcid territory is widely accepted. The
  comparison with Hellenistic royal foundations is a modern analogy,
  and the city's original plan cannot be reconstructed in enough detail
  to show it was laid out on such a model. The reading is "inferred"
  because the ancient sources describe the city without drawing the
  comparison.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "10.8, 10.10"
    passage_summary: >
      The city stands on a peninsula in a gulf made calm by an island at
      its mouth, within a circuit of no more than twenty stades. A temple
      of Asclepius (Eshmun) stands on the largest hill, and on another a
      magnificent palace said to have been built by Hasdrubal when he
      aspired to royal power. The Carthaginians kept the bulk of their
      money and war material in the city.
  - source: diodorus-library
    stance: supports
    passage_ref: "25.12"
    passage_summary: >
      Hasdrubal, proclaimed general with unlimited power by the Iberians
      after his marriage to an Iberian prince's daughter, founds a city
      on the coast, the foundation later called New Carthage.
  - source: lopez-castro-hispania-1995
    stance: qualifies
    passage_summary: >
      López Castro's synthesis of Phoenician and Punic Iberia sets the
      Barcid foundations within the longer history of Punic presence in
      the peninsula, the context for judging what was new about them.
