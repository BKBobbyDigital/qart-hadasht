notes: >
  This claim is one of the central pieces of evidence for
  the editorial take on the Barcid Iberian state as state. The
  succession pattern is the cleanest single piece of evidence
  for the state-form reading because the appointment vs.
  acclamation distinction is procedurally bright-line: a
  senate-appointed commander dies and the senate appoints a
  successor; a Hellenistic-royal house's commander dies and the
  army acclaims the dynastic successor. The Barcid practice is
  the latter, repeated three times across the project's
  nineteen-year span.
