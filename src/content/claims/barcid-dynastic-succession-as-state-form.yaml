slug: barcid-dynastic-succession-as-state-form
statement: >
  Command of the Carthaginian forces in Iberia passed within one family
  three times: Hamilcar Barca held it from 237, his son-in-law Hasdrubal
  the Fair succeeded him in 229/228, and Hamilcar's son Hannibal
  succeeded Hasdrubal in 221, chosen by the army and confirmed at
  Carthage. Three commanders from one family across two generations
  gave the Iberian command a quasi-dynastic character that no ordinary
  Carthaginian expeditionary appointment had, and it is one of the
  marks of a durable, state-like polity rather than a temporary
  command.
confidence: inferred
scholarly_consensus: >
  The successions themselves are attested. Their meaning is inferred.
  The pattern is often compared to the army's role in Macedonian and
  Hellenistic royal succession, and some readings treat the Barcids as
  a royal house in formation. That goes beyond the evidence: the
  practice had a Carthaginian precedent in the army's choice of
  Hamilcar during the Mercenary War in 239, and it can be explained by
  army loyalty, the family's political strength at Carthage and the
  city's interest in keeping effective commanders, without a monarchy.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "2.1.9, 3.13"
    passage_summary: >
      After Hamilcar's death the Carthaginians hand the command to his
      son-in-law Hasdrubal (2.1.9). After Hasdrubal's assassination the
      army chooses Hannibal and the Carthaginians confirm the choice
      (3.13).
  - source: diodorus-library
    stance: supports
    passage_ref: "25.12"
    passage_summary: >
      Hasdrubal is acclaimed general by the army and by the Carthaginians
      alike, and after his marriage to an Iberian prince's daughter is
      proclaimed general with unlimited power by the Iberians.
  - source: livy-auc
    stance: supports
    passage_ref: "21.2–3"
    passage_summary: >
      Livy's account of the successions, with Hannibal acclaimed by the
      army and the choice then approved at Carthage.
  - source: polybius-histories
    stance: qualifies
    passage_ref: "1.82"
    passage_summary: >
      In 239, with Hamilcar and Hanno deadlocked as joint commanders,
      Carthage left the choice to the army, which chose Hamilcar: a
      Carthaginian precedent for army selection that does not depend on
      a Hellenistic model.
