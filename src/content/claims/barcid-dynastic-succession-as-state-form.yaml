notes: >
  Cited in the editorial take on the Barcid Iberian state as state. The
  distinction worth keeping: in 239 an army chose between rival
  aristocrats of different families; in 228 and 221 command passed to
  the dead commander's kinsman in a command the family already held,
  which is closer to ratifying an heir.
