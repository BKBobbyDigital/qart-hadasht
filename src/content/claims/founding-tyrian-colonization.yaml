slug: founding-tyrian-colonization
statement: >
  Carthage was founded as a Phoenician colony by settlers from Tyre.
confidence: attested
scholarly_consensus: >
  Universally accepted across the literary tradition, the
  archaeological record, and modern scholarship. The Tyrian origin
  of Carthage is one of the few elements of the foundation tradition
  not seriously contested.
sources:
  - source: justin-epitome
    stance: supports
    passage_ref: "18.4-6"
    passage_summary: >
      Justin's epitome of Trogus preserves the Tyrian origin of the
      foundation as a settled feature of the tradition.
  - source: diodorus-library
    stance: supports
    passage_summary: >
      Diodorus's surviving fragments and the universal tradition
      he transmits identify Carthage as a Tyrian foundation.
  - source: aubet-phoenicians-west-2001
    stance: supports
    passage_summary: >
      Aubet's standard synthesis of Phoenician colonization treats
      the Tyrian foundation of Carthage as the major event in the
      western Phoenician expansion of the ninth and eighth
      centuries BCE.
notes: >
  The Tyrian foundation event is well attested and not in question.
  The separate question of demographic composition across the
  centuries following the foundation is treated under the
  [open question on Punic demographic composition](/openQuestions/punic-demographic-composition).
  The 2025
  [Ringbauer aDNA study](/sources/ringbauer-punic-genetics-2025)
  finds that Punic-period western Mediterranean populations were
  genetically Mediterranean (Sicilian / Aegean / North African
  ancestry dominant) with only minimal Levantine component —
  consistent with a small Tyrian founding population that
  intermarried extensively with the populations of the western
  Mediterranean across the seven centuries that followed the
  foundation. Founding events transmit culture; demographic
  continuity does not require genetic continuity. The Phoenician
  identity Carthage sustained for those centuries was a cultural
  achievement carried by mixing Mediterranean populations, not
  a Tyrian-population transplant maintained in isolation.
