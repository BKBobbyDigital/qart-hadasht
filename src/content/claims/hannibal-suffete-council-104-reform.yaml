slug: hannibal-suffete-council-104-reform
statement: >
  As suffete, Hannibal reformed the Council of 104 from a
  life-tenure body into an annually-elected one, substantially
  reducing the senatorial-aristocratic faction's institutional
  control over military commanders.
confidence: attested
sources:
  - source: livy-auc
    stance: supports
    passage_ref: "33.46"
    passage_summary: >
      Livy describes the constitutional reform as part of
      Hannibal's broader program against the senatorial
      faction's entrenched institutional power.
further_reading:
  - source: hoyos-hannibal-2003
notes: >
  The Council of 104 had historically held the
  post-campaign judgment of military commanders, sometimes with
  severe consequences (the crucifixion of Hanno after the
  Aegates is the canonical example). Hannibal had personal
  reason to reform an institution that could threaten
  successful commanders; his constitutional reform was both
  politically self-interested and structurally significant.
entities:
