slug: tpw-hasdrubals-wife-immolation
statement: >
  When Hasdrubal surrendered to Scipio Aemilianus on the Byrsa in 146 BCE,
  his wife, whose name is not recorded, reproached him before the Romans.
  Appian, Livy's summary and Orosius say she then killed herself and her
  two sons in the fire; the surviving fragment of Polybius, the
  eyewitness, breaks off before her death.
confidence: attested
dispute_summary: >
  The versions differ. In Polybius (38.20) she comes out from the crowd of
  deserters, dressed like a great lady, holding her two children in
  their smocks, calls on Hasdrubal by name and, when he looks at the
  ground, calls on the gods and denounces him; the fragment ends
  mid-speech. In Appian (131), introduced with "it is said", the
  deserters set fire to the temple of Aesculapius (the Carthaginian
  Eshmun) after Hasdrubal slips out to Scipio with an olive branch; his
  wife, in her finest clothes, speaks within Scipio's hearing, kills her
  children, throws them into the fire and follows them. Livy's summary
  (51) has her throw herself and the two children from the citadel into
  the burning city, and adds that a few days earlier she had failed to
  persuade her husband to desert to the victor with her. Orosius
  (4.23.4) calls her the last queen of Carthage, dying as the first,
  Elissa, had.

  The speeches are literary. The core, her public reproach of Hasdrubal,
  rests on Polybius; the suicide on later writers who agree on it; and
  the comparison with Elissa shows how quickly the scene was shaped into
  a closing symmetry for the city's history.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "38.20"
    passage_summary: >
      She comes out of the crowd of deserters with her children and
      denounces Hasdrubal as he sits beside Scipio; the fragment breaks off
