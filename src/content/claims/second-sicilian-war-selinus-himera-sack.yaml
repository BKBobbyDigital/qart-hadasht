slug: second-sicilian-war-selinus-himera-sack
statement: >
  Hannibal son of Gisco took Selinus and Himera in a single campaign in 409
  BCE. At Selinus, Diodorus counts 16,000 dead and over 5,000 captives, but
  the survivors were allowed back to farm the land on payment of tribute;
  Himera was razed, and 3,000 of its men were killed where Hannibal's
  grandfather Hamilcar had died in 480.
confidence: attested
sources:
  - source: diodorus-library
    stance: supports
    passage_ref: "13.43-62"
    passage_summary: >
      Diodorus gives the fullest preserved narrative of the
      campaigns, with detailed siege and sack descriptions for
      both cities and explicit framing of the Himera operation
      as revenge.
notes: >
  Diodorus (13.54–62) names Ephorus and Timaeus as his sources for the
  campaign and reports their different figures, Timaeus's the lower in
  each case.
