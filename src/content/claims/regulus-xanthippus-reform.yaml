slug: regulus-xanthippus-reform
statement: >
  The Carthaginian generals handed their field army to the Spartan
  Xanthippus in 255 BCE, on his argument that their defeats came from
  their own inexperience and that an army with cavalry and elephants
  should fight on level ground. He retrained it, deployed the
  elephants in one line ahead of the phalanx with the cavalry massed
  on both wings, and destroyed Regulus's army.
confidence: attested
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.32–1.34"
    passage_summary: >
      Xanthippus arrives among recruits brought from Greece by a
      Carthaginian recruiting officer, criticizes the generals'
      handling of the war, is summoned and questioned, and is given
      the army (1.32.1–1.32.5). It takes the field with twelve
      thousand foot, four thousand horse and nearly a hundred
      elephants (1.32.9). On the day the generals give him authority
      to conduct operations as he thinks best (1.33.5): elephants in
      a single line in front, the Carthaginian phalanx behind,
      mercenaries on the right wing, the most active troops with the
      cavalry before both wings (1.33.6–7). About five hundred Romans
      are captured including Regulus, about two thousand escape, and
      the rest are killed (1.34.8–1.34.11).
notes: >
  Polybius gives the cavalry no national label here, and the only
  Numidians in his account of this campaign are raiding Carthaginian
  territory alongside the Romans (1.31.2). Earlier versions of this
  page gave that cavalry a Numidian label; nothing in the source
  supports it. Polybius also does not name the river or locate
  the battle, saying only that it was fought on level ground;
  "Bagradas" is the conventional modern name.
