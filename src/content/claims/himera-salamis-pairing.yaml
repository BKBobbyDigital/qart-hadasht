slug: himera-salamis-pairing
statement: >
  The pairing of Himera with the Greek victories over Persia first appears
  in poetry for the Syracusan victors (Pindar, *Pythian* 1, c. 470), then
  in Herodotus as a Sicilian tale that the battle fell on the day of
  Salamis; Diodorus later moves it to the day of Thermopylae and adds a
  Persian–Carthaginian agreement. Aristotle rejects the connection.
confidence: contested
dispute_summary: >
  The sources in order:

  - **Pindar, *Pythian* 1.75–80** (c. 470, for Hieron of Syracuse):
  Salamis wins the poet the Athenians' thanks, the battle before
  Cithaeron (Plataea) the Spartans', and the river Himeras the sons of
  Deinomenes.

  - **Herodotus 7.165–167** (c. 430): the Sicilians say Gelon would have
  helped Greece but for the Carthaginian invasion, and "they add this tale
  too" that Himera was won on the day of Salamis. He gives the cause as
  Terillus, expelled from Himera by Theron, calling in Hamilcar with
  Anaxilas of Rhegium's help.

  - **Aristotle, *Poetics* 23**: Salamis and the battle against the
  Carthaginians in Sicily happened at the same time "but did not tend to
  any one result".

  - **Diodorus 11.1.4–5, 11.24.1** (first century BCE): Xerxes sent envoys
  to Carthage and agreed that Carthage would attack the Greeks of Sicily
  and Italy while he attacked Greece; Himera fell on the day of
  Thermopylae. Miles attributes the coordination story to Ephorus and the
  Thermopylae date to Timaeus (*Carthage Must Be Destroyed*, pp. 119,
  142).

  - **Justin 19.1.10–13**: envoys from Darius asked Carthage for help
  against Greece, and Carthage refused, citing its wars with its
  neighbors.

  The claim grows as it gets further from the event, and it begins with
  the side that gained from it. The site reads the pairing as Syracusan
  self-presentation that became Greek historical tradition, and finds no
  good evidence of coordination; see the
  [editorial take](/editorialTakes/himera-greek-pairing).
sources:
  - source: herodotus-histories
    stance: supports
    passage_ref: "7.165–167"
    passage_summary: >
      Reports, as the Sicilians' account, Gelon's excuse and the same-day
      synchronism with Salamis; gives a local cause for the war and a
      Carthaginian account of Hamilcar's death.
  - source: diodorus-library
    stance: qualifies
    passage_ref: "11.1.4–5, 11.24.1"
    passage_summary: >
      States a Persian–Carthaginian agreement and dates Himera to the day
      of Thermopylae.
