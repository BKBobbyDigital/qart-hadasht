slug: hannibal-196-reforms-mechanism
statement: >
  Hannibal's 196 BCE reforms targeted the Council of 104's
  oligarchic-hereditary character by limiting members'
  tenure to one year and barring anyone from serving
  two consecutive years (Livy 33.46.6). The reform was passed through the
  popular assembly with explicit suffete sponsorship, a
  procedural sequence demonstrating that the Carthaginian
  *politeia* was not a fixed structure but could be
  substantially reformed through suffete-led legislative
  action backed by popular support, even against
  aristocratic resistance.
confidence: attested
scholarly_consensus: >
  The reform's content and procedural mechanism are firmly
  attested in Livy 33.46-47 and Cornelius Nepos's *Hannibal*.
  Both sources are pro-Roman in their broader framing but
  give the reform episode in operational detail that
  modern scholarship has accepted as reliable.
sources:
  - source: livy-auc
    stance: supports
    passage_ref: "33.46-47"
    passage_summary: >
      Livy's detailed account of Hannibal's suffeteship,
      the financial investigation, the reform of the
      Council of 104, and the political backlash that
      followed.
  - source: nepos-hannibal
    stance: supports
    passage_summary: >
      Nepos's brief biography of Hannibal preserves the
      reform episode with consistent operational detail.
further_reading:
