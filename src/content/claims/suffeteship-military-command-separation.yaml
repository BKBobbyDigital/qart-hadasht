slug: suffeteship-military-command-separation
statement: >
  By the 4th–3rd centuries BCE, the Carthaginian civic suffeteship
  and the military field-command office (Punic *rb mḥnt*,
  "commander of the camp"; Greek *strategos*) had become
  distinct offices that the same individual could
  hold separately or not at all. The separation is unusual
  in the ancient Mediterranean (Roman consulship,
  Spartan dual kingship, Greek tyrannies, and most Hellenistic
  royal offices combined civil and military authority) and is
  one of the clearest marks of the Carthaginian constitution's
  Phoenician institutional distinctiveness. The major Carthaginian
  military commanders of the 3rd century BCE (Hamilcar Barca, the
  Barcid brothers, Hasdrubal Gisco) held military command without
  the suffeteship; Hannibal's 196 BCE suffeteship was a civilian
  office held after his military career ended.
confidence: inferred
scholarly_consensus: >
  The institutional separation is firmly attested in the
  surviving record (the named military commanders of the 3rd
  c. BCE are not the named suffetes of the same period), but
  treating it as a distinctive Carthaginian constitutional
  achievement rather than as accidental administrative
  practice is modern synthesis. Hoyos 2010 and the Krings
  handbook chapters on Carthaginian governance develop the
  reading explicitly. Aristotle (*Politics* 2.11)
  notes the offices but does not analyze the separation as
  distinctive.
sources:
  - source: aristotle-politics
    stance: supports
    passage_ref: "2.11"
    passage_summary: >
      Aristotle's analysis of the Carthaginian constitution
      identifies the suffeteship as a civic-judicial-executive
      office and treats military command separately. The
      separation is implicit in his
      categorization rather than explicitly analyzed as
      distinctive.
  - source: polybius-histories
    stance: supports
    passage_ref: "6.51-56"
    passage_summary: >
      Polybius's constitutional treatment of Carthage in Book 6
      treats civil and military offices as distinct, with
      military command under senatorial direction through
      appointed commanders rather than through the
      civic-magistracy office.
  - source: livy-auc
    stance: supports
    passage_ref: "33.46-47"
    passage_summary: >
      Livy's account of Hannibal's 196 BCE suffeteship documents
      it as a civilian office: Hannibal's reforms were
      political-economic (Council of 104 reform, indemnity-
      embezzlement exposure) rather than military. The
      separation is visible in what he actually did with the
      office.
  - source: hoyos-carthaginians-2010
    stance: supports
    passage_summary: >
      Hoyos's treatment of Carthaginian governance develops
      the suffeteship-military-command separation as a
      distinctive feature, read as a deliberate Carthaginian
      constitutional achievement rather than as accidental
      administrative practice.
  - source: krings-manuel-1995
    stance: supports
    passage_summary: >
      The Krings handbook's chapters on Carthaginian governance
      (principally Bondì on institutional structure) treat the
      separation as one of the Carthaginian constitution's
      distinctive features in comparative ancient-Mediterranean
      context.
