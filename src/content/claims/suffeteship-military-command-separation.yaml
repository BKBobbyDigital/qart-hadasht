notes: >
  Central to the suffeteship-arc narrative and the
  Phoenician-first treatment of Carthaginian governance. The
  separation between civil and military authority that the
  Carthaginian constitution maintained is one of the
  distinctive features that resists the conventional "proto-
  Roman" or "proto-republican" reading of the office. Hannibal's
  196 BCE suffeteship as a civilian executive office after his
  military career is the clearest individual case the surviving
  record preserves; the broader 3rd-c. BCE pattern (Hamilcar
  Barca and the Barcid brothers holding military command as a
  distinct office from the civil magistracy) is the supporting
  evidence.
