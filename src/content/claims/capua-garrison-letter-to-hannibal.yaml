    passage_summary: >
      Gives the situation inside Capua, the proconsuls' offer of
      immunity and its failure, the letter of Bostar and Hanno with its
      arguments, the Numidian couriers, the woman who informed on them,
      the confession under threat of torture, and the mutilation of
      more than seventy men who were sent back into the city.
