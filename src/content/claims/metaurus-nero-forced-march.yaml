slug: metaurus-nero-forced-march
statement: >
  Gaius Claudius Nero executed a forced march of approximately
  300 miles in seven days with a picked force of approximately
  6,000 infantry and 1,000 cavalry, from his command in southern
  Italy to join Marcus Livius Salinator in the north before the
  engagement with Hasdrubal. The march and the surprise
  reinforcement is one of the most-praised tactical-strategic
  decisions in the surviving Roman military tradition.
confidence: attested
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "11.1-3"
    passage_summary: >
      Polybius describes the interception of Hasdrubal's
      dispatches, Nero's decision to march north, the speed and
      secrecy of the movement, and the joint engagement at the
      Metaurus.
  - source: livy-auc
    stance: supports
    passage_ref: "27.43-49"
    passage_summary: >
      Livy gives a fuller dramatic account, including the
      Roman senate's anxiety during the unexplained absence of
      part of the southern army and the eventual celebration on
      learning of the victory.
entities:
  - type: event
    slug: battle-of-metaurus
    role: context
  - type: person
    slug: claudius-nero
    role: subject
