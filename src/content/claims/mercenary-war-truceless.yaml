slug: mercenary-war-truceless
statement: >
  The Mercenary War's brutality was unusual even by the standards of
  ancient warfare. Both sides systematically used torture, mutilation,
  and reciprocal atrocity. Polybius's term *aspondos polemos*
  ("truceless war") reflects this character and is the basis for the
  conflict's modern English name, "the Truceless War."
confidence: attested
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "1.81, 1.88"
    passage_summary: >
      Polybius repeatedly characterizes the war as without parallel
      in his time for cruelty, describes specific atrocities by both
      Carthaginian and rebel forces, and uses *aspondos polemos*
      explicitly. The framing is one of his strongest moral
      judgments anywhere in the Histories.
entities:
