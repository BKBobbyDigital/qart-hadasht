slug: himera-hamilcar-suicide
statement: >
  The Carthaginians' own account of Hamilcar's death at Himera, as
  Herodotus reports it, was that he stayed in camp sacrificing whole
  victims on a great fire throughout the battle, and when he saw his army
  routed threw himself into the flames. Herodotus found this the most
  credible version, and says Hamilcar was afterward honored with
  sacrifices and monuments in the Punic cities, the greatest at Carthage.
  Diodorus has him killed at a sacrifice by Greek cavalry who got into the
  camp by a trick.
confidence: contested
dispute_summary: >
  Three versions survive, and they come from different sides.

  - **The Sicilian Greeks** (Herodotus 7.166): Hamilcar vanished in the
  battle, and Gelon searched everywhere without finding him, dead or
  alive.

  - **The Carthaginians** (Herodotus 7.167): he spent the day sacrificing
  whole bodies on a great pyre, seeking favorable omens, and when the
  army broke he threw himself into the fire. Herodotus calls this account
  the one with "a show of truth", and adds that sacrifice is offered to
  Hamilcar and monuments have been set up in all the colonists' cities,
  the greatest in Carthage itself.

  - **Diodorus** (11.21–22): Gelon intercepted a letter promising
  Hamilcar cavalry from Selinus on the day of a great sacrifice to
  Poseidon; he sent his own horsemen in their place, who were let into
  the naval camp as allies, killed Hamilcar at the sacrifice and fired the
  ships.

  The site formerly treated the fire as a Greek invention about barbarian hubris.
  Herodotus attributes it to the Carthaginians, and the cult he reports
  fits a Carthaginian memory of a commander who gave himself to the gods,
  not a Greek insult. Diodorus's cavalry trick is no more prosaic; it is a
  stratagem story of the kind that gathers around famous victories. All
  three put Hamilcar's death at a sacrifice in the camp, which is the
  common core. Miles notes that the honors suggest Magonid standing
  survived the defeat (p. 117); Diodorus, however, says Hamilcar's son
  Gisco was exiled because of it (13.43).
