slug: tpw-polybius-eyewitness
statement: >
  Polybius was at Carthage with Scipio Aemilianus in 146 BCE. A surviving
  fragment of his *Histories* has Scipio turn to him, grasp his hand and
  say that it was a glorious moment but that he feared the same doom would
  one day be pronounced on his own country. The fuller scene, Scipio
  weeping and quoting Homer on the fall of Troy, survives in Appian and
  Diodorus, both of whom name Polybius as the witness.
confidence: attested
dispute_summary: >
  The scene reaches us by three routes. Polybius 38.21.1 survives in the
  Byzantine excerpts, in his own words and in the first person: Scipio
  grasps his hand and speaks of his fear for Rome. Appian (*Punica*
  132) gives the tears, the meditation on Troy, Assyria, Media, Persia
  and Macedon, and the lines from the *Iliad* (6.448–449), then says
  Polybius asked what he meant and that Scipio named his own country;
  "Polybius actually heard him," he adds, "and recalls it in his history."
  Diodorus (32.24) gives the tears, Polybius's question and the Homer.
  Appian and Diodorus both mark it as report ("is said to have").

  That is a good chain for antiquity, but not an unbroken one: most of
  Polybius's account of the war is lost, and the famous tears and verses
  are known through two later writers who were drawing on it. Whether
  Scipio said exactly this cannot be known, and the scene suits
  Polybius's own theme, the rise and fall of empires, very well.
sources:
  - source: polybius-histories
    stance: supports
    passage_ref: "38.21.1"
    passage_summary: >
      Scipio, grasping Polybius's hand: "A glorious moment, Polybius; but I
      have a dread foreboding that some day the same doom will be
      pronounced on my own country."
  - source: appian-punica
    stance: supports
    passage_ref: "132"
    passage_summary: >
      Scipio is said to have wept, reflected on the fall of cities and
      empires, and quoted Homer; asked by Polybius, he named Rome, and
      Polybius heard him and recorded it.
  - source: diodorus-library
    stance: supports
    passage_ref: "32.24"
    passage_summary: >
      Scipio wept as Carthage burned; asked by Polybius why, he spoke of
      the fickleness of Fortune and quoted Homer.
