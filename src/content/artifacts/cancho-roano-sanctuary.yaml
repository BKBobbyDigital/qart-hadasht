summary_short: >
  A 6th-4th century BCE Tartessian-Iberian sanctuary in interior
  southwestern Spain, with Phoenician material-culture imports and
  architectural features. The best-preserved Iberian sanctuary
  anywhere, ritually destroyed and buried c. 370 BCE.
summary: >
  Cancho Roano is the single best-preserved Iberian-period sanctuary
  in the western Mediterranean, and the principal piece of physical
  evidence for the Tartessian-Phoenician religious-cultural exchange
  that shaped the pre-Punic Iberian elite milieu. The site sat in
  the interior southwestern peninsula — far from any Phoenician
  coastal settlement — and operated as a regional sanctuary across
  approximately two centuries before being deliberately destroyed
  and ritually buried in the late 4th century BCE.

  The architectural plan combines Iberian and Phoenician elements
  in a way no other surviving sanctuary documents at this scale: a
  square central building (Phoenician-style temple plan, with
  parallels at coastal Phoenician colonial sanctuaries),
  surrounded by a courtyard and approached across a water-filled
  moat (Iberian elite-sanctuary feature, paralleled at other
  Tartessian sites). The combination is read as evidence for
  Phoenician religious-architectural influence on the Tartessian
  elite-sanctuary tradition rather than as direct Phoenician
  imposition.

  The find content is exceptional. The deliberate destruction-
  and-burial closure preserved many small finds in situ: imported
  Phoenician pottery, Greek black-figure ceramics, ivory carvings,
  faience amulets, and locally-produced Iberian bronze
  metalwork. The composite assemblage documents an elite religious
  community engaging Phoenician commercial-religious networks at a
  level of intensity that suggests sustained personal contact
  rather than long-distance trade alone.

  The interpretation is contested. Older readings treated Cancho
  Roano as a Phoenician trading post; more recent scholarship reads
  it as a Tartessian elite sanctuary that incorporated Phoenician
  imports and architectural features into a fundamentally local
  religious-political project. The newer reading is dominant but the
  older one persists in some quarters.

  The artifact's relevance to Carthage proper is the pre-Punic
  Iberian context the Barcid Iberian project would later operate
  within. By the time Hamilcar arrived in Iberia in 237 BCE,
  Iberian elite communities had been engaging Phoenician
  material culture and religious-architectural forms for more
  than three centuries; Cancho Roano is the clearest single
  archaeological window onto what that engagement looked like
  at scale.
