summary_short: >
  Terracotta masks with exaggerated grinning faces, used in Punic
  funerary contexts as apotropaic (protective) objects. A distinctive
  Punic-cultural artifact class with no direct Greek or Levantine
  parallel; principally 5th-4th century BCE.
summary: >
  A distinctive class of Punic terracotta artifacts: small to
  medium-sized masks with exaggerated grinning expressions (prominent teeth, wide eyes, often stylized hair or beards) used in
  funerary and probably also domestic contexts as protective objects.
  The grinning masks are one of the more recognizable Punic-cultural
  artifact types and have no direct Greek or Levantine Phoenician
  parallel; the form appears to have emerged within the Punic
  cultural sphere in the 5th century BCE and reaches peak
  documentation in the 4th-century western Mediterranean Punic
  sites.

  The most-cited interpretation is apotropaic: the exaggerated
  grimace was intended to repel malevolent spiritual influences from
  the tomb and its occupants. This reading is supported by the
  consistent find-context (intact tomb deposits, with masks placed
  near the deceased or hung in tomb chambers) and by the broader
  Mediterranean tradition of apotropaic mask-imagery (the Greek
  Gorgon being the closest formal parallel, though the iconographic
  details and mythological background are quite different).

  The contested aspect is the religious-iconographic question of
  what specifically the grinning face represents. Some scholars read
  the masks as depicting a chthonic Punic deity or daimon
  (analogous to the Greek Gorgon or to Mesopotamian protective
  spirits); others as generic apotropaic faces without specific
  divine identification; others again as caricaturized human
  faces with ritual rather than theological function. The
  surviving inscriptional record on the masks themselves is too
  thin to settle the question — the masks are typically uninscribed,
  and the religious content is read iconographically rather than
  textually.

  The masks are also one of the principal pieces of evidence for the
  spread of Punic religious practice across the western
  Mediterranean. The find distribution (heavily concentrated at
  Sardinian sites (San Sperate, Tharros, Sulci, Cagliari), with
  significant presences at Carthage and Punic Sicily) maps closely
  to the broader Punic-cultural diaspora, and the form of the
  masks varies systematically by region in ways that suggest local
  workshop traditions within a shared iconographic vocabulary.
