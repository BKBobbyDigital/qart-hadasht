summary_short: >
  A 2nd-century BCE Numidian royal mausoleum at Dougga (Thugga,
  Tunisia) with a Libyco-Punic bilingual inscription that was the
  principal key text for deciphering the Numidian alphabet. UNESCO
  World Heritage Site.
summary: >
  The Libyco-Punic Mausoleum of Dougga is the principal surviving
  example of Numidian-period royal monumental architecture and one
  of the most consequential individual artifacts for the philology
  of the Libyan (Berber) alphabet. The structure stands
  approximately 21 meters tall, comprising three decorated levels
  atop a five-step base, with carved figural and architectural
  reliefs on each level synthesizing Punic, Egyptian, and
  Hellenistic decorative traditions into a recognizably Numidian
  visual program.

  The bilingual inscription that originally stood on the
  mausoleum's base is its principal scholarly value. The text
  recorded in parallel Punic and Libyan (the early Berber
  alphabet, ancestor of the modern Tifinagh script) provided the
  first systematic decipherment key for the Libyan alphabet — a
  Rosetta-Stone-equivalent for North African pre-Roman epigraphy.
  The 19th-century Western scholarly decipherment of the Libyan
  alphabet rests directly on this stone.

  The 1842 episode is one of the more notorious incidents in the
  history of North African antiquities. Thomas Reade, the
  British consul at Tunis, removed the inscription by ordering
  the destruction of substantial parts of the mausoleum's base to
  extract the inscribed blocks. The blocks were shipped to London
  and have remained at the British Museum since 1843. The
  Tunisian government has periodically requested repatriation;
  the inscription remains in London. The mausoleum itself was
  restored between 1908 and 1910 by Louis Poinssot, but the
  original base configuration cannot be perfectly reconstructed.

  The artifact's relevance to the Carthage scope is the post-146
  BCE Numidian continuation of Punic cultural-religious practice.
  The mausoleum was built well after Carthage's destruction (in
  the period of Numidian autonomous kingdoms under Masinissa's
  successors), but the Punic linguistic and architectural
  vocabulary it deploys documents the persistence of
  Punic-cultural identity in the North African interior
  generations after the metropolis itself was destroyed. The
  Hofra stele cache and the Dougga mausoleum together constitute
  the principal physical evidence for post-146 Punic-cultural
  continuity in Numidia.
