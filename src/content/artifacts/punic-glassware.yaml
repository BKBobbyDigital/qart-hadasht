    Recovered principally from tomb deposits, where small glass
    vessels were placed as grave goods for the deceased's continued
    use. The waterlogged-tomb preservation conditions of some
    Sardinian sites have produced exceptionally well-preserved
    examples; surface finds from continually-occupied sites are
    rarer due to the fragility of ancient glass.
