summary_short: >
  Small polychrome glass vessels — perfume bottles, oil containers,
  cosmetic jars — produced across the Punic world from the 5th to
  3rd centuries BCE. A signature Punic luxury craft tradition with
  a distinctive feathered-pattern aesthetic.
summary: >
  Small core-formed polychrome glass vessels constitute one of the
  signature Punic luxury craft traditions of the 5th-3rd centuries
  BCE. The standard forms — alabastra (slender perfume bottles),
  amphoriskoi (small two-handled jars), aryballoi (round oil
  containers) — were used principally for perfumes, scented oils,
  and cosmetics, items of high status and ritual value in the
  ancient Mediterranean.

  The production technique is "core-forming": a clay-and-dung core
  was shaped to the desired interior of the vessel, dipped in
  molten glass, decorated with applied trails of contrasting glass
  colors that were combed to produce the characteristic feathered
  or zig-zag patterns, then allowed to cool before the core was
  scraped out. The technique was inherited from Levantine
  Phoenician workshops of the 6th century BCE (where it had in turn
  been adopted from earlier Egyptian and Mesopotamian glass
  traditions) and refined in Punic contexts to produce the
  distinctive feathered-pattern aesthetic that characterizes the
  4th-3rd century BCE corpus.

  The find distribution maps closely to the Punic-cultural diaspora.
  The Carthaginian elite-tomb deposits have produced substantial
  numbers of these vessels; Sardinian tomb sites (especially the
  waterlogged contexts at Tharros and Sulci that preserved ancient
  glass exceptionally well) are among the principal sources for
  intact examples; Iberian Punic-influenced burials carry the
  tradition into the 3rd century BCE Punic-Iberian sphere.

  The economic-cultural significance is two-fold. First, the
  glassware represents a high-skill craft production at industrial
  scale — Punic glass workshops were operating systematically, not
  just for elite custom orders, and Punic glass entered the broader
  Mediterranean trade network as a recognized commodity. Second,
  the vessels are a window onto Punic elite consumption practices
  — perfume, scented oils, and cosmetic preparations were part of
  the same Mediterranean-elite lifestyle that the Carthaginian
  political class engaged at every level, and the glass vessels
  are the durable surviving witnesses to consumption patterns that
  the literary record largely ignores.

  The eventual displacement of core-formed by blown glass in the
  1st century BCE — a Roman-era technological transition — ended
  the Punic core-formed tradition, but the surviving 5th-3rd
  century corpus is one of the more substantial bodies of
  pre-Roman Mediterranean luxury craft anywhere.
