summary_short: >
  A cache of more than 800 inscribed Punic-Numidian votive stelae from
  the El Hofra sanctuary at Cirta (modern Constantine), the principal
  evidence for the persistence of Punic religious practice in the
  Numidian interior into the late-Punic and early-Roman period.
summary: >
  The El Hofra cache is the largest single deposit of Punic-period
  votive stelae anywhere — more than 800 inscribed examples plus
  additional uninscribed stelae, all recovered from a single
  sanctuary precinct on the outskirts of ancient Cirta (modern
  Constantine, Algeria). The deposit is the principal evidence for
  what happened to Punic religious practice in the North African
  interior during and after the Carthaginian collapse, and it
  decisively reframes the question of Punic-cultural continuity
  beyond Carthage's destruction in 146 BCE.

  The site's significance is in three areas:

  - **Massylian Punic religion.** Cirta was the principal city of
    the Numidian Massylii kingdom (Masinissa's people, and the seat
    of his successor Micipsa and of Jugurtha). The El Hofra
    sanctuary was active from at least the 3rd century BCE and
    accumulated votive deposits for more than two centuries,
    documenting a sustained Punic-religious practice within a
    Numidian-administered, Berber-language-speaking interior. The
    cache is one of the principal arguments against the older view
    of Punic religion as primarily a coastal-Carthaginian phenomenon
    that didn't penetrate the interior.

  - **Bilingual stelae and language transition.** A subset of the
    Hofra stelae carry parallel Punic and neopunic (a slightly
    later, more cursive Punic) or, in a few late-deposit cases,
    Latin alongside Punic. The cache documents the slow language
    transition from Punic to Latin in the North African interior
    over the 2nd and 1st centuries BCE — the linguistic substrate
    of what would later become the Roman provincial culture of
    Numidia.

  - **Religious iconography.** The Hofra stelae deploy the full
    Punic iconographic vocabulary — Sign of Tanit, palm trees,
    raised-hands gestures, occasional figural representations of the
    dedicator — within a regional treatment that includes
    distinctive Numidian-cultural elements (cavalryman motifs,
    specifically Numidian dress, occasional Berber-language elements
    in the inscriptions). The cache shows Punic religious practice
    as actively engaged with rather than imposed upon the regional
    cultural matrix.

  The 1875 discovery was a watershed for North African Punic
  studies; the cache substantially expanded the surviving corpus of
  Punic inscriptions and remains one of the principal data
  sources for any analysis of late-Punic religious practice and
  cultural continuity.
