summary_short: >
  A larger-than-life marble youth in Greek style, found at Motya in 1979.
  The single most-discussed artifact of Punic Sicily, with contested
  identity (charioteer? Punic priest? hybrid?) and contested production
  context (Greek workshop? Punic patron commission?).
summary: >
  An exceptional larger-than-life-size marble statue of a young man in
  swinging contraposto pose, wearing a long pleated chiton drawn tight
  by a broad belt — the single most-discussed individual artifact from
  Punic Sicily, and the principal piece of high-style sculpture
  surviving from any Carthaginian-controlled site.

  The statue's identity is contested. The most-cited reading is that
  the figure is a victorious charioteer dedicated as a votive at one
  of the Sicilian Greek games, with the long chiton being the
  conventional charioteer's garment. The competing reading proposes a
  Punic priest of Melqart or Baal Hammon, with the pleated robe and
  belt being the Punic ritual costume rather than the Greek
  charioteer's; this reading depends on identifications of the
  textile pattern and belt-decoration with elements visible on
  Phoenician-Punic priestly figures elsewhere. A third reading argues
  for ambiguity as the artifact's actual point — a deliberately
  hybrid object commissioned by a Punic patron at a Greek workshop,
  intended to perform identity bilingually for a Punic audience that
  also engaged Greek artistic conventions.

  The production context is similarly contested. The statue is
  almost certainly the work of a Greek-trained sculptor, but the
  patron and intended setting are unclear. The find context, the
  northeastern sector of Motya near a sanctuary and potters'
  quarter, is consistent with a Punic dedicatory setting; the
  burial context (deliberate breaking and head-removal at the time
  of Dionysius's 397 BCE destruction of the city) is consistent
  with the kind of ritual desacralization a Punic community would
  have performed on a sacred object before abandoning the
  sanctuary to the invader.

  Whatever its identity, the statue is the single most-important
  piece of evidence for the level of Greek-Punic artistic
  exchange in late-5th-century-BCE Sicily, and the principal
  argument for taking Punic-Sicilian elite culture as
  engaged with Greek high-art production rather
  than as the more-isolated Punic-cultural backwater that
  earlier scholarship sometimes implied.
