  notes: >
    The Ahiram inscription is conventionally dated to c. 1000 BCE on
    paleographic grounds, though some scholars have argued for a
    date as late as c. 850 BCE based on archaeological context. The
    1000 BCE date remains the mainstream reading and makes the
    inscription one of the earliest substantial Phoenician-alphabet
    texts anywhere.
