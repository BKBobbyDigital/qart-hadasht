  excavator: Pierre Montet (French archaeological mission)
  circumstances: >
    Discovered in a chamber tomb at the royal Byblian necropolis
    during the French archaeological campaign at Byblos in the
    early 1920s. The chamber had been previously disturbed but the
    sarcophagus itself was largely intact, with the inscription
    preserved and the funerary relief carvings on the case
    substantially clear.
