summary_short: >
  The sarcophagus of Ahiram, king of Byblos (c. 1000 BCE), bearing
  one of the earliest substantial Phoenician-alphabet inscriptions
  anywhere. UNESCO Memory of the World Register. The foundational
  document of the alphabet that became Greek, Latin, Hebrew, Arabic,
  Cyrillic, and most other modern scripts.
summary: >
  The Ahiram sarcophagus is among the most-discussed single artifacts
  of Levantine antiquity, and the foundational physical document of
  the Phoenician alphabet from which the Greek, Latin, Hebrew, Arabic,
  Cyrillic, and most other modern writing systems descend.

  The inscription itself (KAI 1) is a brief funerary text (about
  five lines, running along the upper edge of the lid) recording
  the dedication of the sarcophagus by Ahiram's son Ittobaal and
  closing with a curse formula against tomb violators. The
  paleographic significance is what matters: the letter forms are
  recognizably the fully-developed Phoenician alphabet, with the
  consistent right-to-left reading direction and standardized
  letterforms that subsequent Phoenician inscriptions inherit. The
  conventional dating to c. 1000 BCE makes this the earliest
  substantial example of a fully-formed Phoenician alphabetic text;
  some scholars argue for a date as late as 850 BCE, but the
  paleographic mainstream supports the older date.

  The 2005 UNESCO Memory of the World Register included the Ahiram
  inscription as the foundational text of a documented sequence
  illustrating Phoenician alphabet evolution — the earliest example
  in a chain that includes the Cippi of Melqart, the Karatepe
  bilingual, and the broader Phoenician epigraphic corpus.

  The carved relief panels on the sides of the sarcophagus deserve
  separate attention. They depict Ahiram enthroned, attended by
  servants, with funerary banquet scenes and mourning figures —
  iconographic material in dialogue with Egyptian and Hittite
  funerary conventions of the period. The combination of fully-
  developed alphabetic inscription and substantial figural relief
  makes the Ahiram sarcophagus one of the rare artifacts that is
  simultaneously a primary text and a primary visual document of
  late-2nd-millennium Levantine elite culture.

  The artifact's relevance to Carthage is foundational rather than
  immediate. The Phoenician alphabet attested at Ahiram is the
  writing system the Phoenician colonists brought west to Carthage
  in the 9th-8th centuries BCE. Every Punic inscription on the
  Carthage Tophet stelae, every dedicatory text in the Cippi of
  Melqart, every line of Hanno's lost Periplus, descends from the
  writing tradition the Ahiram inscription documents.
