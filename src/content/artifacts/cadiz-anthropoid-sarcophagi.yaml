summary_short: >
  Phoenician anthropoid sarcophagi from the Gadir (Cádiz) elite
  necropolis, 5th-4th century BCE. The principal evidence for
  Phoenician colonial elite burial practice in the far western
  Mediterranean — a regional variant of the anthropoid tradition
  distinct from the Carthaginian and Sidonian parallels.
summary: >
  Two marble anthropoid sarcophagi recovered from the Phoenician
  necropolis at Gadir (Cádiz, southern Spain) — a male example
  excavated in 1887 and a companion female example recovered
  subsequently. The pair constitutes the principal physical
  evidence for elite Phoenician burial practice at the western
  Mediterranean's most distant Phoenician colonial foundation,
  and is distinctive enough to mark a regional Phoenician-colonial
  variant of the broader anthropoid sarcophagus tradition.

  Gadir was founded by Tyrian colonists conventionally dated to
  the late 12th century BCE, making it one of the earliest
  Phoenician colonial foundations anywhere — earlier than
  Carthage itself. By the 5th-4th centuries BCE, when the
  sarcophagi were carved, Gadir was a substantial Phoenician-
  colonial commercial center anchoring the western Mediterranean
  Phoenician trade network, with strong economic and cultural
  ties to both the Levantine homeland and the Punic-Carthaginian
  sphere consolidating in the central Mediterranean.

  The sarcophagi's iconographic treatment is the artifact's
  principal scholarly interest. The figural style is stylistically
  distinct from both the Sidonian royal anthropoid tradition (more
  Egyptianizing, longer-bodied) and the Carthaginian late-Punic
  anthropoid tradition (more Greek-influenced, with elaborate
  Hellenistic iconographic programs). The Cádiz examples are
  comparatively spare: frontal facial treatment with simplified
  hair and body, hands in raised relief but no elaborated
  iconographic content on the case sides. The reading is of a
  Phoenician-colonial workshop tradition that drew on the broader
  Phoenician anthropoid form but developed its own stylistic
  vocabulary at the western edge of the Phoenician sphere.

  Note on classification: the Cádiz examples are strictly
  Phoenician-colonial rather than Carthaginian, since Cádiz
  remained substantively autonomous of Carthaginian political
  control through most of the period the sarcophagi span. The
  artifact is included for the broader western-Mediterranean
  Phoenician-cultural context that the Carthaginian elite burial
  tradition operates within, and as a contrasting regional
  example to the Carthaginian anthropoid sarcophagi (the
  Sarcophagus of the Winged Priestess) already in the collection.
