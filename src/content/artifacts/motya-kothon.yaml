summary_short: >
  The artificial sacred pool at Motya, c. 52 × 36 m, associated with
  the adjacent Temple of Baal. Originally read as a Punic military
  harbor (parallel to Carthage's cothon); modern scholarship now
  reads it as a sacred-ritual pool rather than a functional harbor.
summary: >
  The Motya kothon is one of the more contested interpretive
  problems in Punic-cultural archaeology. The structure (a
  rectangular cut-stone basin approximately 52.5 by 35.7 meters,
  filled with water, located on the otherwise relatively dry
  island of Motya) was for most of the 20th century read as a
  small inland military harbor structurally parallel to (and
  pre-dating) the Carthage cothon. The interpretation followed the
  Greek word *kothon* (typically translated as "harbor" or
  "anchorage") and the structure's general form.

  Recent scholarship has substantially revised the reading. Lorenzo
  Nigro's excavations at Motya in the 2000s and 2010s established
  that the basin's hydrology (the depth profile, the absence of a
  navigable channel to the open sea sufficient for shipping, the
  shallow water-table interaction) is incompatible with use as a
  functional harbor. The current dominant interpretation treats the
  basin as a sacred ritual pool, associated with the adjacent
  Temple of Baal that excavation has identified on the same
  platform.

  The interpretive shift matters for the Carthage cothon as well.
  The conventional reading of the Carthage cothon as a functional
  military harbor rests on Polybius's surviving description; the
  Motya basin, now read as ritual rather than functional, suggests
  that the "kothon" terminology in Punic-cultural usage may have
  ranged across both ritual and functional applications rather
  than being a strict harbor-engineering term. The Carthage cothon
  itself is not typically reinterpreted on this basis, its
  archaeological signature is more clearly that of a functional
  installation, but the Motya example complicates any simple
  reading of "kothon = harbor" across the Punic sphere.

  The artifact's significance is also chronological: the Motya
  basin predates the Carthage cothon by approximately two
  centuries, making it one of the earliest substantial
  Phoenician-colonial built features anywhere in the western
  Mediterranean. The construction skill the kothon documents (cut-stone perimeter walls, channel-feed water supply,
  precise rectangular planning) places Motya at the high end of
  6th-century BCE Phoenician colonial engineering capacity.

  The relevance to Carthage is two-fold: the kothon is a direct
  iconographic-engineering precedent for the later Carthage
  cothon, and the broader Motya site is the principal
  Carthaginian-aligned settlement in Punic Sicily through the
  6th-4th centuries BCE.
