name_alt:
  latin: Iberian funerary tower from Pozo Moro (modern designation)
type: architecture
material: sandstone (local Iberian)
dimensions: original tower c. 5 m square base, c. 5 m tall (preserved as a tower of fitted stone blocks with relief panels at each level)
date_made:
  value: -500
  precision: decade
  circa: true
  notes: >
    Conventional dating to the late 6th century BCE based on stylistic
    analysis of the relief panels and the find-context stratigraphy.
    Some scholars place the monument slightly later, c. 480 BCE.
current_location: Museo Arqueológico Nacional, Madrid (inventory 1999/76/A)
find_context:
  site: Pozo Moro, near Chinchilla de Monte-Aragón, Albacete province (interior southeastern Iberia)
  year: 1971
  excavator: Spanish Ministry of Culture archaeological team
  circumstances: >
    Initial fragments found accidentally in late 1970-71; formal
    excavation followed and recovered most of the monument's stone
    blocks. The blocks were extensively scattered around the find site
    by ancient demolition (probably itself ritually motivated), and
    the monument was reconstructed in stages at the Museo Arqueológico
    Nacional from the 1980s through to its current display.
dating_method: stylistic
