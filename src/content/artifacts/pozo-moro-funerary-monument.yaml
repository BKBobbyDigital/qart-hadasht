summary_short: >
  A late-6th-century-BCE Iberian funerary tower from Pozo Moro (Albacete),
  whose relief panels show striking iconographic engagement with Phoenician
  and broader Near Eastern mythological themes. Principal evidence for
  Phoenician-Iberian elite cultural exchange before the Punic-Iberian
  consolidation under the Barcids.
summary: >
  A funerary tower from the late 6th century BCE, built for what was
  evidently an elite Iberian burial in the interior southeastern
  peninsula. The monument is one of the principal pieces of evidence
  for the Phoenician-Iberian elite cultural exchange that
  characterized the pre-Carthaginian Iberian context — the period
  before the Barcid military-administrative consolidation made
  southern and eastern Iberia a Carthaginian-controlled provincial
  space, when Phoenician influence reached the Iberian elite via
  trade and emulative cultural transmission rather than direct
  political imposition.

  The relief panels are the artifact's principal scholarly interest.
  Carved on the stone blocks at multiple levels of the tower, they
  depict scenes that read directly to anyone with Near Eastern
  mythological literacy: a banqueting figure being offered food
  by attendants in a scene with strong iconographic parallels to
  Phoenician funerary imagery; a tree-of-life motif; a procession
  of figures with raised arms in benediction; lion-figures at the
  corners that recall both Phoenician and broader Levantine
  funerary-monumental traditions; and most strikingly, a scene
  generally read as a pair of figures consuming what appears to be
  a child — an iconographic detail that has been variously
  interpreted as a Tophet-related ritual, as a Greek-myth-derived
  scene (the Cronus-eating-his-children type), or as a generic
  ritual ogrish theme. The interpretation is contested and the
  iconographic identification of any specific scene as
  conclusively Phoenician-Punic vs. Greek-derived vs. native
  Iberian is genuinely difficult.

  What is uncontested is that the monument's iconographic vocabulary
  is fundamentally non-Iberian — the local Iberian artistic
  tradition does not produce relief panels of this type, and the
  Pozo Moro carver was either a Phoenician-trained craftsman, an
  Iberian artist working from Phoenician models, or a regional
  hybrid. The monument is the clearest single example of
  Phoenician-derived iconographic transmission into the late-6th-
  century Iberian elite-cultural sphere, and it sits at the
  iconographic root of the Punic-Iberian artistic syncretism that
  would emerge fully in the Barcid period.

  The find-context circumstances, a deliberately demolished and
  scattered monument, are themselves interpretively suggestive. The
  Pozo Moro tower was not destroyed by erosion or accident but by
  ancient action, with the relief blocks pulled down and dispersed
  across the find area in a way that reads as either ritual
  desacralization or political destruction of an elite burial.
  Which of those it was is unknown.
