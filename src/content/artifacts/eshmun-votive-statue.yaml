summary_short: >
  A 5th-century BCE marble child statuette dedicated by Baalshillem,
  son of a Sidonian king, to the Phoenician healing god Eshmun.
  Representative of the votive child-figure tradition at the
  Eshmun sanctuary near Sidon.
summary: >
  A small marble votive statuette depicting a seated child, dedicated
  at the sanctuary of Eshmun at Bustan esh Sheikh near Sidon by
  Baalshillem, son of a Sidonian king named Banaa, in the 5th
  century BCE. The Phoenician inscription on the rectangular base
  is brief but substantively informative: "This statuette was
  given by Baalshillem, son of king Banaa... to his lord Eshmun."

  The artifact is a representative example of the Eshmun sanctuary's
  votive child-figure tradition. Eshmun was the principal Phoenician
  healing god, associated with childbirth, child-rearing, and
  recovery from illness. The Sidonian royal-family example shown
  here documents the practice at the highest social register, but
  the broader sanctuary deposit includes hundreds of similar
  statuettes from non-royal dedicators across the 5th and 4th
  centuries BCE — a corpus that constitutes the principal
  Phoenician body of evidence for child-related healing dedication.

  The find context illuminates Phoenician religious practice in
  the metropolitan-Levantine center at a level of specificity
  the Punic-cultural diaspora rarely matches. The Eshmun sanctuary
  was active from at least the 7th century BCE through the late
  Hellenistic period and accumulated votive deposits across the
  full period, with the statuettes representing one phase of a
  longer-running practice. The Phoenician inscriptions on many
  examples allow precise dating and dedicator identification, an
  epigraphic richness the western Phoenician diaspora cannot
  match because of the latter's more limited inscriptional record.

  The relevance to Carthage is two-fold. First, Eshmun was the
  principal Carthaginian healing deity as well as a Sidonian
  one — the Eshmun temple on Carthage's Byrsa hill was the city's
  most important religious installation (and the site of the final
  Carthaginian surrender in 146 BCE). The Sidonian votive
  tradition documents the practice from which the Carthaginian
  Eshmun cult descended. Second, the child-figure votive form
  contrasts directly with the Carthage Tophet practice — both
  invoke divine protection of children, but in radically different
  ritual modes (votive statuette dedication versus cremation
  deposit). The contrast is one of the principal data points for
  understanding what the Tophet was and wasn't.
