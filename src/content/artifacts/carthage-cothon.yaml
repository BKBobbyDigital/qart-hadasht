  circumstances: >
    The harbor complex was extensively damaged in the Roman destruction
    of 146 BCE but was substantially preserved as a topographic feature
    and re-used in modified form under Roman Carthage. Modern
    archaeological investigation by British and French teams (1970s
    onward) has clarified the Punic-period plan and confirmed many
    elements of Polybius's surviving description.
