summary_short: >
  The circular naval harbor and rectangular commercial harbor of Carthage,
  described by Appian and still visible in the modern archaeological park.
  In its excavated form the complex dates to the late third or early
  second century BCE.
summary: >
  The paired harbors on the southern side of ancient Carthage: a
  rectangular basin for merchant shipping and behind it a circular basin
  with a central island, reached through the first and screened from
  the sea. Both are still visible as topographic features in the modern
  archaeological park.

  The only literary description is Appian's, written for the siege of
  149–146 (*Punica* 96). A common entrance about twenty meters wide
  could be closed with iron chains; the outer port held merchant ships
  and tackle; the inner port and its island were ringed with ship-sheds
  for 220 vessels, each fronted by two Ionic columns so that the whole
  looked like a continuous portico; the admiral's house on the island
  commanded the harbor and the sea while hiding the docks from anyone
  approaching, and a double wall let merchants pass into the city
  without seeing the dockyards. Appian does not name his source; it is
  usually thought to be Polybius, who was at the siege.

  Excavation by a British team in the 1970s, part of the international
  campaign to save Carthage, found the radiating stone ramps of the
  ship-sheds on the island and around the north side of the basin, and
  dated the island and the stone sheds to the late third or early
  second century BCE. The excavated remains are close to Appian's
  description in plan but not in number: by the figures Richard
  [Miles](/sources/miles-carthage-2010) reports, about thirty sheds
  fanned out on the island and some 140 could have lined the
  circumference, around 170 in all rather than 220. He also reports
  estimates of about 235,000 cubic meters of earth dug from former
  marshland, and a commercial harbor of only about seven hectares,
  enlarged by a platform built out into the sea.

  The date matters. If the harbor in this form was built in the peace
  after 201, it had nothing to do with the fleets of the First and
  Second Punic Wars, whose harbor is unknown, and it raises a question
  of its own: sheds for some 170 ships in a city the treaty of 201 had
  limited to ten warships. Miles argues that Rome, whose embassies
  visited the city repeatedly, can hardly have been unaware of it, and
  reads the complex as a rebuilt merchant fleet that Rome tolerated
  while it needed African grain for its eastern wars. The site accepts
  the tolerance but not the merchant use. Appian puts the merchant
  ships in the outer harbor and the sheds in the inner one, hidden even
  from incoming merchants, and ship-sheds with slipways are built to
  haul out oared warships. On the site's reading this was a naval
  harbor that Rome knew of and let stand while Carthage was a useful
  ally, obliged by treaty to supply ships for Rome's wars (Livy 36.4),
  and that Roman critics later counted as ships held against the
  treaty (*Periochae* 49). The dating range reaches back before 201; a
  harbor begun before the treaty did not breach it. The argument is set
  out in the
  [take on the destruction](/editorialTakes/destruction-not-weak-enough).
