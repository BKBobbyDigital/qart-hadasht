summary_short: >
  The 6th-century-BCE basalt-like sarcophagus of the Sidonian king Eshmunazar II,
  bearing one of the longest known Phoenician royal inscriptions. Strictly
  Sidonian rather than Carthaginian, but a foundational text for the broader
  Phoenician epistemic context Carthage descends from.
summary: >
  The Egyptian-style anthropoid sarcophagus of Eshmunazar II
  ("Eshmun-helps"), king of Sidon, who reigned approximately 539-525
  BCE as a vassal of the Persian Achaemenid Empire. The sarcophagus
  bears one of the longest surviving Phoenician royal inscriptions —
  a 22-line text on the lid that includes the king's name and titles,
  a curse formula against tomb-violation, a brief biographical sketch,
  and a record of the king's mother (Amoashtart, priestess of
  Astarte) and his temple-foundation activities at Sidon.

  The artifact is strictly Sidonian rather than Carthaginian, and is
  included in the encyclopedia for its broader Phoenician-epistemic
  significance rather than as a directly Carthaginian artifact. Its
  importance for the Carthage-relevant record is in three areas:

  - Phoenician royal-inscription corpus. The Eshmunazar text is
    one of the principal pieces of evidence for the Phoenician royal
    inscription tradition that Carthage's own (much smaller and more
    fragmentary) royal-political inscription record descends from. The
    formal vocabulary, the curse-formula tradition, the
    self-presentation conventions — Carthaginian state inscriptions
    work in the same epigraphic family even where the local Punic
    practice diverged.

  - Persian-period Phoenicia. Eshmunazar II reigned at the
    transition between independent Tyrian-Sidonian regional power and
    Persian-vassal subordination — exactly the period when Carthage
    became independent of metropolitan Phoenician
    political control and the Punic-cultural sphere consolidated as a
    western Mediterranean force in its own right. The sarcophagus is
    a primary document for the metropolitan side of the same
    geopolitical inflection.

  - Egyptianizing royal style. The sarcophagus's anthropoid form
    is borrowed from Egyptian royal funerary practice — a style that
    spread across the Phoenician sphere in the 6th-5th centuries BCE,
    with Sidonian, Tyrian, and Carthaginian elite burials all engaging
    Egyptian forms in varying degrees. The Eshmunazar sarcophagus is
    one of the principal exemplars of this Phoenician-Egyptian
    artistic engagement.

  Eshmunazar's text was instrumental in the 19th-century decipherment
  of Phoenician — its 22 lines provide one of the larger continuous
  text samples available, and the regnal-formula and royal-titulary
  conventions established here informed how subsequent Phoenician
  texts were read. The artifact is therefore both a primary source
  for late-6th-century Sidonian history and a philological anchor
  for the broader Phoenician epigraphic record that the
  Carthaginian inscriptional corpus is part of.
