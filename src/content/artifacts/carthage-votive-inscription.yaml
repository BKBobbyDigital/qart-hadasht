summary_short: >
  A typical Punic votive inscription slab from Carthage, c. 3rd-2nd
  century BCE. Representative of the larger surviving corpus of
  Carthaginian dedicatory texts that constitute the principal
  Punic-language inscriptional record outside the Tophet stelae.
summary: >
  The Carthage votive-inscription corpus is, alongside the Carthage
  Tophet stelae, the principal surviving body of Punic-language
  inscriptional evidence anywhere. The example shown here is a
  representative slab from the broader corpus — a roughly
  rectangular limestone block carved with several lines of clear
  Punic script, recovered from one of the many sanctuary and
  civic contexts the Carthaginian city's ancient fabric contained.

  The Punic inscriptional tradition outside the Tophet operated in
  several distinguishable registers. **Sanctuary dedications**
  record offerings to specific deities (Baal Hammon, Tanit,
  Eshmun, Melqart, and others) by named dedicators, often
  including the dedicator's lineage and the occasion of the
  offering. **Civic-administrative inscriptions** record the
  actions of magistrates (suffetes, treasurers, public-works
  officials) or the dedication of buildings and public spaces.
  **Funerary inscriptions** mark elite burials with names,
  lineages, and occasional brief biographical detail.
  **Honorific inscriptions** commemorate individuals for civic
  service or military achievement.

  The example shown is most likely a sanctuary dedication based
  on the visible content and format. The broader corpus is large
  enough to support systematic analysis of Punic religious
  practice, Carthaginian elite-family lineages, and civic
  administration, but small enough that individual finds remain
  notable and individually cataloged. The Corpus Inscriptionum
  Semiticarum (CIS), the 19th-century scholarly compilation, remains the principal catalog, with substantial supplementary
  additions through the 20th and 21st centuries.

  The corpus's interpretive importance is the access it provides
  to Carthaginian society on its own linguistic terms, rather
  than through Greco-Roman literary mediation. The names, the
  dedicatory formulas, the divine epithets, the administrative
  titles — all are recorded in the language and conceptual
  framework that Carthaginians used about themselves. The
  inscriptional evidence is one of the principal correctives
  to the hostile-source distortions that the surviving Greek and
  Roman literary records introduce.
