summary_short: >
  Silver tetradrachm of Carthage, c. 350-320 BCE, with the iconic
  Tanit/horse-and-palm imagery that defined Carthaginian coinage for
  over a century. The principal pre-Barcid Carthaginian state coinage
  and a central artifact for the iconographic program of late
  Punic religion.
summary: >
  The Tanit-horse silver tetradrachm series is the principal pre-Barcid
  Carthaginian state coinage and the artifact that established the
  iconographic vocabulary that Carthaginian state imagery would draw
  on for the next century and a half. The series began in the second
  half of the 4th century BCE (the period of the Carthaginian
  Sicilian wars, the Pyrrhic engagement, and the consolidation of
  the post-Sicilian-defeat Carthaginian state) and remained the
  dominant Carthaginian silver issue until the Barcid Iberian
  silver-economy reforms of the 230s BCE largely supplanted it.

  The iconographic program is itself the artifact's principal
  scholarly interest:

  - Obverse: head of Tanit. The female head on the obverse is
    conventionally identified as Tanit, the Carthaginian patron
    goddess. The wreath of reeds and elaborate jewelry are
    iconographic borrowings from the Greek-Sicilian Persephone-head
    coinage tradition of the previous century — the Carthage type
    is in direct iconographic dialogue with the Syracusan and other
    Greek-Sicilian state coinages, with the Punic identification of
    Tanit-as-Persephone reading as deliberate religious-cultural
    interpretatio rather than copying. The identification is
    sometimes contested in favor of Persephone-or-Demeter (Greek
    interpretation) or "ambiguous" (deliberately polysemic for a
    multi-cultural Mediterranean audience), but the Tanit reading
    remains the mainstream.

  - Reverse: horse and date palm. The horse is the Carthaginian
    civic symbol par excellence, with iconographic associations
    going back to the foundation legend (the Tyrian colonists
    finding a horse's skull at the foundation site as an omen of
    martial success). The date palm, *phoinix* in Greek, is a
    Punic civic emblem with a likely linguistic pun on the
    Phoenician self-identification. The pairing reads the
    Carthaginian state through its dominant iconographic
    vocabulary in a single image.

  The economic significance is substantial: this is the silver in
  which the late-classical and early-Hellenistic Carthaginian state
  paid its mercenaries, transacted its overseas commerce, and
  accumulated the fiscal reserves that funded the First Punic War
  effort. The Barcid Iberian reforms of the 230s BCE introduced new
  denominations and a new portrait-iconographic vocabulary, but the
  Tanit-horse design persisted in modified form in some
  Carthaginian-mint issues even into the Second Punic War period.
