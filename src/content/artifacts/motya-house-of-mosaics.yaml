summary_short: >
  A late-5th or early-4th century BCE pebble-mosaic floor in a
  Punic elite residence at Motya, with figural hunting scenes and
  geometric borders. One of the earliest substantial Mediterranean
  pebble mosaics, pre-dating the famous Greek-Hellenistic tradition.
summary: >
  The House of Mosaics at Motya is one of the more remarkable
  individual finds of Punic-cultural archaeology. The principal
  preserved pavement (a pebble mosaic of approximately 6 by 4
  meters, with central figural hunting scenes set within a
  geometric border) predates the famous Greek-Hellenistic pebble
  mosaics of the late 4th century (Pella, Eretria, Olynthos) by
  several decades, making the Motya floor one of the earliest
  substantial pebble-mosaic compositions anywhere in the
  Mediterranean.

  The technique uses small black and white river-worn pebbles set
  in mortar to produce a two-tone figural composition. The central
  pictorial field shows hunting scenes — a leopard attacking a
  deer, a griffin pursuing prey, geometric border motifs around
  the figural area. The execution is sophisticated enough to be
  the work of trained mosaic artisans, but the local-stone
  materials (river pebbles from western Sicily) and the
  iconographic vocabulary (Levantine-Phoenician hunting and
  protective scenes rather than Greek mythological subjects)
  identify the workshop tradition as Punic rather than imported
  Greek.

  The chronological significance is substantial. The conventional
  art-historical narrative of Mediterranean pebble-mosaic
  development traces the tradition through late-4th and 3rd
  century BCE Greek-Hellenistic centers, with earlier examples
  treated as scattered and stylistically modest. The Motya
  House-of-Mosaics evidence puts a sophisticated and
  technologically mature pebble-mosaic floor in Punic Sicily a
  full century earlier than the Greek-Hellenistic high point,
  suggesting that Phoenician-Punic craft traditions contributed
  to the broader Mediterranean mosaic tradition more substantially
  than the predominantly Greek-focused art-historical record has
  typically captured.

  The find context (a private residence in the elite-residential
  quarter of Motya, abandoned during the 397 BCE Dionysian
  destruction and not extensively rebuilt) preserves the
  Punic-period state of the floor with relatively limited later
  disturbance. The pavement is the principal pictorial evidence
  for Punic-elite domestic decoration in the western
  Mediterranean, and one of the more compelling individual
  arguments for Punic-cultural production at levels of
  sophistication that the conventional Greek-centric narrative
  underemphasizes.
