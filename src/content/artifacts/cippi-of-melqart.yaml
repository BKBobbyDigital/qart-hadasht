summary_short: >
  A pair of bilingual Punic-Greek inscriptions on marble columns from
  Malta, dedicated to Melqart by two brothers. The text was the first
  substantial bilingual to enable the modern decipherment of Punic in
  the 18th century — the Punic language's Rosetta Stone equivalent.
summary: >
  Two marble columns ("cippi") inscribed with parallel dedications in
  Punic and Greek, recording an offering by two brothers (Abdosir and
  Osirshamar, sons of Osirshamar son of Abdosir) to Melqart, "Lord of
  Tyre." The two inscriptions are linguistically equivalent, with the
  Punic text reading as the primary statement and the Greek as a
  parallel translation, an arrangement that marks the cippi as a
  product of the late-Punic Hellenistic Mediterranean rather than as
  a strictly internal Punic religious dedication.

  The cippi are foundational for the modern study of Punic language.
  Recognized in the 1750s by the French scholar Jean-Jacques Barthélemy
  as a parallel-text bilingual, they enabled the first systematic
  decipherment of the Punic alphabet and lexicon — Punic's "Rosetta
  Stone equivalent" comparison is over-used but accurate here. Every
  subsequent advance in Phoenician-Punic philology rests directly or
  indirectly on the readings Barthélemy and his successors derived
  from these two stones; the surviving corpus of Punic inscriptions
  outside the Cippi is by itself too small and too iconographically
  formulaic to have supported decipherment without bilingual anchors.

  The two cippi were separated in the 18th century: one was given to
  Louis XVI as a diplomatic gift in 1782 and entered the Louvre; the
  other remained in Malta and entered the National Museum of
  Archaeology in Valletta. They were reunited briefly at the Louvre
  Abu Dhabi in 2023 for an exhibition on Phoenician material culture
  — the first time the two stones had been together in nearly 250
  years.

  The find context is a real source-criticism problem. Neither cippus
  was recovered in a documented archaeological context; both entered
  the historical record through 17th-century antiquarian transmission
  with the find site conventionally placed at Malta but unprovenanced
  in any modern sense. The specific Maltese sanctuary they came from
  is contested — the harbor temple at Marsaxlokk and the major
  sanctuary at Tas-Silġ are both proposed, neither secure. This
  uncertainty does not affect the cippi's philological value, the
  inscriptions are what they are regardless of find context, but it
  is a reminder that even the most-foundational bilingual inscriptions
  of the Punic world were recovered under conditions that would now be
  considered substandard.
