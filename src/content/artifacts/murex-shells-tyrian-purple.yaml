    Murex-derived purple-dye production at Phoenician centers
    (principally Tyre and Sidon) is attested archaeologically from
    the mid-2nd millennium BCE through the Roman imperial period.
    The Phoenician period (1st millennium BCE) saw the practice's
    peak commercial importance.
current_location: shell midden remains and dye-vat installations preserved at multiple Phoenician-Punic sites; the example shown is a modern display of the relevant species at the Murex Hotel in Tyre
find_context:
