summary_short: >
  The Murex sea snail shells from which Phoenician workshops
  extracted Tyrian purple: the foundational Phoenician luxury
  industry, and the etymological source of "Phoenician" itself
  (Greek phoinix = "purple-people").
summary: >
  Tyrian purple dye production from Murex sea snails is the
  Phoenician industry par excellence: the practice that defined
  Phoenician commercial and cultural identity in the eastern
  Mediterranean and from which the very term "Phoenician" derives
  (Greek *phoinix* = "purple-people," referring to the dye's
  association with the Levantine coastal cities).

  The chemistry of the process was both demanding and lucrative.
  Two principal Murex species, Hexaplex trunculus and Bolinus
  brandaris, produce a dye precursor in a small gland (the
  hypobranchial gland) that, when extracted, exposed to light, and
  oxidized through a specific multi-day fermentation process,
  yields a deep purple dye remarkably resistant to fading. The
  production ratio was harsh: approximately 12,000 shells produced
  enough dye for a single garment trim. The resulting purple
  textiles became the most expensive single commodity in the
  ancient Mediterranean luxury economy, with finished cloth
  reportedly worth its weight in silver or gold in the late
  Republican Roman period.

  The Phoenician city-states of the Levantine coast (principally
  Tyre and Sidon, with Sarepta and Akko as secondary centers) dominated production through the 1st millennium BCE. The
  industry spread west with the Phoenician colonial expansion;
  dye-vat installations and characteristic shell-midden deposits
  are attested at Carthage, Motya, Tharros, and other Punic
  colonial sites, indicating that purple-dye production was
  established at the western Mediterranean Phoenician colonies
  from at least the 7th century BCE forward and remained
  commercially important throughout the Punic period.

  The cultural significance is broader than commercial. Tyrian
  purple was the marker of royal and divine status across the
  ancient Mediterranean for over a millennium: Phoenician kings,
  Israelite high priests, Persian satraps, Greek aristocrats,
  Roman emperors. The Phoenicians' control of the production
  process underwrote their commercial reach and their cultural
  prestige at the highest registers of ancient elite society. The
  Punic-cultural sphere's commercial vitality through the 1st
  millennium BCE rests substantially on this single industry and
  its derivatives.

  Note: the image shown is a modern display of Murex shells at
  the Murex Hotel in Tyre, Lebanon. The shells are the relevant
  biological agent of the historical industry; the photograph is
  a contemporary representation of the material basis of the
  ancient practice.
