  circumstances: >
    Archaeological evidence consists principally of shell-midden
    deposits at production sites (containing the broken or
    discarded shells from which the dye-bearing gland was extracted)
    and dye-vat installations (ceramic and stone vessels with
    characteristic purple staining). The chemistry of the
    extraction (requiring large quantities of shells per gram of
    dye, with characteristic chemical residues) leaves a
    distinctive archaeological signature.
