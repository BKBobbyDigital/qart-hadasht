summary_short: >
  Small Punic polychrome glass pendants depicting grimacing
  apotropaic faces. A distinctive Punic glass-craft tradition of
  the 5th-2nd centuries BCE, exported across the western
  Mediterranean as personal protective charms.
summary: >
  Punic glass face beads are one of the more distinctive small-
  artifact classes of the Punic-cultural production tradition: small
  polychrome glass pendants, typically 2-4 cm across, depicting
  stylized grimacing or expressive faces, made by Punic glass
  workshops principally from the late 5th century through the
  mid-2nd century BCE. The example shown is a representative
  specimen from the Metropolitan Museum of Art's collection.

  The production technique combined two distinct glass-working
  methods: a core-formed translucent glass base (similar to that
  used for the larger Punic alabastra and amphoriskoi covered
  elsewhere in this collection) and applied glass-trail
  decoration using polychrome opaque glass strands to build up
  the facial features. Eyes were typically rendered with concentric
  circles of contrasting glass; beards or hair treatments used
  applied glass trails in zigzag or comb patterns. The
  craftsmanship at the highest-quality end of the corpus is
  remarkable for objects of this small scale.

  The function is conventionally read as apotropaic — protective
  personal charms warding off the evil eye and malevolent
  influences. The grimacing facial treatment relates the beads
  iconographically to the larger Punic terracotta apotropaic
  masks covered elsewhere in this collection, though the
  miniature glass format was for personal jewelry-wear rather
  than tomb display. The shared iconographic vocabulary across
  the two artifact classes suggests a coherent Punic protective-
  iconography tradition operating at multiple scales.

  The find distribution traces the Punic-cultural diaspora at
  miniature: face beads turn up in elite tomb contexts at
  Carthage, across the Sardinian Punic sites (Tharros, Sulci,
  Bithia), in Punic Sicily, in Iberian Punic-influenced burials,
  and in eastern Mediterranean Phoenician contexts (Cyprus,
  Levantine coast). The Met example, like many in the western
  museum collections, lacks documented find context, it entered
  the Morgan collection through the early-20th-century
  antiquarian trade, but the type is unambiguously Punic by
  manufacture and the broader corpus is well-documented from
  excavated examples.
