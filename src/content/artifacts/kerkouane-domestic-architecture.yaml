summary_short: >
  The remarkably preserved residential architecture of the Punic city
  abandoned c. 250 BCE and never rebuilt — the only Phoenicio-Punic
  city to survive in something resembling its Punic-period state.
  Principal evidence for Punic urban planning, domestic life, and
  household-scale ritual practice.
summary: >
  Kerkouane is the single most-important archaeological site for
  understanding what Punic urban life actually looked like at the
  household scale. The settlement was abandoned during the First Punic
  War (probably in 256-254 BCE during Regulus's African expedition,
  though some scholars place the abandonment slightly later) and was
  never reoccupied. As a result the Punic-period urban fabric
  survives in its final 3rd-century BCE state, undisturbed by the
  Roman-imperial overbuilding that has destroyed or obscured the
  Punic substrate at every other major Punic site (Carthage,
  Hadrumetum, Lepcis Magna, etc.).

  The architectural evidence is exceptional in three areas:

  - Urban planning. Kerkouane was laid out on a regular grid of
    streets with substantial planning effort: standard insula
    dimensions, drainage channels, and clear differentiation of
    residential, civic, and craft-production zones. The plan reads as
    a deliberately designed colonial foundation rather than the
    organic accretion of a long-lived settlement; this is consistent
    with what is known of Punic colonial practice elsewhere but is
    unusually well preserved.

  - Domestic architecture. The standard Kerkouane house has 6-10
    rooms organized around a central courtyard, with a private bath
    (the famous lime-plaster sit-baths that have survived in many
    houses) and dedicated kitchen space. The bath rooms are the
    site's most-photographed feature: the carved stone tubs, lime-
    plaster lining, and drainage channels survive well enough to
    reconstruct the household water-supply and bathing practice in
    detail. This level of preserved domestic infrastructure is
    unmatched anywhere else in the Punic record.

  - Painted plaster and household ritual. Wall paintings,
    polychrome plaster surfaces, and small-scale religious
    installations (household shrines with niches, small altars,
    Sign of Tanit motifs incorporated into floor mosaics) survive in
    multiple houses. The household-religion evidence is one of the
    principal correctives to the Carthage-centric, public-temple-
    focused reading of Punic religion that the literary sources
    naturally produce — Kerkouane shows Punic religious practice as
    something embedded in everyday domestic space, not just at the
    Tophet or the great civic sanctuaries.

  The site's modern preservation is itself notable: Kerkouane was
  inscribed as a UNESCO World Heritage Site in 1985 specifically as
  "the only example of a Phoenicio-Punic city to have survived." The
  archaeological park is open to the public and the site continues
  to produce new findings as excavation extends into previously
  unexamined sectors.
