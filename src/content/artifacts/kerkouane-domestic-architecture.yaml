  circumstances: >
    The site's exceptional preservation results from two factors: the
    city was abandoned during the First Punic War and never rebuilt,
    so the Punic architectural fabric was not overwritten by later
    Roman occupation; and the absence of substantial post-abandonment
    settlement preserved the urban plan, individual house layouts,
    plaster surfaces, and even some wall paintings in their
    Punic-period state.
