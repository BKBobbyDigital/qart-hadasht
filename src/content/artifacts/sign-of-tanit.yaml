summary_short: >
  The schematic anthropomorph symbol (triangular body, horizontal arms bar,
  circular head) that became the recurring votive motif of Punic religious
  iconography from c. 5th century BCE through to 146 BCE. The single most-
  recognizable Punic visual signature.
summary: >
  The schematic anthropomorph motif consisting of a triangular body, a
  horizontal arms bar, and a circular head — the single most-recognizable
  Punic visual signature, and the recurring votive emblem of the
  Carthaginian-Punic religious sphere across approximately the 5th
  century BCE through the destruction of Carthage in 146 BCE.

  The Sign appears overwhelmingly on Tophet-precinct votive stelae,
  where it functions as the conventional dedicatory mark for offerings
  to Tanit (the goddess of whom it is the visual sign) and her
  consort Baal Hammon. Its iconography varies — the body can be
  triangular, trapezoidal, or rectangular; the head can be a simple
  circle, a disc with internal markings, or a more elaborated
  facing-portrait; the arms bar can be plain or have raised, lowered,
  or out-stretched extensions. The variation across the corpus is
  meaningful, different Punic sites and periods favor different
  treatments, but the basic schematic recognizability is consistent
  enough that the Sign is unambiguously identifiable across the
  diaspora.

  The interpretation of the symbol is contested at multiple levels.
  The most-cited reading takes the Sign as a stylized figure of the
  goddess Tanit herself (body, arms, head) with the schematic
  treatment reflecting either an aniconic religious convention
  (resistance to detailed divine representation) or an iconographic
  shorthand that grew increasingly stylized over time. Alternative
  readings have proposed an altar or cult-stand iconography (the
  body as the altar, the arms bar as the offering surface, the head
  as the sacred fire or dedication object), an apotropaic/protective
  amuletic function rather than a specifically theological one, and
  hybrid readings that take the Sign as deliberately polysemic.

  Time-period and geographic distribution. The Sign appears in the
  Punic record from approximately the 5th century BCE forward, with
  the earliest secure examples on Carthage Tophet stelae of that
  period; the symbol then spreads across the Punic diaspora and
  reaches peak frequency in the 4th-2nd centuries BCE. After the
  Roman destruction in 146 BCE the Sign continues to appear on
  Punic-substrate populations under Roman administration in
  attenuated form for several centuries, particularly in
  Tripolitanian neopunic contexts, gradually receding through the
  Roman imperial period.

  As a methodological point: the Sign of Tanit is included in the
  artifacts collection as a single entity rather than as multiple
  individual stelae because the corpus's principal scholarly
  interest is in the recurrence and variation of the symbol itself
  rather than in any one inscribed example. The image accompanying
  this entry shows one well-preserved instance (a 3rd-century BCE
  stele from the Carthage Tophet, now at the Musée des Beaux-Arts
  in Lyon) but the entry is about the iconographic motif as
  attested across hundreds of surviving examples.
