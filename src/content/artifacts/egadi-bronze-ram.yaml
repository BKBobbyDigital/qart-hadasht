    Conventional dating to the late 3rd century BCE based on
    paleography of Punic and Latin inscriptions on the rams and
    the contextual association with the First Punic War. The 241
    BCE Aegates Islands engagement is the most-cited terminus
    ante quem for the Carthaginian and Roman rams together
    recovered from the same seabed area.
