summary_short: >
  Bronze warship rams recovered from the seabed at the Aegates
  Islands battle site (2010 onward). The single most-important
  recent archaeological discovery for First Punic War naval warfare,
  with rams attributable to both Carthaginian and Roman ships.
summary: >
  The Egadi rams are the most significant single archaeological
  discovery for understanding ancient Mediterranean naval warfare
  in the past quarter-century, and the principal physical evidence
  for the climactic engagement of the First Punic War. Recovered
  since 2010 from the seabed around Levanzo and Favignana, the
  Egadi (Aegates) Islands off western Sicily, at depths around 80
  meters, the rams document a battle archaeologically located,
  identified, and physically attested in a way that almost no other
  ancient naval engagement has been.

  Twenty-seven rams have been recovered to date and survey work
  continues. The corpus includes Roman-built examples (identified
  by Latin inscriptions naming the consul and quaestor who
  oversaw construction, by typological features of Roman naval
  shipwrights, and in some cases by stamp marks of specific
  manufactures) and Carthaginian examples (identified by Punic
  inscriptions invoking Baal and by typological features of
  Carthaginian naval construction). Many rams show V-shaped
  scratches across their striking surfaces, attributed to
  ram-against-ram engagement during the battle itself — direct
  physical evidence of the tactical patterns Polybius's narrative
  describes.

  The find places the battle's location with unprecedented
  precision. Polybius (1.60-61) describes Lutatius engaging the
  Carthaginian fleet in a brisk wind off the Aegates Islands; the
  exact location had been disputed by modern scholars (the
  identifications had ranged across several kilometers of
  channel). The seabed concentration of rams establishes the
  engagement site within a narrow corridor and confirms the
  surviving literary account's geographic framework in detail.

  Several Carthaginian rams carry Punic inscriptions — short
  dedicatory or invocational texts naming Baal and asking divine
  protection for the vessel. These represent a previously
  unknown body of Punic naval-religious epigraphy and have
  expanded the corpus of Punic inscriptions in a category that
  was previously almost unattested.

  The Egadi project is also a model for late-20th and 21st-century
  underwater archaeology: systematic survey across a known battle
  area, in-situ documentation before raising, raising under
  controlled conditions, and detailed conservation of waterlogged
  metal. The Roman-Italian collaboration (RPM Nautical Foundation
  with the Sicilian Soprintendenza del Mare) under the late
  Sebastiano Tusa established standards that have shaped
  subsequent underwater-archaeology practice across the
  Mediterranean.
