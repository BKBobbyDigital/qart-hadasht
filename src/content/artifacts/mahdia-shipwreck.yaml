    Mahdia. Systematic recovery proceeded under Alfred Merlin's
    direction from 1907 through 1913, raising bronze sculptures,
    marble columns and architectural elements, statuary fragments,
    and other cargo. The wreck represented a Greek commercial
    shipment of luxury art objects destined for Roman buyers in
    Italy that foundered en route.
