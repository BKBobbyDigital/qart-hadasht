summary_short: >
  A 7th-century BCE Phoenician silver-gilt bowl with figural
  decoration combining Egyptian and Mesopotamian iconographic
  vocabularies. Representative of the Phoenician high-luxury
  metalwork tradition exported across the Mediterranean to
  Assyrian, Greek, and Etruscan elite markets.
summary: >
  Phoenician silver and silver-gilt bowls with concentric registers
  of figural decoration are one of the defining Phoenician luxury-
  craft classes of the early Iron Age. The Cesnola example shown
  here is a representative specimen — recovered from Phoenician-
  period Cyprus, dated to the late 8th or early 7th century BCE,
  and showing the characteristic combination of Egyptian
  iconographic motifs (sphinxes, lotus, Egyptianizing figures) with
  Mesopotamian visual conventions (combat scenes, processional
  registers) that defined the Phoenician high-style metalwork
  tradition.

  The production technique combined silver-vessel forming with
  selective gilt applied to the figural decoration — fire-gilding
  or applied gold leaf used to highlight specific scenes within
  the chased and engraved surface. The combination produced a
  visual contrast that the Phoenician workshops appear to have
  developed as a signature, and that the broader Phoenician metal-
  bowl corpus consistently displays.

  The find context is the Cesnola excavations on Cyprus
  (1865-1876), one of the more substantial late-19th-century
  antiquarian campaigns. Cesnola's documentation was variable; the
  bowl shown here lacks precise find-site provenance, a recurring
  issue with the Cyprus material that entered Western museums
  during this period. The broader Phoenician metal-bowl corpus
  comes from multiple sites — Assyrian palaces (the Nimrud cache),
  Etruscan tombs (the Bernardini and Barberini tombs at Palestrina),
  Greek sanctuaries (the Olympia votives), and Cypriot Phoenician
  contexts (the Cesnola material) — together documenting the
  spread of Phoenician luxury metalwork across the eastern and
  central Mediterranean during the Iron Age.

  The artifact's relevance to Carthage is the broader Phoenician
  luxury-production economy that Carthage inherited from its
  Tyrian metropolitan origins. The Punic Iberian-period elite
  consumption practices, the late-Punic anthropoid sarcophagi, the
  Punic glass and terracotta production — all operate within the
  craft-cultural tradition that the Phoenician metal-bowl
  workshops established at industrial scale in the 8th-7th
  centuries BCE.
