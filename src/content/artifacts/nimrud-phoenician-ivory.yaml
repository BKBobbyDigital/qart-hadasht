summary_short: >
  A 9th-7th century BCE Phoenician-workshop ivory carving depicting
  a goddess (probably Astarte) at her temple window, recovered from
  the Assyrian palace at Nimrud. The principal exemplar of
  Phoenician luxury-ivory production for the Near Eastern imperial
  market.
summary: >
  An exceptional example of the Phoenician luxury ivory carving
  tradition that defined eastern-Mediterranean elite material
  culture in the early 1st millennium BCE. The "Lady at the
  Window" depicts a frontal female face — calm symmetrical
  expression, elaborately styled hair, large almond-shaped eyes —
  peering out from an architectural window frame, the whole carved
  with extraordinary fineness from a single ivory blank.

  The iconography is widely read as a representation of Astarte at
  her temple window, a Levantine cultic image known from other
  surviving examples and from textual references in the biblical
  and Phoenician traditions. The motif occurs in multiple variants
  across the Phoenician ivory corpus, with the Nimrud example
  considered the finest surviving instance of the type. The piece
  was originally inlaid with gold and semi-precious stones (most
  now lost), making the surviving carving only a partial
  representation of its original polychrome and metallic appearance.

  The find context illuminates the broader political economy of
  Phoenician luxury production in the early Iron Age. The Nimrud
  deposit accumulated through Assyrian imperial appropriation —
  ivories acquired as tribute, booty, or trade by successive
  Assyrian kings and stored at the imperial palace until its fall
  in 612 BCE. The Phoenician city-states (principally Tyre, Sidon,
  Byblos) operated specialized ivory workshops producing high-end
  luxury goods for the Near Eastern imperial market;
  Phoenician-style ivories appear at Assyrian, Egyptian, and
  later Persian sites across the eastern Mediterranean, with the
  Nimrud corpus the largest single recovery.

  The relevance to Carthage is that the artistic tradition the
  Nimrud ivory represents is the same Phoenician luxury-production
  tradition Carthage inherited from its 9th-8th century BCE
  Tyrian metropolitan origins. The Carthaginian elite-burial
  context produces, in attenuated form, ivory and bone work in
  recognizable continuity with this Levantine tradition; the
  high-style Phoenician aesthetic — frontal figural composition,
  Egyptian-influenced detail, frame-and-window architectural
  setting — is one of the iconographic vocabularies the western
  Punic-cultural sphere drew on.

  Note on scope: this artifact is Levantine Phoenician rather
  than western Punic. It is included for the broader Phoenician
  context that Carthage descends from rather than as a directly
  Carthaginian artifact.
