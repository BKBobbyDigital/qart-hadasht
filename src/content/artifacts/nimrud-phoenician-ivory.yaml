  circumstances: >
    Recovered from a deposit at the Assyrian palace at Nimrud,
    where Phoenician-made luxury ivories had accumulated as
    imperial booty or tribute. The deposit included substantial
    Phoenician-workshop production alongside Assyrian-style
    ivories from northern Syrian and Cilician centers; the
    Phoenician examples are distinguished by stylistic features
    (Egyptian-influenced figural treatment, specific iconographic
    programs) that establish their Levantine origin.
