summary_short: >
  A 7th-century BCE alabaster Phoenician statuette of a seated
  goddess (probably Astarte) found in an elite Iberian tomb in
  interior Spain. The principal physical evidence for early
  Phoenician luxury-good penetration into the pre-Punic Iberian
  hinterland.
summary: >
  A small alabaster statuette of an enthroned female deity, almost
  certainly representing Astarte, recovered from an elite Iberian
  chamber tomb at Cerro del Real near Galera in modern Granada
  province. The artifact is conventionally dated to the 7th century
  BCE on stylistic grounds and is one of the most-cited single
  pieces of evidence for early Phoenician luxury-good circulation
  into pre-Punic Iberia.

  The iconography is unmistakably Levantine-Phoenician but
  cosmopolitan in its specific elements: the seated-goddess pose
  with sphinx flanking is Mesopotamian; the hair-treatment and
  costume details are Egyptianizing; the ritual vessel held against
  the chest (with hollow openings that probably allowed liquid
  offerings to be poured through the figure) is a specifically
  Phoenician temple-cult feature. The piece reads as a high-status
  Phoenician workshop product made for the Levantine market and
  exported west via the commercial networks the 7th-century
  Phoenician colonial expansion had established.

  The find context is the artifact's principal scholarly interest.
  Galera sits deep in interior southern Iberia, far from any
  Phoenician coastal settlement. The Lady's presence in an Iberian
  elite tomb there demonstrates that Phoenician material culture
  was penetrating the Iberian interior elite a full two centuries
  before the Barcid political consolidation of the late 3rd century
  BCE. The Iberian elite class that received and grave-deposited
  the Lady was engaging Phoenician luxury production as
  status-marking material — not as Carthaginian provincial subjects
  (Carthage did not yet rule them) but as participants in a
  broader Mediterranean-elite cultural circuit.

  The artifact is foundational evidence for the
  Phoenician-Iberian cultural exchange that the Pozo Moro
  funerary monument later attests at much larger scale, and for
  the structural argument that the Iberian elite milieu the
  Barcids would later draw on was a long-prepared
  Phoenician-cultural substrate rather than a recent Carthaginian
  colonial imposition.
