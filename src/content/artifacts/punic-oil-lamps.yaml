summary_short: >
  The two-spout terracotta oil lamps that are the most-abundant single
  artifact class of the Punic record — an everyday Punic object
  that doubles as the principal chronological marker for many
  unstratified contexts.
summary: >
  Terracotta oil lamps of the distinctive Punic two-spout (bivalve)
  type are the single most-abundant Punic artifact class and one of
  the most useful chronological markers for understanding Punic-period
  occupation across the western Mediterranean. The basic form — a
  shallow circular saucer with two lateral spouts pinched out from
  the rim — emerged from earlier Phoenician lamp prototypes in the
  7th century BCE, was substantially codified at Carthage by the
  5th century, and persisted with regional variation through the
  Roman provincial period.

  The artifact's scholarly significance is in two areas:

  - **Daily life evidence.** The lamps are the surviving witnesses
    to one of the most basic facts of Punic domestic life: how
    Punic households lit their interior spaces. The two-spout
    design produced a brighter and more stable light than the
    single-spout Greek alternatives of the same period and
    represents a small but real example of Punic technical
    innovation in everyday material culture. The lamps appear in
    domestic, funerary, sanctuary, and public-administrative
    contexts, making them a window onto every register of
    Punic society from elite households to slave quarters.

  - **Chronological-archaeological tool.** Punic lamps evolved
    systematically across centuries — fabric color, body proportions,
    spout shape, and decorative treatment all shifted in datable
    ways — and the resulting typological sequence is one of the
    principal dating tools for Punic-period contexts that lack
    other diagnostic finds. A site that produces only Punic lamp
    fragments can usually be dated to within a 50-100 year window
    on the typological evidence alone, making the lamps load-bearing
    for the chronological framework of the Punic-cultural
    archaeology generally.

  The find distribution maps essentially the entire Punic-cultural
  sphere. The Carthage National Museum's collection includes
  thousands of examples; Sardinian sites have produced comparable
  numbers; Punic Sicily, Punic Iberia, and the broader North
  African coast all contribute substantially. The form's
  persistence into the Roman provincial period — with Punic
  workshops continuing to produce variant two-spout lamps for
  Romanized markets through the early imperial centuries — is
  one of the principal archaeological signatures of Punic-cultural
  continuity beyond the political end of the Punic states.
