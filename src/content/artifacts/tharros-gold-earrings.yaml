summary_short: >
  Phoenician gold earrings from the Tharros necropolis (7th-6th
  century BCE) with characteristic granulation and Egyptianizing
  iconography. Representative of the Sardinian Phoenician
  luxury-jewelry tradition.
summary: >
  Phoenician gold jewelry from the Tharros necropolis on Sardinia
  is one of the most distinctive western-Mediterranean Phoenician
  craft traditions and the principal physical evidence for the
  elite-luxury production of the western Phoenician colonial sphere.
  The British Museum's Tharros gold corpus, of which the example
  shown is a representative pair of earrings, was recovered during
  19th-century antiquarian excavations of the Phoenician-period
  tombs at the site.

  The two earrings shown demonstrate the corpus's stylistic
  range. The chrysalis-form pendant uses granulation, the
  application of tiny gold spheres to the surface in patterned
  arrangements, to produce a textured surface that contrasts
  with the smooth pendant body. The double-hawk-head earring
  borrows directly from Egyptian iconographic vocabulary,
  rendering the hieroglyphic Horus-falcon as a paired motif with
  granulated detail imitating "the broad collar of the goddess
  Hathor" (per the British Museum's identification). The
  combination of Phoenician technical execution with
  Egyptianizing iconographic content is typical of the broader
  corpus.

  The granulation technique is the Tharros corpus's principal
  technical signature. Phoenician goldsmiths had developed
  granulation to remarkable refinement by the 7th century BCE,
  producing surface textures and pattern arrangements that
  subsequent Mediterranean jewelry traditions (Etruscan,
  Hellenistic Greek, early Italic) drew on directly. The Tharros
  finds are one of the principal data sets for understanding
  Phoenician granulation specifically and Iron Age Mediterranean
  goldsmithing more broadly.

  The find context is the broader Phoenician colonial
  presence at Tharros from approximately the 8th century BCE
  through the Punic period. The Phoenician colonial necropolis
  produced the bulk of the gold finds; the corpus represents
  elite-burial deposits indicating both the wealth of the
  colonial population and the active workshop tradition operating
  on Sardinia rather than just importing from the eastern
  Mediterranean. Tharros gold complements the Carthage Tophet
  stelae, the Tharros Tophet stelae, and the Sardinian Punic
  glass corpus as the principal physical evidence for the
  western-Mediterranean Phoenician-cultural diaspora's material
  signature.
