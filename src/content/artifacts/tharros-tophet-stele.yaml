summary_short: >
  A votive stele from the Tophet at Tharros, Sardinia, representing the
  Punic-cultural diaspora across Sardinia and the variant local
  iconographies (here, an aniconic betyl-in-shrine) that supplemented
  the Carthage-Tophet Sign-of-Tanit tradition.
summary: >
  The Tharros stele is included as a representative example of the
  Sardinian Punic stele tradition — a regional variant of the
  Tophet-stele practice that originated at Carthage but developed
  distinctive local iconography across the western Mediterranean
  Punic-cultural sphere. The Sardinian Tophet sites (Tharros,
  Sulci/Sant'Antioco, Monte Sirai, Bithia, and others) together
  constitute one of the principal corpora of Punic religious
  inscription outside Carthage itself.

  The example shown here is iconographically distinctive: the central
  motif is a *betyl*, a sacred stone or pillar representing the
  divine presence in aniconic form, set within a small carved
  architectural shrine with columns and a pediment. The
  betyl-in-shrine motif is characteristic of Sardinian Tophet
  iconography in particular; the Carthage-Tophet stelae
  predominantly use the Sign of Tanit and figural-anthropomorph
  motifs, while the Sardinian sites favor the more abstract
  aniconic-divine treatment. Both traditions coexist on different
  stelae at the same sites; the regional preference is statistical
  rather than absolute.

  As a methodological point: the Tharros Tophet (and the broader
  Sardinian corpus) is essential for understanding Tophet practice
  as a *Punic-cultural* phenomenon rather than a strictly
  Carthaginian one. The classical sources almost exclusively
  describe Carthage's Tophet because Carthage is what the
  Greek and Roman authors cared about; the archaeological record
  shows the practice was continuous across the western
  Mediterranean Punic-cultural sphere with significant local
  variation in iconography, scale, and (probably) ritual
  emphasis. The Tharros corpus is one of the principal data
  sources for that broader picture.

  The Tharros site itself was occupied from the 8th century BCE
  through the early Roman imperial period, with Punic-period
  occupation principally 6th-2nd centuries BCE. The Tophet
  sanctuary sat on the southern margin of the urban core, in a
  position structurally similar to the Carthage Tophet's location
  on the city's southern edge — a recurring spatial pattern in
  Punic urban planning that the Sardinian sites help establish as
  more than a Carthage-specific accident of geography.
