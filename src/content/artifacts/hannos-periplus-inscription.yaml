summary_short: >
  An inscription from the temple of Baal Hammon at Carthage recording
  Hanno the Navigator's Atlantic voyage, c. 5th century BCE. The Punic
  original is lost; the text survives only via a Greek translation
  preserved in a 9th-century medieval manuscript at Heidelberg. An
  unusually clean case study in how Punic literature reaches us at all.
summary: >
  An exceptional artifact in two senses: the surviving text is the
  closest thing we have to a substantive specimen of Punic literature,
  and the artifact's transmission history is itself a clean case study
  in how Punic written culture reaches modern scholarship — almost
  always through Greco-Roman intermediation rather than from preserved
  Punic-language documents.

  The original was a Punic-language inscription mounted in the temple
  of Baal Hammon at Carthage, recording the voyage of Hanno (the
  "Navigator," a member of the Magonid family) along the Atlantic
  coast of West Africa, conventionally dated to the early-to-mid 5th
  century BCE. The voyage extended from the Pillars of Heracles
  (Strait of Gibraltar) southward; modern interpretations of how far
  the expedition reached vary from coastal Morocco at the conservative
  end to the Gulf of Guinea at the maximalist end. The inscription was
  evidently substantial — the surviving Greek translation runs to
  some 101 lines and includes geographical, ethnographic, and ritual
  detail.

  The Punic original was almost certainly destroyed in the Roman
  sack of Carthage in 146 BCE, along with the temple it was mounted
  in. The Greek translation (made at an unknown but plausibly
  pre-146-BCE date, possibly in the Hellenistic period when
  Greek-language interest in Carthaginian literature was at its
  height) survived via the manuscript tradition. The principal
  surviving witness is the 9th-century Heidelberg Codex Palatinus
  Graecus 398 (Heidelberg Universitätsbibliothek), one of the
  principal repositories of ancient Greek geographical and
  paradoxographical miscellany. A 14th-century copy provides
  collateral text-critical support.

  The reliability of the surviving Greek translation is contested.
  The text contains internal contradictions and obvious errors;
  some episodes (notably the encounter with the "Gorillai"
  hairy people, of whom three captured females were skinned and
  the skins displayed in the temple of Tanit until 146 BCE) read
  as ethnographic exoticism rather than expeditionary report.
  But the basic outline (Atlantic coastal voyage, foundation of
  trading settlements, return) is consistent enough with what
  Phoenician-Punic Atlantic commerce required to be plausible.

  As a methodological point: this is what the Carthaginian written
  record looks like when it does survive. A single text reaches us
  through Greek translation, medieval manuscript tradition, and
  late-antique geographical compilation — three layers of mediation
  before it touches modern scholarship at all. The Punic
  literary tradition was certainly substantial in its own time;
  what we have is the small fraction that was translated, copied,
  and re-copied for reasons unrelated to the priorities of Punic
  culture itself.

  *(Note: no image accompanies this entry. The Punic original is
  lost; the surviving Greek-language manuscript is medieval rather
  than ancient, and the question of "what does the artifact look
  like" doesn't have a meaningful answer for this particular
  case. The artifact is the text and its transmission rather than
  any preserved physical object.)*
