  notes: >
    The Barcid Iberian coinage tradition begins c. 237 BCE with
    Hamilcar Barca's establishment of independent silver minting in
    Iberia, and runs through the Roman capture of Carthago Nova in
    209 BCE. The post-209 BCE Iberian Punic mints continued under
    Roman administrative oversight in attenuated form.
current_location: Major collections at the British Museum, the Bibliothèque nationale de France, the National Archaeological Museum of Spain, and numerous private and museum collections internationally
find_context:
  site: principally Carthago Nova (modern Cartagena) and other Punic Iberian mint cities; coin finds across the western Mediterranean trade network
  circumstances: >
    Barcid Iberian silver entered the wider Mediterranean economy via
    Carthaginian military pay, trade, and the disposal of the Iberian
    silver-mining surplus that the Barcids established as the
    fiscal foundation of the post-First-Punic-War Carthaginian state.
    Coin finds therefore turn up across the Carthaginian operational
    sphere as well as in original-issue contexts in Iberia.
