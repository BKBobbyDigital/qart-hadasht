summary_short: >
  Marble sarcophagi with carved anthropomorphic lids representing the
  deceased: the principal high-status Carthaginian elite burial form,
  c. 5th-3rd centuries BCE. The "Sarcophagus of the Winged Priestess"
  shown is one of the most-discussed individual examples.
summary: >
  The class of marble sarcophagi with carved anthropomorphic lids that
  served as the principal high-status burial form in late-Punic
  Carthage. Each surviving example shows the deceased rendered as a
  carved figure on the lid: typically lying flat, with the upper
  body, hands, and face in raised relief, sometimes with extended
  iconographic content (wings on the figure shown here, attributes of
  rank or office, religious symbols).

  The tradition descends from Egyptian and earlier Phoenician
  precedents: anthropomorphic stone coffins were a Levantine
  practice attested at Sidon (the Eshmunazar sarcophagus is the
  best-known case) and elsewhere from the 6th century BCE forward.
  The Carthaginian adoption simplified the form (less elaborate
  Egyptian anthropomorphism, more Greek-influenced figural
  treatment of face and drapery) and focused it on the elite-burial
  context: the Carthaginian sarcophagi were not used for royalty (as
  the Sidonian examples were) but for civic-elite individuals,
  probably including suffetes, senatorial-rank figures, and senior
  priestly officeholders.

  The "Sarcophagus of the Winged Priestess", the example shown
  here, is one of the most-discussed individual artifacts of the
  Punic record. The figure on the lid is rendered with elaborate
  feathered wings extending from her arms, a treatment with no
  obvious Greek or Egyptian iconographic parallel and probably
  representing a specifically Punic priestly or divine identity.
  Whether the figure is a deity (Tanit? Astarte?), a priestess of
  one of those goddesses, or a deceased aristocratic woman
  represented in priestly attribute is contested. The surviving
  inscription on the sarcophagus, like most Punic sarcophagus
  inscriptions, is a brief dedicatory formula that does not
  resolve the question.

  The corpus as a whole is a primary source for late-Punic elite
  identity formation: the Greek-derived stylistic vocabulary, the
  Egyptian-derived form, the specifically Punic iconographic
  programs, and the absence of strict royal-portrait tradition
  together suggest a Carthaginian aristocratic culture engaging
  Mediterranean visual idioms while maintaining a distinct
  Punic-religious orientation. The sarcophagi sit alongside the
  Tophet stelae and the few preserved temple installations as the
  principal architectural-sculptural body of evidence for what
  Punic elite-cultural visual identity actually looked like.
