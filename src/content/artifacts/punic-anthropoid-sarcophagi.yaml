slug: punic-anthropoid-sarcophagi
name_display: Punic Anthropoid Sarcophagi
name_alt:
  punic: anthropomorphic stone sarcophagi of Punic North Africa and Sardinia
type: sarcophagus
material: white marble (predominant for the elite Carthaginian examples); local limestone for less elite versions
dimensions: 'typical adult-size: c. 2 m long, with the carved face and upper body in raised relief on the lid'
date_made:
  value: -400
  precision: century
  circa: true
  range_end: -200
  notes: >
    The Punic anthropoid tradition spans approximately the 5th-3rd
    centuries BCE, with peak frequency in the 4th and early-3rd
    centuries. The form descends from Egyptian and Levantine
    Phoenician precedents and was adopted at Carthage and other Punic
    sites in adapted form.
current_location: principal collections at the Carthage National Museum, the Bardo (Tunis), the Louvre, and various Sardinian and Italian museums
find_context:
  site: Carthaginian elite necropoleis (Sainte-Monique, Bordj-el-Jedid, Douimès, and others); Sardinian Punic sites; some smaller examples from Motya and other Sicilian sites
  circumstances: >
    Recovered principally from elite chamber-tomb contexts in the
    Carthaginian necropoleis through the late-19th and early-20th
    century French excavations (Delattre, Gauckler, Merlin), with
    additional finds across the Punic-cultural diaspora. The
    sarcophagi are the principal form of high-status Carthaginian
    elite burial in the late-Punic period.
dating_method: stylistic
interpretation_status: attested
