summary: >
  Coastal town on the north coast of Sicily and site of the
  first major Roman naval victory in 260 BCE. The engagement was
  fought in the waters offshore between the Carthaginian fleet
  under Hannibal Gisco (a different Hannibal from the Magonid of
  410 or the Barcid of the Second Punic War) and the new Roman
  fleet under the consul Gaius Duilius. The Roman victory,
  enabled by the *corvus* boarding bridge first deployed at
  scale here, established that the Roman naval improvisation of
  the late 260s BCE could match Carthaginian naval superiority
  in fleet engagement. The site is unremarkable archaeologically;
  its significance is entirely the engagement.
