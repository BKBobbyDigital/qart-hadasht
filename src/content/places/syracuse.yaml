summary: >
  The principal Greek city of Sicily, founded as a Corinthian
  colony in 734 BCE and developed by the 5th and 4th centuries
  BCE into one of the largest cities of the Mediterranean. The
  city's role as the principal Greek-Sicilian counterweight to
  Carthaginian power runs through the entire pre-Roman scope
  of this encyclopedia: from the 5th-century victory at Himera
  through the four wars of Dionysius, the audacious African
  invasion of Agathocles, and the long Hieronian alignment
  with Rome that turned the city against Carthaginian interests
  permanently in the early 3rd century BCE.


  ## Geography and urban setting


  Syracuse occupies an exceptional natural-defensive position
  on the southeastern coast of Sicily, with the original
  Corinthian foundation on the small island of Ortygia
  (approximately 1 kilometer long) and subsequent expansion
  onto the Sicilian mainland through five connected urban
  districts: Achradina, Tyche, Neapolis, Epipolae, and the
  Athenagora suburb. The site combined an excellent harbor
  (the Great Harbor on the southern side of Ortygia, one of
  the most strategically valuable in the Mediterranean), a
  defensible inland approach (the steep limestone plateau of
  Epipolae rising approximately 100 meters above the
  surrounding plain), and access to substantial agricultural
  hinterland.


  At its peak in the 5th-3rd centuries BCE, Syracuse was
  among the largest cities of the Greek world, comparable in
  scale to Athens and approaching the scale of contemporary
  Carthage. Population estimates range from 100,000 to
  300,000 across modern reconstructions.


  ## The classical period (5th-4th centuries BCE)


  Syracuse's emergence as a major Mediterranean power
  developed through the 6th and 5th centuries BCE under a
  succession of tyrannical regimes. The principal moments:


  **The Deinomenid tyranny (485-466 BCE).** Gelon, transferred
  to Syracuse from Gela in approximately 485 BCE, consolidated
  the city through forced relocations and territorial
  acquisitions; his victory at the Battle of Himera in 480 BCE
  established Syracuse as the principal Greek-Sicilian power.
  Hieron I's reign (478-466) extended the city's influence
  through naval operations and dynastic diplomacy.


  **The Athenian expedition (415-413 BCE).** Athenian invasion
  during the Peloponnesian War produced one of the most
  consequential sieges of classical Greek history. The
  Syracusan defeat of the Athenian expedition in 413 BCE
  destroyed the Athenian field army and substantially shifted
  the Peloponnesian War's outcome.


  **The Carthaginian invasion (410-404 BCE).** Hannibal son
  of Gisco's Magonid invasion sacked Selinus and Himera in
  409 BCE; the political crisis produced Dionysius I's rise
  to power in 405 BCE. Dionysius's subsequent four wars with
  Carthage (398-367 BCE) established the long pattern of
  Greek-Sicilian-Carthaginian contestation that would persist
  through the Hellenistic period.


  ## The Agathocles period (317-289 BCE)


  Agathocles's tyranny at Syracuse from 317 BCE through his
  death in 289 BCE is treated separately on this site through
  his biographical entry. The city's role: principal Greek-
  Sicilian power; base for the audacious African invasion of
  310-307 BCE that nearly reshaped the Mediterranean
  political-strategic geography; participant in the
  succession of Sicilian wars of the late 4th century BCE.


  ## The Hieronian alignment with Rome (270-215 BCE)


  Hiero II's long reign (approximately 270-215 BCE) produced
  the structural alignment of Syracuse with Rome that defined
  the city's role in the First and early Second Punic Wars.
  The alignment began in 263 BCE during the First Punic War,
  shifted Syracuse from Carthaginian to Roman alliance, and
  persisted through Hiero's death — a 50-year period of
  unusually stable client-relationship between the two
  cities. Hiero's patronage of Archimedes and his substantial
  building program at Syracuse made the city one of the
  cultural-architectural centers of the Hellenistic
  Mediterranean during this period.


  Hiero's grandson Hieronymus, succeeding in 215 BCE during
  the Second Punic War, reversed the alignment toward
  Carthage. The brief tyranny ended in his assassination in
  214 BCE; the resulting political crisis produced the
  Carthaginian-aligned regime of Hippocrates and Epicydes
  that controlled Syracuse during the Roman siege of 213-211
  BCE.


  ## The Roman siege and conquest (213-211 BCE)


  The Roman siege under Marcus Claudius Marcellus, treated
  separately on this site as a dedicated event entry, ended
  the city's independent political existence. The siege's
  duration (substantially prolonged by Archimedes's defensive
  engineering) was nearly two years; the eventual Roman
  storming and sack produced both the death of Archimedes
  and the substantial transfer of Greek artistic treasure to
  Rome that the Roman cultural-political tradition treated
  as a moral turning point in Roman cultural history.


  Post-211 BCE Syracuse functioned as the principal Roman
  administrative center for the province of Sicily. The
  city's archaeological remains preserve substantial classical
  Greek, Hellenistic, and Roman strata; the Greek theater
  (one of the largest in the Mediterranean) and the
  Archaeological Park of Neapolis are among the most
  substantial Greek archaeological sites preserved.


  ## Sources


  Syracuse is preserved across the substantial classical
  Greek tradition: Thucydides for the Athenian expedition;
  Diodorus Siculus across books 11-23 for the broader
  Greek-Sicilian history; Plutarch's *Lives* of Dion,
  Timoleon, and Marcellus for various periods; the
  archaeological record of the site itself. The standard
  modern English-language coverage is in Finley's *Ancient
  Sicily* (2nd ed. 1979) and the more recent scholarship on
  Hellenistic Syracuse and on the Roman conquest.
