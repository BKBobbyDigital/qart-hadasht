summary: >
  The principal river of central Iberia, draining the central
  meseta west to the Atlantic. The site of the Battle of the
  Tagus in summer 220 BCE: Hannibal Barca's defeat of a
  combined Carpetani-Vaccaei-Olcadian coalition (numbering
  some 100,000 in Polybius's report, though that figure is
  the standard ancient-sources caveat) on the river's southern
  bank. The engagement is the single clearest pre-Italian
  demonstration of Hannibal's command competence: the use of
  the river itself as a tactical instrument, the elephant
  corps as a screening element, and the Numidian cavalry as
  the envelopment arm. The battle eliminated the principal
  organized Iberian opposition to Carthaginian expansion in
  the central peninsula and consolidated Carthaginian control
  of the southern half of Iberia, freeing Hannibal to turn to
  Saguntum the following year.
