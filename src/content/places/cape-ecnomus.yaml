  notes: >
    The naval engagement was fought in the open waters off Cape
    Ecnomus on the south coast of Sicily, with Roman forces moving
    south toward Africa and Carthaginian forces stationed to
    intercept. The exact site of the engagement within these
    waters is not precisely identified in the surviving sources.
modern_location: South coast of Sicily near modern Licata, Province of Agrigento, Italy
summary: >
  Promontory on the south coast of Sicily near modern Licata, the
  geographic reference for the largest naval engagement of
  classical antiquity. The Cape itself was a coastal landmark; the
  battle was fought in the surrounding waters as the Roman fleet
  under Atilius Regulus and Manlius Vulso moved south from Sicily
  toward the African coast and was intercepted by the Carthaginian
  fleet under Hamilcar and Hanno. The Cape gave the engagement its
  name in Greek and Latin sources but was not itself the site of
  fighting.
