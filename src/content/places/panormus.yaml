summary: >
  The principal Carthaginian city of northwestern Sicily, built around
  one of the finest natural harbors on the island. The Greek name
  Panormos means "all-harbor", a fair description of the deep bay that
  made the place; the Carthaginians called it Ziz, "flower", after the
  fertile plain, the Conca d'Oro, behind it. The name survives on the
  Siculo-Punic coinage minted here, some of the most abundant Punic
  coinage from Sicily.

  Panormus was one of the anchor-strongholds of Punic Sicily, ranking
  with [Lilybaeum](/places/lilybaeum) and Drepana as a base of
  Carthaginian naval and military power in the west of the island. Its
  Phoenician occupation reached back to roughly the 7th century BCE,
  and through the long Sicilian wars with the Greeks it stayed firmly
  in the Carthaginian sphere while cities to its east changed hands.

  Its fortunes turned in the First Punic War. Rome stormed and took
  Panormus in 254 BCE, converting Carthage's chief northwestern base
  into the Roman staging point for the region. In 250 the Carthaginians
  moved to retake it, and the attempt ended in the
  [Battle of Panormus](/events/battle-of-panormus), where the proconsul
  Caecilius Metellus broke a large Carthaginian force by destroying its
  war elephants outside the walls. The victory restored Roman morale
  after the disaster in Africa and cleared the way for the long
  [siege of Lilybaeum](/events/siege-of-lilybaeum) that would decide the
  war's Sicilian endgame. Under Rome, Panormus remained the leading city
  of the northwest, and the Punic layers of Palermo are among the
  fuller records of a western Sicilian Punic town.
