summary: >
  The oldest of the principal Phoenician metropolitan cities, on
  the Levantine coast approximately 40 kilometers north of modern
  Beirut. Byblos's commercial-cultural prominence in the early
  Iron Age preceded the rise of [Tyre](/places/tyre) and
  [Sidon](/places/sidon) as the dominant Phoenician metropolises;
  by the period of the principal Phoenician western colonial
  foundations (9th-8th centuries BCE) Byblos's relative
  prominence had declined, but the city's cultural-religious
  status as one of the foundational Phoenician centers persisted.

  Byblos's principal contributions to the Phoenician-Punic
  cultural inheritance are two: the
  [Ahiram Sarcophagus](/artifacts/ahiram-sarcophagus) (c. 1000
  BCE), which bears the earliest substantial fully-developed
  Phoenician-alphabet inscription anywhere and is the load-bearing
  evidence for the alphabet's emergence in approximately the
  form Carthaginian Punic subsequently inherited; and the cult
  of Baalat Gebal ("Lady of Byblos"), one of the principal
  Levantine goddess cults whose iconographic and ritual elements
  influenced the broader Phoenician-Punic goddess traditions
  (Astarte; subsequently Tanit at Carthage).

  The site treats the broader Phoenician metropolitan-colonial
  system at the
  [Phoenician colonial network theme](/themes/phoenician-colonial-network).
  Byblos's specific role is more cultural-foundational than
  directly colonial: the alphabet that the Tyrian and Sidonian
  network spread west was substantively the Byblos-developed
  Phoenician alphabet of the early 1st millennium BCE.

  Modern Jbeil preserves substantial Phoenician-period
  archaeology including the temple of Baalat Gebal, the royal
  necropolis, and the city walls; the site has been
  continuously excavated since the 1920s. The principal modern
  reference is Aubet's *The Phoenicians and the West* (2nd ed.
  2001) for the network and metropolitan-system context.
