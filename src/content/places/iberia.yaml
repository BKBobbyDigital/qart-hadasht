summary: >
  The Iberian peninsula, the principal western extent of
  Phoenician-Punic and subsequently Carthaginian commercial and
  political activity from the 8th century BCE through 206 BCE.
  Phoenician colonial foundations along the Mediterranean and
  Atlantic coasts (Gades, Malaca, Sexi, Abdera, Carteia) had
  established Phoenician commercial presence from the 9th-8th
  centuries; Carthaginian political control developed
  substantially under Hamilcar Barca's conquest from 237 BCE
  onward, was expanded under Hasdrubal the Fair (228-221 BCE)
  with the foundation of Carthago Nova (modern Cartagena), and
  reached its peak under Hannibal in the 220s BCE before the
  Second Punic War. Roman conquest under Scipio Africanus in
  210-206 BCE ended the Carthaginian position; Iberia became
  the Roman provinces of Hispania Citerior and Hispania Ulterior
  and one of the principal Roman silver-mining regions for
  centuries afterward.
