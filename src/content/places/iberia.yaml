summary: >
  The Iberian peninsula, the principal western extent of
  Phoenician-Punic and subsequently Carthaginian commercial
  and political activity from the 8th century BCE through 206
  BCE. Iberia's role in this encyclopedia is structural: the
  silver of the southern peninsula funded the Barcid
  reconstruction of Carthaginian power after 237 BCE; the
  Carthaginian-Iberian alliance network that Hasdrubal the
  Fair built was the political base of Hannibal's Italian
  campaign; the Roman conquest under Scipio Africanus in
  210-206 BCE ended Carthaginian power in the peninsula and
  produced the strategic conditions for the African expedition
  that would end the Second Punic War.


  ## Geography


  The Iberian peninsula occupies approximately 580,000 km² of
  southwestern Europe, with the Pyrenees mountains as its
  northeastern boundary and the Strait of Gibraltar as the
  southern crossing to North Africa. Its varied terrain
  produced distinct regional cultures across the pre-Roman
  period: the Mediterranean-coastal zones (the principal site
  of Phoenician-Punic activity), the Atlantic-coastal zones
  (Tartessian and post-Tartessian Iberian cultures), the
  central plateau (Celtiberian populations), the
  northwestern mountains (the Lusitanians and other Atlantic-
  facing groups), and the Cantabrian-northern coast (the
  Cantabrian and Asturian populations that would not be
  fully integrated under Roman authority until Augustus).


  ## The Phoenician colonial network (9th-6th centuries BCE)


  Phoenician colonial settlement of the Iberian peninsula
  began in the 9th century BCE with the foundation of Gades
  (modern Cádiz) on the Atlantic coast just west of Gibraltar.
  Subsequent Phoenician foundations along the Mediterranean
  southern coast included Malaca (modern Málaga), Sexi
  (modern Almuñécar), Abdera (modern Adra), and Carteia.
  The network was substantially Tyrian in origin and
  oriented toward two principal economic activities: the
  silver-mining wealth of the southern peninsula (especially
  the Tartessian zone around modern Huelva) and the Atlantic
  trade routes that reached as far as the British tin
  sources.


  The Tartessian civilization of the lower Guadalquivir valley
  (8th-6th centuries BCE) was the principal pre-Carthaginian
  political-cultural development of southern Iberia. Tartessos
  produced substantial silver-mining infrastructure, distinct
  artistic traditions (the Carambolo treasure and other
  recovered material), and political-economic relationships
  with the Phoenician colonial network that the surviving
  record preserves imperfectly. The Tartessian decline through
  the 6th century BCE coincided with substantial shifts in
  the broader Phoenician-Punic Mediterranean position.


  ## Carthaginian Iberia (237-206 BCE)


  The Carthaginian conquest of southern Iberia began with
  Hamilcar Barca's invasion in 237 BCE and proceeded across
  three principal phases:


  - **Hamilcar's military conquest (237-228 BCE).** Treated
    separately on the site as a dedicated event entry. The
    nine-year campaign produced Carthaginian conquest of
    substantial portions of southern and central Iberia,
    with particular success against the Iberian tribes of the
    southwestern peninsula and the Tartessian-Phoenician
    coastal zone.

  - **Hasdrubal the Fair's consolidation (228-221 BCE).**
    Treated separately on the site. The seven-year command
    produced Carthago Nova as the new Iberian capital, the
    dynastic-political integration that established the
    Iberian-Carthaginian alliance network, and the Ebro
    Treaty of 226 BCE that defined the diplomatic framework
    against Rome.

  - **Hannibal's command (221-218 BCE).** The pre-war command
    period during which Hannibal consolidated his political
    position, conducted operations against the Olcades and
    Vaccaei, and made the strategic decision to besiege
    Saguntum that produced the Second Punic War.


  The Carthaginian Iberian state at its peak (218 BCE)
  controlled approximately the southeastern third of the
  peninsula directly, with substantial alliance-network
  influence over central and western Iberian populations.
  The fiscal scale was substantial: Iberian silver-mining
  revenue financed Carthaginian state operations across the
  Mediterranean, with the Treaty of 201 indemnity (paid down
  ahead of schedule across the 190s BCE) substantially
  drawing on Iberian silver reserves accumulated during this
  period.


  ## The Iberian peoples


  The peoples of pre-Roman Iberia were not a single
  ethnic-cultural group but a diverse collection of
  populations with distinct languages, political institutions,
  and material cultures. Modern scholarship recognizes
  several principal groupings:


  - **The Iberians proper.** Mediterranean-coastal and
    south-central populations, with substantial cultural
    overlap with Phoenician-Punic colonial influence. The
    Iberian language (preserved partially in the Iberian
    script) is not Indo-European and remains imperfectly
    decoded.

  - **The Celtiberians.** Central-plateau populations of
    Celtic-speaking origin, with material culture combining
    Celtic and Mediterranean elements. The Celtiberian wars
    against Rome through the 2nd century BCE (culminating in
    Numantia in 133 BCE under Scipio Aemilianus) are the
    principal post-Carthaginian phase of Iberian-Roman
    contestation.

  - **The Lusitanians.** Atlantic-western populations
    (modern Portugal and western Spain) with distinct
    political-cultural tradition. The Lusitanian war against
    Rome under Viriathus in the mid-2nd century BCE is the
    principal preserved episode of Lusitanian resistance.

  - **The Vaccaei, Vettones, Olcades, and other central-
    Iberian populations.** Substantial peoples whose specific
    political-cultural patterns are preserved imperfectly.


  The Carthaginian-Iberian relationship under Hasdrubal the
  Fair's dynastic-integration strategy produced substantial
  political-cultural fusion in the southern peninsula. The
  Iberian-Carthaginian elite of the late 3rd century BCE was
  bicultural — Punic-speaking and Iberian-speaking; producing
  art and material culture combining both traditions; serving
  as the political class of the Carthaginian Iberian state.


  ## The Roman conquest (218-206 BCE)


  Roman operations in Iberia began with the elder Scipios
  (Publius and Gnaeus Cornelius Scipio) from 218 BCE and
  continued through the elder Scipios' deaths in the
  Carthaginian counter-offensive of 211 BCE, the future
  Africanus's special command from 210 BCE, the capture of
  Carthago Nova in 209 BCE, and the eventual Roman victory
  at Ilipa in 206 BCE that ended Carthaginian power in the
  peninsula. The Roman conquest of the peninsula's interior
  (Celtiberian, Lusitanian, and northern populations) would
  continue through the 2nd century BCE and into the
  Augustan period.


  Roman Iberia became the provinces of Hispania Citerior and
  Hispania Ulterior; the silver-mining infrastructure the
  Carthaginian period had developed continued under Roman
  exploitation through the imperial period and produced
  substantial revenue for Roman state operations across the
  Mediterranean.


  ## Sources


  Iberia is preserved across multiple traditions: Polybius
  for the Carthaginian-Roman period (Books 2-3, 10-11);
  Livy for the Iberian campaign of the Second Punic War
  (Books 21-29); Strabo's *Geography* (Book 3) for the
  broader peninsula's geography and ethnography; the
  substantial archaeological record of the Phoenician-Punic
  and Iberian sites. Modern scholarship is in Aubet's *The
  Phoenicians and the West* (2nd ed. 2001) for the
  Phoenician-colonial period; Curchin's *Roman Spain* (1991)
  and the broader specialist literature for the conquest and
  Roman period.
