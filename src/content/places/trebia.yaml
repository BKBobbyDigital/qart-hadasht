summary: >
  Site of Hannibal's first major Italian victory over a Roman
  consular army on a cold December morning in 218 BCE. The
  battlefield was the western bank of the Trebia (Trebbia)
  river, a tributary of the Po, near the recently founded Roman
  colony of Placentia (modern Piacenza). Hannibal had arrived in
  the Po Valley after the Alpine crossing earlier in the autumn
  and had won a preliminary cavalry engagement at the Ticinus.
  The Trebia itself was a deliberate Carthaginian engagement of
  the Roman field army on terms favoring Carthaginian tactical
  preparation, including a concealed reserve under Mago Barca.
