summary: >
  The Carthaginian harbors: an outer rectangular harbor for merchant
  shipping and behind it a circular naval harbor with a central island,
  on the southern side of the ancient city. They are the most visible
  Punic monument at Carthage today.

  Appian's description, written for the siege of 149–146 and probably
  drawn from Polybius, gives the inner harbor ship-sheds for 220 vessels
  around the basin and the island, an admiral's house on the island that
  overlooked harbor and sea, and walls that hid the docks from anyone
  approaching (*Punica* 96). A British excavation in the 1970s, part of
  the international campaign to save Carthage, found the radiating stone
  ramps of the sheds and dated the island and the stone sheds to the
  late third or early second century BCE. The remains suggest room for
  about 170 ships rather than 220 (see the
  [artifact entry](/artifacts/carthage-cothon) and the
  [claim on the harbor](/claims/cothon-architectural-distinctiveness)).

  That date changes what the harbor can be evidence for. In this form
  it did not house the fleets of the First Punic War or most of the
  Second, whose harbor has not been securely identified. It belongs
  instead to the prosperous half-century after 201, when the treaty
  limited Carthage to ten warships. The sheds, built to haul out oared
  warships and set apart from the merchant harbor, were naval, and a
  work on this scale could not have escaped the Roman commissions that
  visited the city. On the site's reading Rome knew of it and let it
  stand while Carthage was a useful ally, until the recovery itself
  came to look like rearmament (see the
  [take on the destruction](/editorialTakes/destruction-not-weak-enough);
  Richard Miles reads it instead as a tolerated merchant fleet). The
  harbor was also a large public investment, and in 147 it was the scene of the last Carthaginian naval
  effort, when a fleet built in secret sailed out through a newly cut
  channel (Appian *Punica* 121).

  Kothon was a Greek word for such artificial basins. Motya had a basin
  long given the name, now also read as a sacred pool; how far
  Carthage's harbor followed a Phoenician form is open. The basins were
  reused and remodeled in Roman Carthage, and their outlines survive in
  the modern townscape.
