summary: >
  The Carthaginian military and commercial harbors: one of
  the most distinctive surviving features of the Carthaginian
  urban-architectural record and the principal infrastructural
  basis of the city's naval-commercial dominance through the
  Punic period. Two interconnected harbors were built into
  the city's southern coast: an outer rectangular commercial
  harbor for merchant traffic, and behind it a circular
  military harbor with a central island for the admiralty
  building, surrounded by ship-shed berths along the
  perimeter.

  Appian's description (*Punica* 96) is the principal
  literary source: 220 ship-sheds around the perimeter of
  the circular harbor, an admiralty building on the central
  island commanding view of the entire facility, the inner
  harbor invisible from the open sea. The complex was
  extensively excavated in the 1970s and 1980s by the UNESCO
  "Save Carthage" project; the surviving foundations match
  Appian's description closely enough that modern
  reconstructions of the harbor's original capacity and
  organization are well-supported by the archaeological
  evidence.

  The Cothon's strategic significance was three-fold.
  First, it permitted the Carthaginian fleet to assemble,
  refit, and deploy without external observation, an
  intelligence advantage that mattered substantially
  through the long Roman-Carthaginian wars. Second, the
  ship-shed system provided weather-protected dry-dock
  capacity that allowed maintenance of a fleet of 200+
  warships at near-permanent readiness. Third, the
  geographic configuration (an inner harbor reached only
  through the outer commercial harbor) created defense in
  depth: a hostile fleet that breached the outer harbor
  would face the inner military harbor as a separate
  reduced target.

  The Cothon was destroyed during the 146 BCE Roman sack
  of Carthage. The harbor basins themselves were filled in
  during the Roman-period reconstruction of the site;
  modern archaeology has uncovered the original outlines
  but the complex's full original scale is partly
  reconstructed.

  The Greek term *kothon* (a drinking cup) was applied to
  similar harbor configurations across the Phoenician-
  Punic colonial network: Motya had a harbor of similar
  type, and the term was used for harbor structures at
  Sidon and Tyre. Whether Carthage's harbor was the
  prototype or one variant among several is contested
  in modern scholarship.
