summary: >
  Phoenician city on the Levantine coast, mother city of
  Carthage in the foundation tradition and one of the principal
  Phoenician metropolises of the early Iron Age. Tyre was the
  dominant Phoenician naval and commercial power from
  approximately the 10th to the 6th century BCE, sponsoring
  the network of Phoenician colonial foundations that included
  Gades (modern Cádiz), Lixus on the Atlantic Moroccan coast,
  and Carthage itself.


  ## Geography and the island-mainland configuration


  The original Tyrian settlement occupied a small island off
  the Levantine coast (approximately 1 kilometer offshore),
  with a satellite mainland settlement called Ushu in the
  Phoenician sources or Palaetyrus ("old Tyre") in the Greek.
  The island position gave the city defensive depth: the
  surrounding sea limited siege approaches; the island's
  fortifications were among the most substantial in the
  Levantine world. The island was approximately 60 hectares
  in extent, with the city's harbor on its northern side and
  the principal Melqart sanctuary at its center.


  Alexander the Great's famous siege of Tyre in 332 BCE was
  prosecuted through the construction of a causeway from the
  mainland to the island, allowing siege engines to reach the
  walls from land. The causeway was substantively
  transformative of the site's geography: it produced
  permanent connection between island and mainland, with the
  modern city of Sour now occupying both the original island
  position and the mainland territory.


  ## The Phoenician metropolis (10th-6th centuries BCE)


  Tyre's dominance among the Phoenician cities developed
  through the period 1000-600 BCE. The principal sources of
  the city's commercial-political power were three.


  **The purple-dye industry.** The Tyrian production of murex-
  derived purple dye (the *tekhelet* and *argaman* of biblical
  reference) was the principal high-value Phoenician export
  and gave the cities their Greek name (*phoinikes*, "purple
  people"). The dye industry's structural significance for
  the Mediterranean luxury economy was substantial through
  the Iron Age and into the classical period.


  **The colonial network.** Tyre sponsored or led the
  Phoenician western expansion that produced colonial
  foundations across the Mediterranean: Cyprus (Kition);
  Sardinia (Tharros, Sulcis); Sicily (Motya); North Africa
  (Carthage, Lixus, Utica); Iberia (Gades, Malaga). The
  Tyrian colonial network of the 9th-8th centuries BCE was
  one of the principal cultural-economic transformations of
  the early Iron Age Mediterranean.


  **The Melqart cult.** The Tyrian patron deity Melqart ("king
  of the city") was the religious-cultural focus of the
  Tyrian metropolitan identity. The Melqart sanctuary at
  Tyre was the principal religious center of the broader
  Phoenician world; annual delegations from the colonial
  foundations (including Carthage, persisting for centuries)
  made offerings at the Tyrian sanctuary as the structural
  expression of metropolitan-colonial connection.


  ## The Carthaginian connection


  The Tyrian foundation of Carthage in the late 9th to late
  8th century BCE produced a relationship that persisted
  across centuries beyond the political prominence of either
  city. Carthaginian state delegations made annual offerings
  at the Tyrian Melqart sanctuary well into the Punic Wars
  period; the relationship was treated by both cities as one
  of religious and ancestral continuity rather than mere
  historical origin.


  When Tyre was besieged by Alexander in 332 BCE, the
  Carthaginian government reportedly evacuated some Tyrian
  refugees to Carthage and offered the city ceremonial-
  religious support, though military relief was beyond
  Carthaginian capacity at the period. The post-Alexandrian
  Tyre lost its independent political role; the
  Carthaginian-Tyrian connection persisted as a religious-
  cultural continuity rather than an active diplomatic
  relationship.


  ## Tyre after 332 BCE


  Tyre under Alexandrian and subsequently Seleucid rule
  remained a substantial commercial city but never recovered
  its pre-conquest political prominence. The Phoenician-
  political-cultural tradition Tyre had represented largely
  passed to its colonial offspring (Carthage primarily,
  through to 146 BCE; subsequently the various successor
  Phoenician-influenced communities in the western
  Mediterranean). The Tyrian site itself remained
  continuously inhabited and is preserved archaeologically
  as one of the principal Phoenician sites of the Levantine
  coast.


  The Tyrian metropolitan inheritance from which Carthage
  descended is attested by several principal artifacts. The
  Murex Shells and Tyrian Purple industry — the practice that
  gave "Phoenician" its etymology (Greek *phoinix* =
  "purple-people") — defined Tyrian commercial and cultural
  identity through the 1st millennium BCE. The Ahiram
  Sarcophagus from neighboring Byblos (c. 1000 BCE) bears
  the earliest substantial fully-developed Phoenician-alphabet
  text anywhere — the script Tyrian colonists brought to
  Carthage. The Annual Carthaginian Delegation to Tyre at
  the Melqart sanctuary documents the centuries-long ritual
  tie that maintained the metropolitan-colony relationship.


  ## Sources


  Tyre is preserved across the broader Phoenician-Levantine
  archaeological and inscriptional record, with substantial
  Greek and Latin literary attention (especially around the
  332 BCE siege under Alexander). Modern scholarship is in
  Aubet's *The Phoenicians and the West* (2nd ed. 2001) for
  the colonial-network role, and the broader specialist
  literature on the Phoenician homeland.
