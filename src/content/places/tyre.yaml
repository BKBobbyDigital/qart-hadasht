summary: >
  Phoenician city on the Levantine coast, mother city of Carthage in
  the foundation tradition and one of the principal Phoenician
  metropolises of the early Iron Age. Tyre was the dominant
  Phoenician naval and commercial power from approximately the
  10th to the 6th century BCE, sponsoring the network of
  Phoenician colonial foundations that included Gades (modern
  Cádiz), Lixus on the Atlantic Moroccan coast, and Carthage
  itself. The Carthaginian connection to Tyre persisted across
  centuries: Carthaginian state delegations made annual offerings
  at the Tyrian sanctuary of Melqart well into the Punic Wars
  period, and the relationship was treated by both cities as one
  of religious and ancestral continuity rather than mere
  historical origin. Tyre fell to Alexander the Great after a
  famous siege in 332 BCE and never recovered its independent
  political role.
