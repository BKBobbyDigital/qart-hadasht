summary: >
  Site of the engagement in late June or early July 207 BCE in
  which the consuls Marcus Livius Salinator and Gaius Claudius
  Nero defeated and killed Hasdrubal Barca, ending the
  Carthaginian relief expedition from Iberia and effectively
  deciding the strategic outcome of the Second Punic War. The
  battlefield was the valley of the Metaurus river, a tributary
  flowing east into the Adriatic from the Apennines. The
  engagement is conventionally treated by modern scholarship as
  the moment Hannibal's strategic position in Italy became
  unrecoverable; the famous reception of Hasdrubal's severed
  head by Hannibal in Bruttium (preserved in Livy 27.51) was
  understood by Hannibal himself, in the surviving tradition,
  as the war's structural decision.
