summary: >
  Greek colony on the North African coast east of the Greater
  Syrtis, founded as a Therean settlement c. 631 BCE and
  developed into the principal Greek city of the region
  between Carthaginian Africa and Ptolemaic Egypt. Cyrene's
  role in this encyclopedia is concentrated in the late 4th
  century BCE through Ophellas's alliance with Agathocles
  during the African invasion, but the broader history of the
  city — its long Battiad dynasty, its position as a major
  Mediterranean intellectual center, its complex relationship
  with the Carthaginian Tripolitanian frontier — is more
  substantial than that single episode.


  ## Foundation and the Theran tradition


  Cyrene's foundation tradition is one of the better-preserved
  Greek colonial founding narratives. Herodotus (Book 4,
  150-159) preserves the story: a famine and political crisis
  on the small Aegean island of Thera produced a colonial
  expedition under the leader Battus in approximately 631
  BCE. After initial failed attempts at coastal sites further
  east, the colonists established the city at the inland
  site (approximately 16 km from the coast) on the
  agriculturally productive Cyrenaican plateau (the Jabal
  al-Akhdar, "the Green Mountain").


  The Battiad dynasty that emerged from the foundation ruled
  Cyrene for approximately two centuries through eight
  successive Battus and Arcesilaus rulers (the dynasty's
  alternating regnal-name pattern is one of its more
  distinctive features). The Battiad period produced
  substantial Cyrenaican expansion (the foundation of
  Barca, Apollonia, and other regional Greek cities), the
  development of Cyrenaican silphium-based commerce
  (silphium being a now-extinct medicinal-culinary plant
  that was the Cyrenaican economic specialty), and
  substantial Greek cultural-political development that
  made Cyrene one of the major Greek colonies of the
  Mediterranean basin.


  ## The Cyrenaican-Carthaginian frontier


  The geographic boundary between Greek-Cyrenaican and
  Carthaginian-Tripolitanian zones along the Greater Syrtis
  produced one of the more distinctive geographical
  arrangements of the ancient Mediterranean. The frontier was
  unmarked in any formal sense (the surrounding terrain — the
  desert hinterland of the Syrtis — provided natural rather
  than constructed boundary), but the political-economic
  separation between the two zones was substantial.


  Sallust (*Jugurthine War* 79) preserves the famous tradition
  of the Carthaginian-Cyrenaean boundary dispute resolved by
  the brothers Philaeni: two Carthaginian envoys agreed to be
  buried alive at the boundary their westward run reached
  before meeting the Cyrenaean envoys' eastward run, in
  exchange for that boundary becoming the formal
  Carthaginian-Cyrenaean frontier. The story is preserved
  with substantial moral framing about Carthaginian patriotism
  and is generally treated as legendary tradition with
  perhaps a historical core in some boundary-marker erection
  episode.


  ## Cyrene under the Ptolemies


  Following Alexander the Great's conquest of Egypt in 332
  BCE, Cyrene came under Ptolemaic political authority. The
  Ptolemaic period through the 3rd century BCE saw Cyrene
  function as a substantial provincial center within the
  Ptolemaic Egyptian state, with continued Greek cultural-
  political development and substantial intellectual
  production.


  Cyrene under the Ptolemies was the home of several major
  Hellenistic intellectual figures: the poet Callimachus
  (whose Cyrenaic origin substantially shaped his
  intellectual formation); the geographer-mathematician
  Eratosthenes (the third Librarian of Alexandria, whose
  measurement of the Earth's circumference is one of the
  great achievements of Hellenistic science); the philosopher
  Aristippus and the Cyrenaic philosophical school he founded
  (a hedonist-eudaimonist tradition that influenced
  subsequent Hellenistic thought).


  Ophellas, the Macedonian officer of Alexander's eastern
  campaigns who governed Cyrene under Ptolemy I from
  approximately 322 BCE through his death in 308 BCE, is the
  Cyrenaican figure of principal importance for this
  encyclopedia. His alliance with Agathocles in 310 BCE and
  the resulting two-month desert march westward to join the
  African invasion are treated separately on the site as
  components of the Agathocles African expedition narrative.


  ## Roman Cyrene (briefly)


  Cyrene passed to Roman administration through bequest in
  96 BCE; the formal Roman provincial organization
  (Cyrenaica, eventually combined with Crete in a single
  province) was established through the 70s and 60s BCE.
  Roman Cyrene through the imperial period continued as a
  substantial provincial center; the city's Greek cultural
  identity persisted through the long imperial period until
  the Arab conquest of the 7th century CE.


  ## The site


  The archaeological site at modern Shahhat, Libya, is one
  of the more substantial preserved Greek colonial sites
  of the Mediterranean basin. UNESCO World Heritage status
  was granted in 1982. Substantial preservation of Greek
  classical and Hellenistic architecture, Roman additions,
  and the famous necropolis with thousands of rock-cut
  tombs gives the site a continuous archaeological record
  from the 7th century BCE through the imperial period.


  ## Sources


  Cyrene is preserved across the substantial Greek-and-
  Hellenistic literary tradition: Herodotus (Book 4) for the
  foundation story; Pindar's Pythian Odes 4 and 5 for the
  Battiad period; Polybius and the surviving Hellenistic
  fragments for the Ptolemaic period; Diodorus Siculus
  (Book 20) for Ophellas's alliance with Agathocles. The
  archaeological record is substantial and continues to be
  worked.
