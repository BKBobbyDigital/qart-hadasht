summary: >
  Greek colony on the North African coast east of the Greater Syrtis,
  founded as a Therean settlement c. 631 BCE and developed into the
  principal Greek city of the region between Carthaginian Africa and
  Ptolemaic Egypt. By the late fourth century BCE Cyrene was within
  the Ptolemaic sphere, governed for a long period by the Macedonian
  officer Ophellas, whose alliance with Agathocles and march westward
  to join the African invasion of 310–307 BCE briefly inserted a
  third Greek power into the conflict between Carthage and Syracuse.
  After Ophellas's murder by Agathocles, Cyrene returned to Ptolemaic
  control and remained outside the Carthaginian-Roman conflict for
  the rest of the period in scope here. Mentioned for context as the
  origin of the army Agathocles absorbed in 308 BCE; not otherwise
  central to Carthaginian history before 146 BCE.
