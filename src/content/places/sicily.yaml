summary: >
  The largest island in the Mediterranean and the principal
  contested territory between Carthage, the Greek cities, and
  (from 264 BCE) Rome for nearly six centuries, from the first
  Phoenician colonies of the 9th century BCE to the Roman
  annexation of the entire island as a province in 241 BCE.
  Sicily's strategic position between North Africa and Italy
  made it the natural pivot of any Mediterranean power
  projection.


  ## Geography


  Sicily is the largest island of the Mediterranean basin
  (approximately 25,700 km²), separated from the African coast
  by approximately 145 km at its closest point and from the
  Italian mainland by approximately 3 km at the Strait of
  Messina. The island's geography produced its distinctive
  political-cultural pattern: an eastern-coastal zone
  oriented toward the Greek-Italian world, a western-coastal
  zone oriented toward the Carthaginian-African world, and an
  interior dominated by the Etna volcano (3,329 m) and the
  central highland regions. The island's agricultural
  productivity (cereal cultivation in the central plains,
  vine and olive on the eastern slopes, fishing along all
  coasts) made it economically substantial across the entire
  pre-Roman period.


  ## The Phoenician colonial position (9th-6th centuries BCE)


  Phoenician colonial settlement of western Sicily began in
  the 8th century BCE, with the principal foundation at Motya
  (on the western tip), substantial settlement at Panormus
  (modern Palermo), and additional positions along the
  northwestern and southwestern coasts. The Phoenician
  Sicilian network was an extension of the broader
  Phoenician-Tyrian colonial expansion of the period; with
  Tyre's decline in the 6th century BCE, the Sicilian
  Phoenician positions came under Carthaginian political
  control.


  By the 5th century BCE the western third of the island was
  substantively Carthaginian: Motya as the principal base,
  Panormus and Lilybaeum as major fortified positions,
  smaller settlements integrated into a coherent Carthaginian
  Sicilian administrative-military structure. The position
  underwrote Carthaginian control of the central
  Mediterranean shipping routes and provided the resource
  base (agricultural and naval) that Carthaginian Sicilian
  operations drew on through the subsequent four centuries.


  ## The Greek colonial position (8th-6th centuries BCE)


  Greek colonial settlement of eastern Sicily was the parallel
  Mediterranean expansion to the Phoenician one. The principal
  foundations: Naxos (734 BCE, the first Greek-Sicilian
  colony), Syracuse (734 BCE, Corinthian), Megara Hyblaea
  (728 BCE), Leontini (729 BCE), Catania (729 BCE), Gela
  (688 BCE), Akragas (582 BCE, the principal central-southern
  position), Selinus (628 BCE, the principal western Greek
  position), Himera (648 BCE, on the north coast).


  By the 5th century BCE Greek Sicily was substantively
  developed: substantial cities, sophisticated political-
  cultural institutions (the Sicilian Greek poet Stesichorus,
  the philosopher Empedocles of Akragas, the historians and
  rhetoricians whose work would influence the broader Greek
  intellectual tradition), and the population scale that the
  archaeological record substantially preserves.


  ## The pattern of Greek-Carthaginian war


  The Greek-Carthaginian contestation of Sicily ran across
  approximately 250 years, from the Battle of Himera in 480
  BCE through the Roman intervention of 264 BCE that
  produced the First Punic War. The principal phases:


  - **First Sicilian War (480 BCE).** Hamilcar Magonid's
    invasion defeated by Gelon of Syracuse and Theron of
    Akragas at Himera. Treated separately on the site under
    the Battle of Himera entry.


  - **Second Sicilian War (410-404 BCE).** Hannibal son of
    Gisco's Magonid invasion sacked Selinus, Himera, and
    Akragas. Treated separately on the site.


  - **Wars of Dionysius (398-367 BCE).** Four Syracusan
    operations against Carthaginian Sicily under Dionysius I.
    Treated separately on the site.


  - **Battle of the Crimisus (341 BCE).** Timoleon's victory
    over Carthaginian invasion. Treated separately on the
    site.


  - **Third Sicilian War (311-306 BCE).** The conflict during
    which Agathocles invaded Africa. Treated separately on
    the site.


  The pattern's structural feature is that no single war
  produced decisive resolution: Carthage and Greek Sicily
  alternated victories and counter-offensives across the 250-
  year period, with neither side capable of permanently
  expelling the other. The eventual resolution came from
  outside the binary: Roman intervention in 264 BCE
  transformed the contest entirely.


  ## The Pyrrhic interlude (278-275 BCE)


  Pyrrhus of Epirus's Sicilian campaign briefly disrupted the
  long pattern. His operations drove Carthage from most of
  Sicily within two years before political-administrative
  failures alienated the Greek-Sicilian cities and produced
  his withdrawal. Treated separately on the site.


  ## The Roman conquest (264-241 BCE)


  The First Punic War (treated as a dedicated parent event
  on the site) produced the systematic Roman conquest of
  Sicily. By 241 BCE the entire island was under Roman
  control; the Lutatius treaty formalized the territorial
  transfer; Sicily became the first Roman province (the term
  *provincia* deriving substantially from this Sicilian
  arrangement).


  Roman Sicily through the imperial period was one of the
  principal grain-producing regions of the empire, with
  agricultural development substantially building on the
  Carthaginian and Greek-Sicilian infrastructure that had
  preceded Roman annexation. The Sicilian-Greek and
  Punic-Sicilian cultural elements persisted under Roman
  rule, with substantial archaeological and inscriptional
  preservation across the imperial period.


  ## Sources


  Sicily is preserved across the substantial Greek-Sicilian
  literary tradition (especially Diodorus Siculus, books 11-22,
  drawing on Timaeus and other lost Sicilian-Greek
  historians); through the Roman literary record (Polybius
  for the Punic Wars, Cicero's Verrines for the late
  Republican province); through the archaeological record at
  the major sites (Syracuse, Akragas, Motya, Selinus,
  Himera). Finley's *Ancient Sicily* (2nd ed. 1979) is the
  standard English-language synthesis; the broader specialist
  literature is extensive.
