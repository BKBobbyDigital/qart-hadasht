summary: >
  The sacred mountain of western Sicily, and one of the two reasons
  this encyclopedia has any business with the place: it held the most
  renowned sanctuary of [Astarte](/deities/astarte) in the western
  Mediterranean, and it was the peak from which
  [Hamilcar Barca](/people/hamilcar-barca) fought the last campaign of
  the First Punic War.

  The sanctuary came first and lasted longest. On the summit stood an
  ancient temple of the goddess the Phoenicians and Carthaginians knew
  as Astarte, whom the Greeks matched with Aphrodite and the Romans
  took up, after 241, as Venus Erycina. The cult drew worshippers
  across every culture that touched western Sicily, Elymian, Punic,
  Greek, and Roman in turn. The indigenous Elymians held the mountain
  and were long allied with Carthage, so the sanctuary sat squarely
  within the Punic religious world even though the Elymians were not
  themselves Carthaginians. Eryx is one of the clearest measures of how
  far Astarte's worship reached and how readily it crossed between
  peoples.

  ## The goddess taken to Rome

  The Roman adoption has a date and a context, and both are worth
  having. In 217, with Flaminius dead at
  [Trasimene](/events/battle-of-lake-trasimene) and the city in the
  religious crisis that followed, the decemvirs consulted the
  Sibylline Books and the dictator Quintus Fabius Maximus vowed a
  temple at Rome to Venus Erycina, the vow being assigned to
  whoever held the greatest power in the state. A temple to Mens,
  the goddess of good sense, was vowed in the same package by the
  praetor Titus Otacilius, along with games to Jupiter, a
  lectisternium and a sacred spring (Livy 22.9-10).

  What makes this more than a note about Roman cult is which
  goddess it is. The deity Rome brought inside its own walls as a
  war measure was the one whose great sanctuary stood on a mountain
  the Carthaginians had held, where Hamilcar Barca had fought for
  three years and the Romans had clung to the summit temple against
  him. MacDonald and Miles read the vow as an appropriation, Rome
  taking the goddess away from her long association with Carthage
  and setting her against Hannibal. Livy supplies no motive, here
  or for the
  [supplication to Hercules](/claims/rome-supplication-to-hercules-217)
  the winter before, so the reading is inference in both cases. It
  is the same inference twice in two years, which is the strongest
  thing that can be said for it.

  The mountain's other role is military, and the Barcids were not the
  first to want it. In the course of Pyrrhus of Epirus's Sicilian
  campaign the king came up against Eryx as the strongest fortress
  Carthage held on the island. Plutarch has him vow games and a
  sacrifice to Heracles, sound the trumpets, bring up the
  scaling-ladders and go over the wall first, cutting down many of the
  defenders himself (*Pyrrhus* 22.4–6); Diodorus gives a long siege, an
  assault the king led in person once his Friends joined him, and a
  garrison left behind when the place fell (22.10.3). The vow is worth
  noticing. The god a Hellenistic king swore by while storming
  Astarte's mountain was the Heracles whom the western Mediterranean
  had long identified with
  [Melqart](/deities/melqart), so the deity invoked against a
  Carthaginian stronghold was one the Carthaginians knew in their own
  form. Nothing says Pyrrhus intended that, and the site does not read
  it as a gesture aimed at the defenders; it is a measure of how
  thoroughly the two pantheons had been mapped onto each other in the
  west by the 270s. The same identification carried a Barcid general's
  vows at Gades two generations later (see
  [Hannibal and Heracles](/narratives/hannibal-and-heracles)).

  In 244 BCE, with the war in
  Sicily otherwise stalemated around besieged
  [Lilybaeum](/places/lilybaeum) and [Drepana](/events/battle-of-drepana),
  Hamilcar Barca moved on Eryx. He had spent the previous three years
  at Heirkte, which was not in this neighborhood: Polybius puts it by
  the sea between Eryx and Panormus (1.56.3), and it is usually
  identified with Monte Pellegrino above modern Palermo, at the far
  end of that coast.

  What he took at Eryx was the town, not the peak. Polybius has the
  Romans holding the summit with the temple on it and a second
  garrison at the foot of the mountain, and Hamilcar seizing the
  settlement between the two, which left the Roman force on the
  summit cut off above him while he sat wedged between them
  (1.58.2–3). The goddess stayed in Roman hands. From that position
  he raided the Roman lines for the war's last three years and was
  never beaten in the field.

  What ended his command was not defeat on the mountain but disaster
  at sea. The Carthaginian loss at the
  [Aegates Islands](/events/battle-of-aegates-islands) in 241 forced
  the [Treaty of Lutatius](/events/treaty-of-lutatius), and
  [Nepos](/sources/nepos-hamilcar) preserves the exchange that
  followed. Catulus would conclude nothing unless Hamilcar and the men
  who held Eryx laid down their arms before leaving Sicily; Hamilcar
  answered that with his country going under he would die sooner than
  go home in that disgrace, because the arms had come from his
  fatherland and were not his to hand to an enemy. Catulus gave way
  (*Hamilcar* 1.5). So the unbroken Eryx army marched out under arms
  by agreement, exactly as the equally unbroken garrison of Lilybaeum
  did. The experience of being undone by treaty rather than in battle
  fed directly into the grievance the Barcids carried out of the First
  Punic War and into Iberia.
