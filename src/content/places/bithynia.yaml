  notes: >
    Hannibal died at Libyssa, a coastal village in Bithynia near
    modern Gebze, Turkey. The exact site is identified
    traditionally and is consistent with the surviving sources.
modern_location: Marmara region of Turkey (Kocaeli and Bursa provinces)
summary: >
  Hellenistic kingdom in northwestern Anatolia, on the southern
  coast of the Black Sea, ruled in Hannibal's time by King
  Prusias I (r. 228-182 BCE). After fleeing the Seleucid court
  of Antiochus III following the Roman victory in 189 BCE,
  Hannibal eventually took refuge with Prusias and assisted in
  Bithynian operations against Pergamum and the Seleucid
  successor states for several years. In 183 BCE, with a Roman
  embassy under Titus Quinctius Flamininus demanding his
  surrender from Prusias, Hannibal took poison at Libyssa rather
  than be handed over. The site of his death and burial is
  preserved in the surviving tradition; Septimius Severus
  reportedly built a marble mausoleum at the location centuries
  later, though no archaeological remains have been securely
  identified.
