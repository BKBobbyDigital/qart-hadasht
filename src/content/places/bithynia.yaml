summary: >
  Hellenistic kingdom in northwestern Anatolia, on the southern
  coast of the Black Sea, principal place of Hannibal Barca's
  late exile and the site of his death by suicide in 183 BCE.


  ## Geography


  Bithynia occupied the northwestern corner of Anatolia
  (modern Turkey), bounded by the Sea of Marmara on the
  west, the Black Sea on the north, the Sangarius River
  basin on the east, and the Mysia/Phrygia border zones on
  the south. The terrain combined coastal lowlands suitable
  for agriculture, substantial forested mountains in the
  interior, and access to maritime trade routes through the
  Bosphorus. The kingdom's principal cities were Nicomedia
  (the capital from approximately 264 BCE), Nicaea, Prusa
  (modern Bursa), and Chalcedon.


  ## The Bithynian kingdom


  Bithynia developed as a distinct kingdom in the early
  Hellenistic period, after the death of Alexander the Great
  in 323 BCE created the political configuration that
  Bithynia and the other Anatolian successor kingdoms
  developed within. The kingdom's principal political
  achievement was its survival of the diadochic struggles
  that consumed many of the larger Hellenistic states: by
  navigating the contests among Antigonid, Seleucid, and
  Lysimachan-then-Pergamene powers, the Bithynian rulers
  maintained substantial independence across the 3rd and
  early 2nd centuries BCE.


  The Bithynian royal house traced its origin to Zipoetes
  (approximately 326-278 BCE), the first formally
  acknowledged king. The Nicomedid dynasty that descended
  from Zipoetes ruled the kingdom for approximately two
  and a half centuries until the bequest of the kingdom to
  Rome by Nicomedes IV in 74 BCE.


  ## Prusias I (r. 228-182 BCE)


  Prusias I, the Bithynian king through Hannibal's exile
  period, was a substantial Hellenistic ruler whose reign
  produced extensive territorial expansion (substantial
  acquisitions in Mysia and Phrygia at the expense of
  Pergamum) and political-cultural development. His
  diplomatic position through the Roman-Macedonian wars and
  the subsequent Roman-Seleucid war was complex: Prusias
  generally aligned with Rome's broader strategic interests
  while also pursuing distinctive Bithynian objectives that
  produced periodic friction.


  Prusias's reception of Hannibal in approximately 184 BCE
  reflected this complex political position. Hannibal's
  status as a former Carthaginian commander and current
  political refugee made him both useful (military expertise
  for Bithynian operations against Pergamum) and dangerous
  (Roman embassy demands for his surrender created
  substantial diplomatic complications).


  ## Hannibal's exile in Bithynia (184-183 BCE)


  Hannibal's residence in Bithynia is treated separately on
  the site as part of the broader exile-and-death narrative.
  The condensed version: arrived in Bithynia from Crete or
  Armenia in approximately 184 BCE; advised Prusias in
  operations against Pergamum, contributing the famous
  poisonous-snakes-in-jars naval tactic that Cornelius Nepos
  preserves; built a fortified residence at Libyssa with
  multiple underground escape passages prepared against
  Roman extradition demand; died by poison at Libyssa in
  183 BCE when the Roman embassy under Flamininus arrived
  demanding surrender.


  The Libyssa residence is preserved in the literary
  tradition with substantial detail (the seven escape
  passages; the ring with concealed poison; the closing
  speech traditionally attributed to him). The
  archaeological identification of the site has been
  attempted; no remains have been securely tied to
  Hannibal's residence specifically. Septimius Severus
  reportedly built a marble mausoleum at the location
  centuries later, but no surviving structure can be
  confidently identified.


  ## Roman Bithynia


  The kingdom passed to Roman administration through bequest
  in 74 BCE. Roman Bithynia (subsequently Bithynia and
  Pontus, after the addition of the eastern Pontic
  territories) functioned as a substantial provincial
  holding through the imperial period. The province
  produced several substantial Greek-language intellectual
  figures of the imperial period, including the geographer
  Strabo (whose work preserves substantial information about
  pre-Roman Bithynia) and Pliny the Younger (Roman governor
  of the province in 110-112 CE, whose preserved
  correspondence with Trajan documents the province's late
  early-imperial administration).


  ## Sources


  Bithynia is preserved principally through the substantial
  Hellenistic-period and Roman-period Greek and Latin
  literary tradition. For Hannibal's exile period
  specifically: Livy 39.51 (the fullest preserved death
  narrative); Cornelius Nepos *Hannibal* 12-13 (the
  Bithynian period in detail); Plutarch *Flamininus* 20-21
  (the Roman embassy and the closing speech). Modern
  scholarship on the Bithynian kingdom is in the broader
  Hellenistic-period scholarship; the archaeological record
  of the kingdom is substantial but principally preserves
  Roman-period strata.
