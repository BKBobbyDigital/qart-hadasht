summary: >
  A Greek colony founded by Phocaean refugees on the eastern
  coast of Corsica c. 565 BCE, after the fall of their home
  city Phocaea to Persian conquest. The Phocaeans used Alalia
  as a base for piracy and trade across the western
  Mediterranean — disrupting Etruscan and Carthaginian
  shipping in a corridor that both powers regarded as their
  own. The Carthaginian-Etruscan response was the naval
  engagement of c. 535 BCE off the Corsican coast at which a
  combined fleet of 60 Carthaginian and 60 Etruscan ships
  fought 60 Phocaean ships to a tactical Phocaean victory but
  strategic Phocaean defeat: the Phocaeans suffered such
  losses that they abandoned Alalia, withdrawing first to
  Rhegium and then to a new foundation at Velia in southern
  Italy. The engagement (Herodotus calls it a "Cadmean
  victory" — a victory worse than defeat) confirmed
  Carthaginian-Etruscan control of the western Mediterranean
  for the next 250 years and is the principal event of
  6th-century western-Mediterranean naval history.
