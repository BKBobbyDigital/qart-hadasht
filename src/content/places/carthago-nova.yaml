summary: >
  Carthaginian Iberian capital founded by Hasdrubal the Fair
  in approximately 228 BCE on the southeastern coast of the
  Iberian peninsula. The Punic name was the same as the parent
  city in North Africa (Qart-Hadasht, "New City"); Greek and
  Latin sources distinguished the two by adding *Nea* /
  *Nova* ("new"), giving the modern name.


  ## Why this site


  The decision to found a new Iberian capital, distinct from
  the established Phoenician colonial settlements at Gades and
  along the southern coast, reflected Hasdrubal the Fair's
  political-strategic vision for the consolidating Iberian
  project. The Cartagena natural harbor on the southeastern
  Iberian coast was one of the best in the western
  Mediterranean: a substantial protected basin (approximately
  1.5 km long), surrounded by defensible hills on three sides,
  with a narrow entrance that made the harbor easily
  defensible against naval attack. Polybius (10.10) preserves
  a substantial geographic description that has been
  substantially confirmed by modern archaeological work.


  Three additional factors made the site exceptional:


  - **Defensibility.** The peninsula on which the city was
    built was surrounded on three sides by water (sea on
    the south, the harbor on the southeast, a tidal lagoon
    on the north) with only a narrow landward approach. The
    famous low-tide period across the lagoon — which Scipio
    Africanus exploited in his single-day capture of the
    city in 209 BCE — was a structural feature of the local
    geography rather than a freak event.

  - **Mineral resources.** The southern Iberian silver mines,
    particularly the substantial deposits in the Sierra
    Minera de Cartagena directly inland from the city, were
    among the richest in the western Mediterranean. Pliny
    the Elder (NH 33.97) preserves detailed descriptions of
    the mining operations that subsequent Roman exploitation
    inherited.

  - **Communications.** The site combined naval access (the
    harbor) with overland routes into central Iberia, making
    it operational as both a maritime base and a hub for the
    political-military integration of the broader Iberian
    territory.


  ## The Carthaginian capital (228-209 BCE)


  Carthago Nova functioned as the political-administrative,
  fiscal, and military center of Carthaginian Iberian
  operations across approximately twenty years. The city's
  principal functions:


  - **Political-administrative center.** Hasdrubal the Fair's
    court and Hannibal's subsequent command were based at the
    city; the Carthaginian-Iberian elite that the dynastic-
    integration strategy had built operated principally
    through the capital.

  - **Naval base.** The harbor served as the principal
    Carthaginian naval base in the western Mediterranean
    after the loss of Sicily and Sardinia. Carthaginian ships
    operating in the Iberian theater and the western
    Mediterranean were stationed and supplied here.

  - **Fiscal-administrative center.** Silver from the Iberian
    mines was processed and minted at the city, with the
    distinctive Barcid Iberian coinage of the late 3rd
    century BCE struck principally here. The fiscal
    operations funded both the Iberian project's continuation
    and (substantially) the Italian campaign that began in
    218 BCE.

  - **Military preparation center.** The army that crossed
    into Italy in 218 BCE was organized, provisioned, and
    trained at Carthago Nova. The pre-departure period in
    spring-early summer 218 BCE saw the city function as the
    operational mobilization center for the campaign.


  ## The Roman capture (209 BCE)


  The Roman capture of Carthago Nova by the future Scipio
  Africanus in 209 BCE was the operational masterstroke of
  the Roman Iberian campaign. Scipio's combined-arms
  operation — sea-borne assault on the harbor side coordinated
  with a low-tide infantry crossing of the northern lagoon —
  produced the city's fall in a single day. The capture's
  consequences for the broader Carthaginian Iberian position
  were structural: silver-mining revenue, military stockpiles,
  political-administrative archives, and substantial
  Carthaginian-Iberian elite hostages all passed to Roman
  control.


  Polybius treats the capture as one of the principal Roman
  achievements of the Second Punic War and uses it to
  demonstrate Scipio's emerging operational style. The
  combined-arms doctrine that produced the victory at Ilipa
  three years later was first deployed at Carthago Nova; the
  strategic conditions that produced the African expedition
  of 204 BCE were established by the Iberian theater's
  collapse that this capture initiated.


  ## Roman Carthago Nova (briefly)


  Under Roman rule from 209 BCE onward, the city remained a
  major commercial-mining center. Roman Carthago Nova's
  archaeological remains include substantial public
  architecture (forum, theater, temples), with the Augustan
  and early-imperial reorganization producing the
  preservation now visible at the modern Cartagena site. The
  silver-mining infrastructure the Carthaginian period had
  developed continued under Roman exploitation through the
  imperial period.


  ## Sources and modern site


  The site is preserved as a substantial archaeological park
  in modern Cartagena, with both Punic-period and Roman-
  period strata visible. The Punic-period preservation is
  partial (substantial Roman rebuilding overlies the
  Carthaginian foundation) but includes harbor infrastructure,
  fortification fragments, and necropolis material. The
  Punic-period coinage from the city is preserved
  substantively in the numismatic record and is one of the
  most distinctive elements of late-3rd-century BCE
  Mediterranean coinage. Polybius 10.8-15 is the principal
  ancient narrative source for the 209 BCE capture and the
  city's structure at that moment.
