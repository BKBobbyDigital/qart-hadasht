summary: >
  Iberian city on the eastern coast of the Iberian peninsula,
  approximately 25 km north of modern Valencia, whose siege
  by Hannibal in 219 BCE was the casus belli of the Second
  Punic War.


  ## Geography and pre-Carthaginian history


  Saguntum occupied a defensive hilltop position
  approximately 8 km inland from the Mediterranean coast,
  with substantial fortification on the rocky ridge that
  commanded the surrounding plain. The ridge's elevation
  (approximately 170 m above the surrounding terrain) and
  the natural defensive geography produced one of the more
  defensible positions on the eastern Iberian coast, which
  is why the Carthaginian siege required eight months
  rather than the more rapid storm a less-defended position
  might have permitted.


  Saguntum was an Iberian city, with Phoenician-Punic and
  Greek commercial-cultural influences from the surrounding
  colonial network. The city's pre-Carthaginian history is
  preserved imperfectly; the surviving record establishes
  substantial Iberian political identity through the 5th
  and 4th centuries BCE, with the Roman friendship treaty
  developing through the late 3rd century BCE.


  ## The Roman friendship treaty


  The specific terms and date of Saguntum's friendship
  treaty with Rome are imperfectly preserved. Polybius (3.30)
  acknowledges the ambiguity: the treaty's terms are not
  preserved in surviving documentation; its date is variously
  given in different sources; its specific provisions are
  contested. What is firmly attested is that Saguntum was a
  Roman ally through some formal arrangement, that the
  arrangement preceded the 226 BCE Ebro Treaty, and that
  the city's status as an ally was central to the
  diplomatic-political question that would produce the
  Second Punic War.


  The treaty's legal-procedural significance rested on its
  relationship to the Ebro Treaty. Saguntum lay south of
  the Ebro river (the boundary the 226 BCE treaty had
  established for Carthaginian operations); but if
  Saguntum's status as a Roman ally was protected by an
  earlier and separate arrangement, the Ebro Treaty's
  geographic provision did not necessarily apply to the
  city. The legal ambiguity was central to the diplomatic
  dispute that produced the war.


  ## The siege (219 BCE)


  Hannibal's siege of Saguntum is treated separately on the
  site as a dedicated event entry. The condensed version:
  eight-month siege through spring-autumn 219 BCE; Hannibal
  wounded in the early phase; Roman embassies during and
  after the siege failed to halt the action; the city fell
  in late autumn with substantial destruction; Roman
  declaration of war followed in spring 218 BCE.


  The siege's duration is a substantive observation about
  the city's defensive capacity. A Carthaginian army of the
  size and quality Hannibal commanded should have reduced a
  single Iberian city in less than the eight months that
  the engagement actually required. The duration suggests
  both Saguntine resilience (substantially because of the
  city's defensive geography) and Hannibal's operational
  caution (probably to avoid heavy casualties in his army
  before the Italian campaign that the Iberian project was
  preparing).


  ## After 219 BCE


  Saguntum was sacked and substantially destroyed in 219
  BCE; the surviving population was killed, enslaved, or
  scattered. The city remained under Carthaginian control
  through the Hannibalic campaign in Italy.


  Roman recovery of Saguntum came in 214 BCE through the
  elder Scipios' operations in Iberia. The post-war
  reconstruction (after 201 BCE) refounded the city as a
  Roman *municipium*; the Roman-period site became a
  substantial provincial center through the imperial
  period, with substantial preservation of Roman public
  architecture (forum, theater, temples) on the same
  hilltop position.


  ## The site


  Modern Sagunto preserves substantial archaeological
  remains across the Iberian, Carthaginian-occupied, and
  Roman strata. The hilltop fortifications include both
  pre-Roman and Roman elements; the Roman theater
  (substantially preserved) and the broader provincial-Roman
  archaeological park give the modern site continuous
  preservation across approximately 2,500 years of
  occupation.


  ## Sources


  Saguntum is preserved principally in Polybius (Book 3,
  with the siege and the diplomatic context) and Livy
  (Book 21.6-15, the fullest preserved siege narrative).
  Modern scholarship on the Saguntum-Ebro Treaty question
  is substantial; Hoyos's *Unplanned Wars* (1998) provides
  the standard treatment of the legal-diplomatic
  ambiguities. The archaeological record has been worked
  substantially since the 19th century; the modern
  Spanish-language scholarship on the site is extensive.
