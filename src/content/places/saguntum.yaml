summary: >
  Iberian city on the eastern coast of the Iberian peninsula,
  approximately 25 km north of modern Valencia. A Roman ally
  through a treaty of friendship preserved in the surviving
  sources but whose precise terms are debated, Saguntum lay
  geographically south of the Ebro River that the 226 BCE Ebro
  Treaty between Rome and Hasdrubal the Fair had nominally
  established as the boundary of Carthaginian operations in
  Iberia. Hannibal's siege and capture of the city in 219 BCE
  was the casus belli of the Second Punic War: Rome treated the
  attack on its ally as a violation of the Ebro arrangement and
  declared war the following year. Modern excavations of the
  site have produced substantial archaeological evidence of the
  Iberian and subsequently Roman city.
