summary: >
  Phoenician colonial foundation on the Capo di Pula peninsula
  on the southern Sardinian coast, traditionally one of the
  earliest Phoenician installations in the western Mediterranean.
  Nora is the home of the [Nora Stone](/artifacts/nora-stone), a
  9th-century BCE Phoenician inscription that constitutes one of
  the earliest preserved Phoenician-script documents from the
  western Mediterranean and a central piece of evidence for
  the dating of Phoenician colonial expansion.

  ## The Nora Stone

  The site's archaeological significance is anchored on the
  [Nora Stone inscription](/artifacts/nora-stone), discovered in
  1773 and dated to approximately the late 9th or early 8th
  century BCE on paleographic grounds. The inscription's exact
  reading is contested across modern scholarship but it
  documents Phoenician presence at Nora at a date
  consistent with the early phases of the western Phoenician
  colonial network. The stone is one of the principal pieces of
  evidence in the question of when Phoenician expansion to the
  western Mediterranean actually began — treated under the
  open question on
  [when Carthage was actually founded](/openQuestions/founding-when-actually)
  and the broader
  [Phoenician colonial network theme](/themes/phoenician-colonial-network).

  ## The site

  Nora occupies a peninsula projecting into the Sardinian
  southern coast, with sheltered anchorages on both sides — the
  same defensible-peninsula pattern as [Tharros](/places/tharros)
  and [Carthage](/places/carthage). The Phoenician phase
  developed into a Punic city under Carthaginian hegemony from
  the 6th century BCE; the Roman seizure of Sardinia in 238 BCE
  transferred the city to Roman provincial administration without
  apparent disruption of the urban fabric. Excavations have
  exposed the Punic-Roman city, a substantial Roman-period
  forum and theatre, the Tanit-Astarte sanctuary, the Tophet
  precinct, and the necropolis.

  ## Sources

  The principal modern reference is the Italian archaeological
  literature on Nora (Bondi's excavation publications); for the
  Phoenician colonial context, Aubet 2001 and the
  [Krings handbook](/sources/krings-manuel-1995) Sardinia chapters.
  The
  [continuity in Roman Africa narrative](/narratives/punic-continuity-in-roman-africa)
  treats the broader pattern of Punic-cultural continuity that
  Nora's stratigraphy helps document.
