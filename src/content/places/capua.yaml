summary: >
  Ancient Etruscan and subsequently Oscan-speaking city in the
  fertile Campanian plain, second-largest city of Italy after
  Rome through much of the 4th and 3rd centuries BCE. A Roman
  socius from 343 BCE, Capua's defection to Hannibal in late
  216 BCE following the Battle of Cannae was the largest single
  political defection of the Italian war and the central
  example of the broader Italian-allied movement away from
  Roman control after Cannae. Recovered by Rome through
  prolonged siege in 211 BCE; the punishment of the Capuan
  leadership and the city's loss of its civic autonomy were
  among the principal Roman political acts of the post-Cannae
  recovery. The site is well-preserved archaeologically; the
  ancient amphitheater at Capua is the second-largest in Italy
  after the Colosseum.
