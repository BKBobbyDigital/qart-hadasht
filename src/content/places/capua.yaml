summary: >
  Ancient Etruscan and subsequently Oscan-speaking city in the
  fertile Campanian plain, and one of the largest and richest
  cities of Italy: Polybius calls it "once the wealthiest of
  cities" (3.91), and Plutarch "the most considerable city after
  Rome" (*Fabius* 17). A Roman
  socius from 343 BCE, Capua's defection to Hannibal in late
  216 BCE following the Battle of Cannae was the largest single
  political defection of the Italian war and the central
  example of the broader Italian-allied movement away from
  Roman control after Cannae.

  Rome took it back by [siege in 211](/events/siege-of-capua), and
  what followed was the harshest thing Rome did to an Italian
  community in the war. About seventy of the leading senators were
  executed, three hundred nobles imprisoned, and the rest of the
  population sold; twenty-seven senators had already taken poison
  together rather than wait for it. The senate then debated
  destroying the city outright and decided against it on the ground
  that the Campanian plain was the most fertile land in Italy and
  somebody would have to farm it. All the land and buildings became
  public property of the Roman people, and Capua kept its walls and
  lost its senate, its assembly and its magistrates: a place, and no
  longer a community (Livy 26.14-16). The site reads the decision of
  211 as the nearer precedent for 146, and the argument is at
  [the take on the destruction of Carthage](/editorialTakes/destruction-not-weak-enough).

  The site is well-preserved archaeologically; the
  ancient amphitheater at Capua is the second-largest in Italy
  after the Colosseum.
