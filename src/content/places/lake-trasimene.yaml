summary: >
  Site of one of the most famous ambushes in ancient warfare. On
  the morning of 21 June 217 BCE, Hannibal concealed his army
  along the hills overlooking a narrow defile between Lake
  Trasimene and the surrounding mountains, drew the Roman
  consular army of Gaius Flaminius onto the road in dense
  morning fog, and launched the ambush as the Roman column
  passed below. Approximately 15,000 of the 25,000-strong Roman
  army were killed (including Flaminius); a similar number were
  captured. The engagement is the largest ambush in the history
  of warfare by combatants involved.
