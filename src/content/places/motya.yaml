summary: >
  The principal Carthaginian fortified base in Sicily through
  the 6th and 5th centuries BCE — a small island in the
  shallow lagoon off the western Sicilian coast, connected to
  the mainland by a Carthaginian-built submerged causeway
  (still visible at low tide). Motya's combination of
  defensible insularity, harbor capacity, and proximity to
  the Africa-Sicily-Sardinia shipping routes made it the
  operational center of Carthaginian Sicilian power and one
  of the major western-Mediterranean Punic settlements.

  Motya's archaeological record is unusually rich for a
  Carthaginian site: the 397 BCE destruction by Dionysius
  (described below) sealed the 5th-century occupation level
  with relatively limited subsequent disturbance, and the
  modern excavation has produced one of the largest surviving
  bodies of Punic material culture outside Carthage itself.
  The "Motya charioteer," a Greek-style marble youth found in
  the 1979 excavation, is the most-discussed single artifact
  from Punic Sicily.

  The site's fall in 397 BCE to Dionysius — after the famous
  siege in which Dionysius first deployed advanced siege
  artillery and assault towers — was a decisive moment of
  4th-century Greek-Sicilian warfare. The city was sacked,
  its population enslaved, and Carthaginian Sicilian
  operations relocated north to the new foundation at
  Lilybaeum. Motya was not significantly resettled and the
  archaeological record substantially preserves the moment of
  its destruction.
