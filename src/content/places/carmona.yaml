summary: >
  Iberian town in the Guadalquivir valley with substantial
  Phoenician contact from the 8th century BCE forward, located
  inland from the coastal Phoenician installations at
  [Gades](/places/gades) and elsewhere. Carmona represents the
  pattern of Iberian-Phoenician cultural contact in the
  hinterland of the principal coastal trading network — Iberian
  communities adopting and adapting Phoenician material culture,
  funerary practice, and (selectively) religious iconography
  through commercial and cultural exchange.


  ## The Iberian-Phoenician contact zone

  Carmona's significance for the Phoenician-Punic encyclopedia is
  not as a Phoenician colonial foundation but as a substantial
  Iberian town in the hinterland that became deeply involved in
  the Phoenician commercial network. The Iberian populations of
  the Guadalquivir valley were the principal trading partners of
  the coastal Phoenician installations — the silver of the
  southern Iberian mines was substantially under Iberian
  political control, with Phoenician access mediated through
  these inland populations.


  The site has yielded substantial Phoenician-influenced
  material culture: ivory carvings in the Phoenician style,
  ceramics in the Phoenician technical tradition, funerary
  goods with Phoenician iconography. The pattern is the broader
  one treated under
  [the Numidian-Punic interface narrative](/narratives/the-numidian-punic-interface)
  but applied to the Iberian inland zone — substantive local
  cultural agency in adopting and adapting Phoenician forms,
  not passive reception.


  ## The Pozo Moro mausoleum

  Among the principal Phoenician-influenced funerary monuments
  in the broader region is the
  [Pozo Moro funerary monument](/artifacts/pozo-moro-funerary-monument),
  a substantial Iberian tower-tomb in the eastern hinterland
  whose iconography draws explicitly on Phoenician-Punic
  religious imagery (the goddess in the tree, the bull-headed
  attendant). The Pozo Moro monument is not at Carmona itself
  but illustrates the broader Iberian-Phoenician cultural
  synthesis that Carmona represents at the level of the urban
  community.


  ## Sources

  The principal modern reference is the Spanish archaeological
  literature on pre-Roman Iberia (the
  [López Castro synthesis](/sources/lopez-castro-hispania-1995) for
  the Hispanic-Phoenician interface;
  [Aubet 2001](/sources/aubet-phoenicians-west-2001) for the broader
  colonial network context). Modern Carmona preserves the Roman
  necropolis as its principal archaeological monument; the
  pre-Roman strata are documented in excavation reports and at
  the local museum.
