slug: zama
name_display: Zama (battle site)
names_alt:
  greek: Ζάμα
  latin: Zama
  modern: Disputed — most likely Naraggara (Sakiet Sidi Youssef, Tunisia)
type: battlefield
candidates:
  - label: Naraggara (modern Sakiet Sidi Youssef)
    lat: 36.2261
    lon: 8.3550
    confidence: probable
    notes: >
      Polybius (15.5.14) names Naraggara as the location of Scipio's camp before
      the battle. Modern scholarship — including Lancel's topographic survey —
      treats this as the most likely battle site.
  - label: Zama Regia (Jama, near Siliana)
    lat: 36.1167
    lon: 9.4500
    confidence: possible
    notes: >
      Livy (30.29) places the engagement at Zama, ~5 days' march from Carthage.
      The toponym gave the battle its traditional name, but the site lies ~80 km
      south-east of Naraggara. Some reconstructions use this site.
  - label: A site between Naraggara and Zama Regia
    lat: 36.1700
    lon: 8.9000
    confidence: speculative
    notes: >
      Some 20th-century reconstructions, attempting to reconcile Polybius and
      Livy, place the battle at an intermediate location. Lacks direct textual
      support.
modern_location: North-west Tunisia, near the Algerian border
summary: >
  The battlefield where Scipio Africanus defeated Hannibal in October 202 BCE,
  ending the Second Punic War. Despite giving its name to the battle, the
  precise location of "Zama" is contested even among the ancient sources:
  Polybius locates Scipio's camp at Naraggara, Livy at Zama, and the two are
  ~80 km apart. The Naraggara identification (modern Sakiet Sidi Youssef) is
  generally preferred today on the strength of Polybius's earlier and more
  reliable account.
