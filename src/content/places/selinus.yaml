summary: >
  A major Greek (Doric) colony on the southwestern Sicilian
  coast, founded c. 628 BCE by colonists from Megara Hyblaea.
  Selinus's seven monumental temples — preserved as one of
  the largest Greek temple complexes anywhere in the
  Mediterranean — testify to the city's wealth and ambition
  through the 6th and 5th centuries BCE. The city's
  long-running border dispute with the Elymian city of Segesta
  (Carthage's traditional Sicilian ally) was the immediate
  trigger of the Hannibalic invasion of 410 BCE: Segestan
  appeals to Carthage produced the campaign that culminated
  in Selinus's destruction in spring 409 BCE.

  The 409 sack was the most destructive single act of the
  5th-century Greek-Sicilian wars. Diodorus reports 16,000
  killed and 5,000 enslaved in nine days of street-fighting
  and post-capture massacre; the surviving Selinuntine
  population was permitted to return to the ruined city
  under Carthaginian control, where it persisted as a
  diminished settlement through the 4th century. The temples
  themselves — already among the largest in the Greek world —
  were pulled down, possibly by the great earthquake of the
  4th century but plausibly already in 409. Selinus's
  archaeological survival is the clearest single window into
  pre-409 Greek Sicily.
