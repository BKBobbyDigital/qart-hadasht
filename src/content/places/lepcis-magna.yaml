summary: >
  The largest of the three Punic cities of the Tripolitanian coast
  (Sabratha and Oea were the others; the trio gave the region its
  Greek-Latin name "Tripolis"), founded by Phoenician colonists
  probably in the 7th century BCE and brought into the Carthaginian
  political sphere by the 5th century. Lepcis sat at a natural
  shelter at the mouth of the Wadi Lebda where caravan routes from
  the Saharan interior met the Mediterranean coast — the conjunction
  that made it a substantial trading entrepôt long before its
  Roman-era monumentalization.

  Under Carthaginian control Lepcis paid an annual tribute reported
  by Livy at one talent per day — a figure that, even allowing for
  Roman-source skepticism, signals a substantial commercial economy.
  The city retained its own coinage, magistracies, and Punic
  administrative language well after the Roman absorption of 146 BCE,
  and Punic and neopunic inscriptions from the site continue into the
  early imperial period. The duovirate of suffetes is attested
  epigraphically into the 1st century CE — one of the longest-
  surviving Punic civic institutions anywhere.

  Lepcis's position on the Lesser Syrtes coast made it the eastern
  anchor of the Carthaginian commercial network. The Philaeni Altars
  marking the Carthaginian-Cyrenaic frontier sat further east along
  the same coast, the result of the legendary boundary-running
  contest between Carthaginian and Cyrenaic envoys.

  In the Punic Wars Lepcis appears principally as a logistical
  reference point and a tribute-paying possession; it was not a
  battlefield in the way Sicilian or Iberian cities were. The
  archaeological wealth at Lepcis comes overwhelmingly from the
  Roman imperial period, when the emperor Septimius Severus
  (himself born at Lepcis) lavished public works on his home city.
  But the Punic-period substrate is well attested both
  archaeologically and inscriptionally, and the city's continuity
  of Punic civic forms under Roman administration makes it a
  particularly rich site for understanding how Carthaginian
  provincial society persisted into and beyond the destruction of
  146 BCE.
