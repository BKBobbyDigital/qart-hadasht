modern_location: Likely Albacete-region interior Spain; precise identification contested
summary: >
  An Iberian town of the southeastern interior, known almost entirely
  from one passage. [Diodorus](/sources/diodorus-library) is the only
  ancient author who names Helike, and in his account Hamilcar Barca is
  **besieging** it, not relieving it: he was encamped before the city and
  had it under siege, having sent the greater part of his army and the
  elephants into winter quarters at Akra Leuke. The king of the Orissi
  came to the city's relief and routed him by a feigned offer of
  friendship and alliance; Hamilcar drew the pursuit off along another
  road so that his sons and his friends could escape, was overtaken, and
  plunged on horseback into a large river, perishing in the flood under
  his horse (25.10.3–25.10.4). The river is not named.

  Three things commonly attached to Helike are not in this passage and
  not in any source that mentions the town. The oxen yoked to burning
  wagons belong to [Appian](/sources/appian-iberica) (*Iberica* 5) and to
  Cassius Dio, neither of whom names Helike. The
  [Vettones](/groups/vettones) belong to
  [Nepos](/sources/nepos-hamilcar) (*Hamilcar* 4.2), who names no place.
  And [Polybius](/sources/polybius-histories), the fullest source for the
  Iberian command, says only that Hamilcar died bravely against one of
  the most warlike and powerful tribes (2.1.8). The traditions are set
  out separately on
  [the death event](/events/death-of-hamilcar-at-helike).

  The town's identification is contested. Elche de la Sierra in interior
  Albacete is the most commonly cited candidate; coastal Elche in
  Alicante has its defenders and sits less well with Diodorus's river.
  Since Diodorus is the only witness to the name, the place is as
  uncertain as the account that preserves it.
