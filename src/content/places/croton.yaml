summary: >
  A Greek city on the Ionian coast of Bruttium, the toe of Italy, and
  the last base of Hannibal's army in Italy. By the Hannibalic war it
  was a shadow of itself. Livy says its walls had once run twelve miles
  round, and that after the war with Pyrrhus barely half the city was
  lived in (24.3). What kept its name was the sanctuary of Hera, Juno
  Lacinia to the Romans, on the headland of Cape Lacinium, venerated by
  all the communities around it.

  ## The sanctuary

  Livy's description is the fullest that survives (24.3). The temple
  stood in a grove closed in by dense woods and tall firs, around a
  clearing where cattle of every kind, sacred to the goddess, grazed
  with no herdsman and went back to their own stalls at nightfall. The
  profit from them had paid for a column of solid gold, dedicated to
  the goddess, and the temple was known for its wealth as much as its
  sanctity. Its miracles included an altar in the porch whose ashes no
  wind ever stirred.

  ## Carthaginian Croton

  The city came into Carthaginian hands in 215, when the Bruttians and
  the Carthaginian commander Hanno besieged the aristocrats who held
  its citadel. Rather than accept Bruttian settlers, the last of them
  were shipped to Locri, with Hannibal's consent (Livy 24.3). As the
  Carthaginian position in the south contracted, Croton became its
  center. Appian says that after the Bruttian defections Hannibal moved
  3,000 citizens of Thurii and 500 others from the countryside to
  Croton, "which he found to be well situated for his operations and
  where he established his magazines and his headquarters"
  (*Hannibal's War* 57).

  In the summer of 205, with plague in both armies and food short on
  the Carthaginian side, Hannibal camped near the temple of Juno
  Lacinia, where he built and dedicated an altar with a long
  inscription recording his achievements in Punic and in Greek (Livy
  28.46). That is the
  [Lacinian inscription](/sources/lacinian-inscription) Polybius says
  he read. When the Romans later reproached Carthage for breaking the
  truce of 203, their envoys described Hannibal's last two years in
  Italy this way: he had "fled to the Lacinian promontory," and, "shut
  in there and almost besieged," only just managed to get his army away
  to Africa (Polybius 15.1.11). The words are an enemy's, but the place
  is not in doubt.

  ## The golden column

  Cicero preserves a story about the column (*On Divination* 1.48).
  Hannibal wanted to carry it off and first had it drilled, to see
  whether it was solid gold or only plated. Finding it solid, he
  decided to take it. That night Juno came to him in a dream and warned
  him that if he did, she would take the sight of his one good eye. He
  heeded her, and had the gold from the drilling made into a figure of
  a calf, which he set on top of the column.

  Cicero names his source as Coelius Antipater, and in the next breath
  says that Coelius followed
  [Silenus](/sources/silenus-caleacte), Hannibal's own historian. Many
  scholars trace the column story back to Silenus too. Cicero ties
  Silenus explicitly only to the dream that follows (1.49), so the
  attribution is a reasonable inference rather than something he says.
  If the story did begin in Hannibal's camp, it may have been told to
  show a general who heeded the goddess and made amends; Richard
  [Miles](/sources/miles-carthage-2010) reads it that way, while
  admitting that the original sense cannot now be separated from the
  hostile retellings.

  ## Leaving Italy

  Hannibal sailed for Africa in 203, and the sources disagree about how
  he left. Livy says the Italians in his army who refused to follow
  took refuge in the temple of Juno Lacinia, "a shrine which up to that
  day had remained inviolate," and were murdered inside the sacred
  precinct (30.20). Appian tells it without the temple: Hannibal
  surrounded those who had chosen to stay, let his soldiers take some
  as slaves, and had the rest shot down, along with some 4,000 horses
  he could not ship (*Hannibal's War* 59). Both are hostile accounts,
  and they do not agree on the place or the manner. Livy also
  contradicts himself. Thirty years later, rebuking a censor who had
  stripped tiles from the temple's roof, the senators in his account
  call it the temple "which neither Pyrrhus nor Hannibal had violated"
  (42.3). Miles doubts the massacre and suggests it was a Roman answer
  to Carthaginian claims on the sanctuary. The contradiction inside
  Livy is the stronger ground for doubt.

  Whatever happened in the precinct, the allies left behind faced an
  uncertain future. Miles, citing Crawford (1985), points to an unusual
  number of coin hoards in Bruttium, buried by owners who never came
  back for them.

  Hannibal landed in Africa at Leptis in Livy's account (30.25) and at
  Hadrumetum in Appian's (*Punica* 33). The two lie close together on
  the same coast, well south of Carthage.

  ## The tiles

  The sanctuary outlived the war. In 174 or 173 the censor Quintus
  Fulvius Flaccus, building a temple to Fortuna Equestris in Rome,
  stripped half the roof of the Lacinian temple for its marble tiles.
  The senate ordered them returned and expiation offered to Juno. The
  tiles went back, but no one could be found who knew how to set them
  in place, so they were left lying in the temple precinct (Livy 42.3).
