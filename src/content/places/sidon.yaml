summary: >
  Phoenician metropolitan city on the Levantine coast, approximately
  35 kilometers north of [Tyre](/places/tyre). Sidon was the rival
  and counterpart to Tyre in the Phoenician metropolitan system,
  with periods of dominance shifting between the two cities across
  the early Iron Age and Persian periods. Sidon's principal patron
  deity was Eshmun, the healing god whose cult was subsequently
  transmitted to Carthage and integrated into the Carthaginian
  pantheon as one of the four principal deities.

  The Sidonian role in the Phoenician colonial network was real
  but less dominant than the Tyrian role: most of the major
  western Phoenician foundations (Carthage, Gades, Lixus, Tharros,
  Motya) are conventionally attributed to Tyre, though specific
  attribution in the surviving record is sometimes ambiguous. The
  Sidonian network presence was substantial in the eastern
  Mediterranean and the Aegean trading circuits.

  The site treats the broader Phoenician metropolitan-colonial
  system at the
  [Phoenician colonial network theme](/themes/phoenician-colonial-network).
  Sidon's substantive importance to the Carthaginian religious
  inheritance is primarily through the Eshmun cult; the
  [Eshmun deity entry](/deities/eshmun) treats this continuity.

  Modern Saida preserves substantial Phoenician-period
  archaeology including the Eshmun sanctuary at Bostan esh-Sheikh
  (a Persian-period royal sanctuary, principal source for the
  Eshmun-cult iconography that subsequently appeared in
  Carthaginian contexts). The principal modern reference is
  Aubet's *The Phoenicians and the West* (2nd ed. 2001) for the
  network role and the broader specialist literature on the
  Phoenician homeland.
