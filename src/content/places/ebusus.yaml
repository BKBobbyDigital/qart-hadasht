summary: >
  An island in the western Balearics, settled by Carthaginian
  colonists in the mid-7th century BCE — Diodorus dates the
  foundation to 654/3 BCE, making Ebusus one of the earliest
  Carthaginian colonial foundations attested in the surviving
  record and the first significant Carthaginian foothold in
  the western Mediterranean beyond the immediate African
  zone. The site combined a defensible coastal position with
  excellent salt-flat resources and a strategic location for
  controlling the western Mediterranean shipping lanes
  between Africa, Iberia, and Gaul. Ebusus's archaeological
  record is the clearest surviving documentation of Punic
  material culture in the western Mediterranean: the
  necropolis at Puig des Molins has yielded thousands of
  Punic-style burials, terracotta figurines, and inscribed
  amulets that constitute a substantial part of the surviving
  Carthaginian artifact record. The island remained
  Carthaginian throughout the Punic period and only entered
  Roman administration after 146 BCE.
