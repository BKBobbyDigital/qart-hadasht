summary: >
  The principal Phoenician colony of the western
  Mediterranean — and, on the surviving foundation
  tradition, the oldest. Tyrian colonists founded Gadir on
  what was originally an island just outside the
  southwestern Iberian coast, conventionally dated by
  ancient sources (Velleius Paterculus, Strabo) to c. 1100
  BCE — though archaeological evidence places the
  earliest secure Phoenician presence at the site closer
  to the 8th century BCE. The discrepancy is one of the
  standard chronological problems of western
  Mediterranean Phoenician archaeology.

  Gades's significance for Carthaginian history is
  three-fold:

  1. **The model for western Phoenician colonization.**
     Gadir's foundation predated Carthage's by some
     three centuries on the traditional chronology, and
     the Carthaginian colonization pattern (coastal,
     defensible, harbor-focused) substantially followed
     the Gaditan template. Carthage's foundation in 814
     BCE was a continuation of the Gaditan trajectory
     into the central Mediterranean.
  2. **The terminus of Atlantic trade.** Gades was the
     Phoenician-Punic gateway to the Atlantic: silver
     from the southern Iberian mines, tin from
     Brittany and (probably) Cornwall, ivory and animal
     products from West Africa, all moved through
     Gaditan harbor facilities. The city was the most
     economically consequential single Phoenician
     settlement of the western Mediterranean.
  3. **The Barcid base.** When Hamilcar Barca began the
     Iberian conquest in 237 BCE, Gades was the
     Carthaginian landing point and the operational
     base for the early Iberian campaign. The city's
     long-standing Phoenician identity made it the
     natural staging ground for the Barcid project.

  Gades transferred to Roman alignment in 206 BCE during
  the closing phase of the Second Punic War, accepting a
  treaty that preserved much of its political autonomy.
  The city's commercial importance continued through the
  Roman period — Strabo's report that 500 Gaditans were
  registered at Roman census-equestrian level was
  unprecedented for a single non-Italian city — and
  Gades's Phoenician-Punic religious and cultural
  identity persisted into the early imperial period
  alongside its formal Roman status. The temple of
  Melqart at Gades, identified with Heracles by the
  Greco-Roman tradition, remained one of the most-cited
  religious sites of the western Mediterranean through
  the 1st century CE.
