summary: >
  Carthaginian harbor on the western coast of Sicily, principal
  Carthaginian naval base on the island during the First Punic
  War. Site of the major Carthaginian naval victory over the
  Roman consul Publius Claudius Pulcher in 249 BCE, in which
  the Carthaginian admiral Adherbal destroyed approximately
  93 of Pulcher's 123 ships in tactical conditions favorable
  to the harbor's defending fleet. The defeat ended large-scale
  Roman naval operations in Sicilian waters for the next eight
  years and contributed to the structural conditions that
  produced the private-subscription fleet that won at the
  Aegates Islands in 241 BCE.
