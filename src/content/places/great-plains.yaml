summary: >
  Site of the engagement in spring 203 BCE in which Scipio
  Africanus and Masinissa defeated the combined Carthaginian-
  Numidian army under Hasdrubal Gisco and Syphax. The plain
  lies in the Bagradas (modern Medjerda) river valley,
  approximately 75 km southwest of Carthage. The Roman victory
  produced the capture of Syphax shortly afterward, the
  Sophonisba episode at Cirta, and the strategic conditions
  that forced the Carthaginian recall of Hannibal from Italy
  for the campaign that culminated at Zama later in 202 BCE.
