summary: >
  The principal Phoenician colony in the western Mediterranean,
  founded by settlers from Tyre traditionally dated to 814 BCE
  and destroyed by Rome at the close of the Third Punic War in
  146 BCE. Its Punic name Qart-Hadasht ("New City")
  distinguished it from the older Phoenician settlement of
  Utica to the north and gives this encyclopedia its name. By
  the 4th century BCE Carthage controlled a maritime empire
  encompassing North Africa, Sicily, Sardinia, the Balearics,
  and southern Iberia, and by the 3rd century BCE was one of
  the largest cities of the Mediterranean basin, comparable in
  scale to contemporary Athens and Alexandria.


  ## Geographic setting


  Carthage occupied a peninsula on the Gulf of Tunis on the
  North African coast, a position that combined an excellent
  natural harbor, defensible terrain (the central Byrsa hill
  rising approximately 60 meters above the surrounding plain),
  and command of the central Mediterranean sea-lanes between
  Italy and the African coast. The peninsula was approximately
  3 kilometers long and 1 kilometer wide at its narrowest
  point, with the city's principal harbors on the eastern
  side and its agricultural hinterland extending inland to
  the west and south. The site is at modern coordinates
  approximately 36.85°N, 10.32°E, in the modern Tunis
  governorate of Tunisia, with the ancient archaeological
  site preserved under modern suburban development.


  ## Urban geography


  The Carthaginian city at its peak (4th-3rd centuries BCE)
  was structured around four principal zones.


  **The Byrsa.** The central citadel hill, with the temple of
  Eshmun at its summit and an extensive administrative-
  religious quarter on its slopes. The Byrsa was the
  symbolic and political heart of the city; the Punic name
  *bṣrh* ("fortified place") gave the hill its name (the
  Greek-Latin etymology *byrsa* = "ox-hide," with the
  associated Dido-foundation stratagem, is folk etymology of
  the underlying Punic place-name). The Byrsa's defensive
  walls were substantial; the hilltop's acropolis function
  was structural to the city's defense.


  **The harbors.** The principal commercial harbor was a
  rectangular basin on the eastern coast, with extensive
  warehouses and dock facilities along its perimeter. The
  military harbor — interconnected with the commercial
  harbor by canal — was a distinctive circular basin with
  a central island admiralty building and approximately 220
  docking slots for warships in covered ship-sheds. The
  military harbor's design (preserved in the archaeological
  record and reconstructed extensively in modern scholarship)
  is one of the most distinctive pieces of ancient naval
  infrastructure preserved.


  **The residential quarters.** Modern excavations have
  recovered extensive Carthaginian residential housing,
  particularly on the slopes leading down from the Byrsa to
  the harbors. The houses were typically multi-story (three
  to six floors), built of stone and mud-brick with plastered
  walls, with internal courtyards on the standard
  Mediterranean pattern. Density was high; streets were
  narrow; the urban fabric resembled contemporary Hellenistic
  cities of the eastern Mediterranean more than Roman or
  Italian cities of the period. Population estimates for
  the 3rd century BCE city range from 200,000 to 700,000
  across modern reconstructions.


  **The Tophet.** The sacred precinct in the southern part of
  the city, in continuous use from the late 8th century BCE
  to the city's destruction in 146 BCE for the dedication of
  votive stelae and the burial of cremated infant and animal
  remains. The Tophet is treated separately on this site as
  an institution and as a contested-religious-question theme;
  the precinct itself is one of the principal Carthaginian
  archaeological sites and the source of the largest
  Punic-language inscriptional corpus from any single site.


  Beyond these four principal zones, the city included
  substantial necropoleis (Douïmès, Junon, Sainte-Monique)
  ringing the urban core, agricultural infrastructure
  extending into the hinterland, and the city walls that
  enclosed the entire urban area.


  ## The walls


  The Carthaginian city walls were among the most ambitious
  pieces of urban-defensive infrastructure of the
  Mediterranean ancient world. The principal trace ran
  approximately 33 kilometers around the urban area and the
  defensive approaches; the walls included triple defensive
  lines on the landward (western) side where the peninsula
  joined the African mainland, with elephant stables,
  cavalry barracks, and infantry quarters built into the
  wall's structure. Appian (Pun. 95) preserves a description
  of the walls' triple-line landward defense that modern
  archaeological work has substantially confirmed.


  The walls' scale is partly why the Roman siege of 149-146
  BCE took as long as it did. Even with Carthaginian military
  capacity substantially reduced by the Treaty of 201, the
  defensive infrastructure was sufficient to require
  systematic Roman reduction over multiple campaigning
  seasons rather than rapid storm.


  ## Population and society


  Carthaginian society at its peak was one of the more
  diverse populations of the Mediterranean basin. The
  Carthaginian-citizen elite (the senatorial-aristocratic
  class, the suffeteship eligible families, the Tophet-
  inscription dedicators) was Punic-speaking with Phoenician
  cultural-religious practice; the broader population
  included Libyan-African elements, Greek and Italian
  resident-aliens engaged in commerce, slaves of various
  origins, and a substantial mercenary military population.
  The aggregate scale and the pattern of bicultural
  development (Punic-Greek, Punic-Iberian, Punic-Berber)
  produced a city whose cultural texture is preserved
  imperfectly in the surviving record but was clearly
  substantial.


  ## The destruction (146 BCE)


  The systematic Roman destruction of the city in spring 146
  BCE eliminated Carthage as a continuous urban civilization.
  The buildings were demolished; the surviving population
  (approximately 50,000 by Appian's figure) was enslaved and
  distributed across the Roman world; the site was burned
  for seventeen days; the urban site itself was ploughed over
  to ensure no immediate reoccupation. The territory was
  reorganized as the Roman province of Africa.


  The "salting of the earth" tradition, popular in modern
  accounts, is not attested in any ancient source. It appears
  to have entered the historiographic tradition in 19th-
  century European scholarship and is treated separately on
  this site as an open-question correction to popular
  misconception.


  ## The site after 146 BCE (briefly)


  Roman policy toward the destroyed site was systematically
  obliterative for approximately a century. Augustan-era Roman
  policy reversed the decision: a Roman colony was founded on
  the site in approximately 29 BCE, and Roman Carthage
  developed substantially through the imperial period as one
  of the principal grain-producing centers of the empire.
  The Roman city is structurally distinct from the Punic city
  and is treated as outside the encyclopedia's principal
  Punic-period focus; its archaeological remains overlap with
  and partly cover the Punic strata.


  The site was destroyed again by the Arab conquest of the
  late 7th century CE. The modern archaeological park
  preserves the Punic and Roman strata under partial
  reconstruction; UNESCO World Heritage status was granted in
  1979.


  ## What survives


  Carthaginian archaeology at the site is substantial despite
  the destruction. The principal recovered material:


  - The Tophet precinct and its several thousand inscribed
    Tophet Stelae, the largest Punic-language inscriptional
    corpus, bearing the Sign of Tanit and dedicatory texts
    to Baal Hammon and Tanit across six centuries.
  - The Carthage Cothon — the paired circular military and
    rectangular commercial harbors — preserved at the
    foundation level and still visible in the modern
    archaeological park.
  - Residential housing on the Byrsa slopes, including
    structural detail of multi-story Carthaginian urban
    architecture, and the Carthage Votive Inscription Slab
    corpus from secondary contexts.
  - Necropolis material from the surrounding cemeteries
    including the Punic Anthropoid Sarcophagi (the
    Sarcophagus of the Winged Priestess and related elite-
    burial finds), Punic Glassware, Punic Oil Lamps,
    Phoenician/Punic Grinning Masks, Punic Glass Face Beads,
    and the broader range of jewelry, terracotta figurines,
    and ceramic and metal grave goods.
  - The Carthage Tetradrachm coinage minted on-site through
    the 4th and 3rd centuries BCE, with the iconic Tanit-head /
    horse-and-palm iconography.
  - Fragmentary architectural elements from civic and
    religious buildings (temples, public spaces).


  What survives gives a recognizable Carthaginian
  archaeological identity; what does not survive is most of
  the texture of how the city actually functioned. Recovery of
  Carthaginian material culture has substantially benefited
  from the international UNESCO excavation campaigns of the
  1970s and 1980s and from continuing archaeological work.
