summary: >
  An Iberian town on the upper Baetis (Guadalquivir), counted by ancient
  writers the principal town of the Oretani, and sitting at the edge of
  the Sierra Morena, one of the richest silver and lead mining districts
  of the western Mediterranean. That combination made it one of the
  places the Barcid project in Iberia most needed to hold: the mines
  around it helped pay for the Carthaginian state that Hamilcar,
  Hasdrubal the Fair and Hannibal built between 237 and 218, treated
  under the
  [Barcid Iberian state narrative](/narratives/the-barcid-iberian-state).

  ## Hannibal's in-laws

  Castulo is the only place the historical record connects to Hannibal's
  wife. Livy (24.41) describes the town as so closely bound to Carthage
  that Hannibal had taken his wife from there. He does not name her, and
  he mentions the marriage only to explain the alliance. The name Imilce,
  and a mythic genealogy tracing her family back through the town's
  legendary founders, come from the epic poet
  [Silius Italicus](/sources/silius-italicus-punica), writing about three
  centuries later. The marriage fits the pattern Hasdrubal the Fair had
  set by marrying an Iberian king's daughter: Carthaginian command
  secured by kinship with the families who controlled the country and
  its mines. The evidence, and what is and is not historical in it, is
  set out in the
  [claim on Hannibal's wife](/claims/hannibal-wife-imilce-evidence).

  ## In the war

  The tie did not hold. Livy has Castulo go over to Rome during the
  campaigns of the Scipio brothers, in the same passage that mentions
  the marriage, and after the tide turned in Iberia it surrendered to
  Roman forces in 206 (Livy 28.19–20), handed over by a local leader
  rather than taken by storm. An alliance sealed by a Barcid marriage
  ended as the Barcid position in Spain did, with the Iberian
  communities choosing the side that looked likelier to win, the
  pattern the site reads as agency rather than treachery in its take on
  [Iberian side-switching](/editorialTakes/iberian-side-switching-as-agency-take).
