summary: >
  The principal river of northeastern Iberia and the diplomatic
  boundary established between Carthage and Rome in the Ebro
  Treaty of 226 BCE: Carthaginian operations were restricted to
  the area south of the river, with the territory north
  acknowledged as a Roman sphere of interest. The treaty's
  exact terms — and in particular whether the agreement also
  addressed Saguntum's status as a Roman ally located south of
  the river — became the central diplomatic question of the
  decade leading to the Second Punic War. The river's
  geographic position (it drains the Iberian highlands east
  through the modern Spanish province of Aragon to the
  Mediterranean coast) made it a natural strategic frontier
  for fourth-century Mediterranean diplomacy. Hannibal's
  crossing of the Ebro in spring 218 BCE, after the
  destruction of Saguntum, was the formal Roman pretext for
  declaring war.
