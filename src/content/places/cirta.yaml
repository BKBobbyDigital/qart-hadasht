summary: >
  The royal capital of Numidia, and the clearest single measure of how
  deeply Carthaginian culture had penetrated its African neighbors.
  Cirta stood on a near-impregnable plateau above the gorge of the
  Rhummel, and it was the seat of the Massylii kingdom that
  [Masinissa](/people/masinissa) built into the dominant power of North
  Africa. Even its name is Punic: it comes from qrt, "city", the same
  word behind Qart-Hadasht.

  Cirta was a prize the two Numidian houses fought over. It passed
  between the Massylii and the Masaesyli of [Syphax](/people/syphax),
  and Masinissa's seizure of it in 203 BCE, in the aftermath of the
  [Battle of the Great Plains](/events/battle-of-great-plains), was the
  moment the Numidian war turned his way. It was here, on taking the
  city, that Masinissa found [Sophonisba](/people/sophonisba), Syphax's
  wife and the daughter of [Hasdrubal Gisco](/people/hasdrubal-gisco),
  married her to keep her out of Roman hands, and then, when Scipio
  demanded her as a captive, sent her the poison she drank rather than
  be led in a triumph. The site treats the competing ancient accounts
  of that episode in a
  [source comparison](/sourceComparisons/sophonisbas-death).

  For this encyclopedia Cirta matters most as a center of Punic
  cultural survival beyond Carthage. On the city's edge the sanctuary
  of El Hofra produced one of the great deposits of votive stelae in
  the Punic world, the
  [El Hofra stele cache](/artifacts/hofra-stele-cache): hundreds of
  dedications to Baal Hammon and Tanit, in Punic and neo-Punic script,
  offered by a Numidian population that had taken up Carthaginian gods
  and the Carthaginian habit of writing to them. Cirta is one of the
  reasons the site treats 146 BCE as no hard endpoint for Punic
  identity: under Masinissa and his son Micipsa the city became a large
  royal capital where Punic served as a language of religion and
  administration, and where the forms of Carthage outlived Carthage
  itself.
