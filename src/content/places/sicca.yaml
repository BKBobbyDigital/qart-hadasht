summary: >
  An interior Numidian-Libyan town, well watered, on the route
  between Carthage and the Numidian highlands. In the autumn of
  241 BCE, the Carthaginian government, short of cash to settle
  the back pay of the army Hamilcar Barca had brought home from
  Sicily, ordered the mercenary contingents transferred from
  the city's outskirts to Sicca, on the calculation that
  distance would suppress collective bargaining and allow the
  state to negotiate piecemeal terms. The calculation failed:
  the assembled army at Sicca, no longer subject to the
  immediate authority of any individual commander, instead
  consolidated its grievances and produced the leadership
  (Spendius the Campanian, Mathos the Libyan) that would carry
  the revolt back to the Carthaginian hinterland. Sicca is the
  seedbed of the Mercenary War.
