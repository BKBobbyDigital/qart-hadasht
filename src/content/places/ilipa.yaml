summary: >
  Site of Scipio Africanus's decisive victory over the
  Carthaginian forces in southern Iberia in 206 BCE. The
  battlefield lay near the ancient Iberian-Phoenician town of
  Ilipa on the lower Guadalquivir, north of modern Seville.
  The engagement ended Carthaginian power in the Iberian
  peninsula and produced the strategic conditions for the
  Roman invasion of Africa under Scipio in 204 BCE.
