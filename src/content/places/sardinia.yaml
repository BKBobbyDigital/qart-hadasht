summary: >
  The second-largest island in the Mediterranean and a major
  Carthaginian holding from approximately the 6th century BCE
  until the Roman seizure of 238 BCE. Sardinia's role in this
  encyclopedia runs across two principal axes: its
  Phoenician-Carthaginian colonial history that produced
  one of the earliest and most substantial western
  Mediterranean colonial networks, and the 238 BCE Roman
  seizure that Polybius identified as the deepest structural
  cause of the Second Punic War.


  ## Geography


  Sardinia is approximately 24,000 km², the second-largest
  island of the Mediterranean (after Sicily). The terrain is
  substantially mountainous, with the central Gennargentu
  range rising to approximately 1,800 m and producing
  distinct coastal-versus-interior cultural-economic patterns
  through the pre-Roman period. Coastal access is good on
  the southern and eastern coasts (where the principal
  Phoenician-Punic foundations developed); the northern
  coast is more rugged and was less integrated into the
  Phoenician-Punic colonial network.


  ## The Nuragic civilization


  Pre-Phoenician Sardinia produced one of the more distinctive
  pre-Roman Mediterranean civilizations: the Nuragic culture
  (named after the *nuraghi*, the distinctive stone tower
  structures that the period produced across the island).
  The Nuragic civilization developed from approximately 1800
  BCE through the early Iron Age and produced approximately
  7,000 surviving *nuraghi* across the island.


  Phoenician colonial settlement of Sardinia from the 9th-
  8th centuries BCE produced substantial interaction with the
  Nuragic populations. The colonial-Nuragic relationship was
  not purely conquest: Phoenician colonial settlement
  integrated with Nuragic political-economic structures
  rather than displacing them, with the surviving
  archaeological record showing substantial bicultural
  development through the colonial period.


  ## The Carthaginian period (6th century BCE - 238 BCE)


  Carthaginian political control of the Phoenician Sardinian
  colonial network developed through the 6th century BCE,
  following the broader pattern of Tyrian-Carthaginian
  succession that characterized the western Mediterranean
  Phoenician-Punic transition. The principal Carthaginian
  Sardinian cities:


  - **Tharros** (Phoenician *ṭrs*) on the western coast — one
    of the principal Phoenician-Punic foundations of the
    western Mediterranean, with substantial archaeological
    preservation including a major Tophet and extensive
    necropolis material.

  - **Sulcis** (modern Sant'Antioco) on the southwestern
    coast — substantial Phoenician-Punic harbor and
    administrative center.

  - **Nora** (the principal Phoenician foundation, now
    on the southern coast) — site of the famous Nora Stele,
    one of the earliest Phoenician inscriptions preserved in
    the western Mediterranean, dating to approximately the
    9th century BCE.

  - **Caralis** (modern Cagliari) — major harbor on the
    southern coast that would become the principal Roman
    Sardinian center after 238 BCE.


  Carthaginian Sardinia produced substantial agricultural,
  mining, and commercial wealth: cereal cultivation in the
  southern plains; substantial silver and lead-mining
  operations in the Iglesiente region of the southwest;
  fishing along the coasts. The island's strategic position
  controlling central Mediterranean sea-lanes between Italy
  and the African coast made it militarily as well as
  economically important.


  ## The Roman seizure (238 BCE)


  The Roman seizure of Sardinia in 238 BCE during Carthage's
  distraction by the Mercenary War is treated separately on
  the site as a dedicated event entry. The condensed version:
  Sardinian mercenary garrison revolted during the broader
  mercenary crisis; Rome occupied the island on a
  manufactured pretext claiming Carthaginian "preparation
  for war" against Rome; demanded both formal cession of
  Sardinia and an additional 1,200 talents of indemnity
  beyond the Lutatius treaty's schedule; Carthage,
  militarily incapable of resistance, paid.


  Polybius (3.10, 3.27-28) treats the seizure as the deepest
  structural cause of the Second Punic War. The
  Treaty of Lutatius as ratified in 241 BCE had been a stress
  Carthage bore; the 238 BCE seizure was the Roman act that
  converted a defeated state into a permanently aggrieved
  one. The Barcid Iberian project that began in 237 BCE and
  the broader Barcid anti-Roman direction across the next
  thirty years are properly read as responses to this
  specific Roman conduct rather than to the original peace
  settlement.


  ## Roman Sardinia


  Roman Sardinia from 238 BCE onward functioned as a
  substantial provincial holding, producing grain for Roman
  consumption (with Sardinian agriculture supplementing the
  Sicilian grain that fed Rome through the late Republican
  period). The Carthaginian-Punic cultural and linguistic
  presence persisted under Roman rule for substantial
  centuries; Punic inscriptions from Sardinian sites
  continue to be preserved through the early imperial
  period, indicating substantial bilingual-cultural
  continuity.


  The principal Sardinian artifacts that bear on the
  Carthaginian-period sphere include the Nora Stone (the
  late-9th or early-8th century BCE Phoenician inscription
  from southern Sardinia, the earliest Phoenician text
  outside the Levant), the Tharros Tophet Stele (a
  representative example of the Sardinian Tophet tradition),
  and the Tharros Gold Earrings (Phoenician-colonial luxury
  jewelry with characteristic granulation, from the elite
  burial necropolis at Tharros). The Sardinian Tophet sites
  together — Tharros, Sulci/Sant'Antioco, Monte Sirai, Bithia
  — constitute one of the principal diaspora corpora for
  Punic religious practice outside Carthage itself.


  ## Sources


  Sardinia is preserved through the substantial archaeological
  record of the Phoenician-Punic colonial sites (especially
  Nora, Tharros, Sulcis), the inscriptional record (the Nora
  Stele and the broader Punic-Sardinian corpus), and the
  Greek and Roman literary references (Polybius for the
  238 BCE seizure; Diodorus and others for scattered
  Carthaginian-period detail). Modern scholarship is in
  Aubet's *The Phoenicians and the West* and the substantial
  specialist literature on Sardinian archaeology.
