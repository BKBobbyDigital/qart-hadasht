summary: >
  The second-largest island in the Mediterranean and a major
  Carthaginian holding from approximately the 6th century BCE
  until the Roman seizure of 238 BCE. The principal Carthaginian
  cities of the island included Tharros, Sulcis, Caralis (modern
  Cagliari), and Nora. Carthaginian Sardinia produced silver,
  grain, and other commodities and served as a strategic position
  controlling the central Mediterranean sea-lanes between Italy
  and the African coast. The Roman seizure of 238 BCE, on a
  manufactured pretext during Carthage's distraction by the
  Mercenary War, was treated by Polybius (3.10, 3.27-28) as the
  deepest structural cause of the Second Punic War. Under Roman
  rule from 238 BCE onward, Sardinia became part of the Roman
  province of Sardinia and Corsica.
