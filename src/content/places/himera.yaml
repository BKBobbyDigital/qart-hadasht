summary: >
  Greek city on the north coast of Sicily, founded as a colony of
  Zancle (later Messana) in approximately 648 BCE. Himera occupied a
  strategically important position controlling the coastal route
  between Greek eastern Sicily and Carthaginian-influenced western
  Sicily, and was repeatedly contested in the long Greco-Carthaginian
  wars. Site of the major Greek-Sicilian victory over the
  Carthaginian invasion of 480 BCE under Gelon of Syracuse and
  Theron of Akragas, paired within a decade by its Syracusan victors
  with the Athenian victory at Salamis. Sacked and destroyed in 409
  BCE during the Carthaginian invasion of Sicily under another
  Hannibal son of Gisco (the campaign that revenged the 480 defeat
  two generations later). Carthage founded the new city of Therma
  nearby in 407 BCE, settling it with its own citizens and Libyans
  (Diodorus 13.79).
  Modern excavations since the 1960s have produced the major
  archaeological evidence for the 480 BCE engagement, including
  mass burials of the Greek dead.
