modern_location: >
  Near the village of Utique, Bizerte Governorate, Tunisia, about
  35 km northwest of Tunis. The ancient port now sits roughly 10 km
  inland: the Bagradas (Medjerda) delta silted the harbor over the
  Roman and later periods.
