  notes: >
    Traditional date from Pliny (Natural History 16.216), who placed
    Utica's foundation 287 years before Carthage. Like other very
    early Phoenician-foundation dates in the west it outruns the
    archaeology, whose earliest secure strata at the site are
    8th-century BCE; the tradition of great antiquity is nonetheless
    embedded in the name itself.
