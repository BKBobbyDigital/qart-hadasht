summary: >
  The second city of Punic North Africa after Carthage itself, on
  the central Sahel coast about 140 km south of the metropolis.
  Tradition put its foundation by Tyre in the 9th century BCE — older
  than Carthage in the Phoenician-foundation chronology, though the
  archaeological evidence for the earliest phases is thin enough that
  modern scholars are appropriately cautious. By the 5th century
  Hadrumetum was firmly within the Carthaginian political and
  economic system, and it functioned as the principal commercial
  port of the Byzacium region — the agricultural hinterland that
  fed the Carthaginian core through the late Punic period.

  Hadrumetum's strategic value rose steeply in the Punic Wars.
  In 203 BCE, after the Battle of the Great Plains, Hannibal
  withdrew from Italy to Hadrumetum and made it his staging
  base for the Zama campaign — the city served as the Carthaginian
  army's depot, mustering ground, and supply hub through the
  weeks before Zama. After the Carthaginian defeat the city
  remained under nominal Carthaginian sovereignty under the
  Treaty of 201, though its strategic position now sat behind
  Masinissa's expanding Numidian frontier rather than facing it.

  In the Third Punic War Hadrumetum took a course distinct from
  Carthage's: with Utica, Lepcis, and several other Punic cities
  it surrendered to Rome at the war's outset rather than join in
  the resistance, and was rewarded with the status of *civitas
  libera*, a free city retaining its institutions, in the Roman
  provincial settlement that followed 146 BCE. The defection saved
  the city from Carthage's fate and preserved a substantial
  continuity of Punic urban life under Roman administration: the
  Sahel sites continue to produce Punic and neopunic inscriptions,
  Tanit-Baal Hammon stelae, and the architectural-administrative
  signatures of Punic civic culture into the early imperial
  period.

  Modern Sousse sits directly atop the ancient city; the
  archaeological evidence is partial as a result, but the Punic
  necropolis at Hadrumetum (discovered in the 19th century) and
  the city's Tophet (one of the better-preserved outside Carthage)
  remain among the principal evidentiary deposits for Punic
  religious practice in the central Mediterranean.
