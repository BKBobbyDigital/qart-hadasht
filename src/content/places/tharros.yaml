summary: >
  Phoenician colonial foundation on a narrow peninsula projecting
  into the Gulf of Oristano on the western Sardinian coast,
  established in approximately the mid-8th century BCE alongside
  [Sulci](/places/sulci) as one of the principal Phoenician
  installations in the western Mediterranean network. Tharros
  developed as a major Punic commercial and religious center
  under Carthaginian hegemony and continued as a substantial
  Roman provincial center before its abandonment in the early
  medieval period.


  ## Geography and foundation

  The Tharros site occupies the Capo San Marco peninsula, a
  narrow coastal projection that gave the early Phoenician
  installation a defensible position with sheltered anchorages
  on both sides: the open Gulf of Oristano on the south and
  the Mistras lagoon on the north. The position is structurally
  similar to other Phoenician colonial foundations
  ([Carthage](/places/carthage), [Motya](/places/motya),
  [Gades](/places/gades)) which favored defensible peninsulas or
  offshore islands.


  ## Material culture

  Tharros is one of the most archaeologically productive Punic
  sites in the western Mediterranean. The site has yielded
  thousands of objects of Punic material culture: gold jewelry
  (the Tharros gold earrings corpus is one of the finest
  preserved Punic-period jewelry collections anywhere; treated
  as an artifact on the site), scarabs, votive figurines,
  ceramic vessels, glass face beads, anthropoid sarcophagi.
  Much of the recovered material now sits in the
  British Museum's Sardinian collection
  and the National Archaeological Museum of Cagliari. The
  [Tharros Tophet stele](/artifacts/tharros-tophet-stele) corpus
  documents the Sardinian-diaspora's distinct Tophet
  iconographic conventions alongside the larger Carthage and
  [Sulci](/places/sulci) corpora.


  ## Continuity into Roman Africa

  Tharros continued as a substantial Roman commercial center
  through the imperial period before declining and being
  abandoned in the early medieval period, likely in the 11th
  century CE under coastal-piracy pressure. The site was never
  overbuilt by a modern town, which is why its archaeology is
  so well-preserved. The
  [continuity in Roman Africa narrative](/narratives/punic-continuity-in-roman-africa)
  treats the broader pattern of Punic-cultural continuity that
  Tharros's archaeology helps document.


  ## Sources

  Principal modern reference is the Italian archaeological
  literature on Tharros (Acquaro's excavation publications;
  the broader Krings *Manuel de recherche* 1995 Sardinia chapters);
  for the Phoenician colonial context, Aubet 2001.
