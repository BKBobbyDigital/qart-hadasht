summary: >
  The principal Greek city of southern-central Sicily through
  the 6th and 5th centuries BCE, founded c. 580 BCE as a
  Doric colony from Gela. Akragas's wealth was proverbial in
  the Greek world: Pindar called the city "fairest of mortal
  cities" and the so-called Valley of the Temples preserves
  more substantial 5th-century Greek monumental architecture
  than any other surviving site in Sicily. The Temple of
  Olympian Zeus (begun c. 480 BCE in the wake of the Greek
  Sicilian victory at Himera, never completed) was among the
  largest temple structures in the entire Greek world.

  The 406-405 BCE Carthaginian siege under Hannibal son of
  Gisco and (after Hannibal's death from plague) Himilco
  ended with the city's evacuation. The remaining population
  abandoned Akragas under cover of darkness in late 406; the
  Carthaginians sacked the empty city the following day. The
  evacuation and sack are preserved at length in Diodorus
  (13.86-89). Akragas was substantially depopulated for the
  next century, with Greek resettlement only resuming under
  Timoleon in the 330s BCE. The city's wealth at the moment
  of its fall (bronze and silver vessels, paintings,
  monumental sculpture) passed substantially into
  Carthaginian hands and is part of the explanation for the
  Carthaginian capacity to fund the subsequent decades of
  Sicilian campaigning.
