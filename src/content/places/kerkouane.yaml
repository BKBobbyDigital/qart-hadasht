current_status: >
  UNESCO archaeological site on Cap Bon (modern Tunisia); abandoned
  during the First Punic War and never rebuilt, preserving substantial
  Punic domestic architecture unobscured by Roman overlay
summary: >
  A Punic city on the eastern Cap Bon peninsula, abandoned
  in the mid-3rd century BCE during the First Punic War and
  never resettled — making it the single best-preserved
  archaeological example of a Punic city anywhere in the
  ancient Mediterranean. Where every other major
  Carthaginian-period site is either substantially destroyed
  (Carthage itself, sacked twice and rebuilt by Rome and
  the Vandals), partly Romanized (Lepcis Magna, Hadrumetum,
  Utica), or under modern occupation (Tunis, Tarragona),
  Kerkouane preserves a Punic urban fabric without later
  Roman or post-Roman overlay.

  The site's surviving features are extraordinarily detailed
  for a Carthaginian-period site:

  - **The street grid.** A regular orthogonal pattern,
    evidence for Punic urban planning practices that the
    surviving literary record does not preserve.
  - **Houses.** More than 100 individual residential
    structures excavated, most with the standard Punic
    "courtyard house" plan, complete with bathrooms,
    domestic shrines, and decorative mosaics including
    the sign of Tanit.
  - **Workshops.** Evidence for textile production, fish
    salting, and other small-scale industries — the
    economic substrate that the literary sources do not
    describe.
  - **Sanctuaries.** Multiple small religious structures
    distributed across the city rather than concentrated
    in a single precinct, suggesting decentralized cultic
    practice that complements what the Carthage record
    preserves at the Tophet.

  Kerkouane was probably abandoned in 256 BCE during the
  Roman invasion of Africa under Regulus; the surviving
  inhabitants apparently fled to other Punic settlements
  and never returned. Roman administrative attention to
  the site after 146 BCE was minimal, the location offered
  no strategic value once the Punic political configuration
  it had served was destroyed, and the abandoned site
  preserved its Punic-period character into modern
  excavation.

  The site is the closest thing modern scholarship has to a
  preserved Carthaginian city. What we know about Punic
  domestic architecture, household religious practice, and
  small-scale urban economy comes substantially from
  Kerkouane.
