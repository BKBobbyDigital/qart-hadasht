summary: >
  Site of the preliminary cavalry engagement between Hannibal's
  Numidian and Iberian horsemen and the consul Publius Cornelius
  Scipio's Roman cavalry in late November 218 BCE, days after
  Hannibal had descended from the Alps into the Po Valley. The
  engagement is best known for the wounding of the elder Scipio
  and his rescue, in the traditional account, by his teenage
  son the future Scipio Africanus.
