summary: >
  A Greek (Rhodian-Cretan) colony on the south-central
  Sicilian coast, founded 688 BCE. Gela was the parent city
  of Akragas (founded from Gela c. 580 BCE) and one of the
  principal Greek-Sicilian polities through the 6th and 5th
  centuries. The tyrant Gelon — son of one of Gela's leading
  families — moved his political base to Syracuse in the 480s
  BCE, leading the combined Greek-Sicilian forces at the
  victory of Himera in 480.

  Gela's defining moment in the surviving record is its
  destruction in 405 BCE by Himilco's Carthaginian army,
  fresh from the sack of Akragas the previous year. The
  attempted Greek relief under Dionysius — newly elevated to
  command at Syracuse — failed; Dionysius evacuated the
  surviving Geloan population to Syracuse and ceded the
  ruined city to Himilco. The 405 evacuation is one of the
  episodes Diodorus uses to explain Dionysius's subsequent
  political consolidation: a defeated relief commander who
  nevertheless emerges as Syracuse's tyrant by managing the
  refugee crisis. Gela was rebuilt by Greek settlers in 338
  BCE under Timoleon's broader resettlement programme but
  never recovered its 5th-century scale.
