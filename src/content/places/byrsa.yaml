summary: >
  The fortified hill at the center of Carthage that served as the
  city's acropolis and its sacred and administrative core throughout
  the Punic period. Roughly 60 m above sea level and commanding
  the Carthage peninsula, Byrsa held the principal civic temples —
  most importantly the great temple of Eshmun, the Carthaginian
  god of healing and one of the principal deities of the late
  Punic civic pantheon — along with administrative buildings,
  elite residential quarters, and the city's last-resort defensive
  position in time of siege.

  The name's etymology is one of the more famous philological
  knots in Carthaginian studies. Greek tradition, following the
  Dido foundation legend, took *Byrsa* as transparent Greek for
  "ox-hide" — a reading that fit neatly with the legendary tale
  in which the queen, granted only as much land as could be
  enclosed by an ox-hide, ordered the hide cut into thin strips
  and used the resulting cord to encircle the entire hill.
  The actual Punic etymology is most likely from a Semitic root
  meaning "fortress" or "fortified place" (*bsr* / *bosra*); the
  Greek "ox-hide" reading is folk etymology that the foundation
  legend then rationalized. The two readings tell us more about
  Greek-speaking attitudes to Punic toponymy than about the name's
  origin.

  Byrsa was the heart of Carthage's defenses and the focus of the
  six-day final battle of the siege of 146 BCE. After Roman forces
  under Scipio Aemilianus broke into the city through the harbor
  walls, Carthaginian resistance contracted to the Byrsa citadel,
  where a sustained street-by-street fight lasted six days before
  the surviving Carthaginian leadership and the bulk of the civilian
  population came down from the hill to surrender. Hasdrubal the
  Boetharch, the Carthaginian commander, surrendered at the temple
  of Eshmun on Byrsa itself; his wife and children, refusing to
  accept his capitulation, set fire to the temple and died in
  the flames in one of the most-cited symbolic episodes of the
  destruction.

  The Roman demolition was thorough: Byrsa's Punic-period
  structures were systematically dismantled, and the hill was
  flattened and reterraced for the imperial-period Roman
  Carthage that rose on the same site under Augustus and his
  successors. The Punic-period archaeological deposits at Byrsa
  survive principally in the bedrock cuttings, foundation
  trenches, and a small number of structures preserved beneath
  later Roman construction — including a remarkable Punic
  residential quarter (the "Hannibal Quarter") preserved by the
  Roman terracing fill and excavated since the 1970s by French
  archaeologists. The Byrsa stratigraphy is one of the principal
  archaeological windows into late-Punic urban life at Carthage
  itself.
