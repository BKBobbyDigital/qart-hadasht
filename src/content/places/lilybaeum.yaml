  notes: >
    Founded after the destruction of [Motya](/places/motya) by
    [Dionysius I](/people/dionysius-i) in 397. The surviving
    Motyan population was relocated to the new site on the
    western Sicilian tip, where the defensive geography of the
    peninsula and the deep-water harborage offered a more
    defensible Carthaginian center than the offshore island
    Motya had been.
