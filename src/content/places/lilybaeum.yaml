summary: >
  Principal Carthaginian city of western Sicily across the fourth
  and third centuries BCE, founded in 396 after the destruction
  of [Motya](/places/motya) and developed across the period into
  one of the major urban centers of the western Mediterranean.
  Lilybaeum's monumental walls (substantial sections of which
  survive) and its deep-water harbor made it the principal
  Carthaginian Sicilian stronghold; the Roman siege of 250–241
  during the [First Punic War](/events/first-punic-war) could
  not reduce the city by storm or sustained operations, and
  Lilybaeum was surrendered under the
  [Treaty of Lutatius](/events/treaty-of-lutatius) rather than
  captured. The Punic name *Rʾš Mlqrt* ("Head of Melqart"),
  preserved in the inscriptional record, marks the city's
  dedication to the Tyrian patron deity and its position as the
  principal Punic Sicilian sanctuary of Melqart. Under Roman
  administration after 241, Lilybaeum became one of the major
  cities of Roman Sicily and the seat of one of the two
  Sicilian *quaestores*; the Punic linguistic and religious
  signature persisted in inscriptions and cultic continuity
  across the Roman Republican and early imperial periods.
