summary: >
  The principal river of the Carthaginian hinterland, draining
  the Atlas highlands eastward through the Tunisian plain to the
  Mediterranean north of Carthage. The Bagradas valley was the
  Carthaginian agricultural heartland: irrigated grain, olives,
  and orchards on alluvium, with rural estates of the
  Carthaginian elite worked by Libyan tenant cultivators and
  agricultural slaves. The valley was the principal theater of
  the Mercenary War (240–237 BCE), where Hamilcar Barca's
  recovery began with his maneuver across the river to break
  the rebel siege concentration in 240 BCE. In the Second Punic
  War the valley was again strategic: Regulus had operated here
  in 256–255 BCE during the First Punic War, and Scipio's 204–
  202 BCE campaign moved across the same terrain to the Battle
  of the Great Plains and ultimately to Zama.
