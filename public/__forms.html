<!--
  Netlify Forms detection stub.

  Netlify's deploy-time form parser sometimes misses forms inside HTML
  generated by static-site frameworks (Astro, Next.js, Gatsby, etc.).
  The reliable fix is to include a plain-HTML stub of every form the
  site uses at /__forms.html — Netlify always picks up form
  definitions from this file regardless of the rest of the build.

  This file is never linked from the site and shouldn't be visited by
  users; it exists purely so Netlify's deploy parser sees the form
  schemas (field names, honeypot config) it needs to register.

  The actual visible form on /about does the real work; this stub just
  guarantees Netlify knows about the form's name and field structure
  so it can route submissions correctly.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Forms detection</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="title" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
