<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sign of Tanit">
  <rect width="64" height="64" rx="8" fill="#5b0f31"/>
  <!-- Tanit figure: triangle body, arms bar, circle head. Sized to fill
       about 70% of the canvas so it reads at favicon resolutions. -->
  <g fill="#f4f0e6">
    <!-- Body triangle (legs/dress) -->
    <path d="M32 28 L18 56 L46 56 Z" />
    <!-- Arms bar -->
    <rect x="10" y="22.5" width="44" height="4.5" rx="1" />
    <!-- Head circle -->
    <circle cx="32" cy="14" r="6" />
  </g>
</svg>
